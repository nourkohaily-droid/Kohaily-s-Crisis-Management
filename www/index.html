ncorrectly set.","l":0},{"t":"After changing components of the anesthesia breathing circuit.","l":0},{"t":"After service of the anesthesia workstation.","l":0},{"t":"When the user is unfamiliar with the anesthesia workstation or ventilator controls.","l":0},{"t":"In patients with severe lung disease and low lung compliance.","l":0},{"t":"During interruptions of electrical power or O<sub>2<\/sub> supply:","l":0},{"t":"Severe weather.","l":1},{"t":"Earthquake.","l":1}],"prevention":[{"t":"Change patient position carefully.","l":0},{"t":"Provide appropriate routine maintenance for the anesthesia workstation and ventilator.","l":0},{"t":"Train personnel in correct assembly and use of ventilator.","l":0},{"t":"Conduct a thorough preoperative check of the anesthesia workstation and ventilator:","l":0},{"t":"Place a breathing bag on the end of the Y piece and use it as a “test lung” for the ventilator.","l":1},{"t":"Ensure that the ventilator power is turned on and that the bag/ventilator selector valve is set properly.","l":0}],"manifestations":[{"t":"Ventilator bellows moves inadequately or sticks in a tilted position.","l":0},{"t":"Ventilator fails to cycle, bellows does not move at all.","l":0},{"t":"Abnormal sound of the ventilator during inspiration.","l":0},{"t":"Ventilator alarm sounds, e.g. “unable to drive bellows” alarm.","l":0},{"t":"If a piston ventilator, piston moves normally but lungs are not ventilated.","l":0},{"t":"Signs of hypoventilation of the patient:","l":0},{"t":"Decreased or absent chest movement on inspiration.","l":1},{"t":"Little or no ET CO<sub>2<\/sub> present on capnograph waveform.","l":1},{"t":"Low or zero tidal volume measured by spirometry.","l":1},{"t":"<b>Apnea<\/b> alarm may sound.","l":1},{"t":"Low pressure alarm may sound.","l":1},{"t":"As PaCO<sub>2<\/sub> rises, the patient may make respiratory efforts if not fully paralyzed.","l":1},{"t":"<b>Hypoxemia<\/b>.","l":1},{"t":"Reduced or absent breath sounds.","l":1},{"t":"If there has been a loss of electrical power, other devices may lose power or OR lights may go out:","l":0},{"t":"Ventilator may work if battery backup is functional.","l":1},{"t":"If the main O<sub>2<\/sub> supply to the OR fails, the bobbins will fall to the bottom of the flowmeters and a low O<sub>2<\/sub> pressure alarm will sound.","l":0}],"similar":[{"t":"Ventilator never turned on.","l":0},{"t":"Breathing circuit bag/ventilator selector switch set incorrectly.","l":0},{"t":"Pop-off valve failure (see Event 70, Pop-Off Valve Failure).","l":0},{"t":"Major leak from the anesthesia circuit (see Event 69, Major Leak in the Anesthesia Breathing Circuit).","l":0},{"t":"WAGD system malfunction (see Event 73, Waste Anesthesia Gas Disposal System Malfunction).","l":0},{"t":"Inspiratory valve stuck closed (see Event 60, Circle System Inspiratory Valve Stuck Closed).","l":0},{"t":"Obstruction of the inspiratory tubing of the anesthesia circuit or the ETT.","l":0}],"management":[{"t":"Attempt to manually ventilate the patient using the bag on the anesthesia breathing circuit:","l":0},{"t":"Switch to manual ventilation using the reservoir bag on the anesthesia workstation.","l":1},{"t":"Activate the O<sub>2<\/sub> flush device to fill the reservoir bag.","l":1},{"t":"If able to ventilate, continue manual ventilation.","l":1},{"t":"Call for help to identify the problem in the ventilator and to assist you in caring for the patient.","l":1},{"t":"Prepare to use alternative ventilation system.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Self-inflating bag.","l":3},{"t":"Nonrebreathing circuit.","l":3},{"t":"If unable to fill the anesthesia breathing circuit using the O<sub>2<\/sub> flush:","l":0},{"t":"Visually check for a major circuit disconnection, checking the ETT, Y piece, hoses, and reservoir bag.","l":1},{"t":"Ensure that the bag/ventilator selector switch is set to BAG for manual ventilation.","l":1},{"t":"If there is no disconnect and bag/selector switch is in BAG position:","l":1},{"t":"Ventilate the patient using a self-inflating bag, nonrebreathing circuit, or mouth-to-ETT.","l":2},{"t":"Check the flowmeters and pipeline O<sub>2<\/sub> pressure gauge.","l":1},{"t":"Switch to O<sub>2<\/sub> cylinders if the external O<sub>2<\/sub> supply has failed (see Event 68, Loss of Pipeline Oxygen).","l":1},{"t":"If the anesthesia breathing circuit and bag fill but the patient cannot be ventilated manually:","l":0},{"t":"Check again that bag/ventilator selector switch is in BAG position.","l":1},{"t":"Ventilate the patient using an alternative ventilation system (self-inflating bag, nonrebreathing circuit, or mouth-to-ETT).","l":1},{"t":"Check the inspiratory limb of the anesthesia breathing circuit for obstruction.","l":1},{"t":"If unable to ventilate with alternative ventilation system:","l":0},{"t":"Check for kinked ETT, bronchospasm, endobronchial intubation, pneumothorax (see Event 29, Bronchospasm, Event 30, Endobronchial Intubation, and Event 35, Pneumothorax).","l":1},{"t":"Once you have established adequate ventilation:","l":0},{"t":"Maintain anesthesia with IV agents, if necessary.","l":1},{"t":"Assign your help to diagnose and correct the problem:","l":0},{"t":"Check the circuit hoses, bag/ventilator selector switch, and the ventilator ON switch again.","l":1},{"t":"Find and correct the fault in the ventilator.","l":1},{"t":"Problem may require replacing the anesthesia workstation.","l":1},{"t":"In the event of an electrical power failure, the emergency power system should automatically activate:","l":0},{"t":"The emergency power generator may fail or may itself be damaged by an event that cuts the main power supply (see Event 64, Electrical Power Failure).","l":1},{"t":"Make sure that the ventilator is plugged into an emergency power outlet.","l":1},{"t":"Battery backup function is limited in time, so plan for alternative means of ventilation:","l":1},{"t":"If electrical power cannot be restored quickly, obtain a pneumatically controlled ventilator.","l":2}],"complications":[{"t":"Hypoxemia:","l":0},{"t":"Hypercarbia.","l":1},{"t":"Cardiac arrest.","l":1}],"reading":[{"t":"1. Modak RK, Olympio MA. Anesthesia ventilators. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 148-78."},{"t":"2. Ortega RA, Zambricki ER. Fresh gas decoupling valve failure precludes mechanical ventilation in a Draeger Fabius GS anesthesia machine. Anesth Analg 2007;104:1000-1."},{"t":"3. Hilton G, Moll V, Zumaran AA, Jaffe RA, Brock-Utne JG. Failure to ventilate with the Dräger Apollo® Anesthesia Workstation. Anesthesiology 2011;114:1238-40."},{"t":"4. Schulte TE, Tinker JH. Narkomed 6400 anesthesia machine failure. Anesth Analg 2008;106:1018-9."}]}},{"id":72,"title":"Volatile Anesthetic Overdose","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"A volatile anesthetic overdose is either an absolute or a relative excess inspired anesthetic concentration:","l":0},{"t":"<i>Absolute overdose: <\/i>delivered concentration of volatile anesthetic substantially greater than that intended.","l":1},{"t":"<i>Relative overdose: <\/i>intended concentration of volatile anesthetic that causes hemodynamic and/or respiratory compromise.","l":1}],"etiology":[{"t":"Error in setting the anesthetic vaporizer to desired concentration.","l":0},{"t":"Vaporizer accidentally left on after a previous case.","l":0},{"t":"Failure to decrease a high concentration of volatile anesthetic used for induction or deepening of anesthesia.","l":0},{"t":"Malfunction of the anesthetic vaporizer.","l":0},{"t":"Vaporizer filled with the wrong agent.","l":0},{"t":"Failure of vaporizer interlock device:","l":0},{"t":"Allowing two vaporizers to be on at the same time.","l":1},{"t":"Vaporizer has been tilted, causing liquid anesthetic to enter the bypass portion of the vaporizer or the anesthesia workstation piping.","l":0},{"t":"Faulty delivery from anesthesia workstation, e.g. electronic failure on new anesthesia workstations.","l":0}],"typical":[{"t":"When rapidly changing depth of anesthesia by turning on high concentration of volatile anesthetic:","l":0},{"t":"High fresh gas flow and mechanical ventilation will result in rapid equilibration of volatile anesthetic in the anesthesia breathing circuit and the patient.","l":1},{"t":"After conducting an inhalation induction with a volatile anesthetic.","l":0},{"t":"In patients who have preexisting cardiovascular or pulmonary compromise.","l":0},{"t":"When a vaporizer has just been installed on the anesthesia workstation.","l":0}],"prevention":[{"t":"Ensure vaporizers are checked regularly during preventive maintenance.","l":0},{"t":"Use a respiratory gas analyzer (including volatile anesthetics):","l":0},{"t":"Set volatile anesthetic high alarm limits appropriately.","l":1},{"t":"Use care when administering high concentrations of volatile anesthetic:","l":0},{"t":"Ensure that the concentration is decreased as necessary.","l":1},{"t":"Maintain vaporizers in the upright position at all times.","l":0},{"t":"Follow manufacturer’s recommended filling procedures for vaporizer.","l":0},{"t":"Ensure that vaporizer is off during filling.","l":0},{"t":"Use agent-specific filling devices to prevent filling with incorrect agent.","l":0},{"t":"<b>Do not<\/b> overfill vaporizer.","l":0},{"t":"Use a processed EEG monitor of anesthetic depth and set alarm limits to alert to a possible anesthetic overdose.","l":0},{"t":"<b>Never<\/b> connect a freestanding vaporizer between the machine common gas outlet and the breathing circuit.","l":0}],"manifestations":[{"t":"<i>Volatile anesthetic overdose should be included in the differential diagnosis of any unexpected <b>hypotension<\/b> or <b>bradycardia<\/b> during anesthesia.<\/i>","l":0},{"t":"If the vaporizer is accidentally left on from a previous case:","l":0},{"t":"The patient may complain of the odor during preoxygenation.","l":1},{"t":"The patient may become unresponsive during preoxygenation.","l":1},{"t":"A high concentration of volatile anesthetic may be detected by a respiratory gas analyzer.","l":0},{"t":"Respiratory depression or <b>apnea<\/b> in the spontaneously ventilating patient.","l":0},{"t":"Increased anesthetic depth as measured by processed EEG.","l":0},{"t":"<b>Hypotension<\/b>.","l":0},{"t":"<b>Bradycardia<\/b>.","l":0},{"t":"Ventricular <b>arrhythmias<\/b>.","l":0},{"t":"PEA.","l":0},{"t":"Failure to breathe or to awaken at the end of the anesthesia.","l":0}],"similar":[{"t":"Hypotension and cardiovascular collapse from other causes (see Event 9, Hypotension).","l":0},{"t":"Respiratory depression or apnea from other causes (see Event 56, Postoperative Failure to Breathe).","l":0},{"t":"Overdose of IV medication(s) (see Event 63, Drug Administration Error).","l":0},{"t":"Cardiac Arrest (see Event 2, Cardiac Arrest).","l":0}],"management":[{"t":"Confirm a volatile anesthetic overdose:","l":0},{"t":"Check the vaporizer and flowmeter settings.","l":1},{"t":"Check the respiratory gas analyzer to determine whether volatile anesthetic concentrations measured in the anesthesia breathing circuit are appropriate.","l":1},{"t":"Turn off all volatile anesthetic vaporizers.","l":0},{"t":"Ensure adequate oxygenation and ventilation.","l":0},{"t":"Increase the FiO<sub>2<\/sub> to <b>100%<\/b> with a high flow rate of O<sub>2<\/sub> into the anesthesia breathing circuit.","l":0},{"t":"Purge volatile anesthetic from the breathing circuit into the waste gas scavenging system by activating the O<sub>2<\/sub> flush between breaths:","l":0},{"t":"Confirm that the concentration of volatile anesthetic in the anesthesia breathing circuit has decreased.","l":1},{"t":"If the anesthetic concentration does not decrease, ventilate with an alternative ventilation system (e.g. self-inflating bag or nonrebreathing circuit):","l":1},{"t":"There may be an internal fault in the anesthesia workstation or vaporizer.","l":2},{"t":"Check vital signs frequently (rule out PEA):","l":0},{"t":"BP.","l":1},{"t":"Palpate the peripheral pulses.","l":1},{"t":"Pulse oximetry.","l":1},{"t":"Auscultate the heart sounds.","l":1},{"t":"<b>Support the circulation:<\/b>","l":0},{"t":"Bolus IV fluids.","l":1},{"t":"Administer vasopressors (see Event 9, Hypotension).","l":1},{"t":"Administer vagolytic if indicated (see Event 22, Sinus Bradycardia).","l":1},{"t":"Call for help if there is severe hemodynamic compromise.","l":1},{"t":"If cardiac arrest occurs, follow ACLS guidelines (see Event 2, Cardiac Arrest).","l":1},{"t":"Arrhythmias may occur when using catecholamines in the setting of a volatile anesthetic overdose.","l":1},{"t":"Terminate the surgery <b>as soon as possible<\/b> if there has been profound hypotension or cardiac arrest.","l":0},{"t":"Sequester the anesthesia machine if there is any possibility of misfilling or malfunction of the vaporizer or of a fault in the anesthesia workstation.","l":0}],"complications":[{"t":"Respiratory arrest.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Eisenkraft JB. Anesthesia vaporizers. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 64-94."},{"t":"2. Eisenkraft JB. Hazards of the anesthesia delivery system. In: Ehrenwerth J, Eisenkraft JB, Berry J, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 607-11."},{"t":"3. Geffroy JC, Gentili ME, Le Pollès R, Triclot P. Massive inhalation of desflurane due to vaporizer dysfunction. Anesthesiology 2005;103:1096-8."},{"t":"4. Sinclair A, van Bergen J. Vaporizer overfilling. Can J Anaesth 1993;40:77-8."},{"t":"5. Mehta SP, Eisenkraft JB, Posner KL, Domino KB. Patient injuries from anesthesia gas delivery equipment: a closed claims update. Anesthesiology 2013;119:788-95."},{"t":"6. Adler AC, Connelly NR, Ankam A, Raghunathan K. Technical communication: inhaled anesthetic agent-vaporizer mismatch: management in settings with limited resources: don't try this at home. Anesth Analg 2013;116:1272-5."}]}},{"id":73,"title":"Waste Anesthesia Gas Disposal System Malfunction","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"The waste anesthesia gas disposal (WAGD) system malfunctions.","l":0}],"etiology":[{"t":"Internal obstruction or external compression of the WAGD system hose.","l":0},{"t":"Mechanical failure of components of the WAGD system.","l":0},{"t":"Incorrect assembly or operation of the WAGD system.","l":0},{"t":"Lack of adequate vacuum pressure.","l":0}],"typical":[{"t":"Operator error.","l":0},{"t":"When the anesthesia workstation or other equipment is rolled over WAGD system hoses lying on the OR floor.","l":0},{"t":"Following service of the WAGD system or the anesthesia workstation.","l":0},{"t":"Failure to connect the evacuation hose to the WAGD system outlet.","l":0},{"t":"Failure to cap unused ports on the WAGD system interface block.","l":0}],"prevention":[{"t":"Use of a WAGD system that incorporates safety devices:","l":0},{"t":"Positive and negative pressure relief mechanisms in closed active WAGD interface design.","l":1},{"t":"Ports open to atmosphere in open active WAGD system design.","l":1},{"t":"In-line breathing circuit pressure gauges and alarms to indicate and warn of excessive positive or negative pressure.","l":1},{"t":"<b>Do not<\/b> allow untrained users to alter WAGD system settings.","l":0},{"t":"<b>Avoid<\/b> external compression of WAGD system hoses:","l":0},{"t":"Use WAGD system hoses that are constructed to be resistant to kinking or twisting.","l":1},{"t":"Keep WAGD system hoses off the floor.","l":1},{"t":"Move anesthesia workstation and carts carefully to <b>avoid<\/b> obstructing WAGD system hoses.","l":1},{"t":"Visually inspect the WAGD system hoses during the routine preuse machine check and after the anesthesia workstation has been moved.","l":1},{"t":"Confirm that WAGD system hoses are connected to the correct ports on the WAGD system.","l":0},{"t":"During the preuse machine check, occlude the anesthesia breathing circuit at the Y piece:","l":0},{"t":"Activate the O<sub>2<\/sub> flush and ensure that the gas pressure can be relieved through the pop-off valve (tests both the valve and the WAGD system).","l":1},{"t":"With zero fresh gas flow, occlude the anesthesia breathing circuit and ensure that negative pressure does not develop in the circuit (active WAGD system).","l":1},{"t":"If present, ensure that vacuum pressure monitors are indicating adequate pressure in the WAGD system.","l":1},{"t":"If a closed interface WAGD system, ensure that the positive and negative pressure relief valves are not obstructed or clogged.","l":1}],"manifestations":[{"t":"Abnormal end-expiratory pressure (either positive or negative) in the anesthesia circuit:","l":0},{"t":"When passive WAGD is used, only positive pressure should develop.","l":1},{"t":"When active WAGD (vacuum) is in use, a failure of the WAGD interface can result in either excess positive or negative pressure.","l":1},{"t":"Inability to ventilate the patient’s lungs.","l":0},{"t":"Possible difficulty in keeping the circuit filled with gas.","l":0},{"t":"<b>Hypotension<\/b> due to increased intrathoracic pressure.","l":0},{"t":"<b>Hypoxemia<\/b>.","l":0},{"t":"Odor of volatile anesthetic gas may be detected by OR personnel.","l":0},{"t":"With an active closed interface WAGD system:","l":0},{"t":"Interface reservoir bag should fill at end-exhalation when waste gas enters the interface from the breathing circuit.","l":1},{"t":"Interface reservoir bag should empty during inspiration when no gas enters the interface but gas is being removed by the vacuum.","l":1}],"similar":[{"t":"Closed or obstructed pop-off valve (see Event 70, Pop-Off Valve Failure).","l":0},{"t":"Expiratory valve of a circle system stuck in the closed position (see Event 59, Circle System Expiratory Valve Stuck Closed).","l":0},{"t":"Stuck closed ventilator pop-off valve (see Event 71, Ventilator Failure).","l":0},{"t":"Faulty pressure gauge.","l":0},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"Loss of anesthetic gas from the anesthesia breathing circuit (see Event 69, Major Leak in the Anesthesia Breathing Circuit).","l":0}],"management":[{"t":"Confirm a fault in the WAGD system:","l":0},{"t":"Observe the pressure in the anesthesia breathing circuit.","l":1},{"t":"If abnormal pressure (either positive or negative) is observed, disconnect the patient from the anesthesia breathing circuit:","l":1},{"t":"Use an alternative ventilation system.","l":2},{"t":"Adjust amount of vacuum entering an active WAGD system:","l":1},{"t":"Close relief valve to decrease amount of vacuum.","l":2},{"t":"Open relief valve to increase amount of vacuum.","l":2},{"t":"Check for an obstruction of the WAGD system hoses:","l":0},{"t":"Between the circuit pop-off valve and the WAGD system interface.","l":1},{"t":"Between the ventilator and the WAGD system interface.","l":1},{"t":"Between the WAGD system interface and the OR WAGD system exhaust.","l":1},{"t":"If there is an obstruction of the WAGD system hose between the WAGD system interface and either the CO<sub>2<\/sub> absorber or the ventilator:","l":0},{"t":"Relieve any obvious obstruction.","l":1},{"t":"Consider switching from the ventilator to the reservoir bag or vice versa for positive pressure ventilation:","l":1},{"t":"Use an alternative ventilation system if there is any doubt.","l":2},{"t":"If the patient is breathing spontaneously, either the reservoir bag or the ventilator bellows can be used as a gas reservoir.","l":1},{"t":"If the obstruction of the WAGD system hose is between the WAGD interface and the OR exhaust point:","l":0},{"t":"Relieve any obvious obstruction.","l":1},{"t":"Continue to use the alternative ventilation system if the obstruction cannot be relieved.","l":1},{"t":"Alternatively, disconnect the WAGD system interface from the anesthesia breathing system, venting the waste gases into the OR.","l":1},{"t":"Check for other causes of high airway pressure (see Event 7, High Peak Inspiratory Pressure).","l":1},{"t":"Get help to repair and replace the faulty WAGD system components.","l":1}],"complications":[{"t":"Pulmonary barotrauma:","l":0},{"t":"Pneumothorax.","l":1},{"t":"Pneumomediastinum.","l":1},{"t":"SC emphysema.","l":1},{"t":"Hypotension.","l":0},{"t":"Hypoventilation.","l":0},{"t":"Exposure of OR personnel to waste anesthetic gases.","l":0}],"reading":[{"t":"1. Eisenkraft JB, McGregor DG. Waste anesthetic gases and scavenging systems. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 125-47."},{"t":"2. Tavakoli M, Habeeb A. Two hazards of gas scavenging. Anesth Analg 1978;57:286-7."}]}},{"id":74,"title":"Cardiac Laceration","ch":11,"cat":"Cardiac Anesthesia Events","s":{"definition":[{"t":"A cardiac laceration is an inadvertent incision into the right atrium, right ventricle, great vessels, or vein graft(s) during sternotomy or resulting from other traumatic injury.","l":0}],"etiology":[{"t":"Adhesion of scar tissue and/or myocardial tissue to the sternum.","l":0},{"t":"CPR.","l":0},{"t":"Penetrating chest trauma.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Gunshot wound.","l":2},{"t":"Knife injury.","l":2},{"t":"MVA.","l":2}],"typical":[{"t":"Patients who have had a previous sternotomy (“redo” sternotomy), especially those with vein grafts crossing under the sternum.","l":0},{"t":"Inexperienced surgeon.","l":0},{"t":"When the lungs are ventilated during sternotomy.","l":0},{"t":"Emergency sternotomy.","l":0},{"t":"Patients with ascending aortic aneurysms or multivessel aortic arch disease.","l":0},{"t":"Patients with an anatomic abnormality of the chest wall (kyphoscoliosis, pectus excavatum).","l":0},{"t":"Patients who have received mediastinal radiation.","l":0},{"t":"Patients who have had CPR with rib or sternal fractures.","l":0},{"t":"Patients with penetrating injury to the chest.","l":0},{"t":"Patients following MVA.","l":0}],"prevention":[{"t":"Obtain preoperative lateral CXR and/or CT scan to evaluate the extent of adhesions to the heart, great vessels, and sternum.","l":0},{"t":"Stop ventilating the lungs prior to primary sternotomy; maintain ventilation at reduced tidal volumes during redo sternotomy.","l":0},{"t":"Reduce myocardial chamber size during sternotomy:","l":0},{"t":"Place the patient in reverse Trendelenburg position.","l":1},{"t":"Vasodilate the patient with an IV infusion of sodium <b>nitroprusside<\/b> or NTG.","l":1},{"t":"Consider instituting femoral artery−to−femoral vein CPB prior to sternotomy.","l":0},{"t":"Suggest that sternotomy be performed following deep hypothermia and complete circulatory arrest if an aortic aneurysm is adherent to the underside of the sternum.","l":0}],"manifestations":[{"t":"Large volumes of blood welling out of the surgical field or other site of injury.","l":0},{"t":"<b>Hypotension<\/b>:","l":0},{"t":"May be due to blood loss.","l":1},{"t":"Acute cardiac failure may occur if a critical vein or internal mammary artery graft to a coronary artery is lacerated.","l":1},{"t":"<b>Tachycardia<\/b>.","l":0},{"t":"Obvious signs of:","l":0},{"t":"Chest trauma—knife or bullet holes.","l":1},{"t":"Seat belt burns.","l":1},{"t":"Hemopneumothorax.","l":0}],"similar":[{"t":"Bleeding from other intrathoracic structures (see Event 1, Acute Hemorrhage).","l":0},{"t":"Hypotension from other causes (see Event 9, Hypotension).","l":0}],"management":[{"t":"<i>Cardiac laceration may occur during any sternotomy or chest trauma.<\/i>","l":0,"n":1},{"t":"In cardiac surgery, be prepared for major hemorrhage during sternotomy:","l":0},{"t":"Ensure adequate IV access is in place for redo sternotomy.","l":1},{"t":"If a blood salvage device is to be used during surgery, have it set up prior to sternotomy.","l":1},{"t":"Stop ventilating the lungs prior to primary sternotomy; maintain ventilation at reduced tidal volumes during redo sternotomy.","l":1},{"t":"Ensure at least two units of PRBCs are available in the OR prior to sternotomy.","l":1},{"t":"Observe the operative field carefully during sternotomy.","l":1},{"t":"Ensure rapid fluid infuser is available.","l":1},{"t":"If major hemorrhage is apparent during sternotomy:","l":0},{"t":"Stop administering volatile anesthetics and flush the anesthesia breathing circuit with <b>100%<\/b> O<sub>2<\/sub>.","l":1},{"t":"Increase FiO<sub>2<\/sub> to <b>100%<\/b> and resume ventilation.","l":1},{"t":"Stop administering vasodilators.","l":1},{"t":"Maintain the circulating fluid volume:","l":0},{"t":"Administer IV fluid (<b>crystalloid<\/b>, <b>colloid<\/b>, blood).","l":1},{"t":"Get help to administer volume rapidly.","l":1},{"t":"Hook up rapid fluid infuser.","l":1},{"t":"<b>Maintain perfusion pressure:<\/b>","l":0},{"t":"Administer vasopressors as required (see Event 9, Hypotension):","l":1},{"t":"Administer <b>phenylephrine<\/b> IV, <b>50 to 200 μg<\/b>, and escalate as needed.","l":2},{"t":"Administer <b>epinephrine<\/b> IV, <b>10 to 50 μg<\/b>, and escalate as needed.","l":2},{"t":"Conserve the patient’s blood:","l":0},{"t":"Ensure that the blood salvage device is used by the surgeons.","l":1},{"t":"If surgical repair on CPB is necessary:","l":0},{"t":"<b>Heparin<\/b> should be administered (<b>300 to 400 units/kg<\/b> IV) by the anesthesiologist through a central line:","l":1},{"t":"Check <b>ACT<\/b> as soon as feasible.","l":2},{"t":"Administer more <b>heparin<\/b> if <b>ACT<\/b> is less than 400 seconds.","l":2},{"t":"After heparinization, blood can be salvaged by the cardiotomy suction line of the CPB pump (“sucker bypass”).","l":1},{"t":"The femoral artery may have to be cannulated for the arterial perfusion line.","l":1},{"t":"A right ventriculotomy and the cardiotomy suction can be used as venous return for CPB.","l":1},{"t":"After CPB is initiated, anticipate and plan for problems associated with prolonged CPB time and myocardial injury (see Event 78, Low Cardiac Output State After Cardiopulmonary Bypass; Event 75, Coagulopathy Following Cardiopulmonary Bypass; and Event 15, Acute Coronary Syndrome).","l":0},{"t":"Following penetrating or blunt injury to the chest or in patients who have had CPR, patients may need:","l":0},{"t":"Chest tube placement.","l":1},{"t":"Fluid resuscitation.","l":1},{"t":"Sternotomy/thoracotomy to control bleeding and/or cross-clamping of the descending aorta.","l":1},{"t":"Transfer to the OR for definitive surgery.","l":1}],"complications":[{"t":"Failure to wean from CPB.","l":0},{"t":"Acute myocardial failure.","l":0},{"t":"Myocardial ischemia.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"ARDS.","l":0},{"t":"Hypothermia.","l":0},{"t":"Systemic air embolism.","l":0}],"reading":[{"t":"1. Mehta AR, Romanoff ME, Licina MG. Anesthetic management in the precardiopulmonary bypass period. In: Hensley FA, Martin DE, Gravlee GP, editors. The practical approach to cardiac anesthesia. Philadelphia: Lippincott Williams &amp; Wilkins; 2008. p. 182-3."},{"t":"2. Despotis G, Avidan M, Eby C, et al. Prediction and management of bleeding in cardiac surgery. J Thromb Haemost 2009;7(Suppl. 1):111-7."},{"t":"3. Misao T, Yoshikawa T, Aoe M, et al. Bronchial and cardiac ruptures due to blunt trauma. Gen Thorac Cardiovasc Surg 2011;59:216-9."},{"t":"4. Nyawo B, Botha P, Pillay T, et al. Clinical experience with assisted venous drainage cardiopulmonary bypass in elective cardiac reoperations. Heart Surg Forum 2008;11:E21-3."},{"t":"5. Hellevuo H, Sainio M, Nevalainen R, et al. Deeper chest compression: more complications for cardiac arrest patients? Resuscitation 2013;84:760-5."}]}},{"id":75,"title":"Coagulopathy Following Cardiopulmonary Bypass","ch":11,"cat":"Cardiac Anesthesia Events","s":{"definition":[{"t":"Coagulopathy following CPB as a result of deficiency or dysfunction of platelets or of the coagulation cascade.","l":0}],"etiology":[{"t":"Circulating anticoagulant:","l":0},{"t":"Inadequate heparin neutralization.","l":1},{"t":"Heparin rebound.","l":1},{"t":"Protamine overdose.","l":1},{"t":"Thrombocytopenia.","l":0},{"t":"Impaired platelet function.","l":0},{"t":"Low plasma concentrations of coagulation factors.","l":0},{"t":"DIC.","l":0},{"t":"Primary fibrinolysis.","l":0},{"t":"Preexisting congenital or acquired coagulopathy.","l":0}],"typical":[{"t":"Postoperative cardiac surgery patients.","l":0},{"t":"Prolonged time on CPB:","l":0},{"t":"Increased platelet activation.","l":1},{"t":"Thrombocytopenia.","l":1},{"t":"Consumption of coagulation factors.","l":1},{"t":"Massive hemorrhage or transfusion.","l":0},{"t":"Vigorous cardiotomy suction.","l":0},{"t":"Patients requiring a circulatory assist device.","l":0},{"t":"Patients undergoing deep hypothermia (core temperature below 20°C).","l":0},{"t":"Preexisting coagulopathy:","l":0},{"t":"Drug therapy inhibiting platelet function (aspirin, dipyridamole, clopidogrel).","l":1},{"t":"Anticoagulant therapy.","l":1},{"t":"Thrombolytic therapy (streptokinase or similar agents).","l":1},{"t":"Hepatic dysfunction.","l":1},{"t":"Chronic renal failure.","l":1},{"t":"Myeloproliferative disorders.","l":1}],"prevention":[{"t":"Identify patients with preexisting clinical, subclinical, or pharmacologically induced coagulation disorders:","l":0},{"t":"Obtain preoperative laboratory studies of coagulation function:","l":1},{"t":"<b>PT<\/b>, <b>PTT<\/b>.","l":2},{"t":"Platelet count.","l":2},{"t":"Thromboelastogram, if available.","l":2},{"t":"Keep CPB time as short as possible.","l":0},{"t":"Minimize the negative pressure applied to the cardiotomy suction to reduce <b>platelet<\/b> trauma.","l":0},{"t":"Administer <b>heparin<\/b> and <b>protamine<\/b> in appropriate doses:","l":0},{"t":"Monitor coagulation during and <b>immediately<\/b> after CPB.","l":1},{"t":"Maintain adequate anticoagulation during CPB (<b>ACT<\/b> &gt; 400 seconds).","l":1},{"t":"Consider the use of acute normovolemic hemodilution:","l":0},{"t":"Remove whole blood pre-CPB for retransfusion post-CPB.","l":1},{"t":"Coordinate the discontinuation of preoperative medications known to cause <b>platelet<\/b> dysfunction with the surgical team.","l":0},{"t":"Consider administering pharmacologic therapy in high-risk cases:","l":0},{"t":"ε-<b>Aminocaproic acid<\/b>.","l":1},{"t":"<b>Tranexamic acid<\/b>.","l":1},{"t":"Have blood products available at the end of CPB for patients at high risk of a coagulopathy:","l":0},{"t":"Patients who have had previous cardiac surgery.","l":1},{"t":"Duration of CPB longer than 3 hours.","l":1}],"manifestations":[{"t":"Bleeding into the surgical field from multiple sites and from wound edges after administration of an adequate dose of protamine.","l":0},{"t":"Increased mediastinal chest tube output after the chest has been closed.","l":0},{"t":"Bleeding from IV insertion sites, wounds, or mucous membranes.","l":0},{"t":"Abnormalities in laboratory tests of coagulation function:","l":0},{"t":"Prolonged ACT that does not correct with additional protamine.","l":1},{"t":"Thrombocytopenia.","l":1},{"t":"Prolonged PT and PTT.","l":1},{"t":"Decreased fibrinogen level.","l":1},{"t":"Increased levels of fibrin split products.","l":1},{"t":"Abnormal thromboelastogram.","l":1},{"t":"<b>Hypotension<\/b>, <b>tachycardia<\/b>.","l":0},{"t":"Cardiac tamponade.","l":0}],"similar":[{"t":"Surgical bleeding.","l":0},{"t":"Acute hemorrhage (see Event 1, Acute Hemorrhage).","l":0},{"t":"Transfusion reaction (see Event 50, Transfusion Reaction).","l":0},{"t":"Cardiac tamponade from other causes (see Event 18, Cardiac Tamponade).","l":0}],"management":[{"t":"Surgical exploration is indicated if:","l":0},{"t":"The mediastinal chest tube drainage exceeds <b>300 to 400 mL<\/b> in 1 hour, drainage is continuing, and laboratory tests of coagulation are normal.","l":1},{"t":"Signs of cardiac tamponade are occurring (see Event 18, Cardiac Tamponade):","l":1},{"t":"Equilibration of filling pressures.","l":2},{"t":"TEE/TTE examination is suggestive of cardiac tamponade.","l":2},{"t":"Provide supportive therapy until bleeding is controlled:","l":0},{"t":"Maintain the circulating fluid volume:","l":1},{"t":"Infuse <b>crystalloid<\/b>, <b>colloid<\/b>, and blood products as necessary to maintain perfusion pressure.","l":2},{"t":"Administer vasopressors as required to maintain perfusion pressure (see Event 9, Hypotension):","l":1},{"t":"<b>Phenylephrine<\/b> IV, <b>50 to 100 μg<\/b>, and escalate as needed.","l":2},{"t":"<b>Epinephrine<\/b> IV, <b>10 to 50 μg<\/b>, and escalate as needed.","l":2},{"t":"Maintain normothermia (see Event 44, Hypothermia):","l":1},{"t":"Use heating blankets and/or a forced-air warming device.","l":2},{"t":"Warm all IV fluids.","l":2},{"t":"Prevent hypertension:","l":1},{"t":"Maintain adequate sedation.","l":2},{"t":"Administer vasodilator agents as needed.","l":2},{"t":"Consider PEEP to decrease the amount of venous mediastinal bleeding following chest closure.","l":1},{"t":"Assess laboratory tests of coagulation function:","l":0},{"t":"Check the <b>ACT<\/b>:","l":1},{"t":"Administer additional <b>protamine<\/b> until the <b>ACT<\/b> returns to control or until there is no further reduction in the <b>ACT<\/b>.","l":2},{"t":"Send samples to the clinical laboratory for:","l":1},{"t":"Platelet count.","l":2},{"t":"<b>PT<\/b>.","l":2},{"t":"<b>PTT<\/b>.","l":2},{"t":"Fibrinogen.","l":2},{"t":"Fibrin split products.","l":2},{"t":"Check thromboelastogram.","l":1},{"t":"Begin empirical therapy while waiting for laboratory results if bleeding is severe (see Event 1, Acute Hemorrhage):","l":0},{"t":"Restore <b>platelet<\/b> numbers and function:","l":1},{"t":"Reinfuse any fresh whole blood removed from the patient prior to CPB after administration of <b>protamine<\/b>.","l":2},{"t":"Administer <b>platelets<\/b> (one apheresis unit should increase <b>platelet<\/b> count by 50,000 to 80,000/μL).","l":2},{"t":"Consider desmopressin (DDAVP) IV by slow infusion, <b>0.3 μg/kg<\/b>.","l":2},{"t":"Can cause hypotension if given too quickly.","l":2},{"t":"Infuse <b>2 to 4 units<\/b> of <b>fresh frozen plasma<\/b> (adults).","l":1},{"t":"Further use of blood products should be guided by laboratory results if practical.","l":1},{"t":"Consult a hematologist for further management of a coagulopathy that does not resolve.","l":1},{"t":"Consider recombinant factor VIIa IV, <b>15 to 180 μg/kg<\/b> (dosage for the treatment of uncontrolled hemorrhage in nonhemophiliac patients vary; consult a hematologist).","l":1},{"t":"If primary fibrinolysis is thought to be the cause of bleeding:","l":0},{"t":"Administer ε-<b>aminocaproic acid<\/b> IV, <b>5 g<\/b> bolus infusion followed by 1 g/hr for 6 hours.","l":1}],"complications":[{"t":"Transfusion reaction.","l":0},{"t":"Hypovolemia.","l":0},{"t":"Hypervolemia.","l":0},{"t":"DIC.","l":0},{"t":"Hypercoagulable states.","l":0},{"t":"Renal failure.","l":0},{"t":"Mediastinitis following reexploration.","l":0},{"t":"Bloodborne virus infection.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Avery EG. Massive bleeding post bypass: rational approach to management. In: ASA refresher course lectures. Park Ridge, Ill: American Society of Anesthesiologists; 2012. p. 214."},{"t":"2. Mazer CD. Update on strategies for blood conservation and hemostasis in cardiac surgery. In: ASA refresher course lectures. Park Ridge, Ill: American Society of Anesthesiologists; 2012, p. 424."},{"t":"3. Romanoff ME, Royster RL. The postcardiopulmonary bypass period: weaning to ICU transport. In: Hensley FA, Martin DE, Gravlee GP, editors. The practical approach to cardiac anesthesia. Philadelphia: Lippincott Williams &amp; Wilkins; 2008, p. 233."},{"t":"4. DiNardo JA. Management of cardiopulmonary bypass. In: DiNardo JA, Zvara DA, editors. Anesthesia for cardiac surgery. Malden, Mass: Blackwell; 2008. p. 369."},{"t":"5. Speiss BD, Horrow J, Kaplan JA. Transfusion medicine and coagulation disorders. In: Kaplan JA, editor. Kaplan’s cardiac anesthesia. 5th ed. Philadelphia: Saunders; 2006. p. 972."},{"t":"6. Lam MS, Sims-McCallum RP. Recombinant factor VIIa in the treatment of nonhemophiliac bleeding. Ann Pharmacother 2005;39:885-91."}]}},{"id":76,"title":"Emergent “Crash” onto Cardiopulmonary Bypass","ch":11,"cat":"Cardiac Anesthesia Events","s":{"definition":[{"t":"Emergent initiation of CPB.","l":0}],"etiology":[{"t":"Cardiac surgery:","l":0},{"t":"Perioperative cardiac arrest, myocardial ischemia, hypotension, or massive hemorrhage.","l":1},{"t":"Airway catastrophe:","l":0},{"t":"Inability to establish an airway by routine methods, e.g. anterior mediastinal mass with tracheomalacia.","l":1},{"t":"LAST requiring prolonged CPR.","l":0}],"typical":[{"t":"Acute coronary graft occlusion.","l":0},{"t":"Failure of PCI.","l":0},{"t":"Severe valvular dysfunction:","l":0},{"t":"Failure of valve (e.g. ruptured chordae), valve repair or replacement.","l":1},{"t":"Endocarditis with acute severe valvular incompetence.","l":1},{"t":"Acute severe myocardial dysfunction:","l":0},{"t":"Severe hypotension.","l":1},{"t":"Severe protamine reaction.","l":1},{"t":"Massive perioperative hemorrhage.","l":0},{"t":"Massive PE.","l":0},{"t":"Obstetrical catastrophes.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"LAST.","l":2},{"t":"AFE.","l":2},{"t":"Cardiac arrest in the parturient.","l":2}],"prevention":[{"t":"Wean from CPB with all necessary inotropic and mechanical myocardial support.","l":0},{"t":"Verify <b>protamine<\/b> reversal and obtain good hemostasis prior to chest closure.","l":0},{"t":"Perform a post-CPB TEE examination to evaluate ventricular and valvular function.","l":0}],"manifestations":[{"t":"Signs of global or regional myocardial dysfunction:","l":0},{"t":"Visible cardiac distention and poor myocardial contractility.","l":1},{"t":"Systemic <b>hypotension<\/b> with increased filling pressures.","l":1},{"t":"Wall motion abnormalities on TEE (global or regional).","l":1},{"t":"Abnormalities of ECG morphology or rhythm:","l":1},{"t":"ST elevation, often on the inferior leads II, III, AVF.","l":2},{"t":"Heart block.","l":2},{"t":"Ventricular <b>arrhythmias<\/b> (VT, VF).","l":2},{"t":"Asystole.","l":2},{"t":"Severe hemorrhage.","l":0},{"t":"EEG activity may slow or become quiescent.","l":0},{"t":"<b>Cardiac arrest<\/b>.","l":0}],"management":[{"t":"Alert cardiac surgeon, perfusionist, and nursing team of the situation:","l":0},{"t":"Emergent CPB usually takes some time to organize for heparinization, CPB circuit preparation, and placement of arterial and venous cannulae (not in the context of ongoing cardiac surgery).","l":1},{"t":"<b>Resuscitate the patient:<\/b>","l":0},{"t":"Check that the patient is being oxygenated (deliver <b>100%<\/b> O<sub>2<\/sub>) and ventilated and that infusions of vasopressors are running; adjust ventilation and infusion rates as necessary.","l":1},{"t":"Administer boluses of vasopressors IV as necessary (see Event 9, Hypotension):","l":1},{"t":"<b>Phenylephrine<\/b> IV, <b>100 to 200 μg<\/b>, and escalate as necessary.","l":2},{"t":"<b>Ephedrine<\/b> IV, <b>10 to 20 mg<\/b>.","l":2},{"t":"<b>Epinephrine<\/b> IV, <b>10 to 50 μg<\/b>, and escalate as necessary.","l":2},{"t":"Administer IV fluids:","l":1},{"t":"<b>Crystalloid<\/b> bolus IV, <b>500 mL<\/b>, and additional boluses as needed.","l":2},{"t":"<b>Colloid<\/b> bolus IV:","l":2},{"t":"Hetastarch <b>500 mL<\/b>.","l":3},{"t":"<b>5%<\/b> albumin <b>250 to 500 mL<\/b>.","l":3},{"t":"RBCs—if massive hemorrhage, inform blood bank of the ongoing need for blood products; initiate your facility’s <b>MTP<\/b>.","l":3},{"t":"Once the decision has been made to go on CPB stat, ANTICOAGULATE THE PATIENT:","l":0},{"t":"Administer <b>heparin<\/b> through a central line <i>or <\/i>surgeons may choose to administer <b>heparin<\/b> intra-atrially.","l":1},{"t":"<b>Heparin<\/b> dose will depend on the current level of anticoagulation and whether the patient has received <b>protamine<\/b>.","l":1},{"t":"Aim for <b>ACT<\/b> &gt; 400 seconds.","l":2},{"t":"Initial <b>heparin<\/b> dose should be at least <b>300 units/kg<\/b>.","l":1},{"t":"Perfusionist should <b>immediately<\/b> prime the oxygenator and CPB pump circuit:","l":0},{"t":"If there is any question about the circulation of <b>heparin<\/b>, have an additional <b>15,000 units<\/b> of <b>heparin<\/b> added to the pump prime.","l":1},{"t":"Volume can be delivered to the patient via arterial cannula once it is in place.","l":1},{"t":"Cardiac surgeon should cannulate the arterial system (aorta or femoral artery) first, then the venous system (right atrium or femoral vein):","l":0},{"t":"If there is massive hemorrhage, the cardiotomy suction cannulae can be used as the source of venous drainage (MUST heparinize before doing this).","l":1},{"t":"Anesthesiologist should consider administering additional anesthetic agents if the case is prolonged once the patient is stable.","l":0},{"t":"Check an <b>ABG<\/b>; correct acidosis if present.","l":0}],"complications":[{"t":"Difficulty in separation from CPB.","l":0},{"t":"Myocardial ischemia or infarction.","l":0},{"t":"Coagulopathy.","l":0},{"t":"Stroke.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Mora-Mangano CT, Chow JL, Kanevsky M. Cardiopulmonary bypass and the anesthesiologist. In: Kaplan JA, editor. Kaplan’s cardiac anesthesia. 5th ed. Philadelphia: Saunders; 2006. p. 908."},{"t":"2. Birdi I, Chaudhuri N, Lenthall K, Reddy S, Nashef SA. Emergency reinstitution of cardiopulmonary bypass following cardiac surgery: outcome justifies the cost. Eur J Cardiothorac Surg 2000;17:743-6."}]}},{"id":77,"title":"Hypotension During Cardiopulmonary Bypass","ch":11,"cat":"Cardiac Anesthesia Events","s":{"definition":[{"t":"Hypotension during CPB is a MAP of less than 50 mm Hg.","l":0}],"etiology":[{"t":"Loss of pulsatility during CPB.","l":0},{"t":"Decreased flow from the pump:","l":0},{"t":"Roller pump malocclusion.","l":1},{"t":"Error in calculating the required flow rate for a patient.","l":1},{"t":"Reduced venous return to the oxygenator reservoir.","l":1},{"t":"Hypovolemia.","l":1},{"t":"Problem with aortic cannulation:","l":0},{"t":"Aortic dissection by the aortic cannula.","l":1},{"t":"Aortic cannula advanced too far into the aorta:","l":1},{"t":"Carotid artery or innominate artery cannulation.","l":2},{"t":"Clamping of the aortic cannula by the aortic cross-clamp.","l":1},{"t":"Decreased SVR:","l":0},{"t":"Vasodilator overdose.","l":1},{"t":"Hyperthermia.","l":1},{"t":"Low blood viscosity secondary to hemodilution.","l":0}],"typical":[{"t":"Acute reduction of viscosity when instituting CPB.","l":0},{"t":"Antihypertensive medication use by patient, e.g. ACEIs.","l":0},{"t":"Administration of vasodilator:","l":0},{"t":"Vasodilator infusion pump or IV administration device:","l":1},{"t":"Accidentally turned on.","l":2},{"t":"Incorrect settings.","l":2},{"t":"Malfunction of the pump.","l":2},{"t":"Vasodilation during the rewarming phase following hypothermia.","l":0},{"t":"Aortic cannula advanced too far into the aorta:","l":0},{"t":"More likely to be occluded by the aortic cross-clamp.","l":1},{"t":"Cannula may kink.","l":1},{"t":"Roller pump malocclusion.","l":0},{"t":"Reversal of tubing in the roller pump.","l":0},{"t":"Occult hemorrhage in anticoagulated patient:","l":0},{"t":"Recent cannulation of a major blood vessel, e.g. femoral artery.","l":1},{"t":"GI bleed.","l":1}],"prevention":[{"t":"Control the BP (MAP &lt; 80 mm Hg) at the time of aortic cannulation and when the aortic cross-clamp is applied or removed.","l":0},{"t":"Observe the process of cannulation, initiation of CPB, and cross-clamping the aorta; inform the surgeon if abnormalities are seen:","l":0},{"t":"Aortic dissection.","l":1},{"t":"Aortic cannula advanced too far.","l":1},{"t":"Occlusion of the aortic cannula with the aortic cross-clamp.","l":1},{"t":"Reversal of flow in the CPB circuit.","l":1},{"t":"When using vasodilators, take care in setting infusion pumps and IV administration devices.","l":0},{"t":"Maintain a minimum <b>hematocrit<\/b> of <b>20%<\/b> during routine CPB.","l":0},{"t":"Monitor temperature from at least two sites during CPB (oropharynx and bladder).","l":0}],"manifestations":[{"t":"Decreased MAP while on CPB.","l":0},{"t":"Signs of organ hypoperfusion:","l":0},{"t":"<b>Oliguria<\/b>.","l":1},{"t":"Slowing or “flat line” EEG:","l":1},{"t":"May be seen normally during CPB secondary to <b>hypothermia<\/b> or anesthetic administration.","l":2},{"t":"If aortic dissection occurs, there may be:","l":0},{"t":"Acute dilation and bluish discoloration of the aorta.","l":1},{"t":"Low MAP.","l":1},{"t":"Increase in the aortic line perfusion pressure.","l":1},{"t":"Decrease in venous return.","l":1},{"t":"Insertion of the tip of the aortic cannula into the brachiocephalic artery will be manifested by:","l":0},{"t":"Increase in the arterial pressure to the right arm and right cerebral hemisphere.","l":1},{"t":"Low systemic MAP.","l":1},{"t":"Otorrhea, rhinorrhea, conjunctival <b>edema<\/b>, and facial <b>edema<\/b> from cerebral hyperperfusion on the right side.","l":1},{"t":"Unexpectedly rapid administration of vasodilator manifested by:","l":0},{"t":"Rapid flow in the drip chamber (not present in all infusion sets).","l":1},{"t":"Excessive movement of any visible moving parts of the infusion pump mechanism.","l":1}],"similar":[{"t":"Artifacts of invasive BP measurement (see Event 20, Hypotension).","l":0},{"t":"Anaphylaxis (see Event 20, Anaphylaxis and Anaphylactoid Reactions).","l":0}],"management":[{"t":"<b>Confirm hypotension:<\/b>","l":0},{"t":"Flush the <b>arterial line<\/b>.","l":1},{"t":"Check the transducer, tubing, and <b>arterial line<\/b> for obstruction, kinking, or loose connections.","l":1},{"t":"Re-zero the transducer at the correct height.","l":1},{"t":"Check the pressure of the arterial side of the CPB pump circuit.","l":1},{"t":"If there is pulsatile flow, measure BP using a NIBP device.","l":1},{"t":"Inform the surgeon and perfusionist of the hypotension:","l":0},{"t":"Have the surgeon palpate the aorta distal to the cross-clamp to assess the intra-aortic pressure.","l":1},{"t":"Inspect the aorta using TEE to exclude dissection.","l":1},{"t":"If possible, check the position of the tip of the aortic cannula using TEE.","l":1},{"t":"Check face for signs of hyperperfusion.","l":0},{"t":"Have the perfusionist check for and correct CPB circuit problems:","l":0},{"t":"Inspect the CPB tubing for kinks, obstruction, or venous airlock.","l":1},{"t":"Check the flow setting on the CPB pump.","l":1},{"t":"Inspect the occlusion settings on the CPB roller pump.","l":1},{"t":"Discontinue volatile anesthetics being administered into the oxygenator.","l":1},{"t":"Inspect all vasoactive infusion pumps.","l":0},{"t":"Stop administration of all vasodilators:","l":0},{"t":"Effects of IV infusion of <b>nitroprusside<\/b> or <b>nitroglycerin<\/b> are short acting: turning them off may be all that is necessary to correct hypotension.","l":1},{"t":"If a vasodilator is not being infused:","l":1},{"t":"Turn stopcocks to the OFF position to exclude accidental administration of vasodilator.","l":2},{"t":"Look for IV crossover (vasodilator for vasopressor).","l":2},{"t":"Ensure that vaporizers are off or turned down.","l":1},{"t":"<b>Restore the BP:<\/b>","l":0},{"t":"Have the perfusionist transiently increase the CPB pump flow rate.","l":1},{"t":"Administer <b>phenylephrine<\/b> IV (or directly into the oxygenator reservoir), <b>50 to 200 μg<\/b> bolus.","l":1},{"t":"If hypotension is persistent, consider instituting a <b>phenylephrine<\/b> or <b>vasopressin<\/b> infusion.","l":1},{"t":"Give steroids in case of adrenal suppression:","l":1},{"t":"<b>Dexamethasone<\/b> IV, <b>8 mg<\/b>.","l":2},{"t":"<b>Hydrocortisone<\/b> IV, <b>100 mg<\/b>.","l":2},{"t":"<b>Check the hematocrit:<\/b>","l":0},{"t":"If the <b>hematocrit<\/b> is below <b>20%<\/b>, add PRBCs to raise <b>hematocrit<\/b> and blood viscosity.","l":1},{"t":"Check ABGs and mixed venous blood gases:","l":0},{"t":"If mixed venous O<sub>2<\/sub> saturation is low or there is marked metabolic acidosis, tissue hypoperfusion is present:","l":1},{"t":"Increase the FiO<sub>2<\/sub> to <b>100%<\/b>.","l":2},{"t":"Increase the pump flow rate.","l":2},{"t":"Administer NaHCO<sub>3<\/sub> to reverse severe metabolic acidosis.","l":2},{"t":"If aortic dissection has occurred:","l":0},{"t":"<b>Immediately<\/b> terminate CPB.","l":1},{"t":"Recannulate the true aortic lumen distal to the dissection or cannulate the femoral artery.","l":1},{"t":"Surgical repair of the aortic dissection may be required.","l":1}],"complications":[{"t":"Aortic or great vessel dissection.","l":0},{"t":"Neurologic injury.","l":0},{"t":"Acute renal failure.","l":0},{"t":"Myocardial ischemia or infarction.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. DiNardo JA. Management of cardiopulmonary bypass. In: DiNardo JA, Zvara DA, editors. Anesthesia for cardiac surgery. Malden, Mass: Blackwell; 2008. p. 351."},{"t":"2. Gibbs NM, Larach DR. Anesthetic management during cardiopulmonary bypass. In: Hensley FA, Martin DE, Gravlee GP, editors. The practical approach to cardiac anesthesia. Philadelphia: Lippincott Williams &amp; Wilkins; 2008. p. 212."}]}},{"id":78,"title":"Low Cardiac Output State After Cardiopulmonary Bypass","ch":11,"cat":"Cardiac Anesthesia Events","s":{"definition":[{"t":"Inadequate CO that occurs after separation from CPB.","l":0}],"etiology":[{"t":"Poor left ventricular function before surgery (ejection fraction less than 40%).","l":0},{"t":"Myocardial ischemia or infarction in the preoperative or pre-CPB period.","l":0},{"t":"Long aortic cross-clamp time.","l":0},{"t":"Inadequate surgical repair or revascularization.","l":0},{"t":"Inadequate myocardial protection while on CPB, especially when there has been:","l":0},{"t":"Prolonged VF before or after application of the aortic cross-clamp.","l":1},{"t":"Inadequate myocardial cooling.","l":1},{"t":"Ventricular distention.","l":1},{"t":"Arrhythmias.","l":0}],"typical":[{"t":"Severe CAD.","l":0},{"t":"Severe valvular disease of the heart.","l":0},{"t":"Coronary embolism during CPB (particulate matter or air).","l":0},{"t":"Redo operations.","l":0},{"t":"Acidosis.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Hypovolemia.","l":0},{"t":"Increased SVR:","l":0},{"t":"From hypothermia or injudicious use of vasopressor agents.","l":1},{"t":"Inadequate inotropic support.","l":0},{"t":"Surgically induced structural changes:","l":0},{"t":"Residual intracardiac shunting.","l":1},{"t":"Residual valvular obstruction or incompetence (in prosthetic or native valve).","l":1},{"t":"Coronary artery dissection.","l":1},{"t":"Following administration of protamine.","l":0},{"t":"Acute cardiac tamponade following chest closure.","l":0}],"prevention":[{"t":"Discuss with surgeons the adequacy of myocardial preservation and surgical repair.","l":0},{"t":"Control the patient’s hemodynamic status carefully as guided by TEE, ECG, invasive pressure measurements, and direct observation of the heart.","l":0},{"t":"Optimize the patient’s condition prior to terminating CPB:","l":0},{"t":"Commence IV infusions of inotropes and/or vasopressors or vasodilators as indicated clinically.","l":1},{"t":"Correct metabolic acidosis, if present.","l":1},{"t":"Ensure that there is sufficient blood volume in the oxygenator reservoir to restore the patient’s circulating blood volume as CPB is terminated.","l":1},{"t":"Use the checklist <b>THRIVE<\/b> to prepare for weaning from CPB:","l":0},{"t":"<b>T<\/b>: Temperature—ensure patient is normothermic.","l":1},{"t":"<b>H<\/b>: Hemodynamics and cardiac function are acceptable.","l":1},{"t":"<b>R<\/b>: Rhythm is acceptable.","l":1},{"t":"<b>I<\/b>: Infusions are selected as desired and infusing properly.","l":1},{"t":"<b>V<\/b>: Ventilation is appropriate for termination of CPB.","l":1},{"t":"<b>E<\/b>: Electrolytes are acceptable.","l":1}],"manifestations":[{"t":"Poor myocardial contractility and cardiac distention as seen on the surgical field and on TEE.","l":0},{"t":"Decreased CO.","l":0},{"t":"Low ejection fraction on TEE—can be global or regional wall motion abnormality.","l":0},{"t":"Valvular dysfunction on TEE—inadequate surgical repair or ischemic papillary muscle dysfunction.","l":0},{"t":"Elevated filling pressures.","l":0},{"t":"<b>Hypotension<\/b>.","l":0},{"t":"<b>Arrhythmias<\/b>.","l":0},{"t":"Small increases in fluid volume cause disproportionate elevations of CVP and PCWP.","l":0},{"t":"Increased SVR.","l":0},{"t":"Reduced tissue perfusion:","l":0},{"t":"Decreased mixed venous O<sub>2<\/sub> saturation.","l":1},{"t":"<b>Oliguria<\/b>.","l":1},{"t":"Acidosis.","l":1}],"similar":[{"t":"Artifact of BP measurement system:","l":0},{"t":"Faulty BP transducer.","l":1},{"t":"Transducer height above the patient’s heart.","l":1},{"t":"Spasm of radial artery or other lack of correlation between radial and central arterial pressure.","l":0}],"management":[{"t":"Optimize the cardiac rate and rhythm:","l":0},{"t":"Maintain the HR at 70 to 100 bpm.","l":1},{"t":"Epicardial pacemaker:","l":1},{"t":"Sequential AV pacing will improve ventricular filling and increase stroke volume, especially if atrial contraction is required for maintenance of adequate CO, e.g. low compliance of left ventricle.","l":2},{"t":"Optimize heart rhythm:","l":1},{"t":"Convert or control AF or junctional rhythms (see Event 23, Supraventricular Arrhythmias).","l":2},{"t":"Treat arrhythmias (see Event 19, Nonlethal Ventricular Arrhythmias):","l":2},{"t":"<b>Amiodarone 150 mg<\/b> IV over 10 minutes, followed by an infusion of <b>1 mg/min<\/b>.","l":3},{"t":"MgSO<sub>4<\/sub> IV, <b>2 to 4 g<\/b> by slow infusion.","l":3},{"t":"<b>Lidocaine<\/b> IV, <b>1 mg/kg<\/b> bolus followed by an infusion of <b>1 to 4 mg/min<\/b>.","l":3},{"t":"<b>Optimize inotropic support:<\/b>","l":0},{"t":"Dopamine <b>2 to 10 μg/kg/min<\/b> IV.","l":1},{"t":"Dobutamine <b>3 to 10 μg/kg/min<\/b> IV.","l":1},{"t":"<b>Epinephrine<\/b> 10 to 100 ng/kg/min IV.","l":1},{"t":"Milrinone <b>0.25 to 0.5 μg/kg/min<\/b> IV, after a loading dose (<b>50 μg/kg<\/b> over 10 minutes, as indicated).","l":1},{"t":"<b>Perform TEE examination:<\/b>","l":0},{"t":"Evaluate for hypovolemia, left ventricular dysfunction, adequacy of valve repair or replacement, presence of new valvular regurgitation or perivalvular leak.","l":1},{"t":"Optimize the cardiac filling pressures:","l":0},{"t":"Use TEE to assess ventricular function and optimize filling pressures.","l":1},{"t":"If PA catheter in place, administer fluid boluses to optimize PCWP.","l":1},{"t":"Higher filling pressures may be required in patients with a very low-compliance left ventricle.","l":1},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Ventilate the patient with <b>100%<\/b> O<sub>2<\/sub>.","l":1},{"t":"Check <b>ABG<\/b>—correct abnormalities:","l":1},{"t":"Respiratory or metabolic acidosis will compromise ventricular function.","l":2},{"t":"Give steroids if adrenal suppression is a concern:","l":0},{"t":"<b>Dexamethasone<\/b> IV, <b>8 mg<\/b>.","l":1},{"t":"<b>Hydrocortisone<\/b> IV, <b>100 mg<\/b>.","l":1},{"t":"Ensure that vasoactive drugs are reaching the circulation:","l":0},{"t":"Check that infusion pumps are administering vasoactive agents to the patient’s circulation.","l":1},{"t":"Check calculations to ensure that the appropriate dose is set on each infusion pump.","l":1},{"t":"<b>Do not<\/b> allow the heart to become overdistended:","l":0},{"t":"Administer small boluses of <b>epinephrine<\/b> IV, <b>5 to 20 μg<\/b>.","l":1},{"t":"Be prepared to go back on CPB emergently.","l":1},{"t":"If low CO state persists, consider placement of a mechanical device to augment CO:","l":0},{"t":"IABP.","l":1},{"t":"Left, right, or biventricular assist device as indicated.","l":1}],"complications":[{"t":"Myocardial ischemia or infarction.","l":0},{"t":"Cerebral ischemia.","l":0},{"t":"Renal failure.","l":0},{"t":"Pulmonary edema.","l":0},{"t":"Complications of IABP or ventricular assist device:","l":0},{"t":"Impaired perfusion of lower extremity.","l":1},{"t":"Thrombocytopenia.","l":1},{"t":"Gas embolization.","l":1},{"t":"Renal failure.","l":1},{"t":"Death.","l":0}],"reading":[{"t":"1. Romanoff ME, Royster RL. The postcardiopulmonary bypass period: weaning to ICU transport. In: Hensley FA, Martin DE, Gravlee GP, editors. The practical approach to cardiac anesthesia. Philadelphia: Lippincott Williams &amp; Wilkins; 2008. p. 231."},{"t":"2. DiNardo JA. Management of cardiopulmonary bypass. In: DiNardo JA, Zvara DA, editors. Anesthesia for cardiac surgery. Malden, Mass: Blackwell; 2008. p. 354."}]}},{"id":79,"title":"Massive Systemic Air Embolism","ch":11,"cat":"Cardiac Anesthesia Events","s":{"definition":[{"t":"Massive systemic air embolism is a large volume of air in the patient’s arterial circulation during or after CPB.","l":0}],"etiology":[{"t":"Air pumped into the aortic cannula from the CPB pump.","l":0},{"t":"Air entrained into the heart through a cardioplegic solution cannulation site when active suction has been applied to the left ventricle or PA for venting of the heart.","l":0}],"typical":[{"t":"Air pumped into the aorta from the CPB pump:","l":0},{"t":"Failure to set, or malfunction of, the oxygenator low-volume alarm during CPB.","l":1},{"t":"When blood is being returned to the patient from the oxygenator following CPB and low-level alarms have been turned off.","l":1},{"t":"When the perfusionist is distracted by the operation of other devices:","l":1},{"t":"Intraoperative RBC salvage equipment.","l":2},{"t":"IABP.","l":2},{"t":"Blood gas analyzer.","l":2},{"t":"Use of “hard shell” oxygenator or cardiotomy suction reservoirs.","l":1},{"t":"Urgent/emergent CPB requiring rapid setup of the oxygenator and CPB pump circuit.","l":0},{"t":"Reversal of vent or perfusion lines in pump head:","l":0},{"t":"Flow would occur in the opposite direction to that intended.","l":1},{"t":"The cardiotomy suction reservoir might become pressurized with air.","l":1}],"prevention":[{"t":"Ensure that the perfusionist takes appropriate care in the setup and pre-bypass check of the oxygenator and circuit:","l":0},{"t":"Prime and remove all air from the oxygenator and lines prior to CPB.","l":1},{"t":"Set the oxygenator low-volume alarm.","l":1},{"t":"Incorporate an <b>arterial line<\/b> filter with a continuous vent to the oxygenator reservoir.","l":1},{"t":"Check that there is an adequate blood volume in the oxygenator reservoir during CPB:","l":0},{"t":"Add volume to the circuit as necessary.","l":1},{"t":"An air lock in the venous drainage line will cause venous return to the oxygenator to stop abruptly.","l":1},{"t":"Use extreme care when returning blood back to the patient following CPB:","l":0},{"t":"The perfusionist typically disables the oxygenator low-volume alarm at this time.","l":1},{"t":"If possible, return the blood through the venous line.","l":1},{"t":"If reinfusing blood through an aortic line, the surgeon should visually monitor the line for bubbles of air:","l":1},{"t":"The surgeon should have a clamp available <b>immediately<\/b> to occlude the aortic line should air become visible in the tubing.","l":2},{"t":"The perfusionist should clamp the blood return line when not in use in case the CPB pump head becomes activated inadvertently.","l":1},{"t":"<b>Avoid<\/b> the use of N<sub>2<\/sub>O during and after CPB.","l":0}],"manifestations":[{"t":"Air may be visible:","l":0},{"t":"In the aortic cannula from the oxygenator to the patient.","l":1},{"t":"In the vein grafts.","l":1},{"t":"In the chambers of the heart on TEE.","l":1},{"t":"If the tubing in the roller pumps is reversed, air may be visible in other portions of the CPB pump circuit tubing.","l":1},{"t":"The oxygenator reservoir may be empty or may have an abnormally low air/blood level:","l":0},{"t":"Air emboli are:","l":1},{"t":"More likely to enter the vein grafts if the site of the proximal anastomosis is the anterior portion of the aorta.","l":2},{"t":"Abnormalities of ECG morphology or rhythm:","l":1},{"t":"ST elevation, often on the inferior leads II, III, AVF.","l":2},{"t":"Heart block.","l":2},{"t":"Ventricular <b>arrhythmias<\/b> (VT, VF).","l":2},{"t":"Asystole.","l":2},{"t":"Regional wall motion abnormalities on TEE.","l":1},{"t":"Low CO state after CPB.","l":1},{"t":"EEG activity may slow or “flat line”.","l":0},{"t":"The patient may be slow to awaken:","l":0},{"t":"There may be major focal or diffuse cerebral dysfunction, which can be severe or even indicate brain death.","l":1}],"similar":[{"t":"Hypotension due to other causes (see Event 9, Hypotension).","l":0},{"t":"Systemic embolization of particulate matter from the operative field.","l":0}],"management":[{"t":"The perfusionist should stop the CPB pump <b>immediately<\/b>.","l":0},{"t":"Place the patient in the steep Trendelenburg position:","l":0},{"t":"This will reduce embolization to the cerebral circulation.","l":1},{"t":"Be prepared to temporarily occlude carotid arteries manually.","l":1},{"t":"Remove as much air as possible from the circulation:","l":0},{"t":"The surgeon should <b>immediately<\/b> make a stab incision into the ascending aorta to allow air to escape.","l":1},{"t":"The surgeon should remove the aortic cannula because:","l":1},{"t":"This allows more air to escape.","l":2},{"t":"This makes it easier to reprime the CPB pump.","l":2},{"t":"If CPB is to be continued, the surgeon <b>must<\/b> replace the aortic cannula.","l":2},{"t":"The surgeon should massage the heart and great vessels to dislodge trapped air.","l":1},{"t":"The surgeon can vent air from vein grafts using a small (25-gauge) needle and syringe, massaging the vein grafts.","l":1},{"t":"Have the perfusionist reprime the oxygenator and CPB pump circuit <b>immediately<\/b>:","l":0},{"t":"The surgeon may elect to attempt retrograde perfusion of the cerebral circulation through a SVC cannula to backwash air out of the cerebral arteries:","l":1},{"t":"If retrograde cerebral perfusion is to be attempted, it <b>must<\/b> be instituted quickly, especially if the patient is normothermic.","l":2},{"t":"The heart can be perfused in a retrograde manner via a coronary sinus catheter.","l":1},{"t":"CPB <b>must<\/b> be reinstituted emergently if there has been significant coronary air embolization and the patient is unable to maintain an adequate CO:","l":1},{"t":"Begin CPB gradually, increasing the flow rate up to twice normal.","l":2},{"t":"Partial aortic clamping distal to the aortic perfusion cannula may help force remaining air through the coronary arteries.","l":2},{"t":"Provide <b>100%<\/b> O<sub>2<\/sub> to the patient:","l":0},{"t":"The goal is to denitrogenate the patient.","l":1},{"t":"If CPB is terminated, ventilate the lungs with <b>100%<\/b> FiO<sub>2<\/sub>.","l":1},{"t":"When CPB is reinstituted, use only O<sub>2<\/sub> and CO<sub>2<\/sub> in the gases supplied to the oxygenator.","l":1},{"t":"Increase the arterial pressure and support the heart:","l":0},{"t":"Use vasopressors as necessary (see Event 9, Hypotension).","l":1},{"t":"Consider the use of a mechanical assist device (IABP or LVAD) to aid separation from CPB.","l":1},{"t":"For treatment of cerebral air embolism, consider administering medications that might reduce cerebral injury, although there is no definitive evidence that any medications improve outcome:","l":0},{"t":"<b>Dexamethasone<\/b> IV, <b>20 mg<\/b> (or methylprednisone IV, <b>2 to 4 g<\/b>); consider neurology consultation to assist in management.","l":1},{"t":"Institute systemic hypothermia (32° to 34°C) to increase the solubility of air in the tissues.","l":0},{"t":"Compression in a hyperbaric chamber has been reported to reverse the adverse cerebral effects of a major systemic air embolism:","l":0},{"t":"This therapy is only available in a few medical centers.","l":1},{"t":"Most patients are too sick to be transported to a suitable hyperbaric chamber.","l":1}],"complications":[{"t":"Stroke.","l":0},{"t":"Brain death.","l":0},{"t":"Myocardial ischemia or infarction.","l":0},{"t":"Difficulty in separation from CPB.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Renal failure.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Stammers AH, Brindisi N, Kurusz M, High KM. Cardiopulmonary bypass circuits: design and use. In: Hensley FA, Martin DE, Gravlee GP, editors. The practical approach to cardiac anesthesia. Philadelphia: Lippincott Williams &amp; Wilkins; 2008. p. 553."},{"t":"2. Kurusz M, Mills NL. Management of unusual problems encountered in initiating and maintaining cardiopulmonary bypass. In: Gravlee GP, Davis RF, Kurusz M, Utley JR, editors. Cardiopulmonary bypass: principles and practice. Philadelphia: Lippincott Williams &amp; Wilkins; 2000. p. 591."}]}},{"id":80,"title":"Protamine Reaction","ch":11,"cat":"Cardiac Anesthesia Events","s":{"definition":[{"t":"Allergic or anaphylactic response to protamine administration:","l":0},{"t":"<i>Anaphylactic reaction <\/i>(immunologic) involves antigen and IgE antibodies; requires previous sensitization to protamine.","l":1},{"t":"<i>Anaphylactoid reaction <\/i>(nonimmunologic) mediated primarily by histamine; may occur with the first exposure to protamine.","l":1}],"etiology":[{"t":"Administration of protamine to a patient with a protamine allergy.","l":0}],"typical":[{"t":"Rapid administration of protamine.","l":0},{"t":"Sensitization of the patient by prior exposure to protamine, vertebrate fish, or NPH insulin with production of antigen-specific IgE antibodies.","l":0},{"t":"Patients with other drug allergies.","l":0}],"prevention":[{"t":"Administer <b>protamine<\/b> slowly:","l":0},{"t":"Consider using an infusion pump.","l":1},{"t":"Administer a test dose of <b>10 to 20 mg<\/b>.","l":0},{"t":"In patients with prior <b>protamine<\/b> reaction, administer <b>1 mg<\/b> diluted in <b>100 mL<\/b> over 10 minutes; if no adverse effects, administer full neutralizing dose as described.","l":0}],"manifestations":[{"t":"Cardiovascular:","l":0},{"t":"Severe <b>hypotension<\/b>.","l":1},{"t":"<b>Bradycardia<\/b> may be initial sign.","l":1},{"t":"Arrythmias.","l":1},{"t":"<b>Cardiac arrest<\/b>.","l":1},{"t":"Acute pulmonary <b>hypertension<\/b> secondary to formation of heparin-protamine complexes that cause thromboxane-induced pulmonary vasoconstriction:","l":1},{"t":"RV failure on TTE/TEE.","l":2},{"t":"Respiratory:","l":0},{"t":"<b>Hypoxemia<\/b>.","l":1},{"t":"Decreased lung compliance.","l":1},{"t":"Severe <b>bronchospasm<\/b>.","l":1},{"t":"Pulmonary <b>edema<\/b>.","l":1},{"t":"Cutaneous—may be obscured by surgical drapes:","l":0},{"t":"Flushing, hives, <b>urticaria<\/b>, pruritus.","l":1},{"t":"Swelling of mucosal membranes, conjunctiva, airway.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Lips.","l":2},{"t":"Tongue.","l":2},{"t":"Uvula.","l":2}],"similar":[{"t":"Anesthetic overdose (see Event 72, Volatile Anesthetic Overdose).","l":0},{"t":"Pulmonary edema (see Event 20, Pulmonary Edema).","l":0},{"t":"Cardiac tamponade (see Event 18, Cardiac Tamponade).","l":0},{"t":"Venous air embolism (see Event 24, Venous Air or Gas Embolism).","l":0},{"t":"PE (see Event 21, Pulmonary Embolism).","l":0},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"Skin manifestations of drug reactions not associated with anaphylaxis.","l":0},{"t":"Hypotension from other causes (see Event 9, Hypotension).","l":0},{"t":"Allergic reaction to other drugs (See Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"Transfusion reaction (see Event 50, Transfusion Reaction).","l":0},{"t":"ACS (see Event 15, Acute Coronary Syndrome).","l":0}],"management":[{"t":"Stop administration of <b>protamine<\/b>.","l":0},{"t":"Treat simple hypotension with rapid IV fluid administration:","l":0},{"t":"Give CaCl<sub>2<\/sub> IV, <b>100 to 200 mg<\/b>, repeat as necessary.","l":1},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub>.","l":1},{"t":"Consider intubation in patients without definitive airway.","l":1},{"t":"Severe reactions may require crash onto CPB:","l":0},{"t":"Inform surgeons and perfusionist to prepare for crash onto CPB.","l":1},{"t":"True anaphylactic or anaphylactoid reactions will require aggressive resuscitation with fluids, vasopressors, and bronchodilators:","l":1},{"t":"<b>Crystalloid<\/b> bolus IV, <b>500 mL<\/b> initially.","l":2},{"t":"May have very large ongoing fluid requirements (liters).","l":2},{"t":"Consider placement of additional IV access.","l":2},{"t":"<b>Epinephrine<\/b> IV bolus, <b>10 to 50 μg<\/b>; rapidly escalate the dose if no response; an infusion might be needed.","l":2},{"t":"<b>Albuterol<\/b> MDI, 5 to 10 puffs into breathing circuit.","l":2},{"t":"<b>Diphenhydramine<\/b> IV, <b>25 to 50 mg<\/b>.","l":2},{"t":"<b>Methylprednisolone<\/b> IV, <b>100 mg<\/b>.","l":2},{"t":"If pulmonary hypertension develops, begin inotropic support with <b>epinephrine<\/b> and/ or milrinone:","l":1},{"t":"Consider crash onto CPB, which will require anticoagulation with a full dose of <b>heparin<\/b> (see Event 76, Emergent “Crash” onto CPB).","l":2},{"t":"After a severe reaction, <b>protamine<\/b> should not be readministered; the anticoagulant effect of <b>heparin<\/b> should be allowed to wear off.","l":2},{"t":"Consider inhaled nitric oxide therapy.","l":2},{"t":"Consider inhaled prostacyclin.","l":2}],"complications":[{"t":"Myocardial ischemia or infarction.","l":0},{"t":"Coagulopathy.","l":0},{"t":"ARDS.","l":0},{"t":"Renal failure.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Shore-Lesserson L, Horrow JC, Gravlee GP. Coagulation management during and after cardiopulmonary bypass. In: Hensley FA, Martin DE, Gravlee GP, editors. The practical approach to cardiac anesthesia. Philadelphia: Lippincott Williams &amp; Wilkins; 2008. p. 504."},{"t":"2. DiNardo JA. Management of cardiopulmonary bypass. In: DiNardo JA, Zvara DA, editors. Anesthesia for cardiac surgery. Malden, Mass: Blackwell; 2008. p. 358."}]}},{"id":81,"title":"Amniotic Fluid Embolism (Anaphylactoid Syndrome of Pregnancy)","ch":12,"cat":"Obstetric Events","s":{"definition":[{"t":"Amniotic fluid embolism (AFE) is thought to be an abnormal maternal immune response to fetal antigens when the maternal-fetal immunological barrier is breached during labor, pregnancy termination, or shortly after delivery.","l":0},{"t":"It results in a triad of hypoxemia, hypotension, and coagulopathy.","l":0}],"etiology":[{"t":"The etiology of cardiovascular collapse is not clear but may result from activation of a cascade of immune mediators that causes a massive systemic reaction.","l":0}],"typical":[{"t":"Active labor.","l":0},{"t":"Pregnancy termination.","l":0},{"t":"Cesarean delivery.","l":0},{"t":"Induction of labor.","l":0},{"t":"Multiparity.","l":0},{"t":"Advanced maternal age.","l":0},{"t":"Ethnic minority groups.","l":0},{"t":"Placental abnormalities (placental abruption or placenta previa).","l":0},{"t":"Operative delivery.","l":0}],"prevention":[{"t":"There are no known measures to prevent AFE.","l":0},{"t":"Create institutional plan for stat cesarean section of a parturient in cardiac arrest (“Code Blue Obstetrics”).","l":0},{"t":"Drill and practice the management of stat cesarean section during cardiac arrest (using simulation if available).","l":0}],"manifestations":[{"t":"Unexplained acute fetal distress may precede maternal deterioration in 20% of cases.","l":0},{"t":"Premonitory symptoms:","l":0},{"t":"Restlessness, agitation, paresthesia.","l":1},{"t":"Pulmonary symptoms:","l":0},{"t":"Acute onset of dyspnea, pleuritic chest pain, <b>bronchospasm<\/b>, coughing, or hemoptysis.","l":1},{"t":"<b>Hypoxemia<\/b> and <b>cyanosis<\/b>.","l":1},{"t":"CXR may initially be normal and later demonstrate ARDS.","l":1},{"t":"Respiratory arrest.","l":1},{"t":"Cardiovascular symptoms:","l":0},{"t":"<b>Arrhythmias<\/b>.","l":1},{"t":"Severe <b>hypotension<\/b>.","l":1},{"t":"Pulmonary <b>hypertension<\/b> with RV failure (early, first 30 minutes):","l":1},{"t":"ECG signs of right heart strain.","l":2},{"t":"Left ventricular failure and pulmonary <b>edema<\/b> (following initial onset).","l":1},{"t":"<b>Cardiac arrest<\/b> (PEA, asystole, VF, VT).","l":1},{"t":"Neurologic symptoms:","l":0},{"t":"Hyperreflexia, <b>seizure<\/b>, coma.","l":1},{"t":"Acute severe consumptive coagulopathy:","l":0},{"t":"DIC.","l":1},{"t":"Massive hemorrhage.","l":1},{"t":"Obstetric complications:","l":0},{"t":"Uterine atony.","l":1}],"similar":[{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"Pulmonary or venous air embolism (see Event 21, Pulmonary Embolism, and Event 24, Venous Gas Embolism).","l":0},{"t":"Eclampsia (see Event 88, Preeclampsia and Eclampsia).","l":0},{"t":"Sepsis (see Event 13, The Septic Patient).","l":0},{"t":"Obstetric hemorrhage (see Event 87, Obstetric Hemorrhage).","l":0},{"t":"Medication reaction (see Event 63, Drug Administration Error).","l":0},{"t":"Local anesthetic overdose (see Event 52, Local Anesthetic Systemic Toxicity).","l":0},{"t":"Total spinal anesthesia (see Event 89, Total Spinal Anesthesia).","l":0},{"t":"Cardiac disease:","l":0},{"t":"MI or ischemia, aortic dissection, cardiomyopathy, Eisenmenger syndrome.","l":1},{"t":"Seizures (see Event 57, Seizures, and Event 88, Preeclampsia and Eclampsia).","l":0}],"management":[{"t":"<i>Patients with AFE can rapidly deteriorate, are at high risk of maternal mortality, and have a high incidence of fetal distress. The key steps are early recognition, supportive management, prompt resuscitation, and delivery of the fetus.<\/i>","l":0,"n":1},{"t":"<b>Call for help:<\/b>","l":0},{"t":"Labor and delivery team and additional anesthesia help.","l":1},{"t":"If the patient has arrested, start CPR <b>immediately<\/b>:","l":0},{"t":"Stat cesarean section may be necessary (if no return of spontaneous circulation after 4 minutes) with the goal of delivery within 5 minutes (see Event 82, Cardiac Arrest in the Parturient).","l":1},{"t":"If the patient has NOT arrested, maintain left uterine displacement even if postpartum.","l":0},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> by a nonrebreathing face mask.","l":1},{"t":"Patient may require urgent or emergent airway management:","l":1},{"t":"If urgent airway management is necessary, perform RSI with cricoid pressure:","l":2},{"t":"<b>Etomidate<\/b> IV, <b>0.2 to 0.3 mg/kg<\/b>, or <b>ketamine<\/b> IV, <b>0.5 to 1.0 mg/kg<\/b>.","l":3},{"t":"<b>Succinylcholine<\/b> IV, <b>1 to 2 mg/kg<\/b>.","l":3},{"t":"Intubate the trachea if there is loss of consciousness, respiratory failure, or severe cardiovascular collapse.","l":2},{"t":"<b>Stop MgSO<sub>4<\/sub> infusion,<\/b> if running:","l":0},{"t":"If Mg2+ toxicity is suspected, administer CaCl<sub>2<\/sub> IV, <b>500 to 1000 mg<\/b>.","l":1},{"t":"Initiate basic monitoring if not already present:","l":0},{"t":"ECG, NIBP, pulse oximeter, RR, level of consciousness, temperature, fetal monitoring.","l":1},{"t":"<b>Support the circulation:<\/b>","l":0},{"t":"Ensure adequate IV access above the diaphragm (2× <b>large-bore<\/b> IVs).","l":1},{"t":"Rapidly infuse <b>crystalloid<\/b> and/or <b>colloid<\/b>.","l":1},{"t":"Treat hypotension with vasopressors, increasing doses as needed:","l":1},{"t":"<b>Phenylephrine<\/b> IV, <b>50 to 200 µg<\/b>.","l":2},{"t":"<b>Ephedrine<\/b> IV, <b>5 to 10 mg<\/b>.","l":2},{"t":"<b>Epinephrine<\/b> IV, <b>10 to 100 µg<\/b>.","l":2},{"t":"Consider administering vasopressor infusions if the preceding measures are inadequate (see Event 9, Hypotension).","l":2},{"t":"Place an <b>arterial line<\/b> and consider placement of <b>CVP<\/b> line for infusion of vasopressors.","l":1},{"t":"Prepare for massive transfusion and initiate <b>MTP<\/b> (if available):","l":0},{"t":"Send for blood products if they are not already in the room.","l":1},{"t":"Inform the blood bank that more blood and blood products will be needed emergently:","l":1},{"t":"If crossmatched blood is not readily available, order uncrossmatched blood.","l":2},{"t":"Get help to set up a rapid infusor device.","l":1},{"t":"<b>Transfuse blood products:<\/b>","l":0},{"t":"Use a fluid warmer.","l":1},{"t":"Transfuse with an RBC:<b>FFP<\/b> ratio of 1:1 or 2:1:","l":1},{"t":"Transfuse RBCs to maintain hemoglobin &gt;7 g/dL.","l":2},{"t":"Transfuse additional <b>FFP<\/b> if <b>PT<\/b>/<b>aPTT<\/b> is prolonged.","l":2},{"t":"Transfuse <b>platelets<\/b> if &lt;50,000/µL.","l":2},{"t":"Transfuse <b>cryoprecipitate<\/b> if <b>fibrinogen<\/b> &lt;200 mg/dL.","l":2},{"t":"Consult hematology and the critical care team.","l":0},{"t":"Maintain normothermia.","l":0},{"t":"Frequent lab draws (<b>ABG<\/b>/CBC/<b>PT<\/b>/<b>aPTT<\/b>/<b>fibrinogen<\/b>/metabolic panel/Ca<sup>2+<\/sup>).","l":0},{"t":"At any time, if the patient has no pulse, start CPR <b>immediately<\/b> (C-A-B: compressions, airway, breathing):","l":0},{"t":"Follow (ACLS) guidelines with modifications for the parturient (see Event 2, Cardiac Arrest, and Event 82, Cardiac Arrest in the Parturient).","l":1}],"complications":[{"t":"Electrolyte abnormalities.","l":0},{"t":"Massive hemorrhage.","l":0},{"t":"ARDS.","l":0},{"t":"Aspiration pneumonitis.","l":0},{"t":"Cerebral hemorrhage.","l":0},{"t":"Cerebral anoxia.","l":0},{"t":"Cardiac arrest or death.","l":0},{"t":"Fetal distress or death.","l":0}],"reading":[{"t":"1. Kramer MS, Rouleau J, Liu S, et al. Health Study Group of the Canadian Perinatal Surveillance System: Amniotic fluid embolism: incidence, risk factors, and impact on perinatal outcome. Br J Obstet Gynaecol 2012;119:874-9."},{"t":"2. Knight M, Tuffnell D, Brocklehurst P, Spark P, Kurinczuk JJ. On behalf of the UK Obstetric Surveillance System: incidence and risk factors for amniotic-fluid embolism. Obstet Gynecol 2010;115:910-7."},{"t":"3. Clark SL. Amniotic fluid embolism. Clin Obstet Gynecol 2010;53:322-8."},{"t":"4. Tuffnell D, Knight M, Plaat F. Amniotic fluid embolism: an update. Anaesthesia 2011;66:3-6."},{"t":"5. Dedhia JD, Mushambi MC. Amniotic fluid embolism. Contin Educ Anaesth Crit Care Pain 2007;7:152-6."}]}},{"id":82,"title":"Cardiac Arrest in the Parturient","ch":12,"cat":"Obstetric Events","s":{"definition":[{"t":"Cardiac arrest in the parturient is the absence of effective mechanical activity of the heart in the pregnant patient.","l":0}],"etiology":[{"t":"Hypovolemia.","l":0},{"t":"Hypoxemia.","l":0},{"t":"PE, venous air embolism, or AFE.","l":0},{"t":"Toxins, e.g. LAST.","l":0},{"t":"Anesthetic complications.","l":0},{"t":"Uterine atony.","l":0},{"t":"Hypertensive disease of pregnancy.","l":0},{"t":"Placental abnormalities (placental abruption or placenta previa).","l":0},{"t":"Cardiac disease:","l":0},{"t":"MI or ischemia, aortic dissection, cardiomyopathy, Eisenmenger syndrome.","l":1},{"t":"Sepsis.","l":0},{"t":"Tension pneumothorax.","l":0},{"t":"Cardiac tamponade.","l":0}],"typical":[{"t":"Anesthesia-related:","l":0},{"t":"Failed or difficult tracheal intubation.","l":1},{"t":"Unrecognized esophageal intubation.","l":1},{"t":"Total spinal anesthesia.","l":1},{"t":"LAST.","l":1},{"t":"Major hemorrhage:","l":0},{"t":"Uterine atony.","l":1},{"t":"Placental abnormalities:","l":1},{"t":"Placenta previa:","l":2},{"t":"Placenta located in the lower uterine segment over the cervix.","l":3},{"t":"Placenta accreta, increta, or percreta:","l":2},{"t":"Placenta attaches to, into, or through the
