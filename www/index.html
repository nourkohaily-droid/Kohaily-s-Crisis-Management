:","l":1},{"t":"Signs of increasing metabolic rate begin to appear:","l":2},{"t":"<b>Immediately<\/b> commence treatment of MH.","l":3},{"t":"If the surgery is emergent:","l":0},{"t":"Change the anesthetic to nontriggering agents.","l":1},{"t":"Consider administration of <b>dantrolene<\/b>.","l":1},{"t":"Consider placement of an <b>arterial line<\/b>.","l":1},{"t":"Assess adequacy of IV access.","l":1},{"t":"Observe the patient carefully for signs of MH:","l":0},{"t":"Skeletal muscle rigidity.","l":1},{"t":"Increased CO<sub>2<\/sub> production and O<sub>2<\/sub> consumption.","l":1},{"t":"Metabolic acidosis and hyperkalemia (check blood gas).","l":1},{"t":"Tachycardia or arrhythmias.","l":1},{"t":"Increase in body temperature.","l":1},{"t":"Myoglobinuria.","l":1},{"t":"All patients with significant MMR will develop rhabdomyolysis and should be observed for 24 hours in the hospital:","l":0},{"t":"Send blood to lab for CK and presence of myoglobinemia q6h until trending downward.","l":1},{"t":"Observe for dark urine:","l":1},{"t":"Test for myoglobinuria.","l":2},{"t":"Monitor for signs of MH.","l":1},{"t":"Consider IV hydration to promote diuresis.","l":1},{"t":"Evaluate the patient for an undiagnosed muscular disorder.","l":0},{"t":"Counsel parents to consult an expert regarding MH susceptibility.","l":0}],"complications":[{"t":"Inability to intubate the trachea.","l":0},{"t":"Difficulty maintaining ventilation by mask.","l":0},{"t":"Hypoxemia.","l":0}],"reading":[{"t":"1. Brandom BW. Malignant hyperthermia. In: Motoyama EK, Davis PJ, editors. Smith’s anesthesia for infants and children. 6th ed. St. Louis: Mosby; 2006. p. 1018."},{"t":"2. Dexter F, Epstein RH, Wachtel RE, Rosenberg H. Estimate of the relative risk of succinylcholine for triggering malignant hyperthermia. Anesth Analg 2013;116:118-22."},{"t":"3. Glahn KP, Ellis FR, Halsall PJ, et al. Recognizing and managing a malignant hyperthermia crisis: guidelines from the European Malignant Hyperthermia Group. Br J Anaesth 2010;105:417-20."},{"t":"4. Rawicz M, Brandom BW, Wolf A. The place of suxamethonium in pediatric anesthesia. Paediatr Anaesth 2009;19:561-70."}]}},{"id":99,"title":"Sinus Tachycardia in the Pediatric Patient","ch":13,"cat":"Pediatric Events","s":{"definition":[{"t":"Sinus tachycardia in the pediatric patient is a HR faster than the age-appropriate normal value (see Table, next page).","l":0}],"etiology":[{"t":"Enhanced automaticity of sinus node for any reason.","l":0}],"typical":[{"t":"Isolated finding in an asymptomatic patient.","l":0},{"t":"Response to anxiety or pain.","l":0},{"t":"Inadequate anesthesia during surgery.","l":0},{"t":"Compensatory mechanism to maintain adequate CO and O<sub>2<\/sub> delivery:","l":0},{"t":"Hypovolemia.","l":1},{"t":"Anemia.","l":1},{"t":"Hypoxemia.","l":1},{"t":"Shock states.","l":1},{"t":"Other physiologic responses:","l":0},{"t":"Infection/sepsis.","l":1},{"t":"Hypercarbia.","l":1},{"t":"Fever.","l":1},{"t":"Hypoglycemia.","l":1},{"t":"Electrolyte abnormalities.","l":1},{"t":"Endocrine conditions.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Hyperthyroidism.","l":3},{"t":"Pheochromocytoma.","l":3},{"t":"CNS conditions, e.g. seizures.","l":1},{"t":"Side effect of medication:","l":0},{"t":"Ketamine.","l":1},{"t":"β<sub>2<\/sub>-Agonists.","l":1},{"t":"Anticholinergics.","l":1},{"t":"Inotropic agents.","l":1},{"t":"Sympathomimetics.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Caffeine.","l":3},{"t":"Over-the-counter cold remedies.","l":3},{"t":"Iatrogenic:","l":0},{"t":"During central line placement.","l":1},{"t":"During or after cardiac surgery, e.g. surgical manipulation of the right atrium.","l":1},{"t":"Pacemaker malfunction.","l":1},{"t":"Bladder distention, e.g. from blocked urinary catheter.","l":1},{"t":"ETT resting on carina.","l":1},{"t":"Acquired heart disease:","l":0},{"t":"Congestive heart failure, cardiomyopathy, or myocarditis.","l":1},{"t":"Cardiac tumors.","l":1}],"prevention":[{"t":"Maintain adequate oxygenation and ventilation.","l":0},{"t":"Ensure adequate depth of anesthesia.","l":0},{"t":"Verify correct position of ETT.","l":0},{"t":"Minimize use of medications that may increase HR.","l":0},{"t":"Maintain adequate volume status.","l":0},{"t":"Maintain adequate <b>hematocrit<\/b>.","l":0},{"t":"Verify appropriate serum glucose level.","l":0},{"t":"Maintain normothermia.","l":0}],"manifestations":[{"t":"<b>Tachycardia<\/b>:","l":0},{"t":"Older children may report fast heartbeats, or “heart jumping out of chest”.","l":1},{"t":"Chest pain or discomfort.","l":1},{"t":"Dizziness.","l":1},{"t":"Syncope.","l":1},{"t":"Altered mental status.","l":1},{"t":"Shortness of breath.","l":1},{"t":"Poor perfusion.","l":1},{"t":"Fatigue/lethargy.","l":1},{"t":"Nausea/vomiting.","l":1},{"t":"Infants and nonverbal children:","l":0},{"t":"Irritability.","l":1},{"t":"Poor feeding.","l":1},{"t":"Cardiac manifestations of prolonged <b>tachycardia<\/b>:","l":0},{"t":"Impaired diastolic filling.","l":1},{"t":"Decreased ventricular preload.","l":1},{"t":"Compromised CO.","l":1},{"t":"Monitors:","l":0},{"t":"Fast HR on ECG.","l":1},{"t":"<b>Hypotension<\/b>.","l":1},{"t":"Poor perfusion on pulse oximeter.","l":1},{"t":"Decreased ET CO<sub>2<\/sub> waveform.","l":1}],"similar":[{"t":"Monitor artifact:","l":0},{"t":"ECG “double counting”.","l":1},{"t":"Electrocautery interference.","l":1},{"t":"Pacemaker malfunction or inappropriate settings.","l":0},{"t":"Other tachyarrhythmias.","l":0},{"t":"Denervated heart status post-transplantation.","l":0},{"t":"Congenital heart conditions:","l":0},{"t":"Wolff-Parkinson-White syndrome.","l":1},{"t":"Other conduction system disorders.","l":1}],"management":[{"t":"<i>Pathologic tachyarrhythmias are rare in children without underlying cardiac disease. Sinus tachycardia is much more common in everyday practice, and this section focuses on the evalu<i>ation and treatment of sinus tachycardia in the pediatric patient.<\/i><\/i>","l":0},{"t":"Determine whether HR is too high for the patient’s age:","l":0},{"t":"Use age-appropriate normal value chart:","l":1},{"t":"Rates greater than 170 beats per minute in infants, and greater than 140 beats per minute in children, require further investigation.","l":2},{"t":"HRs &gt;200 beats per minute are unlikely to be sinus tachycardia.","l":2},{"t":"Assess the clinical situation.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Presence of hyperthermia.","l":3},{"t":"Infusion of inotropes.","l":3},{"t":"Verify HR and assess patient’s hemodynamic status:","l":0},{"t":"Check monitors of HR.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"ECG.","l":3},{"t":"Pulse oximeter.","l":3},{"t":"Arterial line.","l":3},{"t":"Check BP.","l":1},{"t":"Check peripheral pulse.","l":1},{"t":"Check ET CO<sub>2<\/sub> waveform for evidence of adequate CO.","l":1},{"t":"Check TEE or TTE for cardiac function and filling.","l":1},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Consider increasing FiO<sub>2<\/sub>.","l":1},{"t":"Obtain 12-lead ECG or print rhythm strip:","l":0},{"t":"Check presence of P waves and P wave axis before each QRS complex and QRS morphology to determine whether the rhythm is sinus.","l":1},{"t":"Assess the clinical situation to determine whether the tachycardia is a compensatory response to another problem:","l":0},{"t":"Treat potential causes of sinus tachycardia.","l":1},{"t":"Ensure adequate level of anesthesia:","l":0},{"t":"Verify that anesthetic agents (inhaled or IV) are being administered to the patient:","l":1},{"t":"Ensure patency of IV access.","l":2},{"t":"Verify that patient is not paralyzed without adequate anesthesia.","l":1},{"t":"<b>Check ALL infusions<\/b> (see Event 63, Drug Administration Error).","l":0},{"t":"Check the patient’s temperature.","l":0},{"t":"Check the surgical field for operative causes:","l":0},{"t":"Consider possibility of occult hemorrhage.","l":1},{"t":"Look for increased level of surgical stimulation.","l":1},{"t":"Evaluate the patient’s volume status:","l":0},{"t":"Assess response to IV fluid bolus, Trendelenburg positioning, or leg raising.","l":1},{"t":"<b>CVP<\/b>.","l":1},{"t":"TEE or TTE for ventricular filling.","l":1},{"t":"Liver size.","l":1},{"t":"Drug treatment of tachycardia in pediatric patients:","l":0},{"t":"Many of the drugs used can depress myocardial function and lower CO:","l":1},{"t":"β-blockers and calcium channel blockers are negative inotropes and depress the myocardium:","l":2},{"t":"CO is rate-dependent in pediatric patients.","l":3},{"t":"Specialist consultation is recommended prior to treatment with these drugs.","l":2},{"t":"Anticipate and plan for deterioration in patient status:","l":0},{"t":"Consider obtaining crash cart and placing pediatric defibrillator pads.","l":1},{"t":"Obtain 12-lead ECG if not already done.","l":1},{"t":"Call for pediatric cardiology consult.","l":1},{"t":"Continuously reassess for change in ECG or hemodynamic status.","l":1},{"t":"Be prepared to start CPR.","l":1},{"t":"Consider aborting procedure if problem persists.","l":1},{"t":"If the patient becomes unstable or has no pulse (see Event 94, Cardiac Arrest in the Pediatric Patient):","l":0},{"t":"Call for more help and notify surgeon.","l":1},{"t":"Start CPR.","l":1},{"t":"Call an OR or hospital code.","l":1},{"t":"Call for crash cart and defibrillator:","l":1},{"t":"Place pediatric defibrillator pads on patient.","l":2},{"t":"Synchronized cardioversion or defibrillation if patient is in a shockable rhythm.","l":1}],"complications":[{"t":"Hypotension.","l":0},{"t":"Hypervolemia.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Cote CJ, Lerman J, Todres ID. A practice of anesthesia for infants and children. 4th ed. Philadelphia: Saunders; 2009 p. 313-4."},{"t":"2. Davis PJ, Cladis FP, Motoyama EK. Smith’s anesthesia for infants and children. 8th ed. Philadelphia: Mosby; 2011 p. 1232-5."},{"t":"3. Fleming S, Thompson M, Stevens R, et al. Normal ranges of heart rate and respiratory rate in children from birth to 18 years of age: a systematic review of observational studies. Lancet 2011;377:1011-8."},{"t":"4. Fuhrman BP, Zimmerman JJ, Carcillo JA, et al. Pediatric critical care. 4th ed. Philadelphia: Saunders; 2011, p. 338-63."},{"t":"5. Kleinman ME, Chameides L, Schexnayder SM, et al. Pediatric advanced life support: 2010 American Heart Association guidelines for cardiopulmonary resuscitation and emergency cardiovascular care. Circulation 2010;122:S876-908."},{"t":"6. Park MK. Pediatric cardiology for practitioners. 5th ed. Philadelphia: Mosby; 2008, p. 417-8."}]},"table":{"rows":[["Age group","Respiratory rate: median (1st–99th percentile)","Heart rate: median (1st–99th percentile)"],["0-3 mo","43 (25-66)","143 (107-181) (term newborn at birth: 127 (90–164))"],["3-6 mo","41 (24-64)","140 (104-175)"],["6-9 mo","39 (23-61)","134 (98-168)"],["9-12 mo","37 (22-58)","128 (93-161)"],["12-18 mo","35 (21-53)","123 (88-156)"],["18-24 mo","31 (19-46)","116 (82-149)"],["2-3 yr","28 (18-38)","110 (76-142)"],["3-4 yr","25 (17-33)","104 (70-136)"],["4-6 yr","23 (17-29)","98 (65-131)"],["6-8 yr","21 (16-27)","91 (59-123)"],["8-12 yr","19 (14-25)","84 (52-115)"],["12-15 yr","18 (12-23)","78 (47-108)"],["15-18 yr","16 (11-22)","73 (43-104)"]],"notes":["Data from Fleming S, Thompson M, Stevens R, et al. Normal ranges of heart rate and respiratory rate in children from birth to 18 years of age: a systematic review of observational studies. Lancet 2011;377:1011.","*The RR and HR provided are based upon measurement in awake, healthy infants and children at rest. Many clinical findings besides the actual vital sign measurement must be taken into account when determining whether a specific vital sign is normal in an individual patient. Values for HR or RR that fall within normal limits for age may still represent abnormal findings that are caused by underlying disease in a particular infant or child."]}}];</script>
<script>/* Anim — animated heroes. (1) Patient-monitor engine (canvas) for rhythm/vital-sign events, (2) SVG scenes (scenes.js). */
(function(){
'use strict';
const TAU=Math.PI*2, clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const g=(x,c,w)=>Math.exp(-((x-c)/w)*((x-c)/w));
/* keyframe helper: kf([[t,v],...]) -> f(t) smooth interpolation */
function kf(a){return t=>{if(t<=a[0][0])return a[0][1];for(let i=1;i<a.length;i++){if(t<=a[i][0]){const p=a[i-1],q=a[i];return p[1]+(q[1]-p[1])*sm((t-p[0])/(q[0]-p[0]||1))}}return a[a.length-1][1]}}
const step=a=>t=>{let v=a[0][1];for(const [tt,x] of a){if(t>=tt)v=x}return v};
const C={ecg:'#37F58B',spo2:'#35D6FF',abp:'#FF5A5F',co2:'#FFD84D',eeg:'#C8A6FF',txt:'#E8EEFF',dim:'#6B7699'};

/* ---------- waveform generators ---------- */
function mkEcg(){
  const s={ph:0,beat:'n',rr:1,t:0,seed:Math.random()*100,vfA:1,cpr:0,irr:1};
  return (dt,p)=>{
    s.t+=dt;const r=p.rhythm||'sinus';
    if(r==='asys')return .02*Math.sin(s.t*1.7)+.012*Math.sin(s.t*9);
    if(r==='vf'){const a=.35+.35*Math.sin(s.t*.9+s.seed);return a*(Math.sin(s.t*TAU*4.3)+.7*Math.sin(s.t*TAU*6.1+1)+.5*Math.sin(s.t*TAU*2.7+2))*.7}
    if(r==='vt'){return .85*Math.sin(s.t*TAU*3)*(1-.12*Math.sin(s.t*TAU*.3))+.15*Math.sin(s.t*TAU*6)}
    if(r==='sine'){return .8*Math.sin(s.t*TAU*1.1)}
    if(r==='cpr'){return .5*Math.sin(s.t*TAU*1.85)+.15*Math.sin(s.t*TAU*3.7)}
    if(r==='af'){s.ph+=dt*(p.hr/60)*s.irr;if(s.ph>=1){s.ph-=1;s.irr=.55+Math.random()*.9}
      return .95*g(s.ph,.30,.011)-.18*g(s.ph,.33,.01)+.28*g(s.ph,.58,.06)+.04*Math.sin(s.t*TAU*7+s.seed)+.03*Math.sin(s.t*TAU*11)}
    s.ph+=dt*p.hr/60;
    if(s.ph>=1){s.ph-=1;const pv=p.pvc||0;s.beat=Math.random()<pv?'v':'n'}
    const x=s.ph,st=p.st||0,ta=p.ta==null?.3:p.ta,tw=p.tw||.07,qw=p.qw||1,pa=r==='svt'||r==='af'?0:(p.pa==null?.13:p.pa);
    if(s.beat==='v'){return 1.1*g(x,.2,.055)-.7*g(x,.34,.07)-.45*g(x,.62,.1)}
    let y=pa*g(x,.14,.035)-.1*g(x,.275,.009*qw)+1*g(x,.30,.011*qw)-.22*g(x,.325,.011*qw)+ta*g(x,.56,tw);
    y+=st*sm((x-.34)/.04)*(1-sm((x-.5)/.05));
    if(p.u)y+=p.u*g(x,.72,.04);
    if(p.osb)y+=p.osb*g(x,.36,.025);
    return y;
  };
}
function mkPleth(){const s={ph:0};return (dt,p)=>{s.ph+=dt*(p.hr||70)/60;if(s.ph>=1)s.ph-=1;const x=s.ph;const a=(p.pa==null?1:p.pa);
  const y=(x<.2?Math.sin(x/.2*Math.PI/2):Math.pow(1-(x-.2)/.8,1.5))+.14*g(x,.48,.05);return (p.base||0)+a*y*.9}}
function mkAbp(){const f=mkPleth();return (dt,p)=>{const y=f(dt,{hr:p.hr});const sb=p.sbp,db=p.dbp;return db+(sb-db)*y/1.0}}
function mkCo2(){const s={ph:0};return (dt,p)=>{s.ph+=dt*(p.rr||12)/60;if(s.ph>=1)s.ph-=1;const x=s.ph,pk=p.co2,b=p.cb||0,sh=p.shape||'n';
  if(sh==='flat')return .35*Math.sin(s.ph*TAU*3)*0+Math.random()*.4;
  let up=.06;if(sh==='shark')up=.22;
  let y;
  if(x<.38)y=b;
  else if(x<.38+up){y=b+(pk-b)*sm((x-.38)/up)*(sh==='shark'?.55:1)}
  else if(x<.86){const q=(x-.38-up)/(.48-up);y=sh==='shark'?b+(pk-b)*(.55+.45*q):pk*(1+.05*q)-(b?0:0);if(sh==='cleft')y-=pk*.22*g(x,.62,.05)}
  else if(x<.92){const q=sm((x-.86)/.06);y=(sh==='shark'?pk:pk*1.05)*(1-q)+b*q}
  else y=b;
  return y}}
function mkEeg(){const s={t:0,a:Math.random()*10};return (dt,p)=>{s.t+=dt;const sz=p.sz||0;
  const base=.35*Math.sin(s.t*TAU*9.3+s.a)+.28*Math.sin(s.t*TAU*13.7)+.2*Math.sin(s.t*TAU*5.1+1.2)+.1*(Math.random()-.5);
  if(sz>0){const sp=Math.pow(Math.max(0,Math.sin(s.t*TAU*3.2)),9);return base*(1-sz*.3)+sz*(1.8*sp*Math.sign(Math.sin(s.t*TAU*3.2+1))+.6*Math.sin(s.t*TAU*3.2))}
  return base}}

/* ---------- monitor engine ---------- */
const CH={
 ecg:{lab:'II',col:C.ecg,mk:mkEcg,rng:[-.45,1.25]},
 pleth:{lab:'SpO₂',col:C.spo2,mk:mkPleth,rng:[-.1,1.05]},
 abp:{lab:'ABP',col:C.abp,mk:mkAbp,rng:[30,200]},
 co2:{lab:'CO₂',col:C.co2,mk:mkCo2,rng:[-4,60],fill:true},
 eeg:{lab:'EEG',col:C.eeg,mk:mkEeg,rng:[-2.2,2.2]}
};
function monitor(el,ev,sc,opts){
  const mini=!!opts.mini, T=sc.T||12;
  const cv=document.createElement('canvas');el.appendChild(cv);
  const ctx=cv.getContext('2d');let W,H,dpr=Math.min(devicePixelRatio||1,2);
  const chans=(mini?sc.ch.slice(0,2):sc.ch).map(k=>({k,def:CH[k],gen:CH[k].mk(),buf:null,last:0}));
  let t=0,run=true,vis=true,raf=0,lastTs=0,acc=0,alive=true;
  const SW=mini?3.2:5.5; // seconds per sweep
  let cols=0;
  function size(){const r=el.getBoundingClientRect();W=Math.max(120,r.width);H=Math.max(70,r.height);cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
    cols=Math.floor((W*(mini?.64:.7))/ (mini?1.6:2));chans.forEach(c=>{c.buf=new Float32Array(cols).fill(NaN);c.x=0})}
  size();
  const state=()=>{const o={};for(const k in sc.p){o[k]=typeof sc.p[k]==='function'?sc.p[k](t%T):sc.p[k]}return o};
  function sample(dt){const p=state();
    chans.forEach(c=>{const kind=c.k;let v;
      if(kind==='ecg')v=c.gen(dt,p.ecgp||{hr:p.hr,rhythm:p.rhythm,st:p.st,ta:p.ta,tw:p.tw,qw:p.qw,pvc:p.pvc,u:p.u,osb:p.osb});
      else if(kind==='pleth')v=c.gen(dt,{hr:p.hr||0.001,pa:p.pa==null?clamp((p.spo2-60)/38,.12,1)*(p.sbp?clamp(p.sbp/110,.2,1.1):1):p.pa});
      else if(kind==='abp')v=c.gen(dt,{hr:p.hr,sbp:p.sbp,dbp:p.dbp});
      else if(kind==='co2')v=c.gen(dt,{rr:p.rr,co2:p.co2,cb:p.cb,shape:p.shape});
      else v=c.gen(dt,{sz:p.sz});
      c.v=v});
    return p}
  let P=sample(0);
  const lerpRng=(c,v)=>{const [a,b]=c.def.rng;return (v-a)/(b-a)};
  function draw(){
    const p=P,bg=getComputedStyle(document.documentElement).getPropertyValue('--monitor').trim()||'#0B1021';
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    const alarm=p.alarm&&(Math.floor(performance.now()/450)%2===0);
    // grid
    ctx.strokeStyle='rgba(120,150,255,.07)';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<W;x+=20){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<H;y+=20){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
    const pw=mini?W*.34:W*.3,tw=W-pw-(mini?6:10),top=mini?6:10,bot=mini?6:(opts.caption?34:12);
    const rh=(H-top-bot)/chans.length;
    chans.forEach((c,i)=>{

const DEPTH={splash:0,home:1,search:1,favs:1,settings:1,event:2};

function parse(){const h=(location.hash||'').replace(/^#\/?/,'');const [n,a]=h.split('/');return {name:n||(S.seen?'home':'splash'),arg:a}}
function route(){
  const {name,arg}=parse(); const key=name+'/'+(arg||'');
  if(key===curName)return;
  const prev=cur,prevName=curName; curName=key;
  if(prev&&prevName&&prevName.startsWith('home'))S.scroll.home=prev.scrollTop;
  killAnims();
  const v=document.createElement('div');v.className='view';
  const pn=(prevName||'').split('/')[0];
  const dir=!prev?'enter-fade':(DEPTH[name]>DEPTH[pn]?'enter-fwd':DEPTH[name]<DEPTH[pn]?'enter-back':'enter-fade');
  v.classList.add(dir);
  ({splash:vSplash,home:vHome,search:vSearch,favs:vFavs,settings:vSettings,event:vEvent}[name]||vHome)(v,arg);
  $('#views').appendChild(v);
  if(prev){prev.classList.remove('enter-fwd','enter-back','enter-fade');prev.classList.add('leave');setTimeout(()=>prev.remove(),230)}
  cur=v;
  if(name==='home'&&S.scroll.home&&pn==='event')v.scrollTop=S.scroll.home;
  navUpdate(name);
}
function navUpdate(name){

function renderItems(items,self,kind){
    if(kind==='reading')return `<ol class="refs">${items.map(it=>`<li>${it.t}</li>`).join('')}</ol>`;
  if(items.length===1&&!items[0].h)return `<p class="defn" style="margin:4px 0">${linkify(items[0].t,self)}</p>`;
  return `<ul class="lst">${items.map((it,i)=>{const nx=items[i+1];const par=nx&&!nx.h&&nx.l>it.l;const lp=par&&strip(it.t).split(/\s+/).length>6;return `<li class="${it.h?'h':''} ${it.e?'eg':''} ${par?'par':''} ${lp?'lp':''} l${it.l}">${linkify(it.t,self)}</li>`}).join('')}</ul>`;
}
const TX=[23,45,64,84,104,124],BX=[0,36,59,79,99,119],MG=[0,28,48,68,88,108];
function treeGuides(items,i){
  const it=items[i],L=Math.min(it.l,5);if(L===0||it.n)return '';
  const cont=j=>{for(let k=i+1;k<items.length;k++){const x=items[k];if(x.e||x.n)continue;if(x.h)return false;return x.l===j+1?true:x.l>j+1?(()=>{for(let q=k+1;q<items.length;q++){const y=items[q];if(y.e||y.n)continue;if(y.h)return false;if(y.l<=j+1)return y.l===j+1}return false})():false}return false};
  let g='';
  for(let j=0;j<L;j++){
    const c=cont(j),x=TX[j]-1-MG[L];
    if(c)g+=`<i class="gt" style="left:${x}px"></i>`;
    if(j===L-1&&!it.e)g+=`<i class="ge" style="left:${x}px;width:${BX[L]-TX[j]-1}px"></i>`;
  }
  return g;
}
function renderChecklist(items,self){
    return `<div class="prog"><div class="bar"><i></i></div><span>0 / 0</span><button class="mini" data-reset>Reset</button></div>
  <ul class="chk">${items.map((it,i)=>{
    const kid=items[i+1]&&!items[i+1].h&&!items[i+1].n&&items[i+1].l>it.l;const par=kid;const sub=kid&&it.l===1;
    const head=!it.h&&!it.n&&!it.e&&it.l===0;
    if(it.e)return `<li class="eg l${it.l}" data-l="${it.l}">${treeGuides(items,i)}<span class="tx">${linkify(it.t,self)}</span></li>`;
    if(it.n)return `<li class="note" data-l="0"><span class="tx">${linkify(it.t,self)}</span></li>`;
    return `<li class="l${it.l} ${it.h?'h':''} ${head?'head':''} ${sub?'sub':''} ${par?'par':''}" data-i="${i}" data-l="${it.l}" data-kid="${kid?1:0}">${treeGuides(items,i)}${kid?`<i class="gk" style="left:${TX[Math.min(it.l,5)]-1-MG[Math.min(it.l,5)]}px"></i>`:''}<span class="box">${I.check}</span><span class="tx">${linkify(it.t,self)}</span>${kid?`<span class="car">${I.chev}</span>`:''}</li>`}).join('')}</ul>`;
}
function vEvent(v,arg){
  const e=byId[+arg]; if(!e){location.hash='#/home';return}
  const c=catOf(e);
  S.recent=[e.id,...S.recent.filter(x=>x!==e.id)].slice(0,12);store.set('recent',S.recent);

    const shown=k==='typical'&&e.table?items.filter(it=>!it.h):items;

  const pe=byId[e.id-1],ne=byId[e.id+1];
  v.innerHTML=`<div class="hdr d-hdr"><div class="hdr-row"><button class="circle-btn" data-back aria-label="Back">${I.back}</button><span class="no">Event ${e.id}</span><button class="circle-btn" data-fav aria-label="Favorite" style="${isFav(e.id)?'color:#FFD067':''}">${isFav(e.id)?I.starF:I.star}</button></div>
    <div class="cc"><h1>${esc(e.title)}</h1><span class="cat-chip">${I[c.i].replace('<svg','<svg width="14" height="14"')} ${c.k}</span></div>${WAVE}</div>
  <div class="hero-card"><div class="scene" id="hero"></div></div>
  <div class="d-body"><div class="toolbar"><button class="emerg ${S.emerg?'on':''}" id="em"><span class="tri">${I.alert}</span><span class="lbl">Emergency mode</span></button><span class="sp"></span><button class="mini" id="ex">Expand all</button></div>
  <div class="jump" id="jump">${jump}</div><div id="secs" class="stagger">${secHtml}</div>
  <div class="nav-ev">${pe?`<button data-go="${pe.id}">‹ Previous<b>${pe.id}. ${esc(pe.title)}</b></button>`:''}${ne?`<button data-go="${ne.id}" style="text-align:right">Next ›<b>${ne.id}. ${esc(ne.title)}</b></button>`:''}</div>
  <div class="disclaimer">Source: Gaba DM, Fish KJ, Howard SK, Burden AR. <i>Crisis Management in Anesthesiology</i>, 2nd ed. (2015). The Catalog is a guide for health-care professionals — deviate whenever necessary for the situation; check doses and local protocols.</div></div>`;
  // animation

  $('#ex',v).onclick=function(){const all=$$('.sec',v);const open=all.every(s=>s.classList.contains('open'));all.forEach(s=>s.classList.toggle('open',!open));this.textContent=open?'Expand all':'Collapse all'};
  $('[data-back]',v).onclick=()=>{history.length>1?history.back():location.hash='#/home'};
  $('[data-fav]',v).onclick=function(){const i=S.fav.indexOf(e.id);i>=0?S.fav.splice(i,1):S.fav.push(e.id);store.set('fav',S.fav);const f=isFav(e.id);this.innerHTML=f?I.starF:I.star;this.style.color=f?'#FFD067':'';this.animate([{transform:'scale(1)'},{transform:'scale(1.4) rotate(12deg)'},{transform:'scale(1)'}],{duration:350});toast(f?'Added to favorites':'Removed from favorites')};
  v.addEventListener('click',ev=>{
    const sh=ev.target.closest('.sec-head');if(sh){sh.parentElement.classList.toggle('open');return}
    const j=ev.target.closest('[data-j]');if(j){const s=$('#s-'+j.dataset.j,v);s.classList.add('open');s.scrollIntoView({behavior:'smooth',block:'start'});$$('#jump button',v).forEach(b=>b.classList.toggle('act',b===j));return}
    const rs=ev.target.closest('[data-reset]');if(rs){$$('.chk li.done',v).forEach(l=>l.classList.remove('done'));prog(v);return}
    const li=ev.target.closest('.chk li');if(li&&!li.classList.contains('h')&&!li.classList.contains('note')&&!li.classList.contains('eg')&&!ev.target.closest('.xref')){
      if(ev.target.closest('.car')){fold(li);return}
      li.classList.toggle('done');prog(v)}
  });
  prog(v);
}
function fold(li){
  const f=li.classList.toggle('fold');const l=+li.dataset.l;let n=li.nextElementSibling;
  while(n&&(n.classList.contains('h')||+n.dataset.l>l)){
    if(!f)n.classList.remove('gone');else n.classList.add('gone');
    n=n.nextElementSibling}
  if(!f){ // re-collapse nested folded
    let n2=li.nextElementSibling;while(n2&&+n2.dataset.l>l){if(n2.classList.contains('fold')){const l2=+n2.dataset.l;let m=n2.nextElementSibling;while(m&&+m.dataset.l>l2){m.classList.add('gone');m=m.nextElementSibling}n2=m}else n2=n2.nextElementSibling}}
}
function prog(v){
  const all=$$('.chk li:not(.h):not(.note):not(.eg)',v);if(!all.length)return;const d=all.filter(l=>l.classList.contains('done')).length;
  $('.prog .bar i',v).style.width=(100*d/all.length)+'%';$('.prog span',v).textContent=d+' / '+all.length;
}

/* ---------- search ---------- */
let IDX=null;
function buildIdx(){IDX=EV.map(e=>{const secs=ORDER.filter(k=>e.s[k]&&k!=='reading').map(k=>({k,items:e.s[k].map(it=>strip(it.t))}));return {e,title:e.title.toLowerCase(),secs}})}
function vSearch(v){
  v.innerHTML=`<div class="hdr" style="padding-bottom:64px"><div class="hdr-row"><div class="logo-dot">${I.search}</div><div class="chip-coin"><i>${EV.length}</i>events</div></div><h1>Search</h1><p class="sub">Titles, drugs, signs, steps…</p>${WAVE}</div>
  <div class="sheet"><div class="searchbar"><div class="field">${I.search}<input id="q" placeholder="e.g. dantrolene, ST elevation, hypoxemia" value="${esc(S.q)}" autocomplete="off"></div></div><div id="res" class="res"></div></div>`;
  const inp=$('#q',v),res=$('#res',v);let t;
  const run=()=>{S.q=inp.value;const q=inp.value.trim().toLowerCase();if(!IDX)buildIdx();
    if(!q){res.innerHTML=`<div class="empty">${I.search}<br>Type to search all ${EV.length} events.<br>Try “dantrolene”, “intralipid”, “capnography”.</div>`;return}
    const toks=q.split(/\s+/).filter(Boolean);const out=[];
    for(const r of IDX){
      const inTitle=toks.every(t=>r.title.includes(t));let best=null;
      for(const s of r.secs){for(const it of s.items){const l=it.toLowerCase();if(toks.every(t=>l.includes(t))){best={k:s.k,t:it};break}}if(best)break}
      if(!best){const all=r.secs.map(s=>s.items.join(' ')).join(' ').toLowerCase();if(!inTitle&&!toks.every(t=>all.includes(t)))continue;
        if(!best){for(const s of r.secs){const it=s.items.find(x=>toks.some(t=>x.toLowerCase().includes(t)));if(it){best={k:s.k,t:it};break}}}}
      out.push({r,score:(inTitle?100:0)+(best?10:0)-(r.e.id/1000),best})}
    out.sort((a,b)=>b.score-a.score);
    if(!out.length){res.innerHTML=`<div class="empty">${I.search}<br>No results for “${esc(q)}”.</div>`;return}
    const hl=s=>{let h=esc(s);toks.forEach(t=>{h=h.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return h};
    res.innerHTML=out.slice(0,40).map((o,i)=>{const e=o.r.e,c=catOf(e);return `<button class="res-i" style="--i:${i};--c:${c.c}" data-go="${e.id}"><div class="rt"><span class="ev-num" style="--c:${c.c}">${e.id}</span><span>${hl(e.title)}</span></div>${o.best?`<div class="sn"><span class="sec-tag">${SEC[o.best.k].n}</span> · ${hl(o.best.t.length>170?o.best.t.slice(0,170)+'…':o.best.t)}</div>`:''}</button>`}).join('');
  };
  inp.oninput=()=>{clearTimeout(t);t=setTimeout(run,110)};run();
  setTimeout(()=>inp.focus({preventScroll:true}),450);
}

function vFavs(v){
  const fav=S.fav.filter(id=>byId[id]),rec=S.recent.filter(id=>byId[id]);
  const row=(id,i)=>{const e=byId[id],c=catOf(e);return `<button class="ev-row" style="--i:${i};--c:${c.c};opacity:1;background:var(--card);box-shadow:var(--shadow-s);animation:fadeUp .4s both;animation-delay:${i*40}ms" data-go="${id}"><span class="ev-num">${id}</span><span class="t">${esc(e.title)}</span><span class="go">${I.right}</span></button>`};
  v.innerHTML=hdr('Saved','Your favorites and recent events')+`<div class="sheet"><div class="row-h"><h2>Favorites</h2><span class="tag">${fav.length}</span></div>
  ${fav.length?`<div class="res">${fav.map(row).join('')}</div>`:`<div class="empty">${I.star}<br>No favorites yet.<br>Tap the star inside any event.</div>`}
  <div class="row-h"><h2>Recently viewed</h2>${rec.length?'<button id="clr">Clear</button>':''}</div>
  ${rec.length?`<div class="res">${rec.map(row).join('')}</div>`:`<div class="empty">Events you open will appear here.</div>`}</div>`;
  const clr=$('#clr',v);if(clr)clr.onclick=()=>{S.recent=[];store.set('recent',[]);curName=null;route()};
}

/* ---------- settings ---------- */
function vSettings(v){
  const seg=(k,opts)=>`<div class="seg" data-seg="${k}">${opts.map(([val,l])=>`<button data-v="${val}" class="${S[k]===val?'act':''}">${l}</button>`).join('')}</div>`;
  v.innerHTML=hdr('Settings','Make it comfortable for the OR')+`<div class="sheet"><div class="set">
  <div class="set-r"><div><b>Theme</b><small>Dark mode for dim rooms</small></div>${seg('theme',[['auto','Auto'],['light','Light'],['dark','Dark']])}</div>
  <div class="set-r"><div><b>Text size</b></div>${seg('fs',[['s','S'],['m','M'],['l','L']])}</div>
  <div class="set-r"><div><b>Emergency mode</b><small>Management shown first, red header</small></div><button class="sw ${S.emerg?'on':''}" data-sw="emerg"></button></div>
  <div class="set-r"><div><b>Animations</b><small>Turn off to reduce motion</small></div><button class="sw ${S.motion?'on':''}" data-sw="motion"></button></div></div>
  <div class="set"><div class="set-r"><div><b>About</b><small>Content from <i>Crisis Management in Anesthesiology</i>, 2nd ed. (Gaba, Fish, Howard, Burden; Elsevier 2015). Catalog of Critical Events: 99 events.</small></div></div>
  <div class="set-r"><div><b>Replay intro</b></div><button class="mini" id="intro">Open</button></div></div>
  <div class="disclaimer">This app is an educational aid based on the book’s Catalog of Critical Events. It does not replace clinical judgment, institutional protocols or current drug references. Always verify doses.</div></div>`;
  v.addEventListener('click',e=>{
    const sb=e.target.closest('.seg button');if(sb){const k=sb.parentElement.dataset.seg;S[k]=sb.dataset.v;store.set(k,S[k]);$$('button',sb.parentElement).forEach(b=>b.classList.toggle('act',b===sb));applyTheme();return}
    const sw=e.target.closest('.sw');if(sw){const k=sw.dataset.sw;S[k]=!S[k];store.set(k,S[k]);sw.classList.toggle('on',S[k]);applyTheme();if(k==='emerg')toast(S.emerg?'Emergency mode on':'Emergency mode off')}
    if(e.target.id==='intro')location.hash='#/splash'});
}

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();location.hash='#/event/'+g.dataset.go;return}
  const t=e.target.closest('[data-to]');if(t&&!t.closest('#nav')){location.hash='#/'+t.dataset.to;return}
  const ch=e.target.closest('.cat-head');if(ch){const c=ch.parentElement;const open=!c.classList.contains('open');$$('.cat.open').forEach(x=>x!==c&&x.classList.remove('open'));c.classList.toggle('open',open);S.openCat=open?c.dataset.cat:null;if(open)setTimeout(()=>c.scrollIntoView({behavior:'smooth',block:'nearest'}),420)}
});
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

/* ---------- boot ---------- */
function boot(data){EV=data;EV.forEach(e=>byId[e.id]=e);applyTheme();buildNav();window.addEventListener('hashchange',route);route()}
if(window.__EVENTS__)boot(window.__EVENTS__);else fetch('data/events.json').then(r=>r.json()).then(boot);
})();

;try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.Capacitor)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}catch(e){}
</script>
</body>
