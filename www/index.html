 in the ON position.","l":1},{"t":"Raised intraabdominal pressure:","l":0},{"t":"Insufflation of the peritoneal cavity for laparoscopic surgery.","l":1},{"t":"Obesity.","l":1},{"t":"Prone position.","l":1},{"t":"Ascites.","l":1},{"t":"Late-stage pregnancy.","l":1},{"t":"ETT problem:","l":0},{"t":"Kink in the ETT.","l":1},{"t":"Foreign body, secretions, or mucus plugging the ETT.","l":1},{"t":"Intubation:","l":1},{"t":"Endobronchial.","l":2},{"t":"Esophageal.","l":2},{"t":"Submucosal.","l":2},{"t":"Herniated ETT cuff obstructing the end of the ETT.","l":1},{"t":"Dissection of the interior surface of the ETT, leading to narrowing.","l":1},{"t":"Decreased pulmonary compliance:","l":0},{"t":"Pulmonary aspiration of gastric contents.","l":1},{"t":"Bronchospasm.","l":1},{"t":"Atelectasis.","l":1},{"t":"Decreased chest wall or diaphragmatic compliance.","l":1},{"t":"Pulmonary edema.","l":1},{"t":"Pneumothorax.","l":1},{"t":"TRALI.","l":1},{"t":"Coughing or bucking on ETT.","l":1},{"t":"Drug-induced problem:","l":0},{"t":"Opioid-induced chest wall rigidity.","l":1},{"t":"Inadequate muscle relaxation.","l":1},{"t":"MH.","l":1}],"typical":[{"t":"During induction of anesthesia.","l":0},{"t":"Immediately after intubation.","l":0},{"t":"Light anesthesia.","l":0},{"t":"During laparoscopic surgery.","l":0},{"t":"After change in patient or head position.","l":0},{"t":"Following manipulation of the ETT.","l":0},{"t":"Patients with COPD or asthma.","l":0},{"t":"After adding components to the breathing circuit.","l":0},{"t":"During or following surgery in or near the pleural cavities.","l":0}],"prevention":[{"t":"Optimize medical management of patients with COPD and asthma.","l":0},{"t":"Check the breathing circuit and the ETT carefully before use.","l":0},{"t":"Place the ETT carefully and position cuff just past the vocal cords.","l":0},{"t":"Maintain adequate anesthetic depth and muscle relaxation.","l":0},{"t":"Maintain insufflation pressures at minimum consistent with surgical needs.","l":0},{"t":"Use care when adding components to the breathing circuit.","l":0},{"t":"Plan anesthetic management to minimize bronchospasm, atelectasis, or buildup of secretions in patients at risk.","l":0},{"t":"Optimize mode of ventilation to minimize PIP.","l":0},{"t":"Minimize abdominal compression in patients in the prone position.","l":0}],"manifestations":[{"t":"High PIP alarm.","l":0},{"t":"Decreased compliance of the reservoir bag during manual ventilation.","l":0},{"t":"Decreased minute ventilation compared to set ventilator parameters, secondary to lower tidal volumes:","l":0},{"t":"Especially with pressure-controlled ventilation.","l":1},{"t":"Little or no excursion of the chest with inspiration.","l":1},{"t":"Reduced or altered breath sounds.","l":1},{"t":"Abnormal sound of the ventilator during inspiration.","l":0},{"t":"Decreased or abnormal ET CO<sub>2<\/sub> waveform.","l":0},{"t":"Fall in O<sub>2<\/sub> saturation.","l":0},{"t":"Profound <b>hypotension<\/b> not responsive to vasopressors or inotropes resulting from reduced venous return secondary to high PIP.","l":0},{"t":"<b>Tachycardia<\/b>.","l":0}],"similar":[{"t":"Faulty airway pressure gauge or airway pressure alarm.","l":0},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":0}],"management":[{"t":"Increase the FiO<sub>2<\/sub> to <b>100%<\/b> and reconfirm presence of ET CO<sub>2<\/sub>.","l":0},{"t":"<b>Verify the PIP.<\/b>","l":0},{"t":"Switch to manual ventilation using the anesthesia breathing circuit’s reservoir bag (adjust adjustable pressure limiting [APL] valve):","l":0},{"t":"Assess the pulmonary/breathing circuit compliance.","l":1},{"t":"If hypotensive, disconnect from circuit to rule out auto PEEP.","l":0},{"t":"Disconnect the Y piece from the ETT and squeeze the reservoir bag:","l":0},{"t":"If the airway pressure remains high, there is an obstruction in the breathing circuit:","l":1},{"t":"Ventilate using a backup ventilation system (non-rebreathing circuit, self-inflating bag, or mouth-to-ETT).","l":2},{"t":"Get help to replace or repair the obstruction in the circuit.","l":2},{"t":"If the airway pressure falls, the problem is in the ETT or lungs, not in the breathing circuit.","l":1},{"t":"Auscultate both sides of the patient’s chest:","l":0},{"t":"Listen for symmetry of breath sounds, wheezes, or crackles (rales).","l":1},{"t":"If breath sounds are asymmetric:","l":1},{"t":"Examine the ETT and rule out endobronchial intubation (see Event 30, Endobronchial Intubation).","l":2},{"t":"Check BP and HR, palpate the trachea, percuss the chest, and rule out pneumothorax (see Event 35, Pneumothorax).","l":2},{"t":"If breath sounds are symmetric but abnormal:","l":1},{"t":"Consider bronchospasm if wheezes are present (see Event 29, Bronchospasm).","l":2},{"t":"Consider pulmonary edema if crackles are present (see Event 20, Pulmonary Edema).","l":2},{"t":"<b>Exclude ETT obstruction:<\/b>","l":0},{"t":"Pass a suction catheter down the ETT and apply suction to clear any secretions.","l":1},{"t":"If it passes <i>freely, <\/i>the ETT is unlikely to be obstructed.","l":1},{"t":"If the ETT is markedly obstructed:","l":1},{"t":"Deflate the ETT cuff and check again.","l":2},{"t":"Consider placing fiberoptic bronchoscope to examine ETT and airway.","l":2},{"t":"If unable to relieve obstruction:","l":2},{"t":"Consider replacing the ETT over airway-exchange catheter.","l":3},{"t":"Retain ETT for later examination.","l":3},{"t":"Reintubate with a new ETT.","l":3},{"t":"Notify the surgical team of the problem and review any possible cause.","l":0},{"t":"Check for other causes of decreased chest compliance:","l":0},{"t":"Inadequate depth of anesthesia or muscle relaxation.","l":1},{"t":"Excessive insufflation of the abdomen.","l":1},{"t":"Unusual patient position or excessive surgical retraction.","l":1},{"t":"Change in patient’s position, e.g. slipping off prone position supports.","l":1},{"t":"Abnormal anatomy of the patient, e.g. kyphoscoliosis.","l":1},{"t":"MH (see Event 45, Malignant Hyperthermia).","l":1}],"complications":[{"t":"Barotrauma:","l":0},{"t":"Pneumothorax.","l":1},{"t":"Pneumomediastinum.","l":1},{"t":"Hypotension, cardiovascular compromise.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Cardiac arrest, if severe.","l":0},{"t":"Hypertension, tachycardia after resolution of high PIP, owing to delayed circulation time of IV fluid, vasopressors and inotropes.","l":0}],"reading":[{"t":"1. Gadsden J, Jones DL. Events. In: Gadsden J, Jones DL, editors. Anesthesiology oral board flash cards. New York: McGraw-Hill; 2011."},{"t":"2. Dorsch JA, Dorsch SE. Hazards of anesthesia machines and breathing systems. In: Dorsch JA, Dorsch SE, editors. Understanding anesthesia equipment. 5th ed. Philadelphia: Lippincott Williams &amp; Wilkins; 2008. p. 404-30."}]}},{"id":8,"title":"Hypertension","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"Hypertension is a rise in arterial BP of more than 20% above baseline or an absolute value of arterial BP above age-corrected limits.","l":0}],"etiology":[{"t":"Preexisting hypertension:","l":0},{"t":"Essential hypertension.","l":1},{"t":"Secondary hypertension.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Renal or endocrine causes.","l":3},{"t":"Preeclampsia.","l":3},{"t":"Catecholamine release:","l":0},{"t":"Laryngoscopy or intubation.","l":1},{"t":"Surgical stimulation.","l":1},{"t":"Emergence from anesthesia.","l":1},{"t":"Hypoxemia.","l":1},{"t":"Hypercarbia.","l":1},{"t":"Acute withdrawal of antihypertensive medication.","l":1},{"t":"Autonomic dysreflexia.","l":1},{"t":"Pheochromocytoma.","l":1},{"t":"Thyroid storm.","l":1},{"t":"Carcinoid syndrome.","l":1},{"t":"MH.","l":1},{"t":"Bladder distention.","l":1},{"t":"Cushing response to rising ICP.","l":0},{"t":"Administration of vasopressor medications.","l":0},{"t":"Anesthetic not being delivered as expected.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"IV.","l":2},{"t":"Infusion pump.","l":2},{"t":"Volatile anesthetic administration failure.","l":2},{"t":"Volume overload.","l":0},{"t":"Acute increase in afterload, e.g. cross-clamping of the aorta.","l":0}],"typical":[{"t":"Anesthesia in patients with chronic hypertension.","l":0},{"t":"During intubation or on emergence from general anesthesia.","l":0},{"t":"Inadequate depth of anesthesia relative to level of surgical stimulus.","l":0},{"t":"Vasopressor administration.","l":0},{"t":"Prolonged tourniquet time.","l":0},{"t":"In patients with pregnancy-induced hypertension.","l":0},{"t":"Acute drug intoxication, e.g. cocaine.","l":0},{"t":"Drug withdrawal.","l":0}],"prevention":[{"t":"Treat preoperative hypertension adequately:","l":0},{"t":"Continue preoperative administration of antihypertensive medications up to the time of surgery:","l":1},{"t":"Consider holding angiotensin-converting enzyme inhibitor (ACEI) and angiotensin receptor blocker (ARB) on the day of surgery to reduce risk of intraoperative hypotension.","l":2},{"t":"Consider postponing elective surgery if severe hypertension is present.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Systolic blood pressure [SBP] &gt;200 mm Hg.","l":3},{"t":"Diastolic blood pressure [DBP] &gt;110 mm Hg.","l":3},{"t":"Postpone elective surgery if organ dysfunction is present.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Myocardial ischemia.","l":3},{"t":"Congestive heart failure [CHF].","l":3},{"t":"Neurologic dysfunction.","l":3},{"t":"Consider <b>arterial line<\/b> for continuous BP monitoring.","l":0},{"t":"Consider TTE to assess myocardial ischemia or heart failure.","l":0},{"t":"Consider the use of clonidine as oral premedication.","l":0},{"t":"<b>Avoid ketamine<\/b> for induction of anesthesia in known hypertensive patients.","l":0},{"t":"Anticipate times of high levels of surgical stimulation and prophylactically increase the depth of anesthesia.","l":0},{"t":"<b>Avoid<\/b> hypervolemia, e.g. transurethral resection of the prostate [TURP] cases.","l":0},{"t":"Carefully titrate vasoactive medications.","l":0},{"t":"Maintain oxygenation and ventilation at normal levels.","l":0},{"t":"Use BP monitoring equipment properly.","l":0},{"t":"Treat severe pain, hypoxemia, or bladder distention in the postoperative period.","l":0},{"t":"Minimize tubing between vasopressor infusion pump and patient and use carrier infusion to prevent accumulation of vasopressor in tubing being inadvertently bolused into patient:","l":0},{"t":"Consider using a separate IV for drug infusions.","l":1}],"manifestations":[{"t":"Rise in, or high, arterial pressure (systolic, diastolic, or mean).","l":0},{"t":"If <b>hypertension<\/b> is due to light anesthesia, the patient may exhibit:","l":0},{"t":"Tachypnea if breathing spontaneously.","l":1},{"t":"<b>Tachycardia<\/b>.","l":1},{"t":"Sweating.","l":1},{"t":"Tearing.","l":1},{"t":"Pupillary dilation.","l":1},{"t":"Movement.","l":1},{"t":"<b>Bradycardia<\/b> may occur as a result of baroreceptor activity, especially if the cause of <b>hypertension<\/b> is autonomic dysreflexia, raised ICP, or administration of vasopressor, e.g. phenylephrine.","l":1}],"similar":[{"t":"Artifacts of BP measurement system:","l":0},{"t":"Motion artifact with NIBP device.","l":1},{"t":"Inappropriately small NIBP cuff.","l":1},{"t":"Faulty or inaccurately zeroed transducer.","l":1},{"t":"Transducer placed lower than the patient’s heart.","l":1},{"t":"Resonance artifact of measurement.","l":1},{"t":"Drug administration error (see Event 63, Drug Administration Error).","l":0},{"t":"MH (see Event 45, Malignant Hyperthermia).","l":0},{"t":"Hypertensive disorders of pregnancy (see Event 88, Preeclampsia-Eclampsia).","l":0},{"t":"Acute drug intoxication.","l":0},{"t":"Acute drug withdrawal.","l":0},{"t":"Thyrotoxicosis (see Event 49, Thyroid Storm).","l":0},{"t":"Pheochromocytoma.","l":0},{"t":"Carcinoid syndrome.","l":0},{"t":"Raised ICP.","l":0},{"t":"Autonomic dysreflexia (see Event 17, Autonomic Dysreflexia).","l":0}],"management":[{"t":"Verify that hypertension is real:","l":0},{"t":"If using a NIBP monitoring device:","l":1},{"t":"Repeat measurement.","l":2},{"t":"Check for artifact of NIBP system.","l":2},{"t":"Consider moving BP cuff to another site.","l":2},{"t":"Measure BP manually.","l":2},{"t":"If using an <b>arterial line<\/b>:","l":1},{"t":"Check transducer height.","l":2},{"t":"Zero arterial transducer.","l":2},{"t":"Flush the <b>arterial line<\/b>.","l":2},{"t":"Correlate with NIBP measurement.","l":2},{"t":"Check that there are no kinks in the <b>arterial line<\/b> tubing.","l":2},{"t":"<b>Check drug administration:<\/b>","l":0},{"t":"If infusions of vasoactive drugs or IV anesthetics are being administered:","l":1},{"t":"Check tubing from source to patient.","l":2},{"t":"Check that infusion devices are set properly and the intended drugs are running at the desired rate.","l":2},{"t":"Check the dosage calculations carefully.","l":2},{"t":"Check the concentration of the medications being infused.","l":2},{"t":"Check that the carrier IV line is running at an appropriate rate.","l":2},{"t":"Check for IV disconnection or infiltration.","l":2},{"t":"If administering a volatile anesthetic:","l":1},{"t":"Check that the vaporizer is set correctly.","l":2},{"t":"Check the level of liquid anesthetic in the vaporizer.","l":2},{"t":"Check the inspired concentration of anesthetic.","l":2},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Check ABGs if there is any question of hypoxemia or hypercarbia (see Event 10, Hypoxemia, and Event 32, Hypercarbia).","l":1},{"t":"Assess depth of anesthesia:","l":0},{"t":"Assess clinical signs of anesthetic depth.","l":1},{"t":"Look for a new surgical stimulus.","l":1},{"t":"Increase anesthesia/analgesia as necessary:","l":1},{"t":"Increase delivery of volatile or IV anesthetic.","l":2},{"t":"Administer bolus of IV opioid.","l":2},{"t":"Administer bolus of IV anesthetic.","l":2},{"t":"If using a continuous regional anesthesia technique, administer additional local anesthetic via the catheter.","l":2},{"t":"Ask surgeon to administer local anesthesia at surgical site.","l":2},{"t":"Consider use of processed EEG to assess depth of anesthesia.","l":1},{"t":"For isolated hypertension not resulting from an identifiable cause:","l":0},{"t":"Decrease surgical stimulation, e.g. empty bladder in a patient with autonomic dysreflexia.","l":1},{"t":"Check for secondary manifestations of hypertension (tachycardia, ST-T wave changes [see Event 12, ST Segment Change]).","l":1},{"t":"If additional treatment is necessary, consider:","l":1},{"t":"Deepening the anesthetic.","l":2},{"t":"β-Blockade (use with caution in patients with asthma/COPD):","l":2},{"t":"<b>Labetalol<\/b> IV, <b>5 to 10 mg<\/b> bolus.","l":3},{"t":"<b>Esmolol<\/b> IV, <b>10 to 50 mg<\/b> bolus.","l":3},{"t":"Metoprolol IV, <b>1 to 2 mg<\/b> bolus.","l":3},{"t":"<b>Hydralazine<\/b> IV, <b>2 to 4 mg<\/b> bolus.","l":2},{"t":"Nitroglycerine (NTG) IV infusion, <b>0.1 to 2 μg/kg/min<\/b>.","l":2},{"t":"<b>Nitroprusside<\/b> IV infusion, <b>0.1 to 3 μg/kg/min<\/b>.","l":2},{"t":"Calcium channel blockade:","l":2},{"t":"Verapamil IV, <b>2.5 mg<\/b> increments.","l":3},{"t":"Diltiazem IV, loading dose <b>0.25 mg/kg<\/b> over 2 min. If IV infusion is necessary, 10-25 mg/hr after IV bolus dose.","l":3},{"t":"Nicardipine IV infusion, 3 to 15 mg/hr.","l":3},{"t":"α-Blockade:","l":2},{"t":"Phentolamine IV, <b>0.5 to 1 mg<\/b> (see Event 17, Autonomic Dysreflexia).","l":3},{"t":"Review fluid management:","l":0},{"t":"If volume overload is likely, administer <b>furosemide<\/b> IV, <b>5 to 10 mg<\/b>.","l":1},{"t":"Check for the presence of a distended bladder; place a urinary catheter if the bladder is distended.","l":0},{"t":"Raised ICP may require urgent therapy:","l":0},{"t":"<b>Mannitol<\/b> IV, 0.5 g/kg.","l":1},{"t":"<b>Furosemide<\/b> IV, <b>5 to 10 mg<\/b>.","l":1},{"t":"Hyperventilation to partial pressure of carbon dioxide in arterial blood (PaCO<sub>2<\/sub>) of 25 to 30 mm Hg.","l":1},{"t":"Rapid neurosurgical intervention.","l":1},{"t":"Exclude MH as a diagnosis (see Event 45, Malignant Hyperthermia).","l":0}],"complications":[{"t":"Myocardial ischemia/infarction.","l":0},{"t":"Arrhythmias.","l":0},{"t":"CHF/pulmonary edema.","l":0},{"t":"Increased operative blood loss.","l":0},{"t":"Poor surgical visibility, e.g. endoscopic procedures.","l":0},{"t":"Awareness (if insufficient anesthetic).","l":0},{"t":"Raised ICP.","l":0},{"t":"Disruption of vascular suture lines.","l":0},{"t":"Cerebral hemorrhage (including ruptured aneurysm) or hypertensive encephalopathy.","l":0}],"reading":[{"t":"1. Levy JH. Management of systemic and pulmonary hypertension. Tex Heart Inst J 2005;32:467-71."},{"t":"2. Paix AD, Runciman WB, Horan BF, Chapman MJ, Currie M. Crisis management during anaesthesia: hypertension. Qual Saf Health Care 2005;14:e12."},{"t":"3. Howell SJ, Sear JW, Foex P. Hypertension, hypertensive heart disease and perioperative cardiac risk. Br J Anaesth 2004;92:570-84."}]}},{"id":9,"title":"Hypotension","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"Hypotension is a fall in arterial BP of more than 20% below baseline or an absolute value of SBP below 90 mm Hg or of MAP below 60 mm Hg.","l":0}],"etiology":[{"t":"Decreased preload:","l":0},{"t":"Hypovolemia, e.g. hemorrhage including occult blood loss.","l":1},{"t":"Surgical maneuvers restricting venous return.","l":1},{"t":"Elevated intrathoracic pressure, e.g. pneumothorax.","l":1},{"t":"Patient position or gravid uterus.","l":1},{"t":"PE.","l":1},{"t":"Cardiac tamponade.","l":1},{"t":"Primary cardiac causes.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Diastolic dysfunction.","l":3},{"t":"Valvular regurgitation.","l":3},{"t":"Decreased contractility:","l":0},{"t":"Inotropic depressant drugs, e.g. anesthetic agents.","l":1},{"t":"CHF, e.g. cardiomyopathy.","l":1},{"t":"Myocardial ischemia/infarction.","l":1},{"t":"Hypoxemia.","l":1},{"t":"Valvular heart disease.","l":1},{"t":"Abrupt increase in afterload.","l":1},{"t":"Decreased systemic vascular resistance (SVR):","l":0},{"t":"Drug effects.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Anesthetics.","l":3},{"t":"Vasodilators.","l":3},{"t":"Shock.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Sepsis.","l":3},{"t":"Anaphylaxis.","l":3},{"t":"Neurogenic.","l":3},{"t":"Endocrine abnormalities:","l":1},{"t":"Addisonian crisis, hypothyroidism, hypoglycemia, after removal of pheochromocytoma.","l":2},{"t":"Abrupt change in mechanical afterload.","l":1},{"t":"Arrhythmias:","l":0},{"t":"Tachycardia or irregular rhythm (loss of ventricular filling).","l":1},{"t":"Bradycardia.","l":1}],"typical":[{"t":"After anesthetic induction and before surgical incision.","l":0},{"t":"Hypovolemia.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Trauma.","l":2},{"t":"Chronic hypertension.","l":2},{"t":"Neuraxial anesthesia.","l":0},{"t":"Surgery with major fluid shifts.","l":0},{"t":"Surgery on or near major vascular structures.","l":0},{"t":"Patients on ACEIs or ARBs.","l":0},{"t":"Patients with history of chronic amphetamine abuse.","l":0},{"t":"Patients with history of cardiovascular disease.","l":0},{"t":"Position other than supine (especially in obese patients).","l":0},{"t":"Peritoneal insufflation.","l":0},{"t":"During arrhythmias.","l":0}],"prevention":[{"t":"Carefully assess cardiovascular status preoperatively, checking for:","l":0},{"t":"Patient history and fluid status.","l":1},{"t":"Increased HR or orthostatic hypotension.","l":1},{"t":"<b>CVP<\/b> or jugular venous filling.","l":1},{"t":"Preoperative <b>hematocrit<\/b>.","l":1},{"t":"Ensure adequate intravascular volume before induction of anesthesia:","l":0},{"t":"Consider fluid loading prior to induction of anesthesia or neuraxial blockade.","l":1},{"t":"Consider placing <b>arterial line<\/b> prior to induction of anesthesia in patients at high risk of intraoperative hypotension.","l":0},{"t":"Correlate invasive BP with NIBP early in case.","l":0},{"t":"<b>Avoid<\/b> high doses of anesthetic agents.","l":0},{"t":"Treat bradycardia early in patients with neuraxial blockade.","l":0},{"t":"Administer drugs slowly if hypotension is a known side effect, e.g. vancomycin.","l":0},{"t":"Use appropriate doses of local anesthetics in single-shot regional techniques and carefully titrate local anesthetics in continuous regional techniques.","l":0},{"t":"Monitor surgical activities and track blood loss carefully.","l":0},{"t":"Consider holding ACEIs and ARBs prior to surgery.","l":0}],"manifestations":[{"t":"Fall in or low BP (systolic, diastolic, or mean):","l":0},{"t":"NIBP cuff with low value or continually cycling.","l":1},{"t":"Dampened or low arterial line waveform.","l":1},{"t":"Mental status changes:","l":0},{"t":"Nausea and/or vomiting in conscious patient.","l":1},{"t":"Weak or absent peripheral pulses.","l":0},{"t":"Decreased O<sub>2<\/sub> saturation or inability of pulse oximeter to obtain a satisfactory reading.","l":0},{"t":"<b>Arrhythmias<\/b>, including sinus <b>tachycardia<\/b>.","l":0},{"t":"Decreased ET CO<sub>2<\/sub>.","l":0},{"t":"Decreased urine output.","l":0},{"t":"Diminished heart sounds.","l":0},{"t":"Skin mottling.","l":0}],"similar":[{"t":"Artifact of BP measurement system:","l":0},{"t":"Motion artifact with NIBP device.","l":1},{"t":"Incorrect size of NIBP cuff.","l":1},{"t":"Faulty BP transducer.","l":1},{"t":"Transducer placed higher than patient.","l":1},{"t":"Loose connections on arterial line.","l":1},{"t":"Vasospasm of radial artery or subclavian stenosis.","l":0},{"t":"Lack of correlation of BPs on dependent and nondependent arms in patients in lateral decubitus position.","l":0}],"management":[{"t":"<i>Rule out rapidly lethal, often missed causes of severe hypotension: hemorrhage (occult blood loss), anesthetic overdose, myocardial ischemia, hypertrophic obstructive cardiomyopathy, pneumothorax, auto-PEEP, anaphylaxis, and surgical causes (e.g. pneumoperitoneum, infe<i>rior vena cava [IVC] compression).<\/i><\/i>","l":0},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Check the O<sub>2<\/sub> saturation:","l":1},{"t":"Increase the FiO<sub>2<\/sub> if O<sub>2<\/sub> saturation is low or if hypotension is severe.","l":2},{"t":"Auscultate breath sounds (see Event 35, Pneumothorax, Event 16, Anaphylactic and Anaphylactoid Reactions, and Event 29, Bronchospasm).","l":1},{"t":"Check airway pressure (see Event 7, High Peak Inspiratory Pressure).","l":1},{"t":"Verify that the patient is hypotensive:","l":0},{"t":"Repeat NIBP measurement once.","l":1},{"t":"Flush <b>arterial line<\/b> if present.","l":1},{"t":"Palpate pulse and check capnograph.","l":1},{"t":"If no pulse, start CPR (see Event 2, Cardiac Arrest):","l":1},{"t":"Call for help and get crash cart with defibrillator.","l":2},{"t":"If pulse is strong and other vital signs stable, consider artifact or transient:","l":1},{"t":"Repeat NIBP measurement, ensuring nobody is leaning on cuff.","l":2},{"t":"Measure at a different site, e.g. leg.","l":2},{"t":"Measure BP manually.","l":2},{"t":"Re-zero the <b>arterial line<\/b> transducer.","l":2},{"t":"Check that the transducer is at the correct level.","l":2},{"t":"Ensure that the transducer is connected to the appropriate monitoring cable of the physiologic monitor.","l":2},{"t":"Check the <b>arterial line<\/b> for any open or loose stopcocks or connections.","l":2},{"t":"Reduce or turn off any vasodilating drugs, including anesthetics.","l":0},{"t":"If anaphylaxis is suspected, stop administration of possible antigen and administer epi<b>nephrine and IV fluids (see Event 16, Anaphylactic and Anaphylactoid Reactions).<\/b>","l":0},{"t":"Expand circulating blood volume:","l":0},{"t":"Lift the patient’s legs above the level of the heart or put the patient into the Trendelenburg position.","l":1},{"t":"Administer IV fluids rapidly:","l":1},{"t":"If history of CHF, use multiple small boluses and reevaluate frequently.","l":2},{"t":"Use <b>crystalloid<\/b>, <b>colloids<\/b>, or blood for rapid volume expansion.","l":1},{"t":"Ensure sufficient <b>large-bore<\/b> IV access if continued volume replacement is necessary:","l":1},{"t":"Call for help.","l":2},{"t":"Consider placement of IO line if peripheral IV access is difficult or not possible.","l":2},{"t":"Communicate situation to surgeons:","l":1},{"t":"Check for retractors causing venous compression.","l":2},{"t":"Check for ongoing or occult blood loss.","l":2},{"t":"Discuss need for additional expert surgical help or whether the surgical procedure should be terminated.","l":2},{"t":"Treat severe hypotension with vasopressors:","l":0},{"t":"<b>Ephedrine<\/b> IV, <b>5 to 50 mg<\/b>.","l":1},{"t":"<b>Phenylephrine<\/b> IV, <b>50 to 200 μg<\/b>.","l":1},{"t":"<b>Epinephrine<\/b> IV, <b>10 to 100 μg<\/b>.","l":1},{"t":"<b>Vasopressin<\/b> IV, <b>1 to 4 units<\/b>.","l":1},{"t":"Repeat as necessary to maintain an acceptable BP.","l":1},{"t":"Consider infusion of vasopressors with ongoing needs.","l":1},{"t":"Consider infusion of <b>methylene blue<\/b> IV in cases of sepsis or hypotension secondary to ACEIs and ARBs.","l":1},{"t":"Consider administration of IV steroid (see Event 38, Addisonian Crisis):","l":1},{"t":"Administer <b>hydrocortisone<\/b> IV, <b>100 mg<\/b> bolus, repeat q8h.","l":2},{"t":"Elucidate and correct the underlying cause of hypotension:","l":0},{"t":"Consider placement of an <b>arterial line<\/b> and urinary catheter if not present.","l":1},{"t":"TEE or TTE to assess myocardial filling and function.","l":1},{"t":"Consider placement of PA catheter for fluid management.","l":1},{"t":"Check urine output, <b>hematocrit<\/b>, and fluid balance.","l":1},{"t":"Consider placing an <b>arterial line<\/b> into the central arterial circulation (usually the femoral artery), especially if overall assessment is consistent with a failure of the radial artery pressure to correlate with central arterial pressure.","l":1},{"t":"Check <b>ABG<\/b> and labs, including hemoglobin (Hgb), electrolytes, calcium, lactate, cardiac enzymes, type and cross (see Event 46, Metabolic Acidosis, and Event 13, The Septic Patient).","l":1},{"t":"Evaluate myocardial status:","l":1},{"t":"Check the ECG and/or TEE/TTE for signs of ischemia (see Event 12, ST Segment Change).","l":2}],"complications":[{"t":"Myocardial ischemia/infarction.","l":0},{"t":"Cerebral ischemia.","l":0},{"t":"Acute renal failure.","l":0},{"t":"CHF or pulmonary edema from excessive fluid administration.","l":0},{"t":"Hypertension from treatment of artifact or transient.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Bijker JB, van Klei WA, Vergouwe Y, et al. Intraoperative hypotension and 1-year mortality after noncardiac surgery. Anesthesiology 2009;111:1217-26."},{"t":"2. Morris RW, Watterson LM, Westhorpe RN, Webb RK. Crisis management during anaesthesia: hypotension. Qual Saf Health Care 2005;14:e11."},{"t":"3. Moitra V, Gabrielli A, Maccioli GA, O’Connor MF. Anesthesia advanced circulatory life support. Can J Anesth 2012;59:586-603."},{"t":"4. Subramaniam B, Talmor D. Echocardiography for management of hypotension in the intensive care unit. Crit Care Med 2007;35:S401-7."},{"t":"5. Pollard JB. Cardiac arrest during spinal anesthesia: common mechanisms and strategies for prevention. Anesth Analg 2001;92:252-6."}]}},{"id":10,"title":"Hypoxemia","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"A fall in O<sub>2<\/sub> saturation of more than 5%, an absolute value of O<sub>2<\/sub> saturation below 90%, or an absolute value of partial pressure of arterial oxygen (PaO<sub>2<\/sub>) below 60 mm Hg.","l":0}],"etiology":[{"t":"Low FiO<sub>2<\/sub>:","l":0},{"t":"Relative (inadequate for the patient’s condition).","l":1},{"t":"Absolute:","l":1},{"t":"Problems delivering O<sub>2<\/sub> to the breathing circuit.","l":2},{"t":"Inadequate alveolar ventilation.","l":0},{"t":"Ventilation/perfusion (V/Q) mismatch.","l":0},{"t":"Anatomic shunt.","l":0},{"t":"Excessive metabolic O<sub>2<\/sub> demand.","l":0},{"t":"Low cardiac output (CO).","l":0},{"t":"Diffusion abnormality (usually chronic, not acute).","l":0}],"typical":[{"t":"Inadequate ventilation from any cause:","l":0},{"t":"Failure to maintain the airway during general or regional anesthesia, or during sedation.","l":1},{"t":"Failure to ventilate adequately during general anesthesia, e.g. surgery with pneumoperitoneum.","l":1},{"t":"Morbid obesity.","l":1},{"t":"Patients with increased alveolar–arterial (A–a) gradient:","l":0},{"t":"Preexisting lung disease.","l":1},{"t":"Pulmonary edema.","l":1},{"t":"Aspiration of gastric contents.","l":1},{"t":"Atelectasis.","l":1},{"t":"Pulmonary embolus.","l":1},{"t":"One-lung ventilation.","l":1},{"t":"Patients at extremes of age are more likely to have anatomic and physiologic features or disease states that compromise oxygenation.","l":0}],"prevention":[{"t":"Perform a careful check of the anesthesia machine, O<sub>2<\/sub> analyzer, and alarms before use.","l":0},{"t":"Preoxygenate for 3 minutes with a goal of obtaining an ET O<sub>2<\/sub> &gt; <b>80%<\/b>:","l":0},{"t":"Alternatively, have patient take 10 large breaths.","l":1},{"t":"Consider preoxygenating in reverse Trendelenburg, especially in patients with decreased functional residual capacity (FRC), e.g. obese patients.","l":1},{"t":"Monitor and adjust FiO<sub>2<\/sub> and ventilation as necessary to maintain patient oxygenation.","l":0},{"t":"Consider adding 5 cm H<sub>2<\/sub>O PEEP during mechanical ventilation.","l":0},{"t":"<b>Avoid<\/b> prolonged spontaneous ventilation during general anesthesia in patients with lung disease or when the patient is not in the supine position.","l":0},{"t":"Evaluate the effect of positioning on the patient’s cardiopulmonary function prior to incision, e.g. steep Trendelenburg during robotic prostatectomy.","l":0}],"manifestations":[{"t":"Decreased or low O<sub>2<\/sub> saturation measured by pulse oximetry is the cardinal sign of <b>hypoxemia<\/b>.","l":0},{"t":"Pulse oximetry may not function properly in the presence of:","l":0},{"t":"<b>Hypothermia<\/b>.","l":1},{"t":"Poor peripheral circulation.","l":1},{"t":"Artifacts owing to electrocautery, motion, ambient lighting, poor contact, blue/black-based nail polish, or dyes.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Methylene blue.","l":3},{"t":"Indigo carmine.","l":3},{"t":"<b>Cyanosis<\/b> or dark blood in the surgical field:","l":0},{"t":"Clinically detectable <b>cyanosis<\/b> corresponds to an arterial O<sub>2<\/sub> saturation of approximately 85%, requires 5 g of reduced Hgb, and may be masked by anemia.","l":1},{"t":"Under anesthesia, the circulatory and respiratory responses to <b>hypoxemia<\/b> are blunted by anesthetic agents.","l":0},{"t":"Late signs of <b>hypoxemia<\/b> include:","l":0},{"t":"<b>Bradycardia<\/b>.","l":1},{"t":"Myocardial <b>arrhythmias<\/b>/ischemia.","l":1},{"t":"<b>Tachycardia<\/b>.","l":1},{"t":"<b>Hypotension<\/b>.","l":1},{"t":"<b>Cardiac arrest<\/b>.","l":1}],"similar":[{"t":"Pulse oximeter artifact.","l":0},{"t":"Blood gas analysis of venous blood.","l":0},{"t":"Methemoglobinemia.","l":0},{"t":"Low CO.","l":0}],"management":[{"t":"Assume that low O<sub>2<\/sub> saturation indicates hypoxemia until proven otherwise:","l":0},{"t":"Development of hypoxemia within 10 minutes of intubation <b>must<\/b> be assumed to be due to an esophageal intubation unless capnography demonstrates a persistent normal ET CO<sub>2<\/sub> waveform or the ETT can be clearly visualized passing through the vocal cords with direct or video-assisted laryngoscopy.","l":1},{"t":"Increase FiO<sub>2<\/sub> to <b>100%<\/b>:","l":0},{"t":"Use high O<sub>2<\/sub> flow to equilibrate the breathing circuit rapidly.","l":1},{"t":"Verify that FiO<sub>2<\/sub> approaches <b>100%<\/b>.","l":1},{"t":"Check that ventilation is adequate:","l":0},{"t":"Check ET CO<sub>2<\/sub>:","l":1},{"t":"Maintain tidal volumes (<b>6 to 8 mL/kg<\/b> predicted body weight) and adjust respiratory rate (RR) as indicated.","l":2},{"t":"Consider the addition of 5 cm H<sub>2<\/sub>O PEEP to breathing circuit to prevent atelectasis.","l":1},{"t":"Check position of the ETT:","l":1},{"t":"Direct visualization of ETT cuff passing through the cords or visualization of tracheal rings and the carina via bronchoscopy.","l":2},{"t":"Adjust the position of the ETT if necessary.","l":2},{"t":"Check PIP:","l":1},{"t":"High PIP (see Event 7, High Peak Inspiratory Pressure):","l":2},{"t":"Switch to hand ventilation to assess pulmonary compliance.","l":3},{"t":"If cardiovascularly stable, hand ventilate with large tidal volumes to expand collapsed lung segments.","l":3},{"t":"Auscultate breath sounds and assess symmetry of chest movement to rule out bronchospasm, endobronchial intubation, or pneumothorax (see Event 29, Bronchospasm, Event 30, Endobronchial Intubation, and Event 35, Pneumothorax).","l":3},{"t":"Low PIP:","l":2},{"t":"Check for leak (see Event 69, Major Leak in the Anesthesia Breathing Circuit).","l":3},{"t":"Auscultate breath sounds and assess symmetry of chest movement.","l":3},{"t":"Consider asynchrony of the ventilator with patient’s effort to breathe:","l":1},{"t":"Check level of neuromuscular blockade and redose muscle relaxant if indicated.","l":2},{"t":"Obtain <b>ABG<\/b> and ask blood gas laboratory to perform co-oximetry if presence of carboxyhemoglobin or methemoglobin is suspected.","l":1},{"t":"<b>Check vital signs.<\/b>","l":0},{"t":"Verify function of the pulse oximeter:","l":0},{"t":"<b>Do not<\/b> fixate on oximeter function.","l":1},{"t":"Monitor the patient carefully while ruling out artifacts and transients.","l":1},{"t":"Correlate oximeter readings with activation of electrocautery.","l":1},{"t":"Check the probe position and consider changing the site of the probe, e.g. from finger to ear.","l":1},{"t":"Shield the probe from ambient light.","l":1},{"t":"Assess adequacy of oximeter signal amplitude.","l":1},{"t":"Use a secondary or portable pulse oximeter to confirm readings.","l":1},{"t":"If situation does not resolve, look for conditions that increase venous admixture:","l":0},{"t":"Pulmonary aspiration of gastric contents (see Event 28, Aspiration of Gastric Contents).","l":1},{"t":"Massive atelectasis/aspiration of foreign body.","l":1},{"t":"PE (see Event 21, Pulmonary Embolism).","l":1},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":1},{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":1},{"t":"Increased intracardiac shunting in congenital heart disease.","l":1},{"t":"Pleural effusion or worsening CHF (see Event 20, Pulmonary Edema).","l":1},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":1},{"t":"Check ETT for kink or obstruction by passing an ETT suction catheter:","l":0},{"t":"If catheter does not pass, rule out ETT kink, cuff herniation, or intraluminal obstruction.","l":1},{"t":"Perform aggressive pulmonary toilet:","l":0},{"t":"Suction ETT with suction catheter:","l":1},{"t":"Place 3 cc sterile saline in ETT to loosen thick secretions.","l":2},{"t":"Consider bronchoscopy to assist pulmonary toilet.","l":1},{"t":"Restore adequate circulating blood volume to maintain CO and Hgb levels.","l":0},{"t":"Rule out MH (see Event 45, Malignant Hyperthermia).","l":0},{"t":"Inform surgeons if hypoxemia persists:","l":0},{"t":"Check for retractors causing impairment of ventilation.","l":1},{"t":"Have surgeons pause cementing or reaming of long bones if hypoxemia worsens.","l":1},{"t":"Release of pneumoperitoneum during laparoscopic surgery.","l":1},{"t":"Consider urgent return to the supine position (e.g. from prone, steep Trendelenburg, lithotomy), particularly if recent position change is thought to have impaired ventilation.","l":1},{"t":"Reinflate nonventilated lung during one lung ventilation (see Event 33, Hypoxemia during One Lung Ventilation).","l":1},{"t":"Terminate surgery <b>as soon as possible<\/b>.","l":0},{"t":"Arrange for ICU transfer for postoperative care.","l":0},{"t":"In patients who have been extubated, consider hypoventilation secondary to residual neuromuscular blockade or opioid effect.","l":0}],"complications":[{"t":"Neurologic injury manifested as confusion, coma, delayed recovery from anesthesia.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Hypotension.","l":0},{"t":"Bradycardia.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Szekely SM, Runciman WB, Webb RK, Ludbrook GL. Crisis management during anaesthesia: desaturation. Qual Saf Health Care 2005;14(3):e6:1-6."},{"t":"2. Acute Respiratory Distress Syndrome Network. Ventilation with lower tidal volumes as compared with traditional tidal volumes for acute lung injury and the acute respiratory distress syndrome. New Engl J Med 2000;342:1301-8."}]}},{"id":11,"title":"Operating Room Fire","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"This event includes all fires in an OR except airway fires.","l":0}],"etiology":[{"t":"An OR fire requires the presence of three simultaneous elements:","l":0},{"t":"Oxidizer.","l":1},{"t":"Ignition source.","l":1},{"t":"Fuel source.","l":1}],"typical":[{"t":"Cases involving ignition sources:","l":0},{"t":"Electrocautery.","l":1},{"t":"Laser.","l":1},{"t":"Fiberoptic or other light sources.","l":1},{"t":"High concentration of oxidizer (O<sub>2<\/sub> or N<sub>2<\/sub>O) near an ignition source:","l":0},{"t":"Surgery:","l":1},{"t":"Head.","l":2},{"t":"Neck.","l":2},{"t":"Chest.","l":2},{"t":"Incorrect operation of ignition sources.","l":0},{"t":"Cases in which flammable (alcohol-based) surgical preparations or ointments are used.","l":0},{"t":"Flammable patient coverings, e.g. drapes and blankets.","l":0},{"t":"Electrical faults that give rise to sparks.","l":0}],"prevention":[{"t":"Create institutional plan for management of OR fires.","l":0},{"t":"Drill and practice management of OR fires using simulation if feasible (otherwise via a walk-through drill).","l":0},{"t":"Assess fire risk in <b>every<\/b> case.","l":0},{"t":"Consider using an LMA or ETT for head, neck, and chest surgery requiring moderate or deep sedation or in patients requiring an increased FiO<sub>2<\/sub>.","l":0},{"t":"If open O<sub>2<\/sub> delivery <b>must<\/b> be used near an ignition source:","l":0},{"t":"Start with the <b>lowest<\/b> O<sub>2<\/sub> concentration to maintain acceptable O<sub>2<\/sub> saturation.","l":1},{"t":"<b>Do not<\/b> deliver <b>100%<\/b> O<sub>2<\/sub> through nasal cannula or mask in high fire-risk cases:","l":1},{"t":"Use an O<sub>2<\/sub> blender.","l":2},{"t":"Use blended gas from the common gas outlet of the anesthesia machine.","l":2},{"t":"Use blended gas from the patient circuit Y-connector.","l":2},{"t":"Use <b>5 to 10 L/min<\/b> flow of air from the breathing circuit under the drapes to wash out excess O<sub>2<\/sub>.","l":1},{"t":"Use alternative surgical modalities such as harmonic or bipolar scalpel to decrease ignition risk.","l":1},{"t":"Modify draping techniques to minimize accumulation of O<sub>2<\/sub> under the drapes.","l":1},{"t":"Perform routine maintenance of OR electrical equipment and remove from service if faults are detected.","l":0},{"t":"Allow flammable skin preparation solutions to fully dry before draping.","l":0},{"t":"Turn off ignition sources when not actively in use.","l":0},{"t":"Moisten gauze or other potential fuel sources when used near ignition source.","l":0},{"t":"For high-risk cases, prepare bowl of saline or water to use to extinguish a fire.","l":0},{"t":"Have an appropriate fire extinguisher in every OR.","l":0},{"t":"Use nonflammable patient coverings.","l":0}],"manifestations":[{"t":"Smoke.","l":0},{"t":"Visible charring of drapes or OR linens.","l":0},{"t":"Visible flames or flashes.","l":0},{"t":"Palpable heat.","l":0},{"t":"Sparks from electrical equipment or OR lights.","l":0},{"t":"Explosion.","l":0},{"t":"Fire alarm.","l":0}],"similar":[{"t":"Fire elsewhere in the hospital.","l":0},{"t":"Smoke or smell from use of electrocautery.","l":0},{"t":"Steam pipe leak.","l":0}],"management":[{"t":"<i>For management of airway fires, see <\/i>Event 25, Airway Burn.","l":0},{"t":"<b>Immediately<\/b> alert all personnel in the OR.","l":0},{"t":"<b>Stop procedure.<\/b>","l":0},{"t":"Stop flow of oxidizer.","l":0},{"t":"<b>Remove drapes<\/b> and all burning or flammable materials from patient:","l":0},{"t":"May need to use fire extinguisher on burning drapes.","l":1},{"t":"Pour saline or water on patient, or use a CO<sub>2<\/sub> fire extinguisher (safe in wounds) at fire site:","l":0},{"t":"<b>Do not<\/b> pour water on electrical equipment.","l":1},{"t":"If the fire continues:","l":0},{"t":"Activate hospital fire alarm.","l":1},{"t":"Continue to extinguish the fire if it is safe for you to do so.","l":1},{"t":"Turn off and unplug any electrical equipment involved if safe to do so.","l":1},{"t":"Use appropriate type of fire extinguisher.","l":1},{"t":"If the fire is not quickly controlled:","l":0},{"t":"Evacuate the patient on the operating table, if possible.","l":1},{"t":"Notify staff in other ORs.","l":1},{"t":"After exiting, isolate the OR to contain smoke or fire:","l":1},{"t":"Close the doors and any other openings into the OR.","l":2},{"t":"Turn off piped gases (this could affect other ORs).","l":2},{"t":"Consider turning off air conditioning and ventilation to the affected OR or OR suite.","l":2},{"t":"Prepare to evacuate the entire OR suite.","l":1},{"t":"Continue to fight the fire with extinguishers or fire hose if it is safe to do so.","l":1},{"t":"Evaluate and treat injuries to the patient and OR personnel:","l":0},{"t":"Check for burns, bleeding, or other injuries.","l":1},{"t":"Maintain ventilation of paralyzed patients:","l":1},{"t":"Use IV amnestic or anesthetic agents.","l":2},{"t":"Monitor the patient with transport monitor.","l":1},{"t":"Replace damaged equipment, especially that needed for life support.","l":0},{"t":"Follow up:","l":0},{"t":"Save suspect equipment or materials for investigation.","l":1},{"t":"Report laser-triggered fires to laser safety committee.","l":1},{"t":"There may be a statutory responsibility to report a fire to local, state, or federal agencies.","l":1}],"complications":[{"t":"Burns.","l":0},{"t":"Smoke inhalation.","l":0},{"t":"Light anesthesia and awareness of the patient while disconnected from inhalation anesthetics.","l":0}],"reading":[{"t":"1. Apfelbaum JL, Caplan RA, Barker SJ, et al. Practice advisory for the prevention and management of operating room fires: an updated report by the American Society of Anesthesiologists Task Force on operating room fires. Anesthesiology 2013;118:271-90."},{"t":"2. ECRI Institute. New clinical guide to surgical fire prevention. Health Devices 2009;38:330."}]}},{"id":12,"title":"ST Segment Change","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"Elevation or depression of the ST segment of the ECG from the isoelectric level.","l":0}],"etiology":[{"t":"Inadequate coronary perfusion for a given myocardial O<sub>2<\/sub> demand.","l":0},{"t":"Acute myocardial ischemia or infarction.","l":0},{"t":"Myocardial contusion.","l":0},{"t":"Acute pericarditis.","l":0},{"t":"Electrolyte abnormalities:","l":0},{"t":"Hypokalemia or hyperkalemia, hypercalcemia.","l":1},{"t":"Head injury or raised ICP, including subarachnoid hemorrhage.","l":0},{"t":"Hypothermia (below 30°C).","l":0},{"t":"Defibrillation injury of myocardium.","l":0},{"t":"Acute hypertensive crisis.","l":0},{"t":"Spontaneous coronary artery dissection (SCAD): usually in premenopausal women.","l":0},{"t":"Early repolarization (normal variant).","l":0}],"typical":[{"t":"In patients with preexisting CAD or aortic stenosis.","l":0},{"t":"During any acute change in myocardial O<sub>2<\/sub> demand or delivery, including tachycardia, arrhythmias, hypertension, hypotension, hypoxemia, hemodilution, coronary spasm, coronary stent occlusion, coronary dissection, or coronary thrombus.","l":0},{"t":"After head or chest trauma.","l":0},{"t":"During vaginal delivery or cesarean section.","l":0}],"prevention":[{"t":"Carefully evaluate and optimize medical management in patients with CAD:","l":0},{"t":"Continue β-blockade in patients on chronic β-blocker therapy.","l":1},{"t":"Continue statin therapy perioperatively.","l":1},{"t":"Management of antiplatelet therapy (e.g, aspirin, clopidogrel, etc.) in collaboration with surgical team.","l":1},{"t":"Consider perioperative β-blockade in patients with cardiac risk factors.","l":1},{"t":"Carefully manage hemodynamics and <b>hematocrit<\/b> to optimize myocardial O<sub>2<\/sub> balance.","l":0},{"t":"Identify and evaluate preexisting ST segment abnormalities preoperatively.","l":0},{"t":"Run rhythm strip recording of ECG prior to induction of anesthesia for comparison during case.","l":0}],"manifestations":[{"t":"Depression or elevation of ST segment from the isoelectric level.","l":0},{"t":"If the ST segment changes are due to myocardial ischemia, the following signs and symptoms may be present:","l":0},{"t":"Central chest pain radiating into the arms or throat.","l":1},{"t":"Dyspnea.","l":1},{"t":"Nausea and vomiting.","l":1},{"t":"Altered level of consciousness or cognitive function.","l":1},{"t":"<b>Arrhythmias<\/b>:","l":1},{"t":"PVCs, premature atrial contractions [PACs], atrial fibrillation [AF], VT or VF.","l":2},{"t":"<b>Hypotension<\/b>.","l":1},{"t":"New or worsening mitral regurgitation.","l":1},{"t":"Elevation of ventricular filling pressures.","l":1},{"t":"V wave on PA wedge tracing.","l":1},{"t":"Global or regional wall motion abnormalities on TEE or TTE.","l":1},{"t":"The development of Q waves in the ECG.","l":1}],"similar":[{"t":"Artifact of ECG:","l":0},{"t":"Improper electrode position on the patient.","l":1},{"t":"Alteration in position of heart relative to the electrodes owing to changes in patient position or surgical manipulation.","l":1},{"t":"Change in cardiac conduction from normal to abnormal pathway.","l":0},{"t":"Left ventricular hypertrophy.","l":0},{"t":"Drug effects.","l":0},{"t":"Ventricular pacing.","l":0},{"t":"Left ventricular aneurysm.","l":0},{"t":"Acute pericarditis.","l":0},{"t":"Acute PE.","l":0},{"t":"Hypercalcemia.","l":0},{"t":"Hyperkalemia.","l":0}],"management":[{"t":"<i>All ST changes should be considered ischemic in origin until proven otherwise.<\/i>","l":0,"n":1},{"t":"Verify ST segment changes:","l":0},{"t":"Evaluate electrode placement and ECG analysis settings.","l":1},{"t":"Evaluate multiple ECG leads on physiologic monitor.","l":1},{"t":"Review and compare previous ECGs and ST segment tracking data.","l":1},{"t":"Record rhythm strip from physiologic monitor.","l":1},{"t":"Consider obtaining a 12-lead ECG.","l":1},{"t":"Consider TEE or TTE to evaluate new regional wall motion abnormalities.","l":1},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Increase FiO<sub>2<\/sub> to <b>100%<\/b>.","l":1},{"t":"Check pulse oximeter.","l":1},{"t":"Check capnograph.","l":1},{"t":"Check ABGs if there is any question of oxygenation or ventilation.","l":1},{"t":"Treat tachycardia and/or hypertension:","l":0},{"t":"Tachycardia is the most important determinant of increased myocardial O<sub>2<\/sub> demand; therefore decrease HR if possible but <b>avoid<\/b> hypotension:","l":1},{"t":"Increase the depth of anesthesia if appropriate.","l":2},{"t":"Consider β-blockade:","l":2},{"t":"<b>Esmolol<\/b> IV, <b>10 to 30 mg<\/b> bolus, <b>50 to 300 μg/kg/min<\/b> infusion.","l":3},{"t":"Labetolol IV <b>5 to 10 mg<\/b> bolus, repeat as necessary (hold for hypotension).","l":3},{"t":"Metoprolol IV, <b>1 to 5 mg<\/b> bolus, repeat as necessary.","l":3},{"t":"<b>Avoid<\/b> β-blockade in patients that are hypotensive or have severely reduced ejection fraction.","l":3},{"t":"Use with caution if the patient has severe COPD or asthma.","l":3},{"t":"Treat hypertension:","l":1},{"t":"<b>Nitroglycerin<\/b> (NTG):","l":2},{"t":"Sublingual (absorption uncertain, can cause hypotension).","l":3},{"t":"Transdermal paste, 1 to 2 inches applied to the chest wall (slow onset).","l":3},{"t":"IV infusion, <b>0.25 to 2 μg/kg/min<\/b> (titrated to effect).","l":3},{"t":"<b>Do not<\/b> administer when patients are hypotensive or have recently taken phosphodiesterase inhibitors.","l":3},{"t":"Calcium channel blockade:","l":2},{"t":"Diltiazem IV, loading dose <b>0.25 mg/kg<\/b> over 2 min; if IV infusion is necessary, 10-25 mg/hr after IV bolus dose.","l":3},{"t":"Treat hypotension and/or bradycardia:","l":0},{"t":"Optimize circulating fluid volume:","l":1},{"t":"TEE or TTE to assess and optimize myocardial filling and function.","l":2},{"t":"Support myocardial contractility as needed using inotropic agents:","l":1},{"t":"Positive inotropes may increase myocardial O<sub>2<\/sub> demand and worsen ischemia:","l":2},{"t":"<b>Ephedrine<\/b> IV, <b>5 to 10 mg<\/b> increments.","l":3},{"t":"Dobutamine IV infusion, <b>2.5 to 10 μg/kg/min<\/b> (may cause hypotension through vasodilation).","l":3},{"t":"Dopamine IV infusion, <b>2.5 to 10 μg/kg/min<\/b>.","l":2},{"t":"<b>Epinephrine<\/b> IV infusion, 10 to 100 ng/kg/min.","l":2},{"t":"<b>Avoid<\/b> NTG and calcium channel blockade until hypotension or bradycardia are resolved:","l":1},{"t":"Consider combined use of <b>phenylephrine<\/b> and NTG infusions.","l":2},{"t":"<b>Inform the surgeon:<\/b>","l":0},{"t":"Discuss early termination of the surgical procedure.","l":1},{"t":"Discuss transfer to ICU for postoperative management.","l":1},{"t":"Discuss transfer to cardiac catheterization lab for possible percutaneous coronary intervention (PCI), including possible need for anticoagulation and antiplatelet therapy.","l":1},{"t":"If ST segment elevation myocardial infarction (STEMI) is suspected or there is no response to therapy, obtain stat cardiology consultation (see Event 15, Acute Coronary Syndrome).","l":0},{"t":"If severe hypotension or cardiogenic shock, consider placement of intra-aortic balloon pump (<b>IABP).<\/b>","l":0},{"t":"Send blood samples to laboratory for <b>ABG<\/b>, <b>hematocrit<\/b>, glucose, electrolytes, creatine kinase (CK) isoenzymes, troponin.","l":0},{"t":"Treat underlying causes of ST segment changes other than myocardial ischemia.","l":0}],"complications":[{"t":"MI.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Hollenberg SM, Parrillo JE. Myocardial ischemia. In: Hall JB, Schmidt GA, Wood LD, editors. Principles of critical care. 3rd ed. New York: McGraw-Hill; 2005, chapter 25."},{"t":"2. Goldberger AL. Electrocardiography. In: Longo DL, Fauci AS, Kasper DL, et al, editors. Harrison’s principles of internal medicine. 18th ed. New York: McGraw-Hill; 2012, chapter 228."},{"t":"3. Skidmore Kimberly L, London MJ. Myocardial ischemia: monitoring to diagnose ischemia: how do I monitor therapy? Anesthesiol Clin North America 2001;19:651-72."},{"t":"4. London MJ, Hur K, Schwartz GG, Henderson WG. Association of perioperative β-blockade with mortality and cardiovascular morbidity following major noncardiac surgery. JAMA 2013;309:1704-13."}]}},{"id":13,"title":"The Septic Patient","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"Sepsis is a systemic inflammatory response syndrome (SIRS) caused by severe infection.","l":0}],"etiology":[{"t":"Overwhelming infection:","l":0},{"t":"Pneumonia.","l":1},{"t":"Abdominal infection.","l":1},{"t":"Kidney infection.","l":1},{"t":"Bloodstream infection.","l":1}],"typical":[{"t":"Patients at the extremes of age.","l":0},{"t":"Patients with compromised immune systems.","l":0},{"t":"Patients who require care in the ICU:","l":0},{"t":"ICU patients have conduits for infection.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"CVP catheters.","l":3},{"t":"Urinary catheters.","l":3},{"t":"ETTs.","l":3},{"t":"Also can be associated with:","l":0},{"t":"Surgical procedures.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Necrotizing fasciitis.","l":3},{"t":"Lithotripsy.","l":3},{"t":"Pancreatitis.","l":1},{"t":"Fulminant hepatic failure.","l":1},{"t":"Patients on multiple antibiotics.","l":1},{"t":"Toxic shock syndrome.","l":1},{"t":"Anaphylaxis/anaphylactoid reactions.","l":1},{"t":"Insect bites, transfusion reactions, heavy metal poisoning.","l":1},{"t":"Contaminated IV solutions or medications.","l":1}],"prevention":[{"t":"Multidisciplinary quality improvement plans directed toward decreasing infections:","l":0},{"t":"Wash hands before and after every patient contact.","l":1},{"t":"Prevent central line associated bloodstream infections (CLABSI):","l":1},{"t":"Follow Centers for Disease Control recommendations for <b>CVP<\/b> placement.","l":2},{"t":"Reduce duration of IV lipid and <b>CVP<\/b> line use.","l":1},{"t":"Provide respiratory care to reduce the risk of ventilator-associated pneumonia (VAP):","l":1},{"t":"Prevent aspiration:","l":2},{"t":"Elevate the head of the bed 30 to 40 degrees unless <b>contraindicated<\/b>.","l":3},{"t":"<b>Avoid<\/b> gastric overdistention.","l":3},{"t":"<b>Avoid<\/b> unplanned extubation and reintubation.","l":3},{"t":"Use a cuffed ETT with in-line suctioning.","l":3},{"t":"Minimize the duration of endotracheal intubation:","l":2},{"t":"Daily assessments of readiness to wean.","l":3},{"t":"Use weaning protocols.","l":3},{"t":"Educate healthcare personnel about VAP.","l":3},{"t":"Conduct active surveillance for VAP.","l":2},{"t":"Use noninvasive ventilation when applicable.","l":2},{"t":"Selective oral decontamination with oral chlorhexidine.","l":2},{"t":"Methicillin-resistant <i>Staphylococcus aureus <\/i>(MRSA) screening and isolation of carriers.","l":2},{"t":"Minimize use and duration of bladder catheters.","l":1},{"t":"Skin care assessment:","l":1},{"t":"Follow wound care procedures.","l":2},{"t":"Prevent pressure sores.","l":2},{"t":"Administer peptic ulcer disease <b>prophylaxis<\/b>.","l":1},{"t":"Screen seriously ill patients for infection to allow early implementation of therapy.","l":0},{"t":"Implement and follow sepsis bundles (as described in Management Section).","l":0},{"t":"Reassess antimicrobial regimens daily for potential de-escalation to prevent the development of bacterial resistance, to reduce drug toxicity, and to reduce costs.","l":0}],"manifestations":[{"t":"Infection (either documented or suspected):","l":0},{"t":"General variables:","l":1},{"t":"T &gt; 38°C or &lt; 36°C.","l":2},{"t":"HR &gt; 90/min.","l":2},{"t":"Tachypnea.","l":2},{"t":"Altered mental status.","l":2},{"t":"<b>Edema<\/b> or positive fluid balance.","l":2},{"t":"Hyperglycemia.","l":2},{"t":"Inflammatory variables:","l":1},{"t":"White blood cell (WBC) count &gt;12,000 or &lt;4000 cells/μL, &gt;10% bands.","l":2},{"t":"Increase in C-reactive protein.","l":2},{"t":"Presence of procalcitonin in the blood.","l":2},{"t":"Hemodynamic variables:","l":1},{"t":"SBP &lt;90, MAP &lt;70, or DBP &lt;40 mm Hg.","l":2},{"t":"Venous oxygen saturation (SvO<sub>2<\/sub>) &gt;70%.","l":2},{"t":"Cardiac index &gt;3.5 L/min.","l":2},{"t":"Organ dysfunction variables:","l":1},{"t":"<b>Hypoxemia<\/b>.","l":2},{"t":"<b>Oliguria<\/b>.","l":2},{"t":"Increased creatinine.","l":2},{"t":"Coagulopathy.","l":2},{"t":"Ileus.","l":2},{"t":"Thrombocytopenia.","l":2},{"t":"Hyperbilirubinemia.","l":2},{"t":"Tissue perfusion variables:","l":1},{"t":"Increased lactate.","l":2},{"t":"Poor capillary refill.","l":2},{"t":"Skin mottling.","l":2},{"t":"<b>SIRS<\/b> may occur without evidence of infection and involves two or more of the following:","l":0},{"t":"Temp &gt; 38°C or &lt; 36°C.","l":1},{"t":"HR &gt; 90 beats/min.","l":1},{"t":"Respiration rate &gt; 20 breaths/min.","l":1},{"t":"WBC count &gt;12,000 or &lt;4000 cells/μL, or &gt;10% bands.","l":1},{"t":"<b>Sepsis<\/b>: SIRS in the presence of proven or suspected infection.","l":0},{"t":"<b>Severe sepsis<\/b>: acute, often multiple organ dysfunction syndrome (MODS) secondary to documented or suspected infection.","l":0},{"t":"<b>Septic shock<\/b>: severe sepsis plus <b>hypotension<\/b> not reversed by fluid resuscitation (distributive shock):","l":0},{"t":"In septic shock, high CO low SVR, <b>hypotension<\/b>, and regional blood flow redistribution lead to tissue hypoperfusion.","l":1},{"t":"<b>MODS:<\/b>","l":0},{"t":"Severe sepsis leading to multiple organ dysfunction.","l":1},{"t":"Mortality ranges from 30% to 100%.","l":1}],"similar":[{"t":"Hemorrhagic shock (e.g. polytrauma, GI bleed) (see Event 1, Acute Hemorrhage).","l":0},{"t":"Acute MI (see Event 15, Acute Coronary Syndrome).","l":0},{"t":"Stroke.","l":0},{"t":"Anaphylaxis (see Event 16, Anaphylactic or Anaphylactoid Reactions).","l":0},{"t":"SCI.","l":0}],"management":[{"t":"<i>Rapid diagnosis with appropriate therapy of sepsis improves outcome. Clear communication among clinicians in emergency medicine, anesthesia, surgery, internal medicine, and critical care is essential in the treatment of the septic patient.<\/i>","l":0,"n":1},{"t":"Surviving Sepsis Campaign Bundles.","l":0},{"t":"To be completed within 3 hours:","l":0},{"t":"Measure lactate level.","l":1},{"t":"Obtain blood cultures prior to administration of antibiotics.","l":1},{"t":"Administer broad spectrum antibiotics.","l":1},{"t":"Administer <b>30 mL/kg crystalloid<\/b> for hypotension or lactate ≥4 mmol/L.","l":1},{"t":"To be completed within 6 hours:","l":0},{"t":"Administer vasopressors for hypotension that does not respond to initial fluid resuscitation.","l":1},{"t":"In the event of persistent hypotension despite volume resuscitation (septic shock) or initial lactate ≥4 mmol/L:","l":1},{"t":"Continue to administer IV fluid and vasopressors until:","l":2},{"t":"MAP ≥65 mm Hg.","l":3},{"t":"<b>CVP<\/b> ≥8 mm Hg.","l":3},{"t":"Central ScvO<sub>2<\/sub> ≥<b>70%<\/b>.","l":3},{"t":"Urine output ≥0.5 mL/kg/hr.","l":3},{"t":"Normal serum lactate levels.","l":3},{"t":"Antimicrobial regimens can be complex and should be guided by appropriate infectious disease consultation.","l":0},{"t":"Antiviral therapy initiated as early as possible in patients with severe sepsis or septic shock of viral origin.","l":0},{"t":"Antimicrobial regimen should be reassessed daily for potential de-escalation:","l":0},{"t":"High procalcitonin levels are consistent with severe sepsis:","l":1},{"t":"Low or decreasing levels can be used to guide antimicrobial therapy.","l":2},{"t":"Determine and treat the source of sepsis:","l":0},{"t":"Once diagnosed, the intervention with the least physiologic insult should be considered, e.g. percutaneous rather than surgical drainage of an abscess.","l":1},{"t":"Remove/replace intravascular catheters if they are a possible source of infection.","l":1},{"t":"Fluid Therapy of Severe Sepsis:","l":0},{"t":"<b>Crystalloids<\/b> are the initial fluid of choice:","l":1},{"t":"Administer <b>30 mL/kg<\/b> of <b>crystalloid<\/b> initially.","l":2},{"t":"<b>Avoid<\/b> use of hydroxyethyl starches.","l":2},{"t":"Large amounts of fluid may be needed.","l":2},{"t":"Albumin can be added to the IV fluid regimen when patients require substantial amounts of <b>crystalloids<\/b>.","l":1},{"t":"Vasopressor Therapy of Severe Sepsis:","l":0},{"t":"<b>Norepinephrine<\/b> IV infusion, 10 to 100 ng/kg/min.","l":1},{"t":"<b>Epinephrine<\/b> IV infusion, 10 to 100 ng/kg/min, may be added to, and potentially substituted for, <b>norepinephrine<\/b>.","l":1},{"t":"<b>Vasopressin<\/b> IV infusion, 0.03 units/min, can be added to <b>norepinephrine<\/b> to raise the MAP or decrease the <b>norepinephrine<\/b> dose.","l":1},{"t":"Dopamine IV infusion, <b>2 to 10 μg/kg/min<\/b>.","l":1},{"t":"<b>Phenylephrine<\/b> is not recommended in the treatment of the septic patient except:","l":1},{"t":"Where <b>norepinephrine<\/b> is associated with serious arrhythmias.","l":2},{"t":"Where CO is known to be high and BP persistently low.","l":2},{"t":"As salvage therapy when other agents (e.g. <b>vasopressin<\/b>) have failed to achieve MAP target.","l":2},{"t":"All patients requiring vasopressors should have an arterial catheter placed.","l":1},{"t":"<b>Corticosteroids:<\/b>","l":0},{"t":"Systemic corticosteroids are not indicated if patient is resuscitatable with IV fluid and vasopressor administration:","l":1},{"t":"If the patient has been fluid resuscitated but remains hypotensive, consider <b>hydrocortisone<\/b> IV, 200 mg/day (see Event 38, Addisonian Crisis).","l":2},{"t":"Taper corticosteroids when vasopressors are no longer required.","l":2},{"t":"<b>Blood Product Administration:<\/b>","l":0},{"t":"In the absence of myocardial ischemia, severe hypoxemia, or acute hemorrhage, RBCs should be transfused when Hgb concentration decreases to &lt; 7.0 g/dL to achieve Hgb concentration of 7.0 to 9.0 g/dL in adults.","l":1},{"t":"Administer <b>platelets<\/b>:","l":1},{"t":"Prophylactically when counts are &lt;10 K/μL.","l":2},{"t":"If the patient has a significant risk of bleeding and <b>platelet<\/b> count &lt;20 K/μL.","l":2},{"t":"If the patient is actively bleeding or undergoing surgery or an invasive procedure and has a <b>platelet<\/b> count &lt;50 K/μL.","l":2},{"t":"<b>Glucose Control:<\/b>","l":0},{"t":"Monitor glucose levels every 1 to 2 hours and treat hyperglycemia with IV <b>insulin<\/b> infusion.","l":1},{"t":"Target glucose levels 140 to 180 mg/dL.","l":1}],"reading":[{"t":"1. NIH Sepsis Fact Sheet. Available from: http://www.nigms.nih.gov/Publications/factsheet_sepsis.htm. [accessed 03.07.13]."},{"t":"2. Dellinger RP, Levy ML, Opal S, et al. Surviving Sepsis Campaign: international guidelines for management of severe sepsis and septic shock—2012. Crit Care Med 2013;41:580-637."},{"t":"3. Levy MM, Dellinger RP, Townsend SR, et al. The Surviving Sepsis Campaign: results of an international guideline-based performance improvement program targeting severe sepsis. Crit Care Med 2010;38:367-74."},{"t":"4. Wacker C, Prkno A, Brunkhorst FM, Schlattmann P. Procalcitonin as a diagnostic marker for sepsis: a systematic review and meta-analysis. Lancet Infect Dis 2013;13:426-35."}]}},{"id":14,"title":"The Trauma Patient","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"Trauma patients have severe, life-threatening injuries that affect multiple organ systems and that frequently result in the immediate need for life-saving resuscitative, airway, and surgical intervention.","l":0}],"etiology":[{"t":"Motor vehicle accidents (MVAs).","l":0},{"t":"Penetrating injuries:","l":0},{"t":"Gunshot wounds.","l":1},{"t":"Knife or other stab wounds.","l":1},{"t":"Falls.","l":0},{"t":"Crush injuries.","l":0},{"t":"Central nervous system (CNS) injuries:","l":0},{"t":"Blunt trauma.","l":1},{"t":"Acute acceleration or deceleration injuries.","l":1}],"typical":[{"t":"MVAs.","l":0},{"t":"Gunshot wounds.","l":0},{"t":"Workplace accidents.","l":0},{"t":"Falls.","l":0},{"t":"Abuse (children, elderly, domestic violence).","l":0}],"prevention":[{"t":"<i>There are 60 million injuries annually in the United States, and trauma is the leading cause of death among children, adolescents, and young adults. Prevention of trauma is a public health issue of enormous importance.<\/i>","l":0},{"t":"Trauma centers should have the following <b>immediately<\/b> available at all times:","l":0},{"t":"An OR.","l":1},{"t":"Fully functional anesthesia workstation.","l":1},{"t":"Appropriate staff.","l":1},{"t":"Drugs and resuscitative equipment.","l":1},{"t":"Transfusion services.","l":1},{"t":"Systematic and coordinated training of the entire team for the management of the trauma patient improves emergency response and patient survival:","l":0},{"t":"Preassign roles to anesthesiology, surgery, and nursing team members.","l":1},{"t":"Use simulation to drill and practice responses to the trauma patient.","l":1},{"t":"Team meetings at the start of shifts will enhance role clarity and the team’s ability to manage critical patients.","l":1}],"manifestations":[{"t":"Stat call to the trauma bay or ED.","l":0},{"t":"Patient presentation is variable and depends on the type and extent of injury and mode of transportation to the ED.","l":0},{"t":"Evaluate the patient’s vital signs and expect the trauma patient to be unstable:","l":0},{"t":"<b>Hypotension<\/b>, <b>hypertension<\/b>, <b>tachycardia<\/b>, <b>bradycardia<\/b>.","l":1},{"t":"Oxygenation and ventilation problems.","l":1},{"t":"Pain.","l":1},{"t":"Alteration in mental status.","l":1}],"similar":[{"t":"Major medical or surgical emergencies, e.g. ruptured abdominal aortic aneurysm.","l":0}],"management":[{"t":"<i>The acute resuscitation of patients with serious medical and surgical emergencies will often follow these guidelines, although, strictly speaking, they are not all “trauma” patients.<\/i>","l":0,"n":1},{"t":"All arriving team members responding to a trauma call should clearly state their role.","l":0},{"t":"Preparation of trauma bay prior to patient arrival:","l":0},{"t":"Trauma bay equipment:","l":1},{"t":"Provider barrier equipment:","l":2},{"t":"Surgical gowns.","l":3},{"t":"Eye protection.","l":3},{"t":"Gloves.","l":3},{"t":"Masks.","l":3},{"t":"Lead x-ray gowns.","l":3},{"t":"Crash cart with defibrillator.","l":2},{"t":"Airway equipment:","l":2},{"t":"Self-inflating bag and mask attached to a high flow O<sub>2<\/sub> source.","l":3},{"t":"Confirm suction is functional.","l":3},{"t":"Check airway equipment (oral airway, ETT, laryngoscope with different blades).","l":3},{"t":"Video-assisted laryngoscope for difficult airway.","l":3},{"t":"SGA and bougie for possible difficult airway.","l":3},{"t":"ET CO<sub>2<\/sub> monitor.","l":3},{"t":"Equipment for surgical airway, e.g. cricothyrotomy kit.","l":3},{"t":"Anesthesia workstation—checked and ready if available:","l":3},{"t":"Most patients will need to be transported to a trauma OR for emergency surgical care beyond the initial resuscitation.","l":4},{"t":"IV equipment:","l":2},{"t":"Rapid infuser device and tubing.","l":3},{"t":"IV and IO start kits.","l":3},{"t":"Medications:","l":1},{"t":"Induction agent.","l":2},{"t":"e.g.:","l":3,"e":1},{"t":"<b>Ketamine<\/b>.","l":4},{"t":"<b>Etomidate<\/b>.","l":4},{"t":"<b>Propofol<\/b>.","l":4},{"t":"Paralytic, e.g. <b>succinylcholine<\/b> unless <b>contraindicated<\/b>.","l":2},{"t":"Vasopressors (<b>epinephrine<\/b>, <b>ephedrine<\/b>, <b>phenylephrine<\/b>).","l":2},{"t":"Trauma service may receive advance warning of incoming casualties (there may be multiple trauma victims).","l":0},{"t":"Establish if the patient is in cardiac arrest:","l":0},{"t":"Initiate BLS/ACLS/pediatric advanced life support (PALS)/advanced trauma life support (ATLS) if patient is in cardiac arrest (see Event 2, Cardiac Arrest, and Event 94, Cardiac Arrest in the Pediatric Patient).","l":1},{"t":"<b>Anesthesiology role:<\/b>","l":0},{"t":"If patient is able to communicate:","l":1},{"t":"Obtain brief history and physical (including allergies):","l":2},{"t":"Assess patient’s visible injuries, especially any near the airway that may make airway management difficult.","l":3},{"t":"Ensure adequate oxygenation and ventilation; check O<sub>2<\/sub> saturation:","l":1},{"t":"Evaluate the patient’s ability to protect the airway:","l":2},{"t":"Assess level of consciousness.","l":3},{"t":"Emergency induction of anesthesia and intubation of trauma patients is often necessary:","l":1},{"t":"Get additional anesthesia help if a difficult intubation is anticipated.","l":2},{"t":"Preoxygenate while the trauma team places monitors.","l":2},{"t":"Assume that the patient has a full stomach and may have ingested substances of abuse.","l":2},{"t":"Reduce or eliminate induction dose of anesthetic based on vital signs and patient comorbidities.","l":2},{"t":"Perform a RSI with cricoid pressure.","l":2},{"t":"Consider video-assisted laryngoscopy as primary choice for intubation.","l":2},{"t":"Assign a member of the trauma team to apply manual in-line stabilization of the neck.","l":2},{"t":"Manipulate or release cricoid pressure if unable to intubate the trachea (see Event 3, Difficult Tracheal Intubation).","l":2},{"t":"Provide anesthesia to the patient, balancing risk of awareness with hemodynamic stability.","l":2},{"t":"Administer IV fluid and vasopressors in accordance with patient hemodynamics and blood loss:","l":1},{"t":"Assess the need for additional IVs, <b>arterial line<\/b>, or <b>CVP<\/b> access and assist in their placement.","l":2},{"t":"Assess the patient’s pain level:","l":1},{"t":"Treat with small doses of short-acting opioids:","l":2},{"t":"Balance risk of pain with hemodynamic stability.","l":3},{"t":"Hypovolemic patients may become hypotensive with small doses of opioids.","l":3},{"t":"<b>Nursing service role:<\/b>","l":0},{"t":"Apply basic monitors and measure vital signs:","l":1},{"t":"Communicate these to anesthesia and surgery team:","l":2},{"t":"HR.","l":3},{"t":"BP.","l":3},{"t":"O<sub>2<\/sub> saturation.","l":3},{"t":"Insert bilateral, <b>large-bore<\/b> IVs, e.g. 14 or <b>16 g<\/b>.","l":1},{"t":"Assist anesthesia team with managing airway and obtaining other IV access and special monitoring.","l":1},{"t":"Assist surgeons with surgical airway, chest tube placement, laparotomy, or other procedures as necessary.","l":1},{"t":"Act as timekeeper to track events of the resuscitation.","l":1},{"t":"including:","l":2,"e":1},{"t":"Medication administration.","l":3},{"t":"Defibrillation.","l":3},{"t":"Etc.","l":3},{"t":"Ensure that blood, blood products, and a rapid infuser system are available.","l":1},{"t":"Consider activating <b>MTP<\/b>, if available.","l":1},{"t":"<b>Trauma surgery role:<\/b>","l":0},{"t":"Ensure that the primary survey is completed and resuscitation begins (ABCDE of ATLS).","l":1},{"t":"<b>A<\/b>irway maintenance with cervical spine precautions.","l":1},{"t":"<b>B<\/b>reathing and ventilation:","l":1},{"t":"Recognize and treat tension pneumothorax, massive hemothorax, flail chest, cardiac tamponade, etc.","l":2},{"t":"<b>C<\/b>irculation with control of hemorrhage:","l":1},{"t":"Recognize hypovolemic shock and initiate transfusion.","l":2},{"t":"Control bleeding.","l":2},{"t":"<b>D<\/b>isability (neurologic assessment):","l":1},{"t":"Establish level of consciousness, pupil size and reaction to light, lateralizing signs, and SCI level.","l":2},{"t":"<b>E<\/b>xposure and environmental control:","l":1},{"t":"Expose the patient so a complete examination can be performed.","l":2},{"t":"Prevent hypothermia.","l":2},{"t":"If asked, be ready to place a surgical airway.","l":1},{"t":"If asked, be ready to provide IV or IO access.","l":1},{"t":"Once primary survey is complete, resuscitation efforts are established, and patient is stabilized, proceed to the next stage.","l":1},{"t":"Perform the secondary survey:","l":1},{"t":"Comprehensively evaluate the patient’s injuries:","l":2},{"t":"Identify sites of potential internal injuries looking for abdominal bruising and distention, flail chest, pneumothorax, head injury (Glasgow Coma Scale).","l":3},{"t":"Make critical decisions about the patient’s immediate resuscitative and diagnostic needs:","l":2},{"t":"Abdominal taps, chest tube placement, laparotomy, aortic clamping, or other procedures, <b>FAST<\/b> examination.","l":3},{"t":"Assess need for transfer to computed tomography (CT) for scans, interventional radiology (IR) for procedures, or OR for surgery.","l":3},{"t":"Request necessary consultations from other surgical services.","l":2},{"t":"Be prepared to call for additional help (anesthesia, surgery, nursing).","l":0},{"t":"COMMUNICATION BETWEEN TEAM MEMBERS IS CRUCIAL: It may be difficult to keep track of and comprehend the complex and changing issues and the numerous tasks that <b>must<\/b> be accomplished.","l":0},{"t":"Clear, closed-loop communication within the trauma team is essential.","l":1},{"t":"Be prepared to transport the patient to CT, IR, or OR.","l":0},{"t":"If the patient requires transportation to the main OR:","l":0},{"t":"A second anesthesia team should prepare the OR for emergency surgery.","l":1},{"t":"See Event 4, Emergent (Crash) Induction of Anesthesia:","l":1},{"t":"Warm the room to maintain the patient’s core temperature &gt;35°C.","l":2},{"t":"Prepare for massive resuscitation:","l":2},{"t":"<b>Crystalloid<\/b> and blood products.","l":3},{"t":"<b>CVP<\/b> line.","l":3},{"t":"Ultrasound machine for line placement.","l":3},{"t":"Rapid infuser devices available.","l":3},{"t":"Confirm that the blood bank has activated the <b>MTP<\/b> or that blood is available.","l":2},{"t":"OR management of massive hemorrhage (see Event 1, Acute Hemorrhage).","l":0},{"t":"Prepare for acidosis and further hemorrhage.","l":0}],"complications":[{"t":"Aspiration of gastric contents.","l":0},{"t":"Difficult intubation.","l":0},{"t":"Awareness under anesthesia.","l":0},{"t":"Massive hemorrhage.","l":0},{"t":"Coagulopathy.","l":0},{"t":"Pulmonary edema.","l":0},{"t":"Multisystem organ failure.","l":0},{"t":"TRALI.","l":0},{"t":"Sepsis.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Gray LD, Morris CG. The principles and conduct of anaesthesia for, emergency surgery. Anaesthesia 2013;68(Suppl. 1):14-29."},{"t":"2. Varon AJ, Smith CE, editors. Essentials of trauma anesthesia. Cambridge, Mass: Cambridge University Press; 2012."},{"t":"3. Diez C, Varon AJ. Airway management and initial resuscitation of the trauma patient. Curr Opin Crit Care 2009;15:542-7."},{"t":"4. Advanced Trauma Life Support (ATLS) for doctors: student manual with DVD. 8th ed. Chicago: American College of Surgeons; 2008."}]}},{"id":15,"title":"Acute Coronary Syndrome","ch":6,"cat":"Cardiovascular Events","s":{"definition":[{"t":"Acute coronary syndrome (ACS) is an acute imbalance between myocardial O<sub>2<\/sub> supply and demand that leads to ischemia and infarction.","l":0},{"t":"ACS is classified as being unstable angina, non–ST segment elevation myocardial infarction (NSTEMI), or STEMI.","l":0}],"etiology":[{"t":"Total or subtotal coronary artery occlusion:","l":0},{"t":"Primary ACS results from coronary artery occlusion:","l":1},{"t":"Plaque disruption with thrombus formation.","l":2},{"t":"Coronary vasospasm from endothelial dysfunction or drug ingestion.","l":2},{"t":"e.g.:","l":3,"e":1},{"t":"Cocaine.","l":4},{"t":"Serotonin receptor agonists.","l":4},{"t":"Coronary artery embolism.","l":2},{"t":"Coronary artery dissection.","l":2},{"t":"Aortic dissection.","l":2},{"t":"Secondary ACS results from:","l":1},{"t":"Increased myocardial O<sub>2<\/sub> demand.","l":2},{"t":"Decreased myocardial O<sub>2<\/sub> supply.","l":2}],"typical":[{"t":"Patients with known CAD or risk factors for atherosclerosis:","l":0},{"t":"Males, hypertension, hyperlipidemia, diabetes, peripheral vascular disease, smoking, family history of CAD.","l":1},{"t":"Increased myocardial O<sub>2<\/sub> demand:","l":0},{"t":"Tachycardia, fever, severe hypertension, or thyrotoxicosis.","l":1},{"t":"Decreased myocardial O<sub>2<\/sub> supply:","l":0},{"t":"Systemic hypotension, hypoxemia, or anemia.","l":1},{"t":"Miscellaneous factors.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Polyarteritis nodosa.","l":2},{"t":"Kawasaki disease.","l":2}],"prevention":[{"t":"Evaluate myocardial function and reserve and optimize medical therapy prior to surgery:","l":0},{"t":"Modify cardiac risk factors if possible.","l":1},{"t":"Optimize β-blocker and statin therapy.","l":1},{"t":"Manage antiplatelet therapy (e.g. aspirin, clopidogrel) in collaboration with surgical team:","l":1},{"t":"Patients with coronary stents on antiplatelet therapy require comanagement with cardiologist and surgeon:","l":2},{"t":"Patients may require “bridging therapy” (e.g. eptifibatide and <b>heparin<\/b>) to reduce risk of perioperative stent thrombosis.","l":3},{"t":"<b>Avoid<\/b> elective anesthesia and surgery in patients with unstable angina or with a history of MI in the previous 6 months.","l":0},{"t":"Optimize hemodynamics and <b>hematocrit<\/b> during anesthesia:","l":0},{"t":"Maintain myocardial O<sub>2<\/sub> supply.","l":1},{"t":"Prevent increases in myocardial O<sub>2<\/sub> demand.","l":1},{"t":"Revascularization (CABG or PCI) prior to elective surgery is not usually recommended:","l":0},{"t":"Consult cardiology and cardiac surgery.","l":1}],"manifestations":[{"t":"In awake patients:","l":0},{"t":"Chest pain, pressure, or discomfort radiating to arm and jaw:","l":1},{"t":"Women, diabetics, and the elderly may exhibit atypical chest pain (e.g. epigastric pain, sharp pain, fatigue, or dyspnea) or no symptoms at all.","l":2},{"t":"Nausea, diaphoresis, palpitations, syncope.","l":1},{"t":"<b>Cardiac arrest<\/b>.","l":1},{"t":"Electrocardiogram:","l":0},{"t":"<b>ST segment elevation<\/b> or depression.","l":1},{"t":"Conduction abnormalities.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Left bundle branch block.","l":3},{"t":"Complete atrioventricular block.","l":3},{"t":"Peaked T-waves.","l":1},{"t":"Progression to inverted T-waves and development of Q-waves.","l":1},{"t":"<b>Arrhythmias.<\/b>","l":1},{"t":"including:","l":2,"e":1},{"t":"PVCs.","l":3},{"t":"VT.","l":3},{"t":"VF.","l":3},{"t":"Cardiac biomarkers:","l":0},{"t":"Increase in troponin I, troponin T, and CK-MB isoenzyme.","l":1},{"t":"Diagnosis of MI requires presence of ECG changes or symptoms, because other conditions may be responsible for elevated cardiac biomarkers.","l":1},{"t":"Hemodynamic abnormalities:","l":0},{"t":"<b>Hypotension<\/b>.","l":1},{"t":"<b>Tachycardia<\/b>.","l":1},{"t":"<b>Bradycardia<\/b>.","l":1},{"t":"New regional wall motion abnormality on TEE or TTE.","l":1},{"t":"Elevation of filling pressures (CVP, PCWP).","l":1},{"t":"Criteria required for diagnosis of MI:","l":0},{"t":"Symptoms of ischemia.","l":1},{"t":"ECG changes:","l":1},{"t":"ST segment changes.","l":2},{"t":"Q-waves.","l":2},{"t":"New left bundle branch block.","l":2},{"t":"Evidence of new regional wall motion abnormality.","l":1},{"t":"Detection of rise and/or fall of cardiac biomarkers including:","l":1},{"t":"Troponin I.","l":2},{"t":"Troponin T.","l":2},{"t":"CK-MB.","l":2}],"similar":[{"t":"PE (see Event 21, Pulmonary Embolism).","l":0},{"t":"Esophageal spasm, costochondritis, acute abdomen.","l":0},{"t":"Primary pulmonary pathology.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Pneumonia.","l":2},{"t":"Pulmonary infarction.","l":2},{"t":"Acute aortic dissection.","l":0},{"t":"Nonischemic ST segment or T-wave changes (see Event 12, ST Segment Change).","l":0},{"t":"ECG artifact:","l":0},{"t":"Improper electrode placement.","l":1},{"t":"Changes in patient position or surgical manipulation may alter position of heart relative to the electrodes.","l":1}],"management":[{"t":"<b>Inform the surgeon.<\/b>","l":0},{"t":"Confirm diagnosis by evaluating available leads on ECG monitor.","l":0},{"t":"Ensure adequate oxygenation and ventilation.","l":0},{"t":"Optimize hemodynamics—improve myocardial O<sub>2<\/sub> supply while decreasing demand:","l":0},{"t":"<b>Treat hypotension<\/b> with vasopressors and IV fluids to increase DBP:","l":1},{"t":"<b>Phenylephrine<\/b> IV bolus, <b>50 to 200 μg<\/b>.","l":2},{"t":"<b>Phenylephrine<\/b> IV infusion, <b>10 to 100 μg/min<\/b>.","l":2},{"t":"Optimize circulating blood volume.","l":2},{"t":"<b>Treat tachycardia:<\/b>","l":1},{"t":"Assure adequate depth of anesthesia.","l":2},{"t":"Administer β-blockers in the absence of evidence of heart failure:","l":2},{"t":"<b>Esmolol<\/b> IV, <b>10 to 30 mg<\/b>.","l":3},{"t":"<b>Esmolol<\/b> IV infusion, <b>25 to 200 μg/kg/min<\/b>.","l":3},{"t":"Metoprolol IV, <b>1 to 5 mg<\/b>.","l":3},{"t":"Calcium channel blockers:","l":2},{"t":"Diltiazem IV, <b>0.15 to 0.25 mg/kg<\/b> load, then 5 to 15 mg/hr.","l":3},{"t":"Improve collateral myocardial blood flow and decrease myocardial wall stress:","l":0},{"t":"Administer <b>nitroglycerin<\/b> IV, <b>0.2 to 2 μg/kg/min<\/b>:","l":1},{"t":"<b>Do not<\/b> administer when patients are hypotensive or have recently taken phosphodiesterase inhibitors.","l":2},{"t":"<b>Draw labs:<\/b>","l"
