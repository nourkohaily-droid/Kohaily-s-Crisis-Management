 lung disease.","l":1},{"t":"Chest trauma:","l":0},{"t":"Penetrating injuries to the chest.","l":1},{"t":"Blast trauma.","l":1},{"t":"Rib fractures (e.g. trauma, including CPR):","l":1},{"t":"Injury does not have to be acute.","l":2},{"t":"Transport of patients with chest tubes receiving inadequate suction.","l":0}],"prevention":[{"t":"Identify patients at risk of pneumothorax.","l":0},{"t":"<b>Avoid<\/b> N<sub>2<\/sub>O if there is a significant risk of pneumothorax.","l":0},{"t":"Increase vigilance during procedures and surgery on or near the pleural space.","l":0},{"t":"Place <b>CVP<\/b> lines carefully:","l":0},{"t":"Use ultrasound guidance when placing <b>CVP<\/b> lines.","l":1},{"t":"Delay <b>CVP<\/b> line placement if possible until patient receives adequate fluid resuscitation.","l":1},{"t":"Place femoral <b>CVP<\/b> lines in patients with tenuous pulmonary status or in patients that need to remain upright.","l":1},{"t":"<b>Avoid<\/b> the subclavian approach <b>immediately<\/b> before general anesthesia or if the patient is being mechanically ventilated:","l":1},{"t":"If the subclavian approach is used, consider obtaining a CXR to rule out pneumothorax before proceeding with surgery.","l":2},{"t":"Initial CXR may not show a pneumothorax if air accumulates slowly.","l":2},{"t":"Take care when using a double-lumen ETT:","l":0},{"t":"<b>Do not<\/b> overinflate the endobronchial cuff.","l":1},{"t":"Verify correct placement of the double-lumen ETT by auscultation and fiberoptic bronchoscopy after changes in the patient’s position.","l":1}],"manifestations":[{"t":"<i>Pneumothorax is difficult to diagnose during general anesthesia because signs and symptoms are variable.<\/i>","l":0},{"t":"In the awake patient:","l":0},{"t":"Dyspnea:","l":1},{"t":"Cough.","l":2},{"t":"Tachypnea.","l":2},{"t":"And.","l":2},{"t":"<b>Hypoxemia<\/b>, <b>cyanosis<\/b>.","l":1},{"t":"<b>Tachycardia<\/b>.","l":1},{"t":"Chest pain.","l":1},{"t":"In the anesthetized patient:","l":0},{"t":"<b>Hypoxemia<\/b>.","l":1},{"t":"<b>Hypercarbia<\/b>.","l":1},{"t":"High PIP with decreased pulmonary compliance:","l":1},{"t":"Ventilator alarms indicating low minute and tidal volumes, and high PIP.","l":2},{"t":"<b>Hypotension<\/b>, <b>tachycardia<\/b>.","l":1},{"t":"Asymmetric breath sounds, hyperresonant percussion over the affected hemithorax.","l":0},{"t":"TTE examination:","l":0},{"t":"More accurate and sensitive than CXR but more likely to detect clinically insignificant pneumothorax.","l":1},{"t":"Signs of pneumothorax when comparing two sides of lung:","l":1},{"t":"Loss of sliding pleura and “comet tails”.","l":2},{"t":"SC emphysema of the oropharynx, face, or neck.","l":0},{"t":"Tracheal deviation from the midline.","l":0},{"t":"Neck veins may appear distended.","l":0},{"t":"Bulging hemidiaphragm may be visible during abdominal surgery.","l":0},{"t":"Characteristic CXR examination results:","l":0},{"t":"Loss of lung markings.","l":1},{"t":"Visible edge of the partially collapsed lung.","l":1},{"t":"Deviation of the mediastinum away from the pneumothorax.","l":1},{"t":"In the supine position, CXR will not demonstrate the classic hyperlucent hemithorax:","l":1},{"t":"Air outlining the mediastinum or a basilar deep sulcus may be the only indication of pneumothorax.","l":2}],"similar":[{"t":"Obstructed ETT (see Event 7, High Peak Inspiratory Pressure).","l":0},{"t":"Endobronchial intubation (see Event 30, Endobronchial Intubation).","l":0},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"Aspiration of gastric contents (see Event 28, Aspiration of Gastric Contents).","l":0},{"t":"Expiratory valve or pop-off valve stuck in the closed position (see Event 59, Circle System Expiratory Valve Stuck Closed, and Event 70, Pop-Off Valve Failure).","l":0},{"t":"Pulmonary edema (see Event 20, Pulmonary Edema).","l":0},{"t":"Air embolism may occur with pulmonary trauma (see Event 24, Venous Gas Embolism).","l":0},{"t":"Auto-PEEP.","l":0}],"management":[{"t":"Increase FiO<sub>2<\/sub> to <b>100%<\/b>:","l":0},{"t":"Turn off N<sub>2<\/sub>O if in use.","l":1},{"t":"Confirm the diagnosis of pneumothorax:","l":0},{"t":"Auscultate the chest.","l":1},{"t":"Percuss the chest if possible.","l":1},{"t":"Look and feel for tracheal deviation.","l":1},{"t":"If time allows, obtain CXR.","l":1},{"t":"Perform TTE examination (may take time to obtain equipment and/or expertise).","l":1},{"t":"Rule out endobronchial intubation, obstructed ETT, and valve malfunction on anesthesia workstation.","l":1},{"t":"Communication between surgical and anesthesia teams is critical for early diagnosis and treatment.","l":0},{"t":"Assess BP and HR.","l":0},{"t":"If significant hypotension is present without another probable etiology, treat for possible tension pneumothorax (may be lifesaving):","l":0},{"t":"Support the circulation:","l":1},{"t":"Give IV fluid bolus.","l":2},{"t":"Administer vasopressors or inotropic drugs (see Event 9, Hypotension):","l":2},{"t":"Drug and IV fluid effect may be delayed if a tension pneumothorax compromises venous return.","l":3},{"t":"Decrease or discontinue inhaled anesthetics.","l":2},{"t":"Insert a <b>large-bore<\/b> IV catheter into the pleural space (needle thoracostomy) on the side with decreased breath sounds or hyperresonant percussion:","l":1},{"t":"Insert just cephalad to rib body to <b>avoid<\/b> the neurovascular bundle.","l":2},{"t":"Insert either in the second intercostal space, midclavicular line, or in the fourth intercostal space, midaxillary line.","l":2},{"t":"If tension pneumothorax is relieved, a “hiss” may be heard.","l":2},{"t":"Hemodynamic improvement may occur after catheter insertion:","l":2},{"t":"Evacuation of air with a small IV catheter may be diagnostic but may not completely relieve a tension pneumothorax.","l":3},{"t":"Place a chest tube or Heimlich valve following needle thoracostomy, whether positive for air or not.","l":2},{"t":"Consider the possibility of bilateral pneumothoraces.","l":1},{"t":"If a bronchopleural fistula (air leak) is noted after placement of chest tube:","l":0},{"t":"Increase fresh gas flow into the anesthesia circuit.","l":1},{"t":"Increase minute ventilation to maintain normocarbia.","l":1},{"t":"Consider placing a double-lumen ETT or bronchial blocker to allow ventilation of the nonaffected lung.","l":1},{"t":"Consider high-frequency jet ventilation if available.","l":1}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Hypotension.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Venous or arterial gas embolism.","l":0},{"t":"Cardiac arrest (PEA or asystole).","l":0}],"reading":[{"t":"1. Ueda K, Ahmed W, Ross AF. Intraoperative pneumothorax identified with transthoracic ultrasound. Anesthesiology 2011;115:653-5."},{"t":"2. Jalli R, Sefidbakht S, Jafari SH. Value of ultrasound in diagnosis of pneumothorax: a prospective study. Emerg Radiol 2013;20:131-4."},{"t":"3. On-line video describing method of evaluating for pneumothorax by trans thoracic ultrasound, &lt; http://www.sonosite. com/education/learning-center/58/1425 &gt; [accessed 22.08.13]."}]}},{"id":36,"title":"Postoperative Stridor","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"Postoperative stridor is a harsh, high-pitched inspiratory sound caused by airway obstruction.","l":0}],"etiology":[{"t":"Laryngospasm:","l":0},{"t":"Persistent coaptation of the vocal cords.","l":1},{"t":"Laryngeal edema.","l":0},{"t":"Paralysis of one or both vocal cords.","l":0},{"t":"Obstruction or compression of the airway by a mass.","l":0}],"typical":[{"t":"Laryngospasm:","l":0},{"t":"Following extubation during emergence from anesthesia.","l":1},{"t":"Secretions on or near the larynx, e.g. blood.","l":1},{"t":"Recent URI.","l":1},{"t":"Hypocalcemia from parathyroid removal (24 to 48 hours following surgery).","l":1},{"t":"Laryngeal edema:","l":0},{"t":"Laryngeal surgery or instrumentation.","l":1},{"t":"Major fluid resuscitation.","l":1},{"t":"Positional.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Prone surgery.","l":3},{"t":"Prolonged Trendelenburg position.","l":3},{"t":"Especially with laparoscopic/robotic surgery.","l":3},{"t":"Hematoma or swelling secondary to lymphatic obstruction following neck surgery.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Anterior cervical spine.","l":3},{"t":"Carotid artery surgery.","l":3},{"t":"In parturients, following prolonged second stage of labor, worse with preeclampsia and eclampsia.","l":1},{"t":"Paralysis of vocal cord:","l":0},{"t":"Injury to recurrent laryngeal nerve following cervical or thoracic surgery.","l":1},{"t":"Inadequate reversal of muscle relaxants.","l":1},{"t":"Pathology involving the recurrent laryngeal nerve, e.g. metastatic bronchial carcinoma.","l":1},{"t":"Mass, secretions, blood, or fluid in the upper airway:","l":0},{"t":"Recent URI.","l":1},{"t":"Following airway surgery, e.g. panendoscopy or tonsillectomy.","l":1},{"t":"Trauma from instrumentation.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"NGT.","l":3},{"t":"TEE probe.","l":3},{"t":"Prolonged laryngoscopy.","l":3},{"t":"Secretions in a heavy smoker.","l":1},{"t":"Preexisting airway pathology.","l":1},{"t":"Retained surgical pack.","l":1},{"t":"Vocal cord polyp or laryngeal tumor.","l":1}],"prevention":[{"t":"Administer prophylactic steroids to minimize airway edema following trauma or instrumentation, or before surgery of the airway.","l":0},{"t":"Consider delaying extubation if there is significant facial edema following surgery; recover in upright position until edema resolves.","l":0},{"t":"Ensure full reversal of neuromuscular blockade.","l":0},{"t":"Carefully suction secretions from the upper airway before extubation and as necessary afterward:","l":0},{"t":"Consider prophylactic antisialogogue (<b>glycopyrrolate<\/b> IV, <b>0.2 to 0.4 mg<\/b>) prior to airway surgery.","l":1},{"t":"Remove all foreign bodies from the airway at the end of surgery.","l":0},{"t":"Extubate the trachea when the patient is awake or when anesthesia is deep enough to ablate airway reflexes.","l":0},{"t":"Maintain the patency of the airway as necessary after extubation.","l":0}],"manifestations":[{"t":"Noisy, high-pitched inspiratory sound.","l":0},{"t":"Reduced inspiratory volume.","l":0},{"t":"Retraction of the chest or neck during inspiration accompanied by use of the accessory muscles of respiration.","l":0},{"t":"Restlessness and dyspnea that are aggravated by increasing respiratory efforts or attempts to cough up secretions.","l":0},{"t":"<b>Hypoxemia<\/b> and <b>cyanosis<\/b>.","l":0},{"t":"Increasing ET CO<sub>2<\/sub> and PaCO<sub>2<\/sub>.","l":0}],"similar":[{"t":"Airway obstruction from other causes.","l":0},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"Epiglottitis (see Event 31, Epiglottitis [Supraglottitis]).","l":0},{"t":"Anterior mediastinal mass (see Event 27, Anterior Mediastinal Mass).","l":0},{"t":"Intrathoracic airway obstruction.","l":0},{"t":"Anxiety reaction.","l":0}],"management":[{"t":"<b>Administer 100% O<sub>2<\/sub>.<\/b>","l":0},{"t":"Suction the oropharynx to remove secretions.","l":0},{"t":"Assist ventilation with CPAP:","l":0},{"t":"Use anesthesia breathing circuit or nonrebreather (Mapleson) circuit.","l":1},{"t":"Administer a small dose of <b>succinylcholine<\/b> IV, <b>0.3 mg/kg<\/b>, or IM, <b>0.6 mg/kg<\/b>, and continue mask ventilation with CPAP.","l":1},{"t":"Call respiratory therapy to assist management:","l":0},{"t":"Set up for noninvasive ventilatory support.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"BiPAP.","l":3},{"t":"CPAP.","l":3},{"t":"Consider nebulized racemic <b>epinephrine<\/b>, <b>1 mg<\/b> of a 1:1000 solution (<b>1 mL<\/b>) in <b>5 mL<\/b> of saline, repeated every 30 minutes:","l":1},{"t":"Monitor for tachycardia and hypertension.","l":2},{"t":"Administer Heliox (helium concentration between <b>50%<\/b> and <b>70%<\/b>) if available.","l":1},{"t":"Consider dexmedetomidine IV (0.2 to 0.5 μg/kg/hr) for anxiolysis.","l":1},{"t":"Provide airway support maneuvers if level of consciousness is depressed:","l":0},{"t":"Jaw thrust.","l":1},{"t":"Oral or nasal airway.","l":1},{"t":"Check adequacy of the reversal of neuromuscular blockade, administer additional anti<b>cholinesterase if necessary (see Event 56, Postoperative Failure to Breathe).<\/b>","l":0},{"t":"Consider reversal of opioids and benzodiazepines in presence of depressed consciousness (see Event 56, Postoperative Failure to Breathe).","l":0},{"t":"If stridor does not resolve, respiratory distress continues, or hypoxemia develops:","l":0},{"t":"Call for help.","l":1},{"t":"Prepare for emergency reintubation.","l":1},{"t":"Prepare for surgical airway, e.g. cricothyrotomy.","l":1},{"t":"Treatment of specific underlying situations:","l":0},{"t":"Following neck surgery:","l":1},{"t":"Call for the surgeon <b>immediately<\/b>.","l":2},{"t":"Remove any dressings from the wound.","l":2},{"t":"If a hematoma is found, cut the wound sutures:","l":2},{"t":"This will require subsequent surgical exploration of the wound for hemostasis and reclosure.","l":3},{"t":"Reintubate the trachea if there is no immediate improvement in the patient’s airway:","l":2},{"t":"Intubation may be difficult because of airway edema.","l":3},{"t":"Prepare for difficult tracheal intubation (see Event 3, Difficult Tracheal Intubation).","l":3},{"t":"Perform intubation in the OR if the patient is stable.","l":3},{"t":"Use a smaller ETT than was used in original surgery.","l":3},{"t":"Following airway surgery:","l":1},{"t":"Call for the surgeon <b>immediately<\/b>.","l":2},{"t":"Administer steroids:","l":2},{"t":"<b>Dexamethasone<\/b> IV, <b>8 to 20 mg<\/b>.","l":3},{"t":"Consider nebulized racemic <b>epinephrine<\/b>, <b>1 mg<\/b> of a 1:1000 solution (<b>1 mL<\/b>) in <b>5 mL<\/b> of saline, repeated every 30 minutes:","l":2},{"t":"Monitor for tachycardia and hypertension.","l":3},{"t":"Consider the possibility of retained gauze, throat packs, or other foreign body in the airway.","l":2},{"t":"Prepare for direct examination of the airway and/or reintubation.","l":2}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Inability to reintubate.","l":0},{"t":"Airway trauma due to difficult intubation.","l":0},{"t":"Aspiration of gastric contents.","l":0},{"t":"Pulmonary edema due to excessive negative intrathoracic pressure.","l":0},{"t":"Contamination of surgical wounds opened to relieve pressure in the neck.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Bharti N. Dexmedetomidine for the treatment of severe postoperative functional stridor. Anaesth Intensive Care 2012;40:354-5."}]}},{"id":37,"title":"Unplanned Extubation","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"An unplanned extubation is any unplanned dislodgement or removal of the ETT (or other SGA device) from the airway.","l":0}],"etiology":[{"t":"Mechanical traction on the breathing circuit, ETT, or SGA.","l":0},{"t":"Inadequately secured airway device.","l":0},{"t":"Poor fit, e.g. RAE ETT in large adults.","l":0},{"t":"Self-extubation.","l":0}],"typical":[{"t":"When the patient’s position is changed:","l":0},{"t":"Moving the operating table relative to the anesthesia workstation, e.g. turning table 180 degrees.","l":1},{"t":"Moving the patient from one bed or table to another.","l":1},{"t":"Moving the patient into a surgical position.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Lithotomy.","l":3},{"t":"Prone.","l":3},{"t":"Repositioning of the head and neck during surgery.","l":0},{"t":"When manipulating the anesthesia breathing circuit hoses or surgical drapes.","l":0},{"t":"Taking adhesive surgical drapes down at the end of the case.","l":0},{"t":"When attempting to reposition an ETT.","l":0},{"t":"During placement or removal of a NGT or TEE probe.","l":0},{"t":"When repositioning fluoroscope during surgery.","l":0}],"prevention":[{"t":"Secure the ETT following placement:","l":0},{"t":"Prepare the skin with benzoin solution and let dry.","l":1},{"t":"Tape the ETT to the skin securely.","l":1},{"t":"Note the markings of the ETT at the gums or teeth.","l":1},{"t":"<b>Avoid<\/b> attaching the ETT to the operating table or other devices.","l":1},{"t":"Add extension hoses to the breathing circuit or move OR table to minimize pulling on breathing circuit.","l":1},{"t":"Consider administering <b>glycopyrrolate<\/b> IV, <b>0.2 mg<\/b>, prior to turning to the prone position to prevent drooling loosening the adhesive tape.","l":1},{"t":"Special care is necessary for patients with facial hair.","l":1},{"t":"Hold the ETT securely in place or disconnect from the breathing circuit as the patient’s position is changed.","l":0},{"t":"Check ETT after positioning the patient.","l":0},{"t":"Reconnect the ETT and turn on the ventilator after completing patient movement.","l":0},{"t":"Use properly sized RAE ETT.","l":0},{"t":"Hold the ETT in place during procedures.","l":0},{"t":"such as:","l":1,"e":1},{"t":"Fiberoptic bronchoscopy.","l":2},{"t":"Direct laryngoscopy.","l":2},{"t":"If the patient is in the lateral or prone position, be prepared to move the patient into the supine position should reintubation become necessary.","l":0},{"t":"<b>Avoid<\/b> placing surgical drapes on ETT or tape holding ETT in place.","l":0}],"manifestations":[{"t":"Major leak in the anesthesia breathing circuit:","l":0},{"t":"The leak may develop slowly, as the extubation may not be complete.","l":1},{"t":"The ventilator bellows collapses or the reservoir bag does not move.","l":1},{"t":"The smell of volatile anesthetic may be apparent.","l":1},{"t":"Sounds of a gas leak may be heard.","l":1},{"t":"Low pressure, volume, or <b>apnea<\/b> alarms may sound.","l":1},{"t":"An excessive amount of air in the ETT cuff may be required to achieve a seal.","l":1},{"t":"Decreased or zero PIP.","l":0},{"t":"Decreased or zero expiratory gas flow measured by spirometry.","l":0},{"t":"Decreased or no ET CO<sub>2<\/sub>.","l":0},{"t":"On laryngoscopy, ETT may be visualized outside the trachea.","l":0},{"t":"Gastric distention may occur.","l":0},{"t":"Late signs of hypoventilation:","l":0},{"t":"<b>Hypoxemia<\/b>.","l":1},{"t":"<b>Hypercarbia<\/b>.","l":1}],"similar":[{"t":"ETT cuff rupture.","l":0},{"t":"Disconnection or other major leak in the anesthesia breathing circuit or anesthesia workstation (see Event 69, Major Leak in the Anesthesia Breathing Circuit).","l":0},{"t":"Loss of O<sub>2<\/sub> pipeline supply (see Event 68, Loss of Pipeline Oxygen).","l":0},{"t":"Ventilator failure (see Event 71, Ventilator Failure).","l":0}],"management":[{"t":"<b>Confirm the diagnosis:<\/b>","l":0},{"t":"Determine whether signs are due to unplanned extubation, disconnect, or other problem:","l":1},{"t":"Check for disconnect of the breathing circuit and reconnect if present.","l":2},{"t":"Switch to manual ventilation:","l":1},{"t":"Feel the compliance of the lungs and anesthesia breathing circuit.","l":2},{"t":"Check ET CO<sub>2<\/sub> and oxygenation.","l":2},{"t":"If the head of bed is 90 to 180 degrees away, call for help as correction of the problem may require two people.","l":1},{"t":"Palpate the pilot balloon of the ETT to ensure cuff is inflated:","l":1},{"t":"Place more air into cuff and reassess with manual ventilation.","l":2},{"t":"Compensate for any leak in the anesthesia breathing circuit:","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> and increase fresh gas flow.","l":1},{"t":"<b>Inform the surgeon:<\/b>","l":0},{"t":"If necessary, clear the access to the airway.","l":1},{"t":"If the airway is in or near the surgical field, halt the surgery and cover the wound with a sterile drape.","l":1},{"t":"Perform a direct or video-assisted laryngoscopy to determine the position of the ETT:","l":0},{"t":"Reposition or replace the ETT into the trachea.","l":1},{"t":"Consider using airway exchange catheter or fiberoptic bronchoscope to reposition ETT.","l":1},{"t":"Place bougie through ETT if tip is in the larynx but tube will not pass into the trachea.","l":1},{"t":"If repositioning or reintubation of ETT is not easily accomplished:","l":0},{"t":"Mask ventilate the patient with <b>100%<\/b> FiO<sub>2<\/sub> if O<sub>2<\/sub> saturation is less than <b>95%<\/b>.","l":1},{"t":"Place an SGA if mask ventilation is difficult or immediate reintubation is not possible:","l":1},{"t":"If intubation is necessary, consider intubating through the SGA or use an intubating LMA.","l":2},{"t":"If O<sub>2<\/sub> saturation improves, attempt reintubation and have contingency plans:","l":1},{"t":"Video-assisted laryngoscopy, direct laryngoscopy, fiberoptic bronchoscopy, surgical airway.","l":2},{"t":"If oxygenation cannot be maintained, move aggressively to cricothyrotomy (see Event 3, Difficult Tracheal Intubation).","l":0},{"t":"If the patient is in the prone or lateral position:","l":0},{"t":"Call for help.","l":1},{"t":"Bring gurney into the room for possible repositioning.","l":1},{"t":"If the patient’s O<sub>2<\/sub> saturation is lower than <b>95%<\/b> or there is no ET CO<sub>2<\/sub> waveform:","l":1},{"t":"Move patient emergently to the supine position for mask ventilation and reintubation.","l":2},{"t":"If the patient’s O<sub>2<\/sub> saturation is higher than <b>95%<\/b> and there is an ET CO<sub>2<\/sub> waveform:","l":1},{"t":"Continue to ventilate manually with small tidal volumes and low airway pressures.","l":2},{"t":"Consider fiberoptic bronchoscopy to confirm the diagnosis and to reposition the ETT.","l":2},{"t":"If the preceding fails, move patient to the supine position for mask ventilation and reintubation.","l":2},{"t":"If the patient was difficult to intubate at the beginning of the case:","l":1},{"t":"Call for help.","l":2},{"t":"Position the patient supine.","l":2},{"t":"Mask ventilate with <b>100%<\/b> FiO<sub>2<\/sub>.","l":2},{"t":"Assemble the equipment needed for a difficult intubation (see Event 3, Difficult Tracheal Intubation):","l":2},{"t":"Contingency plans include SGA, video-assisted laryngoscopy, direct laryngoscopy, fiberoptic bronchoscopy, surgical airway.","l":3},{"t":"Consider terminating the surgery and awakening the patient.","l":1}],"complications":[{"t":"Aspiration of gastric contents.","l":0},{"t":"Airway trauma from repeated instrumentation.","l":0},{"t":"Esophageal intubation.","l":0},{"t":"Contamination of the surgical wound.","l":0},{"t":"Disconnection or accidental removal of monitoring lines or sensor monitors during repositioning of the patient.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Cardiac arrest.","l":0}]}},{"id":38,"title":"Addisonian Crisis (Acute Adrenal Insufficiency)","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"Addisonian crisis, or acute adrenal insufficiency, is a relative or absolute deficiency of adrenal corticosteroid hormones resulting in hemodynamic or other compromise.","l":0}],"etiology":[{"t":"Primary adrenal insufficiency (Addison disease).","l":0},{"t":"Secondary adrenal insufficiency (pituitary disease).","l":0},{"t":"Failure of hormone synthesis:","l":0},{"t":"Etomidate inhibits adrenal corticosteroid synthesis:","l":1},{"t":"Should be used with caution in critically ill patients.","l":2}],"typical":[{"t":"Patients who have primary or secondary adrenal insufficiency.","l":0},{"t":"Abrupt termination of steroid therapy.","l":0},{"t":"Patients with a recent history of:","l":0},{"t":"Steroid therapy who are stressed by major surgery.","l":1},{"t":"Perioperative infections.","l":1},{"t":"Septic patients unresponsive to vasopressor therapy.","l":0}],"prevention":[{"t":"Administer preoperative corticosteroids to any patient who has received adrenal suppressive doses of corticosteroids (more than 5 mg/day, for more than 3 weeks, of prednisone or equivalent) within the year prior to surgery:","l":0},{"t":"Major surgery or stress:","l":1},{"t":"<b>Hydrocortisone<\/b> IV, <b>100 mg<\/b> prior to induction of anesthesia, followed by 200 to 300 mg/day in divided doses.","l":2},{"t":"Minor surgery or stress:","l":1},{"t":"<b>Hydrocortisone<\/b> IV, <b>50 mg<\/b> prior to induction of anesthesia, followed by 100 to 200 mg/day in divided doses.","l":2},{"t":"Identify patients with primary or secondary adrenal insufficiency.","l":0},{"t":"Have a high index of suspicion for adrenal insufficiency in patients with significant systemic diseases that are often treated with corticosteroids.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Connective tissue diseases.","l":2},{"t":"Asthma.","l":2},{"t":"Careful communication with patients to identify steroid use before surgery.","l":0}],"manifestations":[{"t":"<i>Onset may be acute or delayed to the postoperative period.<\/i>","l":0},{"t":"<b>Hypotension<\/b> or shock refractory to treatment with fluids and vasopressors.","l":0},{"t":"Hypoglycemia:","l":0},{"t":"Hyponatremia.","l":1},{"t":"Hyperkalemia.","l":1},{"t":"And.","l":1},{"t":"Nausea and vomiting.","l":0}],"similar":[{"t":"Septic shock (see Event 13, The Septic Patient).","l":0},{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"Hypotension secondary to other etiologies (see Event 9, Hypotension).","l":0},{"t":"Patients on antihypertensive medications, e.g. ACEI.","l":0}],"management":[{"t":"If hypotension or cardiovascular collapse occurs in the patient at risk of adrenal insufficiency:","l":0},{"t":"Rapidly expand circulating fluid volume (<b>crystalloid<\/b> and/or <b>colloid<\/b>).","l":1},{"t":"Administer <b>hydrocortisone<\/b> IV, <b>100 mg<\/b> bolus, repeat q8 h.","l":1},{"t":"Replace Na+ using normal saline (NS).","l":1},{"t":"Replace K+ if hypokalemic (see Event 42, Hypokalemia).","l":1},{"t":"Administer <b>dextrose<\/b> to correct hypoglycemia if present (see Event 41, Hypoglycemia).","l":1},{"t":"Hemodynamic support with vasopressors, inotropes as necessary:","l":1},{"t":"<b>Ephedrine<\/b> IV, <b>5 to 20 mg<\/b>, escalate as necessary.","l":2},{"t":"<b>Phenylephrine<\/b> IV, <b>100 to 200 µg<\/b>, escalate as necessary.","l":2},{"t":"<b>Epinephrine<\/b> IV, <b>5 to 20 µg<\/b>, escalate as necessary.","l":2},{"t":"Identify and treat underlying causes of adrenal insufficiency if possible.","l":1},{"t":"Ensure that other more likely etiologies of hypotension and shock are not responsible for hypotension:","l":0},{"t":"Hypovolemia (see Event 1, Acute Hemorrhage, and Event 9, Hypotension).","l":1},{"t":"Anesthetic or drug overdose (see Event 72, Volatile Anesthetic Overdose).","l":1},{"t":"Primary cardiovascular impairment (see Event 15, Acute Coronary Syndrome, and Event 20, Pulmonary Edema).","l":1},{"t":"High intrathoracic pressure (see Event 7, High Peak Inspiratory Pressure).","l":1},{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":1},{"t":"If no response to <b>hydrocortisone<\/b> and IV fluid administration:","l":0},{"t":"TEE or TTE to assess myocardial filling and function.","l":1},{"t":"<b>Laboratory studies:<\/b>","l":0},{"t":"Plasma electrolytes and glucose.","l":1},{"t":"Baseline cortisol and adrenocorticotropic hormone (ACTH) levels (ideally draw before administering <b>hydrocortisone<\/b>, but if hypotension is life-threatening, <b>do not<\/b> delay therapy).","l":1},{"t":"Suspect adrenal crisis in older patients who remain vasopressor dependent after surgical procedures despite adequate volume resuscitation.","l":0}],"complications":[{"t":"Refractory hypotension.","l":0},{"t":"Organ hypoperfusion/dysfunction.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"Complications of steroid therapy, e.g. hyperglycemia.","l":0}],"reading":[{"t":"1. Schwartz JJ, Akhtar S, Rosenbaum SH. Endocrine function. In: Barash PG, Cullen BF, Stoelting RK, Calahan M, Stock MC, editors. Clinical anesthesia. 6th ed. Philadelphia: Lippincott Williams &amp; Wilkins; 2009. p. 1289-91."},{"t":"2. Coursin DB, Wood KE. Corticosteroid supplementation for adrenal insufficiency. JAMA 2002;287:236-40."},{"t":"3. Jung C, Inder WJ. Management of adrenal insufficiency during the stress of medical illness and surgery. Med J Aust 2008;188:409-13."},{"t":"4. Connery LE, Coursin DB. Assessment and therapy of selected endocrine disorders. Anesthesiol Clin North Am 2004;22:93-123."}]}},{"id":39,"title":"Diabetic Ketoacidosis","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"Diabetic ketoacidosis (DKA) is a metabolic acidosis associated with hyperglycemia and high levels of ketoacids in the blood and urine of the diabetic patient.","l":0}],"etiology":[{"t":"An absolute or relative deficiency of insulin, causing mobilization and oxidation of fatty acids with resulting production of ketoacids.","l":0}],"typical":[{"t":"In patients with insulin-dependent diabetes mellitus.","l":0},{"t":"When an appropriate insulin dose has been administered but the patient’s insulin requirements are increased because of:","l":0},{"t":"Trauma.","l":1},{"t":"Concurrent infection.","l":1},{"t":"Excessive fluid losses or inadequate fluid intake.","l":1},{"t":"Increased catabolic stress.","l":1},{"t":"An absolute deficiency of insulin:","l":0},{"t":"Inadequate insulin dose administered.","l":1},{"t":"Delayed absorption of SC insulin due to poor peripheral perfusion.","l":1}],"prevention":[{"t":"<i>Prevention of DKA, rather than prevention of hyperglycemia, is the primary aim of surgical care of the diabetic patient.<\/i>","l":0},{"t":"Identify <b>insulin<\/b>-dependent patients preoperatively and optimize therapy:","l":0},{"t":"The appropriate perioperative <b>insulin<\/b> regimen <b>must<\/b> be based on prior <b>insulin<\/b> requirements, the patient’s history, the timing of surgery, and frequent measurements of blood glucose:","l":1},{"t":"Most <b>insulin<\/b>-dependent patients should receive some <b>insulin<\/b> on the day of surgery.","l":2},{"t":"Maintain euglycemia or mild hyperglycemia during anesthesia and surgery; the goal is 100 to 180 mg/dL.","l":2},{"t":"Treat infections early and aggressively with antibiotics.","l":2},{"t":"Replace fluid losses or treat dehydration aggressively.","l":2}],"manifestations":[{"t":"The conscious patient may complain of nausea, vomiting, hunger, abdominal pain, sweating, or demonstrate confusion and/or altered level of consciousness.","l":0},{"t":"<b>Hypovolemia<\/b>.","l":0},{"t":"<b>Hypotension<\/b>.","l":0},{"t":"<b>Tachycardia<\/b>.","l":0},{"t":"Metabolic acidosis with increased anion gap.","l":0},{"t":"Hyperventilation (Kussmaul breathing) to compensate for metabolic acidosis.","l":0},{"t":"Polyuria or <b>oliguria<\/b> depending on the patient’s underlying fluid volume status.","l":0}],"similar":[{"t":"Other forms of metabolic acidosis (see Event 46, Metabolic Acidosis).","l":0},{"t":"Hyperosmolar hyperglycemic nonketotic syndrome.","l":0},{"t":"Hypovolemia from other causes (see Event 9, Hypotension).","l":0},{"t":"Abdominal pain from other causes.","l":0},{"t":"Hyperglycemia from other causes.","l":0}],"management":[{"t":"<b>Confirm the diagnosis:<\/b>","l":0},{"t":"Obtain blood and urine samples for:","l":1},{"t":"ABGs.","l":2},{"t":"Serum glucose.","l":2},{"t":"Serum ketoacids.","l":2},{"t":"Serum lactate.","l":2},{"t":"Serum electrolytes.","l":2},{"t":"including:","l":3,"e":1},{"t":"PO43−.","l":4},{"t":"Mg2+.","l":4},{"t":"Serum creatinine and BUN.","l":2},{"t":"Plasma osmolality.","l":2},{"t":"CBC with differential.","l":2},{"t":"Urine ketoacids.","l":2},{"t":"Troponin.","l":2},{"t":"Blood cultures.","l":2},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Intubate the trachea if the patient is obtunded or if respiratory distress is present.","l":1},{"t":"Expand the circulating fluid volume:","l":0},{"t":"Administer <b>500 to 1000 mL<\/b> of <b>crystalloid<\/b>.","l":1},{"t":"Additional fluid administration should be based on the patient’s response:","l":1},{"t":"Average fluid deficit is 3 to 6 L.","l":2},{"t":"If the patient has CAD, CHF, or renal failure, place an <b>arterial line<\/b> and consider a <b>CVP<\/b> catheter to assess/monitor filling pressures and fluid responsiveness, and to guide fluid management.","l":2},{"t":"<b>Begin insulin therapy:<\/b>","l":0},{"t":"Administer regular <b>insulin<\/b> IV, <b>10 units<\/b>.","l":1},{"t":"Initiate an IV infusion of regular <b>insulin<\/b> at 5 to 10 units/hr.","l":1},{"t":"<b>Avoid<\/b> SC <b>insulin<\/b> administration as absorption through this route is variable.","l":1},{"t":"Administer NaHCO<sub>3<\/sub> only for profound acidosis (pH below 7.1) (see Event 46, Metabolic Acidosis).","l":0},{"t":"Repeat measurements of serum glucose, electrolytes, and ABGs q1-2h until the values normalize:","l":0},{"t":"When blood glucose reaches 250 to 300 mg/dL:","l":1},{"t":"Consider adding glucose to IV solutions.","l":2},{"t":"Reduce <b>insulin<\/b> infusion rate, but continue infusion until anion gap normalizes.","l":2},{"t":"Replace K+ deficit once urine output is ensured (see Event 42, Hypokalemia):","l":1},{"t":"Most patients with DKA have a large total body K+ deficit.","l":2},{"t":"<b>Replace PO43<\/b>−, Mg2+ as indicated by laboratory measurements.","l":0},{"t":"Treat underlying etiology (infection, sepsis, MI, etc.).","l":0},{"t":"Consult an internist or endocrinologist to assist in the patient’s perioperative management.","l":0},{"t":"Consider briefly delaying urgent surgery to adequately resuscitate the patient.","l":0},{"t":"Cancel elective procedure.","l":0}],"complications":[{"t":"Hypotension.","l":0},{"t":"Hypoglycemia.","l":0},{"t":"Hypokalemia.","l":0},{"t":"Hyperkalemia.","l":0},{"t":"Pulmonary edema.","l":0},{"t":"Thrombotic events.","l":0}],"reading":[{"t":"1. Schwartz JJ, Akhtar S, Rosenbaum SH. Endocrine function. In: Barash PG, Cullen BF, Stoelting RK, Calahan M, Stock MC, editors. Clinical anesthesia. 6th ed. Philadelphia: Lippincott Williams &amp; Wilkins; 2009. p. 1300."},{"t":"2. Kitabchi AE, Umpierrez GE, Miles JM, Fisher JN. Hyperglycemic crises in adult patients with diabetes. Diabetes Care 2009;32:1335-43."},{"t":"3. Dagogo-Jack S, George MM, Alberti K. Management of diabetes mellitus in surgical patients. Diabetes Spectrum 2002;15:44-8."}]}},{"id":40,"title":"Hyperkalemia","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"Hyperkalemia is a serum K+ level &gt;5.5 mEq/L.","l":0}],"etiology":[{"t":"Excessive intake:","l":0},{"t":"Excessive parenteral or oral K+ supplements.","l":1},{"t":"Massive blood transfusion.","l":1},{"t":"Administration of hyperkalemic cardioplegia solution.","l":1},{"t":"Inadequate excretion of K+:","l":0},{"t":"Renal failure.","l":1},{"t":"Adrenal insufficiency.","l":1},{"t":"K+-sparing diuretics.","l":1},{"t":"Administration of ACEIs:","l":1},{"t":"Indirectly reduces the secretion of aldosterone.","l":2},{"t":"Shift of K+ from the tissues to the plasma:","l":0},{"t":"Extensive tissue damage:","l":1},{"t":"Muscle crushing injury, hemolysis, internal bleeding.","l":2},{"t":"Administration of succinylcholine:","l":1},{"t":"In patients with renal failure, acute SCI, upper motor neuron disorders, prolonged immobilization, or severe burn injury.","l":2},{"t":"Respiratory or metabolic acidosis.","l":1},{"t":"Acute release of K+ into the plasma from transplanted organs with a high K+ content.","l":1},{"t":"Hyperkalemic periodic paralysis.","l":1},{"t":"MH.","l":1},{"t":"Pseudohyperkalemia usually secondary to mechanical trauma caused by venipuncture.","l":1}],"typical":[{"t":"Major trauma.","l":0},{"t":"Aortic cross-clamp release.","l":0},{"t":"Cardiac and transplant surgery.","l":0},{"t":"During IV K+ replacement.","l":0},{"t":"Renal failure patients, with or without ongoing renal dialysis.","l":0},{"t":"Burn victims.","l":0},{"t":"Patients receiving massive transfusion.","l":0},{"t":"Rarely in patients receiving epsilon-aminocaproic acid.","l":0}],"prevention":[{"t":"Use appropriate K+ replacement protocols for at-risk patients.","l":0},{"t":"<b>Avoid succinylcholine<\/b> in patients susceptible to excessive K+ release.","l":0},{"t":"Measure serum K+ concentration frequently in patients at risk for hyperkalemia.","l":0},{"t":"Use continuous ECG monitoring.","l":0},{"t":"Administer K+ supplements carefully; replace only to physiologic levels.","l":0},{"t":"<b>Avoid<\/b> metabolic or respiratory acidosis.","l":0},{"t":"Dialyze hyperkalemic renal failure patients preoperatively.","l":0},{"t":"Administer blood products via an appropriate blood-warming device to <b>avoid<\/b> hemolysis and hyperkalemia.","l":0}],"manifestations":[{"t":"ECG abnormalities and <b>arrhythmias<\/b> usually seen after serum K+ is above 6.5 mEq/L:","l":0},{"t":"Tall, peaked T waves.","l":1},{"t":"Prolonged PR interval, loss of P waves, or atrial asystole.","l":1},{"t":"Complete heart block.","l":1},{"t":"Widened QRS complex.","l":1},{"t":"Sine wave-type ventricular <b>arrhythmia<\/b>.","l":1},{"t":"VF or asystole:","l":1},{"t":"If serum K+ rises rapidly, the first sign may be VF or asystole.","l":2},{"t":"Skeletal muscle weakness.","l":0}],"similar":[{"t":"Sample handling error:","l":0},{"t":"Blood sample hemolysis with poor venipuncture technique.","l":1},{"t":"In vitro hemolysis in the laboratory.","l":1},{"t":"Patients with thrombocytosis or leukocytosis.","l":0},{"t":"Transient rise following succinylcholine administration.","l":0}],"management":[{"t":"If ECG changes after induction of anesthesia suggest hyperkalemia:","l":0},{"t":"Hyperventilate the patient.","l":1},{"t":"Administer CaCl<sub>2<\/sub> <b>10%<\/b> IV, <b>500 to 1000 mg<\/b>.","l":1},{"t":"Stop administration of any K+ <b>containing solutions:<\/b>","l":0},{"t":"IV K+ replacement.","l":1},{"t":"LR IV solution (contains 4.0 mEq/L).","l":1},{"t":"PRBCs.","l":1},{"t":"Confirm diagnosis by <b>STAT<\/b> serum K+ measurement.","l":0},{"t":"If moderate or severe hyperkalemia (serum K+ greater than 6.0 mEq/L):","l":0},{"t":"Increase the blood pH:","l":1},{"t":"Hyperventilate the patient unless <b>contraindicated<\/b>.","l":2},{"t":"Administer NaHCO<sub>3<\/sub> IV, <b>50 to 150 mEq<\/b>.","l":2},{"t":"Draw blood for an <b>ABG<\/b> measurement.","l":2},{"t":"Treat underlying metabolic acidosis, if present.","l":2},{"t":"Administer CaCl<sub>2<\/sub> <b>10%<\/b> IV, <b>500 to 1000 mg<\/b>.","l":1},{"t":"Administer <b>dextrose 50%<\/b> IV, <b>50 g<\/b>, and regular <b>insulin<\/b> IV, <b>10 units<\/b>.","l":1},{"t":"Administer inhaled β<sub>2<\/sub>-agonist:","l":1},{"t":"<b>Albuterol<\/b> MDI, 6 to 10 puffs.","l":2},{"t":"Force a diuresis:","l":1},{"t":"Increase fluid administration.","l":2},{"t":"Administer loop diuretics IV, e.g. <b>furosemide<\/b> IV, <b>5 to 20 mg<\/b>.","l":2},{"t":"Patient may require a urinary catheter.","l":2},{"t":"Obtain emergent nephrologist or internist consultation to institute emergency peritoneal dialysis or hemodialysis.","l":1},{"t":"Mild hyperkalemia (serum K+ less than 6.0 mEq/L):","l":0},{"t":"Monitor trend in serum K+ every 1 to 2 hours and treat aggressively if symptoms persist or levels increase.","l":1},{"t":"Administer cation exchange resins by rectal or oral routes.","l":1}],"complications":[{"t":"Arrhythmias.","l":0},{"t":"VF.","l":0},{"t":"Complications of therapy:","l":0},{"t":"Hypokalemia.","l":1},{"t":"Alkalosis.","l":1},{"t":"Hyperosmolality.","l":1},{"t":"Hypoglycemia or hyperglycemia.","l":1},{"t":"Dialysis-related problems (vascular access, heparin-related).","l":1}],"reading":[{"t":"1. Prough DS, Funston JS, Svensen CH, Wolf SW. Fluids, electrolytes and acid–base physiology. In: Barash PG, Cullen BF, Stoelting RK, Calahan M, Stock MC, editors. Clinical anesthesia. 6th ed. Philadelphia: Lippincott Williams &amp; Wilkins; 2009. p. 313-4."},{"t":"2. Strom S. Hyperkalemia. In: Roizen MF, Fleisher LA, editors. Essence of anesthesia practice. 3rd ed. Philadelphia: Saunders; 2010. p. 190."},{"t":"3. Elliott MJ, Ronksley PE, Clase CM, Ahmed SB, Hemmelgarn BR. Management of patients with acute hyperkalemia. CMAJ 2010;182:1631-5."},{"t":"4. Weisberg LS. Management of severe hyperkalemia. Crit Care Med 2008;36:3246-51."}]}},{"id":41,"title":"Hypoglycemia","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"Hypoglycemia is a blood glucose level of &lt;70 mg/dL.","l":0}],"etiology":[{"t":"Underproduction of glucose.","l":0},{"t":"Overutilization of glucose.","l":0},{"t":"Impaired gluconeogenesis.","l":0}],"typical":[{"t":"Patients who have inadequate glucose intake:","l":0},{"t":"Chronic starvation.","l":1},{"t":"Preoperative fasting.","l":1},{"t":"Discontinuation of hyperalimentation.","l":1},{"t":"Patients who have metabolic diseases:","l":0},{"t":"Hormone deficiencies.","l":1},{"t":"Enzyme deficiency in the glycogenic pathway.","l":1},{"t":"Acquired liver disease.","l":1},{"t":"Patients taking drugs that alter glucose metabolism:","l":0},{"t":"Oral hypoglycemic agents.","l":1},{"t":"Alcohol.","l":1},{"t":"Propranolol.","l":1},{"t":"Salicylates.","l":1},{"t":"Patients with excessive circulating insulin:","l":0},{"t":"Insulin administration.","l":1},{"t":"Insulinoma.","l":1},{"t":"Newborn infants of diabetic mothers.","l":1},{"t":"“Dumping syndrome” following upper GI surgery.","l":0}],"prevention":[{"t":"Identify and treat patients at risk of hypoglycemia preoperatively:","l":0},{"t":"Optimize the patient’s metabolic status prior to surgery.","l":1},{"t":"Measure serum glucose frequently in these patients.","l":1},{"t":"Establish a preoperative infusion of a glucose-containing solution in diabetic patients who are receiving <b>insulin<\/b>:","l":0},{"t":"Reduce the patient’s daily <b>insulin<\/b> dose on the day of surgery.","l":1},{"t":"<b>Do not<\/b> administer oral hypoglycemic agents on the morning of surgery.","l":0},{"t":"Continue hyperalimentation in the perioperative period or replace it with a <b>10% dextrose<\/b> solution.","l":0}],"manifestations":[{"t":"<i>Hypoglycemia can be masked by general anesthesia or <\/i>β<i>-blockade<\/i>.","l":0},{"t":"CNS:","l":0},{"t":"In the awake patient:","l":1},{"t":"Altered mental status, irritability, tremulousness.","l":2},{"t":"Headache.","l":2},{"t":"Lethargy.","l":2},{"t":"<b>Seizures<\/b>.","l":2},{"t":"In the anesthetized patient:","l":1},{"t":"<b>Seizures<\/b>.","l":2},{"t":"Failure to awaken from general anesthesia.","l":2},{"t":"Sympathetic nervous system stimulation:","l":0},{"t":"<b>Hypertension<\/b>.","l":1},{"t":"Sweating.","l":1},{"t":"<b>Tachycardia<\/b>.","l":1},{"t":"Cardiovascular collapse is a late sign of hypoglycemia.","l":0}],"similar":[{"t":"Light anesthesia.","l":0},{"t":"Hypoxemia (see Event 10, Hypoxemia).","l":0},{"t":"TURP syndrome (see Event 43, Hyponatremia and Hypo-osmolality).","l":0},{"t":"Seizures from other causes (see Event 57, Seizures).","l":0},{"t":"Failure to awaken from general anesthesia due to other causes (see Event 55, Postoperative Alteration in Mental Status).","l":0}],"management":[{"t":"<b>Confirm the diagnosis:<\/b>","l":0},{"t":"Measure blood glucose level <b>STAT<\/b>.","l":1},{"t":"Treat suspected or known hypoglycemia:","l":0},{"t":"Therapy for hypoglycemia carries little risk, whereas failure to treat hypoglycemia may be catastrophic.","l":1},{"t":"Administer <b>dextrose 50%<\/b> IV, <b>1 mL/kg<\/b> bolus, while waiting for clinical laboratory results.","l":1},{"t":"Start a <b>dextrose 10%<\/b> IV infusion at 1 to 2 mL/kg/hr.","l":1},{"t":"Stop or reduce administration of <b>insulin<\/b> or other drugs that lower blood glucose levels.","l":0},{"t":"Monitor serum glucose frequently.","l":0},{"t":"Correct underlying metabolic problems.","l":0},{"t":"If there is no response to <b>50% dextrose<\/b> IV, consider other etiologies for CNS manifestations.","l":0}],"complications":[{"t":"CNS injury.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"Hyperglycemia and hyperosmolality from excessive glucose administration.","l":0}],"reading":[{"t":"1. Schwartz JJ, Akhtar S, Rosenbaum SH. Endocrine function. In: Barash PG, Cullen BF, Stoelting RK, Calahan M, Stock MC, editors. Clinical anesthesia. 6th ed. Philadelphia: Lippincott Williams &amp; Wilkins; 2009. p. 1300."},{"t":"2. Smiley DD, Umpierrez GE. Perioperative glucose control in the diabetic or nondiabetic patient. South Med J 2006;99:580-9."},{"t":"3. Lipshutz AKM, Gropper MA. Perioperative glycemic control: an evidence-based review. Anesthesiology 2009;110:408-21."}]}},{"id":42,"title":"Hypokalemia","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"Hypokalemia is a plasma K+ concentration of &lt;3.0 mEq/L.","l":0}],"etiology":[{"t":"GI deficiency or loss:","l":0},{"t":"Deficient dietary intake.","l":1},{"t":"NG suction.","l":1},{"t":"GI loss caused by:","l":1},{"t":"Diarrhea.","l":2},{"t":"Iliostomy drainage.","l":2},{"t":"Vomiting.","l":2},{"t":"Renal loss:","l":0},{"t":"Diuretic therapy.","l":1},{"t":"Excess mineralocorticoid or glucocorticoid effect.","l":1},{"t":"Renal tubular diseases.","l":1},{"t":"Mg2+ depletion.","l":1},{"t":"Cellular shifts:","l":0},{"t":"Metabolic or respiratory alkalosis.","l":1},{"t":"Insulin effect.","l":1},{"t":"Hypokalemic periodic paralysis.","l":1},{"t":"Hyperaldosteronism.","l":1},{"t":"β<sub>2<\/sub>-agonists and α-adrenergic antagonists enhance cellular K+ entry.","l":1}],"typical":[{"t":"<i>Acute hypokalemia presents a greater threat to patient safety than chronic hypokalemia.<\/i>","l":0},{"t":"Patients with diarrhea, vomiting, or preparation for large bowel surgery.","l":0},{"t":"Patients receiving diuretics, particularly loop diuretics.","l":0},{"t":"Following cardiac surgery.","l":0},{"t":"Following treatment of hyperkalemia.","l":0},{"t":"Hyperventilation.","l":0},{"t":"Increased availability of insulin.","l":0},{"t":"Elevated β-adrenergic stimulation, e.g. after administration of albuterol and dobutamine.","l":0}],"prevention":[{"t":"Replacement of K+ for patients receiving K+-wasting diuretics.","l":0},{"t":"IV replacement of fluids and electrolytes during cathartic preparation for bowel surgery.","l":0},{"t":"Monitor serum K+ and replace as necessary during and after CPB.","l":0},{"t":"<b>Avoid<\/b> hypomagnesemia.","l":0},{"t":"<b>Avoid<\/b> conditions that reduce serum K+ acutely:","l":0},{"t":"Hyperventilation.","l":1},{"t":"Metabolic alkalosis.","l":1},{"t":"β<sub>2<\/sub>-adrenergic stimulation.","l":1}],"manifestations":[{"t":"Serum K+ less than 3.0 mEq/L.","l":0},{"t":"Cardiac:","l":0},{"t":"ECG abnormalities (unusual until serum K+ is less than 3.5 mEq/L):","l":1},{"t":"PVCs.","l":2},{"t":"T-wave flattening or inversion.","l":2},{"t":"Increased U-wave amplitude.","l":2},{"t":"<b>ST segment depression<\/b>.","l":2},{"t":"<b>Tachycardia<\/b>.","l":2},{"t":"Digitalis toxicity may worsen significantly if combined with hypokalemia.","l":2},{"t":"AV <b>arrhythmias<\/b>:","l":1},{"t":"Cardiac conduction defects.","l":2},{"t":"<b>Cardiac arrest<\/b>.","l":2},{"t":"Neuromuscular:","l":0},{"t":"Increased sensitivity to neuromuscular blocking drugs.","l":1},{"t":"Skeletal muscle weakness causing:","l":1},{"t":"Respiratory failure.","l":2},{"t":"Paralysis.","l":2},{"t":"Decreased activity of the GI system, with paralytic ileus.","l":1},{"t":"Renal:","l":0},{"t":"Polyuria.","l":1},{"t":"Metabolic alkalosis.","l":1}],"similar":[{"t":"Laboratory error.","l":0},{"t":"Arrhythmias from other causes.","l":0},{"t":"Inadequate reversal of nondepolarizing muscle relaxants.","l":0},{"t":"Other causes of ST-T wave abnormalities (see Event 12, ST Segment Change).","l":0}],"management":[{"t":"<i>If serum K+ is greater than 3.0 mEq/L and there are no ECG changes, carefully consider whether or not to proceed with elective surgery prior to K+ replacement.<\/i>","l":0,"n":1},{"t":"Postpone elective surgery and use oral K+ replacement if serum K+ is less than 3.0 mEq/L:","l":0},{"t":"Oral replacement 20 to 80 mEq/day.","l":1},{"t":"For urgent or emergent surgery, if serum K+ is less than 3.0 mEq/L, or if the patient is symptomatic.","l":0},{"t":"Replace K+ by the IV route to achieve a serum K+ of at least 3.5 mEq/L before anesthesia induction:","l":0},{"t":"Monitor the ECG during the infusion (see Event 40, Hyperkalemia).","l":1},{"t":"Administer through a <b>CVP<\/b> line, if possible.","l":1},{"t":"Infuse no faster than 10 mEq/30 min, except for treatment of life-threatening ventricular arrhythmias in a patient known to be severely hypokalemic.","l":1},{"t":"Prevent K+ from accumulating in the IV tubing or blood-warming devices.","l":1},{"t":"Measure serum K+ hourly during rapid administration of K+.","l":1},{"t":"In the hypokalemic patient:","l":0},{"t":"Be sure that muscle relaxants are fully reversed and that the patient has recovered appropriate neuromuscular function before the trachea is extubated.","l":1},{"t":"Measure ABGs if neuromuscular function is slow to recover following surgery.","l":1}],"complications":[{"t":"Residual neuromuscular blockade.","l":0},{"t":"Hyperkalemia, myocardial arrhythmias, or cardiac arrest from excessive K+ replacement.","l":0},{"t":"Pain or thrombophlebitis at IV site from K+ replacement through a peripheral IV.","l":0}],"reading":[{"t":"1. Prough DS, Funston JS, Svensen CH, Wolf SW. Fluids, electrolytes and acid–base physiology. In: Barash PG, Cullen BF, Stoelting RK, Calahan M, Stock MC, editors. Clinical anesthesia. 6th ed. Philadelphia: Lippincott Williams &amp; Wilkins; 2009. p. 311-3."},{"t":"2. Gennari FJ. Hypokalemia. N Engl J Med 1998;339:451-8."},{"t":"3. Sladen RN. Anesthetic considerations for the patient with renal failure. Anesthesiol Clin North America 2000;18:863-82."}]}},{"id":43,"title":"Hyponatremia and Hypo-osmolality","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"Hyponatremia is an abnormally low serum Na+ (&lt;130 mEq/L).","l":0},{"t":"Hypo-osmolality is an abnormally low serum osmolality (&lt;270 mOsm/L).","l":0}],"etiology":[{"t":"Hemodilution.","l":0},{"t":"Decreased renal free water clearance.","l":0},{"t":"Pseudohyponatremia:","l":0},{"t":"Low serum Na+ with normal or elevated osmolality.","l":1}],"typical":[{"t":"Cystoscopic surgery:","l":0},{"t":"Absorption of hypotonic irrigation fluid into the prostatic venous channels.","l":1},{"t":"Hyperglycinemia secondary to the use of glycine-containing irrigation fluid (usually pseudohyponatremia as the serum osmolality may be near normal).","l":1},{"t":"Infusion of hypotonic IV fluids, especially D5W.","l":0},{"t":"Impaired mechanisms of renal free water excretion:","l":0},{"t":"Chronic renal failure.","l":1},{"t":"Administration of drugs:","l":1},{"t":"Oxytocin.","l":2},{"t":"Nonsteroidal anti-inflammatory drugs (NSAIDs).","l":2},{"t":"Thiazide diuretics.","l":2},{"t":"Decreased renal blood flow associated with major surgery.","l":1},{"t":"Syndrome of inappropriate secretion of antidiuretic hormone (SIADH).","l":1},{"t":"Psychogenic polydipsia.","l":0},{"t":"Patients with metabolic abnormalities causing pseudohyponatremia:","l":0},{"t":"Hyperglycemia.","l":1},{"t":"Hyperproteinemia.","l":1},{"t":"Hyperlipidemia.","l":1}],"prevention":[{"t":"During TURP surgery:","l":0},{"t":"Use bipolar (instead of monopolar) resection systems (allows NS as irrigant).","l":1},{"t":"<b>Avoid<\/b> using sterile water as the irrigation fluid.","l":1},{"t":"Minimize resection time and consider staged procedure if large resection is necessary.","l":1},{"t":"Achieve adequate venous sinus hemostasis.","l":1},{"t":"<b>Avoid<\/b> high irrigation pressures (adjust height of irrigation fluid).","l":1},{"t":"<b>Avoid<\/b> hypotonic fluid replacement.","l":0},{"t":"Check Na+ levels frequently in:","l":0},{"t":"Patients with chronic renal failure.","l":1},{"t":"Patients undergoing prolonged TURP.","l":1},{"t":"Patients receiving drugs that can cause hyponatremia.","l":1}],"manifestations":[{"t":"Decrease in serum Na+ concentration.","l":0},{"t":"In the awake patient:","l":0},{"t":"Restlessness, disorientation.","l":1},{"t":"Visual disturbances.","l":1},{"t":"Nausea, vomiting.","l":1},{"t":"Altered mental status.","l":1},{"t":"In any patient:","l":0},{"t":"Preseizure irritability.","l":1},{"t":"<b>Seizures<\/b>.","l":1},{"t":"Signs and symptoms of circulating fluid volume overload:","l":0},{"t":"<b>Tachycardia<\/b> or <b>bradycardia<\/b>.","l":1},{"t":"<b>Hypertension<\/b>.","l":1},{"t":"Increased CVP.","l":1},{"t":"Decreased O<sub>2<\/sub> saturation.","l":1},{"t":"Dyspnea.","l":1},{"t":"Crackles on auscultation of the lungs.","l":1},{"t":"Pulmonary or laryngeal <b>edema<\/b>.","l":0},{"t":"Intravascular hemolysis.","l":0}],"similar":[{"t":"Anxiety during regional anesthesia.","l":0},{"t":"Hypoxemia from other causes (see Event 10, Hypoxemia).","l":0},{"t":"Altered mental status as a result of:","l":0},{"t":"Sedative drugs.","l":1},{"t":"Delirium.","l":1},{"t":"Organic brain syndrome.","l":1},{"t":"Myocardial ischemia, infarction (see Event 15, Acute Coronary Syndrome).","l":0}],"management":[{"t":"<i>These management guidelines apply to monopolar TURP surgery. Use of bipolar resection systems in TURP surgery has been shown to decrease the incidence of hyponatremia because isotonic saline can be used as the irrigant.<\/i>","l":0,"n":1},{"t":"Inform the surgeon of the problem.","l":0},{"t":"Replace sterile water irrigation fluid with a glycine-containing irrigation solution, which has a nearly normal osmolality:","l":0},{"t":"Advise the surgeon to discontinue prostatic resection, achieve hemostasis, and terminate the procedure <b>as soon as possible<\/b>.","l":1},{"t":"Consider changing to bipolar resection for remainder of procedure.","l":1},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Administer supplemental O<sub>2<\/sub>, as necessary.","l":1},{"t":"If pulmonary or laryngeal edema develops, call for help:","l":1},{"t":"Laryngeal edema can make airway management and intubation extremely difficult.","l":2},{"t":"Consider early intubation.","l":2},{"t":"Send blood to the laboratory for <b>STAT<\/b> serum Na+ and serum osmolality:","l":0},{"t":"If serum Na+ is low but osmolality is normal or near normal, pseudohyponatremia is most likely cause:","l":1},{"t":"Glycine may be an unmeasured osmolar compound.","l":2},{"t":"Hyperglycinemia may cause symptoms similar to those of true hyponatremia.","l":2},{"t":"Reduce the bladder irrigation fluid pressure by decreasing the height of the fluid.","l":0},{"t":"If there are signs of circulating fluid volume overload:","l":0},{"t":"Decrease IV fluid rate or blood transfusion to a minimum.","l":1},{"t":"Administer <b>furosemide<\/b> IV, <b>5 to 20 mg<\/b> bolus.","l":1},{"t":"Treat hyponatremia if the patient is symptomatic or if there is true hyponatremia with a serum Na+ less than 120 mEq/L:","l":0},{"t":"Administer <b>furosemide<\/b> IV, <b>5 to 20 mg<\/b> bolus, if the patient is not hypotensive.","l":1},{"t":"Switch IV fluids to NS for slow restoration of normal Na+ concentration.","l":1},{"t":"Consider administering a <b>vasopressin<\/b> receptor antagonist, e.g. conivaptan, <b>20 mg<\/b> IV load over 30 minutes, then 20 mg/day IV infusion for 48 hours.","l":1},{"t":"<b>Do not<\/b> use hypertonic saline unless the patient is markedly symptomatic or has very low serum Na+ <b>and<\/b> low serum osmolality:","l":1},{"t":"<b>3%<\/b> hypertonic saline <b>1.5 to 2 mL/kg<\/b> (~<b>100 mL<\/b>) over 10 minutes, may repeat twice.","l":2},{"t":"Hypertonic saline may produce significant hypervolemia and neurologic injury.","l":2},{"t":"Monitor <b>CVP<\/b> or PCWP if clinically indicated:","l":0},{"t":"If pulmonary edema is present (see Event 20, Pulmonary Edema).","l":1},{"t":"If the patient has a history of CAD or CHF.","l":1},{"t":"If there are ST-T wave changes on the ECG.","l":1}],"complications":[{"t":"Hyperosmolality secondary to use of hypertonic saline.","l":0},{"t":"Cerebral edema.","l":0},{"t":"Central pontine myelinolysis or diffuse cerebral demyelination secondary to too rapid restoration of serum Na+.","l":0}],"reading":[{"t":"1. Stafford-Smith M, Shaw A, George R, Muir H. The renal system and anesthesia for urologic surgery. In: Barash PG, Cullen BF, Stoelting RK, Calahan M, Stock MC, editors. Clinical anesthesia. 6th ed. Philadelphia: Lippincott Williams &amp; Wilkins; 2009. p. 1351, 1365-66."},{"t":"2. Gowrishankar M, Lin SH, Mallie JP, Oh MS, Halperin ML. Acute hyponatremia in the perioperative period: insights into its pathophysiology and recommendations for management. Clin Nephrol 1998;50:352-60."},{"t":"3. Schrier RW, Bansal S. Diagnosis and management of hyponatremia in acute illness. Curr Opin Crit Care 2008;14:627-34."},{"t":"4. Issa MM. Technological advances in transurethral resection of the prostate: bipolar vs. monopolar TURP. J Endourol 2008;22:1587-95."}]}},{"id":44,"title":"Hypothermia","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"Hypothermia is a core body temperature below 35°C during the perioperative period.","l":0}],"etiology":[{"t":"Preexisting hypothermia.","l":0},{"t":"Depression of metabolic heat production by anesthesia.","l":0},{"t":"Increased heat loss to the environment:","l":0},{"t":"Radiation.","l":1},{"t":"Conduction.","l":1},{"t":"Convection.","l":1},{"t":"Evaporation.","l":1},{"t":"Infusion of large volumes of cold RBCs or IV solutions.","l":0}],"typical":[{"t":"Cool OR.","l":0},{"t":"Significant portions of the patient’s body exposed to the air.","l":0},{"t":"Use of cold or room-temperature fluids:","l":0},{"t":"Skin preparation solutions.","l":1},{"t":"Irrigation fluids.","l":1},{"t":"IV fluids or blood.","l":1},{"t":"Ventilation of the lungs with cool, dry gas through an ETT.","l":0},{"t":"When the abdominal or thoracic cavity is open:","l":0},{"t":"Large amount of evaporative heat loss.","l":1},{"t":"During pediatric surgery:","l":0},{"t":"High ratio of body surface area to weight.","l":1},{"t":"Direct contact between the patient and the operating table.","l":0},{"t":"Prolonged surgical cases.","l":0},{"t":"Trauma cases.","l":0},{"t":"Following environmental exposure or near-drowning.","l":0}],"prevention":[{"t":"Increase OR temperature to at least 21°C.","l":0},{"t":"Provide a local warm environment for the patient:","l":0},{"t":"Forced-air warming device.","l":1},{"t":"Prewarm OR table.","l":1},{"t":"Circulation of heated water through hydrogel pads applied to the back (able to adhere to large surface areas).","l":1},{"t":"Other warming devices.","l":1},{"t":"Cover exposed areas of the patient whenever possible including the head as it is <b>18%<\/b> of the body surface area.","l":0},{"t":"Warm all IV fluids, blood products, and irrigation fluids.","l":0},{"t":"Use passive or active breathing circuit humidification.","l":0},{"t":"Minimize exposure of viscera to the air.","l":0},{"t":"Use reflective blankets to minimize convective and radiative loss.","l":0},{"t":"Use warming lights for infants and neonates during preparation for anesthesia and surgery.","l":0}],"manifestations":[{"t":"Body temperature is lower than normal.","l":0},{"t":"Shivering in the unparalyzed or awake patient.","l":0},{"t":"Cutaneous vasoconstriction, piloerection.","l":0},{"t":"Decreased level of consciousness, reduced anesthetic requirement.","l":0},{"t":"<b>Bradycardia<\/b>.","l":0},{"t":"If <b>hypothermia<\/b> is severe (body temperature less than 30°C):","l":0},{"t":"Decreased myocardial contractility.","l":1},{"t":"Increased ventricular irritability.","l":1},{"t":"Increased SVR.","l":1},{"t":"<b>Cardiac arrest<\/b> (usually manifests as VF or asystole).","l":1},{"t":"Electrically silent EEG (if less than 18°C).","l":1},{"t":"Increased blood viscosity.","l":1},{"t":"Abnormal blood coagulation.","l":1}],"similar":[{"t":"Temperature measurement artifact.","l":0},{"t":"Local abnormalities in temperature reading, e.g. esophagus cooled by topical pericardial cooling during CPB.","l":0}],"management":[{"t":"If hypothermia is severe (below 30°C), especially after near-drowning:","l":0},{"t":"Consider CPB for rewarming.","l":1},{"t":"Monitor for and treat myocardial irritability and arrhythmias.","l":1},{"t":"Otherwise apply treatment as for major hypothermia (below).","l":1},{"t":"For major intraoperative hypothermia (below 35° <b>C):<\/b>","l":0},{"t":"Maintain neuromuscular blockade.","l":1},{"t":"Maintain normocarbia by adjusting mechanical ventilation.","l":1},{"t":"Warm the patient using:","l":1},{"t":"Forced-air warming system.","l":2},{"t":"Radiant heaters.","l":2},{"t":"Heated and humidified inspired gases.","l":2},{"t":"Warm IV fluids.","l":2},{"t":"Increased temperature of the OR or ICU room.","l":2},{"t":"Warming blanket or hydrogel pad fluid warmers.","l":2}],"complications":[{"t":"Slow metabolism of drugs.","l":0},{"t":"Slow awakening from anesthesia.","l":0},{"t":"Hypotension from rapid vasodilation during rewarming.","l":0},{"t":"Severe shivering:","l":0},{"t":"Can increase O<sub>2<\/sub> consumption by up to 800%.","l":1},{"t":"Coagulation abnormalities.","l":0},{"t":"Dermal injury due to:","l":0},{"t":"Temperature gradients between tissues.","l":1},{"t":"Warming devices.","l":1},{"t":"Myocardial ischemia secondary to CO increases to meet tissue demands.","l":0},{"t":"Arrhythmias.","l":0}],"reading":[{"t":"1. Díaz M, Becker DE. Thermoregulation: physiological and clinical considerations during sedation and general anesthesia. Anesth Prog 2010;57:25-33."},{"t":"2. Sessler DI. Temperature monitoring. In: Miller RD, editor. Miller’s anesthesia. 6th ed. Philadelphia: Churchill Livingstone; 2005. p. 1571-97."}]}},{"id":45,"title":"Malignant Hyperthermia","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"Malignant hyperthermia (MH) is a lethal disorder of skeletal muscle metabolism triggered by volatile anesthetics or succinylcholine.","l":0}],"etiology":[{"t":"MH is usually an inherited disorder (autosomal dominant with partial penetrance and variable expressivity), but spontaneous mutations can occur.","l":0},{"t":"Certain drugs can trigger MH in susceptible patients:","l":0},{"t":"Succinylcholine.","l":1},{"t":"Volatile anesthetic agents.","l":1},{"t":"Exercise or stress (including the stress of surgery) alone can trigger MH in susceptible individuals.","l":0}],"typical":[{"t":"In patients with a history (or a family history) of a prior episode of MH.","l":0},{"t":"In patients with masseter spasm following administration of succinylcholine.","l":0},{"t":"MH is more common in pediatric patients.","l":0},{"t":"In association with certain congenital abnormalities:","l":0},{"t":"Strabismus, musculoskeletal deformities, central core disease, hypokalemic periodic paralysis.","l":1}],"prevention":[{"t":"Obtain an anesthetic history for the patient and the patient’s family.","l":0},{"t":"Use a nontriggering anesthetic for known susceptible individuals or if the history is suggestive of MH susceptibility:","l":0},{"t":"Includes patients with a history of exercise-induced or heat-induced rhabdomyolysis.","l":1}],"manifestations":[{"t":"<i>MH may occur in the OR, in the PACU, or after discharge from the PACU. Approximately 50% of MH events occur in patients previously exposed to general anesthesia.<\/i>","l":0},{"t":"Initial sign of MH may be masseter muscle <b>rigidity<\/b> (MMR) after succinylcholine:","l":0},{"t":"Observe such patients carefully for further signs of MH.","l":1},{"t":"Unexplained <b>tachycardia<\/b>, <b>hypertension<\/b>, cardiovascular instability, and <b>arrhythmias<\/b>.","l":0},{"t":"Increased CO<sub>2<\/sub> production resulting in:","l":0},{"t":"Increased ET CO<sub>2<\/sub> and PaCO<sub>2<\/sub>.","l":1},{"t":"Tachypnea in spontaneously ventilating patient, overbreathing of ventilator in nonparalyzed patient being mechanically ventilated.","l":1},{"t":"Rapid exhaustion of CO<sub>2<\/sub> absorbent, increased heat production in soda lime container.","l":1},{"t":"Muscle <b>rigidity<\/b>.","l":0},{"t":"<b>Hyperthermia<\/b>:","l":0},{"t":"A late manifestation.","l":1},{"t":"Core temperature may increase by up to 1°C every 5 minutes, and reach a value as high as 45°C.","l":1},{"t":"<b>Hypoxemia<\/b>.","l":0},{"t":"Abnormal laboratory values:","l":0},{"t":"Lactic acidosis.","l":1},{"t":"Hyperkalemia.","l":1},{"t":"Markedly elevated serum CK.","l":1},{"t":"Myoglobinuria secondary to rhabdomyolysis.","l":1},{"t":"Sweating.","l":0}],"similar":[{"t":"Monitor artifact (temperature, ET CO<sub>2<\/sub>).","l":0},{"t":"Light anesthesia.","l":0},{"t":"Fever secondary to:","l":0},{"t":"Infection (see Event 13, The Septic Patient).","l":1},{"t":"Hyperthyroidism.","l":1},{"t":"Pheochromocytoma.","l":1},{"t":"Infected IV fluids or blood products.","l":1},{"t":"Inadvertent overheating of the patient by warming devices.","l":1},{"t":"Drug reactions causing tachycardia or hyperthermia:","l":0},{"t":"Neuroleptic malignant syndrome, MAO inhibitors, cocaine, methamphetamines, atropine, scopolamine.","l":1},{"t":"Elevated ET CO<sub>2<\/sub> for other reasons (see Event 32, Hypercarbia).","l":0},{"t":"Injury to the hypothalamic thermoregulatory center.","l":0},{"t":"Muscle rigidity (see Event 98, Masseter Muscle Rigidity).","l":0}],"management":[{"t":"<i>If MH is suspected (tachycardia, hypercarbia, muscle rigidity, hyperthermia):<\/i>","l":0,"n":1},{"t":"Confirm the diagnosis of MH:","l":0},{"t":"Check the ECG (HR arrhythmias).","l":1},{"t":"Check O<sub>2<\/sub> saturation.","l":1},{"t":"Check ET CO<sub>2<\/sub> and its response to hyperventilation.","l":1},{"t":"Check temperature, place a temperature probe if necessary, feel temperature of skin and CO<sub>2<\/sub> absorber.","l":1},{"t":"Draw an <b>ABG<\/b> sample to look for combined respiratory and metabolic acidosis.","l":1},{"t":"If uncertain of diagnosis, err on the side of caution by treating MH.","l":0},{"t":"<i>Once the diagnosis of MH is made:<\/i>","l":0,"n":1},{"t":"Declare an MH emergency:","l":0},{"t":"Notify the surgeons and nurses, and terminate the surgical procedure as soon as feasible.","l":1},{"t":"Call for additional help.","l":1},{"t":"Call for the MH kit.","l":1},{"t":"Turn off volatile anesthetic agents and N<sub>2<\/sub>O, administer <b>100%<\/b> O<sub>2<\/sub>:","l":0},{"t":"Intubate the trachea if not already established.","l":1},{"t":"Hyperventilate patient with <b>HIGH<\/b> fresh gas flow (<b>10 to 15 L/min<\/b>).","l":1},{"t":"<b>Do not<\/b> replace anesthesia workstation as it distracts from primary treatment.","l":1},{"t":"Assign one or more individuals to mix <b>dantrolene<\/b>; it is lifesaving and takes precedence over other supportive measures:","l":0},{"t":"<b>Dantrolene<\/b> comes as a lyophilized powder; each vial contains <b>20 mg dantrolene<\/b> and <b>3 g mannitol<\/b> (pH 9).","l":1},{"t":"Each vial <b>must<\/b> be reconstituted with <b>60 mL<\/b> sterile water.","l":1},{"t":"Multiple vials will be needed for an older child or an adult.","l":1},{"t":"Administer <b>dantrolene<\/b> IV bolus, <b>2.5 mg/kg<\/b>:","l":0},{"t":"Administer further doses of <b>dantrolene<\/b> as necessary, titrated to the HR muscle rigidity, and temperature, to a maximum of <b>10 mg/kg<\/b>.","l":1},{"t":"Initiate cooling if temperature is elevated:","l":0},{"t":"Place core temperature probes (esophageal, nasal, bladder).","l":1},{"t":"Surface cooling with ice packs to axillae and/or groin.","l":1},{"t":"Administer cold IV solutions.","l":1},{"t":"Gastric or rectal lavage with cold solution.","l":1},{"t":"Consider cold peritoneal lavage, especially with access to the peritoneum.","l":1},{"t":"Consider cooling via CPB.","l":1},{"t":"STOP COOLING WHEN CORE TEMPERATURE REACHES 38°C","l":0,"h":1},{"t":"Administer NaHCO<sub>3<\/sub> IV, <b>1 to 2 mEq/kg<\/b> initially, then as indicated by <b>ABG<\/b> results.","l":0},{"t":"<b>Correct hyperkalemia<\/b> (see Event 40, Hyperkalemia):","l":0},{"t":"CaCl<sub>2<\/sub> <b>10%<\/b> IV, <b>500-1000 mg<\/b>.","l":1},{"t":"NaHCO<sub>3<\/sub> IV, <b>50-100 mEq<\/b>.","l":1},{"t":"<b>Furosemide<\/b> IV, <b>5 to 20 mg<\/b>.","l":1},{"t":"IV glucose and <b>insulin<\/b>:","l":1},{"t":"<b>Dextrose<\/b> IV <b>50%<\/b>, <b>25 g<\/b>.","l":2},{"t":"Regular <b>insulin<\/b> IV, <b>10 units<\/b>.","l":2},{"t":"<b>Treat myocardial arrhythmias:<\/b>","l":0},{"t":"Correcting metabolic abnormalities will usually correct the arrhythmias.","l":1},{"t":"<b>Lidocaine<\/b> IV, <b>1 to 1.5 mg/kg<\/b>, is safe to use.","l":1},{"t":"DO NOT USE CALCIUM CHANNEL BLOCKERS (may cause hyperkalemia or cardiac arrest in presence of <b>dantrolene<\/b>).","l":1},{"t":"Place a urinary catheter:","l":0},{"t":"If there is decreased urine output or if there is evidence of myoglobinuria, force a diuresis (goal is urine output of at least 2 mL/kg/hr to minimize risk of renal tubular injury from rhabdomyolysis):","l":1},{"t":"<b>Mannitol<\/b> IV, 0.5 to 1 g/kg (include the <b>3 g mannitol<\/b> per vial of <b>dantrolene<\/b> in calculation).","l":2},{"t":"<b>Furosemide<\/b> IV, <b>5 to 20 mg<\/b>.","l":2},{"t":"Increase IV fluid infusion rate.","l":2},{"t":"Send blood samples to clinical laboratory for:","l":0},{"t":"CK.","l":1},{"t":"Serum K+.","l":1},{"t":"<b>PT<\/b>, <b>aPTT<\/b>, <b>platelet<\/b> count.","l":1},{"t":"Measure mixed venous blood gases if <b>CVP<\/b> catheter is in place:","l":0},{"t":"MH will be associated with:","l":1},{"t":"Decreased mixed venous O<sub>2<\/sub> (normal <b>70%<\/b> to <b>80%<\/b>).","l":2},{"t":"Increased mixed venous CO<sub>2<\/sub> (normal 46 mm Hg).","l":2},{"t":"If uncertain at any time of how to proceed:","l":0},{"t":"Consult the <b>MH Hotline (1-800-644-9737)<\/b>, outside the United States (001-303-389-1647).","l":1},{"t":"Transfer patient to ICU when stable:","l":0},{"t":"Watch carefully for signs of recurrent MH (occurs in <b>25%<\/b> in the first 24 hours).","l":1},{"t":"Repeat <b>dantrolene<\/b>, 4 mg/kg/day, in divided doses for 48 hours, discontinue if no recurrence of symptoms.","l":1},{"t":"Convert to oral <b>dantrolene<\/b> when patient is extubated and stable.","l":1},{"t":"Refer patient for a medical emergency bracelet and counseling (in the United States contact the Malignant Hyperthermia Association of the United States at 800-986-4287 or 607-674-7901).","l":1}],"complications":[{"t":"Hypothermia from excessive cooling.","l":0},{"t":"Side effects of dantrolene therapy:","l":0},{"t":"Muscle weakness.","l":1},{"t":"Double vision.","l":1},{"t":"Dizziness.","l":1},{"t":"Nausea.","l":1},{"t":"Diarrhea.","l":1},{"t":"DIC.","l":0},{"t":"Renal failure from myoglobinuria.","l":0},{"t":"Interactions between dantrolene and other drugs.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Rosenbaum H, Brandom BW, Sambuughin N. Fluids, malignant hyperthermia and other inherited disorders. In: Barash PG, Cullen BF, Stoelting RK, Calahan M, Stock MC, editors. Clinical anesthesia. 6th ed. Philadelphia: Lippincott Williams &amp; Wilkins; 2009. p. 598-613."},{"t":"2. Larach MG, Gronert GA, Allen GC, et al. Clinical presentation, treatment, and complications of malignant hyperthermia in North America from 1987 to 2006. Anesth Analg 2010;110:498-507."},{"t":"3. Hopkins PM. Malignant hyperthermia: pharmacology of triggering. Br J of Anaesth 2011;107:48-56."},{"t":"4. Malignant Hyperthermia Association of the United States. Emergency therapy for malignant hyperthermia. 2008. http://medical.mhaus.org (last accessed August 2013)."}]}},{"id":46,"title":"Metabolic Acidosis","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"Metabolic acidosis is an abnormally high level of circulating acid in the blood, producing a blood pH of &lt;7.35 and an HCO<sub>3<\/sub>− concentration &lt;21 mEq/L.","l":0}],"etiology":[{"t":"Elevated blood levels of metabolic acids (increased anion gap):","l":0},{"t":"Anion gap = [Na+] – ([Cl−] + [HCO<sub>3<\/sub>−]).","l":1},{"t":"Normal range is 9 to 13.","l":1},{"t":"Abnormally low blood levels of HCO<sub>3<\/sub>− (normal anion gap).","l":0}],"typical":[{"t":"Lactic acidosis secondary to inadequate perfusion of peripheral tissues:","l":0},{"t":"Increased lactic acid production by ischemic tissues accompanied by normal or decreased hepatic utilization of lactic acid.","l":1},{"t":"Shock or profound hypotension:","l":1},{"t":"Hypovolemic.","l":2},{"t":"Cardiogenic.","l":2},{"t":"Distributive.","l":2},{"t":"e.g.:","l":3,"e":1},{"t":"Septic shock.","l":4},{"t":"Anaphylaxis.","l":4},{"t":"Neurogenic.","l":2},{"t":"Obstructive.","l":2},{"t":"e.g.:","l":3,"e":1},{"t":"PE.","l":4},{"t":"Cardiac tamponade.","l":4},{"t":"Severe hypoxemia.","l":1},{"t":"Cardiac arrest.","l":1},{"t":"Release of arterial tourniquet or cross-clamp (transient acidosis).","l":1},{"t":"Increased production of metabolic acids:","l":0},{"t":"DKA.","l":1},{"t":"Ingestion of medications:","l":1},{"t":"Aspirin (produces organic acids).","l":2},{"t":"Methanol or ethylene glycol:","l":2},{"t":"Produce formic acid and glycolic acid/oxalic acid, respectively.","l":3},{"t":"Cyanide from IV administration of sodium nitroprusside (produces lactic acid).","l":2},{"t":"Chronic renal failure:","l":1},{"t":"Accumulation of urea and other byproducts of protein metabolism.","l":2},{"t":"MH.","l":1},{"t":"Loss of circulating HCO<sub>3<\/sub>−:","l":0},{"t":"Diarrhea.","l":1},{"t":"Pancreatic fistula.","l":1},{"t":"Renal tubular acidosis.","l":1},{"t":"Early stages of acute renal failure.","l":1},{"t":"Large volume fluid resuscitation with NS:","l":0},{"t":"Hyperchloremia, low blood level of HCO<sub>3<\/sub>−.","l":1}],"prevention":[{"t":"Maintain CO and tissue perfusion.","l":0},{"t":"Maintain urine output.","l":0},{"t":"<b>Avoid<\/b> excessive use of NS for fluid resuscitation.","l":0},{"t":"Monitor electrolyte levels frequently during cases with large fluid shifts.","l":0}],"manifestations":[{"t":"Hyperventilation:","l":0},{"t":"In spontaneously ventilating patient.","l":1},{"t":"Overbreathing of ventilator in nonparalyzed ventilated patient.","l":1},{"t":"Decreased pH on ABG.","l":0},{"t":"Decreased HCO<sub>3<\/sub>−.","l":0},{"t":"<b>Arrhythmias<\/b>.","l":0},{"t":"Decreased myocardial contractility and CO.","l":0},{"t":"Vasodilation and <b>hypotension<\/b>.","l":0},{"t":"Decreased response to endogenous catecholamines and IV vasopressors.","l":0}],"similar":[{"t":"Hyperventilation due to other causes.","l":0},{"t":"Laboratory artifact.","l":0},{"t":"Respiratory acidosis (see Event 32, Hypercarbia).","l":0}],"management":[{"t":"<b>Confirm acidosis:<\/b>","l":0},{"t":"Obtain an <b>ABG<\/b> (pH &lt; 7.35 or HCO<sub>3<\/sub>− &lt;21 mEq/L).","l":1},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Hyperventilate to a PaCO<sub>2<\/sub> of 28 to 30 mm Hg to compensate for metabolic acidosis:","l":1},{"t":"PaCO<sub>2<\/sub> less than 25 mm Hg will produce marked cerebral vasoconstriction.","l":2},{"t":"Increase FiO<sub>2<\/sub> to <b>100%<\/b> if acidosis is severe.","l":1},{"t":"Administer NaHCO<sub>3<\/sub> only to patients who have severe metabolic acidosis (pH less than 7.1) not associated with tissue hypoxia:","l":0},{"t":"Administer NaHCO<sub>3<\/sub> as needed to maintain the pH above 7.1 to 7.2:","l":1},{"t":"Administration of large amounts of NaHCO<sub>3<\/sub> during cardiac arrest can result in severe hypernatremia, hyperosmolality, increased lactic acidosis, and decreased survival.","l":2},{"t":"Administration of NaHCO<sub>3<\/sub> does not increase the pH of the blood when CO<sub>2<\/sub> excretion is impaired.","l":2},{"t":"Ensure adequate CO, perfusion pressure, and tissue O<sub>2<\/sub> delivery:","l":0},{"t":"Evaluate cardiac function with TEE, TTE, or with a PA catheter.","l":1},{"t":"Optimize CO with IV fluid and vasopressor administration:","l":1},{"t":"Administer vasopressors as necessary to maintain an adequate BP; goal is MAP at or above 65 mm Hg (see Event 9, Hypotension).","l":2},{"t":"Optimize O<sub>2<\/sub> delivery:","l":1},{"t":"Treat anemia.","l":2},{"t":"Maximize PaO<sub>2<\/sub> (<b>100%<\/b> O<sub>2<\/sub>, PEEP, optimize ventilation).","l":2},{"t":"Consider monitoring mixed venous O<sub>2<\/sub> saturation.","l":2},{"t":"Establish the cause of the acidosis:","l":0},{"t":"Review the clinical course and management to date:","l":1},{"t":"Identify possible causes of shock.","l":2},{"t":"Draw blood and other cultures as indicated.","l":2},{"t":"e.g.:","l":3,"e":1},{"t":"Urine.","l":4},{"t":"Sputum.","l":4},{"t":"Check serum electrolyte and glucose levels:","l":1},{"t":"Calculate the anion gap.","l":2},{"t":"Monitor K+ carefully.","l":2},{"t":"Send blood to clinical laboratory to measure blood levels of lactic acid and/or ketoacids.","l":1},{"t":"Send blood or urine for a toxicology screen:","l":1},{"t":"Institute appropriate therapy for toxic ingestion.","l":2},{"t":"If the patient has received sodium <b>nitroprusside<\/b> and there is no other cause for metabolic acidosis, treat for possible cyanide toxicity:","l":1},{"t":"Send blood to laboratory to measure cyanide levels.","l":2},{"t":"Administer sodium nitrite IV, <b>4 to 6 mg/kg<\/b>, over 3 minutes, followed by sodium thiosulfate IV, <b>150 to 200 mg/kg<\/b>, over 10 minutes.","l":2}],"complications":[{"t":"Tetany due to too rapid alkalization of blood.","l":0},{"t":"Hypernatremia, hypertension, fluid overload due to fluid resuscitation.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Prough DS, Funston JS, Svensen CH, Wolf SW. Fluids, electrolytes and acid–base physiology. In: Barash PG, Cullen BF, Stoelting RK, Calahan M, Stock MC, editors. Clinical anesthesia. 6th ed. Philadelphia: Lippincott Williams &amp; Wilkins; 2009. p. 292-3."},{"t":"2. Waters JH, Miller LR, Clack S, Kim JV. Cause of metabolic acidosis in prolonged surgery. Crit Care Med 1999;27:2142-6."},{"t":"3. Park CM, Chun HK, Jeon K, et al. Factors related to post-operative metabolic acidosis following major abdominal surgery. ANZ J Surg 2012; http://dx.doi.org/10.1111/j.1445-2197.2012.06235.x [Epub ahead of print] [accessed July 24, 2013]."},{"t":"4. Neligan PJ, Deutschman CS. Perioperative acid–base balance. In: Miller RD, editor. Miller’s anesthesia. 7th ed. Philadelphia: Churchill Livingstone; 2010. p. 1557-72."}]}},{"id":47,"title":"Methemoglobinemia","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"Methemoglobinemia is an abnormally high blood level of oxidized hemoglobin (methemoglobin, metHgb) (in which the iron is in the ferric [Fe3+] form).","l":0}],"etiology":[{"t":"Normal metHgb levels are &lt;1% of total Hgb.","l":0},{"t":"Acquired methemoglobinemia:","l":0},{"t":"Exposure to oxidizing agents:","l":1},{"t":"Local anesthetics (benzocaine, prilocaine, lidocaine).","l":2},{"t":"Antibiotics (trimethoprim, dapsone, sulfonamides).","l":2},{"t":"Other drugs:","l":2},{"t":"Nitrates, metoclopramide, phenytoin, aniline dyes, bromates, chlorates.","l":3},{"t":"Congenital methemoglobinemia:","l":0},{"t":"NADH metHgb reductase deficiency.","l":1},{"t":"Abnormal Hgb.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Hgb M.","l":3},{"t":"Hgb H.","l":3},{"t":"Glucose-6-phosphate dehydrogenase (G6PD) deficiency.","l":1}],"typical":[{"t":"Excessive local anesthetic administration:","l":0},{"t":"Topicalization of mucous membranes with benzocaine.","l":1},{"t":"Antibiotic administration.","l":0},{"t":"Environmental exposure to dyes.","l":0}],"prevention":[{"t":"Keep local anesthetic dose within recommended guidelines.","l":0},{"t":"<b>Avoid<\/b> excess administration of topical local anesthetics (especially benzocaine spray, EMLA cream).","l":0}],"manifestations":[{"t":"Pulse oximetry displays saturation around 85%.","l":0},{"t":"Arterial blood has a characteristic chocolate-brown color.","l":0},{"t":"Healthy patients may be asymptomatic with metHgb levels &lt;15%.","l":0},{"t":"Patients with comorbidities may have symptoms with metHgb &gt;5%:","l":0},{"t":"Dyspnea, <b>cyanosis<\/b>, mental status changes, headache, dizziness, and loss of consciousness.","l":1},{"t":"Severe symptoms seen with metHgb levels &gt;50%:","l":0},{"t":"Chest pain, <b>arrhythmias<\/b>, <b>seizures<\/b>, coma, and death.","l":1}],"similar":[{"t":"Hypoxemia (see Event 10, Hypoxemia).","l":0},{"t":"Congenital heart disease.","l":0},{"t":"CHF.","l":0},{"t":"Shock (see Event 13, The Septic Patient).","l":
