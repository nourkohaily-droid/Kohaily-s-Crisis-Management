t":"Myelomeningocele repair for spina bifida.","l":3},{"t":"Patients with congenital genitourinary abnormalities.","l":3}],"prevention":[{"t":"<b>Avoid<\/b> agents to which the patient has a documented allergy.","l":0},{"t":"Minimize the use of latex products in health care:","l":0},{"t":"If there is a history of latex allergy, establish a latex-free environment:","l":1},{"t":"<b>Avoid<\/b> contact with, or manipulation, of latex devices.","l":2},{"t":"Use nonlatex surgical gloves.","l":2},{"t":"Use syringe/stopcock methods or unidirectional valves for injecting medications.","l":2},{"t":"<b>Do not<\/b> insert a needle through any multiple-dose vial with a natural rubber stopper:","l":2},{"t":"Take the top of the vial completely off.","l":3},{"t":"Use the same medication from a glass ampule, if available.","l":3},{"t":"Use glass syringes as an alternative to plastic syringes with natural rubber seal on plunger (plastic syringes may use nonlatex seals—check manufacturer’s information for syringe materials).","l":2},{"t":"Obtain a careful history of:","l":0},{"t":"Previous allergic reactions.","l":1},{"t":"Atopy.","l":1},{"t":"Asthma.","l":1},{"t":"Significant latex exposure.","l":1},{"t":"<b>Avoid<\/b> transfusion of blood or blood products whenever possible.","l":0},{"t":"If a specific drug <b>must<\/b> be administered to a patient known to be at risk of an allergic reaction, administer <b>prophylaxis<\/b>:","l":0},{"t":"Corticosteroids, H1 antagonists.","l":1},{"t":"Administer test dose of drug.","l":0},{"t":"Obtain consultation from an allergist if a critical allergy <b>must<\/b> be defined.","l":0}],"manifestations":[{"t":"<i>Anaphylaxis has the potential for acute onset with catastrophic consequences. Severe hypo<i>tension, increased peak airway pressure, and <b>hypoxemia<\/b> are the most common initial signs but need not be present simultaneously.<\/i><\/i>","l":0},{"t":"Cardiovascular:","l":0},{"t":"Severe <b>hypotension<\/b>.","l":1},{"t":"<b>Tachycardia<\/b>.","l":1},{"t":"<b>Bradycardia<\/b> may be initial sign.","l":1},{"t":"Arrythmias.","l":1},{"t":"<b>Cardiac arrest<\/b>.","l":1},{"t":"Respiratory:","l":0},{"t":"<b>Hypoxemia<\/b>.","l":1},{"t":"Decreased lung compliance.","l":1},{"t":"Severe <b>bronchospasm<\/b>.","l":1},{"t":"Cutaneous—may be obscured by surgical drapes:","l":0},{"t":"Flushing, hives, <b>urticaria<\/b>, pruritus.","l":1},{"t":"Swelling of mucosal membranes, angioedema, head and neck swelling.","l":0}],"similar":[{"t":"Medication causing direct histamine release, e.g. morphine.","l":0},{"t":"Anesthetic overdose or medication error (see Event 72, Volatile Anesthetic Overdose, and Event 63, Drug Administration Error).","l":0},{"t":"Cutaneous allergy (rapid urticarial reactions).","l":0},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"Hypotension from other causes (see Event 9, Hypotension).","l":0},{"t":"Pulmonary edema from other causes (see Event 20, Pulmonary Edema).","l":0},{"t":"Cutaneous manifestations of mastocytosis, carcinoid syndrome, hereditary angioedema.","l":0},{"t":"Transfusion reaction (see Event 50, Transfusion Reaction).","l":0},{"t":"Cardiac tamponade (see Event 18, Cardiac Tamponade).","l":0},{"t":"Stridor (see Event 97, Laryngospasm).","l":0},{"t":"PE (see Event 21, Pulmonary Embolism).","l":0},{"t":"Vasovagal reaction.","l":0},{"t":"Septic shock (see Event 13, The Septic Patient).","l":0},{"t":"Aspiration of gastric contents (see Event 28, Aspiration of Gastric Contents).","l":0},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"Esophageal intubation.","l":0}],"management":[{"t":"Stop administration of any possible antigen (e.g. discontinue antibiotics):","l":0},{"t":"Retain blood products for analysis.","l":1},{"t":"Identify all latex products and remove from contact with the patient.","l":1},{"t":"Inform the surgeons and call for help:","l":0},{"t":"Check to see whether they have injected or instilled a substance into a body cavity.","l":1},{"t":"Consider aborting surgical procedure if severe or there is no response to initial treatment:","l":1},{"t":"Anaphylaxis can be biphasic and can recur after successful initial treatment.","l":2},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub>.","l":1},{"t":"Intubate the trachea if not already intubated:","l":1},{"t":"The airway can rapidly become edematous, making intubation more difficult or impossible.","l":2},{"t":"Anaphylaxis is treated with <b>epinephrine<\/b> (the drug of CHOICE in anaphylaxis) and IV fluid:","l":0},{"t":"<b>Epinephrine<\/b> dosing and route—drug calculations are CRITICAL:","l":1},{"t":"For patients with profound hypotension or shock and a KNOWN working IV/IO line, administer <b>epinephrine 0.5 to 1 μg/kg<\/b> and increase rapidly up to <b>10 μg/kg<\/b> as needed; maximum dose <b>1000 μg<\/b>.","l":2},{"t":"For patients in early phase without profound hypotension, shock or cardiac arrest, or for those patients in which IV/IO access HAS NOT BEEN OBTAINED, administer <b>epinephrine<\/b> IM, <b>10 μg/kg<\/b> q5-15m; maximum <b>300 μg<\/b> per dose:","l":2},{"t":"Given difficulty in obtaining IV access in children, the IM dose is preferred by some anesthesia professionals and clinicians who deal with pediatric emergencies.","l":3},{"t":"For cardiovascular collapse or cardiac arrest, give <b>epinephrine<\/b> IV, <b>10 μg/kg<\/b> (see Event 94, Cardiac Arrest in the Pediatric Patient).","l":1},{"t":"Consider <b>epinephrine<\/b> infusion (20-200 ng/kg/min) with increasing dose to maintain BP.","l":1},{"t":"Rapidly expand the circulating blood volume:","l":1},{"t":"Administer <b>10-30 mL/kg<\/b> NS or LR.","l":2},{"t":"Immediate fluid needs may be massive.","l":2},{"t":"Decrease or stop the administration of anesthetic agents if hypotension is severe.","l":0},{"t":"If bronchospasm is present:","l":0},{"t":"Administer bronchodilator:","l":1},{"t":"Inhaled β-agonist, e.g. <b>albuterol<\/b> MDI.","l":2},{"t":"Volatile anesthetic agents may be administered for bronchodilation if the patient is normotensive.","l":2},{"t":"Administer H1 and H2 histamine antagonists:","l":0},{"t":"<b>Diphenhydramine<\/b> IV, <b>1 mg/kg<\/b> up to maximum of <b>50 mg<\/b>.","l":1},{"t":"Famotidine IV, <b>0.25 mg/kg<\/b>, or ranitidine IV, <b>1 mg/kg<\/b> IV.","l":1},{"t":"<b>Administer corticosteroids:<\/b>","l":0},{"t":"<b>Methylprednisolone<\/b> IV, <b>1 to 2 mg/kg<\/b>, or <b>dexamethasone<\/b> IV, <b>0.2 mg/kg<\/b>.","l":1},{"t":"In the absence of any other cause, consider latex allergy:","l":0},{"t":"Ensure all latex products in contact with the patient have been removed from the surgical field.","l":1},{"t":"Consider placement of an <b>arterial line<\/b> and urinary catheter to help guide vasopressor and fluid management.","l":0},{"t":"Obtain blood sample for mast cell tryptase levels within 2 hours to confirm the diagnosis of anaphylaxis.","l":0},{"t":"Arrange admission to ICU for continued postoperative management.","l":0},{"t":"Consider referring patient to an allergist on discharge from the hospital.","l":0}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Inability to intubate, ventilate, or oxygenate.","l":0},{"t":"Hypertension and tachycardia from vasopressors.","l":0},{"t":"ARDS.","l":0},{"t":"Renal failure.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"DIC.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Ebo DG, Fisher MM, Hagendorens MM, et al. Anaphylaxis during anesthesia: diagnostic approach. Allergy 2007;62:471-87."},{"t":"2. Hepner DL, Castells MC. Anaphylaxis during the perioperative period. Anesth Analg 2003;97:1381-95."},{"t":"3. Karila C, Burnet-Langot D, Labbez F, et al. Anaphylaxis during anesthesia: results of a 12-year survey at a French Pediatric Center. Allergy 2005;60:828-34."},{"t":"4. Lieberman PL, Nicklas RA, Oppenheimer J, et al. The diagnosis and management of anaphylaxis practice parameter: 2010 update. J Allergy Clin Immunol 2010;126:477-522."}]}},{"id":92,"title":"Aspiration of a Foreign Body","ch":13,"cat":"Pediatric Events","s":{"definition":[{"t":"Aspiration of a foreign body into the respiratory tract.","l":0}],"etiology":[{"t":"Child placing a foreign body into the mouth.","l":0},{"t":"Tooth dislodged into the airway.","l":0},{"t":"Material left in the airway after a surgical procedure.","l":0}],"typical":[{"t":"Occurs in children between 7 months and 4 years of age with peak incidence at 1 to 2 years:","l":0},{"t":"Foreign body aspiration is a leading cause of death in children &lt;1 year of age.","l":1},{"t":"Food is the most common foreign body in the infant/toddler age groups.","l":1},{"t":"Incomplete dentition and immature swallowing coordination increase susceptibility.","l":1},{"t":"Nonorganic material.","l":1},{"t":"such as:","l":2,"e":1},{"t":"Disc batteries.","l":3},{"t":"Beads.","l":3},{"t":"Pins.","l":3},{"t":"Tacks.","l":3},{"t":"Coins.","l":3},{"t":"Parts of toys are common in older children.","l":3},{"t":"After a surgical procedure.","l":0}],"prevention":[{"t":"Encourage home-safety programs to keep food and small objects out of the reach of unsupervised toddlers.","l":0},{"t":"Perform laryngoscopy carefully.","l":0},{"t":"Consider extracting loose teeth prior to laryngoscopy.","l":0},{"t":"Double check that all materials placed in the airway are removed before extubation.","l":0}],"manifestations":[{"t":"Cough.","l":0},{"t":"Dyspnea.","l":0},{"t":"<b>Cyanosis<\/b>.","l":0},{"t":"Decreased breath sounds.","l":0},{"t":"Tachypnea.","l":0},{"t":"<b>Stridor<\/b>.","l":0},{"t":"<b>Wheezing<\/b>.","l":0},{"t":"Hemoptysis.","l":0},{"t":"Hoarseness.","l":0},{"t":"<b>Fever<\/b>.","l":0},{"t":"Aphonia.","l":0},{"t":"Recurrent pneumonia.","l":0},{"t":"Physical examination may be normal.","l":0},{"t":"Radiographic visualization of the foreign body or of air trapping, infiltrates, or atelectasis:","l":0},{"t":"The right mainstem bronchus is the most common site for a foreign body to lodge.","l":1},{"t":"Organic material may be poorly visualized on CXR.","l":1},{"t":"High-resolution spiral CT scan can characterize disease severity distal to the foreign body.","l":1}],"similar":[{"t":"Recurrent pneumonia not related to aspiration of a foreign body.","l":0},{"t":"Foreign body in the esophagus.","l":0},{"t":"Laryngospasm (see Event 97, Laryngospasm).","l":0},{"t":"Croup.","l":0},{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0}],"management":[{"t":"Obtain history of onset of symptoms from witnesses.","l":0},{"t":"Check the O<sub>2<\/sub> saturation:","l":0},{"t":"Ensure adequate oxygenation and ventilation:","l":1},{"t":"This may not be possible until foreign body is removed emergently.","l":2},{"t":"Confirm the diagnosis of foreign body aspiration:","l":0},{"t":"Perform a physical examination of the airway and chest:","l":1},{"t":"Examine upper airway anatomy.","l":2},{"t":"Check for uniformity and symmetry of breath sounds and adventitious sounds, e.g. bronchospasm.","l":2},{"t":"Obtain a CXR looking for the presence and location of a foreign body:","l":1},{"t":"Air trapping.","l":2},{"t":"Atelectasis.","l":2},{"t":"Pneumonia.","l":2},{"t":"Postobstructive airway collapse.","l":2},{"t":"Overexpansion.","l":2},{"t":"<i>Anesthetic Induction for the Patient with a Foreign Body Aspiration.<\/i>","l":0,"n":1},{"t":"Discuss the surgical approach and method of ventilation with the team in advance:","l":0},{"t":"In addition to an ENT surgeon, consider consultation with a cardiothoracic or general surgeon depending on location and severity of foreign body obstruction.","l":1},{"t":"<b>Obtain IV access.<\/b>","l":0},{"t":"Cardiovascular collapse may occur in response to movement of the foreign body causing severe hypoxemia:","l":0},{"t":"Consider the potential need for ECMO or CPB:","l":1},{"t":"Plan for this early as it takes time to set up.","l":2},{"t":"Preoxygenate the lungs prior to induction of anesthesia.","l":0},{"t":"Complete airway obstruction may occur at any time, and rigid bronchoscopy <b>must<\/b> be performed <b>immediately<\/b> to remove the obstruction or dislodge it to another site that permits ventilation.","l":0},{"t":"Perform an inhalation induction with sevoflurane and <b>100%<\/b> O<sub>2<\/sub>:","l":0},{"t":"Controlled or spontaneous ventilation may be appropriate, depending on the location of the obstruction and the surgical approach.","l":1},{"t":"IV induction may be an acceptable alternative, depending on the clinical scenario.","l":1},{"t":"Following induction of anesthesia, the bronchoscopist should intubate the trachea with a ventilating bronchoscope in order to remove the foreign body:","l":0},{"t":"There may be increased resistance to ventilation when a telescopic lens is inserted through the bronchoscope.","l":1},{"t":"Ventilation may need to be alternated with attempts to locate and remove the foreign body.","l":1},{"t":"Facilitate passage of the foreign body through the laryngeal inlet:","l":0},{"t":"Maintain an adequate depth of anesthesia to prevent patient movement or coughing.","l":1},{"t":"Total IV anesthesia will maintain a consistent level of anesthesia during frequent circuit interruptions.","l":1},{"t":"Consider administering a small dose of a short-acting muscle relaxant just prior to removing the foreign body.","l":1},{"t":"If the foreign body cannot be removed through the bronchoscope and ventilation is inad<b>equate, an emergency thoracotomy and bronchotomy may be necessary.<\/b>","l":0},{"t":"Examine the tracheobronchial tree after removal of the foreign body.","l":0},{"t":"Following endoscopic examination, intubate the trachea with an ETT or allow the p atient to awaken with a natural airway:","l":0},{"t":"The usual criteria for awake extubation should be applied.","l":1},{"t":"Allow the child with a natural airway to completely emerge prior to movement to the PACU.","l":1}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Hypercarbia.","l":0},{"t":"Laryngospasm.","l":0},{"t":"Pneumonia:","l":0},{"t":"Chemical pneumonitis.","l":1},{"t":"Bacterial infection.","l":1},{"t":"Hypotension.","l":0},{"t":"Massive hemoptysis.","l":0},{"t":"Severe bronchospasm.","l":0},{"t":"Pneumothorax.","l":0},{"t":"Airway rupture.","l":0},{"t":"Pneumomediastinum.","l":0}],"reading":[{"t":"1. Rimell FL, Thome Jr. A, Stool S, et al. Characteristics of objects that cause choking in children. JAMA 1995;274:1763-6."},{"t":"2. Ciftci AO, Bingol-Kologlu M, Senocak ME, et al. Bronchoscopy for evaluation of foreign body aspiration in children. J Pediatr Surg 2003;38:1170-6."},{"t":"3. Even L, Heno N, Talmon Y, et al. Diagnostic evaluation of foreign body aspiration in children: a prospective study. J Pediatr Surg 2005;40:1122-7."},{"t":"4. Farrell PT. Rigid bronchoscopy for foreign body removal: anaesthesia and ventilation. Pediatr Anesth 2004;14:84-9."},{"t":"5. Litman RS, Ponnuri J, Trogan I. Anesthesia for tracheal or bronchial foreign body removal in children: an analysis of ninety-four cases. Anesth Analg 2000;91:1389-91."},{"t":"6. Metrangelo S, Monetti C, Meneghini L, et al. Eight years’ experience with foreign-body aspiration in children: what is really important for a timely diagnosis? J Pediatr Surg 1999;34:1229-31."},{"t":"7. Zur K, Litman RS. Pediatric airway foreign body retrieval: surgical and anesthetic perspectives. Pediatr Anesth 2009;19:109-17."}]}},{"id":93,"title":"Bradycardia in the Pediatric Patient","ch":13,"cat":"Pediatric Events","s":{"definition":[{"t":"Bradycardia in the pediatric patient is a HR slower than the age-appropriate normal level.","l":0}],"etiology":[{"t":"Hypoxemia is a common cause of bradycardia/cardiac arrest in pediatric patients.","l":0},{"t":"Decreased automaticity of sinus node:","l":0},{"t":"Increased vagal tone.","l":1},{"t":"Drug related:","l":1},{"t":"Succinylcholine.","l":2},{"t":"Digoxin.","l":2},{"t":"Opioids.","l":2},{"t":"Cholinesterase inhibitors.","l":2},{"t":"Anesthetic agents.","l":2},{"t":"Hypothermia.","l":1},{"t":"Reflex response to hypertension:","l":1},{"t":"Treatment with phenylephrine.","l":2},{"t":"CNS mass.","l":2},{"t":"CNS conditions, e.g. autonomic dysreflexia.","l":2},{"t":"Complication from congenital heart surgery or cardiac catheterization:","l":1},{"t":"Caused by injury of the sinus node or the conduction pathway.","l":2},{"t":"Acquired heart disease:","l":0},{"t":"Cardiomyopathies, e.g. dilated or hypertrophic.","l":1},{"t":"Inflammatory.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Rheumatic fever.","l":3},{"t":"Post viral.","l":3},{"t":"Ischemic, e.g. Kawasaki disease.","l":1},{"t":"Right atrial thrombi or tumors.","l":1},{"t":"Congenital heart disease:","l":0},{"t":"Certain forms of congenital heart disease (e.g. heterotaxy syndromes) are associated with bradycardia.","l":1}],"typical":[{"t":"<i>Acute severe bradycardia from any etiology can be an indication of impending cardiac arrest in children. The most common cause of bradycardia is respiratory distress or failure.<\/i>","l":0},{"t":"Preoperative finding:","l":0},{"t":"Isolated finding in asymptomatic patient.","l":1},{"t":"Symptom of underlying medical condition:","l":1},{"t":"Pacemaker malfunction.","l":2},{"t":"Congenital or acquired heart disease.","l":2},{"t":"OSA.","l":2},{"t":"Side effect of medication.","l":2},{"t":"Prematurity.","l":2},{"t":"Increased ICP.","l":2},{"t":"Intraoperative finding:","l":0},{"t":"Medications that can cause bradycardia:","l":1},{"t":"Succinylcholine.","l":2},{"t":"Volatile anesthetics.","l":2},{"t":"Opioids, e.g. remifentanil.","l":2},{"t":"α<sub>2<\/sub>-Agonists.","l":2},{"t":"e.g.:","l":3,"e":1},{"t":"Clonidine.","l":4},{"t":"Dexmedetomidine.","l":4},{"t":"Cholinesterase inhibitors, e.g. neostigmine.","l":2},{"t":"Cardiovascular agents, e.g. esmolol or phenylephrine.","l":2},{"t":"Increased vagal stimulation:","l":1},{"t":"Mechanical/iatrogenic:","l":2},{"t":"Laryngoscopy.","l":3},{"t":"ETT too deep or pushing on carina.","l":3},{"t":"Nasopharyngeal or oropharyngeal suctioning or tube placement.","l":3},{"t":"Raised intraocular pressure or traction on eyeball.","l":3},{"t":"Tracheal suctioning.","l":3},{"t":"Traction on peritoneum.","l":3},{"t":"Bladder catheterization.","l":3},{"t":"Increased intrathoracic pressure or Valsalva maneuver.","l":3},{"t":"Normal physiologic response:","l":2},{"t":"Sleeping.","l":3},{"t":"Breath holding.","l":3},{"t":"Coughing.","l":3},{"t":"Gagging or vomiting.","l":3},{"t":"Pathophysiologic:","l":2},{"t":"Gastroesophageal reflux disease (GERD).","l":3},{"t":"Increased ICP.","l":3},{"t":"Severe OSA.","l":3},{"t":"Apnea and bradycardia of prematurity.","l":3},{"t":"Interruption of ongoing inotropic infusions, e.g. line disconnect or kinking.","l":2}],"prevention":[{"t":"Maintain adequate oxygenation and ventilation.","l":0},{"t":"Ensure appropriate position of ETT.","l":0},{"t":"Premedicate children at risk of bradycardia with an anticholinergic agent:","l":0},{"t":"<b>Glycopyrrolate<\/b> IV or IM, <b>10 to 20 μg/kg<\/b>.","l":1},{"t":"<b>Atropine<\/b> IV or IM, <b>10 to 20 μg/kg<\/b>.","l":1},{"t":"Treat bradycardia early.","l":0},{"t":"<b>Avoid<\/b> excess vagal simulation:","l":0},{"t":"External ocular pressure, traction on peritoneum, prolonged attempt at laryngoscopy.","l":1}],"manifestations":[{"t":"Slow HR:","l":0},{"t":"ECG.","l":1},{"t":"Pulse oximeter.","l":1},{"t":"Arterial line.","l":1},{"t":"Peripheral pulses.","l":1},{"t":"Junctional or ventricular escape beats.","l":1},{"t":"<b>Hypotension<\/b>.","l":0},{"t":"In the awake, nonanesthetized patient:","l":0},{"t":"Dizziness.","l":1},{"t":"Syncope.","l":1},{"t":"Altered mental status.","l":1},{"t":"Fatigue/lethargy.","l":1},{"t":"Nausea/vomiting.","l":1},{"t":"Infants and nonverbal children:","l":0},{"t":"Altered mental status.","l":1},{"t":"Irritability.","l":1},{"t":"Poor feeding.","l":1}],"similar":[{"t":"Monitor artifact:","l":0},{"t":"ECG lead disconnection or failure.","l":1},{"t":"Failure of monitor to count QRS or pulse.","l":1},{"t":"Oximeter probe misplaced or failure.","l":1},{"t":"Heart block:","l":0},{"t":"Second degree with intermittent dropped beats.","l":1},{"t":"Third-degree complete heart block with ventricular escape beats.","l":1},{"t":"Pacemaker malfunction or failure:","l":0},{"t":"Lead fracture.","l":1},{"t":"Lead disconnection.","l":1},{"t":"Inappropriate settings.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Output too low.","l":3},{"t":"Sensitivity too high.","l":3},{"t":"AF or flutter with poor perfusion.","l":0}],"management":[{"t":"Verify bradycardia and assess patient’s hemodynamic status:","l":0},{"t":"ECG, pulse oximeter, <b>arterial line<\/b>.","l":1},{"t":"Check peripheral pulse.","l":1},{"t":"Check BP.","l":1},{"t":"Check ET CO<sub>2<\/sub> waveform for evidence of adequate CO.","l":1},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Bradycardia is a common sign of hypoxemia in small infants.","l":1},{"t":"Deliver <b>100%<\/b> O<sub>2<\/sub> (except in certain forms of congenital heart disease).","l":1},{"t":"Check position of ETT.","l":1},{"t":"Consider decreasing level of anesthesia:","l":0},{"t":"Decrease or turn off volatile anesthetics, <b>propofol<\/b>, and other infusions.","l":1},{"t":"Check surgical field for operative causes:","l":0},{"t":"Alert surgeon to stop the precipitating stimulus.","l":1},{"t":"Rule out intracranial hypertension as a possible treatable etiology.","l":0},{"t":"If bradycardia is mild-moderate but stable (e.g. HR is low but not dropping or is associ<b>ated with mild-moderate symptoms such as modest decrease in BP and no change in ET CO<sub>2<\/sub>):<\/b>","l":0},{"t":"Ensure adequate IV/IO access.","l":1},{"t":"<b>Atropine<\/b> IV, IO, or endotracheal:","l":1},{"t":"IV or IO dose: <b>20 μg/kg<\/b>, NO minimum dose, maximum dose <b>0.5 mg<\/b>.","l":2},{"t":"Endotracheal dose: <b>40 to 60 μg/kg<\/b>.","l":2},{"t":"<b>Glycopyrrolate IV, 10 to 20 μg/kg<\/b>, maximum dose <b>0.4 mg<\/b>.","l":1},{"t":"<b>Ephedrine IV, 0.1 to 0.3 mg/kg<\/b>:","l":1},{"t":"Not routinely used in young children.","l":2},{"t":"<b>Consider isoproterenol<\/b> IV infusion, <b>0.1 to 1 μg/kg/min<\/b>:","l":1},{"t":"May result in vasodilation with inadequate coronary and cerebral perfusion.","l":2},{"t":"Anticipate and plan for deterioration in patient status:","l":0},{"t":"Consider obtaining crash cart and placing pediatric defibrillator/pacing pads.","l":1},{"t":"Continuously reassess for change in ECG or hemodynamic status.","l":1},{"t":"Be prepared to start CPR.","l":1},{"t":"Consider aborting procedure if problem persists.","l":1},{"t":"If bradycardia is unstable (e.g. dropping HR or associated with severe symptoms such as hypotension, loss of consciousness, or drop in ET CO<sub>2<\/sub>) (see Event 94, Cardiac Arrest in the Pediatric Patient):","l":0},{"t":"Administer <b>epinephrine<\/b> IV, IO, or endotracheal (SC/IM dosing is not appropriate treatment of bradycardia):","l":1},{"t":"IV/IO dose: <b>10 μg/kg<\/b>, maximum dose <b>1 mg<\/b>.","l":2},{"t":"Endotracheal dose: <b>100 μg/kg<\/b>, maximum dose <b>2.5 mg<\/b>.","l":2},{"t":"Call for more help and notify surgeon.","l":1},{"t":"Start CPR.","l":1},{"t":"Call an OR or hospital code.","l":1},{"t":"Call for crash cart and defibrillator if not already done:","l":1},{"t":"Place pediatric defibrillator/pacing pads on patient:","l":2},{"t":"Consider pacing the patient:","l":3},{"t":"Transcutaneous pacemaker.","l":4},{"t":"In situ pacer wires will be present in some postoperative patients.","l":4},{"t":"Search for and treat possible causes.","l":1},{"t":"Consider ECMO.","l":1}],"complications":[{"t":"Junctional or ventricular escape beats.","l":0},{"t":"Tachyarrhythmias or hypertension secondary to pharmacologic treatment of bradycardia.","l":0},{"t":"Inappropriate pacemaker firing.","l":0},{"t":"Pneumothorax from chest compression.","l":0},{"t":"Intracranial hemorrhage in premature infants:","l":0},{"t":"Secondary to boluses of epinephrine or from acute hypertension.","l":1},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Cote CJ, Lerman J, Todres ID. A practice of anesthesia for infants and children. 4th ed. Philadelphia: Saunders; 2009, p. 313-4."},{"t":"2. Davis PJ, Cladis FP, Motoyama EK. Smith’s anesthesia for infants and children. 8th ed. Philadelphia: Mosby; 2011 p. 1232-5."},{"t":"3. Donoghue A, Berg RA, Hazinski MF, et al. Cardiopulmonary resuscitation for bradycardia with poor perfusion versus pulseless cardiac arrest. Pediatrics 2009;124:1541-8."},{"t":"4. Fleming S, Thompson M, Stevens R, et al. Normal ranges of heart rate and respiratory rate in children from birth to 18 years of age: a systematic review of observational studies. Lancet 2011;377:1011-8."},{"t":"5. Jones P, Dauger S, Peters MJ. Bradycardia during critical care intubation: mechanisms, significance and atropine. Arch Dis Child 2012;97:139-44."},{"t":"6. Kleinman ME, Chameides L, Schexnayder SM, et al. Pediatric advanced life support: 2010 American Heart Association guidelines for cardiopulmonary resuscitation and emergency cardiovascular care. Circulation 2010;122: S876-908."}]}},{"id":94,"title":"Cardiac Arrest in the Pediatric Patient","ch":13,"cat":"Pediatric Events","s":{"definition":[{"t":"Cardiac arrest is the absence of effective mechanical activity of the heart.","l":0}],"etiology":[{"t":"<i>The cause of cardiac arrest in children is different than in adults in that coronary artery disease is rare. Congenital or acquired heart disease accounts for one third of all pediatric cardiac arrests.<\/i>","l":0},{"t":"Hypoxemia:","l":0},{"t":"Low FiO<sub>2<\/sub>:","l":1},{"t":"Relative (inadequate for the patient’s condition).","l":2},{"t":"Absolute:","l":2},{"t":"Problems delivering O<sub>2<\/sub> to the breathing circuit.","l":3},{"t":"Inadequate alveolar ventilation mismatch.","l":1},{"t":"Anatomic shunt.","l":1},{"t":"Excessive metabolic O<sub>2<\/sub> demand.","l":1},{"t":"Low CO.","l":1},{"t":"Circulatory shock:","l":0},{"t":"Sepsis.","l":1},{"t":"Acidosis.","l":1},{"t":"Pulmonary or venous air embolism.","l":0},{"t":"Increased vagal tone, e.g. traction on extraocular muscles.","l":0},{"t":"Toxins, e.g. LAST.","l":0},{"t":"Hypovolemia.","l":0},{"t":"Electrolyte abnormalities.","l":0},{"t":"Hypothermia.","l":0}],"typical":[{"t":"<i>Risk of cardiac arrest is inversely proportional to age and occurs more frequently in children than adults (children under 1 month of age are at greatest risk).<\/i>","l":0},{"t":"Inadequate oxygenation or ventilation:","l":0},{"t":"Oversedation.","l":1},{"t":"Inability to secure difficult airway.","l":1},{"t":"Accidental extubation.","l":1},{"t":"Infection, e.g. pneumonia or sepsis.","l":1},{"t":"Neurologic condition, e.g. seizure.","l":1},{"t":"Patients who are currently receiving mechanical ventilatory support.","l":1},{"t":"Patients who have already had a cardiac arrest or are currently receiving inotropic support.","l":1},{"t":"Arrhythmias.","l":0},{"t":"Pulmonary hypertensive crisis.","l":0},{"t":"Acute myocardial depression:","l":0},{"t":"Anesthetic agents.","l":1},{"t":"Hypoxemia.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"From cyanosis.","l":3},{"t":"“Tet” spell.","l":3},{"t":"Hypovolemia:","l":1},{"t":"Hemorrhage.","l":2},{"t":"Inadequate volume administration.","l":2},{"t":"Electrolyte abnormalities:","l":1},{"t":"Hyperkalemia.","l":2},{"t":"Hypocalcemia.","l":2},{"t":"Hypomagnesemia.","l":2},{"t":"Coronary thromboemboli or air emboli.","l":1},{"t":"Insufficient coronary perfusion.","l":1},{"t":"Unbalanced systemic versus pulmonary circulation in single-ventricle patient.","l":1},{"t":"Surgery:","l":0},{"t":"Vagal response secondary to surgical traction or pressure.","l":1},{"t":"Iatrogenic causes:","l":0},{"t":"Accidental interruption of inotropic infusions.","l":1},{"t":"R on T phenomenon with unsynchronized cardioversion.","l":1},{"t":"CVP line related dysrhythmia or tamponade.","l":1},{"t":"Other:","l":0},{"t":"Trauma:","l":1},{"t":"Nearly half of all pediatric deaths are motor vehicle related.","l":2},{"t":"Anaphylaxis.","l":1},{"t":"LAST.","l":1},{"t":"MH.","l":1},{"t":"Emergency department consults.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Aspiration of foreign body.","l":3},{"t":"Poisoning.","l":3},{"t":"Preexisting severe or systemic diseases:","l":0},{"t":"Congenital or acquired cardiac disease:","l":1},{"t":"Single ventricle physiology, especially prior to SVC anastomosis, or Glenn procedure.","l":2},{"t":"Aortic stenosis.","l":2},{"t":"Cardiomyopathies.","l":2},{"t":"Severe cyanotic lesions.","l":2},{"t":"History of life-threatening arrhythmias.","l":2},{"t":"Pulmonary hypertension.","l":1},{"t":"Multisystem organ failure.","l":1},{"t":"Metabolic disease or derangement, i.e. diabetic ketoacidosis.","l":1},{"t":"Emergency cases.","l":0},{"t":"Any case performed without a full preoperative evaluation.","l":0}],"prevention":[{"t":"<i>Discuss the risks and benefits of any planned procedure or care plan with the surgeon, medi<i>cal team, and family.<\/i><\/i>","l":0},{"t":"Ensure adequate oxygenation and ventilation.","l":0},{"t":"Perioperative care of the complex pediatric patient requires clinicians experienced in managing pediatric patients:","l":0},{"t":"Knowledge of normal age-related vital signs in pediatric patients.","l":1},{"t":"Appropriate use of monitoring.","l":1},{"t":"Early recognition of patients with impending respiratory or cardiac arrest.","l":1},{"t":"Careful use of medications, e.g. local and general anesthetics.","l":1},{"t":"Consider consulting cardiologist for pediatric patients with unrepaired or complex congenital heart disease:","l":0},{"t":"Understanding complex physiology and anatomy of congenital heart disease and surgical repair is essential to proper care:","l":1},{"t":"Single ventricle anatomy.","l":2},{"t":"e.g.:","l":3,"e":1},{"t":"Hypoplastic left heart syndrome.","l":4},{"t":"Tricuspid atresia.","l":4},{"t":"Patients after cavo pulmonary anastomoses, or Glenn or Fontan procedure.","l":2},{"t":"Pulmonary hypertension.","l":2},{"t":"Cardiomyopathies.","l":2}],"manifestations":[{"t":"Patient becomes limp and unresponsive.","l":0},{"t":"Absence of pulse oximeter waveform.","l":0},{"t":"No palpable pulse (carotid, femoral, brachial):","l":0},{"t":"NIBP unmeasurable.","l":1},{"t":"Invasive arterial pressure without pulsations.","l":1},{"t":"Absence of heart tones on auscultation.","l":0},{"t":"<b>Apnea<\/b>.","l":0},{"t":"Significant fall in ET CO<sub>2<\/sub>.","l":0},{"t":"Poor skin perfusion, <b>cyanosis<\/b>.","l":0},{"t":"Regurgitation and possible aspiration of gastric contents.","l":0},{"t":"<b>Arrhythmias<\/b> (VT, VF, asystole).","l":0},{"t":"PEA (rhythm in PEA may appear normal).","l":0},{"t":"Lack of ventricular contraction on TEE or TTE.","l":0}],"similar":[{"t":"Hypotension (see Event 96, Hypotension in the Pediatric Patient).","l":0},{"t":"Anaphylaxis (see Event 91, Anaphylaxis in the Pediatric Patient, and Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"Pulmonary or venous air embolism (see Event 21, Pulmonary Embolism, and Event 24, Venous Gas Embolism).","l":0},{"t":"Sepsis (see Event 13, The Septic Patient).","l":0},{"t":"Acute hemorrhage (see Event 1, Acute Hemorrhage, and Event 90, Acute Hemorrhage in the Pediatric Patient).","l":0},{"t":"Medication reaction (see Event 63, Drug Administration Error).","l":0},{"t":"Local anesthetic overdose (see Event 52, Local Anesthetic Systemic Toxicity).","l":0},{"t":"Total spinal (see Event 89, Total Spinal Anesthesia).","l":0},{"t":"Seizures (see Event 57, Seizures).","l":0},{"t":"Artifacts on monitoring devices:","l":0},{"t":"ECG.","l":1},{"t":"Pulse oximeter.","l":1},{"t":"BP measurement systems (NIBP or invasive).","l":1},{"t":"Pacemaker malfunction or inappropriate settings:","l":0},{"t":"Pacemaker causing electrical activity on monitor without actual CO.","l":1},{"t":"In children with shunt-dependent pulmonary blood flow (Blalock-Taussig shunt, central shunt, or aorto pulmonary window), occlusion of the shunt may result in severe decrease in measured ET CO<sub>2<\/sub>, severe hypoxemia, and cardiac arrest.","l":0}],"management":[{"t":"Treat the patient, not the monitor.","l":0},{"t":"Verify that there is no pulse or if the patient is bradycardic with signs of poor perfusion:","l":0},{"t":"Check the pulse, which can be difficult in children.","l":1},{"t":"Do NOT spend more than 10 seconds searching for a pulse:","l":1},{"t":"Umbilical or femoral arteries in the newborn.","l":2},{"t":"Brachial or femoral arteries in the infant.","l":2},{"t":"Carotid or femoral arteries in the older child:","l":2},{"t":"Surgeon may have better access to palpable pulses.","l":3},{"t":"Check pulse oximeter and ET CO<sub>2<\/sub> waveforms.","l":2},{"t":"Check NIBP and ECG monitors and leads.","l":2},{"t":"Auscultate chest for heart sounds.","l":2},{"t":"Check <b>arterial line<\/b> waveform.","l":2},{"t":"<b>Immediately<\/b> notify surgeons and other OR personnel of the cardiac arrest:","l":0},{"t":"Call for help.","l":1},{"t":"Call for hospital or OR “code”.","l":1},{"t":"Call for crash cart and defibrillator:","l":1},{"t":"Apply pediatric defibrillation pads to the chest.","l":2},{"t":"Start CPR <b>immediately<\/b> (C-A-B: compressions, airway, breathing).","l":0},{"t":"Turn off all anesthetics.","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> at high flows to flush circuit of inhaled anesthetics and verify change:","l":0},{"t":"If intubated, set ventilator to age-appropriate rate and tidal volume.","l":1},{"t":"<b>Avoid<\/b> hyperventilation.","l":1},{"t":"<b>Begin BLS/PALS:<\/b>","l":0},{"t":"Assign someone to start chest compressions:","l":1},{"t":"Compressions should be at least 100 per minute and depth should be one third to one half the anterior-posterior diameter of the chest; release completely to allow chest to fully recoil:","l":2},{"t":"<b>Neonate or Infant:<\/b> two thumbs encircling hands technique (place thumbs together over lower sternum and forcefully squeeze the thorax).","l":3},{"t":"<b>Child:<\/b> compress the lower half of sternum with heel of one or two hands, avoiding compression on ribs or xiphoid process.","l":3},{"t":"Two or more compressors are optimal for the older child or for adult CPR.","l":2},{"t":"Minimize interruptions in compressions and keep interruptions brief (less than 10 seconds).","l":2},{"t":"Monitor for fatigue of the person performing chest compressions (rotate every 2 minutes).","l":2},{"t":"Adequate compressions should generate an ET CO<sub>2<\/sub> of at least 10 to 15 mm Hg.","l":2},{"t":"You MUST improve CPR quality if ET CO<sub>2<\/sub> is less than 10 mm Hg.","l":2},{"t":"<b>Airway:<\/b>","l":1},{"t":"Mask ventilate with <b>100%<\/b> O<sub>2<\/sub> at high flow.","l":2},{"t":"Intubation <b>should not<\/b> delay defibrillation in children with VF or pulseless VT.","l":2},{"t":"Secure airway with an ETT <b>as soon as possible<\/b>.","l":2},{"t":"Consider an SGA if unable to intubate.","l":2},{"t":"<b>Breathing:<\/b>","l":1},{"t":"<b>Neonate:<\/b> There should be a 3:1 ratio of compressions to ventilations, with 90 compressions and 30 breaths to achieve approximately 120 events per minute:","l":2},{"t":"3:1 compression-to-ventilation ratio should be used for neonatal resuscitation where compromise of ventilation is nearly always the primary cause of arrest.","l":3},{"t":"Consider using higher compression:ventilation ratios (e.g. 15:2) if the arrest is believed to be of cardiac origin.","l":2},{"t":"<b>Infant and child:<\/b> If the infant or child is not intubated and there is one rescuer, compression-to-ventilation ratio is 30:2, and for two rescuers the compression-to-ventilation ratio is 15:2.","l":2},{"t":"Once the infant or child is intubated, ventilate 8 to 10 times per minute without interrupting chest compressions.","l":2},{"t":"After advanced airway is established, mechanically ventilate to free up hands and resources.","l":1},{"t":"<b>Avoid<\/b> hyperventilation.","l":1},{"t":"Employ cognitive aids (neonatal resuscitation and PALS algorithms) to help determine diagnosis and treatment.","l":0},{"t":"Assign tasks to skilled responders, BUT make sure that C-A-B continues:","l":0},{"t":"Ensure adequate IV access:","l":1},{"t":"Ensure patency of the IV.","l":2},{"t":"Consider placement of an IO line early.","l":2},{"t":"Consider central venous line or a venous cut-down if having difficulty with peripheral access.","l":2},{"t":"Consider placing an <b>arterial line<\/b> for monitoring and ABGs.","l":1},{"t":"Diagnose and Treat Arrythmias:","l":0},{"t":"Determine whether patient is in a shockable (VT or VF) or nonshockable rhythm (PEA or asystole):","l":1},{"t":"Analyze rhythm during very short breaks in CPR:","l":2},{"t":"CPR artifact can appear as a shockable rhythm.","l":3},{"t":"<b>VT/VF (shockable pathway):<\/b>","l":1},{"t":"<b>Continue high-quality CPR<\/b> between defibrillations.","l":2},{"t":"Administer 1 shock at <b>2 J/kg<\/b>.","l":2},{"t":"Resume five cycles of CPR (about 2 minutes) and quickly recheck rhythm.","l":2},{"t":"If a shockable rhythm persists, give a second shock at <b>4 J/kg<\/b>.","l":2},{"t":"Administer <b>epinephrine<\/b> IV or IO, <b>10 μg/kg<\/b> and <b>immediately<\/b> resume five cycles of CPR.","l":2},{"t":"Repeat <b>epinephrine<\/b> dose every 3 to 5 minutes:","l":2},{"t":"Consider endotracheal administration of <b>epinephrine<\/b> if IV or IO access is not available:","l":3},{"t":"Endotracheal <b>epinephrine<\/b> dose: <b>100 μg/kg<\/b>:","l":4},{"t":"The total volume of drug and flush should not exceed <b>5 mL<\/b> in infants.","l":5},{"t":"DEFIBRILLATE EVERY 2 MINUTES (<b>4 J/kg<\/b>) IF A SHOCKABLE RHYTHM PERSISTS.","l":2},{"t":"Consider <b>amiodarone<\/b> IV or IO, <b>5 mg/kg<\/b>, or <b>lidocaine<\/b> IV or IO, <b>1 mg/kg<\/b>.","l":2},{"t":"<b>Torsades de pointes:<\/b>","l":1},{"t":"Therapy as mentioned previously for VT/VF.","l":2},{"t":"Administer MgSO<sub>4<\/sub> IV or IO, <b>25 to 50 mg/kg<\/b>.","l":2},{"t":"Search for treatable cause of VT/VF:","l":1},{"t":"Hyperkalemia (see Event 40, Hyperkalemia):","l":2},{"t":"Stop fluids containing K+ (LR and PRBCs).","l":3},{"t":"Administer CaCl<sub>2<\/sub> <b>10%<\/b> IV, <b>10 mg/kg<\/b>.","l":3},{"t":"Administer <b>dextrose 50%<\/b> IV, 0.25 to 1 g/kg, and regular <b>insulin<\/b> IV, <b>0.1 U/kg<\/b>.","l":3},{"t":"NaHCO<sub>3<\/sub> IV, <b>1 to 2 mEq/kg<\/b>.","l":3},{"t":"If patient is successfully resuscitated from a hyperkalemic arrest, consider <b>furosemide<\/b> or dialysis.","l":3},{"t":"Local anesthetic toxicity (see Event 52, Local Anesthetic Systemic Toxicity):","l":2},{"t":"Administer <b>20% lipid emulsion<\/b> (Intralipid), IV bolus <b>1.5 mL/kg<\/b> over 1 minute and start infusion at 0.25 mL/kg/min.","l":3},{"t":"Repeat Intralipid boluses every 2 to 5 minutes until circulation is restored.","l":3},{"t":"Maximum total Intralipid dose is <b>10 mL/kg<\/b> over first 30 minutes.","l":3},{"t":"IF SHOCKABLE RHYTHM CHANGES TO A NONSHOCKABLE RHYTHM— SWITCH TO PEA/ASYSTOLE PATHWAY","l":0,"h":1},{"t":"<b>PEA/Asystole (nonshockable pathway):<\/b>","l":1},{"t":"<b>Continue high-quality CPR.<\/b>","l":2},{"t":"Administer <b>epinephrine<\/b> IV or IO, <b>10 μg/kg<\/b> q3-5m.","l":2},{"t":"Search for treatable causes of PEA/asystole:","l":1},{"t":"<b>Hypovolemia<\/b> (see Event 90, Acute Hemorrhage in the Pediatric Patient, and Event 96, Hypotension in the Pediatric Patient):","l":2},{"t":"Administer fluid bolus, rule out occult bleeding, administer blood for massive hemorrhage or severe anemia.","l":3},{"t":"Rule out inadequate preload from compression of the great vessels:","l":3},{"t":"Surgical retraction or pneumoperitoneum.","l":4},{"t":"Consider using TEE or TTE for diagnosis and response to therapy.","l":3},{"t":"<b>Hypoxemia<\/b> (see Event 10, Hypoxemia):","l":2},{"t":"Ventilate and oxygenate with <b>100%<\/b> O<sub>2<\/sub>.","l":3},{"t":"Auscultate breath sounds.","l":3},{"t":"Suction ETT.","l":3},{"t":"Reconfirm presence of ET CO<sub>2<\/sub>.","l":3},{"t":"<b>Tension pneumothorax<\/b> (see Event 35, Pneumothorax):","l":2},{"t":"Auscultate for unilateral breath sounds.","l":3},{"t":"Look for distended neck veins or deviated trachea:","l":3},{"t":"Perform emergent needle decompression at second intercostal space at the midclavicular line:","l":4},{"t":"Patient will require pleural drainage after needle decompression.","l":5},{"t":"<b>Toxins (including infusions):<\/b>","l":2},{"t":"Confirm that IV and volatile anesthetics are off:","l":3},{"t":"Check all infusions and confirm they are correct.","l":4},{"t":"Discontinue if they are not indicated.","l":4},{"t":"If a large dose of local anesthetic has been administered, treat as local anesthetic toxicity (see Event 52, Local Anesthetic Systemic Toxicity).","l":3},{"t":"Send toxicology screen.","l":3},{"t":"<b>Cardiac tamponade:<\/b>","l":2},{"t":"Use TEE or TTE to rule out pericardial effusion:","l":3},{"t":"If present, perform emergent pericardiocentesis.","l":4},{"t":"Electrolyte and acid/base abnormalities:","l":2},{"t":"Send stat labs (<b>ABG<\/b> and metabolic panel):","l":3},{"t":"Evaluate for acidosis, hyperkalemia, hypokalemia, hypoglycemia, hypocalcemia.","l":4},{"t":"Treat hyperkalemia as previously stated.","l":4},{"t":"<b>VGE<\/b> (see Event 24, Venous Gas Embolism):","l":2},{"t":"Acute hypotension with drop in ET CO<sub>2<\/sub>.","l":3},{"t":"Flood surgical field with saline.","l":3},{"t":"Aspirate <b>CVP<\/b> catheter if present.","l":3},{"t":"<b>PE<\/b> (see Event 21, Pulmonary Embolism).","l":2},{"t":"<b>Pulmonary hypertension:<\/b>","l":2},{"t":"Use TTE or TEE to assess RV function.","l":3},{"t":"<b>Hyperthermia:<\/b>","l":2},{"t":"Rule out MH (see Event 45, Malignant Hyperthermia).","l":3},{"t":"<b>Hypothermia<\/b> (see Event 44, Hypothermia).","l":2},{"t":"Continually reassess patient without interrupting chest compressions:","l":0},{"t":"Look for return of spontaneous circulation:","l":1},{"t":"ECG for return of electrical activity.","l":2},{"t":"Correlate with return of palpable pulse or BP.","l":2},{"t":"Pulse oximetry.","l":2},{"t":"Consider post-resuscitation hypothermia for brain protection.","l":0},{"t":"Echocardiography may be employed to assess heart function and rule out correctable pathology.","l":0},{"t":"Other therapeutic options:","l":0},{"t":"Open chest cardiac massage.","l":1},{"t":"Open chest defibrillation.","l":1},{"t":"Automated external defibrillation.","l":1},{"t":"Pacing:","l":1},{"t":"Transcutaneous pacing.","l":2},{"t":"Transvenous pacing.","l":2},{"t":"Epicardial pacing.","l":2},{"t":"Consider extracorporeal cardiopulmonary resuscitation (ECPR)/ECMO if available:","l":0},{"t":"Call ECMO code or obtain ECMO/ECPR consult from ICU.","l":1},{"t":"Determine whether cause may be reversible or heart may be transplantable.","l":1},{"t":"This is only successful if rapid deployment ECMO/ECPR protocols are already established in your institution.","l":1}],"complications":[{"t":"Rib fracture and pneumothorax from chest compression.","l":0},{"t":"Skin burns from defibrillation.","l":0},{"t":"Hypotension or hypertension from treatment of the arrest.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Cote CJ, Lerman J, Todres ID. A practice of anesthesia for infants and children. 4th ed. Philadelphia: Saunders; 2009, p. 313-4."},{"t":"2. Davis PJ, Cladis FP, Motoyama EK. Smith’s anesthesia for infants and children. 8th ed. Philadelphia: Mosby; 2011, p. 1232-5."},{"t":"3. Fuhrman BP, Zimmerman JJ, Carcillo JA, et al. Pediatric critical care. 4th ed. Philadelphia: Saunders; 2011, p. 338–63."},{"t":"4. Kleinman ME, Chameides L, Schexnayder SM, et al. Pediatric advanced life support: 2010 American Heart Association guidelines for cardiopulmonary resuscitation and emergency cardiovascular care. Circulation 2010;122:S876-908."},{"t":"5. Morray JP. Cardiac arrest in anesthetized children: recent advances and challenges for the future. Pediatr Anesth 2011;21:722-9."},{"t":"6. Nadkarni VM, Larkin GL, Peberdy MA, et al. First documented rhythm and clinical outcome from in-hospital cardiac arrest among children and adults. JAMA 2006;295:50-7."}]}},{"id":95,"title":"Difficult Airway Management in the Pediatric Patient","ch":13,"cat":"Pediatric Events","s":{"definition":[{"t":"Difficult airway management in the pediatric patient includes difficult mask ventilation, difficult placement of an SGA or difficult tracheal intubation.","l":0}],"etiology":[{"t":"Patient factors (specific to pediatrics):","l":0},{"t":"Increased O<sub>2<\/sub> consumption leading to rapid desaturation.","l":1},{"t":"Decreased functional residual capacity.","l":1},{"t":"History of respiratory problems.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Snoring.","l":3},{"t":"Recurrent croup.","l":3},{"t":"Sleep apnea.","l":3},{"t":"Possible anatomical causes of a difficult airway (specific to pediatrics):","l":0},{"t":"Tongues are large relative to the oropharyngeal cavity.","l":1},{"t":"Tonsillar hypertrophy.","l":1},{"t":"Subglottic stenosis.","l":1},{"t":"Infection, e.g. retropharyngeal abscess.","l":1},{"t":"Foreign body aspiration.","l":1},{"t":"Trauma.","l":1},{"t":"Craniofacial abnormalities.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Pierre-Robin syndrome.","l":3},{"t":"Treacher-Collins syndrome.","l":3},{"t":"Physician factors:","l":0},{"t":"Inexperience with airway management in the pediatric patient.","l":1},{"t":"Failure to respond effectively to a rapidly deteriorating situation.","l":1},{"t":"Equipment factors:","l":0},{"t":"Inexperience with equipment.","l":1},{"t":"Inadequate backup or alternative airway adjuncts or intubating devices.","l":1}],"typical":[{"t":"<i>Difficulty with intubation is thought to occur less frequently in children compared with adults and to be inversely dependent on age (incidence of 0.57% in newborns and toddlers, 0.12% in preschoolers, and 0.05% in school-age children<\/i>).","l":0},{"t":"Variations of normal anatomy not associated with a congenital syndrome:","l":0},{"t":"Limited mouth opening restricting visualization and/or insertion of laryngoscope.","l":1},{"t":"Larynx may be more anterior or superior, limiting visualization on direct laryngoscopy.","l":1},{"t":"Small larynx or trachea may not permit passage of an ETT.","l":1},{"t":"Extreme prematurity or small for gestational age.","l":0},{"t":"Obesity.","l":0},{"t":"Tonsillar or adenoid hypertrophy.","l":0},{"t":"Congenital malformations or conditions:","l":0},{"t":"Craniofacial syndromes.","l":1},{"t":"Musculoskeletal syndromes.","l":1},{"t":"Mucopolysaccharidosis.","l":1},{"t":"Acquired conditions:","l":0},{"t":"Trauma to face, head, or neck.","l":1},{"t":"Burns (especially inhalational injuries).","l":1},{"t":"Presence of a foreign body.","l":1},{"t":"Infections.","l":1},{"t":"Tumors.","l":1},{"t":"Following radiation therapy to head/neck.","l":1},{"t":"History of tracheostomy or tracheal reconstruction.","l":1},{"t":"Anaphylaxis.","l":1},{"t":"Fluid overload.","l":1},{"t":"Barotrauma.","l":1},{"t":"SVC syndrome.","l":1},{"t":"MMR.","l":0},{"t":"Postoperative conditions:","l":0},{"t":"Prone or Trendelenburg positioning leading to airway edema.","l":1},{"t":"Head/neck surgery.","l":1},{"t":"Massive fluid shifts and third spacing.","l":1}],"prevention":[{"t":"Careful assessment of airway anatomy, which may be difficult in young and uncooperative children:","l":0},{"t":"Use the classification schemes of Mallampati or Samsoon and Young for older children and teenagers, but they may not be reliable in younger children.","l":1},{"t":"Prepare a wide range of age-appropriate sizes of airway equipment.","l":0},{"t":"Preoxygenate all patients prior to intubation.","l":0},{"t":"If there is any concern that mask ventilation or insertion of an SGA may be difficult (e.g. obstruction in lower airway or restricted mouth opening), then proceed with caution:","l":0},{"t":"Contingency plans should include fiberoptic intubation, surgical airway, CPB or ECMO standby.","l":1},{"t":"Limit the number of attempts at direct laryngoscopy.","l":0},{"t":"Have the most experienced clinician intubate.","l":0},{"t":"<b>Avoid<\/b> causing airway trauma, which may result in edema and/or bleeding:","l":0},{"t":"Narrowing of the airway in smaller patients may result in hypoventilation.","l":1},{"t":"Create a difficult airway cart with necessary supplies and equipment.","l":0},{"t":"Drill and practice management of difficult airway/failed intubation (using simulation if available).","l":0}],"manifestations":[{"t":"Expected or known difficult pediatric airway or tracheal intubation:","l":0},{"t":"Previous history of:","l":1},{"t":"Difficult airway.","l":2},{"t":"Tracheal intubation.","l":2},{"t":"An airway examination reveals a Samsoon and Young’s class III or IV airway.","l":1},{"t":"Presence of anatomic features that make the patient difficult to intubate.","l":1},{"t":"Congenital syndromes associated with difficult intubation.","l":1},{"t":"Unexpected difficult pediatric airway or tracheal intubation:","l":0},{"t":"Failure to intubate the trachea by an experienced anesthesia professional:","l":1},{"t":"Difficult insertion of laryngoscope:","l":2},{"t":"Small or restricted mouth opening.","l":3},{"t":"MMR after succinylcholine administration.","l":3},{"t":"Difficult visualization of vocal cords.","l":2},{"t":"Difficult passage of ETT through vocal cords.","l":2},{"t":"Inability to mask ventilate after induction of anesthesia.","l":0},{"t":"Inability to place, and ventilate through, a SGA.","l":0},{"t":"Multiple failed attempts to intubate the trachea.","l":0}],"similar":[{"t":"Anesthesia workstation malfunction, e.g. bag/ventilator switch malposition.","l":0},{"t":"Normal airway but unsuccessful intubation due to inexperience of the intubator.","l":0},{"t":"Functional airway obstruction:","l":0},{"t":"Laryngospasm (see Event 97, Laryngospasm).","l":1},{"t":"Laryngomalacia.","l":1},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":1},{"t":"Chest wall rigidity.","l":1},{"t":"Gastric distention with air.","l":1},{"t":"Aspiration of gastric contents (see Event 28, Aspiration of Gastric Contents).","l":1},{"t":"Endobronchial intubation (see Event 30, Endobronchial Intubation).","l":1}],"management":[{"t":"<i>Special considerations for pediatric patients:<\/i>","l":0},{"t":"Less time to secure the airway compared to adults:","l":1},{"t":"O<sub>2<\/sub> consumption in children is significantly higher:","l":2},{"t":"Faster onset of hypoxemia during periods of hypoventilation or apnea (especially for younger and/or sicker children).","l":3},{"t":"IV access may be difficult or impossible:","l":1},{"t":"For expected or known difficult airway, consider placing IV prior to induction.","l":2},{"t":"Have experienced help available at induction to place IV.","l":2},{"t":"Consider IO access or <b>CVP<\/b> line placement.","l":2},{"t":"Options for airway management:","l":1},{"t":"Awake oral or nasal intubation is the safest option in neonates:","l":2},{"t":"Most children will not be able to cooperate with awake intubation.","l":3},{"t":"Some level of anesthesia (from sedation to general anesthesia) will be required.","l":3},{"t":"Emergent surgical airway (cricothyrotomy, tracheostomy) or transtracheal jet ventilation are not recommended in smaller children (e.g. &lt;5 years old) because of difficult anatomy, the time needed to establish a surgical airway, the low success rate, and the high complication rate.","l":2},{"t":"For the child with an expected or known difficult airway:","l":0},{"t":"<i>Consider transfer of care to a tertiary pediatric hospital with subspecialists (pediatric anesthesiologists and pediatric ENT surgeons) experienced in the management of chil<i>dren with difficult airways and the capability for pediatric ECMO. <b>Do not<\/b> proceed with anesthesia unless fully prepared for management of potential loss of airway.<\/i><\/i>","l":1},{"t":"Preoperative or preinduction assessment:","l":0},{"t":"Carefully assess airway anatomy:","l":1},{"t":"Mouth opening.","l":2},{"t":"Size of tongue in relation to oropharynx.","l":2},{"t":"Neck range of motion (extension and flexion).","l":2},{"t":"Size and shape of mandible.","l":2},{"t":"Thyromental distance.","l":2},{"t":"Special attention to dysmorphic or asymmetric facial features.","l":2},{"t":"Physical examination:","l":1},{"t":"Paradoxical chest movement with respirations.","l":2},{"t":"Stridor.","l":2},{"t":"Wheezing.","l":2},{"t":"Cyanosis.","l":2},{"t":"Obtain history from parents, focusing on airway symptoms:","l":1},{"t":"Snoring.","l":2},{"t":"Obstructed breathing patterns.","l":2},{"t":"Cyanosis with feeding or when asleep.","l":2},{"t":"Problems with airway management in the past.","l":2},{"t":"Review old anesthetic records for history of prior airway management.","l":1},{"t":"Assess baseline cardiopulmonary status.","l":1},{"t":"Preoperative or preinduction preparation:","l":0},{"t":"Err on the side of caution.","l":1},{"t":"Devise primary and contingency plans.","l":1},{"t":"Discuss plans with team.","l":1},{"t":"Have experienced help present.","l":1},{"t":"Consider alternatives to general endotracheal anesthesia, but recognize that emergency airway management will be difficult if a major complication occurs.","l":1},{"t":"Obtain difficult airway cart if available.","l":1},{"t":"Prepare all equipment, drugs, and resources:","l":1},{"t":"Multiple laryngoscope blades.","l":2},{"t":"Multiple ETT sizes:","l":2},{"t":"Consider using a cuffed ETT (vs. uncuffed ETT), which will <b>avoid<\/b> having a large leak.","l":3},{"t":"Appropriately sized SGAs.","l":2},{"t":"Appropriately sized video laryngoscope.","l":2},{"t":"Appropriately sized fiberoptic bronchoscope.","l":2},{"t":"Emergency drugs.","l":2},{"t":"Cricothyrotomy kit (only for older children).","l":2},{"t":"Have experienced surgeon present for rigid bronchoscopy or emergent surgical airway.","l":2},{"t":"Consider CPB or ECMO standby:","l":1},{"t":"Set up PRIOR to induction because this requires considerable time and resources.","l":2},{"t":"<b>Induction:<\/b>","l":0},{"t":"Preoxygenation.","l":1},{"t":"Ensure adequate oxygenation throughout induction:","l":1},{"t":"Increased FiO<sub>2<\/sub> may be <b>contraindicated<\/b> in children with unrepaired cyanotic heart disease.","l":2},{"t":"Maintain spontaneous ventilation if possible.","l":1},{"t":"For the child with an unexpected difficult airway:","l":0},{"t":"Call for help stat if not already present (e.g. anesthesia professional, anesthesia tech):","l":1},{"t":"Call for difficult airway cart.","l":2},{"t":"Once help arrives, have them set up airway equipment and ensure IV/IO access, or consider having them take over airway management if they are more experienced.","l":2},{"t":"Assess adequacy of oxygenation and ventilation:","l":1},{"t":"Place an oral or nasopharyngeal airway.","l":2},{"t":"Consider two-person bag valve mask.","l":2},{"t":"If mask ventilation is possible, determine whether to place an SGA or to intubate the trachea:","l":1},{"t":"Placement of an SGA:","l":2},{"t":"Use age- and size-appropriate SGA as the primary airway device or as a conduit for endotracheal intubation.","l":3},{"t":"Consider allowing spontaneous ventilation to occur if possible, and awaken the patient; convert to an awake intubation.","l":3},{"t":"Intubation of the trachea:","l":2},{"t":"Optimize patient position for intubation.","l":3},{"t":"Limit intubation attempts by inexperienced anesthesia professionals:","l":3},{"t":"Most experienced person should perform subsequent laryngoscopies.","l":4},{"t":"Consider intubation with video-assisted laryngoscope.","l":3},{"t":"Use a stylet or bougie.","l":3},{"t":"Use smaller ETT if difficulty in passing ETT through cords.","l":3},{"t":"If mask ventilation or intubation is impossible:","l":1},{"t":"Attempt to place an SGA:","l":2},{"t":"If successful, consider whether to wake the patient, to continue the case with the SGA or to attempt to intubate the trachea through the device.","l":3},{"t":"If SGA is unsuccessful, consider moving early to emergency cricothyrotomy, trache<b>ostomy, or emergency CPB or ECMO:<\/b>","l":1},{"t":"These options take time and resources and should be set up in advance if they are to be effective.","l":2},{"t":"<b>General Considerations:<\/b>","l":0},{"t":"Adult techniques and equipment can generally be used for children &gt;40 kg or &gt;10 to 12 years of age.","l":1},{"t":"Many different techniques to secure a difficult pediatric airway have been reported but are not applicable for all ages or situations.","l":1},{"t":"Clinicians should use techniques with which they have experience and expertise.","l":1}],"complications":[{"t":"Airway trauma.","l":0},{"t":"Airway edema from multiple laryngoscopies.","l":0},{"t":"Endobronchial intubation.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Hypercarbia.","l":0},{"t":"Regurgitation or aspiration of gastric contents.","l":0},{"t":"Dental trauma.","l":0},{"t":"Hyperextension or damage to cervical spine.","l":0},{"t":"Complications of surgical airway or tracheostomy.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Updated report by the American Society of Anesthesiologists Task Force on Management of the Difficult Airway. Practice guidelines for management of the difficult airway. Anesthesiology 2013;118:251-70."},{"t":"2. Cote CJ, Lerman J, Todres ID. The pediatric airway in a practice of anesthesia for infants and children. 4th ed. Philadelphia: Saunders; 2009."},{"t":"3. Engelhard T, Weiss M. A child with a difficult airway: what do I do next? Curr Opin Anesthesiol 2012;25:326-32."},{"t":"4. Gregory GA, Riazi J. Classification and assessment of the difficult pediatric airway. Anesthesiol Clin North America 1998;16:729-41."},{"t":"5. Heinrich S, Birkholz T, Ihmsen H, et al. Incidence and predictors of difficult laryngoscopy in 11219 pediatric anesthesia procedures. Pediatr Anesth 2012;22:729-36."},{"t":"6. Holzman RS. Airway management. In: Davis PJ, Cladis FP, Motoyama EK, editors. Smith’s anesthesia for infants and children. 8th ed. Philadelpha: Mosby; 2011."},{"t":"7. Weiss M, Engelhardt T. Proposal for the management of the unexpected &amp; difficult pediatric airway. Paediatr Anaesth 2010;20:454-64."}]}},{"id":96,"title":"Hypotension in the Pediatric Patient","ch":13,"cat":"Pediatric Events","s":{"definition":[{"t":"Hypotension in the pediatric patient is a systolic BP less than the 5th percentile of the normal range for age.","l":0},{"t":"&lt;60 mm Hg in term neonates (0 to 28 days).","l":1},{"t":"&lt;70 mm Hg in infants (1 to 12 months).","l":1},{"t":"&lt;70 mm Hg + (2 × age in years) in children 1 to 10 years old.","l":1},{"t":"&lt;90 mm Hg in children more than 10 years old.","l":1}],"etiology":[{"t":"Decreased preload:","l":0},{"t":"Hypovolemia.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Hemorrhage.","l":3},{"t":"Including occult blood loss.","l":3},{"t":"Vasodilation.","l":1},{"t":"Impaired venous return.","l":1},{"t":"Elevated intrathoracic pressure, e.g. pneumothorax.","l":1},{"t":"Cardiac tamponade.","l":1},{"t":"PE.","l":1},{"t":"Decreased contractility:","l":0},{"t":"Negative inotropic drugs, e.g. anesthetic agents.","l":1},{"t":"Arrhythmias.","l":1},{"t":"Congenital cardiac lesions.","l":1},{"t":"Cardiomyopathy.","l":1},{"t":"Hypoxemia.","l":1},{"t":"Heart failure.","l":1},{"t":"Abrupt increase in afterload.","l":1},{"t":"Decreased SVR:","l":0},{"t":"Drug-induced vasodilation.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Anesthetics.","l":3},{"t":"ACEI.","l":3},{"t":"Shock.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Sepsis.","l":3},{"t":"Anaphylaxis.","l":3},{"t":"Endocrine abnormalities.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Hypoglycemia.","l":3},{"t":"Addisonian crisis.","l":3},{"t":"Hypothyroidism.","l":3},{"t":"Arrythmias:","l":0},{"t":"Tachycardia or irregular rhythm (loss of ventricular filling).","l":1},{"t":"Bradycardia.","l":1}],"typical":[{"t":"After anesthetic induction and before surgical incision:","l":0},{"t":"More common after IV induction or combined IV/inhalation induction and in adolescents.","l":1},{"t":"Hypovolemia:","l":0},{"t":"Inadequate replacement of fluids and blood loss from ongoing losses during the surgical procedure.","l":1},{"t":"Surgery with major fluid shifts or occult blood loss.","l":1},{"t":"Preexisting hypovolemia.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Trauma.","l":3},{"t":"Burns.","l":3},{"t":"Vomiting.","l":3},{"t":"Preexisting hypotension.","l":0},{"t":"Neuraxial anesthesia.","l":0},{"t":"Children with high body mass index, especially in positions other than supine.","l":0},{"t":"Congenital heart disease.","l":0},{"t":"Prolonged NPO status.","l":0},{"t":"Peritoneal insufflation.","l":0},{"t":"During arrhythmias.","l":0}],"prevention":[{"t":"<i>Hypotension is a <\/i><b><i>late <\/i><\/b><i>sign of cardiovascular compromise in the pediatric patient, and the symptoms may be masked by anesthesia. Up to <b>35%<\/b> of blood volume may be lost before hypotension becomes manifest.<\/i>","l":0},{"t":"Carefully assess cardiovascular status preoperatively, checking for:","l":0},{"t":"Patient history and fluid status.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Vomiting.","l":3},{"t":"Diarrhea.","l":3},{"t":"Capillary refill.","l":1},{"t":"Peripheral pulses and increased HR.","l":1},{"t":"Urine output.","l":1},{"t":"Skin turgor and mottling.","l":1},{"t":"Central filling pressures when available.","l":1},{"t":"<b>Avoid<\/b> excessive NPO times.","l":0},{"t":"Ensure adequate intravascular volume and correct electrolyte abnormalities before induction of anesthesia.","l":0},{"t":"Obtain preoperative ECG and/or TEE/TTE in patients with structural cardiac lesions and arrhythmias.","l":0},{"t":"Optimize preoperative medical status of patients with congenital heart disease.","l":0},{"t":"<b>Avoid<\/b> high doses of anesthetic agents.","l":0},{"t":"Administer drugs by slow IV infusion if hypotension is a known side effect, e.g. vancomycin.","l":0},{"t":"Use appropriate doses of local anesthetic when performing regional anesthesia techniques.","l":0},{"t":"Monitor surgical activities and track blood loss carefully.","l":0}],"manifestations":[{"t":"Systolic BP less than the 5th percentile of the normal range for age:","l":0},{"t":"NIBP cuff with low value or continuously cycling.","l":1},{"t":"Dampened or low arterial line waveform.","l":1},{"t":"<b>Tachycardia<\/b>.","l":0},{"t":"Decreased or absent pulse oximetry value.","l":0},{"t":"Decreased ET CO<sub>2<\/sub>.","l":0},{"t":"Delayed capillary refill.","l":0},{"t":"Weakened or absent peripheral pulses.","l":0},{"t":"Decreased urine output.","l":0},{"t":"Decreased skin turgor and temperature.","l":0},{"t":"Skin mottling.","l":0},{"t":"Altered level of consciousness.","l":0},{"t":"<b>Arrhythmias<\/b>, including compensatory sinus <b>tachycardia<\/b>.","l":0}],"similar":[{"t":"Artifact:","l":0},{"t":"Motion artifact (surgeon leaning on cuff).","l":1},{"t":"Incorrect size of BP cuff.","l":1},{"t":"Faulty or improperly positioned transducer.","l":1},{"t":"Vasospasm of artery with indwelling catheter.","l":0},{"t":"BP measurement in extremity with decreased perfusion, e.g. coarctation of aorta.","l":0}],"management":[{"t":"<i>Rule out rapidly lethal, often missed, causes of severe hypotension: hemorrhage, anesthetic overdose, pneumothorax, anaphylaxis, congenital heart disease, and surgical causes.<\/i>","l":0,"n":1},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Check the O<sub>2<\/sub> saturation.","l":1},{"t":"Auscultate breath sounds (see Event 35, Pneumothorax, Event 91, Anaphylaxis in the Pediatric Patient, and Event 29, Bronchospasm).","l":1},{"t":"Check airway pressure (see Event 7, High Peak Inspiratory Pressure).","l":1},{"t":"Increase the FiO<sub>2<\/sub> if O<sub>2<\/sub> saturation is low or if hypotension is severe.","l":1},{"t":"Verify the patient is hypotensive:","l":0},{"t":"Repeat NIBP measurement once:","l":1},{"t":"Appropriate BP cuff size is two-thirds of the length of the upper arm.","l":2},{"t":"Flush <b>arterial line<\/b> if present.","l":1},{"t":"Palpate peripheral pulse (brachial artery) and check capnograph.","l":1},{"t":"If no pulse, start CPR (see Event 94, Cardiac Arrest in the Pediatric Patient):","l":1},{"t":"Call for help and get crash cart/defibrillator.","l":2},{"t":"If pulse is strong and other vital signs stable, consider artifact or transient:","l":1},{"t":"Repeat NIBP measurement, ensuring nobody is leaning on cuff.","l":2},{"t":"Measure at a different site, e.g. leg.","l":2},{"t":"Measure BP manually.","l":2},{"t":"Re-zero the <b>arterial line<\/b> transducer.","l":2},{"t":"Check that the transducer is at the desired level.","l":2},{"t":"Ensure that the transducer is connected to the appropriate monitoring cable of the physiologic monitor.","l":2},{"t":"Check the <b>arterial line<\/b> for any open or loose stopcocks or connections.","l":2},{"t":"Discontinue anesthetic and vasodilating drugs.","l":0},{"t":"Inform team and ask surgeon to visually inspect field, sponges, and suction canister.","l":0},{"t":"Call for help if additional vascular access and immediate volume resuscitation is needed.","l":0},{"t":"Ask the surgeon to pause the operation to assist in diagnosis and allow time to treat hypotension:","l":0},{"t":"Check for retractors causing venous compression.","l":1},{"t":"Check for ongoing or occult blood loss.","l":1},{"t":"Discuss the need for additional expert surgical help or whether the surgical procedure should be terminated.","l":1},{"t":"Identify cause of hypotension and treat:","l":0},{"t":"Decreased preload:","l":1},{"t":"Expand circulating volume by administration of IV fluid boluses (<b>20 mL/kg<\/b> IV LR or NS).","l":2},{"t":"Consider <b>colloid<\/b>/blood administration.","l":2},{"t":"Place patient in Trendelenburg position.","l":2},{"t":"Place another <b>large-bore<\/b> IV if continued volume replacement is anticipated:","l":2},{"t":"Consider placement of IO line if peripheral access is difficult or not possible.","l":3},{"t":"Decreased contractility:","l":1},{"t":"Consider inotropic infusions.","l":2},{"t":"e.g.:","l":3,"e":1},{"t":"Dopamine.","l":4},{"t":"<b>Epinephrine<\/b>.","l":4},{"t":"Review ECG for arrhythmia or ischemia.","l":2},{"t":"Consider TEE/TTE to evaluate myocardial function.","l":2},{"t":"Decreased afterload:","l":1},{"t":"Start vasopressor therapy (<b>phenylephrine<\/b>, <b>norepinephrine<\/b>).","l":2},{"t":"If anaphylaxis is suspected, administer <b>epinephrine<\/b> and IV fluids (see Event 91, Anaphylaxis in the Pediatric Patient).","l":2},{"t":"Consider administration of corticosteroid (<b>hydrocortisone<\/b> IV) to treat Addisonian crisis (see Event 38, Addisonian Crisis).","l":2},{"t":"Consider placement of an <b>arterial line<\/b> and urinary catheter if not present.","l":0},{"t":"Check <b>ABG<\/b> and labs including CBC, electrolytes, Ca<sup>2+<\/sup>, lactate, and type and crossmatch (see Event 13, The Septic Patient, and Event 46, Metabolic Acidosis).","l":0},{"t":"Consider use of <b>CVP<\/b> monitoring.","l":0}],"complications":[{"t":"CHF or pulmonary edema from excessive fluid administration.","l":0},{"t":"Hypertension from treatment of artifact or transient.","l":0},{"t":"Cerebral ischemia.","l":0},{"t":"Acute renal failure.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Kleinman M, Chameides L, Schexnayder S, et al. Pediatric advanced life support. 2010 guidelines for cardiopulmonary resuscitation and emergency cardiovascular care. Circulation 2010;122:S876-908."},{"t":"2. Nafiu OO, Kheterpal S, Morris M, et al. Incidence and risk factors for preincision hypotension in a noncardiac pediatric surgical population. Paediatr Anaesth 2009;19:232-9."},{"t":"3. Nafiu OO, Voepel-Lewis T, Morris M, et al. How do pediatric anesthesiologists define intraoperative hypotension? Paediatr Anaesth 2009;19:1048-53."},{"t":"4. Nafiu OO, Maclean S, Blum J, et al. High BMI in children as a risk factor for intraoperative hypotension. Eur J Anaesthesiol 2010;27:1065-8."}]}},{"id":97,"title":"Laryngospasm","ch":13,"cat":"Pediatric Events","s":{"definition":[{"t":"Laryngospasm is occlusion of the glottis and laryngeal inlet by action of the laryngeal muscles.","l":0}],"etiology":[{"t":"Laryngospasm is the result of a prolonged LCR:","l":0},{"t":"Triggered by mechanical stimuli (e.g. laryngeal or pharyngeal manipulation) or chemical stimuli (e.g. gastric contents).","l":1},{"t":"Exaggerated by pathologic alteration in pharyngolaryngeal sensation (e.g. GERD, URI, and neurologic disorders) and other physiologic factors (e.g. age).","l":1}],"typical":[{"t":"During the excitement phase of anesthetic induction or emergence.","l":0},{"t":"During light anesthesia relative to the surgical stimulus.","l":0},{"t":"When there are mechanical irritants in the airway:","l":0},{"t":"Blood or secretions.","l":1},{"t":"Airway instrumentation.","l":1},{"t":"Oro/nasopharyngeal suction catheter.","l":1},{"t":"During surgical procedures involving the airway.","l":0},{"t":"In patients with GERD.","l":0},{"t":"In patients with onset of URI in the last 2 weeks.","l":0},{"t":"During anesthesia administration by an inexperienced provider.","l":0}],"prevention":[{"t":"Identify risk factors for laryngospasm:","l":0},{"t":"Young age (&lt;5 years).","l":1},{"t":"Male.","l":1},{"t":"Recent URI:","l":1},{"t":"Symptoms day of surgery or within preceding 2 weeks.","l":2},{"t":"Emergency procedure.","l":1},{"t":"Airway surgery.","l":1},{"t":"Wheezing at exercise more than three times in past year.","l":1},{"t":"History of eczema.","l":1},{"t":"Nocturnal dry cough.","l":1},{"t":"Family history of asthma or atopy.","l":1},{"t":"Exposure to second-hand smoke.","l":1},{"t":"Postpone elective procedures 2 to 3 weeks after URI.","l":0},{"t":"Seek supervision by an experienced pediatric anesthesia professional.","l":0},{"t":"Choose induction of anesthesia via the IV route if possible.","l":0},{"t":"Provide anesthesia via face mask when feasible, e.g. short cases requiring general anesthesia.","l":0},{"t":"Ensure an adequate depth of anesthesia prior to laryngeal manipulation or surgical stimulation.","l":0},{"t":"Use muscle relaxants to facilitate tracheal intubation.","l":0},{"t":"Provide an adequate level of anesthesia during maintenance.","l":0},{"t":"Extubate the trachea when the patient is either deeply anesthetized or is fully awake.","l":0},{"t":"Clear all secretions from the airway prior to and after extubation.","l":0},{"t":"Consider topical or IV <b>lidocaine<\/b>.","l":0}],"manifestations":[{"t":"Sudden onset.","l":0},{"t":"Retractions (sternal, intercostal).","l":0},{"t":"Paradoxical chest and abdominal movements.","l":0},{"t":"Inability to phonate.","l":0},{"t":"No airflow despite ventilatory efforts.","l":0},{"t":"Inability to mask ventilate.","l":0},{"t":"<b>Stridor<\/b> (if vocal cords are not completely closed).","l":0},{"t":"<b>Hypoxemia<\/b>.","l":0},{"t":"Tachypnea.","l":0},{"t":"<b>Tachycardia<\/b>.","l":0},{"t":"Increase in pharyngeal secretions.","l":0},{"t":"Inability to intubate or pass ETT.","l":0},{"t":"Loss of ET CO<sub>2<\/sub>.","l":0},{"t":"High PIP if trying to provide positive pressure ventilation.","l":0},{"t":"<b>Bradycardia<\/b>.","l":0},{"t":"<b>Cyanosis<\/b>.","l":0},{"t":"<b>Cardiac arrest<\/b>.","l":0}],"similar":[{"t":"Extrathoracic respiratory tract obstruction from other causes.","l":0},{"t":"Intratracheal foreign bodies (see Event 92, Aspiration of a Foreign Body).","l":0},{"t":"Infectious croup.","l":0},{"t":"Subglottic hemangioma.","l":0},{"t":"Glottic web.","l":0},{"t":"Vocal cord dysfunction or tumor.","l":0},{"t":"Arytenoid dislocation from traumatic instrumentation of the larynx.","l":0},{"t":"Pharyngeal edema or abscess.","l":0},{"t":"Angioneurotic edema.","l":0},{"t":"Pneumothorax or pneumomediastinum (see Event 35, Pneumothorax).","l":0}],"management":[{"t":"<b>Call for help.<\/b>","l":0},{"t":"Institute 5 to 10 cm H<sub>2<\/sub>O CPAP with an FiO<sub>2<\/sub> of <b>100%<\/b> using an anesthesia breathing circuit or bag valve mask.","l":0},{"t":"Use maximum efforts to open the airway:","l":0},{"t":"Jaw thrust, head tilt, oral or nasal airway.","l":1},{"t":"CPAP may break laryngospasm by lowering the pressure gradient across the obstructed segment and possibly by pneumatically stenting the pharyngeal and laryngeal muscles.","l":1},{"t":"Remove the offending stimulus:","l":0},{"t":"Suction the oropharynx.","l":1},{"t":"Deepen the anesthetic and prepare for the administration of muscle relaxant.","l":0},{"t":"<b>Monitor oxygenation carefully.<\/b>","l":0},{"t":"If laryngospasm does not break:","l":0},{"t":"Administer <b>atropine<\/b> IV <b>20 μg/kg<\/b> and <b>succinylcholine<\/b> IV, <b>0.5 to 2 mg/kg<\/b>.","l":1},{"t":"Or <b>propofol<\/b> IV, <b>1 mg/kg<\/b> (data limited in patients &lt;3 years).","l":1},{"t":"Or <b>rocuronium<\/b> IV, <b>0.9 to 1.2 mg/kg<\/b> (if <b>succinylcholine<\/b> is <b>contraindicated<\/b>).","l":1},{"t":"If no IV access, administer <b>succinylcholine<\/b> IM, <b>1.5 to 4 mg/kg<\/b>, or IO, <b>0.5 to 1 mg/kg<\/b>.","l":1},{"t":"Continue to provide positive pressure ventilation with CPAP.","l":1},{"t":"Maintain a patent airway.","l":1},{"t":"Consider spontaneous ventilation after muscle relaxation resolves.","l":1},{"t":"Prepare for more invasive airway maneuvers if oxygenation cannot be maintained:","l":0},{"t":"Intubation/reintubation (see Event 95, Difficult Airway Management in the Pediatric Patient).","l":1},{"t":"Cricothyrotomy.","l":1},{"t":"Tracheostomy.","l":1},{"t":"If the child manifests bradycardia that is profound or unresponsive to treatment, begin CPR (see Event 93, Bradycardia in the Pediatric Patient, and Event 94, Cardiac Arrest in the Pediatric Patient).","l":0}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Hypercarbia.","l":0},{"t":"Bradycardia.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Negative pressure pulmonary edema.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Alalami AA, Ayoub CM, Baraka AS. Laryngospasm: review of different prevention and treatment modalities. Paediatr Anaesth 2008;18:281-8."},{"t":"2. Alalami AA, Zestos MM, Baraka AS. Pediatric laryngospasm: prevention and treatment. Curr Opin Anaesth 2009;22:388-95."},{"t":"3. Burgoyne LL, Anghelescu DL. Intervention steps for treating laryngospasm in pediatric patients. Paediatr Anaesth 2008;18:297-302."},{"t":"4. Flick RP, Wilder RT, Pieper SF, et al. Risk factors for laryngospasm in children during general anesthesia. Paediatr Anaesth 2008;18:289-96."},{"t":"5. Hamilton ND, Hegarty M, Calder A, Erb TO, von Ungern-Sternberg BS. Does topical lidocaine before tracheal intubation attenuate airway responses in children? An observational audit. Paediatr Anaesth 2012;22:345-50."},{"t":"6. Mc Donnell C. Interventions guided by analysis of quality indicators decrease the frequency of laryngospasm during pediatric anesthesia. Paediatr Anaesth 2013;23:579-87."},{"t":"7. Orestes MI, Lander L, Verghese S, Shah RK. Incidence of laryngospasm and bronchospasm in pediatric adenotonsillectomy. Laryngoscope 2012;122:425-8."},{"t":"8. Orliaguet GA, Gall O, Savoldelli GL, Couloigner V. Case scenario: perianesthetic management of laryngospasm in children. Anesthesiology 2012;116:458-71."},{"t":"9. von Ungern-Sternberg BS, Boda K, Chambers NA, et al. Risk assessment for respiratory complications in paediatric anaesthesia: a prospective cohort study. Lancet 2010;376:773-83."}]}},{"id":98,"title":"Masseter Muscle Rigidity","ch":13,"cat":"Pediatric Events","s":{"definition":[{"t":"Masseter muscle rigidity (MMR) is a contracture of the masseter muscle following administration of succinylcholine, and ranges from mild (limited ability to open the mouth) to severe (“jaws of steel”).","l":0}],"etiology":[{"t":"The etiology is uncertain:","l":0},{"t":"An abnormal or exaggerated response at the neuromuscular junction to succinylcholine administration:","l":1},{"t":"Involves stimulation of the deep layers of the masseter muscles.","l":2}],"typical":[{"t":"Following administration of succinylcholine during induction of anesthesia:","l":0},{"t":"Highest incidence when used with volatile anesthetics in children.","l":1},{"t":"Occurs less commonly when IV induction agents are used.","l":1},{"t":"Following administration of succinylcholine for emergency securing of airway outside of OR.","l":0}],"prevention":[{"t":"<b>Avoid<\/b> using <b>succinylcholine<\/b> during anesthesia with a volatile anesthetic.","l":0},{"t":"<b>Avoid succinylcholine<\/b> and volatile anesthetics in patients with prior history of MMR.","l":0},{"t":"Consider alternatives to <b>succinylcholine<\/b> for RSI.","l":0},{"t":"Administer the correct dose of <b>succinylcholine<\/b> and wait a sufficient time for it to produce muscle relaxation prior to attempting laryngoscopy.","l":0}],"manifestations":[{"t":"Subjective difficulty in opening the mouth:","l":0},{"t":"This can range from a slight increase in masseter muscle resistance to apparent active tetany.","l":1},{"t":"Other skeletal muscles are typically relaxed.","l":1},{"t":"If generalized <b>rigidity<\/b> in the presence of MMR occurs, MH is likely to follow.","l":1},{"t":"Administration of additional succinylcholine does not result in relaxation of the masseter muscles.","l":0},{"t":"MMR persists until neuromuscular function begins to return in the peripheral musculature:","l":0},{"t":"Increased tension of the masseter muscle may last as long as 30 minutes.","l":1},{"t":"Ventilation is usually possible, as other airway muscles remain relaxed.","l":0},{"t":"Myalgia and weakness may be present for as long as 36 hours following the acute episode.","l":0},{"t":"All patients with significant MMR develop rhabdomyolysis over the ensuing 24 hours:","l":0},{"t":"Elevation of CK and presence of myoglobinemia and myoglobinuria.","l":1}],"similar":[{"t":"Congenital or acquired anatomic abnormalities that restrict mouth opening:","l":0},{"t":"Hemifacial microsomia, diseases of the temporomandibular joint, prior surgical procedures producing contractures.","l":1},{"t":"Myotonic syndromes.","l":0},{"t":"Light anesthesia.","l":0},{"t":"Normal increase in masseter muscle tension during induction of anesthesia and administration of succinylcholine.","l":0},{"t":"MH (see Event 45, Malignant Hyperthermia).","l":0},{"t":"Inadequate level of neuromuscular blockade.","l":0},{"t":"Failure to wait until the maximal effect of succinylcholine occurs.","l":0}],"management":[{"t":"<i>If generalized rigidity is present or if signs of MH develop, declare an MH emergency and <b>immediately<\/b> administer <b>dantrolene<\/b><\/i>(see Event 45, Malignant Hyperthermia).","l":0},{"t":"Maintain positive pressure ventilation with bag valve mask until the masseter muscles relax:","l":0},{"t":"Even though it is difficult to open the mouth, positive pressure ventilation is typically not a problem.","l":1},{"t":"Intubate the trachea whenever it becomes feasible to do so:","l":0},{"t":"Consider administration of an intubating dose of nondepolarizing muscle relaxant to facilitate intubation.","l":1},{"t":"If ventilation and intubation are not possible, prepare for surgical airway (see Event 95, Difficult Airway Management in the Pediatric Patient).","l":1},{"t":"Inform surgical team of MMR and discuss plans for surgery:","l":0},{"t":"Consider continuing with surgery if:","l":1},{"t":"MMR is mild/transient (mouth can eventually be opened with increased effort).","l":2},{"t":"No generalized rigidity is present.","l":2},{"t":"Patient is hemodynamically stable.","l":2},{"t":"Consider terminating surgery if:","l":1},{"t":"MMR is severe (mouth cannot be opened).","l":2},{"t":"Peripheral muscle rigidity is present.","l":2},{"t":"Terminate the surgery if
