1},{"t":"Both cartridges in a two cartridge system.","l":2},{"t":"Change absorbent when uncertain of the state of hydration.","l":1},{"t":"If compact canisters are used, consider changing them more frequently.","l":1},{"t":"Place a date on the canister when it is changed.","l":1},{"t":"If available, monitor patient using a multiwavelength pulse oximeter capable of continuously measuring carboxyhemoglobin.","l":1}],"manifestations":[{"t":"Moderate decrease in O<sub>2<\/sub> saturation.","l":0},{"t":"Unexpectedly rapid change of absorbent indicator color after anesthesia induction.","l":0},{"t":"Unusually high temperature of absorbent canister.","l":0},{"t":"On emergence from anesthesia, unexplained confusion, nausea, dyspnea, headaches, blurred vision, and dizziness.","l":0}],"similar":[{"t":"Emergence delirium after general anesthesia (see Event 55, Postoperative Alteration in Mental Status).","l":0},{"t":"Hypoxemia (see Event 10, Hypoxemia).","l":0},{"t":"Hypercarbia (see Event 32, Hypercarbia).","l":0},{"t":"MH (see Event 45, Malignant Hyperthermia).","l":0}],"management":[{"t":"Use high fresh gas flow to purge carbon monoxide from breathing circuit.","l":0},{"t":"Confirm diagnosis:","l":0},{"t":"Draw an arterial blood sample for co-oximetry analysis, looking for elevated carboxyhemoglobin (COHb).","l":1},{"t":"Ventilate lungs with <b>100%<\/b> O<sub>2<\/sub> to decrease the half-life of COHb:","l":0},{"t":"Patient may require mechanical ventilation until COHb has fallen to safe levels.","l":1},{"t":"Replace absorbent with fresh absorbent.","l":0}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Nausea, vomiting, severe headache, syncope.","l":0},{"t":"Coma, convulsions.","l":0},{"t":"Myocardial ischemia.","l":0},{"t":"Neuropsychologic abnormalities.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Olympio MA. Carbon dioxide absorbent desiccation safety conference convened by APSF. APSF Newsletter 2005;20:25-9."},{"t":"2. Berry PD, Sessler DI, Larson MD. Severe carbon monoxide poisoning during desflurane anesthesia. Anesthesiology 1999;90:613-6."},{"t":"3. Woehlck HJ, Dunning M, Connolly LA. Reduction in the incidence of carbon monoxide exposures in humans undergoing general anesthesia. Anesthesiology 1997;87:228-34."},{"t":"4. Feiner JR, Rollins MD, Sall JW, et al. Accuracy of carboxyhemoglobin detection by pulse co-oximetry during hypoxemia. Anesth Analg 2013;117:847-58."}]}},{"id":59,"title":"Circle System Expiratory Valve Stuck Closed","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"The expiratory valve of a circle system is “stuck closed” when the valve does not open properly during expiration, thus preventing exhalation of gas from the lungs.","l":0}],"etiology":[{"t":"Valve components are misassembled.","l":0},{"t":"Extra parts or foreign bodies are present in the valve assembly.","l":0},{"t":"Dirt, blood, moisture, or secretions contaminating the valve assembly.","l":0}],"typical":[{"t":"After cleaning or reassembly of the valve.","l":0}],"prevention":[{"t":"Ensure that only trained individuals assemble and maintain the valve systems.","l":0},{"t":"Conduct a thorough preuse check of the circle system and the unidirectional valves:","l":0},{"t":"Check for normal appearance of the valve assembly.","l":1},{"t":"Check that the valve disk moves appropriately when breathing from the circuit or when ventilating a “test lung” (reservoir bag):","l":1},{"t":"Check breathing circuit pressure at end-expiration during mechanical ventilation of the test lung:","l":2},{"t":"With a standing bellows ventilator, the pressure should be 2 to 3 cm H<sub>2<\/sub>O.","l":3},{"t":"With a piston or hanging bellows ventilator, the pressure should be zero.","l":3},{"t":"An automated machine check would probably <b>not<\/b> detect this problem.","l":3}],"manifestations":[{"t":"Progressive increase in PIP and PEEP:","l":0},{"t":"The increase in PIP may plateau at a high value owing to the performance envelope of the ventilator and to gas escaping through a high-pressure relief valve during inspiration.","l":1},{"t":"The continuing pressure alarm will sound after 15 seconds if pressure limit is set appropriately.","l":1},{"t":"<b>Hypotension<\/b> secondary to increased intrathoracic pressure and impaired venous return:","l":0},{"t":"Delayed or diminished response to injected vasoactive medications and fluids:","l":1},{"t":"They may not reach the arterial circulation because of impeded venous return.","l":2},{"t":"Increasing difficulty in ventilating the patient’s lungs due to apparent low total thoracic compliance, i.e. “stiff lungs”.","l":0},{"t":"Decreased or absent ET CO<sub>2<\/sub>.","l":0},{"t":"Decreased O<sub>2<\/sub> saturation.","l":0},{"t":"Pulmonary barotrauma:","l":0},{"t":"Pneumothorax.","l":1},{"t":"Pneumomediastinum.","l":1},{"t":"SC emphysema.","l":1}],"similar":[{"t":"Kinked or obstructed ETT or breathing circuit hose (see Event 7, High Peak Inspiratory Pressure).","l":0},{"t":"Obstruction of the WAGD system (see Event 73, Waste Anesthesia Gas Disposal System Malfunction).","l":0},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"Pneumothorax from other causes (see Event 35, Pneumothorax).","l":0}],"management":[{"t":"Disconnect the patient from the anesthesia breathing circuit to relieve high intrathoracic pressure.","l":0},{"t":"Use an alternative system to ventilate the lungs (e.g. self-inflating bag or a nonrebreath<b>ing system):<\/b>","l":0},{"t":"If total thoracic compliance is still low (e.g. “stiff lungs” or tension pneumothorax), the problem is in the patient, not the breathing circuit (see Event 7, High Peak Inspiratory Pressure).","l":1},{"t":"If the circle system <b>must<\/b> be used:","l":0},{"t":"Reduce the fresh gas flow into the circuit.","l":1},{"t":"Ventilate the lungs manually, disconnecting the patient from the breathing circuit as often as necessary to relieve the excess pressure.","l":1},{"t":"Attempt to relieve the obstruction:","l":1},{"t":"Tap the valve dome.","l":2},{"t":"Remove the expiratory valve disk:","l":2},{"t":"Increase the fresh gas flow to minimize rebreathing of CO<sub>2<\/sub>.","l":3},{"t":"Ventilate the lungs.","l":2},{"t":"Repair or replace the expiratory valve or valve-CO<sub>2<\/sub> absorber assembly.","l":1}],"complications":[{"t":"Hypotension.","l":0},{"t":"Pneumothorax.","l":0},{"t":"Following relief of the high intrathoracic pressure:","l":0},{"t":"Hypertension and tachycardia due to:","l":1},{"t":"Relief of the venous obstruction.","l":2},{"t":"Accumulated doses of vasoactive drugs reaching the arterial circulation.","l":2}],"reading":[{"t":"1. Eisenkraft JB. Hazards of the anesthesia delivery system. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 591-620."},{"t":"2. American Society of Anesthesiologists. ASA recommendations for pre-anesthesia checkout procedures. Park Ridge, Ill: American Society of Anesthesiologists; 2008. Available at http://www.asahq.org/For-Members/ClinicalInformation/2008-ASA-Recommendations-for-PreAnesthesia-Checkout.aspx."}]}},{"id":60,"title":"Circle System Inspiratory Valve Stuck Closed","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"The inspiratory valve of a circle system is “stuck closed” when it does not open properly during inspiration, thus preventing ventilation of the lungs.","l":0}],"etiology":[{"t":"Valve components are misassembled.","l":0},{"t":"Extra parts or foreign bodies are present in the valve assembly.","l":0},{"t":"Dirt, blood, moisture, or secretions contaminating the valve assembly.","l":0}],"typical":[{"t":"After cleaning or reassembly of the valve.","l":0}],"prevention":[{"t":"Ensure that only trained individuals assemble and maintain the valve systems.","l":0},{"t":"Conduct a thorough preuse check of the circle system and the unidirectional valves:","l":0},{"t":"Automated check of the newer anesthesia workstations should detect this fault.","l":1},{"t":"Check for normal appearance of the valve assembly.","l":1},{"t":"Check that the valve disk moves appropriately when breathing from the circuit or when ventilating a “test lung” (reservoir bag).","l":1},{"t":"Check that PIP is normal during ventilation of the test lung and that there is appropriate flow of gas into the test lung during inspiration.","l":1}],"manifestations":[{"t":"Markedly increased PIP:","l":0},{"t":"The high-pressure alarm may sound:","l":1},{"t":"Most anesthesia workstations have a default setting of 40 cm H<sub>2<\/sub>O.","l":2},{"t":"Apparent low total thoracic/pulmonary compliance:","l":0},{"t":"The reservoir bag feels “stiff ” during manual ventilation.","l":1},{"t":"Diminished or absent breath sounds.","l":0},{"t":"Decreased expired minute volume.","l":0},{"t":"Absent or decreased ET CO<sub>2<\/sub>:","l":0},{"t":"Increased arterial PaCO<sub>2<\/sub>.","l":1},{"t":"<b>Hypoxemia<\/b>.","l":0}],"similar":[{"t":"Kinked or obstructed ETT or breathing circuit hose (see Event 7, High Peak Inspiratory Pressure).","l":0},{"t":"Obstruction of the WAGD system (see Event 73, Waste Anesthesia Gas Disposal System Malfunction).","l":0},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"Endobronchial intubation (see Event 30, Endobronchial Intubation).","l":0}],"management":[{"t":"Use an alternative system to ventilate the lungs (e.g. self-inflating bag or a nonrebreath<b>ing system):<\/b>","l":0},{"t":"Maintain oxygenation and ventilation.","l":1},{"t":"Convert to an IV anesthetic if necessary.","l":1},{"t":"To diagnose the obstruction in the inspiratory limb of the circle system:","l":0},{"t":"Disconnect the patient from the anesthesia breathing circuit at the Y piece and activate the O<sub>2<\/sub> flush:","l":1},{"t":"If the breathing circuit pressure rises dramatically but there is no gas flow from the circuit, the inspiratory limb is obstructed.","l":2},{"t":"Inspect the valve assembly.","l":1},{"t":"If the circle system <b>must<\/b> be used:","l":0},{"t":"Remove the disk from the inspiratory valve, effectively leaving the valve stuck open.","l":1},{"t":"Maximize the fresh gas flow to minimize rebreathing.","l":1},{"t":"Ventilate the patient’s lungs.","l":1}],"complications":[{"t":"Hypoventilation.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Hypercarbia.","l":0}],"reading":[{"t":"1. Eisenkraft JB. Hazards of the anesthesia delivery system. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 591-620."},{"t":"2. Walker SG, Smith TC, Sheplock G, Acquaviva MA, Horn N. Breathing circuits. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 95-124."}]}},{"id":61,"title":"Circle System Valve Stuck Open","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"A valve in the circle system is “stuck open” when it does not fully occlude the inspiratory or expiratory limb, thereby permitting rebreathing of exhaled gases containing CO<sub>2<\/sub>.","l":0}],"etiology":[{"t":"The valve disk or valve ring is broken or deformed.","l":0},{"t":"Valve components are misassembled or missing.","l":0},{"t":"Extra parts or foreign bodies are present in the valve assembly.","l":0},{"t":"Dirt, blood, moisture, or secretions contaminating the valve assembly.","l":0}],"typical":[{"t":"After cleaning or reassembly of the valve.","l":0},{"t":"Long-duration cases with humidification.","l":0}],"prevention":[{"t":"Ensure that only trained individuals assemble and maintain the valve systems.","l":0},{"t":"Conduct an appropriate preuse check of the circle system and the one-way valves:","l":0},{"t":"Check for normal appearance of the valve assembly.","l":1},{"t":"Check that the valve disks move appropriately when breathing from the circuit or when ventilating a “test lung” (reservoir bag).","l":1},{"t":"Check for agreement between the tidal volume set on the ventilator and the volumes delivered and exhaled from the test lung.","l":1},{"t":"An automated machine check would most likely not detect this problem.","l":1}],"manifestations":[{"t":"Increased inspiratory CO<sub>2<\/sub>:","l":0},{"t":"This is pathognomonic for rebreathing or for exogenous administration of CO<sub>2<\/sub>.","l":1},{"t":"Observe both the digital readout of FiCO<sub>2<\/sub> and the capnogram:","l":1},{"t":"FiCO<sub>2<\/sub> &gt; 0 to 1 mm Hg.","l":2},{"t":"Elevated baseline of capnogram.","l":2},{"t":"Increased ET CO<sub>2<\/sub> and PaCO<sub>2<\/sub>:","l":0},{"t":"<b>Hypertension<\/b>, <b>tachycardia<\/b>, and vasodilation secondary to <b>hypercarbia<\/b>.","l":1},{"t":"Hyperventilation in patients who are breathing spontaneously.","l":0},{"t":"Reverse flow alarm may be activated by a spirometer that can sense the direction of flow and is located in the limb of the incompetent valve.","l":0},{"t":"If the incompetent valve is in the inspiratory limb, there may be a disparity between the inspiratory movement of the ventilator bellows and the expired volumes measured by a spirometer in the expiratory limb.","l":0}],"similar":[{"t":"Failure or exhaustion of the CO<sub>2<\/sub> absorbent.","l":0},{"t":"CO<sub>2<\/sub> absorber bypass valve accidentally left in the bypass position.","l":0},{"t":"CO<sub>2<\/sub> absorber out of circuit.","l":0},{"t":"CO<sub>2<\/sub> infused into the circuit from a pipeline supply or tank.","l":0}],"management":[{"t":"Check for CO<sub>2<\/sub> absorbent exhaustion and replace if necessary.","l":0},{"t":"Check that CO<sub>2<\/sub> absorber bypass valve (if present) is correctly positioned.","l":0},{"t":"Check that the CO<sub>2<\/sub> absorber (disposable cartridge) is in the circuit.","l":0},{"t":"Use an alternative system to ventilate the lungs (e.g. self-inflating bag or a nonrebreath<b>ing system) if the ET CO<sub>2<\/sub> or PaCO<sub>2<\/sub> is significantly increased or if there are systemic signs of hypercarbia:<\/b>","l":0},{"t":"Repair or replace the valve assembly or anesthesia workstation as soon as feasible.","l":1},{"t":"Maintain anesthesia with IV agents.","l":0},{"t":"If the circle system <b>must<\/b> be used:","l":0},{"t":"Maximize fresh gas flow into the breathing circuit.","l":1},{"t":"Ventilate the patient’s lungs.","l":1}],"complications":[{"t":"Hypercarbia:","l":0},{"t":"Tachycardia.","l":1},{"t":"Hypertension.","l":1},{"t":"Arrhythmias.","l":0}],"reading":[{"t":"1. Walker SG, Smith TC, Sheplock G, Acquaviva MA, Horn N. Breathing circuits. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 95-124."},{"t":"2. Eisenkraft JB, Jaffe MB. Respiratory gas monitoring. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 191-222."},{"t":"3. Giordano CR, Gravenstein N. Capnography. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 245-55."}]}},{"id":62,"title":"Common Gas Outlet Failure","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"Common (fresh) gas outlet failure is the disconnection or obstruction of the fresh gas supply between the common gas outlet of the anesthesia workstation and the anesthesia breathing circuit (many contemporary anesthesia workstations do not have a user-accessible common gas outlet).","l":0}],"etiology":[{"t":"Disconnection of the connecting hose from the common gas outlet or the CO<sub>2<\/sub> absorber housing.","l":0},{"t":"Obstruction of the common gas outlet or connecting hose.","l":0},{"t":"Failure of the auxiliary common gas outlet present on some anesthesia workstations.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"GE/ Datex-Ohmeda Aestiva.","l":2},{"t":"The GE Aisys Carestation.","l":2}],"typical":[{"t":"After the connecting hose has been disconnected from the common gas outlet so that the common gas outlet can be used as a source of O<sub>2<\/sub> or an O<sub>2<\/sub>-air mixture for delivery to a face mask or nasal cannulae.","l":0},{"t":"After cleaning or maintenance of the anesthesia workstation.","l":0}],"prevention":[{"t":"Use an antidisconnect device at each end of the connecting hose between the common gas outlet and the anesthesia breathing circuit.","l":0},{"t":"<b>Do not<\/b> connect O<sub>2<\/sub> nasal cannulae or face masks to the common gas outlet or connecting hose:","l":0},{"t":"Connect to a separate O<sub>2<\/sub> source.","l":1},{"t":"Connect to auxiliary O<sub>2<\/sub> flowmeter.","l":1},{"t":"Connect to the Y piece of the breathing circuit.","l":1},{"t":"Connect to auxiliary common gas outlet if an air/O<sub>2<\/sub> mixture is desired to <b>avoid<\/b> an O<sub>2<\/sub> enriched atmosphere.","l":1},{"t":"Conduct a thorough preuse check of the anesthesia workstation.","l":0},{"t":"Discourage nonessential activity in the vicinity of the anesthesia workstation and the anesthesia breathing circuit.","l":0}],"manifestations":[{"t":"The reservoir bag or ventilator bellows will progressively empty:","l":0},{"t":"In ventilators in which the bellows falls during exhalation (“hanging bellows”), the loss of gas from the circuit may not be apparent.","l":1},{"t":"When the O<sub>2<\/sub> flush is activated, there will be a loud sound of rushing gas but the reservoir bag or ventilator bellows will not fill.","l":0},{"t":"The breathing circuit low airway pressure alarm will sound.","l":0},{"t":"The low minute ventilation alarm may sound.","l":0},{"t":"Decrease in the O<sub>2<\/sub> concentration of the inspired gas.","l":0},{"t":"The signs of:","l":0},{"t":"Hypoventilation.","l":1},{"t":"<b>Hypoxemia<\/b>.","l":1},{"t":"<b>Hypercarbia<\/b> will appear later.","l":1}],"similar":[{"t":"Major leak in the anesthesia circuit from other causes (see Event 69, Major Leak in the Anesthesia Breathing Circuit).","l":0}],"management":[{"t":"Increase the fresh gas flow into the anesthesia breathing circuit:","l":0},{"t":"This will not compensate for the leak from a disconnection of the common gas outlet or connecting hose.","l":1},{"t":"Switch to the reservoir bag, close the pop-off valve, and attempt to fill the anesthesia breathing circuit by activating the O<sub>2<\/sub> flush:","l":0},{"t":"Activating the O<sub>2<\/sub> flush will not fill the anesthesia circuit:","l":1},{"t":"If the common gas outlet is obstructed, there will be no flow of gas.","l":2},{"t":"If the connecting hoses are disconnected, there will be a loud sound of escaping gas but the reservoir bag will not fill.","l":2},{"t":"Scan for an obvious disconnection or interruption of the hose between the common gas outlet and the anesthesia breathing circuit:","l":0},{"t":"Reconnect the hose.","l":1},{"t":"Check whether the auxiliary common gas outlet (present on some anesthesia workstations) has been selected.","l":0},{"t":"If problem persists, use an alternative system to ventilate the lungs (e.g. self-inflating bag or a nonrebreathing system):","l":0},{"t":"Call for help to identify and correct the problem.","l":1},{"t":"If necessary, replace the anesthesia workstation if this is feasible.","l":1},{"t":"Maintain anesthesia with IV agents until the common gas outlet is restored.","l":0},{"t":"Inform biomedical engineering of the failure and have the equipment inspected.","l":0}],"complications":[{"t":"Hypoventilation:","l":0},{"t":"Hypercarbia.","l":1},{"t":"Hypoxemia.","l":1},{"t":"Awareness.","l":0}],"reading":[{"t":"1. Raphael DT, Weller RS, Doran DJ. A response algorithm for the low pressure alarm condition. Anesth Analg 1988;67:876."},{"t":"2. Eisenkraft JB. The anesthesia machine and workstation. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 25-63."}]}},{"id":63,"title":"Drug Administration Error","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"A drug administration error involving a syringe, ampule, or infusion pump may occur in the following ways:","l":0},{"t":"<i>Ampule swap: <\/i>The incorrect drug is drawn up into a labeled syringe or infusion pump <i>Syringe swap: <\/i>Medication from the wrong syringe is administered to the patient.","l":1},{"t":"<i>Infusion pump error: <\/i>Incorrect drug or drug dosage administration from an infusion pump.","l":1}],"etiology":[{"t":"Failure to label syringes or infusion pump.","l":0},{"t":"Incorrect labeling of syringes or infusions.","l":0},{"t":"Failure to read the label on the ampule, syringe, or infusion pump:","l":0},{"t":"Mix-up of drugs with similar names, e.g. epinephrine and ephedrine.","l":1},{"t":"Mix-up of drugs with similar packaging:","l":1},{"t":"Drugs from different vendors may look similar.","l":2},{"t":"Wrong drug in storage bin.","l":1},{"t":"Failure to properly dilute a concentrated preparation of a drug, e.g. regular insulin.","l":0}],"typical":[{"t":"When the anesthesia professional is working in unfamiliar settings or with unfamiliar devices.","l":0},{"t":"When drug packaging or ampules are changed, e.g. new vendor.","l":0},{"t":"When drugs are restocked.","l":0},{"t":"When there is time pressure or in the presence of distractions.","l":0},{"t":"When ampules have a similar appearance, especially if they are located close to each other in a drug cart.","l":0},{"t":"When syringe and infusion pump labels are written by hand.","l":0},{"t":"When syringes are prepared by other personnel.","l":0},{"t":"When it is dark in the OR or procedure room.","l":0}],"prevention":[{"t":"Check the drug name and concentration on each drug ampule carefully (ASTM standard D 6398-08).","l":0},{"t":"Use drug ampules whose labels conform to ASTM standard D 5022-07.","l":0},{"t":"Label syringes carefully:","l":0},{"t":"Use preprinted, color-coded adhesive syringe labels (ASTM D 4774-11e1).","l":1},{"t":"For emergency drugs, use “ready to use” syringes (ASTM D 4775-88/D 4775M-09).","l":1},{"t":"Discard unlabeled syringes.","l":1},{"t":"Discard syringes if there is any doubt about their actual contents.","l":1},{"t":"Use commercially premade syringes:","l":0},{"t":"Especially with high-potency medications requiring dilution.","l":1},{"t":"Arrange drug trays to separate similar appearing or named medications.","l":0},{"t":"Pharmacy should notify anesthesia professionals when changing drug vendors.","l":0},{"t":"Use “high risk” labels for high-risk drugs, e.g. neuromuscular blockers.","l":0}],"manifestations":[{"t":"Unusual response or lack of response to drug administration:","l":0},{"t":"Unusual increase or decrease in BP or HR.","l":1},{"t":"The awake patient may complain of an unusual sensation:","l":1},{"t":"Pounding heart or palpitations.","l":2},{"t":"Lightheadedness.","l":2},{"t":"Unexpected change in level of consciousness.","l":2},{"t":"Visual disturbance.","l":2},{"t":"Unexpected muscle weakness.","l":2},{"t":"The anesthetized patient may exhibit:","l":1},{"t":"<b>Hypertension<\/b>, <b>tachycardia<\/b>, <b>hypotension<\/b>, <b>bradycardia<\/b>.","l":2},{"t":"Unexpected occurrence or persistence of muscle relaxation.","l":2},{"t":"Unexpected change, or lack of change, in level of consciousness.","l":2},{"t":"Incorrect ampule or vial found to be open in the anesthesia professional’s work area.","l":0}],"similar":[{"t":"Seizures (see Event 57, Seizures).","l":0},{"t":"Airway obstruction.","l":0},{"t":"Hypertension (see Event 8, Hypertension).","l":0},{"t":"Hypotension from other causes (see Event 9, Hypotension).","l":0},{"t":"Failure to awaken or breathe from other causes (see Event 56, Postoperative Failure to Breathe, and Event 55, Postoperative Alteration in Mental Status).","l":0},{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"Failure of the IV infusion (see Event 67, Intravenous Line Failure).","l":0}],"management":[{"t":"If the error in drug administration is recognized <b>immediately<\/b> after injection:","l":0},{"t":"Stop the IV line carrying the drug.","l":1},{"t":"Disconnect IV tubing from IV catheter and drain IV line.","l":1},{"t":"If there is a BP cuff on the same arm as the IV catheter, inflate it to slow down the entry of the drug into the central circulation.","l":1},{"t":"Maintain the patient’s airway and ensure adequate oxygenation and ventilation:","l":0},{"t":"If the medication error involved administration of a muscle relaxant to an awake patient:","l":1},{"t":"Reassure the patient, provide sedation with a short-acting IV agent, and assess the need to place an ETT for ventilation and anesthesia.","l":2},{"t":"Assess neuromuscular function with a nerve stimulator and reverse neuromuscular blockade when sufficient recovery has occurred.","l":2},{"t":"If the medication error involved administration of a muscle relaxant to an anesthetized patient:","l":1},{"t":"Assess neuromuscular function with a nerve stimulator and reverse neuromuscular blockade when sufficient recovery has occurred.","l":2},{"t":"Maintain anesthesia until adequately reversed.","l":2},{"t":"If the patient is hypotensive (see Event 9, Hypotension):","l":0},{"t":"Expand the circulating fluid volume rapidly.","l":1},{"t":"Administer a vasopressor, e.g. <b>phenylephrine<\/b> IV, <b>50 to 100 μg<\/b> bolus.","l":1},{"t":"Treat any associated bradycardia with <b>atropine<\/b> IV, <b>0.6 mg<\/b> bolus; or <b>glycopyrrolate<\/b> IV, <b>0.2 to 0.4 mg<\/b> bolus, repeated as necessary.","l":1},{"t":"If the patient is hypertensive (see Event 8, Hypertension):","l":0},{"t":"Depending on the drug and dose, the hypertensive episode may resolve quickly.","l":1},{"t":"In particular, it is often better to wait for the effects of <b>epinephrine<\/b> (especially tachycardia) to resolve spontaneously than to treat it aggressively with β-blockade, which can lead to unopposed adrenergic effects.","l":1},{"t":"Administer a short-acting vasodilator (NTG IV <b>0.2 to 1 μg/kg/min<\/b>; sodium <b>nitroprusside<\/b> IV <b>0.2 to 2 μg/kg/min<\/b>).","l":1},{"t":"Consider treating prolonged tachycardia:","l":1},{"t":"<b>Esmolol<\/b> IV, <b>0.5 mg/kg<\/b> loading dose, followed by an infusion as necessary to control the HR.","l":2},{"t":"Labetolol IV, <b>5 to 20 mg<\/b>, repeat as needed.","l":2},{"t":"Attempt to determine what drug was administered:","l":0},{"t":"Check infusion pumps:","l":1},{"t":"Check to see whether infusions are running.","l":2},{"t":"Check drug infusion settings and labeling.","l":2},{"t":"Check tubing from source to patient.","l":2},{"t":"Check the syringes and ampules used during the case:","l":1},{"t":"Check the label on the syringe just used to determine whether it was the desired one.","l":2},{"t":"Check to see whether one syringe has an unexpectedly low volume of drug remaining.","l":2},{"t":"Inspect opened ampules and vials to determine whether an incorrect medication was opened.","l":1},{"t":"Have the trash and “sharps” containers impounded to allow inspection of ampules, vials, and syringes at a later time.","l":1},{"t":"Treat any additional side effects of the medications that were administered.","l":0}],"complications":[{"t":"Awareness.","l":0},{"t":"Residual or prolonged neuromuscular blockade.","l":0},{"t":"Hypercarbia:","l":0},{"t":"Hypoventilation.","l":1},{"t":"Hypoxemia.","l":1},{"t":"Or.","l":1},{"t":"Myocardial ischemia or infarction.","l":0},{"t":"Cerebral ischemia.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Eichhorn JH. APSF hosts medication safety conference consensus group defines challenges. APSF Newsletter 2010;25:1-9."},{"t":"2. Stratman RC, Wall MH. Implementation of a comprehensive drug safety program in the perioperative setting. Int Anesthesiol Clin 2013;51:13-30."},{"t":"3. Cooper L, Nossaman B. Medication errors in anesthesia: a review. Int Anesthesiol Clin 2013;51:1-12."},{"t":"4. Orser BA, Hyland S, U D, Sheppard I, Wilson CR. Review article: improving drug safety for patients undergoing anesthesia and surgery. Can J Anaesth 2013;60:127-35."}]}},{"id":64,"title":"Electrical Power Failure","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"Electrical power failure is loss of all or part of the electrical power supply, including the possible loss of the emergency power generation system.","l":0}],"etiology":[{"t":"Power failure external to the hospital.","l":0},{"t":"Power failure internal to all or part of the hospital.","l":0},{"t":"Failure of an electrical circuit within the OR.","l":0},{"t":"Failure of the emergency power generation system or battery backup system.","l":0}],"typical":[{"t":"During severe weather.","l":0},{"t":"During or after a fire in the hospital.","l":0},{"t":"Following a natural disaster, e.g. earthquake.","l":0},{"t":"During or after construction within or outside the hospital.","l":0}],"prevention":[{"t":"Ensure that backup batteries in anesthesia equipment are charged and that the batteries continue to hold charge:","l":0},{"t":"Nickel-cadmium batteries may need to be fully discharged occasionally to maintain their ability to hold a full charge.","l":1},{"t":"Plug critical electrical equipment into circuits connected to the emergency power generation system (typically red colored outlets).","l":0},{"t":"Test the emergency power generation system on a regular basis, and correct any faults that might prevent a rapid switchover to emergency power.","l":0},{"t":"Use an uninterruptible power supply (UPS) for critical pieces of equipment:","l":0},{"t":"Check the operating manual of each anesthesia workstation and ventilator for the need of a UPS:","l":1},{"t":"Some newer anesthesia workstations have a battery backup that can power the ventilator for a short time.","l":2},{"t":"Conduct periodic power failure drills with OR staff.","l":0}],"manifestations":[{"t":"Failure of primary and emergency electrical power:","l":0},{"t":"Room lights go off.","l":1},{"t":"All electrical equipment without a battery backup goes off.","l":1},{"t":"Electronically controlled or powered anesthesia workstations without battery backup will stop working:","l":1},{"t":"Some anesthesia ventilators are both pneumatically powered and pneumatically controlled and will continue to function.","l":2},{"t":"Most contemporary anesthesia ventilators are electronically controlled or electrically powered and will stop working.","l":2},{"t":"Delivery of anesthetic gases to the circuit may also stop.","l":2},{"t":"Failure of primary power only; emergency power is on:","l":0},{"t":"Lights and equipment go off transiently:","l":1},{"t":"There will be a variable time interval while emergency generators are activating and power is restored to the emergency power outlets.","l":2},{"t":"When switching to emergency power, microprocessor-based equipment may reset to factory defaults or lock up owing to power surge.","l":1},{"t":"Equipment that is not connected to an emergency power outlet will not operate.","l":1}],"similar":[{"t":"Localized failure of a single outlet or circuit.","l":0},{"t":"Failure of an individual monitor, device, or light.","l":0},{"t":"Tripping of a ground fault circuit interrupter (GFCI) outlet.","l":0}],"management":[{"t":"Find an emergency flashlight:","l":0},{"t":"A flashlight should be stored in the anesthesia cart.","l":1},{"t":"Many ORs have battery-powered emergency lights.","l":1},{"t":"Use the laryngoscope light to assist in finding other lights.","l":1},{"t":"Use a smartphone flashlight.","l":1},{"t":"Open the OR door to let in light from the corridor.","l":1},{"t":"If emergency power is on, ensure that all critical devices are connected to emergency power outlets.","l":0},{"t":"Ensure that the O<sub>2<\/sub> supply is still intact:","l":0},{"t":"If not, disconnect wall O<sub>2<\/sub> hose, open backup O<sub>2<\/sub> cylinders on the anesthesia workstation, and manually ventilate the patient’s lungs.","l":1},{"t":"If both the primary and emergency power systems have failed:","l":0},{"t":"The internal backup battery may power the anesthesia workstation for a short time, usually 30 to 60 minutes.","l":1},{"t":"Prolong battery life in workstations by reducing screen brightness to a minimum.","l":1},{"t":"Check the anesthesia workstation to determine what systems are functional.","l":1},{"t":"If there is any doubt about ability to oxygenate and ventilate the patient using the anesthesia workstation, ventilate with a self-inflating bag and a separate O<sub>2<\/sub> source:","l":1},{"t":"Check gas flow:","l":2},{"t":"If there is no gas flow, activate the manual emergency O<sub>2<\/sub> flowmeter if available and ventilate with self-inflating bag.","l":3},{"t":"Send help to obtain additional O<sub>2<\/sub> tanks and regulator.","l":3},{"t":"Check the ventilator to ensure the patient’s lungs are being mechanically ventilated:","l":2},{"t":"If the ventilator is not operating, initiate manual ventilation using the anesthesia workstation and breathing circuit or self-inflating bag.","l":3},{"t":"Consider manual ventilation to prolong battery life of the anesthesia workstation.","l":3},{"t":"Check that monitors are functioning:","l":2},{"t":"Send for battery-operated transport monitor.","l":3},{"t":"Confer with the surgeon:","l":0},{"t":"Consider the status of the surgical procedure and its urgency.","l":1},{"t":"If the surgery is at a critical point, the highest priority for lighting should go to the surgical field.","l":1},{"t":"Establish monitoring of the patient:","l":0},{"t":"Place esophageal or precordial stethoscope.","l":1},{"t":"Place manual BP cuff and check periodically.","l":1},{"t":"Palpate peripheral pulses or have the surgeon palpate arterial pulses in the operative field.","l":1},{"t":"Check that routine monitors with battery backups are still operating:","l":1},{"t":"Allocate available battery-operated transport monitors (high-acuity cases have priority).","l":2},{"t":"Consider the need for additional IV anesthesia drugs.","l":0},{"t":"Ensure that OR staff and engineers are informed of the power failure and have activated the hospital disaster plan if appropriate.","l":0},{"t":"Allocate personnel and equipment where needed most:","l":0},{"t":"Patients undergoing CPB:","l":1},{"t":"Some pump oxygenators have battery backups but all have hand cranks.","l":2},{"t":"Complex or urgent surgical cases.","l":1},{"t":"ICU (all ventilators may be inoperative if there has been a large-scale power loss).","l":1},{"t":"Reassess allocation of personnel and resources as the situation evolves.","l":1},{"t":"Determine time until power will be restored, if possible:","l":0},{"t":"If power supply is likely to take more than a few minutes to restore, terminate all nonemergent cases <b>as soon as possible<\/b>.","l":1},{"t":"<b>Do not<\/b> start non-emergent cases until a reliable electrical power supply is ensured.","l":1}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Surgical mishap.","l":0},{"t":"Hemodynamic instability.","l":0},{"t":"Intraoperative awareness.","l":0}],"reading":[{"t":"1. Ehrenwerth J, Seifert HA. Electrical and fire safety. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 621-52."},{"t":"2. Ehrenwerth J, Seifert HA. Electrical and fire safety. In: Barash PB, Cullen BF, Stoelting RK, et al, editors. Clinical anesthesia. 7th ed. Philadelphia: Lippincott Williams and Wilkins; 2013, chapter 8."},{"t":"3. NFPA-99. Health care facilities code. 2012 ed. Quincy, Mass: National Fire Protection Association; 2012."},{"t":"4. Eichhorn JH, Hessel EA. Electrical power failure in the operating room: a neglected topic in patient safety. Anesth Analg 2010;110:1519-21."},{"t":"5. Carpenter T, Robinson ST. Response to a partial power failure in the operating room. Anesth Analg 2010;110:1644-6."}]}},{"id":65,"title":"Faulty Oxygen Supply","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"Faulty O<sub>2<\/sub> supply is when the O<sub>2<\/sub> supply to the anesthesia workstation does not contain 100% O<sub>2<\/sub>.","l":0}],"etiology":[{"t":"Crossing of pipelines with other medical gases (central air, N<sub>2<\/sub>O, or N2) during construction or repair of the central O<sub>2<\/sub> delivery system.","l":0},{"t":"Incorrect connector on the O<sub>2<\/sub> hose to the wall O<sub>2<\/sub> outlet.","l":0},{"t":"Connection of the O<sub>2<\/sub> hose and connector to the wrong gas outlet:","l":0},{"t":"Failure or misuse of the Diameter Index Safety System (DISS) or proprietary “quick connect” systems.","l":1},{"t":"Substitution of a non-O<sub>2<\/sub> cylinder at the O<sub>2<\/sub> yoke:","l":0},{"t":"Failure or misuse of the Pin Index Safety System (PISS).","l":1},{"t":"Central O<sub>2<\/sub> supply contaminated with another gas, i.e. N<sub>2<\/sub>O or N2.","l":0},{"t":"Supply lines to the anesthesia workstation have been reversed.","l":0},{"t":"O<sub>2<\/sub> cylinders contain another gas.","l":0}],"typical":[{"t":"Following construction, modification, or repair of the piped gas delivery system.","l":0},{"t":"Construction of an OR room or remodeling of an existing OR.","l":0},{"t":"Following initial installation or maintenance of the anesthesia workstation.","l":0},{"t":"Following disconnection of the O<sub>2<\/sub> supply hose from the O<sub>2<\/sub> outlet in the OR.","l":0},{"t":"Following delivery of bulk O<sub>2<\/sub> or N<sub>2<\/sub>O to the central supply system.","l":0}],"prevention":[{"t":"Ensure all work on medical gas pipelines is performed by properly trained and certified individuals.","l":0},{"t":"Analyze all medical gases at all outlets following any construction or repair of the piped gas supply.","l":0},{"t":"Use a redundant O<sub>2<\/sub> analyzer with a low O<sub>2<\/sub> alarm (set to &gt;<b>21%<\/b>) in the anesthesia breathing circuit along with respiratory gas analyzer.","l":0},{"t":"Ensure O<sub>2<\/sub> analyzer reads <b>100%<\/b>, with pure O<sub>2<\/sub> flowing.","l":0},{"t":"Calibrate the O<sub>2<\/sub> analyzer as part of a thorough machine check.","l":0},{"t":"Use DISS connectors on high-pressure medical gas supply hoses.","l":0},{"t":"Use PISS on all gas cylinders and cylinder yokes:","l":0},{"t":"<b>Do not<\/b> force a cylinder onto the hanger yoke.","l":1},{"t":"<b>Do not<\/b> attempt to bypass the PISS.","l":1},{"t":"Use appropriately color-coded gas cylinders, but always check the label on the tank for content:","l":0},{"t":"Color codes differ in different countries.","l":1}],"manifestations":[{"t":"If the O<sub>2<\/sub> supply is contaminated with CO<sub>2<\/sub>, N<sub>2<\/sub>O, N2, or air:","l":0},{"t":"The anesthesia breathing circuit O<sub>2<\/sub> analyzer indicates an abnormally low O<sub>2<\/sub> concentration for the setting of the flowmeters.","l":1},{"t":"Manifestations will depend on the gas and its concentration that is contaminating the supply:","l":1},{"t":"The low O<sub>2<\/sub> concentration alarm may sound.","l":2},{"t":"O<sub>2<\/sub> saturation may fall.","l":2},{"t":"The O<sub>2<\/sub> concentration in the anesthesia breathing circuit might not be increased by increasing the O<sub>2<\/sub> flow.","l":1},{"t":"If the O<sub>2<\/sub> supply is crossed with N<sub>2<\/sub>O, N2 or CO<sub>2<\/sub>:","l":0},{"t":"Rapid decrease in FiO<sub>2<\/sub> and O<sub>2<\/sub> saturation during preoxygenation, and it is worsened by increasing the flow of “O<sub>2<\/sub>”.","l":1},{"t":"If N<sub>2<\/sub>O is crossed with O<sub>2<\/sub>:","l":0},{"t":"Rapid decrease in FiO<sub>2<\/sub> and O<sub>2<\/sub> saturation during preoxygenation or when N<sub>2<\/sub>O is discontinued at the end of the case:","l":1},{"t":"Gas analyzer will read high N<sub>2<\/sub>O.","l":2},{"t":"Crossover may not be immediately apparent if equal flows of N<sub>2<\/sub>O and O<sub>2<\/sub> are used during the case.","l":1},{"t":"<b>Arrhythmias<\/b>.","l":1},{"t":"<b>Bradycardia<\/b>.","l":1},{"t":"<b>Cardiac arrest<\/b>.","l":1},{"t":"If CO<sub>2<\/sub> and N<sub>2<\/sub>O supplies are crossed:","l":0},{"t":"Very high levels of ET CO<sub>2<\/sub> and no N<sub>2<\/sub>O on the gas analyzer.","l":1},{"t":"<b>Arrhythmias<\/b>:","l":1},{"t":"<b>Tachycardia<\/b>.","l":2},{"t":"<b>Hypertension<\/b>.","l":2},{"t":"Or.","l":2},{"t":"Could be mistaken for MH.","l":1}],"similar":[{"t":"Hypoxemia secondary to other causes (see Event 10, Hypoxemia).","l":0},{"t":"Artifact or malfunction of O<sub>2<\/sub> analyzer or pulse oximeter.","l":0},{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"PE (see Event 21, Pulmonary Embolism).","l":0},{"t":"Loss of pipeline O<sub>2<\/sub> (see Event 68, Loss of Pipeline Oxygen).","l":0},{"t":"MH (see Event 45, Malignant Hyperthermia).","l":0}],"management":[{"t":"<i>Ventilation with a non-O<sub>2<\/sub> containing gas causes hypoxemia more rapidly than does apnea or airway obstruction secondary to replacement of O<sub>2<\/sub> with the other gas.<\/i>","l":0,"n":1},{"t":"Verify that the O<sub>2<\/sub> concentration is abnormally low:","l":0},{"t":"Check the O<sub>2<\/sub> analyzer and respiratory gas analyzer.","l":1},{"t":"Check the settings of flowmeters on the anesthesia machine.","l":1},{"t":"Do NOT use the anesthesia machine auxiliary O<sub>2<\/sub> flowmeter, as this will also deliver the crossed gas.","l":0},{"t":"Open an O<sub>2<\/sub> cylinder on the anesthesia machine AND disconnect the O<sub>2<\/sub> and other gases from the pipeline supply:","l":0},{"t":"The anesthesia machine will preferentially draw O<sub>2<\/sub> from the pipeline even if the O<sub>2<\/sub> cylinders on the anesthesia machine are opened:","l":1},{"t":"Pipeline supply pressure is 50 psig, whereas the cylinder pressure is reduced to 45 psig.","l":2},{"t":"Activate the O<sub>2<\/sub> flush valve and fill the anesthesia breathing circuit with O<sub>2<\/sub> from the cylinder.","l":0},{"t":"Verify that the circuit O<sub>2<\/sub> concentration rises appropriately:","l":0},{"t":"Check the O<sub>2<\/sub> analyzer and the respiratory gas analyzer.","l":1},{"t":"Maintain ventilation with <b>100%<\/b> O<sub>2<\/sub> until the patient’s oxygenation is normal.","l":1},{"t":"If the O<sub>2<\/sub> concentration in the anesthesia breathing circuit does not rise appropriately:","l":0},{"t":"Ventilate the patient with an alternate ventilation system (e.g. self-inflating bag or nonrebreathing circuit), using a fresh O<sub>2<\/sub> cylinder as the O<sub>2<\/sub> source.","l":1},{"t":"If no other O<sub>2<\/sub> cylinder is available, ventilate with a self-inflating bag using room air, or perform mouth-to-ETT ventilation.","l":1},{"t":"<b>Immediately<\/b> alert personnel in other ORs, critical care areas, hospital engineering, and other parts of the hospital.","l":0},{"t":"Terminate all cases <b>as soon as possible<\/b>.","l":0}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Hypoxic injury to the heart or brain.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Malayaman SN, Mychaskiw G, Ehrenwerth J. Medical gases: storage and supply. In: Ehrenwerth J, Eisenkraft J, Berry J, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 3-24."},{"t":"2. It could happen to you! Construction contaminates oxygen pipeline. APSF Newsletter 2012;27:35."},{"t":"3. Weller J, Merry A, Warman G, Robinson B. Anaesthetists’ management of oxygen pipeline failure: room for improvement. Anaesthesia 2007;62:122-6."},{"t":"4. Mudumbai SC, Fanning R, Howard SK, et al. Use of medical simulation to explore equipment failures and human-machine interactions in anesthesia machine pipeline crossover. Anesth Analg 2010;110:1292-6."},{"t":"5. Rose G, Durbin K, Eichhorn JH. Gas cylinder colors ARE NOT an FDA standard! Anesthesia Patient Safety Foundation Newsletter 2010;25:16."}]}},{"id":66,"title":"Gas Flow Control Malfunction","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"Gas flow control malfunction is failure of the gas flow control system.","l":0}],"etiology":[{"t":"Leak:","l":0},{"t":"Broken or cracked flowmeter.","l":1},{"t":"Leaking seal between the flowmeter and the anesthesia workstation.","l":1},{"t":"Leaking flow control valve (no gas flow).","l":1},{"t":"Failure of the electronic gas mixer module.","l":1},{"t":"Obstruction:","l":0},{"t":"Foreign body or dirt in the flowmeter tube.","l":1},{"t":"Bobbin stuck at the top of the flowmeter tube.","l":1},{"t":"Misleading reading:","l":0},{"t":"Bobbin stuck at the bottom, top, or inside of the flowmeter without obstructing flow.","l":1},{"t":"Bobbins:","l":1},{"t":"Worn.","l":2},{"t":"Distorted.","l":2},{"t":"Damaged.","l":2},{"t":"Wrong gas for the flowmeter in use.","l":1},{"t":"Interchange of parts during repair.","l":1},{"t":"Improper alignment of the flowmeter.","l":1},{"t":"Gas leak between electronic flow sensors and the total gas outflow (backup) flowmeter.","l":1},{"t":"Artifact created by high pressure in the breathing circuit.","l":1}],"typical":[{"t":"After installation or repair of the anesthesia workstation.","l":0},{"t":"Mechanical damage to the anesthesia workstation.","l":0},{"t":"When initially turning on the gas supply to the anesthesia workstation or flowmeter.","l":0},{"t":"Failure of the O<sub>2<\/sub>/N<sub>2<\/sub>O proportioning systems.","l":0},{"t":"Failure of gas mixer.","l":0}],"prevention":[{"t":"Provide appropriate routine maintenance of anesthesia workstation:","l":0},{"t":"Some flowmeters are sealed units and require no preventive maintenance.","l":1},{"t":"Turn off gas flows at flowmeters before turning off the gas supply to the anesthesia workstation.","l":0},{"t":"Check that gas flows are turned off at the flowmeters before connecting pipeline hoses to the machine or before opening cylinders on the anesthesia workstation.","l":0},{"t":"Conduct appropriate preuse check of the anesthesia workstation.","l":0},{"t":"Monitor FiO<sub>2<\/sub> throughout each case.","l":0},{"t":"Ensure backup flowmeters are functioning on anesthesia workstations with electronic flow sensors.","l":0}],"manifestations":[{"t":"<b>Hypoxemia<\/b> (if O<sub>2<\/sub> flowmeter leaks).","l":0},{"t":"Abnormal readings on respiratory gas analyzer:","l":0},{"t":"Different concentrations than those set at flowmeters.","l":1},{"t":"Presence of an unexpected gas in the inspired gases.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"CO<sub>2<\/sub>.","l":3},{"t":"N2, helium.","l":3},{"t":"Light anesthesia (if N<sub>2<\/sub>O flowmeter is obstructed or leaks).","l":0},{"t":"Discrepancy between gas flows measured by electronic flowmeters and total gas flow measured by backup flowmeter upstream of machine common gas outlet.","l":0}],"similar":[{"t":"Incorrect calibration of the respiratory gas analyzer.","l":0},{"t":"Operator error in adjusting the gas flow controls.","l":0},{"t":"O<sub>2<\/sub>/N<sub>2<\/sub>O pipeline crossover (see Event 65, Faulty Oxygen Supply).","l":0}],"management":[{"t":"Check FiO<sub>2<\/sub> and O<sub>2<\/sub> saturation:","l":0},{"t":"If FiO<sub>2<\/sub> is abnormally low, check for O<sub>2<\/sub> flowmeter leak or inappropriate flow through another flowmeter.","l":1},{"t":"Check that the appropriate O<sub>2<\/sub> concentration can be maintained with mechanical ventilation.","l":1},{"t":"If unable to ventilate manually or if O<sub>2<\/sub> saturation is low, switch to backup ventila<b>tion system (e.g. self-inflating bag with a separate source of O<sub>2<\/sub>).<\/b>","l":1},{"t":"Call for help to assist in identifying and correcting the problem.","l":1},{"t":"If the FiO<sub>2<\/sub> is appropriate and the patient’s lungs can be mechanically ventilated, arrange to replace the anesthesia workstation:","l":0},{"t":"Have an alternative ventilation system ready.","l":1},{"t":"Monitor the FiO<sub>2<\/sub>, O<sub>2<\/sub> saturation, anesthetic gas concentrations, and airway pressures carefully.","l":1},{"t":"Check for a leak in the machine’s low-pressure circuit:","l":0},{"t":"Visually check each flowmeter bobbin for free rotation and for appropriate rise and fall with changes in gas flow.","l":1},{"t":"If there is any question about the anesthesia workstation and its operating condition, withdraw it from service <b>immediately<\/b> and have it tested and repaired by a qualified technician.","l":1}],"complications":[{"t":"Hypoxemia.","l":0}],"reading":[{"t":"1. Eisenkraft JB. The anesthesia machine and workstation. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 25-63."},{"t":"2. Eng TS, Durieux ME. Case report: automated machine checkout leaves an internal gas leak undetected: the need for complete checkout procedures. Anesth Analg 2012;114:144-6."}]}},{"id":67,"title":"Intravenous Line Failure","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"An intravenous line failure is a previously functioning IV line that fails for any reason.","l":0}],"etiology":[{"t":"Obstruction of the IV catheter or tubing:","l":0},{"t":"Stopcock turned in the wrong direction.","l":1},{"t":"Roller clamp on the IV tubing closed.","l":1},{"t":"IV tubing taped so that it can kink.","l":1},{"t":"Precipitation of incompatible drugs in the IV tubing.","l":1},{"t":"Tip of the IV catheter up against a valve in the vein.","l":1},{"t":"Thrombus in IV catheter or IV tubing and filters.","l":1},{"t":"Disconnection of, or leak from, the IV catheter or tubing.","l":0},{"t":"Migration of the IV catheter outside the vein.","l":0},{"t":"External compression of the vein at a site between the IV insertion and the heart:","l":0},{"t":"Because of limb position.","l":1},{"t":"Because of surgical compression on the arm.","l":1},{"t":"BP cuff left in venous stasis mode.","l":1},{"t":"Tourniquet left in place on the limb.","l":1}],"typical":[{"t":"IV catheter was inserted prior to coming to OR.","l":0},{"t":"After repositioning the patient:","l":0},{"t":"From one bed or table to another, e.g. turning to the prone position.","l":1},{"t":"On the operating table.","l":1},{"t":"Rotating the operating table relative to the anesthesia workstation.","l":1},{"t":"During induction of anesthesia:","l":0},{"t":"Failure to turn stopcocks after administering drugs.","l":1},{"t":"When large amounts of fluid are infused through a small vein.","l":0},{"t":"After a difficult IV placement.","l":0},{"t":"When using an unfamiliar IV administration set.","l":0}],"prevention":[{"t":"Carefully assess IV catheters placed by other personnel:","l":0},{"t":"Determine how well the IV runs.","l":1},{"t":"Look for signs of erythema or infiltration.","l":1},{"t":"Observe for pain if IV is forcibly flushed or on injection of a test dose of induction agent.","l":1},{"t":"Check all IV lines after placement and after repositioning the patient.","l":0},{"t":"Use Luer Lock IV connectors.","l":0},{"t":"Ensure that all IV connections are tight.","l":0},{"t":"Secure the IV catheter to the patient.","l":0}],"manifestations":[{"t":"Obstruction to flow or external compression of the vein:","l":0},{"t":"IV infusion stops running.","l":1},{"t":"High resistance to injection or forcible flush.","l":1},{"t":"No blood return when the tubing is open to the atmosphere below the level of the heart.","l":1},{"t":"Disconnection:","l":0},{"t":"IV infusion runs excessively fast.","l":1},{"t":"Unusually low resistance to injection.","l":1},{"t":"A pool of fluid or blood accumulates on the mattress cover or on the floor.","l":1},{"t":"SC migration of the IV catheter:","l":0},{"t":"Hematoma, swelling, or pain at the IV site or on injection through the IV.","l":1},{"t":"Lack of patient response to drug or fluid administration.","l":0}],"similar":[{"t":"Irrigation fluid or blood from the wound on the surgical drapes or pooling on the floor.","l":0},{"t":"Excessively small-gauge IV catheter or connecting tubing.","l":0}],"management":[{"t":"If the IV infusion stops:","l":0},{"t":"Check for a high resistance to the injection of IV fluid.","l":1},{"t":"Trace the IV from the solution bag to the catheter hub:","l":1},{"t":"Check that all stopcocks and roller clamps are open.","l":2},{"t":"Check for kinks in the IV catheter and IV tubing.","l":2},{"t":"Look for surgical clamps or surgical retractors that may be obstructing the IV tubing.","l":2},{"t":"Inspect the IV catheter insertion site for signs of extravasation.","l":1},{"t":"Check for external compression of extremity:","l":1},{"t":"Check for a BP cuff that may not have fully deflated.","l":2},{"t":"Check for compression of the arm by a surgical team member or a surgical retractor attached to the side of the OR table.","l":2},{"t":"Check for tourniquet left in place.","l":2},{"t":"If using TIVA and the IV fails, ensure anesthesia and amnesia with inhaled agents until IV problem is solved.","l":1},{"t":"If the cause cannot be found or cannot be alleviated, insert a new IV line:","l":1},{"t":"If access is limited and the need is urgent, ask the surgeons whether they have direct access to a vein in the surgical field.","l":2},{"t":"If there is suspicion of a disconnection of the IV line:","l":0},{"t":"Trace the IV tubing to exclude disconnection:","l":1},{"t":"Check that stopcocks are in the correct position.","l":2},{"t":"Check that all connections are tight.","l":2},{"t":"Check that the IV catheter is still in the patient.","l":2},{"t":"If a disconnection has occurred, reconnect or replace the appropriate components:","l":0},{"t":"Decontaminate connectors as thoroughly as possible with alcohol or other disinfectant.","l":1},{"t":"If no disconnection is found and there is pooling of blood on the drapes or floor, rule out the surgical site as the source.","l":0}],"complications":[{"t":"Hypovolemia.","l":0},{"t":"Venous air embolism.","l":0},{"t":"Local tissue necrosis, ulceration, or compartment syndrome due to:","l":0},{"t":"Extravasation of vasoactive medications.","l":1},{"t":"Large volumes of fluid.","l":1},{"t":"Failure to respond to IV drug’s anticipated effects.","l":0},{"t":"Light anesthesia.","l":0},{"t":"Patient movement; inadequate relaxation during infusion of neuromuscular-blocking drug.","l":0},{"t":"Awareness.","l":0}]}},{"id":68,"title":"Loss of Pipeline Oxygen","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"Loss of pipeline O<sub>2<\/sub> occurs when pipeline O<sub>2<\/sub> pressure drops to zero or below the operating threshold pressure of the anesthesia workstation.","l":0}],"etiology":[{"t":"Exhaustion of the hospital’s central O<sub>2<\/sub> storage supply.","l":0},{"t":"Rupture or obstruction of O<sub>2<\/sub> piping connecting the central O<sub>2<\/sub> storage to the OR.","l":0},{"t":"O<sub>2<\/sub> shutoff valve to the OR or zone turned off.","l":0},{"t":"Obstruction, disconnection, or rupture of the O<sub>2<\/sub> hose connecting the wall or ceiling outlet to the anesthesia workstation within the OR.","l":0},{"t":"Failure of O<sub>2<\/sub> regulator in anesthesia workstation.","l":0}],"typical":[{"t":"When pipeline system or central O<sub>2<\/sub> storage is under repair.","l":0},{"t":"During or following natural disasters that damage the central O<sub>2<\/sub> storage or delivery system or prevent refilling of the central supply:","l":0},{"t":"Electrical power, water, and vacuum may fail simultaneously.","l":1},{"t":"The building may suffer structural damage.","l":1},{"t":"After disconnecting the pipeline hose to the machine to check “fail-safe” system.","l":0},{"t":"When quick-connect hose couplers are used.","l":0},{"t":"During delivery of O<sub>2<\/sub> to the central storage supply tank.","l":0}],"prevention":[{"t":"Before beginning each case, conduct a thorough preuse check of the anesthesia workstation and O<sub>2<\/sub> supply system:","l":0},{"t":"Verify a normal pipeline pressure.","l":1},{"t":"Check that O<sub>2<\/sub> couplers and hoses are tightly connected.","l":1},{"t":"Check that backup O<sub>2<\/sub> tank(s) have &gt;1000 psig, and then close tank valve.","l":1},{"t":"Arrange for hospital engineering department to notify the anesthesia department and the OR when the O<sub>2<\/sub> delivery system requires service or modification.","l":0}],"manifestations":[{"t":"<i>Manifestations will vary depending on how quickly pressure is lost and the type of anesthesia machine in use.<\/i>","l":0},{"t":"Pipeline O<sub>2<\/sub> pressure gauge indicates a fall in line pressure.","l":0},{"t":"Low O<sub>2<\/sub> supply pressure alarm will sound when the threshold is reached.","l":0},{"t":"O<sub>2<\/sub> flow in flowmeter falls to zero (bobbin drops).","l":0},{"t":"O<sub>2<\/sub> flow in “virtual” electronic flow sensor shows zero flow.","l":0},{"t":"Flow of N<sub>2<\/sub>O falls to zero as long as the anesthesia workstation fail-safe system is operational.","l":0},{"t":"O<sub>2<\/sub> flush becomes inoperative.","l":0},{"t":"Bag or ventilator fails to fill completely.","l":0},{"t":"Loss of ventilator pneumatic drive.","l":0},{"t":"Hiss from leak or partial disconnection in O<sub>2<\/sub> couplers or hoses.","l":0},{"t":"Late signs:","l":0},{"t":"<b>Apnea<\/b> alarms on spirometer and capnograph.","l":1},{"t":"Decrease in FiO<sub>2<\/sub> as remaining O<sub>2<\/sub> in circuit is consumed.","l":1},{"t":"Signs of <b>hypoxemia<\/b> and <b>hypercarbia<\/b>.","l":1}],"similar":[{"t":"Major leak from the anesthesia breathing circuit (see Event 69, Major Leak in the Anesthesia Breathing Circuit).","l":0},{"t":"Isolated N<sub>2<\/sub>O failure.","l":0},{"t":"Failure of the O<sub>2<\/sub> flush valve.","l":0},{"t":"Failure of the O<sub>2<\/sub> flowmeter or gauge (see Event 66, Gas Flow Control Malfunction).","l":0}],"management":[{"t":"Verify loss of O<sub>2<\/sub> supply:","l":0},{"t":"Check pipeline pressure gauge.","l":1},{"t":"Check function of O<sub>2<\/sub> flush.","l":1},{"t":"Check O<sub>2<\/sub> flowmeter.","l":1},{"t":"Check O<sub>2<\/sub> analyzer for hypoxic gas mixture.","l":1},{"t":"Open O<sub>2<\/sub> tank on the anesthesia machine.","l":0},{"t":"If O<sub>2<\/sub> tank is empty:","l":0},{"t":"Obtain a replacement O<sub>2<\/sub> tank and additional O<sub>2<\/sub> tanks for backup.","l":1},{"t":"Close the breathing circuit pop-off valve (converts to closed circuit).","l":1},{"t":"Ventilate manually using reservoir bag with gas contained in circle system:","l":1},{"t":"Refill the volume of reservoir bag as necessary with your own breath.","l":2},{"t":"Switch to self-inflating bag or nonrebreathing circuit if a separate O<sub>2<\/sub> tank is available.","l":0},{"t":"Use self-inflating bag with room air, or mouth-to-ETT ventilation only if absolutely necessary.","l":0},{"t":"Switch to IV agents to maintain anesthesia if anesthesia workstation cannot be used.","l":0},{"t":"Notify surgeon of problem.","l":0},{"t":"Notify OR personnel and have them check other ORs for O<sub>2<\/sub> failure.","l":0},{"t":"If O<sub>2<\/sub> tank is full:","l":0},{"t":"Use manual ventilation to conserve O<sub>2<\/sub>, because O<sub>2<\/sub> is used to drive the bellows in pneumatic ventilators:","l":1},{"t":"On some workstations (e.g. GE Aisys) that have a supply of compressed air (pipeline or tank), if O<sub>2<\/sub> supply fails, ventilator drive gas source automatically switches to air and workstation will deliver air via its flowmeter to the common gas outlet and breathing circuit.","l":2},{"t":"Call for additional O<sub>2<\/sub> tanks as backups.","l":1},{"t":"Check hoses, couplers, anesthesia workstation, and in-room shutoff valve:","l":0},{"t":"Hoses may be kinked by the wheels of the anesthesia workstation or other equipment.","l":1},{"t":"Couplers may be partially disconnected.","l":1},{"t":"Notify biomedical engineering or machine service technician if there is a failure in an anesthesia workstation, hose, coupler, or in-room shutoff valve.","l":1},{"t":"If the failure is not isolated to a single anesthesia workstation hose, or coupler:","l":0},{"t":"Notify hospital engineering.","l":1},{"t":"<b>Do not<\/b> start elective cases until the problem has been resolved.","l":1}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Hypercarbia.","l":0},{"t":"Light anesthesia, patient recall of intraoperative events.","l":0}],"reading":[{"t":"1. Schumacher SD, Brockwell RC, Andrews JJ, Ogles D. Bulk liquid oxygen supply failure. Anesthesiology 2004;100:186-9."},{"t":"2. Malayaman SN, Mychaskiw G, Ehrenwerth J. Medical gases: storage and supply. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 3-24."},{"t":"3. Lorraway PG, Salvoldelli GL, Joo HS, et al. Management of simulated oxygen supply failure: is there a gap in the curriculum? Anesth Analg 2006;102:865-7."},{"t":"4. Eisenkraft JB. The anesthesia machine and workstation. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 25-63."}]}},{"id":69,"title":"Major Leak in the Anesthesia Breathing Circuit","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"A major leak has occurred when there is a significant loss of gas from the anesthesia workstation or breathing circuit.","l":0}],"etiology":[{"t":"Ventilator/bag selector switch or pop-off valve in the wrong position for positive pressure ventilation.","l":0},{"t":"Leak in the anesthesia breathing circuit:","l":0},{"t":"Disconnection of any component of the breathing circuit.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"ETT disconnect.","l":3},{"t":"Gas sampling line open.","l":3},{"t":"Structural failure of, or defect in, an anesthesia breathing circuit.","l":1},{"t":"Leak in or around the ETT:","l":0},{"t":"ETT not in the trachea.","l":1},{"t":"ETT cuff does not seal the trachea.","l":1},{"t":"Hole or laceration in the ETT itself or in the ETT cuff.","l":1},{"t":"Placement of a NGT into the trachea.","l":1},{"t":"Leak in the low-pressure system of the anesthesia workstation:","l":0},{"t":"Component failure.","l":1},{"t":"Disconnection.","l":1},{"t":"Leak from the lungs:","l":0},{"t":"Pneumothorax.","l":1},{"t":"Bronchopleural-cutaneous fistula.","l":1}],"typical":[{"t":"When the patient’s position is changed:","l":0},{"t":"Moving the operating table relative to the anesthesia workstation.","l":1},{"t":"Moving the patient from one bed or table to another.","l":1},{"t":"During manipulation of the head and neck.","l":1},{"t":"When the airway is shared with the surgeon.","l":1},{"t":"After changing components of the anesthesia breathing circuit.","l":0},{"t":"When first initiating positive pressure ventilation.","l":0},{"t":"After a difficult endotracheal intubation or the use of Magill forceps to guide the ETT.","l":0},{"t":"After the common gas outlet has been disconnected to provide a source of:","l":0},{"t":"O<sub>2<\/sub> for a face mask or nasal cannula.","l":1},{"t":"Use of an auxiliary common gas outlet.","l":1},{"t":"After service of the anesthesia workstation.","l":0},{"t":"After the CO<sub>2<\/sub> absorbent has been changed.","l":0}],"prevention":[{"t":"Perform a thorough preuse check of the anesthesia workstation and breathing circuit:","l":0},{"t":"Perform a positive-pressure leak test of the anesthesia breathing circuit:","l":1},{"t":"Repeat the test after any component of the breathing circuit has been changed.","l":2},{"t":"Perform a low-pressure system leak test on the anesthesia workstation and ventilator:","l":1},{"t":"Turn on any vaporizer and flowmeter that may be used during anesthesia.","l":2},{"t":"Test the integrity of the ETT cuff for leaks.","l":1},{"t":"Following endotracheal intubation, inflate the ETT cuff to minimal occlusion volume and check carefully for leaks around the cuff.","l":0},{"t":"Check again for leaks around the cuff and for changes in the position of the ETT after any movement of the patient or the ETT.","l":0},{"t":"Check the position of the ventilator/bag selector switch and pop-off valve before initiating mechanical ventilation.","l":0},{"t":"Have an appropriate range of ETT sizes available.","l":0}],"manifestations":[{"t":"During spontaneous ventilation:","l":0},{"t":"An abnormally high fresh gas flow is required to fill the reservoir bag between each breath.","l":1},{"t":"Signs of light anesthesia:","l":1},{"t":"<b>Tachycardia<\/b>.","l":2},{"t":"<b>Hypertension<\/b>.","l":2},{"t":"Movement.","l":2},{"t":"Strong odor of volatile anesthetic agent.","l":1},{"t":"Capnograph may appear abnormal.","l":1},{"t":"During positive pressure ventilation:","l":0},{"t":"Leaking gas may be heard.","l":1},{"t":"No breath sounds or abnormal breath sounds heard through the esophageal or precordial stethoscope.","l":1},{"t":"Decreased or zero PIP.","l":1},{"t":"Decreased or zero expiratory gas flow measured by a spirometer in the expiratory limb of the anesthesia breathing circuit:","l":1},{"t":"Expired volume will be significantly less than inspired volume.","l":2},{"t":"Little or no ET CO<sub>2<\/sub>.","l":1},{"t":"Patient’s chest does not rise with inspiration.","l":1},{"t":"Ventilator bellows either does not refill at an appropriate rate during exhalation or collapses (only for a bellows that normally ascends during exhalation):","l":1},{"t":"Abnormally high fresh gas flow required to prevent bellows from collapsing.","l":2},{"t":"Alteration of tone of the ventilator if the bellows empties completely and is compressed against the bottom of the housing.","l":2},{"t":"ETT may be visualized outside the trachea.","l":1}],"similar":[{"t":"Low fresh gas flow in the presence of a small leak from the anesthesia breathing circuit.","l":0},{"t":"Unplanned extubation (see Event 37, Unplanned Extubation).","l":0},{"t":"Failure of the ventilator or bellows to operate correctly (see Event 71, Ventilator Failure).","l":0},{"t":"Tracheobronchial gas leak during thoracic surgery (see Event 35, Pneumothorax).","l":0}],"management":[{"t":"Maintain adequate ventilation and oxygenation of the patient at all times.","l":0},{"t":"Switch to an alternative system for ventilation (e.g. self-inflating bag or nonre<b>breathing circuit) and call for help early if the leak cannot be found and resolved quickly.<\/b>","l":0},{"t":"<i>During Spontaneous Ventilation:<\/i>","l":0,"n":1},{"t":"Close the pop-off valve.","l":0},{"t":"Increase the fresh gas flow into the circuit:","l":0},{"t":"The reservoir bag should fill.","l":1},{"t":"If the reservoir bag does not fill:","l":0},{"t":"Activate the O<sub>2<\/sub> flush.","l":1},{"t":"A major leak should become apparent.","l":1},{"t":"Check for and tighten loose connections.","l":1},{"t":"Switch to an alternative circuit (e.g. nonrebreathing circuit) if the leak cannot be identified or corrected quickly.","l":1},{"t":"<i>During Positive Pressure Ventilation:<\/i>","l":0,"n":1},{"t":"Increase the fresh gas flow into the anesthesia breathing circuit:","l":0},{"t":"If the leak can be compensated for, continue positive pressure ventilation while determining the cause of the leak.","l":1},{"t":"Switch to the reservoir bag, close the pop-off valve, and attempt to fill the anesthesia breathing circuit by activating the O<sub>2<\/sub> flush:","l":0},{"t":"If the reservoir bag fills, ventilate the patient’s lungs:","l":1},{"t":"Check the compliance of the reservoir bag and look for the rise of the chest on inspiration.","l":2},{"t":"Listen for breath sounds and look for a CO<sub>2<\/sub> waveform on the capnograph.","l":2},{"t":"If manual ventilation is possible:","l":2},{"t":"Continue manual ventilation.","l":3},{"t":"Call for help to identify the leak, which is probably in the ventilator circuit.","l":3},{"t":"If the reservoir bag fills but there is still a leak with positive pressure ventilation:","l":1},{"t":"Ventilate with a self-inflating bag.","l":2},{"t":"Call for help.","l":2},{"t":"Listen for a leak around the ETT during inspiration.","l":2},{"t":"If there is a leak, add air to the ETT cuff to determine whether the leak can be stopped.","l":2},{"t":"If there is still a leak:","l":2},{"t":"Assess the position and integrity of the ETT (see Event 37, Unplanned Extubation):","l":3},{"t":"Perform direct or videolaryngoscopy.","l":4},{"t":"Consider removing the ETT, ventilating the patient’s lungs by mask with the alternative ventilation system, and replacing the ETT.","l":3},{"t":"Perform high pressure leak test of the anesthesia breathing circuit by occluding the Y piece and activating the O<sub>2<\/sub> flush:","l":2},{"t":"If the breathing circuit can be pressurized and maintain pressure, the problem is either in the ETT, in the ETT cuff, or in the patient.","l":3},{"t":"If the leak persists after all mechanical components have been checked, evaluate the patient for a possible pneumothorax or bronchopleural-cutaneous fistula:","l":2},{"t":"A bronchopleural fistula may only be apparent after chest tubes are connected to suction.","l":3},{"t":"If the reservoir bag does not fill when the O<sub>2<\/sub> flush is activated:","l":1},{"t":"Scan for an obvious disconnection:","l":2},{"t":"The connection of the anesthesia breathing circuit to the ETT.","l":3},{"t":"The connection of the anesthesia breathing circuit to the common gas outlet.","l":3},{"t":"Sites at which external devices such as spirometers and respiratory gas analyzers are connected to the anesthesia breathing circuit.","l":3},{"t":"Use a self-inflating bag to ventilate the patient’s lungs.","l":2},{"t":"Call for help to identify the leak.","l":2},{"t":"Check the O<sub>2<\/sub> pipeline pressure and the function of the O<sub>2<\/sub> flowmeter:","l":2},{"t":"If the pipeline pressure is low, open the O<sub>2<\/sub> cylinder on the anesthesia workstation.","l":3},{"t":"Check for a vaporizer leak:","l":2},{"t":"Feel for a gas leak around the vaporizer mountings.","l":3},{"t":"Turn off the vaporizer and check for a persistent leak.","l":3},{"t":"If all the previous are normal, consider an internal malfunction in the anesthesia workstation:","l":2},{"t":"Continue to ventilate the patient using the self-inflating bag.","l":3},{"t":"Replace the anesthesia workstation.","l":3},{"t":"Maintain anesthesia with IV agents.","l":0},{"t":"Inform biomedical engineering of the failure and have the equipment inspected by a biomedical engineer.","l":0}],"complications":[{"t":"Hypoventilation.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Hypercarbia.","l":0},{"t":"Accidental extubation.","l":0}],"reading":[{"t":"1. Raphael DT, Weller RS, Doran DJ. A response algorithm for the low pressure alarm condition. Anesth Analg 1988;67:876-83."},{"t":"2. Seif DM, Olympio MA. Expiratory limb ventilation during unique failure of the anesthesia machine breathing circuit. Anesthesiology 2013;118:751-3."},{"t":"3. Gravenstein D, Wikhu H, Liem EB, Tilman S, Lampotang S. Aestiva ventilation mode selector switch failures. Anesth Analg 2007;104:860-2."}]}},{"id":70,"title":"Pop-Off Valve Failure","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"A pop-off (adjustable pressure limiting [APL]) valve failure in the anesthesia breathing circuit.","l":0}],"etiology":[{"t":"Pop-off valve inappropriately left open or closed by the user.","l":0},{"t":"Failure of the pop-off valve control knob.","l":0},{"t":"Internal failure in the pop-off valve mechanism.","l":0},{"t":"Failure of the ventilator pressure relief valve:","l":0},{"t":"Internal “pop-off ” valve of the ventilator.","l":1}],"typical":[{"t":"After switching from manual ventilation to mechanical ventilation or vice versa (user error).","l":0},{"t":"Mechanical failure of the pop-off valve.","l":0},{"t":"After service of breathing circuit components or the ventilator.","l":0}],"prevention":[{"t":"Conduct a thorough preuse check of the anesthesia breathing circuit:","l":0},{"t":"Set the ventilator/bag selector switch to BAG and occlude the breathing circuit at the Y piece.","l":1},{"t":"Close the circuit pop-off valve, and pressurize the anesthesia circuit.","l":1},{"t":"Ensure that pressure builds up in the circuit:","l":1},{"t":"This discloses a pop-off valve that is stuck open.","l":2},{"t":"Open the circuit pop-off valve fully and ensure that there is a decrease in circuit pressure to 1 to 2 cm H<sub>2<\/sub>O (this checks for a circuit pop-off valve that is stuck closed or a failure of the control knob).","l":1},{"t":"Increase the fresh gas flow rate to <b>10 L/min<\/b> and check for any increase in circuit pressure (an increase in pressure would indicate either a faulty pressure gauge or a partially closed circuit pop-off valve).","l":1},{"t":"Set the ventilator/bag selector switch to VENTILATOR, maintain the fresh gas flow at <b>10 L/min<\/b>, and ventilate a test lung (reservoir bag).","l":1},{"t":"Check for any increase in circuit pressure during the expiratory phase:","l":1},{"t":"An increase in pressure indicates either a faulty pressure gauge or a closed ventilator pressure relief valve.","l":2},{"t":"Open the pop-off valve and observe the anesthesia circuit while preoxygenating the patient and maintaining a tight seal between the mask and the patient’s face:","l":0},{"t":"Ensure that inspiratory and expiratory unidirectional valves move appropriately and that circuit pressure does not rise to more than 1 to 2 cm H<sub>2<\/sub>O.","l":1}],"manifestations":[{"t":"<i>Circuit Pop-Off Valve Stuck Closed or Inappropriately Set to CLOSED.<\/i>","l":0},{"t":"If the ventilator/bag selector switch is on BAG (the relevant pop-off valve is in the breathing circuit):","l":0},{"t":"Progressive increase in PIP and PEEP:","l":1},{"t":"The increase in PIP may plateau at a high value owing to gas escaping through a high-pressure relief mechanism in the pop-off valve.","l":2},{"t":"This occurs at 70 to 80 cm H<sub>2<\/sub>O.","l":2},{"t":"The sustained pressure alarm will sound if set appropriately.","l":2},{"t":"Increasing distention of the reservoir bag.","l":2},{"t":"The awake patient will complain of difficulty breathing.","l":2},{"t":"<b>Hypotension<\/b> secondary to increased intrathoracic pressure and impaired venous return:","l":1},{"t":"Lack of response to injected vasoactive medications because drugs may be slow to reach the arterial circulation secondary to decreased venous return.","l":2},{"t":"Progressive difficulty in ventilating the patient’s lungs due to apparent low total thoracic compliance, i.e. “stiff lungs”.","l":1},{"t":"Decreased or absent ET CO<sub>2<\/sub>.","l":1},{"t":"Decreased O<sub>2<\/sub> saturation.","l":1},{"t":"Pulmonary barotrauma:","l":1},{"t":"Pneumothorax.","l":2},{"t":"Pneumomediastinum.","l":2},{"t":"SC emphysema.","l":2},{"t":"If the ventilator/bag selector switch is on VENTILATOR (the relevant pressure relief valve is internal to the ventilator):","l":0},{"t":"The same manifestations listed previously, PLUS:","l":1},{"t":"Unusual sound of the pneumatic ventilator as it struggles to work against the increased circuit pressure.","l":2},{"t":"Decreased tidal volume:","l":2},{"t":"The performance of most ventilators degrades as the circuit pressure increases.","l":3},{"t":"<i>Circuit or Ventilator Pop-Off Valve Stuck Open or Inappropriately Set to OPEN.<\/i>","l":0},{"t":"If the patient is breathing spontaneously, the reservoir bag may fail to fill adequately.","l":0},{"t":"If the patient’s lungs are being mechanically ventilated:","l":0},{"t":"There will be a major leak during inspiration.","l":1},{"t":"The ventilator standing bellows will fall or the reservoir bag will collapse, making ventilation impossible.","l":1},{"t":"Tidal volume and minute ventilation will decrease.","l":1}],"similar":[{"t":"<i>Closed Pop-Off Valve.<\/i>","l":0},{"t":"Expiratory valve stuck in the closed position (see Event 59, Circle System Expiratory Valve Stuck Closed).","l":0},{"t":"WAGD system malfunction (see Event 73, Waste Anesthesia Gas Disposal System Malfunction).","l":0},{"t":"Obstruction of the expiratory limb of the anesthesia circuit.","l":0},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"<i>Open Pop-Off Valve.<\/i>","l":0},{"t":"Major leak from other circuit component (see Event 69, Major Leak in the Anesthesia Breathing Circuit).","l":0}],"management":[{"t":"<i>If Pop-Off Valve Stuck Closed or Inappropriately Set to CLOSED:<\/i>","l":0,"n":1},{"t":"Check that the pop-off valve and selector switch are set appropriately for the desired mode of ventilation.","l":0},{"t":"If the circuit pressure remains high, change the selector switch to its alternative setting (from BAG to VENTILATOR or vice versa).","l":0},{"t":"This may decrease pressure within the breathing circuit and assist in diagnosing the problem:","l":0},{"t":"Ventilate the patient’s lungs with an alternative ventilation system (e.g. self-inflating bag or nonrebreather system) <b>as soon as possible<\/b>.","l":1},{"t":"Call for help to repair or replace defective components in the circuit or ventilator:","l":1},{"t":"This may require replacement of the anesthesia workstation.","l":2},{"t":"<i>If Pop-Off Valve Stuck Open or Inappropriately Set to OPEN:<\/i>","l":0,"n":1},{"t":"Check that the pop-off and selector switch are set appropriately for the desired mode of ventilation.","l":0},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Use an alternative ventilation system if controlled ventilation is in use and there is a large, uncorrectable leak through the circuit pop-off valve.","l":1},{"t":"Call for help to repair or replace defective components in circuit or ventilator:","l":1},{"t":"This may require replacement of the anesthesia workstation.","l":2},{"t":"Maintain anesthesia with IV medications.","l":0}],"complications":[{"t":"Hypotension.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Hypercarbia.","l":0},{"t":"Pulmonary barotrauma:","l":0},{"t":"Pneumothorax.","l":1},{"t":"Gas embolism.","l":1},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Walker SG, Smith TC, Sheplock G, Acquaviva MA, Horn N. Breathing circuits. In: Ehrenwerth J, Eisenkraft JB, Berry JM, editors. Anesthesia equipment: principles and applications. 2nd ed. Philadelphia: Saunders; 2013. p. 95-124."},{"t":"2. Oprea AD, Ehrenwerth J, Barash PG. A case of adjustable pressure-limiting (APL) valve failure. J Clin Anesth 2011;23:58-60."},{"t":"3. Eisenkraft JB. Potential for barotrauma or hypoventilation with the Drager AV-E ventilator. J Clin Anesth 1989;1:452-6."},{"t":"4. Vijayakumar A, Saxena DK, Sivan Pillay A, Darsow R. Massive leak during manual ventilation: adjustable pressure limiting valve malfunction not detected by pre-anesthetic checkout. Anesth Analg 2010;111:579-80."},{"t":"5. Hennenfent S, Suslowicz B. Circuit leak from capnograph sampling line lodged under adjustable pressure limiting valve. Anesth Analg 2010;111:578."}]}},{"id":71,"title":"Ventilator Failure","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"A ventilator failure is the inability of the ventilator to deliver the required inspired gas volume to the patient.","l":0}],"etiology":[{"t":"Circuit disconnect or misconnect.","l":0},{"t":"Stuck bellows.","l":0},{"t":"Improper seal between ventilator housing and bellows.","l":0},{"t":"Improper assembly of ventilator or connecting hoses.","l":0},{"t":"Failure of fresh gas flow to the anesthesia circuit and ventilator.","l":0},{"t":"Electrical power failure of an electrically controlled ventilator.","l":0},{"t":"Ventilator pressure relief valve stuck open or missing.","l":0},{"t":"Lung compliance outside the performance envelope of the ventilator.","l":0},{"t":"Failure of fresh gas decoupling valve.","l":0}],"typical":[{"t":"When the patient’s position is changed, causing a disconnect.","l":0},{"t":"Bag/ventilator selector switch i
