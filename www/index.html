 connected to a high-pressure gas source.","l":0}],"prevention":[{"t":"<b>Avoid<\/b> positioning the patient such that the surgical field or <b>CVP<\/b> cannulation site is above the level of the heart if possible.","l":0},{"t":"Mechanically ventilate the patient when the surgical field <b>must<\/b> be above the level of the heart.","l":0},{"t":"Place the patient in Trendelenburg during placement or removal of a <b>CVP<\/b>:","l":0},{"t":"Maintain occlusive pressure on <b>CVP<\/b> decannulation sites for 5 minutes after bleeding has stopped, then place an occlusive dressing over the site.","l":1},{"t":"Remove all air from IV solution bags and lines (e.g. CPB cannulae, rapid infuser systems) prior to pressurized infusion.","l":0},{"t":"When there is a risk of VGE, maintain a high <b>CVP<\/b> with increased administration of IV fluids.","l":0},{"t":"<b>Avoid<\/b> administering N<sub>2<\/sub>O to patients at risk of VGE.","l":0},{"t":"Consider placement of multiorifice <b>CVP<\/b> catheter in patients at high risk of VGE.","l":0}],"manifestations":[{"t":"<i>The manifestations are determined by the volume of gas embolized in relation to the size of the patient, the rate at which embolization occurs, and the rate at which the gas dissolves in the blood. Detection depends on the monitors in place at the time of the embolic event.<\/i>","l":0},{"t":"In the awake patient:","l":0},{"t":"Coughing, dyspnea, <b>bronchospasm<\/b>, <b>hypotension<\/b>, altered mental status, and circulatory collapse.","l":1},{"t":"In the awake or anesthetized patient, manifestations will depend on the monitoring in place at the time of the event:","l":0},{"t":"ECG changes:","l":1},{"t":"Tachyarrhythmias are common.","l":2},{"t":"Right heart strain pattern.","l":2},{"t":"ST-T wave changes.","l":2},{"t":"Hemodynamic changes:","l":1},{"t":"Systemic <b>hypotension<\/b> secondary to decreased CO.","l":2},{"t":"Increase in CVP due to:","l":2},{"t":"Mechanical obstruction.","l":3},{"t":"Right heart failure.","l":3},{"t":"Increase in PA pressure due to release of vasoactive inflammatory mediators.","l":2},{"t":"A loud, coarse, continuous “mill wheel” murmur on auscultation.","l":2},{"t":"Pulmonary signs and symptoms:","l":1},{"t":"Crackles (rales) and <b>wheezing<\/b>.","l":2},{"t":"Decreased ET CO<sub>2<\/sub>.","l":2},{"t":"Increased ET N2; rarely measured (requires mass spectrometer or Raman scattering techniques).","l":2},{"t":"Decreased arterial O<sub>2<\/sub> saturation.","l":2},{"t":"Central nervous system:","l":1},{"t":"EEG changes may be caused by different mechanisms:","l":2},{"t":"Cerebral hypoperfusion due to decreased CO.","l":3},{"t":"Paradoxical embolism to the cerebral circulation through a patent foramen ovale (PFO).","l":3},{"t":"TEE:","l":1},{"t":"Presence of air in cardiac chambers.","l":2},{"t":"Detects as little as 0.02 mL/kg air in right heart.","l":2},{"t":"Allows detection of intracardiac paradoxical embolism (most commonly due to a PFO).","l":2},{"t":"Precordial Doppler ultrasound:","l":1},{"t":"VGE changes character and intensity of emitted sound.","l":2},{"t":"Detects as little as 0.05 mL/kg of air in right heart.","l":2},{"t":"Presence of gas bubble in the aspirate from a multiorifice CVP catheter.","l":1},{"t":"More than one means of detection should be used in cases at high risk for VGE.","l":0}],"similar":[{"t":"Myocardial ischemia (see Event 15, Acute Coronary Syndrome).","l":0},{"t":"Brainstem retraction and ischemia.","l":0},{"t":"Nongas PE (see Event 21, Pulmonary Embolism and Event 81, Amniotic Fluid Embolism).","l":0},{"t":"Other cause of hypotension (see Event 9, Hypotension).","l":0},{"t":"Artifact on Doppler ultrasound device due to:","l":0},{"t":"Electrocautery.","l":1},{"t":"Rapid fluid infusion.","l":1},{"t":"Movement of the precordial probe.","l":1},{"t":"Entrainment of air into a respiratory gas analyzer.","l":0}],"management":[{"t":"Notify the surgeon <b>immediately<\/b> of a possible VGE:","l":0},{"t":"The surgeon should check for possible entry sites in the wound.","l":1},{"t":"The nurses should check surgical insufflation equipment.","l":1},{"t":"Turn off all pressurized gas sources.","l":1},{"t":"Call for help.","l":1},{"t":"<b>Confirm the diagnosis:<\/b>","l":0},{"t":"Check the ET CO<sub>2<\/sub> trend recording.","l":1},{"t":"Check the BP.","l":1},{"t":"Listen carefully to the precordial Doppler signal.","l":1},{"t":"Check TEE if in place.","l":1},{"t":"Listen for mill wheel murmur.","l":1},{"t":"Check PA pressures, if available.","l":1},{"t":"If multiorifice <b>CVP<\/b> catheter present, attempt to aspirate.","l":1},{"t":"Check the ET N2, if available:","l":1},{"t":"Inspect for air in the aspirate.","l":2},{"t":"VGE may still be present if no air is aspirated.","l":2},{"t":"If gas embolism is confirmed:","l":0},{"t":"Attempt to aspirate gas from multiorifice <b>CVP<\/b> catheter again.","l":1},{"t":"The surgeons should flood the surgical field with saline or pack the wound with saline-soaked sponges.","l":1},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub>.","l":1},{"t":"Provide Valsalva maneuver by manual ventilation to prevent further air from entering the heart and to reveal the vascular entry site to the surgeon.","l":1},{"t":"Infuse IV fluid rapidly.","l":1},{"t":"Use vasopressors and inotropes as needed to support the circulation (see Event 9, Hypotension).","l":1},{"t":"Reposition the patient, if feasible:","l":1},{"t":"First, tilt the operating table to lower the surgical site below the level of the heart.","l":2},{"t":"If possible, place patient in left-side-down position.","l":2},{"t":"Consider applying 5 cm H<sub>2<\/sub>O PEEP.","l":1},{"t":"If hemodynamic compromise is severe.","l":0},{"t":"Perform CPR if cardiac arrest occurs (see Event 2, Cardiac Arrest).","l":0},{"t":"Direct aspiration of air from the heart or great vessels via a thoracotomy may be necessary:","l":0},{"t":"Internal cardiac massage may be required.","l":1},{"t":"If VGE to cranial arterial system is suspected, consider emergency MRI and consider hyperbaric O<sub>2<\/sub> therapy if available.","l":0}],"complications":[{"t":"Hypotension.","l":0},{"t":"Myocardial ischemia or infarction.","l":0},{"t":"Stroke.","l":0},{"t":"Paradoxical gas embolism to the arterial circulation:","l":0},{"t":"PFO or other right-to-left shunt.","l":1},{"t":"Massive VGE crossing the pulmonary capillaries to the arterial circulation.","l":1},{"t":"Pulmonary edema.","l":0},{"t":"Wound contamination from repositioning.","l":0},{"t":"Complications of thoracotomy and CPR.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Archer DP, Pash MP, MacRae ME. Successful management of venous air embolism with inotropic support. Neuroanesth Intensive Care 2001;48:204-8."},{"t":"2. Bithal PK, Pandia MP, Dash HH, et al. Comparative incidence of venous air embolism and associated hypotension in adults and children operated for neurosurgery in the sitting position. Eur J Anaesthesiol 2004;21:517-22."},{"t":"3. Mirski MA, Lele AV, Fitzsimmons L, Young TJK. Diagnosis and treatment of vascular air embolism. Anesthesiology 2007;106:164-77."},{"t":"4. Muth CM, Shanck E. Gas embolism. N Engl J Med 2000;342:476-82."},{"t":"5. Schubert A, Deogaonkar A, Drummond JC. Precordial Doppler probe placement for optimal detection of venous air embolism during craniotomy. Anesth Analg 2006;102:1543-7."},{"t":"6. Van Hulst RA, Klein J, Lachmann B. Gas embolism: pathophysiology and treatment. Clin Physiol Funct Imaging 2003;23:237-46."}]}},{"id":25,"title":"Airway Burn","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"Airway burn is thermal or chemical injury to the mucosa of the airway between the mouth and the alveoli.","l":0}],"etiology":[{"t":"Inhalation of hot gases:","l":0},{"t":"From breathing circuit.","l":1},{"t":"Direct exposure to fire.","l":1},{"t":"Exposure to smoke or toxic gases.","l":1},{"t":"Ignition of the ETT during laser surgery.","l":0}],"typical":[{"t":"Patients with acute burns.","l":0},{"t":"Laser surgery in the pharynx, the larynx, or the tracheobronchial tree.","l":0},{"t":"Tracheostomy using electrocautery.","l":0},{"t":"Rupture of ETT cuff, allowing escape of oxidizer from the lungs to the upper airway.","l":0}],"prevention":[{"t":"Assess fire risk in EVERY case.","l":0},{"t":"Hospital laser committee is responsible for monitoring laser safety-related issues.","l":0},{"t":"Safety training for hospital personnel working with lasers.","l":0},{"t":"Protect the ETT during laser airway surgery:","l":0},{"t":"Use “laser-proof” ETT.","l":1},{"t":"Fill ETT cuff with saline colored with <b>methylene blue<\/b> to create a visible marker for cuff puncture.","l":1},{"t":"Maintain a low FiO<sub>2<\/sub> (less than <b>30%<\/b>) in air:","l":0},{"t":"If higher FiO<sub>2<\/sub> is required to maintain an acceptable O<sub>2<\/sub> saturation:","l":1},{"t":"Periodically oxygenate with a higher FiO<sub>2<\/sub>, then decrease below <b>30%<\/b> prior to recommencing with surgery:","l":2},{"t":"Coordinate this with surgeons.","l":3},{"t":"Allow a few minutes to wash out high FiO<sub>2<\/sub>.","l":3},{"t":"Consider aborting laser surgery if FiO<sub>2<\/sub> requirements are high.","l":1},{"t":"Use a cuffed ETT in surgery in and about the airway, e.g. tonsillectomy.","l":0},{"t":"Surgeon should suction oropharynx prior to using electrocautery in the airway.","l":0},{"t":"During tracheostomy, enter the trachea with scalpel or scissors.","l":0},{"t":"Have a clamp available to occlude the ETT in case of ETT fire.","l":0},{"t":"Protect patient from exposure to OR fire or smoke.","l":0}],"manifestations":[{"t":"Immediate manifestations:","l":0},{"t":"Laser-ignited ETT fire:","l":1},{"t":"Visible ignition or burning of the ETT.","l":2},{"t":"Smell of burning, smoke, flames in the surgical field.","l":2},{"t":"Fire may propagate into the breathing circuit.","l":2},{"t":"Later manifestations:","l":0},{"t":"Airway <b>edema<\/b> or airway rupture.","l":1},{"t":"Decreased O<sub>2<\/sub> saturation and PaO<sub>2<\/sub>.","l":1},{"t":"Decreased pulmonary compliance.","l":1},{"t":"Pulmonary <b>edema<\/b>.","l":1},{"t":"<b>Bronchospasm<\/b>.","l":1},{"t":"Lung injury/ARDS.","l":1},{"t":"Tracheal stenosis.","l":1}],"similar":[{"t":"Pulmonary edema from other causes (see Event 20, Pulmonary Edema).","l":0},{"t":"Lung injury from other causes.","l":0},{"t":"Pneumonia.","l":0},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"Partial airway obstruction.","l":0}],"management":[{"t":"<i>For laser-induced ETT fire:<\/i>","l":0,"n":1},{"t":"Stop the flow of O<sub>2<\/sub> to the ETT:","l":0},{"t":"Clamp the ETT <b>immediately<\/b>.","l":1},{"t":"Disconnect the patient from the breathing circuit.","l":1},{"t":"Pour saline or water into airway to extinguish burning material.","l":0},{"t":"<b>Extubate the trachea:<\/b>","l":0},{"t":"Ventilate with <b>100%<\/b> O<sub>2<\/sub> by bag valve mask.","l":1},{"t":"Reintubate the patient <b>as soon as possible<\/b>:","l":0},{"t":"Rapid development of airway edema may make later reintubation difficult:","l":1},{"t":"Consider use of tube exchanger and smaller ETT.","l":2},{"t":"If reintubation is not possible, proceed to either cricothyrotomy or tracheostomy.","l":1},{"t":"Provide supportive care and mechanical ventilation:","l":0},{"t":"Add PEEP as necessary to maintain oxygenation.","l":1},{"t":"Consider administering high-dose steroids:","l":1},{"t":"<b>Methylprednisolone<\/b> IV, <b>0.1 to 1 g<\/b>.","l":2},{"t":"Immediate consultation with an otolaryngologist or a thoracic surgeon to evaluate the extent of the airway burn:","l":0},{"t":"Fiberoptic bronchoscopy when the patient is stable.","l":1},{"t":"Impound any device thought to be defective for inspection by a biomedical engineer.","l":0}],"complications":[{"t":"Hypoxemia/hypercarbia.","l":0},{"t":"Inability to reintubate.","l":0},{"t":"Permanent pulmonary injury:","l":0},{"t":"Pulmonary fibrosis.","l":1},{"t":"Restrictive pulmonary disease.","l":1},{"t":"Tracheal stenosis.","l":0},{"t":"Pneumothorax.","l":0},{"t":"Pneumonia.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. APSF fire prevention algorithm. Anesthesia Patient Safety Foundation Newsletter, Winter 2012;26(3):43. &lt; http:// www.apsf.org/newsletters/pdf/winter_2012.pdf &gt; [accessed 22.08.13]."},{"t":"2. American Society of Anesthesiologists Task Force on Operating Room Fires. Practice advisory for the prevention and management of operating room fires. Anesthesiology 2013;118:1-12."},{"t":"3. Smith LP, Roy S. Operating room fires in otolaryngology: risk factors and prevention. Am J Otolaryngol 2011;32:109-14."},{"t":"4. Lai HC, Juang SE, Liu TJ, Ho WM. Fires of endotracheal tubes of three different materials during carbon dioxide laser surgery. Acta Anaesthesiol Sin 2002;40:47-51."}]}},{"id":26,"title":"Airway Rupture","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"Airway rupture includes traumatic perforation or disruption of any part of the airway.","l":0}],"etiology":[{"t":"Mechanical or thermal energy rupturing airway walls:","l":0},{"t":"Hyperextension of the neck combined with a direct blow to the unprotected trachea.","l":1},{"t":"Penetrating injury of the chest or neck.","l":1},{"t":"Erosion of the tracheobronchial wall by an ETT or tracheostomy cuff.","l":1},{"t":"Aberrant entry of tracheostomy tube, e.g. during placement of percutaneous tracheostomy.","l":1}],"typical":[{"t":"Following thoracic injury:","l":0},{"t":"Blunt trauma in presence of a closed glottis:","l":1},{"t":"Frequently no external evidence of injury.","l":2},{"t":"Penetrating injury of the chest or neck.","l":1},{"t":"During placement of ETT with videolaryngoscopy.","l":0},{"t":"During laser surgery to the airway.","l":0},{"t":"During or following thoracic surgery.","l":0},{"t":"Associated with the use of a double-lumen ETT.","l":0},{"t":"With nasal intubation or instrumentation.","l":0},{"t":"Intubation of the airway with any rigid object:","l":0},{"t":"During rigid or flexible bronchoscopy.","l":1},{"t":"During placement of a metal ETT for laser surgery.","l":1},{"t":"Stiff airway exchange catheters, e.g. bougie.","l":1},{"t":"During attempts at jet ventilation.","l":0}],"prevention":[{"t":"<b>Avoid<\/b> excessive force during instrumentation of the airway.","l":0},{"t":"<b>Avoid<\/b> blind passage of ETT through oropharynx during videolaryngoscopy.","l":0},{"t":"Prewarm nasal ETT prior to placement:","l":0},{"t":"Use nasal spray to vasoconstrict nasal mucosa:","l":1},{"t":"<b>Phenylephrine 1%<\/b> spray.","l":2},{"t":"Oxymetazoline <b>0.05%<\/b> spray.","l":2},{"t":"Cocaine <b>4%<\/b> topical solution.","l":2},{"t":"Use lubricated nasopharyngeal airways to dilate nasal passage prior to placing ETT.","l":1},{"t":"<b>Do not<\/b> allow the stylet to protrude beyond the tip of the ETT during intubation.","l":0},{"t":"<b>Avoid<\/b> overinflation of the ETT cuff or the endobronchial cuff of a double-lumen ETT:","l":0},{"t":"Deflate endobronchial cuff on double-lumen ETT when lung separation is no longer required.","l":1},{"t":"Intermittently check the occlusion pressure of the ETT cuff(s):","l":0},{"t":"Especially in presence of N<sub>2<\/sub>O.","l":1},{"t":"Maintain full relaxation of the patient during endoscopy, rigid bronchoscopy, and laser surgery of the airway.","l":0},{"t":"Assess depth of insertion of airway exchange catheters to <b>avoid<\/b> insertion beneath the carina.","l":0}],"manifestations":[{"t":"<i>Lacerations or partial rupture of the airway may easily be missed until some other event or a late complication demonstrates its presence (e.g. bronchial stenosis).<\/i>","l":0},{"t":"Rupture of nasopharynx:","l":0},{"t":"Inability to pass ETT easily through the nasal cavity.","l":1},{"t":"ETT not visible in the pharynx on direct laryngoscopy.","l":1},{"t":"Blood or bloody secretions from nasopharynx or ETT.","l":1},{"t":"Inability to ventilate through nasal ETT passed blindly.","l":1},{"t":"Nasopharyngeal swelling and visible hematoma.","l":1},{"t":"Rupture of tracheobronchial tree:","l":0},{"t":"Respiratory distress:","l":1},{"t":"Dyspnea.","l":2},{"t":"<b>Hypoxemia<\/b>.","l":2},{"t":"<b>Cyanosis<\/b>.","l":2},{"t":"Hemoptysis.","l":2},{"t":"SC emphysema.","l":1},{"t":"Mediastinal emphysema.","l":1},{"t":"Pneumothorax.","l":1},{"t":"CXR may be diagnostic:","l":1},{"t":"Laryngeal or tracheal injuries are frequently associated with:","l":2},{"t":"Visible cervical.","l":3},{"t":"Mediastinal, SC air without accompanying pneumothorax.","l":3},{"t":"Bronchial injury is associated with:","l":2},{"t":"Pneumomediastinum.","l":3},{"t":"With pneumothorax.","l":3},{"t":"Possibly with overlying rib fractures.","l":3},{"t":"Rarely, CXR may show “fallen lung sign,” in which the transected bronchus allows the lung to fall away from the mediastinum, not toward the mediastinum as in a pneumothorax.","l":2},{"t":"Air leak from the site of a penetrating injury to the chest or neck.","l":1},{"t":"Persistent air leak after placement of a chest tube is suggestive of bronchial rupture or bronchopleural fistula.","l":1},{"t":"Difficulty in establishing ventilation after intubation:","l":1},{"t":"High PIP.","l":2},{"t":"Decreased breath sounds.","l":2}],"similar":[{"t":"Other causes of airway obstruction.","l":0},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"High PIP (see Event 7, High Peak Inspiratory Pressure).","l":0},{"t":"Hemoptysis (see Event 34, Massive Hemoptysis).","l":0},{"t":"SC air.","l":0}],"management":[{"t":"<i>Nasopharyngeal rupture:<\/i>","l":0,"n":1},{"t":"Orally intubate the trachea by direct laryngoscopy or videolaryngoscopy before remov<b>ing nasal ETT:<\/b>","l":0},{"t":"If the ETT is removed first, severe hemorrhage may occur and make intubation difficult or impossible.","l":1},{"t":"Obtain otolaryngology consult.","l":1},{"t":"<i>Tracheobronchial tree rupture:<\/i>","l":0,"n":1},{"t":"<i>Suspect airway rupture in major trauma cases with SC or mediastinal air, a pneumothorax, or other major abdominal, cervical, or thoracic injuries.<\/i>","l":0,"n":1},{"t":"Ensure adequate oxygenation and ventilation.","l":0},{"t":"If severe respiratory distress is present, manage the airway FIRST and assess site of rupture SECOND:","l":0},{"t":"Intubate the trachea via direct laryngoscopy or videolaryngoscopy.","l":1},{"t":"Carefully ventilate with <b>100%<\/b> FiO<sub>2<\/sub>:","l":1},{"t":"Assess ET CO<sub>2<\/sub> and bilateral chest expansion.","l":2},{"t":"If difficult airway is suspected (see Event 3, Difficult Tracheal Intubation):","l":1},{"t":"Prepare for awake fiberoptic intubation.","l":2},{"t":"Prepare for emergency surgical airway:","l":2},{"t":"Stat surgery consult for cricothyrotomy or tracheostomy.","l":3},{"t":"Assess the site of airway rupture:","l":0},{"t":"Perform fiberoptic bronchoscopy in all cases of major thoracic trauma:","l":1},{"t":"Will require an experienced bronchoscopist.","l":2},{"t":"Should be performed awake with topical anesthesia if feasible.","l":2},{"t":"May confirm the diagnosis and exact site of airway rupture.","l":2},{"t":"May allow aspirated material or secretions to be removed:","l":2},{"t":"If tracheal rupture is diagnosed:","l":3},{"t":"Advance the ETT beyond the site of rupture if possible.","l":4},{"t":"One lung ventilation may be required to maintain oxygenation.","l":4},{"t":"Consider bronchial blocker or double-lumen ETT.","l":4},{"t":"Repair the injury.","l":4},{"t":"If bronchial rupture is diagnosed:","l":3},{"t":"Intubate under fiberoptic guidance.","l":4},{"t":"Advance single-lumen ETT into unaffected bronchus or intubate the trachea and place a bronchial blocker into the affected side.","l":4},{"t":"Double-lumen ETT may be necessary.","l":4},{"t":"Resuscitate the patient as necessary:","l":0},{"t":"Diagnose and manage other injuries (see Event 14, The Trauma Patient).","l":1},{"t":"Exclude the presence of a pneumothorax (see Event 35, Pneumothorax).","l":1},{"t":"If nonemergent intubation is required for bronchoscopy or surgery:","l":0},{"t":"Treat as a known difficult intubation (see Event 3, Difficult Tracheal Intubation).","l":1},{"t":"Fiberoptic intubation with topical anesthesia is the method of choice.","l":1},{"t":"Sedate the patient:","l":1},{"t":"Fentanyl IV, <b>50 μg<\/b>, repeat as necessary.","l":2},{"t":"<b>Midazolam<\/b> IV, <b>0.5 mg<\/b>, repeat as necessary.","l":2},{"t":"<b>Ketamine<\/b> IV, <b>10 to 20 mg<\/b>, repeat as necessary.","l":2},{"t":"Dexmedetomidine infused at 0.1 to 0.7 μg/kg/hr.","l":2},{"t":"Administer supplemental O<sub>2<\/sub> and, if necessary, manually ventilate with gentle breaths, avoiding high PIP.","l":1},{"t":"Surgical correction versus conservative management will depend on the location and extent of injury:","l":0},{"t":"Plan management with ENT and thoracic surgeons.","l":1},{"t":"In patients with cervical injuries, consider performing fiberoptic bronchoscopy as the ETT is removed to identify tracheal injuries.","l":0}],"complications":[{"t":"Retropharyngeal abscess.","l":0},{"t":"Airway obstruction.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Mediastinitis.","l":0},{"t":"Pneumonia distal to bronchial rupture.","l":0},{"t":"Tracheal or bronchial stenosis.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Minabres E, Burón J, Ballesteros MA, et al. Tracheal rupture after endotracheal intubation: a literature systematic review. Eur J Cardiothorac Surg 2009;35:1056-62."},{"t":"2. Chow JL, Coady MA, Varner J, et al. Management of acute complete tracheal transection caused by nonpenetrating trauma: report of a case and review of the literature. J Cardiothorac Vasc Anesth 2004;18:475-8."},{"t":"3. Mabry RL, Edens JW, Pearse L, Kelly JF, Harke H. Fatal airway injuries during Operation Enduring Freedom and Operation Iraqi Freedom. Prehosp Emerg Care 2010;14:272-7."},{"t":"4. Cooper RM. Complications associated with the use of the GlideScope videolaryngoscope. Can J Anaesth 2007;54:54-7."},{"t":"5. Fitzmaurice BG, Brodsky JB. Airway rupture from double-lumen tubes. J Cardiothorac Vasc Anesth 1999;13:322-9."}]}},{"id":27,"title":"Anterior Mediastinal Mass","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"An anterior mediastinal mass is a benign or malignant tumor found in the mediastinum anterior to the pericardium.","l":0}],"etiology":[{"t":"Compression of vital structures within the chest:","l":0},{"t":"Trachea or bronchi.","l":1},{"t":"Heart and great vessels.","l":1}],"typical":[{"t":"Benign or malignant tumors:","l":0},{"t":"Thymoma.","l":1},{"t":"Teratoma.","l":1},{"t":"Lymphomas.","l":1},{"t":"Thyroid tumors.","l":1},{"t":"Cysts of multiple origins.","l":1},{"t":"Vascular malformations.","l":1}],"prevention":[{"t":"Carefully evaluate for signs and symptoms of symptomatic airway or vascular compression:","l":0},{"t":"Intolerance of supine position.","l":1},{"t":"Assess the effect on symptoms of changing patient position, e.g. right or left lateral.","l":1},{"t":"Obtain an anteroposterior (AP) and lateral CXR and CT scan of the thorax to evaluate mass.","l":1},{"t":"There is questionable value of flow-volume loops in the upright and supine positions to evaluate dynamic compression of the airway in adults.","l":1},{"t":"Prepare for loss of airway or circulation during induction of anesthesia or intubation:","l":0},{"t":"Have a rigid bronchoscope available.","l":1},{"t":"Discuss the need for standby CPB or ECMO with surgeons.","l":1}],"manifestations":[{"t":"Cardiac:","l":0},{"t":"Chest pain or fullness, cough, syncopal symptoms and exercise intolerance.","l":1},{"t":"Pulmonary:","l":0},{"t":"Dyspnea that might or might not be positional.","l":1},{"t":"Hoarseness.","l":0},{"t":"Dysphagia.","l":0},{"t":"<b>Stridor<\/b>.","l":0},{"t":"Systemic symptoms associated with malignancy.","l":0},{"t":"Upper extremity and facial/neck swelling (SVC syndrome).","l":0},{"t":"Incidental finding on CXR or CT obtained for other reason.","l":0},{"t":"Intraoperative manifestations:","l":0},{"t":"Inability to maintain a patent airway.","l":1},{"t":"Difficulty in advancing an ETT.","l":1},{"t":"Inability to ventilate through an ETT.","l":1},{"t":"<b>Hypoxemia<\/b>.","l":1},{"t":"<b>Hypotension<\/b>.","l":1}],"similar":[{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"Epiglottitis (see Event 31, Epiglottitis [Supraglottitis]).","l":0},{"t":"Intrathoracic airway obstruction:","l":0},{"t":"Tracheal or endobronchial tumor.","l":1},{"t":"Extrathoracic airway obstruction:","l":0},{"t":"Foreign body, Ludwig angina, epiglottitis, postoperative hematoma from head/neck/ carotid surgery.","l":1},{"t":"Stridor (see Event 36, Postoperative Stridor).","l":0}],"management":[{"t":"<i>Requires interdisciplinary approach with consultation with thoracic or general surgery, radiology, oncology, intensive care, and radiation oncology.<\/i>","l":0,"n":1},{"t":"<b>General principles.<\/b>","l":0},{"t":"Obtain and examine imaging studies preoperatively:","l":0},{"t":"AP and lateral CXR examination.","l":1},{"t":"Thoracic CT scan.","l":1},{"t":"TTE to evaluate for presence of pericardial effusion and other cardiac, systemic, or pulmonary vascular compression.","l":1},{"t":"Ensure adequate IV access:","l":0},{"t":"In patients with SVC syndrome, place <b>large-bore<\/b> IV in lower extremity.","l":1},{"t":"Consider <b>arterial line<\/b> prior to procedure.","l":0},{"t":"<b>Anesthesia management:<\/b>","l":0},{"t":"Local anesthesia may be adequate for biopsy, anterior mediastinoscopy, or CT-guided biopsy.","l":1},{"t":"For asymptomatic adult patients:","l":1},{"t":"IV induction and tracheal intubation:","l":2},{"t":"Risk of airway obstruction and cardiovascular compromise is minimal in these patients.","l":3},{"t":"For symptomatic adult patients:","l":1},{"t":"Experienced bronchoscopist and rigid bronchoscope should be available prior to induction.","l":2},{"t":"Consider the need for CPB or ECMO prior to induction:","l":2},{"t":"Discuss options with cardiac surgery, cardiology, and perfusionist team.","l":3},{"t":"Inhalation induction with sevoflurane maintaining spontaneous ventilation:","l":2},{"t":"Assess the ability to ventilate prior to administering a short-acting muscle relaxant:","l":3},{"t":"Intubate trachea with small ETT.","l":4},{"t":"If unable to give positive pressure breaths, awaken the patient and reassess the situation.","l":3},{"t":"If airway obstruction occurs:","l":0},{"t":"Check ETT position if intubated.","l":1},{"t":"Attempt rigid bronchoscopy and ventilate via bronchoscope.","l":1},{"t":"Prepare to institute emergency CPB or ECMO.","l":1},{"t":"If circulatory collapse occurs:","l":0},{"t":"Change patient to lateral position.","l":1},{"t":"If no response to change in position, proceed with immediate sternotomy (to relieve pressure on great vessels).","l":1}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Inability to advance ETT into the trachea.","l":0},{"t":"Inability to ventilate the intubated patient.","l":0},{"t":"Airway trauma due to:","l":0},{"t":"Difficult intubation.","l":1},{"t":"Rigid bronchoscopy.","l":1},{"t":"Postoperative stridor.","l":0},{"t":"Pulmonary edema due to excessive negative intrathoracic pressure.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Garey CL, Laituri CA, Valusek PA, St Peter SD, Snyder CL. Management of anterior mediastinal masses in children. Eur J Pediatr Surg 2011;21:310-21."},{"t":"2. Slinger P, Karsli C. Management of the patient with a large anterior mediastinal mass: recurring myths. Curr Opin Anaesthesiol 2007;20:1-3."},{"t":"3. Bechard P, Letourneau L, Lacasse Y, Cote D, Bussieres JS. Perioperative cardiorespiratory complications in adults with mediastinal mass: incidence and risk factors. Anesthesiology 2004;100:826-34, discussion 5A."},{"t":"4. Hammer GB. Anaesthetic management for the child with a mediastinal mass. Paediatr Anaesth 2004;14:95-7."},{"t":"5. Pompeo E, Tacconi F, Mineo TC. Awake video-assisted thoracoscopic biopsy in complex anterior mediastinal masses. Thorac Surg Clin 2010;20:225-33."}]}},{"id":28,"title":"Aspiration of Gastric Contents","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"Aspiration of gastric contents is inhalation of gastric contents into the tracheobronchial tree.","l":0}],"etiology":[{"t":"Passive regurgitation or active vomiting of gastric contents in patients who are unable to protect their airway.","l":0}],"typical":[{"t":"Patients with a “full stomach” or raised intra-abdominal pressure:","l":0},{"t":"Patients who are not NPO.","l":1},{"t":"Patients who have acute pain or who are on opioids.","l":1},{"t":"Bowel obstruction.","l":1},{"t":"Gastroparesis, e.g. diabetic patients.","l":1},{"t":"Late pregnancy.","l":1},{"t":"Acute alcohol intoxication.","l":1},{"t":"Patients with large amounts of gas in the stomach:","l":0},{"t":"Prolonged positive pressure ventilation via mask or SGA.","l":1},{"t":"Difficult tracheal intubation.","l":1},{"t":"Patients with an incompetent gastroesophageal junction:","l":0},{"t":"Hiatal hernia.","l":1},{"t":"Previous esophageal or gastric surgery.","l":1},{"t":"Obesity:","l":0},{"t":"Patients who have had or are having bariatric surgery.","l":1},{"t":"Any patient with impaired laryngeal reflexes or cough:","l":0},{"t":"Depressed level of consciousness.","l":1},{"t":"Patients with residual neuromuscular blockade.","l":1},{"t":"Topical anesthesia of the larynx or pharynx, e.g. upper gastrointestinal procedures under sedation.","l":1},{"t":"Chronic neurologic disease, e.g. patients with multiple sclerosis or stroke.","l":1},{"t":"Anatomic abnormalities in and around the larynx.","l":1},{"t":"Patients who have had ineffective cricoid pressure.","l":0},{"t":"Recently extubated patients in ICU or OR.","l":0},{"t":"During a cardiac arrest.","l":0}],"prevention":[{"t":"In patients at risk of aspiration of gastric contents:","l":0},{"t":"<b>Avoid<\/b> general anesthesia if possible.","l":1},{"t":"Delay nonemergent surgery as long as possible to allow the stomach to empty and to allow time for medications that assist gastric emptying and reduce gastric acidity to be effective.","l":1},{"t":"<b>Avoid<\/b> depression of laryngeal reflexes.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"From excess sedation.","l":3},{"t":"Topical anesthesia.","l":3},{"t":"Administer nonparticulate antacid <b>immediately<\/b> prior to induction of general anesthesia:","l":1},{"t":"Sodium citrate PO, <b>30 mL<\/b>.","l":2},{"t":"Administer H2 antagonists at least 30 minutes prior to the induction of anesthesia:","l":1},{"t":"Famotidine IV, <b>20 mg<\/b>.","l":2},{"t":"Ranitidine IV, <b>50 mg<\/b>.","l":2},{"t":"Administer metoclopramide IV, <b>10 mg<\/b>, to stimulate gastric emptying.","l":1},{"t":"If general anesthesia is necessary:","l":0},{"t":"Assess the patient’s airway carefully prior to inducing general anesthesia.","l":1},{"t":"Suction an in situ NGT prior to induction of general anesthesia:","l":1},{"t":"If a NGT is left in place, it may produce incompetence of the lower esophageal sphincter.","l":2},{"t":"There may still be gastric contents present even after suctioning an NGT.","l":2},{"t":"Have a trained and experienced assistant apply cricoid pressure:","l":1},{"t":"Maintain cricoid pressure until the ETT position is confirmed (see Event 5, Esophageal Intubation).","l":2},{"t":"Intubate the trachea, inflate the ETT cuff, and confirm placement.","l":1},{"t":"Patient is at risk for aspiration at the end of surgery:","l":1},{"t":"Apply NG suctioning prior to extubation.","l":2},{"t":"Extubate the patient only after recovery of protective laryngeal reflexes.","l":2},{"t":"Consider awake intubation:","l":0},{"t":"Topical anesthesia of the larynx before securing the airway may ablate protective reflexes at a time that regurgitation or vomiting is likely to occur.","l":1},{"t":"Fiberoptic intubation can be performed with the patient sitting, making regurgitation less likely.","l":1},{"t":"Consider tracheostomy under local anesthesia if fiberoptic intubation is impossible and a difficult tracheal intubation is anticipated.","l":1}],"manifestations":[{"t":"Gastric contents visualized in the oropharynx.","l":0},{"t":"Severe <b>hypoxemia<\/b>.","l":0},{"t":"Increased PIP.","l":0},{"t":"<b>Bronchospasm<\/b>.","l":0},{"t":"Copious tracheal secretions.","l":0},{"t":"Retraction:","l":0},{"t":"Coughing.","l":1},{"t":"Laryngospasm.","l":1},{"t":"Rales.","l":1},{"t":"Chest.","l":1},{"t":"Hyperpnea:","l":0},{"t":"Dyspnea.","l":1},{"t":"<b>Apnea<\/b>.","l":1},{"t":"Or.","l":1},{"t":"CXR findings:","l":0},{"t":"Unremarkable in 15% to 20% of cases of aspiration.","l":1},{"t":"Pneumonic infiltrates and atelectasis may be present.","l":1}],"similar":[{"t":"Hypoxemia from other causes (see Event 10, Hypoxemia).","l":0},{"t":"Obstruction of the ETT.","l":0},{"t":"Bronchospasm from other causes (see Event 29, Bronchospasm).","l":0},{"t":"Other causes of high PIP (see Event 7, High Peak Inspiratory Pressure).","l":0},{"t":"Pneumonia.","l":0},{"t":"Pulmonary edema (see Event 20, Pulmonary Edema).","l":0},{"t":"ARDS.","l":0},{"t":"PE (see Event 21, Pulmonary Embolism).","l":0}],"management":[{"t":"If gastric contents are visible in the oropharynx or larynx:","l":0},{"t":"Suction oropharynx with Yankauer suction tip.","l":1},{"t":"Intubate the trachea:","l":1},{"t":"Perform immediate tracheal suctioning prior to positive pressure ventilation:","l":2},{"t":"Pass a suction catheter down the ETT:","l":3},{"t":"Obtain a sample of the pulmonary aspirate for pH, Gram stain, and culture.","l":4},{"t":"<b>Do not<\/b> make prolonged efforts at suctioning the trachea, especially if the patient is desaturating.","l":4},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Positive pressure ventilation with <b>100%<\/b> FiO<sub>2<\/sub>.","l":1},{"t":"Add PEEP to maintain oxygenation.","l":1},{"t":"If particulate aspiration has occurred:","l":0},{"t":"Lavage plus suctioning or bronchoscopy will be necessary to remove particulate material and to assess level of contamination.","l":1},{"t":"Cancel elective surgery and restrict emergency surgery to the minimum procedure consistent with safety.","l":0},{"t":"Provide supportive care:","l":0},{"t":"Fluid management with <b>crystalloid<\/b> rather than <b>colloid<\/b>.","l":1},{"t":"Administer H2 blockers for stress ulcer <b>prophylaxis<\/b>:","l":1},{"t":"Famotidine IV, <b>20 mg<\/b>.","l":2},{"t":"Ranitidine IV, <b>50 mg<\/b>.","l":2},{"t":"Perform intermittent pulmonary toilet (uninjured pulmonary cilia will continue to sweep particles and edema fluid to the bronchi):","l":1},{"t":"Large volume lavage via the ETT is usually not indicated.","l":2},{"t":"Consider the administration of antibiotics:","l":0},{"t":"Choice of antibiotic should be based on the results of a Gram stain of the pulmonary aspirate.","l":1},{"t":"Prophylaxis is indicated if there is a high likelihood of bacterial colonization of gastric contents, e.g. patients on H2 antagonists and proton pump inhibitors and those with small or large bowel obstruction.","l":1},{"t":"Steroids have not been shown to be of benefit during the period of acute hypoxemia and may impair the long-term healing process of the lung.","l":0},{"t":"Bronchodilators may be helpful in relieving large airway closure in less damaged areas of the lungs.","l":0},{"t":"Consider ECMO support if oxygenation cannot be maintained.","l":0},{"t":"Consider lung transplant.","l":0}],"complications":[{"t":"Pneumonia.","l":0},{"t":"ARDS.","l":0},{"t":"Sepsis.","l":0},{"t":"Barotrauma secondary to high PIP.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Marik PE. Aspiration pneumonitis and aspiration pneumonia. NEJM 2001;344:655-71."},{"t":"2. Raghavendran K, Nemzek J, Napolitano LN, Knight PR. Aspiration-induced lung injury. Crit Care Med 2011;39:1-9."},{"t":"3. American Society of Anesthesiologists 2011 practice guidelines for preoperative fasting and the use of pharmacologic agents to reduce the risk of pulmonary aspiration: application to healthy patients undergoing elective p rocedures. An updated report by the American Society of Anesthesiologists Committee on Standards and Practice Parameters. Anesthesiology 2011;114:495-511."}]}},{"id":29,"title":"Bronchospasm","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"Bronchospasm is a reversible narrowing of the medium and small airways because of smooth muscle contraction.","l":0}],"etiology":[{"t":"Asthma.","l":0},{"t":"COPD with a reversible component of airway narrowing.","l":0},{"t":"Airway irritation.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Aspiration.","l":2},{"t":"Bronchiolitis.","l":2},{"t":"Upper respiratory infection [URI].","l":2},{"t":"Medication side effects, e.g. allergy or anaphylaxis.","l":0}],"typical":[{"t":"Patients with known asthma, COPD, or recent URI.","l":0},{"t":"Mechanical irritation of the airway:","l":0},{"t":"Placement of oral or SGA.","l":1},{"t":"Placement of ETT.","l":1},{"t":"Endobronchial intubation.","l":1},{"t":"Chemical irritation of the airway:","l":0},{"t":"Pungent anesthetic gases.","l":1},{"t":"Soda lime dust.","l":1},{"t":"Smoke inhalation.","l":1},{"t":"Carcinoid syndrome.","l":0},{"t":"Medications known to cause bronchospasm:","l":0},{"t":"β<sub>2<\/sub>-antagonists (labetalol, propanolol).","l":1},{"t":"Anticholinesterases.","l":1},{"t":"Drug allergies.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Antibiotics.","l":3},{"t":"Neuromuscular blockers.","l":3},{"t":"Latex.","l":3},{"t":"Adenosine.","l":3},{"t":"Radiocontrast agents.","l":3},{"t":"Aspiration of gastric contents.","l":0},{"t":"PE (fat, thrombus, amniotic fluid).","l":0}],"prevention":[{"t":"<i>Cancel elective surgery for patients who are actively in bronchospasm.<\/i>","l":0},{"t":"<b>Avoid<\/b> anesthesia and elective surgery when the patient is at risk of bronchospasm:","l":0},{"t":"Acute URI.","l":1},{"t":"Recent exacerbation of asthma or COPD.","l":1},{"t":"In patients with known asthma or COPD, optimize therapy with bronchodilators and/or systemic steroids prior to anesthesia.","l":0},{"t":"Administer bronchodilators on day of surgery:","l":0},{"t":"Inhaled β<sub>2<\/sub>-agonists prior to induction:","l":1},{"t":"<b>Albuterol<\/b> MDI 4 to 8 puffs (90 μg/puff).","l":2},{"t":"<b>Albuterol<\/b> nebulizer solution 2.5 mg/<b>3 mL<\/b>.","l":2},{"t":"If it is necessary to proceed with surgery in patients with a known risk of bronchospasm:","l":0},{"t":"Regional anesthesia will eliminate airway stimulation.","l":1},{"t":"Consider SGA with general anesthesia.","l":1},{"t":"Consider using <b>ketamine<\/b> IV, <b>1 to 2 mg/kg<\/b>, for anesthetic induction.","l":1},{"t":"Consider intraoperative <b>ketamine<\/b> infusion at 0.25 mg/kg/hr as an anesthetic adjuvant.","l":1},{"t":"Deepen anesthesia prior to intubation:","l":0},{"t":"Administer additional <b>propofol<\/b> IV, <b>30 to 50 mg<\/b>.","l":1},{"t":"<b>Lidocaine<\/b> IV, <b>1 to 1.5 mg/kg<\/b>, 1 to 3 minutes prior to intubation.","l":1},{"t":"Ventilate with sevoflurane prior to intubation.","l":1},{"t":"Monitor flow-volume loops if available for early detection and treatment of bronchospasm.","l":0}],"manifestations":[{"t":"Increased PIP.","l":0},{"t":"Audible <b>wheezing<\/b>, usually during exhalation:","l":0},{"t":"If <b>bronchospasm<\/b> is severe, there may be an absence of <b>wheezing<\/b> or gas movement.","l":1},{"t":"Upward sloping of capnogram wave:","l":0},{"t":"ET CO<sub>2<\/sub> may be absent or diminished depending on severity of <b>bronchospasm<\/b>.","l":1},{"t":"Decreased PaO<sub>2<\/sub> and O<sub>2<\/sub> saturation.","l":0},{"t":"Decreased tidal volume especially with pressure-controlled ventilation.","l":0},{"t":"Gradient between PaCO<sub>2<\/sub> and ET CO<sub>2<\/sub> will increase.","l":0},{"t":"Increased PaCO<sub>2<\/sub>.","l":0},{"t":"<b>Hypotension<\/b>.","l":0}],"similar":[{"t":"Aspiration of gastric contents (see Event 28, Aspiration of Gastric Contents).","l":0},{"t":"Kinked or obstructed ETT (see Event 7, High Peak Inspiratory Pressure).","l":0},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"Aspiration of foreign body (usually unilateral wheeze vs. diffuse).","l":0},{"t":"Amniotic fluid embolism (see Event 81, Amniotic Fluid Embolism).","l":0},{"t":"Pulmonary edema (see Event 20, Pulmonary Edema).","l":0},{"t":"PE (see Event 21, Pulmonary Embolism).","l":0},{"t":"Endobronchial intubation (see Event 30, Endobronchial Intubation).","l":0},{"t":"Anaphylaxis and anaphylactoid reactions (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"Air trapping.","l":0}],"management":[{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Increase FiO<sub>2<\/sub> to <b>100%<\/b>.","l":1},{"t":"Briefly ventilate the patient with reservoir bag:","l":1},{"t":"Assess pulmonary compliance.","l":2},{"t":"If hand ventilation will be an ongoing requirement, call for help.","l":2},{"t":"Mechanically ventilate the patient:","l":1},{"t":"Optimize RR and I:E ratio to <b>avoid<\/b> hyperinflation or auto-PEEP.","l":2},{"t":"Verify the diagnosis of bronchospasm:","l":0},{"t":"Auscultate the chest.","l":1},{"t":"Check ETT position.","l":1},{"t":"Check patency of ETT:","l":1},{"t":"Pass a suction catheter down the ETT.","l":2},{"t":"<b>For mild bronchospasm:<\/b>","l":0},{"t":"Increase anesthetic depth with sevoflurane if the patient is not hypotensive.","l":1},{"t":"Administer β<sub>2<\/sub>-agonist to the lungs by MDI; repeat in 10 minutes if there is no response and no tachycardia:","l":1},{"t":"A large dose of any aerosolized medication may be required when administered via the ETT:","l":2},{"t":"<b>Albuterol<\/b>: initial dose, 4 to 8 metered puffs (90 μg/puff).","l":3},{"t":"<b>Albuterol<\/b> and ipratropium bromide combination therapy, initial dose, 8 m etered puffs.","l":3},{"t":"For moderate to severe bronchospasm:","l":0},{"t":"Institute measures as in mild bronchospasm.","l":1},{"t":"Consider the possibility of silent aspiration of gastric contents:","l":1},{"t":"Suction through the ETT and collect aspirate for analysis of pH.","l":2},{"t":"If bronchospasm does not resolve:","l":0},{"t":"<b>Inform the surgeon.<\/b>","l":1},{"t":"Administer β<sub>2<\/sub>-agonist:","l":1},{"t":"<b>Albuterol<\/b> MDI, initial dose 4 to 8 metered puffs (90 μg/puff) q20m.","l":2},{"t":"<b>Albuterol<\/b> nebulized, 2.5 mg/<b>3 mL<\/b> q20m.","l":2},{"t":"Institute IV bronchodilator therapy:","l":1},{"t":"<b>Epinephrine<\/b> IV, <b>0.1 μg/kg<\/b> bolus; infusion, 5 to 20 ng/kg/min, titrated to the pulse rate, BP, and bronchodilator response.","l":2},{"t":"MgSO<sub>4<\/sub> IV, <b>2 g<\/b>.","l":2},{"t":"Administer corticosteroids:","l":1},{"t":"<b>Methylprednisolone<\/b> IV, <b>125 mg<\/b> bolus.","l":2},{"t":"<b>Reassess ventilation:<\/b>","l":0},{"t":"<b>Avoid<\/b> high PIP to minimize barotrauma.","l":1},{"t":"Alter tidal volume and I:E ratio to maintain oxygenation and minimize airway pressure, allowing permissive hypercapnia if necessary.","l":1},{"t":"Check for air trapping:","l":1},{"t":"Consider deepening volatile anesthetic or providing paralysis to improve patient-ventilator synchrony.","l":2},{"t":"Obtain a high-performance ventilator (such as an ICU ventilator):","l":0},{"t":"Pulmonary compliance/resistance may exceed the performance envelope of the anesthesia workstation.","l":1},{"t":"Heliox may improve airflow in patients with severe bronchospasm.","l":0},{"t":"Stop the surgical procedure <b>as soon as possible<\/b>.","l":0},{"t":"Transfer patient to ICU for postoperative care if resolution is incomplete.","l":0},{"t":"If the patient is NOT intubated (e.g. bronchospasm in PACU):","l":0},{"t":"Consider noninvasive ventilation CPAP or BiPAP.","l":1},{"t":"Bronchodilator therapy as previously stated.","l":1},{"t":"Evaluate for increased effort to breathe, fatigue, altered mental status, subjective distress, or hypercarbia.","l":1},{"t":"Intubate the trachea if treatment fails.","l":1}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Hypercarbia.","l":0},{"t":"Hypotension due to increased intrathoracic pressure.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Barotrauma.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Fidkowski CW, Zheng H, Firth PG. The anesthetic considerations of tracheobronchial foreign bodies in children: a literature review of 12,979 cases. Anesth Analg 2010;111(4):1016-25."},{"t":"2. Duggan M, Kavanagh BP. Perioperative modifications of respiratory function. Best Pract Res Clin Anaesthesiol 2010;24(2):145-55."},{"t":"3. Woods BD, Sladen RN. Perioperative considerations for the patient with asthma and bronchospasm. Br J Anaesth 2009;103(Suppl. 1):i57-65."},{"t":"4. Lazarus S. Emergency treatment of asthma. NEJM 2010;755-64."}]}},{"id":30,"title":"Endobronchial Intubation","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"Endobronchial intubation is the unintentional placement of the ETT in a mainstem or segmental bronchus, resulting in excessive ventilation of one lung or lung segment and hypoventilation of the other(s).","l":0}],"etiology":[{"t":"ETT advanced too far during initial placement.","l":0},{"t":"Manipulation of the head or ETT after tracheal intubation.","l":0},{"t":"Mediastinal shift cephalad in the Trendelenburg position (robotic and pelvic laparoscopic surgery).","l":0},{"t":"Aberrant tracheal/bronchial anatomy.","l":0}],"typical":[{"t":"Inadequate assessment of the insertion depth of the ETT during initial placement:","l":0},{"t":"Inexperienced anesthesia professional.","l":1},{"t":"Difficult intubation.","l":1},{"t":"ETT placed through a tracheostomy.","l":1},{"t":"Failure to check ETT position after change in patient position, e.g. steep Trendelenburg.","l":1},{"t":"During certain types of surgery:","l":0},{"t":"Neurosurgery:","l":1},{"t":"The head is frequently placed in a flexed or extended position; flexion can advance the ETT by up to 3 cm.","l":2},{"t":"ENT surgery, e.g. extubation and reintubation through a tracheostomy during laryngectomy.","l":1},{"t":"Thoracic surgery:","l":1},{"t":"Double-lumen ETT advanced too far.","l":2},{"t":"Surgical manipulation of trachea and bronchi.","l":2},{"t":"Pediatric patients:","l":0},{"t":"Distance between the larynx and the carina is short.","l":1}],"prevention":[{"t":"Advance the ETT so that the cuff is just beyond the vocal cords.","l":0},{"t":"Carefully note the markings on the ETT at the teeth or gums after insertion.","l":0},{"t":"Secure the ETT firmly to the patient.","l":0},{"t":"Maintain security of the ETT when positioning the patient.","l":0},{"t":"Recheck the position of the ETT and auscultate breath sounds after positioning the patient.","l":0},{"t":"In patients who have a tracheostomy, advance the ETT so that the cuff is just beyond the tracheal stoma:","l":0},{"t":"Consider marking the ETT with an indelible pen at the entry point of the stoma.","l":1}],"manifestations":[{"t":"<i>Endobronchial intubation most commonly involves the ETT entering the right mainstem bronchus.<\/i>","l":0},{"t":"Increased PIP.","l":0},{"t":"Decreased breath sounds on the nonventilated side.","l":0},{"t":"Asymmetric chest movement with ventilation.","l":0},{"t":"Changes in oxygenation:","l":0},{"t":"O<sub>2<\/sub> saturation may remain at or near 100% for several minutes after intubation, especially if the patient has been preoxygenated and ventilated with 100% O<sub>2<\/sub>.","l":1},{"t":"Atelectasis occurs in the nonventilated lung increasing shunt fraction.","l":1},{"t":"PaO<sub>2<\/sub> falls and patient desaturates as A–a gradient increases due to increasing shunt.","l":1},{"t":"Changes in ET CO<sub>2<\/sub>:","l":0},{"t":"ET CO<sub>2<\/sub> may increase, decrease, or remain unchanged depending on the characteristics of the ventilated lung.","l":1},{"t":"Tidal volume may decrease if using pressure-controlled ventilation.","l":0},{"t":"Increase in shunt fraction may increase time lag to changes in volatile anesthetic concentration.","l":0},{"t":"Fiberoptic bronchoscopy:","l":0},{"t":"The carina is not visualized distal to the tip of the ETT:","l":1},{"t":"The division between segmental bronchi may resemble the carina.","l":2},{"t":"The tip of the ETT may be visualized at or below the level of the carina on a CXR.","l":0},{"t":"Lack of pleural sliding when comparing nonventilated to ventilated lung on TTE.","l":0}],"similar":[{"t":"Kinked or obstructed ETT (see Event 7, High Peak Inspiratory Pressure).","l":0},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"Lobar or segmental atelectasis or collapse.","l":0},{"t":"PE (see Event 21, Pulmonary Embolism).","l":0}],"management":[{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"If the patient desaturates, increase the FiO<sub>2<\/sub> to <b>100%<\/b>.","l":1},{"t":"Auscultate both sides of chest for symmetry of breath sounds:","l":0},{"t":"Auscultate in multiple zones including the axilla.","l":1},{"t":"Breath sounds are often difficult to hear and may not be diagnostic of endobronchial intubation.","l":1},{"t":"Manual ventilation with the anesthesia circuit will allow assessment of compliance while also auscultating breath sounds.","l":1},{"t":"<b>Inspect the ETT:<\/b>","l":0},{"t":"Check that the insertion depth of the ETT is appropriate and has not changed since placement.","l":1},{"t":"Palpate the intraoral part of the ETT for kinks.","l":1},{"t":"If the ETT is visible in the surgical field, ask the surgeon to check ETT depth and to check for kinks.","l":1},{"t":"Ensure the patency of the ETT:","l":0},{"t":"Pass a suction catheter down the ETT to rule out obstruction.","l":1},{"t":"If endobronchial intubation is diagnosed:","l":0},{"t":"Suction secretions from oropharynx.","l":1},{"t":"Deflate the cuff and pull back the ETT cautiously:","l":1},{"t":"Be prepared to reintubate the trachea.","l":2},{"t":"Auscultate the chest for symmetric breath sounds.","l":1},{"t":"Check the PIP.","l":1},{"t":"Resecure the ETT.","l":1},{"t":"Consider laryngoscopy (regular or video) to ensure correct placement of ETT.","l":1},{"t":"Perform fiberoptic bronchoscopy if endobronchial intubation remains in the differential diagnosis.","l":0},{"t":"If the patient was difficult to intubate:","l":0},{"t":"Place fiberoptic bronchoscope through ETT, deflate cuff, and withdraw carefully, identifying bronchial and tracheal anatomy while looking for tracheal rings:","l":1},{"t":"Recheck ETT position, assessing distance above the carina.","l":2},{"t":"Visualization of right upper lobe takeoff can help differentiate the carina.","l":2},{"t":"Obtain a CXR.","l":2}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Hypercarbia.","l":0},{"t":"Atelectasis.","l":0},{"t":"Pneumonia of the atelectatic lung or segment.","l":0},{"t":"Barotrauma to the hyperventilated lung.","l":0},{"t":"Accidental extubation while correcting problem.","l":0}],"reading":[{"t":"1. Blaivas M, Tsung JW. Point-of-care sonographic detection of left endobronchial main stem intubation and obstruction versus endotracheal intubation. J Ultrasound Med 2008;27:785-9."}]}},{"id":31,"title":"Epiglottitis (Supraglottitis)","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"Epiglottitis (supraglottitis) is an infection of the epiglottis and supraglottic structures (epiglottis, arytenoid cartilage mucosa, and aryepiglottic folds).","l":0}],"etiology":[{"t":"Bacterial infection:","l":0},{"t":"<i>Streptococcus pneumoniae.<\/i>","l":1},{"t":"<i>Haemophilus influenzae <\/i>type B.","l":1},{"t":"Group A streptococci.","l":1},{"t":"Staphylococcal organisms, including methicillin-resistant <i>Staphylococcus aureus.<\/i>","l":1},{"t":"Viral infection:","l":0},{"t":"Parainfluenza virus.","l":1},{"t":"Immunocompromised hosts:","l":0},{"t":"<i>Pseudomonas, Candida.<\/i>","l":1}],"typical":[{"t":"Children 3 to 5 years of age that have not been vaccinated against <i>H. influenzae <\/i>type B.","l":0},{"t":"Middle-aged adults.","l":0},{"t":"Increased prevalence in winter months.","l":0},{"t":"Secondary bacterial infection following a viral infection.","l":0}],"prevention":[{"t":"Ensure that infants receive prophylactic vaccination against <i>H. influenzae.<\/i>","l":0},{"t":"Recognize and treat the infection early, before significant airway compromise occurs.","l":0}],"manifestations":[{"t":"<i>A convenient mnemonic consists of the “four D’s”: dysphagia, dysphonia, dyspnea, and drooling.<\/i>","l":0},{"t":"Abrupt presentation of symptoms of severe infection:","l":0},{"t":"Respiratory distress (dyspnea).","l":1},{"t":"Toxic appearance.","l":1},{"t":"Prostration:","l":1},{"t":"<b>Tachycardia<\/b>.","l":2},{"t":"Flushing.","l":2},{"t":"And.","l":2},{"t":"High <b>fever<\/b>.","l":1},{"t":"Severe sore throat.","l":1},{"t":"Dysphagia.","l":1},{"t":"Dysphonia.","l":1},{"t":"<b>Stridor<\/b>.","l":1},{"t":"Drooling.","l":0},{"t":"Laryngeal tenderness to external palpation.","l":0},{"t":"Leukocytosis with neutrophilia.","l":0},{"t":"Lateral radiograph of the neck may show the “thumb sign” at the level of the epiglottis (indicative of epiglottitis).","l":0},{"t":"Classic pediatric position: sitting bolt upright, leaning forward in a sniffing position.","l":0}],"similar":[{"t":"Postoperative stridor (see Event 36, Postoperative Stridor).","l":0},{"t":"Retropharyngeal abscess.","l":0},{"t":"Submandibular abscess (Ludwig angina).","l":0},{"t":"Uvular edema from traumatic intraoperative suctioning.","l":0},{"t":"Prevertebral soft tissue infection.","l":0},{"t":"Parotid infection.","l":0},{"t":"Angioedema (ACEI, C1 esterase deficiency).","l":0},{"t":"Tonsillitis.","l":0},{"t":"Laryngotracheitis:","l":0},{"t":"Diphtheria.","l":1},{"t":"Foreign body.","l":0}],"management":[{"t":"<i>Early recognition of patients who may have epiglottitis is crucial. Urgent or emergent airway control (including emergent tracheostomy or cricothyroidotomy) may be required even before definitive diagnosis is established. Interdisciplinary management should involve otolaryn<i>gologists, anesthesiologists, and infectious disease consultants.<\/i><\/i>","l":0},{"t":"<b>Administer supplemental O<sub>2<\/sub>.<\/b>","l":0},{"t":"<b>Establish IV access:<\/b>","l":0},{"t":"In children, only if this can be done without exacerbating airway compromise.","l":1},{"t":"If the patient is not in extremis, confirm the diagnosis:","l":0},{"t":"Obtain a lateral and AP radiograph of the neck:","l":1},{"t":"The patient should be attended continuously by personnel with appropriate airway management skills.","l":2},{"t":"In adults, consider evaluation by an otolaryngologist.","l":1},{"t":"i.e.:","l":2,"e":1},{"t":"Nasal endoscopy.","l":3},{"t":"Indirect mirror to visualize the epiglottis.","l":3},{"t":"Secure the airway in the OR if the patient requires immediate airway management or following a radiologic or endoscopic diagnosis of epiglottitis.","l":0},{"t":"<i>Protocol for Securing the Airway in the Patient with Epiglottitis:<\/i>","l":0,"n":1},{"t":"Surgeon <b>must<\/b> be present in the OR in case emergent surgical airway is required:","l":0},{"t":"Surgical equipment <b>must<\/b> be opened and ready for use.","l":1},{"t":"Mark anatomical features of neck (cricothyroid membrane).","l":1},{"t":"Check that all anesthetic and surgical equipment is in place and is functioning correctly:","l":0},{"t":"Laryngoscopes.","l":1},{"t":"ETTs, including much smaller than normal sizes.","l":1},{"t":"Suction equipment.","l":1},{"t":"Monitoring equipment.","l":1},{"t":"Rigid bronchoscope.","l":1},{"t":"Tracheostomy set.","l":1},{"t":"Administer <b>glycopyrrolate<\/b> IV (at age appropriate dose).","l":0},{"t":"Induce general anesthesia by inhalation of sevoflurane and <b>100%<\/b> O<sub>2<\/sub> with the patient in the sitting position.","l":0},{"t":"When the patient loses consciousness:","l":0},{"t":"Maintain spontaneous ventilation.","l":1},{"t":"Begin CPAP (5 to 10 cm H<sub>2<\/sub>O).","l":1},{"t":"Change the patient’s position from sitting to supine.","l":1},{"t":"Establish IV access if not already present.","l":1},{"t":"Establish an adequate depth of anesthesia for laryngoscopy, as judged by:","l":0},{"t":"Expired concentration of volatile anesthetic.","l":1},{"t":"BP and HR response to general anesthesia.","l":1},{"t":"Regular quiet diaphragmatic breathing.","l":1},{"t":"Consider <b>lidocaine<\/b> IV, <b>1 mg/kg<\/b>, prior to laryngoscopy.","l":0},{"t":"Perform direct laryngoscopy to assess the ease of intubation.","l":0},{"t":"Establish an appropriate depth of anesthesia for intubation.","l":0},{"t":"Intubate the trachea by direct laryngoscopy using either an oral or nasal ETT one half to one size (0.5 to 1 mm internal diameter) smaller than normal.","l":0},{"t":"Once the airway is secure, draw blood cultures and administer broad-spectrum antibiotics.","l":0},{"t":"If the airway is lost during inhalation induction or attempts at intubation, move rapidly to establish a surgical airway (cricothyroidotomy or tracheostomy).","l":0},{"t":"<i>The patient may need to remain intubated for the next 24 to 48 hours in the ICU, although there is some evidence that two doses of antibiotics with a short (e.g. 6-hour) course of invasive airway support may be efficacious.<\/i>","l":0,"n":1}],"complications":[{"t":"Systemic infection with the organism causing the epiglottitis.","l":0},{"t":"Secondary infection of neighboring structures.","l":0},{"t":"including:","l":1,"e":1},{"t":"Lung.","l":2},{"t":"Mediastinum.","l":2},{"t":"Meninges.","l":2},{"t":"Perivertebral space.","l":2},{"t":"Abscess or cyst at site of infection.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Hypercarbia.","l":0},{"t":"Negative pressure pulmonary edema.","l":0},{"t":"Postextubation stridor.","l":0}],"reading":[{"t":"1. Shah RK, Stocks C. Epiglottitis in the United States: national trends, variances, prognosis, and management. Laryngoscope 2010;120:1256-62."},{"t":"2. Isakson M, Hugosson S. Acute epiglottitis: epidemiology and <i>Streptococcus pneumoniae <\/i>serotype distribution in adults. J Laryngol Otol 2011;125:390-3."}]}},{"id":32,"title":"Hypercarbia","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"Hypercarbia is an abnormally high level of CO<sub>2<\/sub> in the blood or end-tidal gas.","l":0}],"etiology":[{"t":"Increased production or decreased elimination of CO<sub>2<\/sub>.","l":0},{"t":"Exogenous sources of CO<sub>2<\/sub> (insufflation gas).","l":0},{"t":"Exhausted CO<sub>2<\/sub> absorbent.","l":0},{"t":"Compensatory mechanism for metabolic alkalosis.","l":0}],"typical":[{"t":"Increased production of CO<sub>2<\/sub>:","l":0},{"t":"Shivering.","l":1},{"t":"Pyrexia, sepsis.","l":1},{"t":"MH.","l":1},{"t":"Neuroleptic malignant syndrome.","l":1},{"t":"Thyrotoxicosis.","l":1},{"t":"Parenteral nutrition with high glucose loads.","l":1},{"t":"Decreased elimination:","l":0},{"t":"Central nervous system depression by drugs or disease.","l":1},{"t":"Airway obstruction.","l":1},{"t":"Mechanical failure of ETT, breathing circuit, or ventilator.","l":1},{"t":"Neuromuscular disorders or residual effects of muscle relaxants.","l":1},{"t":"Pain-induced decrease in tidal volume.","l":1},{"t":"Respiratory muscle fatigue.","l":1},{"t":"Altered lung mechanics.","l":1},{"t":"Myxedema coma.","l":1},{"t":"Pulmonary embolus.","l":1},{"t":"ARDS, COPD","l":0,"h":1},{"t":"Low CO states.","l":1},{"t":"Cardiac arrest.","l":1},{"t":"Insufflation gas (laparoscopic and robotic surgery).","l":0},{"t":"Exhausted CO<sub>2<\/sub> absorbent.","l":0}],"prevention":[{"t":"Use appropriate ventilator settings during mechanical ventilation:","l":0},{"t":"<b>6 to 8 mL/kg<\/b> tidal volume.","l":1},{"t":"8 to 14 breaths/min (adults).","l":1},{"t":"<b>Avoid<\/b> excessive doses or combinations of respiratory depressant drugs.","l":0},{"t":"Set alarms on ventilator and capnograph to warn of hypoventilation.","l":0},{"t":"Monitor ET CO<sub>2<\/sub> levels for both inspired and expired concentrations.","l":0},{"t":"Anticipate need for increased elimination during laparoscopic and robotic procedures by increasing the RR.","l":0},{"t":"Carefully monitor patients who have received neuraxial opioids.","l":0}],"manifestations":[{"t":"Increased ET CO<sub>2<\/sub>.","l":0},{"t":"Clinical signs of <b>hypercarbia<\/b> (may be masked by general anesthesia):","l":0},{"t":"Sympathetic nervous system stimulation:","l":1},{"t":"<b>Hypertension<\/b>.","l":2},{"t":"<b>Tachycardia<\/b>.","l":2},{"t":"PVCs.","l":2},{"t":"Tachypnea in spontaneously ventilating patient.","l":1},{"t":"Semiparalyzed patient may try to overbreathe the ventilator.","l":1},{"t":"Peripheral vasodilation.","l":1},{"t":"Failure to awaken secondary to the anesthetic effect of increased PaCO<sub>2<\/sub>.","l":0}],"similar":[{"t":"Physiologic increase in arterial PaCO<sub>2<\/sub> to 45 to 47 mm Hg during sleep.","l":0},{"t":"Capnograph artifact.","l":0}],"management":[{"t":"<i>Temporary and mild hypercarbia (PaCO<sub>2<\/sub> of 45 to 50 mm Hg) during anesthesia is c ommon if the patient is ventilating spontaneously.<\/i>","l":0,"n":1},{"t":"<b>Ensure adequate oxygenation:<\/b>","l":0},{"t":"If the O<sub>2<\/sub> saturation is low or decreasing, increase the FiO<sub>2<\/sub>.","l":1},{"t":"<b>Ensure adequate ventilation:<\/b>","l":0},{"t":"If the patient is ventilating spontaneously:","l":1},{"t":"Ensure a patent airway, with mechanical aids if necessary.","l":2},{"t":"Reduce the depth of anesthesia.","l":2},{"t":"Consider use of reversal agents (e.g. <b>naloxone<\/b>, <b>flumazenil<\/b>) if appropriate.","l":2},{"t":"Intubate the trachea and begin mechanical ventilation if hypercarbia or hypoxemia cannot be reversed.","l":2},{"t":"If the patient is being mechanically ventilated:","l":1},{"t":"Increase the minute ventilation.","l":2},{"t":"Check for a malfunction in the ventilator or a major leak in the anesthesia breathing circuit (see Event 71, Ventilator Failure, and Event 69, Major Leak in the Anesthesia Breathing Circuit).","l":2},{"t":"Attempt to ventilate patient with alternate device (self-inflating bag, etc.) using current CO<sub>2<\/sub> monitoring system.","l":2},{"t":"Check the inspired CO<sub>2<\/sub> level; the presence of more than 1 to 2 mm Hg inspired CO<sub>2<\/sub> indicates rebreathing of CO<sub>2<\/sub> due to:","l":0},{"t":"Exhausted CO<sub>2<\/sub> absorbent in CO<sub>2<\/sub> absorber:","l":1},{"t":"Change the CO<sub>2<\/sub> absorbent.","l":2},{"t":"Increase the fresh gas flow to convert the circle system to a semiopen system.","l":2},{"t":"Incompetent valve in breathing circuit (see Event 61, Circle System Valve Stuck Open).","l":1},{"t":"Administration of exogenous CO<sub>2<\/sub>.","l":1},{"t":"Obtain an <b>ABG<\/b> to confirm hypercarbia.","l":0},{"t":"Look for causes of increased CO<sub>2<\/sub> production:","l":0},{"t":"Sepsis.","l":1},{"t":"Pyrexia.","l":1},{"t":"MH (CO<sub>2<\/sub> production will increase dramatically).","l":1},{"t":"For hypercarbia in the early postoperative period:","l":0},{"t":"Maintain controlled ventilation until adequate spontaneous ventilation can be sustained:","l":1},{"t":"If the ETT is still in place, <b>do not<\/b> remove it:","l":2},{"t":"Assist ventilation as necessary.","l":3},{"t":"If the trachea has been extubated:","l":2},{"t":"Assist ventilation with bag valve mask.","l":3},{"t":"Maintain patency of the airway.","l":3},{"t":"Consider CPAP or BiPAP.","l":3},{"t":"Reintubate the trachea if necessary.","l":3},{"t":"Use a nerve stimulator to ensure adequate reversal of neuromuscular blockade (see Event 56, Postoperative Failure to Breathe):","l":1},{"t":"Check the patient’s ability to sustain head lift for more than 5 seconds.","l":2},{"t":"If reversal of neuromuscular blockade is incomplete:","l":2},{"t":"Administer additional <b>neostigmine<\/b> to a maximum dose of <b>70 μg/kg<\/b>.","l":3},{"t":"Maintain mechanical ventilation until reversal of neuromuscular blockade is ensured.","l":3},{"t":"Reverse respiratory depressant drugs:","l":1},{"t":"Antagonize opioid effect with <b>naloxone<\/b> IV, <b>40 μg<\/b> increments.","l":2},{"t":"Antagonize benzodiazepine effect with <b>flumazenil<\/b> IV, <b>0.1 mg<\/b> increments.","l":2},{"t":"Check for syringe or ampule swaps (see Event 63, Drug Administration Error).","l":1}],"complications":[{"t":"Hypertension and tachycardia.","l":0},{"t":"Pulmonary hypertension, right heart failure.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Kavanagh BP, Laffey JG. Hypercapnia: permissive and therapeutic. Minerva Anesthesiol 2006;72:567-76."},{"t":"2. Hanson CW, Barshall BE, Frasch HF, Marchall C. Causes of hypercarbia with oxygen therapy in patients with chronic obstructive pulmonary disease. Crit Care Med 1996;24:23-8."},{"t":"3. Brockwell RC, Andrews JJ. Complications of inhaled anesthesia delivery systems. Anesthesiol Clin North America 2002;20:539-54."}]}},{"id":33,"title":"Hypoxemia During One-Lung Ventilation","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"Hypoxemia during one-lung ventilation is a fall in O<sub>2<\/sub> saturation of more than 5%, an absolute value of O<sub>2<\/sub> saturation below 90%, or a PaO<sub>2<\/sub> below 60 mm Hg.","l":0}],"etiology":[{"t":"Failure of lung isolation technique.","l":0},{"t":"Atelectasis.","l":0},{"t":"Occlusion of bronchus by secretions or blood.","l":0},{"t":"Intrinsic lung disease.","l":0},{"t":"Pulmonary shunt.","l":0},{"t":"Impairment of hypoxic pulmonary vasoconstriction (HPV) caused by vasodilators or volatile anesthetics.","l":0}],"typical":[{"t":"Thoracotomy for lung or heart surgery.","l":0},{"t":"Video-assisted thoracoscopic surgery.","l":0},{"t":"Esophagectomy.","l":0},{"t":"Anterior thoracic spine surgery.","l":0}],"prevention":[{"t":"Identify patients with increased risk of intraoperative hypoxemia:","l":0},{"t":"Optimize pulmonary function before and during anesthesia.","l":1},{"t":"<b>Avoid<\/b> or minimize use of vasodilators:","l":0},{"t":"<b>Avoid<\/b> volatile anesthetic concentrations &gt; 1 MAC.","l":1},{"t":"Maintain adequate muscle relaxation.","l":0},{"t":"Adjust FiO<sub>2<\/sub> to maintain oxygenation.","l":0},{"t":"Administer PEEP (5 to 7 cm H<sub>2<\/sub>O) to the ventilated lung.","l":0}],"manifestations":[{"t":"Decrease in O<sub>2<\/sub> saturation.","l":0},{"t":"Decrease in PaO<sub>2<\/sub> below 100 mm Hg.","l":0}],"similar":[{"t":"Mucus plug.","l":0},{"t":"Atelectasis.","l":0},{"t":"Endobronchial intubation (see Event 30, Endobronchial Intubation).","l":0},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"Pulmonary edema/ARDS (see Event 20, Pulmonary Edema).","l":0},{"t":"Pulse oximeter artifact.","l":0}],"management":[{"t":"Increase FiO<sub>2<\/sub> to <b>100%<\/b> and notify surgeon.","l":0},{"t":"Assess isolation of the lung:","l":0},{"t":"Ensure that endobronchial and tracheal cuffs are inflated.","l":1},{"t":"Perform bronchoscopy to check position of double-lumen ETT:","l":1},{"t":"Endobronchial cuff of a left-sided double-lumen ETT should be just visible in the left mainstem bronchus when looking down tracheal lumen (for a right-sided double-lumen ETT, the endobronchial cuff position requires special placement of the ETT to allow ventilation of right upper lobe bronchus).","l":2},{"t":"Adjust ETT position if necessary.","l":2},{"t":"Suction airway secretions or blood.","l":0},{"t":"Alleviate any kinks in double-lumen ETT.","l":0},{"t":"Optimize ventilation of dependent lung:","l":0},{"t":"Perform recruitment maneuver by giving large tidal volume breaths with inspiratory hold:","l":1},{"t":"This may cause hypotension.","l":2},{"t":"Institute or increase PEEP up to 10 cm H<sub>2<\/sub>O.","l":1},{"t":"Inspect ET CO<sub>2<\/sub> tracing for upsloping expiratory phase:","l":1},{"t":"Adjust ventilatory rate and/or I:E ratio if needed.","l":2},{"t":"Consider inhaled bronchodilator therapy (see Event 29, Bronchospasm).","l":2},{"t":"Insufflate O<sub>2<\/sub> to nonventilated lung and reassess oxygenation.","l":0},{"t":"Apply CPAP (2 to 5 cm H<sub>2<\/sub>O) to the nonventilated lung.","l":0},{"t":"If hypoxemia is profound, ventilate both lungs with <b>100%<\/b> O<sub>2<\/sub>.","l":0},{"t":"Discuss with surgeons whether or not to clamp the PA to decrease shunt.","l":0},{"t":"Preserve HPV:","l":0},{"t":"Discontinue IV vasodilator infusions.","l":1},{"t":"Keep volatile anesthetic dose &lt; 1 MAC.","l":1},{"t":"Evaluate for low CO state:","l":0},{"t":"Perform TEE.","l":1},{"t":"Inspect arterial waveform for pulse pressure variability:","l":1},{"t":"Administer fluid, vasopressor, inotrope, or blood as guided by above.","l":2},{"t":"Consider discontinuing surgery if patient remains unstable.","l":0},{"t":"Inhaled nitric oxide or epoprostenol can be considered but are not widely available.","l":0}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Hypoventilation (atelectasis, hypercarbia).","l":0},{"t":"Barotrauma.","l":0},{"t":"Hypotension.","l":0},{"t":"Pulmonary hypertension and RV failure.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Karzai W, Schwarzkopf K. Hypoxemia during one-lung ventilation: prediction, prevention, and treatment. Anesthesiology 2009;110:1402-11."},{"t":"2. Lohser J. Evidence-based management of one-lung ventilation. Anesthesiol Clin 2008;26:241-72."}]}},{"id":34,"title":"Massive Hemoptysis","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"Massive hemoptysis is expectoration of &gt; 600 mL of blood in 24 hours.","l":0}],"etiology":[{"t":"Pulmonary infection.","l":0},{"t":"Pulmonary neoplasm.","l":0},{"t":"Surgery or biopsy of airway structures.","l":0},{"t":"Vascular malformations.","l":0},{"t":"Erosion of a tracheostomy tube into the vascular system.","l":0},{"t":"Pulmonary venous congestion from cardiovascular disease.","l":0},{"t":"Tissue necrosis from PE.","l":0},{"t":"Chronic pulmonary disease.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Bronchiectasis.","l":2},{"t":"Cystic fibrosis.","l":2},{"t":"Coagulopathy.","l":0}],"typical":[{"t":"Thoracic trauma or surgery.","l":0},{"t":"Endobronchial ultrasound-guided biopsy.","l":0},{"t":"Pulmonary infection:","l":0},{"t":"Tuberculosis.","l":1},{"t":"Aspergilloma.","l":1},{"t":"Lung abscess.","l":1},{"t":"Pulmonary neoplasm:","l":0},{"t":"Bronchogenic or metastatic carcinoma.","l":1},{"t":"Endobronchial polyp.","l":1},{"t":"Coagulopathy.","l":0},{"t":"Pulmonary infarction.","l":0},{"t":"Mitral stenosis and/or pulmonary hypertension.","l":0},{"t":"Diffuse alveolar hemorrhage following bone marrow transplant.","l":0},{"t":"Tracheo-innominate fistula in a patient with tracheostomy.","l":0},{"t":"Rupture of the PA by the balloon of a PA catheter.","l":0},{"t":"Atheromatous or mycotic aneurysms of the thoracic aorta, or previous repair of an aneurysm of the thoracic aorta.","l":0}],"prevention":[{"t":"Prepare for the possibility of massive hemoptysis during thoracic or intrabronchial procedures.","l":0},{"t":"<b>Avoid<\/b> overinflation and persistent wedging of PA catheter.","l":0}],"manifestations":[{"t":"Coughing or vomiting of blood.","l":0},{"t":"Blood in the ETT of the anesthetized patient that does not clear with suctioning.","l":0},{"t":"<b>Hypoxemia<\/b>.","l":0},{"t":"<b>Hypercarbia<\/b>.","l":0},{"t":"<b>Hypotension<\/b>.","l":0},{"t":"<b>Bronchospasm<\/b>.","l":0}],"similar":[{"t":"Hemorrhage from oral cavity or nasopharynx.","l":0},{"t":"Hematemesis.","l":0},{"t":"Fulminant pulmonary edema (see Event 20, Pulmonary Edema).","l":0}],"management":[{"t":"<i>Distinguishing between hemoptysis or hematemesis can be difficult.<\/i>","l":0,"n":1},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> by nonrebreather face mask, with anesthesia circuit, self-inflating bag, or nonrebreather circuit.","l":0},{"t":"<b>Call for help.<\/b>","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Anesthesiology.","l":2},{"t":"Thoracic surgery.","l":2},{"t":"Pulmonology.","l":2},{"t":"IR.","l":2},{"t":"Establish <b>large-bore<\/b> IV access.","l":0},{"t":"Send blood sample for type and crossmatch, CBC, and <b>PT<\/b>/<b>aPTT<\/b>.","l":0},{"t":"Give IV fluids and vasopressors as necessary (see Event 9, Hypotension).","l":0},{"t":"Consider placement of invasive monitors when adequate help arrives.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Arterial line.","l":2},{"t":"<b>CVP<\/b> line.","l":2},{"t":"Call for difficult airway cart and rigid bronchoscope.","l":0},{"t":"If the side of pulmonary hemorrhage is known, place patient in lateral position with “bleeding side” down to prevent cross-aspiration of blood to the “good” lung.","l":0},{"t":"Intubate the patient if there is respiratory distress:","l":0},{"t":"Intubation will likely be difficult and should be done by most experienced person; if the situation allows wait for help and relevant backup equipment.","l":1},{"t":"Wear personal protective equipment (gown, gloves, face shield, glasses).","l":1},{"t":"Have suction available and turned on.","l":1},{"t":"If success with RSI and intubation is questionable, attempt awake intubation via conventional or video laryngoscopy (may be difficult due to blood in airway):","l":1},{"t":"Topical anesthesia may not be very effective.","l":2},{"t":"Perform RSI and orotracheal intubation:","l":1},{"t":"<b>Etomidate<\/b> IV, <b>0.2 to 0.3 mg/kg<\/b>, or <b>ketamine<\/b> IV, <b>0.5 to 2.0 mg/kg<\/b>.","l":2},{"t":"<b>Succinylcholine<\/b> IV, <b>1.5 to 2 mg/kg<\/b>.","l":2},{"t":"Large single-lumen ETT versus double-lumen ETT:","l":2},{"t":"Single-lumen ETT probably easier to place and allows for flexible bronchoscopy, suctioning, and possible placement of bronchial blocker.","l":3},{"t":"Double-lumen ETT may allow better and earlier lung isolation and protection from contamination, but may be much more difficult to place than single-lumen ETT.","l":3},{"t":"If intubation is unsuccessful, perform rigid bronchoscopy to establish the airway.","l":2},{"t":"Once the patient is intubated:","l":1},{"t":"Suction the ETT.","l":2},{"t":"If hypotension is not present, carefully sedate the patient to minimize cough and reduce the rate of hemorrhage:","l":2},{"t":"Fentanyl IV, <b>25 to 50 μg<\/b> q3min.","l":3},{"t":"<b>Midazolam<\/b> IV, <b>0.5 to 1 mg<\/b> q5min.","l":3},{"t":"<i>When intubated with a single-lumen ETT:<\/i>","l":0,"n":1},{"t":"If the ETT fills with blood and ventilation is impossible:","l":0},{"t":"Push the single-lumen ETT into the trachea as far as possible to perform deliberate endobronchial intubation:","l":1},{"t":"The ETT <i>may <\/i>be guided down the left mainstem bronchus by turning the patient’s head during intubation (right ear to right shoulder), or turning the tube 90 degrees toward the left side and inserting until resistance is felt.","l":2},{"t":"If the right mainstem bronchus is intubated, the upper lobe bronchus may be obstructed.","l":2},{"t":"If the ETT goes down the <i>bleeding <\/i>side:","l":1},{"t":"Place a Fogarty catheter through a Bodai connector down the ETT to occlude the bronchus, then withdraw the ETT into the trachea.","l":2},{"t":"If this fails, attempt to reposition the ETT into the nonbleeding bronchus.","l":2},{"t":"If the ETT goes down the <i>nonbleeding <\/i>side:","l":1},{"t":"Suction the ETT to remove residual blood.","l":2},{"t":"<i>If changing from a single-lumen ETT to a double-lumen ETT:<\/i>","l":0,"n":1},{"t":"With significant hemoptysis, this tube change can be difficult and risks losing the airway entirely.","l":1},{"t":"Administer muscle relaxant.","l":1},{"t":"Place an airway exchange catheter, making sure it is long enough.","l":1},{"t":"Remove the single-lumen ETT and reintubate the trachea with the double-lumen ETT:","l":1},{"t":"The use of direct laryngoscopy during this procedure will help double-lumen ETT placement through the larynx.","l":2},{"t":"Passing the double-lumen ETT blindly over the guide can be difficult.","l":1},{"t":"Ventilate with <b>100%<\/b> FiO<sub>2<\/sub>:","l":0},{"t":"Monitor oxygenation via pulse oximetry and repeated ABGs.","l":1},{"t":"<b>Avoid<\/b> high airway pressures if possible to <b>avoid<\/b> air embolism.","l":1},{"t":"Prepare for and administer massive transfusion if necessary (see Event 1, Acute Hemorrhage).","l":0},{"t":"In consultation with thoracic surgeon, pulmonologist, and an interventional radiologist:","l":0},{"t":"Bronchoscopy may be the most appropriate and easiest first step for diagnosis.","l":1},{"t":"CXR may identify the likely site of bleeding.","l":1},{"t":"High-resolution CT scan is the most efficient means of localizing bleeding, identifying the cause, and guiding treatment.","l":1},{"t":"Arteriography or bronchography are indicated if the bleeding is not catastrophic.","l":1},{"t":"<b>Control the bleeding:<\/b>","l":0},{"t":"Correct any coagulopathy.","l":1},{"t":"Interventional radiologist may be able to embolize bronchial, pulmonary, and/or intercostal arteries.","l":1},{"t":"Interventional pulmonary procedures include:","l":1},{"t":"Endobronchial infusions of procoagulants.","l":2},{"t":"Laser photocoagulation.","l":2},{"t":"Topical vasoconstrictors and ice-cold saline instillation.","l":2},{"t":"Occlusion of the bronchus leading to the bleeding site with a Fogarty balloon catheter or Arndt endobronchial blocker.","l":2},{"t":"Emergency thoracotomy:","l":1},{"t":"Should be reserved for those patients with adequate lung function in whom the site of hemorrhage can be identified and who continue to suffer massive hemoptysis.","l":2}],"complications":[{"t":"Aspiration pneumonitis.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Systemic air embolism from mechanical ventilation.","l":0},{"t":"Atelectasis.","l":0},{"t":"Hypotension.","l":0},{"t":"Prolonged intubation.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Maguire MF, Berry CB, Gellett L, Berrisford RG. Catastrophic haemoptysis during rigid bronchoscopy: a discussion of treatment options to salvage patients during catastrophic haemoptysis at rigid bronchoscopy. Interact Cardiovasc Thorac Surg 2004;3:222-5."},{"t":"2. Ong TH, Eng P. Massive hemoptysis requiring intensive care. Intensive Care Med 2003;29:317-20."},{"t":"3. Garwood S, Strange C, Sahn S. Massive hemoptysis. In: Parrillo JP, Dellinger RP, editors. Critical care medicine. Philadelphia: Mosby; 2008. p. 929-48."}]}},{"id":35,"title":"Pneumothorax","ch":7,"cat":"Pulmonary Events","s":{"definition":[{"t":"Pneumothorax is the presence of gas in the pleural space.","l":0}],"etiology":[{"t":"Connection from the atmosphere to the pleural cavity.","l":0},{"t":"Rupture of an alveolus, emphysematous bulla, or bronchus into the pleural cavity.","l":0}],"typical":[{"t":"Following CVP line placement:","l":0},{"t":"Subclavian or internal jugular approach.","l":1},{"t":"Regional nerve blocks:","l":0},{"t":"Intercostal or paravertebral blocks.","l":1},{"t":"Supraclavicular or infraclavicular brachial plexus block.","l":1},{"t":"Stellate ganglion block.","l":1},{"t":"Procedures or surgery in close proximity to the pleural cavity:","l":0},{"t":"Percutaneous, transpulmonary, or transbronchial needle biopsy of the lung.","l":1},{"t":"Pleurocentesis.","l":1},{"t":"Surgery:","l":1},{"t":"Nephrectomy.","l":2},{"t":"Splenectomy.","l":2},{"t":"Esophageal.","l":2},{"t":"Laparoscopic.","l":2},{"t":"Esophagoscopy:","l":1},{"t":"Bronchoscopy.","l":2},{"t":"Mediastinoscopy.","l":2},{"t":"Or.","l":2},{"t":"Percutaneous liver biopsy and other interventional procedures.","l":1},{"t":"Spontaneous pneumothorax in patients with or without bullous disease of the lungs.","l":0},{"t":"Barotrauma from ventilation of the lungs with a high PIP:","l":0},{"t":"Excessive tidal volume.","l":1},{"t":"Expiratory obstruction of the breathing circuit.","l":1},{"t":"Ball valve effects in trachea or bronchus due to tumor or endobronchial cuff of double-lumen ETT.","l":1},{"t":"Parenchymal
