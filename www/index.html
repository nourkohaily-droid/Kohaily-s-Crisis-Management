:0},{"t":"<b>ABG<\/b>, HCT, electrolytes, cardiac biomarkers.","l":1},{"t":"<b>Consider additional monitoring:<\/b>","l":0},{"t":"Arterial line, <b>CVP<\/b> line, TEE.","l":1},{"t":"Administer aspirin (PO, NGT, or PR) <b>325 mg<\/b>.","l":0},{"t":"Treat arrhythmias according to ACLS protocol (see Event 19, Nonlethal Ventricular Arrhythmias).","l":0},{"t":"In case of STEMI:","l":0},{"t":"Obtain stat interventional cardiology consult and alert cardiac catheterization laboratory of your concerns for management.","l":1},{"t":"Terminate surgery <b>as soon as possible<\/b> and prepare patient for transport to cardiac catheterization lab.","l":1},{"t":"Evaluate and treat cardiogenic shock:","l":1},{"t":"Consider treating with vasopressors and/or ionotropes to improve end-organ perfusion:","l":2},{"t":"Dopamine IV infusion, <b>2 to 10 μg/kg/min<\/b>.","l":3},{"t":"<b>Norepinephrine<\/b> IV infusion, 10 to 100 ng/kg/min.","l":3},{"t":"Consider mechanical support with IABP or percutaneous left ventricular assist device (LVAD) for patients not responding to pharmacologic support.","l":2},{"t":"Consider antiplatelet therapy and anticoagulant therapy:","l":1},{"t":"Weigh risk of bleeding from recent surgery against benefit of improved mortality from ACS; requires joint discussion with cardiologist and surgeon.","l":2},{"t":"Request ICU bed for postoperative care.","l":1}],"complications":[{"t":"Heart failure.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"Thromboembolic complications.","l":0},{"t":"Papillary muscle dysfunction or rupture.","l":0},{"t":"Rupture of the interventricular septum or the ventricular wall.","l":0}],"reading":[{"t":"1. Antman EM, Anbe DT, Armstrong PW, et al. ACC/AHA guidelines for the management of patients with ST-elevation myocardial infarction: a report of the American College of Cardiology/American Heart Association Task Force on Practice Guidelines (committee to revise the 1999 guidelines for the management of patients with acute myocardial infarction). Circulation 2004;110:e82-e292."},{"t":"2. Anderson JL, Adams CD, Antman EM, et al. ACC/AHA 2007 guidelines for the management of patients with unstable angina/non-ST-Elevation myocardial infarction: a report of the American College of Cardiology/ American Heart Association Task Force on Practice Guidelines (writing committee to revise the 2002 guidelines for the management of patients with unstable angina/non-ST-elevation myocardial infarction) developed in collaboration with the American College of Emergency Physicians, the Society for Cardiovascular Angiography and Interventions, and the Society of Thoracic Surgeons endorsed by the American Association of Cardiovascular and Pulmonary Rehabilitation and the Society for Academic Emergency Medicine. J Am Coll Cardiol 2007;50:e1-e157."},{"t":"3. Thiele H, Sick P, Boudriot E, et al. Randomized comparison of intra-aortic balloon support with a percutaneous left ventricular assist device in patients with revascularized acute myocardial infarction complicated by cardiogenic shock. Eur Heart J 2005;26:1276-83."},{"t":"4. Eagle KA, Guyton RA, Davidoff R, et al. ACC/AHA 2004 guideline update for coronary artery bypass graft surgery: a report of the American College of Cardiology/American Heart Association Task Force on Practice Guidelines (committee to update the 1999 guidelines for coronary artery bypass graft surgery). Circulation 2004;110:e340-e437."}]}},{"id":16,"title":"Anaphylactic and Anaphylactoid Reactions","ch":6,"cat":"Cardiovascular Events","s":{"definition":[{"t":"Anaphylactic and anaphylactoid reactions are serious allergic reactions that are rapid in onset and may cause death.","l":0},{"t":"<i>Anaphylactic reaction <\/i>(immunologic) involves antigen and IgE antibodies; requires previous sensitization to the antigen.","l":1},{"t":"<i>Anaphylactoid reaction <\/i>(nonimmunologic) mediated primarily by histamine; may occur with the first exposure to a triggering agent.","l":1},{"t":"<i>Complement activation <\/i>may follow both immunologic and nonimmunologic reactions.","l":1}],"etiology":[{"t":"Administration or exposure to an agent that the patient has been sensitized to by prior exposure, with production of antigen-specific IgE (anaphylactic reaction).","l":0},{"t":"Allergic reaction to agent requiring no previous exposure (anaphylactoid reaction).","l":0}],"typical":[{"t":"<i>The true incidence is unknown, but is estimated at 1 in 10,000 to 1 in 20,000 anesthetic pro<i>cedures. Approximately 1500 deaths occur each year in the United States from anaphylaxis in all settings.<\/i><\/i>","l":0},{"t":"In patients with a known allergy or sensitivity to a specific agent or with conditions making a reaction to an agent more likely:","l":0},{"t":"Allergic reactions to protamine are more likely in patients with fish allergy, prior protamine administration, or after treatment with protamine-zinc insulin.","l":1},{"t":"Patients with a history of allergy to nondrug allergens have a higher risk of anaphylaxis during anesthesia.","l":1},{"t":"After exposure to substances that can trigger anaphylactic or anaphylactoid reactions:","l":0},{"t":"Neuromuscular blocking drugs (60% of anesthesia-related anaphylaxis).","l":1},{"t":"Latex (20% of anesthesia-related anaphylaxis).","l":1},{"t":"Antibiotics:","l":1},{"t":"15% of anesthesia-related anaphylaxis, with penicillins and cephalosporins responsible for 70% of antibiotic induced anaphylaxis.","l":2},{"t":"Opioids.","l":1},{"t":"Amino-ester local anesthetic agents.","l":1},{"t":"Blood and blood products.","l":1},{"t":"Iodinated contrast material.","l":1},{"t":"Chlorhexidine preparation solutions.","l":1},{"t":"Individuals with frequent latex exposure:","l":1},{"t":"Health care workers.","l":2},{"t":"Patients who have undergone multiple surgical procedures.","l":2},{"t":"Patients who require intermittent bladder catheterization:","l":2},{"t":"SCI patients.","l":3},{"t":"Chronic care patients.","l":3}],"prevention":[{"t":"<b>Avoid<\/b> agents to which the patient has a documented allergy.","l":0},{"t":"Minimize the use of latex products in health care:","l":0},{"t":"In the United States many institutions have replaced most products with latex-free versions.","l":1},{"t":"If there is a history of latex allergy, establish a latex-free environment:","l":0},{"t":"<b>Avoid<\/b> contact with or manipulation of latex devices.","l":1},{"t":"Use nonlatex surgical gloves.","l":1},{"t":"Use syringe/stopcock or unidirectional valves for injecting medications.","l":1},{"t":"<b>Do not<\/b> insert a needle through any multiple-dose vial with a natural rubber stopper:","l":1},{"t":"Take the top of the vial completely off.","l":2},{"t":"Use medication from a glass ampule, if available.","l":2},{"t":"Use glass syringes with glass plunger or plastic syringes with known non-latex plungers. (Check manufacturer for materials used.).","l":1},{"t":"Obtain a careful history of:","l":0},{"t":"Previous allergic reactions.","l":1},{"t":"Atopy.","l":1},{"t":"Asthma.","l":1},{"t":"Significant latex exposure.","l":1},{"t":"<b>Avoid<\/b> transfusion of blood or blood products whenever possible:","l":0},{"t":"Check the identity of the patient and blood products carefully prior to transfusion.","l":1},{"t":"If a specific drug <b>must<\/b> be administered to a patient known to be at risk of an allergic reaction, administer <b>prophylaxis<\/b>:","l":0},{"t":"Corticosteroids:","l":1},{"t":"<b>Dexamethasone<\/b> IV, <b>20 mg<\/b>, or <b>methylprednisolone<\/b> IV, <b>100 mg<\/b>.","l":2},{"t":"H1 antagonist:","l":1},{"t":"<b>Diphenhydramine<\/b> IV, <b>25 to 50 mg<\/b>.","l":2},{"t":"Administer a test dose of drug.","l":1},{"t":"Obtain a consultation from an allergist if a critical allergy <b>must<\/b> be defined.","l":0}],"manifestations":[{"t":"<i>Anaphylaxis has the potential for acute onset with catastrophic consequences. Severe hypo<i>tension, increased PIP, and <b>hypoxemia<\/b> are the most common initial signs but need not be present simultaneously.<\/i><\/i>","l":0},{"t":"Cardiovascular:","l":0},{"t":"The awake patient may complain of dizziness or lose consciousness.","l":1},{"t":"Severe <b>hypotension<\/b>.","l":1},{"t":"<b>Bradycardia<\/b>—may be initial sign.","l":1},{"t":"<b>Arrhythmias<\/b>.","l":1},{"t":"<b>Cardiac arrest<\/b>.","l":1},{"t":"Respiratory:","l":0},{"t":"The awake patient may complain of dyspnea or chest tightness.","l":1},{"t":"<b>Hypoxemia<\/b>.","l":1},{"t":"Decreased lung compliance.","l":1},{"t":"Severe <b>bronchospasm<\/b>.","l":1},{"t":"Cutaneous—may be obscured by surgical drapes:","l":0},{"t":"Flushing, hives, <b>urticaria<\/b>, pruritus.","l":1},{"t":"Swelling of mucosal membranes, conjunctiva, lips, tongue, and uvula.","l":0}],"similar":[{"t":"Anesthetic overdose (see Event 72, Volatile Anesthetic Overdose).","l":0},{"t":"Pulmonary edema (see Event 20, Pulmonary Edema).","l":0},{"t":"Hypotension from other causes (see Event 9, Hypotension).","l":0},{"t":"ACS (see Event 15, Acute Coronary Syndrome).","l":0},{"t":"Cardiac tamponade (see Event 18, Cardiac Tamponade).","l":0},{"t":"Venous air embolism (see Event 24, Venous Air or Gas Embolism).","l":0},{"t":"Vasovagal reaction.","l":0},{"t":"Septic shock (see Event 13, The Septic Patient).","l":0},{"t":"Drug administration error (see Event 63, Drug Administration Error).","l":0},{"t":"Stridor (see Event 36, Postoperative Stridor).","l":0},{"t":"PE (see Event 21, Pulmonary Embolism).","l":0},{"t":"Aspiration of gastric contents (see Event 28, Aspiration of Gastric Contents).","l":0},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"Skin manifestations of drug reactions not associated with anaphylaxis.","l":0},{"t":"Transfusion reaction (see Event 50, Transfusion Reaction).","l":0},{"t":"Fat embolism syndrome.","l":0},{"t":"Amniotic fluid embolism (see Event 81, Amniotic Fluid Embolism).","l":0}],"management":[{"t":"Stop administration of any possible antigen:","l":0},{"t":"Retain blood products for analysis.","l":1},{"t":"Remove all latex-containing products from contact with the patient.","l":1},{"t":"Inform the surgeons and call for help:","l":0},{"t":"Check to see whether they have injected or instilled a substance into a body cavity.","l":1},{"t":"Consider aborting the surgical procedure if severe:","l":1},{"t":"Anaphylaxis may be biphasic and can recur after successful initial treatment.","l":2},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub>.","l":1},{"t":"Intubate the trachea if not already intubated:","l":1},{"t":"The airway can rapidly become very edematous making intubation (or extubation) more difficult or impossible.","l":2},{"t":"<b>Treat hypotension:<\/b>","l":0},{"t":"<b>Epinephrine<\/b> is the drug of choice for treatment of anaphylaxis:","l":1},{"t":"For mild to moderate hypotension, administer <b>epinephrine<\/b> IV, <b>10 to 50 μg<\/b> increments, and repeat as necessary with escalating doses.","l":2},{"t":"For cardiovascular collapse or cardiac arrest, administer <b>epinephrine<\/b> IV, <b>500 to 1000 μg<\/b> boluses, and repeat as necessary (see Event 2, Cardiac Arrest).","l":2},{"t":"Administer <b>vasopressin<\/b> IV, 10 to 40 U, in cases of anaphylactic shock resistant to catecholamines; in pulseless arrest, follow the ACLS pulseless arrest algorithm.","l":1},{"t":"<b>Norepinephrine<\/b> infusion may be required.","l":1},{"t":"<b>Glucagon<\/b> IV, <b>1 to 5 mg<\/b>, may be useful in patients receiving β-blocker therapy who <b>do not<\/b> respond to <b>epinephrine<\/b>.","l":1},{"t":"<b>Methylene blue<\/b> IV, <b>10 to 50 mg<\/b>, has been successfully used in catecholamine- and <b>vasopressin<\/b>-resistant anaphylaxis.","l":1},{"t":"Rapidly expand the circulating fluid volume:","l":0},{"t":"Place patient in Trendelenburg position.","l":1},{"t":"Immediate fluid needs may be massive (several liters of <b>crystalloid<\/b>).","l":1},{"t":"Ensure adequate IV access.","l":1},{"t":"Decrease or stop administration of anesthetic agents if hypotension is severe.","l":0},{"t":"If bronchospasm is present:","l":0},{"t":"Administer bronchodilator:","l":1},{"t":"<b>Albuterol<\/b> metered dose inhaler (MDI), 5 to 10 puffs.","l":2},{"t":"Volatile anesthetics may be administered for bronchodilation if the patient is normotensive.","l":1},{"t":"Administer an H1 and H2 histamine antagonist:","l":0},{"t":"<b>Diphenhydramine<\/b> IV, <b>50 mg<\/b>.","l":1},{"t":"Ranitidine IV, <b>50 mg<\/b>.","l":1},{"t":"<b>Administer corticosteroids:<\/b>","l":0},{"t":"This is not helpful for the acute event, but may reduce risk of further episodes.","l":1},{"t":"<b>Dexamethasone<\/b> IV, <b>20 mg<\/b> bolus, or <b>methylprednisolone<\/b> IV, <b>100 mg<\/b> bolus.","l":1},{"t":"In the absence of any other cause, consider latex allergy:","l":0},{"t":"Ensure all latex products in contact with the patient have been removed from the surgical field (double check whether these products do or <b>do not<\/b> contain latex):","l":1},{"t":"Surgical gloves.","l":2},{"t":"Urinary catheter.","l":2},{"t":"Medications drawn up through a latex stopper.","l":2},{"t":"Place invasive monitors to help guide fluid and vasopressor management:","l":1},{"t":"Arterial line.","l":2},{"t":"<b>CVP<\/b> or PA catheter.","l":2},{"t":"TTE or TEE.","l":2},{"t":"Urinary catheter.","l":2},{"t":"Obtain blood sample for measurement of mast cell tryptase within 2 hours of onset to confirm diagnosis of anaphylactic reaction.","l":1},{"t":"Arrange admission to an ICU for postoperative management and observation.","l":1},{"t":"Consider referring patient to an allergist on discharge from the hospital.","l":1}],"complications":[{"t":"Inability to intubate, ventilate, or oxygenate.","l":0},{"t":"Hypertension, tachycardia from vasopressors.","l":0},{"t":"ARDS.","l":0},{"t":"Renal failure.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"Anoxic brain injury.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Dewachter P, Mouton-Faivre C, Emala CW. Anaphylaxis and anesthesia. Anesthesiology 2009;111:1141-50."},{"t":"2. Harper NJ, Dixon T, Dugué P, et al. Working Party of the Association of Anaesthetists of Great Britain and Ireland. Suspected anaphylactic reactions associated with anaesthesia. Anaesthesia 2009;64:199-211."},{"t":"3. Sampson HA, Muñoz-Furlong A, Bock SA, et al. Symposium on the definition and management of anaphylaxis: summary report. J Allergy Clin Immunol 2005;115:584-91."},{"t":"4. Mertes PM, Malinovsky JM, Jouffroy L, et al. Reducing the risk of anaphylaxis during anesthesia: 2011 updated guidelines for clinical practice. J Investig Allergol Clin Immunol 2011;21:442-53."}]}},{"id":17,"title":"Autonomic Dysreflexia","ch":6,"cat":"Cardiovascular Events","s":{"definition":[{"t":"Autonomic dysreflexia (AD) is a massive, unopposed, reflex sympathetic discharge triggered by a noxious stimulus below the level of a chronic SCI.","l":0}],"etiology":[{"t":"Bladder or urinary tract distention.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Instrumentation.","l":2},{"t":"Infection.","l":2},{"t":"Calculi of the urinary tract.","l":2},{"t":"Lower GI tract stimulation, e.g. bowel distention from any cause.","l":0},{"t":"Performance of a surgical procedure below the level of an SCI with inadequate anesthesia/ analgesia.","l":0},{"t":"Skin stimulation.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Pressure sore.","l":2},{"t":"Ingrown toenail.","l":2},{"t":"Tight-fitting clothing.","l":2},{"t":"Exposure to temperature extremes.","l":0},{"t":"Medications.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Nasal decongestants.","l":2},{"t":"Sympathomimetic drugs.","l":2},{"t":"Misoprostol.","l":2}],"typical":[{"t":"In patients with SCI, usually at least 6 weeks after the injury.","l":0},{"t":"In patients whose level of SCI is at or above T6 (the higher and more complete the lesion, the higher the incidence).","l":0},{"t":"During performance of urologic procedures.","l":0},{"t":"such as:","l":1,"e":1},{"t":"Bladder catheterization.","l":2},{"t":"Cystoscopy.","l":2},{"t":"Cystometrography.","l":2},{"t":"In patients with disorders of the lower GI tract.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Fecal impaction.","l":2},{"t":"Hemorrhoids.","l":2},{"t":"Anal fissure.","l":2},{"t":"During procedures involving the rectum or colon.","l":0},{"t":"During recovery from neuraxial, regional, or general anesthesia.","l":0},{"t":"During labor and delivery.","l":0}],"prevention":[{"t":"Obtain a thorough history from patients with SCI.","l":0},{"t":"They are often aware of some of the stimuli that will evoke this response.","l":0},{"t":"<b>Avoid<\/b> stimuli known to trigger AD if possible.","l":0},{"t":"Check the baseline BP for comparison with perioperative values.","l":0},{"t":"Consider preoperative <b>prophylaxis<\/b> of patients at risk of AD:","l":0},{"t":"Clonidine <b>0.2 to 0.4 mg<\/b> PO, preoperatively.","l":1},{"t":"Nifedipine <b>10 mg<\/b> SL, <b>immediately<\/b> preoperatively.","l":1},{"t":"Phenoxybenzamine <b>10 mg<\/b> PO, 3 times daily to maximum of 60 mg/day.","l":1},{"t":"Prazosin <b>6 to 15 mg<\/b> PO.","l":1},{"t":"Provide adequate regional or general anesthesia and postoperative analgesia for a surgical procedure.","l":0}],"manifestations":[{"t":"Acute, paroxysmal onset of severe systolic and diastolic <b>hypertension<\/b>:","l":0},{"t":"Normal BP in most SCI patients is low, so reference the change in BP to the patient’s resting value.","l":1},{"t":"Increased blood loss from surgical site.","l":1},{"t":"Reflex <b>bradycardia<\/b>:","l":1},{"t":"<b>Tachycardia<\/b> and <b>arrhythmias<\/b> may also occur.","l":2},{"t":"Additional signs of sympathetic hyperreactivity:","l":0},{"t":"Below the level of SCI: cool, pale skin; pilomotor erection; spastic muscle contraction and increased muscle tone; penile erection.","l":1},{"t":"Above level of SCI: sweating, vasodilation and flushing of the skin, mydriasis, nasal and conjunctival congestion, eyelid retraction.","l":1},{"t":"If the patient is awake:","l":0},{"t":"Severe pounding headache, blurred vision, nasal congestion, dyspnea, nausea, or anxiety.","l":1}],"similar":[{"t":"Light anesthesia.","l":0},{"t":"Vasopressor overdose.","l":0},{"t":"Preeclampsia/eclampsia in pregnant SCI patient (see Event 88, Preeclampsia and Eclampsia).","l":0},{"t":"Intraoperative hypertension from other causes (see Event 8, Hypertension).","l":0},{"t":"Pheochromocytoma.","l":0},{"t":"Migraine and cluster headaches.","l":0}],"management":[{"t":"Verify the BP; check for additional signs and symptoms of sympathetic hyperreactivity.","l":0},{"t":"Inform the surgeon and ask for the surgical stimulus to be stopped, e.g. drain bladder.","l":0},{"t":"Place patient in reverse Trendelenburg position to facilitate venous pooling in lower extremities.","l":0},{"t":"If the patient is under general anesthesia:","l":0},{"t":"Increase the depth of anesthesia:","l":1},{"t":"Increase the inspired concentration of volatile anesthetic.","l":2},{"t":"Administer additional opioid (e.g, fentanyl IV, <b>25 to 50 μg<\/b>).","l":2},{"t":"If hypertension persists, administer drugs with rapid onset and short duration:","l":1},{"t":"Phentolamine <b>2 to 10 mg<\/b> IV, titrated to effect.","l":2},{"t":"Sodium <b>nitroprusside<\/b> IV infusion, <b>0.2 to 1.0 μg/kg/min<\/b>, titrated to effect with <b>arterial line<\/b> monitoring.","l":2},{"t":"AD may occur during emergence and recovery.","l":1},{"t":"If the patient is awake:","l":0},{"t":"For less severe hypertension:","l":1},{"t":"NTG 0.4 mg/spray into oral cavity.","l":2},{"t":"Nitropaste <b>2%<\/b>, 1 inch applied to the skin above the level of the SCI.","l":2},{"t":"Captopril <b>25 mg<\/b> SL.","l":2},{"t":"Nifedipine <b>10 mg<\/b> capsule, bitten and swallowed.","l":2},{"t":"For severe elevation in BP:","l":1},{"t":"Phentolamine <b>2 to 10 mg<\/b> IV, titrated to effect.","l":2},{"t":"Sodium <b>nitroprusside<\/b> IV infusion, <b>0.2 to 2.0 μg/kg/min<\/b>, titrated to effect with <b>arterial line<\/b> monitoring.","l":2},{"t":"If AD resolves, continue with surgery (AD may recur).","l":1},{"t":"If AD does not resolve with treatment:","l":0},{"t":"Abort surgery if possible.","l":1},{"t":"Place an additional peripheral IV or a <b>CVP<\/b> line to administer potent vasodilators.","l":1},{"t":"Insert an <b>arterial line<\/b> if not already done.","l":1}],"complications":[{"t":"Myocardial ischemia or infarction.","l":0},{"t":"Pulmonary edema.","l":0},{"t":"Hypertensive encephalopathy or stroke.","l":0},{"t":"Atrial and ventricular arrhythmias, heart block.","l":0},{"t":"Seizures, coma, intracerebral or subarachnoid hemorrhage.","l":0},{"t":"Increased surgical blood loss.","l":0},{"t":"Hypotension secondary to therapy with vasodilators.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Hambly PR, Martin B. Anaesthesia for chronic spinal cord lesions. Anaesthesia 1998;53:273-89."},{"t":"2. Krassioukov A, Warburton DE, Teasell R, Eng JJ. A systematic review of the management of autonomic dysreflexia after spinal cord injury. Arch Phys Med Rehabil 2009;90:682-95."},{"t":"3. Milligan J, Lee J, McMillan C, Klassen H. Autonomic dysreflexia: recognizing a common serious condition in patients with spinal cord injury. Can Fam Physician 2012;58:831-5."},{"t":"4. Skowronski E, Hartman K. Obstetric management following traumatic tetraplegia: case series and literature review. Aust N Z J Obstet Gynaecol 2008;48:485-91."},{"t":"5. Blackmer J. Rehabilitation medicine: 1. Autonomic dysreflexia. CMAJ 2003;169:931-5."}]}},{"id":18,"title":"Cardiac Tamponade","ch":6,"cat":"Cardiovascular Events","s":{"definition":[{"t":"Cardiac tamponade is the accumulation of blood, a blood clot, or fluid in the pericardial space, limiting ventricular filling and resulting in hemodynamic compromise.","l":0}],"etiology":[{"t":"Bleeding after cardiac surgery.","l":0},{"t":"Coagulopathy.","l":0},{"t":"Cardiac perforation.","l":0},{"t":"Rheumatologic or autoimmune diseases.","l":0},{"t":"Pericardial malignancy or tumor metastasis.","l":0},{"t":"Pericardial infection, typically as a complication of sepsis.","l":0},{"t":"Chronic renal failure.","l":0},{"t":"Radiation-induced pericardial effusion.","l":0}],"typical":[{"t":"Idiopathic.","l":0},{"t":"Iatrogenic:","l":0},{"t":"Post cardiac surgery:","l":1},{"t":"Clots may cause tamponade even in the presence of an open pericardium and patent mediastinal drains.","l":2},{"t":"Erosion of CVP catheter, especially through right atrial wall.","l":1},{"t":"Invasive cardiac procedure:","l":1},{"t":"PCI.","l":2},{"t":"Electrophysiologic procedure.","l":2},{"t":"Percutaneous valve repair/replacement.","l":2},{"t":"Trauma, including gun shot wounds (may be insidious in onset).","l":0},{"t":"Malignancy.","l":0},{"t":"End-stage renal disease.","l":0},{"t":"Collagen vascular disease.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Systemic lupus erythematosus.","l":2},{"t":"Scleroderma.","l":2},{"t":"Post MI:","l":0},{"t":"Myocardial rupture, consequences of anticoagulant or thrombolytic therapy.","l":1},{"t":"Bacterial infection, e.g. tuberculosis.","l":0},{"t":"Aortic dissection.","l":0},{"t":"Radiation therapy to the mediastinum.","l":0}],"prevention":[{"t":"Achieve and maintain hemostasis during and after cardiothoracic surgery.","l":0},{"t":"Treat coagulopathy.","l":0},{"t":"Place central lines and pacemaker leads carefully:","l":0},{"t":"<b>CVP<\/b> catheter tip should be at the junction of the superior vena cava (SVC) and right atrium.","l":1},{"t":"Obtain a CXR following placement to confirm the position of the <b>CVP<\/b> catheter tip when feasible.","l":1},{"t":"Treat and control underlying medical problems that predispose the patient to pericardial effusion.","l":0},{"t":"Perform pericardiocentesis of large pericardial effusion prior to surgery.","l":0}],"manifestations":[{"t":"Beck triad:","l":0},{"t":"Distant heart sounds, jugular venous distension, <b>hypotension<\/b>.","l":1},{"t":"<b>Tachycardia<\/b>, decreased CO.","l":0},{"t":"Narrow pulse pressure, exaggeration of pulsus paradoxus:","l":0},{"t":"Normal limit of pulsus paradoxus is a decrease in SBP on inspiration of less than 10 mm Hg.","l":1},{"t":"Equalization of cardiac diastolic filling pressures at a relatively high value (right atrial pressure, PA diastolic pressure, PA wedge pressure).","l":0},{"t":"Dyspnea, orthopnea.","l":0},{"t":"Following cardiac surgery:","l":0},{"t":"Consider tamponade in the differential diagnosis of any patient with low CO.","l":1},{"t":"Increased drainage followed by decreased drainage from the mediastinal chest tube.","l":1},{"t":"Pericardial fluid visible on TEE or TTE in conjunction with:","l":0},{"t":"Atrial and/or ventricular collapse.","l":1},{"t":"Abnormal ventricular septal motion with respiration.","l":1},{"t":"IVC plethora, i.e. lack of the normal inspiratory collapse of the IVC on TTE.","l":1},{"t":"Low-amplitude ECG with ST changes and/or electrical alternans.","l":0},{"t":"Increased size and bottle shape of the cardiac silhouette on CXR.","l":0}],"similar":[{"t":"Congestive heart failure.","l":0},{"t":"Constrictive pericarditis.","l":0},{"t":"Exacerbation of asthma or COPD (see Event 29, Bronchospasm).","l":0},{"t":"Hypovolemia.","l":0},{"t":"ACS (see Event 15, Acute Coronary Syndrome).","l":0},{"t":"Acute aortic dissection.","l":0},{"t":"PE (see Event 21, Pulmonary Embolism).","l":0},{"t":"Acute RV infarction.","l":0},{"t":"Tension pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"Restrictive cardiomyopathy.","l":0},{"t":"Auto-PEEP.","l":0}],"management":[{"t":"<i>The pericardium has low compliance, and the rate of fluid accumulation will determine the rapidity of onset of symptoms. Rapid accumulation of 150 to 200 mL of blood or fluid can critically compromise myocardial function.<\/i>","l":0,"n":1},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Administer supplemental O<sub>2<\/sub> by nonrebreathing face mask.","l":1},{"t":"Expand and maintain the circulating fluid volume:","l":0},{"t":"Ensure adequate IV access.","l":1},{"t":"Place additional <b>large-bore<\/b> IV catheters as needed.","l":1},{"t":"Rapidly administer <b>250 to 500 mL crystalloid<\/b>.","l":1},{"t":"Place invasive monitoring lines as indicated:","l":0},{"t":"Arterial line.","l":1},{"t":"<b>CVP<\/b> catheter for monitoring and drug administration.","l":1},{"t":"PA catheter for monitoring of cardiac filling pressures and CO.","l":1},{"t":"<b>Support the circulation:<\/b>","l":0},{"t":"<b>Phenylephrine<\/b> IV, <b>100 to 200 μg<\/b>; may repeat and increase dose as needed.","l":1},{"t":"<b>Epinephrine<\/b> IV, <b>5 to 10 μg<\/b>; may repeat and increase dose as needed.","l":1},{"t":"<b>Vasopressin<\/b> IV, 1 to 2 U; may repeat and increase dose as needed.","l":1},{"t":"<b>Norepinephrine<\/b> IV, <b>8 to 16 μg<\/b>; may repeat and increase dose as needed.","l":1},{"t":"Commence infusions of vasopressors as needed.","l":1},{"t":"Confirm diagnosis with TEE or TTE.","l":0},{"t":"Consider CXR if patient is stable.","l":0},{"t":"Apply and connect external defibrillator pads.","l":0},{"t":"If the patient has had recent cardiothoracic surgery:","l":0},{"t":"Call for cardiac surgeon stat.","l":1},{"t":"Open the chest <b>immediately<\/b> to relieve the cardiac tamponade.","l":1},{"t":"Prepare the OR for possible mediastinal exploration:","l":1},{"t":"Notify nursing staff and perfusionist.","l":2},{"t":"If the patient has NOT had recent cardiothoracic surgery:","l":0},{"t":"Perform subxiphoid pericardiocentesis:","l":1},{"t":"This may remove enough fluid to temporarily improve the patient’s condition prior to emergency surgery.","l":2},{"t":"A negative aspiration does not exclude cardiac tamponade.","l":2},{"t":"<i>If cardiac tamponade is suspected and the patient is stable.<\/i>","l":0},{"t":"Review the patient’s history.","l":0},{"t":"Check coagulation status of the patient:","l":0},{"t":"<b>PT<\/b> and <b>PTT<\/b>.","l":1},{"t":"Platelet count.","l":1},{"t":"Platelet function.","l":1},{"t":"<b>ACT<\/b>.","l":1},{"t":"Thromboelastogram (<b>TEG<\/b>).","l":1},{"t":"Monitor the patient using invasive techniques.","l":0},{"t":"Obtain CXR and TEE or TTE for diagnosis.","l":0},{"t":"Obtain consultation from a cardiologist and/or cardiothoracic surgeon for definitive treatment.","l":0},{"t":"<i>Anesthetic management of the patient with cardiac tamponade:<\/i>","l":0,"n":1},{"t":"Hemodynamic goals are best described as keeping the patient fast (tachycardia), full (hypervolemia), and tight (increased SVR):","l":0},{"t":"Maintain HR in the range of 90 to 140 bpm.","l":1},{"t":"Optimize filling pressures to compensate for the vasodilation that occurs with induction of anesthesia:","l":1},{"t":"Administer fluid bolus (<b>250 to 500 mL crystalloid<\/b>).","l":2},{"t":"Consider femoral venous and arterial cannulation for emergent CPB if difficult surgical exposure is anticipated.","l":2},{"t":"Maintain spontaneous ventilation as long as possible, as it augments venous return and maintains CO:","l":1},{"t":"With positive pressure ventilation, use low airway pressure without PEEP to minimize decrease in venous return.","l":2},{"t":"Consider prepping and draping patient prior to induction of general anesthesia.","l":1},{"t":"For anesthesia, use drugs that <b>do not<\/b> decrease sympathetic output:","l":1},{"t":"<b>Ketamine<\/b> IV, <b>0.25 to 1 mg/kg<\/b>:","l":2},{"t":"Should still anticipate hemodynamic compromise.","l":3},{"t":"Use <b>succinylcholine<\/b> IV, <b>1 to 2 mg/kg<\/b> for intubation.","l":2},{"t":"Provide additional IV anesthesia as tolerated:","l":2},{"t":"<b>Ketamine 10 to 20 mg<\/b>.","l":3},{"t":"Fentanyl <b>25 to 50 μg<\/b>.","l":3},{"t":"<b>Midazolam 0.25 to 0.5 mg<\/b>.","l":3},{"t":"Correct metabolic acidosis.","l":1},{"t":"Anticipate a rebound hypertensive response or return of normal hemodynamics after tamponade is relieved:","l":1},{"t":"Use additional anesthetic agents, e.g. volatile anesthetics.","l":2}],"complications":[{"t":"Arrhythmias.","l":0},{"t":"Myocardial ischemia or infarction.","l":0},{"t":"Complications of pericardiocentesis:","l":0},{"t":"Pneumothorax, hemothorax.","l":1},{"t":"Laceration of heart or lungs.","l":1},{"t":"Infection.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Oliver WC, Mauermann WJ, Nuttall GA. Uncommon cardiac diseases. In: Kaplan JA, Reich DL, Savino JS, editors. Kaplan’s cardiac anesthesia: the echo era. 6th ed. Philadelphia: Saunders; 2011, p. 710-3."},{"t":"2. O’Connor CJ, Tuman KJ. The intraoperative management of patients with pericardial tamponade. Anesthesiol Clin 2010;28:87-96."},{"t":"3. Grocott HP, Gulati H, Srinathan S, et al. Anesthesia and the patient with pericardial disease. Can J Anesth 2011;58:952-66."},{"t":"4. Soler-Soler J, Sagrista-Sauleda J, Permanyer-Miralda G. Management of pericardial effusion. Heart 2001;86:235-40."},{"t":"5. Spodick DH. Current concepts. Acute Cardiac Tamponade. NEJM 2003;349:684-90 Review article."}]}},{"id":19,"title":"Nonlethal Ventricular Arrhythmias","ch":6,"cat":"Cardiovascular Events","s":{"definition":[{"t":"Nonlethal ventricular arrhythmias originate at the level of the ventricles and are characterized by a wide QRS complex.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"PVC.","l":2},{"t":"VT.","l":2},{"t":"Torsades de pointes.","l":2}],"etiology":[{"t":"Abnormal automaticity of ventricular myocardium.","l":0},{"t":"Reentry mechanisms.","l":0},{"t":"Drug toxicity.","l":0},{"t":"R on T phenomenon:","l":0},{"t":"A PVC or a pacemaker spike occurring at the apex of the T wave, initiating VT.","l":1},{"t":"Electrolyte abnormalities.","l":0}],"typical":[{"t":"PVCs are seen frequently in healthy people and are more likely to occur after tea, coffee, alcohol, tobacco, or emotional excitement.","l":0},{"t":"Patients with:","l":0},{"t":"Myocardial ischemia or infarction.","l":1},{"t":"Heart failure and cardiomyopathy.","l":1},{"t":"Hypoxemia and/or hypercarbia.","l":1},{"t":"Potassium and/or acid-base disturbance.","l":1},{"t":"Hypomagnesemia.","l":1},{"t":"Mitral valve prolapse.","l":1},{"t":"Inappropriate depth of anesthesia for level of surgical stimulus.","l":1},{"t":"Mechanical stimulation of the heart:","l":0},{"t":"Handling of the heart during cardiothoracic surgery.","l":1},{"t":"Passage of a PA catheter through the RV.","l":1},{"t":"Acute hypertension and/or tachycardia.","l":0},{"t":"Acute hypotension and/or bradycardia.","l":0},{"t":"Drugs:","l":0},{"t":"Digitalis toxicity.","l":1},{"t":"Tricyclic antidepressant toxicity.","l":1},{"t":"Aminophylline toxicity.","l":1},{"t":"Antiarrhythmic drugs (quinidine, procainamide, disopyramide).","l":1},{"t":"Hypothermia (core temperature less than 32°C).","l":0}],"prevention":[{"t":"Recognize and treat preoperative ventricular arrhythmias.","l":0},{"t":"Correct electrolyte abnormalities.","l":0},{"t":"Identify patients taking drugs known to cause ventricular arrhythmias.","l":0},{"t":"<b>Avoid<\/b>/minimize mechanical stimulation of heart.","l":0},{"t":"<b>Avoid<\/b>/minimize hemodynamic abnormalities.","l":0}],"manifestations":[{"t":"PVC:","l":0},{"t":"Wide QRS complex on ECG not preceded by a P wave:","l":1},{"t":"PVCs may not produce ejection of blood into the aorta or a palpable pulse.","l":2},{"t":"There is usually a compensatory pause between the PVC and the next normal beat.","l":2},{"t":"VT:","l":0},{"t":"A succession of three or more PVCs at a rate &gt; 100 bpm:","l":1},{"t":"Some VTs support adequate circulation and do not degenerate into lethal <b>arrhythmias<\/b>.","l":2},{"t":"Torsades de pointes:","l":0},{"t":"Paroxysms of polymorphic VT in which the QRS axis changes direction continuously, with a periodicity of 5 to 20 beats.","l":1},{"t":"Associated with prolonged QT-interval.","l":1}],"similar":[{"t":"ECG artifact.","l":0},{"t":"Supraventricular rhythm with aberrant conduction (see Event 23, Supraventricular Arrhythmias).","l":0},{"t":"AV reentrant rhythms.","l":0},{"t":"Bundle branch blocks, especially in the presence of tachycardia.","l":0},{"t":"Paced rhythm.","l":0}],"management":[{"t":"Ensure adequate oxygenation and ventilation.","l":0},{"t":"Check the hemodynamic significance of the rhythm:","l":0},{"t":"Palpate the peripheral pulses.","l":1},{"t":"Check the BP.","l":1},{"t":"Examine the arterial waveform (if <b>arterial line<\/b> is present).","l":1},{"t":"Measure and maintain normal body temperature.","l":0},{"t":"Maintain appropriate depth of anesthesia.","l":0},{"t":"If the arrhythmia causes significant hemodynamic impairment:","l":0},{"t":"Evaluate possible underlying etiologies:","l":1},{"t":"Draw appropriate labs.","l":2},{"t":"e.g.:","l":3,"e":1},{"t":"<b>ABG<\/b>.","l":4},{"t":"Electrolytes.","l":4},{"t":"CBC.","l":4},{"t":"Cardiac enzymes.","l":4},{"t":"Obtain 12-lead ECG.","l":2},{"t":"Consider TEE or TTE to evaluate cardiac function and possible ischemia.","l":2},{"t":"PVCs:","l":1},{"t":"PVCs frequent enough to cause symptoms may be treated with β-blockers or antiarrhythmic agents.","l":2},{"t":"e.g.:","l":3,"e":1},{"t":"<b>Lidocaine<\/b>.","l":4},{"t":"Flecainide.","l":4},{"t":"<b>Amiodarone<\/b>.","l":4},{"t":"Sotalol.","l":4},{"t":"VT:","l":1},{"t":"Hemodynamically unstable VT should be treated with unsynchronized electrical cardioversion (see Event 2, Cardiac Arrest).","l":2},{"t":"Hemodynamically stable monomorphic VT:","l":2},{"t":"Consider urgent synchronized electrical cardioversion because of the risk of developing hemodynamic instability or conversion to VF:","l":3},{"t":"Biphasic defibrillators: <b>200 J<\/b>.","l":4},{"t":"Monophasic defibrillators: <b>360 J<\/b>.","l":4},{"t":"Pharmacologic therapy:","l":3},{"t":"<b>Amiodarone<\/b> slow IV bolus, <b>150 mg<\/b> over 10 minutes, followed by <b>1 mg/min<\/b> infusion for 6 hours.","l":4},{"t":"<b>Lidocaine<\/b> IV bolus, <b>1.5 mg/kg<\/b>, followed by <b>1 to 4 mg/min<\/b> infusion.","l":4},{"t":"Torsades de pointes:","l":1},{"t":"If hemodynamically unstable, perform unsynchronized electrical cardioversion:","l":2},{"t":"Biphasic defibrillators: <b>200 J<\/b>.","l":3},{"t":"Monophasic defibrillators: <b>360 J<\/b>.","l":3},{"t":"If hemodynamically stable:","l":2},{"t":"Administer MgSO<sub>4<\/sub> IV, <b>2 g<\/b> over 2 minutes.","l":3},{"t":"Consider overdrive pacing (rate ~100 bpm).","l":3},{"t":"Consider isoproterenol IV infusion titrated to HR, ~100 bpm.","l":3},{"t":"Consider phenytoin IV, <b>250 mg<\/b> over 5 minutes.","l":3},{"t":"Withdraw medications causing QT prolongation.","l":2}],"complications":[{"t":"Progression of nonlethal arrhythmia to lethal arrhythmia.","l":0},{"t":"Organ hypoperfusion.","l":0},{"t":"Side effects from therapy:","l":0},{"t":"VF.","l":1},{"t":"Hyperkalemia or cardiac arrest from rapid K+ administration.","l":1},{"t":"Lidocaine toxicity.","l":1},{"t":"Hypotension from isoproterenol.","l":1},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. European Heart Rhythm Association, Heart Rhythm Society, Zipes DP, et al. ACC/AHA/ESC 2006 guidelines for management of patients with ventricular arrhythmias and the prevention of sudden cardiac death: a report of the American College of Cardiology/American Heart Association Task Force and the European Society of Cardiology Committee for Practice Guidelines (writing committee to develop guidelines for management of patients with ventricular arrhythmias and the prevention of sudden cardiac death). J Am Coll Cardiol 2006;48:e247-e346."},{"t":"2. Lin D, Callans DJ. Nonsustained VT during exercise testing: causes and work-up. Am Coll Cardiol Curr J Rev 2003; Nov-Dec 57-60."},{"t":"3. Bikkina M, Larson MG, Levy D. Prognostic implications of asymptomatic ventricular arrhythmias: the Framingham Heart Study. Ann Intern Med 1992;117:990-6."},{"t":"4. Griffith MJ, Linker NJ, Garratt CJ, et al. Relative efficacy and safety of intravenous drugs for termination of sustained ventricular tachycardia. Lancet 1990;336:670-3."}]}},{"id":20,"title":"Pulmonary Edema","ch":6,"cat":"Cardiovascular Events","s":{"definition":[{"t":"Pulmonary edema is the accumulation of fluid in the interstitium and alveoli of the lung.","l":0}],"etiology":[{"t":"Cardiogenic pulmonary edema:","l":0},{"t":"Caused by high pulmonary capillary hydrostatic pressure.","l":1},{"t":"Noncardiogenic pulmonary edema:","l":0},{"t":"Caused by increased permeability of pulmonary capillary membranes, ARDS, or low capillary oncotic pressure.","l":1},{"t":"Negative pressure pulmonary edema:","l":0},{"t":"Strong inspiratory efforts against an obstructed upper airway:","l":1},{"t":"Laryngospasm, upper airway tumor, or foreign body.","l":2},{"t":"Inadequate lymphatic clearance of normal or excessive interstitial and alveolar fluid.","l":0}],"typical":[{"t":"Cardiogenic pulmonary edema:","l":0},{"t":"Myocardial dysfunction:","l":1},{"t":"Acute myocardial ischemia or infarction.","l":2},{"t":"Acute valvular dysfunction.","l":2},{"t":"Severe hypertension.","l":2},{"t":"Fluid overload:","l":1},{"t":"In patients with CHF.","l":2},{"t":"In patients with renal insufficiency or renal failure.","l":2},{"t":"With massive fluid resuscitation:","l":1},{"t":"May occur 2 to 3 days after surgery when fluids are mobilized.","l":2},{"t":"With rapid fluid absorption, e.g. during TURP.","l":1},{"t":"Noncardiogenic pulmonary edema (e.g. ARDS) secondary to:","l":0},{"t":"Sepsis (most common in-hospital cause).","l":1},{"t":"Pneumonia:","l":1},{"t":"Most common cause outside of the hospital.","l":2},{"t":"Pulmonary aspiration of gastric contents.","l":1},{"t":"Trauma.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Bilateral lung contusions.","l":3},{"t":"Massive tissue injury.","l":3},{"t":"Smoke inhalation.","l":3},{"t":"Massive transfusion.","l":1},{"t":"TRALI.","l":1},{"t":"Medical causes.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Blood and hemopoietic stem cell transplant.","l":3},{"t":"Acute pancreatitis.","l":3},{"t":"Drug or alcohol overdose.","l":3},{"t":"Opiate reversal with naloxone.","l":3},{"t":"Near-drowning.","l":1},{"t":"Amniotic fluid embolism.","l":1},{"t":"Post-CPB.","l":1},{"t":"Post-pneumonectomy.","l":1},{"t":"Neurogenic pulmonary edema:","l":1},{"t":"After major head trauma, stroke, subarachnoid or intracerebral hemorrhage, intracranial surgery.","l":2},{"t":"Reexpansion pulmonary edema.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Evacuation of large amount of fluid.","l":3},{"t":"Air from pleural space.","l":3},{"t":"Reperfusion pulmonary edema (after lung transplantation).","l":1}],"prevention":[{"t":"Optimize perioperative medical management.","l":0},{"t":"Monitor fluid replacement carefully.","l":0},{"t":"Use invasive hemodynamic monitoring in patients at risk of pulmonary edema or CHF.","l":0},{"t":"Monitor for signs of possible fluid absorption during TURP.","l":0},{"t":"Treat the underlying problem in ARDS.","l":0}],"manifestations":[{"t":"Vital signs:","l":0},{"t":"<b>Arrhythmias<\/b>:","l":1},{"t":"<b>Hypotension<\/b>.","l":2},{"t":"<b>Hypertension<\/b>.","l":2},{"t":"<b>Tachycardia<\/b>.","l":2},{"t":"And.","l":2},{"t":"Physical examination:","l":0},{"t":"Fine crackles (rales) audible in the lung fields on auscultation.","l":1},{"t":"Pulmonary manifestations:","l":0},{"t":"Decreased O<sub>2<\/sub> saturation.","l":1},{"t":"Increased A–a gradient.","l":1},{"t":"Serosanguinous pulmonary <b>edema<\/b> fluid in the ETT or under the face mask.","l":1},{"t":"In the awake patient:","l":1},{"t":"Dyspnea, “air hunger,” and restlessness, even with normal O<sub>2<\/sub> saturation.","l":2},{"t":"<b>Hypoxemia<\/b> may develop later.","l":2},{"t":"In the mechanically ventilated patient:","l":1},{"t":"Decreased lung compliance.","l":2},{"t":"Increase in PIP during volume mode ventilation.","l":2},{"t":"Decreased tidal volume during pressure mode ventilation.","l":2},{"t":"In patients with cardiogenic pulmonary <b>edema<\/b>:","l":0},{"t":"Elevated cardiac filling pressures:","l":1},{"t":"Jugular venous distention.","l":2},{"t":"Increased CVP.","l":2},{"t":"Increased PCWP.","l":2},{"t":"CXR:","l":1},{"t":"Increase in interstitial and alveolar fluid.","l":2},{"t":"Cardiomegaly.","l":2},{"t":"Increased pulmonary vascularity.","l":2},{"t":"Perivascular cuffing.","l":2},{"t":"Kerley B lines.","l":2},{"t":"Interstitial infiltrate.","l":2},{"t":"“White-out” of lung fields.","l":2},{"t":"In patients with noncardiogenic pulmonary <b>edema<\/b>:","l":0},{"t":"Cardiac filling pressures are normal or decreased.","l":1},{"t":"CXR:","l":1},{"t":"Increased pulmonary vascularity.","l":2},{"t":"Perivascular cuffing.","l":2},{"t":"Kerley B lines.","l":2},{"t":"Interstitial infiltrate.","l":2},{"t":"“White-out” of lung fields.","l":2}],"similar":[{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"Endobronchial intubation (see Event 30, Endobronchial Intubation).","l":0},{"t":"Kinked or obstructed ETT (see Event 7, High Peak Inspiratory Pressure).","l":0},{"t":"Pneumothorax, tension pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"Residual neuromuscular blockade.","l":0},{"t":"Drug administration error (see Event 63, Drug Administration Error).","l":0}],"management":[{"t":"<b>Increase FiO<sub>2<\/sub>:<\/b>","l":0},{"t":"Use high-flow nonrebreathing face mask.","l":1},{"t":"Assist ventilation if necessary with continuous positive airway pressure (CPAP) or bilevel positive airway pressure (BiPAP).","l":1},{"t":"In intubated patients, deliver <b>100%<\/b> O<sub>2<\/sub> and consider adding PEEP.","l":1},{"t":"Assess respiratory effort and adequacy of ventilation:","l":0},{"t":"Evaluate the patient looking for use of accessory muscles of respiration, tachypnea, hemodynamic compromise, altered mental status.","l":1},{"t":"Intubate the patient who is not already intubated if pulmonary edema persists in the presence of hypoxemia not responsive to supplementary O<sub>2<\/sub>, altered mental status, or if respiratory failure is imminent.","l":1},{"t":"Check for pneumothorax (see Event 35, Pneumothorax).","l":1},{"t":"In postoperative patients, consider residual neuromuscular blockade if respiratory effort is inadequate.","l":1},{"t":"Obtain an <b>ABG<\/b>, CXR, ECG.","l":0},{"t":"Assess myocardial function with TEE or TTE.","l":0},{"t":"For patients with cardiogenic pulmonary edema:","l":0},{"t":"Reduce the cardiac preload:","l":1},{"t":"Sit the awake patient upright.","l":2},{"t":"Position the anesthetized patient in the reverse Trendelenburg if not <b>contraindicated<\/b> by the surgical procedure or hypotension.","l":2},{"t":"Administer <b>furosemide<\/b> IV, <b>10 to 20 mg<\/b> bolus (use an increased dose if the patient is already on diuretic therapy):","l":2},{"t":"Consider placing a urinary catheter.","l":3},{"t":"Administer morphine IV, <b>2 mg<\/b> increments (exercise caution in the spontaneously breathing patient to <b>avoid<\/b> respiratory depression).","l":2},{"t":"Consider an infusion of NTG IV, <b>0.25 to 1 μg/kg/min<\/b> unless the patient is hypotensive.","l":2},{"t":"Optimize myocardial contractility:","l":1},{"t":"Discontinue myocardial depressant drugs (e.g. volatile anesthetics) and replace with other agents.","l":2},{"t":"Place invasive hemodynamic monitors (<b>arterial line<\/b>, <b>CVP<\/b>, PA catheter).","l":2},{"t":"Consider inotropic support:","l":2},{"t":"Dopamine, <b>3 to 10 μg/kg/min<\/b>.","l":3},{"t":"Dobutamine, <b>5 to 10 μg/kg/min<\/b>.","l":3},{"t":"Milrinone IV, <b>50 μg/kg<\/b> loading dose (over 10 minutes), infusion of <b>0.375 to 0.75 μg/kg/min<\/b>.","l":3},{"t":"<b>Epinephrine<\/b> 10 to 200 ng/kg/min.","l":3},{"t":"Consider use of IABP.","l":1},{"t":"For patients with noncardiogenic pulmonary edema:","l":0},{"t":"As above for cardiogenic pulmonary edema plus treat underlying cause.","l":1},{"t":"In the presence of bronchospasm, consider inhalation of nebulized β<sub>2<\/sub> agonists (see Event 29, Bronchospasm).","l":1},{"t":"Terminate the surgical procedure as quickly as possible and make arrangements to transfer the patient to the ICU for further management.","l":0},{"t":"Obtain an urgent medical consultation as indicated by the clinical diagnosis.","l":0},{"t":"Consider extracorporeal membrane oxygenation (ECMO) in severe cases refractory to medical management.","l":0}],"complications":[{"t":"Hypovolemia and hypotension from overaggressive diuresis or reduction of preload.","l":0},{"t":"Electrolyte disturbances.","l":0},{"t":"Metabolic and/or respiratory acidosis.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Walkey AJ, Summer R, Ho V, Alkana P. Acute respiratory distress syndrome: epidemiology and management approaches. Clin Epidemiol 2012;4:159-69."},{"t":"2. Krodel DJ, Bittner EA, Abdulnour R, et al. Case scenario: acute postoperative negative pressure pulmonary edema. Anesthesiology 2010;113:200-7."}]}},{"id":21,"title":"Pulmonary Embolism","ch":6,"cat":"Cardiovascular Events","s":{"definition":[{"t":"Pulmonary embolism (PE) is a partial or complete obstruction of the pulmonary arterial circulation by substances originating elsewhere in the cardiovascular system.","l":0}],"etiology":[{"t":"Substances that can cause a PE:","l":0},{"t":"Blood clot.","l":1},{"t":"Fat.","l":1},{"t":"Amniotic fluid.","l":1},{"t":"Gas.","l":1},{"t":"Tumor.","l":1}],"typical":[{"t":"Deep venous thrombosis (DVT):","l":0},{"t":"Recent major surgery.","l":1},{"t":"Elderly—risk increases exponentially with increasing age.","l":1},{"t":"Malignancy (especially with metastatic disease).","l":1},{"t":"Postpartum.","l":1},{"t":"History of previous DVT or venous insufficiency of the lower extremities.","l":1},{"t":"Prolonged immobilization.","l":1},{"t":"History of CHF or recent MI.","l":1},{"t":"Thrombophilia (hypercoagulability or a prothrombotic state) following splenectomy with rebound thrombocytosis or polycythemia.","l":1},{"t":"Obesity.","l":1},{"t":"Fat embolism:","l":0},{"t":"Multiple fractures, long bone fractures, or pelvic fractures.","l":1},{"t":"Reaming of bone marrow cavity.","l":1},{"t":"High pressure injection into bone marrow cavity during total joint replacement.","l":1}],"prevention":[{"t":"Different recommendations are suggested for <b>prophylaxis<\/b> in patients at risk of developing.","l":0},{"t":"DVT and vary with the perceived level of risk.","l":0},{"t":"<b>Heparin<\/b> SC, 5000 U, 1 to 2 hours before surgery and every 6 to 8 hours until the patient is ambulatory.","l":1},{"t":"Enoxaparin SC, <b>30 to 40 mg<\/b> twice a day.","l":1},{"t":"Oral anticoagulants (e.g. warfarin, with the first dose given the day before surgery):","l":1},{"t":"Monitor the level of anticoagulation with serial international normalized ratio (<b>INR<\/b>) measurements.","l":2},{"t":"Graduated compression stockings:","l":1},{"t":"Used alone these devices <b>do not<\/b> protect the high-risk patient.","l":2},{"t":"Intermittent pneumatic compression boots.","l":1},{"t":"Have an IVC filter placed in patients at high risk of PE from DVT:","l":1},{"t":"When pharmacologic methods fail to prevent DVT.","l":2},{"t":"If anticoagulants are <b>contraindicated<\/b>.","l":2}],"manifestations":[{"t":"<i>Massive PE can present as severe hemodynamic decompensation or <b>cardiac arrest<\/b> (PEA or asystole).<\/i>","l":0},{"t":"If the patient is conscious:","l":0},{"t":"Dyspnea, pleuritic chest pain, and hemoptysis.","l":1},{"t":"<b>Hypotension<\/b> and <b>tachycardia<\/b>.","l":1},{"t":"<b>Hypoxemia<\/b> or increased A–a gradient is usually present.","l":1},{"t":"Fine crackles (rales), wheezes, or a pleural rub may be heard on auscultation of the chest.","l":1},{"t":"The CXR is usually normal, but there may be a change in vessel diameter, vessel “cutoff,” increased radiolucency in areas of hypoperfusion, atelectasis, and/or a pleural effusion.","l":1},{"t":"In the patient who is under general anesthesia:","l":0},{"t":"Tachypnea if the patient is breathing spontaneously.","l":1},{"t":"<b>Hypotension<\/b> and <b>tachycardia<\/b>.","l":1},{"t":"<b>Hypoxemia<\/b>, increased A–a gradient, or <b>cyanosis<\/b>, even when breathing 100% O<sub>2<\/sub>.","l":1},{"t":"Decreased ET CO<sub>2<\/sub> (change is usually abrupt but depends on severity of embolism).","l":1},{"t":"Increased CVP and PA pressures.","l":1},{"t":"Acute right heart failure.","l":1},{"t":"ECG changes:","l":1},{"t":"Right heart strain, ST-T wave changes, <b>bradycardia<\/b>, PEA, asystole, S1Q3T3 pattern, or new-onset right bundle branch block (RBBB).","l":2},{"t":"Fat embolism:","l":0},{"t":"Triad of <b>hypoxemia<\/b>, altered mental status, and petechial <b>rash<\/b> usually involving neck and upper body.","l":1},{"t":"Thrombocytopenia.","l":1},{"t":"Presents typically 24 to 72 hours after the insult.","l":1},{"t":"Fat globules may be present in the urine, sputum, or retinal vessels.","l":1},{"t":"Amniotic fluid embolism (AFE):","l":0},{"t":"Typically occurring during or shortly after labor, characterized by cardiogenic shock, <b>hypoxemia<\/b>, respiratory failure, DIC, coma, and <b>seizures<\/b>.","l":1}],"similar":[{"t":"Hypoxemia from other causes (see Event 10, Hypoxemia).","l":0},{"t":"Hypotension from other causes (see Event 9, Hypotension).","l":0},{"t":"Increased dead space ventilation.","l":0},{"t":"Pulmonary hypertension.","l":0},{"t":"RV failure.","l":0},{"t":"Anaphylactic and anaphylactoid reactions (see Event 16, Anaphylactic and Anaphylactoid Reactions, Event 24, Venous Gas Embolism, and Event 81, Amniotic Fluid Embolism).","l":0}],"management":[{"t":"<i>The diagnosis of PE may be difficult during general anesthesia.<\/i>","l":0,"n":1},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Administer supplemental O<sub>2<\/sub>.","l":1},{"t":"For the nonintubated patient:","l":1},{"t":"Use a nonrebreathing face mask delivering <b>100%<\/b> O<sub>2<\/sub>.","l":2},{"t":"Consider endotracheal intubation, mechanical ventilation, and PEEP.","l":2},{"t":"For the intubated patient:","l":1},{"t":"Ventilate with <b>100%<\/b> O<sub>2<\/sub>.","l":2},{"t":"Consider use of PEEP.","l":2},{"t":"Perform <b>ABG<\/b>:","l":1},{"t":"ET CO<sub>2<\/sub> measurements will not reliably indicate the adequacy of ventilation.","l":2},{"t":"<b>Support the circulation:<\/b>","l":0},{"t":"Expand the circulating fluid volume.","l":1},{"t":"Administer inotropic drugs by bolus or infusion:","l":1},{"t":"<b>Ephedrine<\/b> IV, <b>5 to 20 mg<\/b>, repeat as necessary.","l":2},{"t":"<b>Epinephrine<\/b> IV, <b>10 to 50 μg<\/b>, repeat as necessary.","l":2},{"t":"Dopamine, dobutamine, milrinone, or <b>epinephrine<\/b> infusion (see Event 9, Hypotension).","l":2},{"t":"Place invasive monitors for diagnosis and management:","l":1},{"t":"Arterial line.","l":2},{"t":"TEE or TTE especially for evaluation of right heart function.","l":2},{"t":"PA catheter (with mixed venous saturation and continuous CO monitoring, if available):","l":2},{"t":"If there is pulmonary hypertension with RV failure, consider using a NTG infusion, <b>0.25 to 1 μg/kg/min<\/b>, as a pulmonary vasodilator.","l":3},{"t":"If cardiac arrest is present:","l":1},{"t":"Perform CPR (see Event 2, Cardiac Arrest).","l":2},{"t":"Consider emergency percutaneous CPB or ECMO.","l":2},{"t":"Consider emergency pulmonary embolectomy.","l":2},{"t":"Emergent consult with pulmonology or critical care expert to discuss treatment options.","l":2},{"t":"<b>Establish the diagnosis:<\/b>","l":0},{"t":"Rule out other causes of hypoxemia, increased dead space ventilation, or hemodynamic compromise (see Event 10, Hypoxemia).","l":1},{"t":"Obtain a spiral CT scan, ventilation/perfusion (V/Q) scan, or a pulmonary angiogram.","l":1},{"t":"If pulmonary thromboembolism is confirmed:","l":0},{"t":"Emergent consult with pulmonology or critical care expert to discuss treatment options; advanced catheter-based therapies are emerging options for significant PE.","l":1},{"t":"Anticoagulation or thrombolytic therapy may prevent further embolization but may be <b>contraindicated<\/b> if there is an underlying bleeding site or recent surgical procedure:","l":1},{"t":"If anticoagulation is not <b>contraindicated<\/b>, administer <b>heparin<\/b> IV, 5000 U bolus, followed by a <b>heparin<\/b> infusion of 1000 U/hr, adjusted to maintain the <b>aPTT<\/b> at least twice normal.","l":2},{"t":"Insert an IVC filter in patients with recurrent PE who have received adequate anticoagulation or in patients in whom anticoagulation is <b>contraindicated<\/b>.","l":1}],"complications":[{"t":"Pulmonary infarction.","l":0},{"t":"Hemoptysis.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"Hemorrhagic complications of anticoagulation therapy.","l":0}],"reading":[{"t":"1. Banks DA, Manecke GR, Maus TM, et al. Pulmonary thromboendarterectomy for chronic thromboembolic pulmonary hypertension. In: Kaplan JA, Reich DL, Savino JS, editors. Kaplan’s cardiac anesthesia: the echo era. 6th ed. Philadelphia: Saunders, 2011, p. 769-76."},{"t":"2. Agnelli G, Becattini C. Acute pulmonary embolism. N Engl J Med 2010;363:266-74."},{"t":"3. Conde-Agudelo A, Romero R. Amniotic fluid embolism: an evidence-based review. Am J Obstet Gynecol 2009;201:e1-e13 (<b>Erratum in <\/b>Am J Obstet Gynecol 2010;202:92)."},{"t":"4. Konstantinides S. Acute pulmonary embolism. N Engl J Med 2008;359:2804-13."}]}},{"id":22,"title":"Sinus Bradycardia","ch":6,"cat":"Cardiovascular Events","s":{"definition":[{"t":"Sinus bradycardia is a HR less than 60 bpm in an adult with the impulse formation originating in the sinoatrial node.","l":0}],"etiology":[{"t":"Physiologic response in the absence of heart disease:","l":0},{"t":"During normal sleep.","l":1},{"t":"High level of physical fitness.","l":1},{"t":"Heightened vagal activity.","l":1},{"t":"Hypothermia.","l":1},{"t":"Pathologic response in the absence of heart disease:","l":0},{"t":"Obstructive sleep apnea (OSA).","l":1},{"t":"Increased ICP (Cushing reflex).","l":1},{"t":"Hypothyroidism.","l":1},{"t":"Hypoxemia.","l":1},{"t":"Reflex response to hypertension.","l":1},{"t":"Drug effect.","l":0},{"t":"Pathologic response in the presence of heart disease:","l":0},{"t":"Sick sinus syndrome.","l":1},{"t":"Familial condition, e.g. pacemaker ion channel mutation.","l":1},{"t":"Acute myocardial ischemia or infarction.","l":1}],"typical":[{"t":"Following administration of drugs that produce bradycardia:","l":0},{"t":"Opioids (especially fentanyl, sufentanil).","l":1},{"t":"β-Adrenergic antagonists.","l":1},{"t":"Calcium channel blockers.","l":1},{"t":"Anticholinesterases.","l":1},{"t":"α<sub>2<\/sub>-Agonists.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Clonidine.","l":3},{"t":"Dexmedetomidine.","l":3},{"t":"During periods of vagal stimulation:","l":0},{"t":"Traction on the eye or the peritoneum, including pneumoperitoneum.","l":1},{"t":"Laryngoscopy and intubation.","l":1},{"t":"Bladder catheterization.","l":1},{"t":"Baroreceptor reflex during hypertensive episodes.","l":0},{"t":"During spinal or epidural anesthesia:","l":0},{"t":"Block of cardiac accelerator fibers at levels T1-T4.","l":1},{"t":"Electroconvulsive therapy.","l":0},{"t":"In the patient with acute myocardial ischemia or infarction.","l":0}],"prevention":[{"t":"Premedicate patients at risk of vagal responses with an anticholinergic agent:","l":0},{"t":"<b>Atropine<\/b> IM, <b>0.4 mg<\/b> (adults).","l":1},{"t":"<b>Glycopyrrolate<\/b> IM, <b>0.2 mg<\/b> (adults).","l":1},{"t":"During spinal or epidural anesthesia, treat bradycardia aggressively and early with <b>atropine<\/b> IV, <b>0.4 to 0.6 mg<\/b>:","l":0},{"t":"Bradycardia can rapidly progress to asystole in these patients.","l":1},{"t":"Vagal responses due to traction on the peritoneum or the extraocular muscles, or pressure on the carotid sinus, are not always avoidable:","l":0},{"t":"Inform the surgeon of the bradycardia and ask him or her to release the pressure or traction.","l":1},{"t":"Treat with <b>atropine<\/b> or <b>glycopyrrolate<\/b> IV and proceed with caution.","l":1},{"t":"Repeat this sequence if necessary.","l":1},{"t":"Maintain normal plasma electrolyte levels.","l":0}],"manifestations":[{"t":"<i><b>Bradycardia<\/b> may be well tolerated, particularly if it develops slowly. Acute onset of bradycar<i>dia is more likely to be symptomatic.<\/i><\/i>","l":0},{"t":"Slow HR:","l":0},{"t":"ECG.","l":1},{"t":"Pulse oximeter.","l":1},{"t":"Arterial line.","l":1},{"t":"Palpation of peripheral pulses.","l":1},{"t":"<b>Hypotension<\/b>.","l":0},{"t":"Junctional or idioventricular escape beats.","l":0},{"t":"In the conscious patient:","l":0},{"t":"Nausea, vomiting.","l":1},{"t":"Mental status change.","l":1}],"similar":[{"t":"Monitor artifact:","l":0},{"t":"Failure of monitor to count QRS or pulse oximeter signal.","l":1},{"t":"ECG lead disconnection or failure.","l":1},{"t":"Oximeter probe displaced or failure.","l":1},{"t":"Dropped beats:","l":0},{"t":"Second-degree AV heart block, Mobitz type I and type II.","l":1},{"t":"Third-degree AV block.","l":0},{"t":"Pacemaker malfunction or failure:","l":0},{"t":"Lead fracture.","l":1},{"t":"Lead disconnection.","l":1},{"t":"Inappropriate settings.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Output too low.","l":3},{"t":"Sensitivity too high.","l":3},{"t":"AF/flutter with poor perfusion or slow ventricular response.","l":0}],"management":[{"t":"<i>Use aggressive treatment for bradycardic patients under spinal or epidural anesthesia, as it can progress rapidly to cardiac arrest without warning.<\/i>","l":0,"n":1},{"t":"Verify bradycardia and assess its hemodynamic significance:","l":0},{"t":"Check monitors of HR.","l":1},{"t":"Check BP.","l":1},{"t":"Check pulse oximeter.","l":1},{"t":"Palpate a peripheral pulse.","l":1},{"t":"Scan the surgical field for operative causes:","l":0},{"t":"If in response to surgical stimulus, alert surgeon to stop the precipitating stimulus.","l":1},{"t":"Notify the surgeon of the bradycardia.","l":0},{"t":"If bradycardia is associated with severe symptoms (profound hypotension, loss of consciousness, seizures), remove possible causes.","l":0},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Deliver <b>100%<\/b> O<sub>2<\/sub> and turn off all volatile anesthetics.","l":1},{"t":"Manage the airway (patient may require intubation):","l":1},{"t":"Bradycardia is common in prolonged hypoxemia.","l":2},{"t":"<b>Call for help.<\/b>","l":0},{"t":"<b>Treat with:<\/b>","l":0},{"t":"<b>Atropine<\/b> IV, <b>0.4 to 0.6 mg<\/b>.","l":1},{"t":"Repeat every 3 to 5 minutes to total dose of <b>3 mg<\/b>.","l":1},{"t":"Dopamine IV infusion, <b>2 to 10 μg/kg/min<\/b>.","l":1},{"t":"<b>Epinephrine<\/b> IV, <b>10 μg<\/b> bolus, repeat with escalating doses as necessary.","l":1},{"t":"Commence an <b>epinephrine<\/b> infusion, 5 to 100 ng/kg/min, if necessary.","l":1},{"t":"If bradycardia fails to resolve quickly with <b>epinephrine<\/b> boluses, initiate cardiac pacing:","l":1},{"t":"Transcutaneous (newer defibrillators typically offer pacing function):","l":2},{"t":"Awake patient will probably need analgesia and sedation.","l":3},{"t":"Transvenous (effective, but logistically difficult in an emergency).","l":2},{"t":"Commence CPR if necessary (see Event 2, Cardiac Arrest).","l":2},{"t":"If bradycardia is associated with mild to moderate symptoms (modest decrease in BP, nausea, vomiting, or mild alteration in sensorium):","l":0},{"t":"<b>Ephedrine<\/b> IV, <b>5 to 10 mg<\/b> increments, repeat as necessary.","l":1},{"t":"<b>Atropine<\/b> IV, <b>0.4 mg<\/b>, repeat as necessary.","l":1},{"t":"<b>Glycopyrrolate<\/b> IV, <b>0.2 mg<\/b>, repeat as necessary.","l":1},{"t":"If bradycardia is not associated with any obvious physiologic consequences:","l":0},{"t":"Monitor the patient closely.","l":1}],"complications":[{"t":"Escape arrhythmias.","l":0},{"t":"Complications of pacemakers.","l":0},{"t":"Tachyarrhythmias and hypertension secondary to drug treatment.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Epstein AE, DiMarco JP, Ellenbogen KA, et al. ACC/AHA/HRS 2008 guidelines for device-based therapy of cardiac rhythm abnormalities: a report of the American College of Cardiology/American Heart Association Task Force on Practice Guidelines (writing committee to revise the ACC/AHA/NASPE 2002 guideline update for implantation of cardiac pacemakers and antiarrhythmia devices). Developed in collaboration with the American Association for Thoracic Surgery and Society of Thoracic Surgeons. Circulation 2008;117:e350-e408."},{"t":"2. Stein R, Medeiros CM, Rosito GA, et al. Intrinsic sinus and atrioventricular node electrophysiologic adaptations in endurance athletes. J Am Coll Cardiol 2002;39:1033-8."},{"t":"3. Neumar RW, Otto CW, Link MS, et al. Part 8: Adult advanced cardiovascular life support: 2010 American Heart Association guidelines for cardiopulmonary resuscitation and emergency cardiovascular care. Circulation 2010;122:S729-67."}]}},{"id":23,"title":"Supraventricular Arrhythmias","ch":6,"cat":"Cardiovascular Events","s":{"definition":[{"t":"A supraventricular arrhythmia is an abnormal cardiac rhythm arising from a supraventricular source.","l":0},{"t":"Sinoatrial node (SA node).","l":1},{"t":"Atrium.","l":1},{"t":"Atrioventricular node (AV node).","l":1}],"etiology":[{"t":"Enhanced automaticity of supraventricular tissue (tachyarrhythmias).","l":0},{"t":"Reentry.","l":0},{"t":"Reduced automaticity of supraventricular tissue (AV nodal rhythm).","l":0}],"typical":[{"t":"Many atrial arrhythmias occur in patients with normal hearts:","l":0},{"t":"During exercise.","l":1},{"t":"After drinking coffee, tea, or alcohol.","l":1},{"t":"Following smoking.","l":1},{"t":"Pain or inadequate anesthesia.","l":1},{"t":"Hypovolemia.","l":1},{"t":"Anemia.","l":1},{"t":"Fever.","l":1},{"t":"Drug effects, e.g. epinephrine IV.","l":1},{"t":"Acute myocardial ischemia or infarction.","l":0},{"t":"During or following pulmonary or cardiac surgery.","l":0},{"t":"Wolff-Parkinson-White syndrome or other cardiac disorders with accessory conduction pathways.","l":0},{"t":"Hypervolemia.","l":0},{"t":"Hypoxemia, hypercarbia, acidosis, alkalosis.","l":0},{"t":"Pyrexia.","l":0},{"t":"Electrolyte imbalance.","l":0},{"t":"Hypermetabolic states.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Hyperthyroidism.","l":2},{"t":"MH.","l":2},{"t":"Acute or chronic pulmonary disease.","l":0},{"t":"PE.","l":0},{"t":"Valvular heart disease, e.g. mitral valve prolapse.","l":0},{"t":"Pericarditis, myocarditis.","l":0},{"t":"OSA.","l":0},{"t":"Conditions causing catecholamine excess (pain, pheochromocytoma).","l":0},{"t":"Autonomic reflexes.","l":0}],"prevention":[{"t":"Identify and treat patients with supraventricular arrhythmias preoperatively.","l":0},{"t":"Optimize medical therapy.","l":0},{"t":"Correct electrolyte abnormalities.","l":0},{"t":"Correct acidosis, alkalosis, hypoxemia, hypercarbia.","l":0},{"t":"Maintain adequate depth of anesthesia.","l":0},{"t":"Maintain euvolemia.","l":0},{"t":"<b>Avoid<\/b> hyperthermia.","l":0}],"manifestations":[{"t":"<i>If there is a rapid ventricular response, it may be difficult to determine the exact focus of the tachyarrhythmia.<\/i>","l":0},{"t":"Symptoms in the awake patient may include:","l":0},{"t":"<b>Tachycardia<\/b>.","l":1},{"t":"Palpitations.","l":1},{"t":"Syncope or presyncope.","l":1},{"t":"Lightheadedness.","l":1},{"t":"Diaphoresis.","l":1},{"t":"Chest pain or discomfort.","l":1},{"t":"Shortness of breath.","l":1},{"t":"<b>Hypotension<\/b>.","l":1},{"t":"Nausea and vomiting.","l":1},{"t":"ECG abnormality.","l":1},{"t":"<b>Sinus Tachycardia:<\/b>","l":0},{"t":"Impulse arises from the SA node.","l":1},{"t":"Rate is greater than 100 bpm and may be as high as 170 bpm.","l":1},{"t":"Most common <b>arrhythmia<\/b> in perioperative period.","l":1},{"t":"<b>Sinus Arrhythmia:<\/b>","l":0},{"t":"Impulse arises from the SA node at a variable rate of 60 to 100 bpm.","l":1},{"t":"PR intervals and QRS intervals are normal with a P/QRS ratio of 1:1.","l":1},{"t":"Rate commonly increases during inspiration and decreases during expiration.","l":1},{"t":"<b>Atrial Escape Beats:<\/b>","l":0},{"t":"Occur in setting of a long sinus pause or sinus arrest.","l":1},{"t":"Rate correlates with the automaticity of the atrial focus and is generally slower than the sinus rate.","l":1},{"t":"P-wave morphology differs from the sinus rhythm P-wave, and QRS complexes are normal.","l":1},{"t":"Atrial Premature Beats (APB):","l":0},{"t":"Impulse is generated by an ectopic focus in the left or right atrium.","l":1},{"t":"P-wave is present but morphology differs from sinus rhythm P-wave.","l":1},{"t":"Impulse travels from the atria to the AV node and the PR interval may be shorter or longer than the sinus rhythm PR interval.","l":1},{"t":"At AV node, the impulse continues to the ventricular conduction system and also retrograde to SA node, resetting the sinus pacemaker.","l":1},{"t":"Absence of compensatory pause.","l":1},{"t":"<b>Wandering Atrial Pacemaker:<\/b>","l":0},{"t":"Three or more ectopic foci within the atrium generate pulses with different P-wave morphologies.","l":1},{"t":"Rate is typically less than 100 bpm; when rate exceeds 100 bpm, the <b>arrhythmia<\/b> is known as multifocal atrial <b>tachycardia<\/b>.","l":1},{"t":"Rhythm is irregular:","l":1},{"t":"May be confused with AF.","l":2},{"t":"Difference from AF is clear P-waves (with differing morphologies) versus lack of P-waves in AF.","l":2},{"t":"<b>Atrial Tachycardia (AT):<\/b>","l":0},{"t":"Atrial rate ranges from 100 to 250 bpm with variable ventricular response.","l":1},{"t":"Impulse may arise from a single focus (with a distinctive P-wave) or may be multifocal (with multiple P wave morphologies).","l":1},{"t":"PR interval may vary in multifocal AT, and QRS complex typically remains normal.","l":1},{"t":"Multifocal AT commonly seen in patients with heart failure or COPD.","l":1},{"t":"<b>Atrial Flutter:<\/b>","l":0},{"t":"Regular, rapid atrial depolarizations with rates typically 300 bpm.","l":1},{"t":"Ventricular rate slower due to AV block (typically 2:1, up to 8:1).","l":1},{"t":"Saw-tooth flutter waves (F-waves) are typically present.","l":1},{"t":"QRS complex typically remains normal and T-waves are lost in the F-waves.","l":1},{"t":"<b>Atrial Fibrillation (AF):<\/b>","l":0},{"t":"Results from a rapid firing focus commonly arising from the pulmonary veins.","l":1},{"t":"Rapid and irregular contraction of the atria results in fibrillation.","l":1},{"t":"Ventricular rate may vary from 60 to 170 bpm.","l":1},{"t":"No P-waves evident on ECG.","l":1},{"t":"QRS complexes with normal configuration but with irregular rhythm.","l":1},{"t":"Loss of “atrial kick” may severely reduce CO and BP.","l":1},{"t":"Tendency to develop atrial thrombi may lead to pulmonary or systemic embolization.","l":1},{"t":"Atrioventricular Nodal Reentrant <b>Tachycardia<\/b> (AVNRT):","l":0},{"t":"Reentrant <b>tachycardia<\/b> caused by AV nodal pathways.","l":1},{"t":"Regular fast rhythm (120 to 250 bpm).","l":1},{"t":"P-waves might not be visible.","l":1},{"t":"Atrioventricular Reentrant <b>Tachycardia<\/b> (AVRT):","l":0},{"t":"Reentrant <b>tachycardia<\/b> utilizing an accessory pathway between atria and ventricles, e.g. Wolff-Parkinson-White syndrome.","l":1},{"t":"The most common type uses the AV node for antegrade conduction and accessory pathway for retrograde conduction (orthodromic conduction):","l":1},{"t":"QRS complex remains narrow.","l":2},{"t":"Negative P-waves may be seen in the inferior leads.","l":2},{"t":"Less commonly, the accessory pathway conducts the antegrade impulse and the AV node conducts the retrograde impulse (antidromic conduction):","l":1},{"t":"QRS complexes are wide.","l":2},{"t":"May be difficult to distinguish from VT.","l":2},{"t":"<b>Junctional Rhythm:<\/b>","l":0},{"t":"Results from an impulse generated from the AV node.","l":1},{"t":"When sinus node activity not suppressed, P-waves may be present and appear independent of QRS complexes (AV dissociation).","l":1},{"t":"Sinus node activity may also be suppressed by retrograde atrial activation.","l":1},{"t":"Junctional <b>tachycardia<\/b>—ventricular rates greater than 100 bpm.","l":1},{"t":"Junctional escape rhythm—the SA node fails to generate an impulse with ventricular rates of 40 to 55 bpm.","l":1}],"similar":[{"t":"ECG artifact.","l":0},{"t":"Artificial pacing of right atrium.","l":0},{"t":"Other tachyarrhythmias.","l":0}],"management":[{"t":"Ensure adequate oxygenation and ventilation.","l":0},{"t":"Check the rhythm and BP.","l":0},{"t":"More likely SVT if:","l":0},{"t":"Rate &gt;150 bpm.","l":1},{"t":"Sudden onset.","l":1},{"t":"Irregular tachycardia is probably AF.","l":1},{"t":"If patient is UNSTABLE (systolic BP &lt; 80 mm Hg, “low” for patient, rapid BP decrease, or acute ischemia):","l":0},{"t":"Inform the team and call for help.","l":1},{"t":"Obtain crash cart and defibrillator and place pads:","l":1},{"t":"Administer vasopressor (see Event 9, Hypotension):","l":2},{"t":"<b>Phenylephrine<\/b> IV, <b>50 to 200 μg<\/b>.","l":3},{"t":"Prepare to perform immediate synchronized cardioversion.","l":0},{"t":"If the patient is hemodynamically STABLE:","l":0},{"t":"Diagnose the arrhythmia:","l":1},{"t":"Palpate the peripheral pulses.","l":2},{"t":"Print rhythm strip from chart recorder, if available:","l":2},{"t":"Call for 12-lead ECG.","l":3},{"t":"Check multiple ECG leads on physiologic monitor to get the best atrial waveform.","l":2},{"t":"The diagnosis of a tachyarrhythmia may be easier if ventricular response rate can be slowed, which can be achieved with:","l":2},{"t":"Vagal maneuvers.","l":3},{"t":"<b>Adenosine<\/b> IV, <b>6 mg<\/b> bolus.","l":3},{"t":"<b>Phenylephrine<\/b> IV, <b>25 to 50 μg<\/b> bolus.","l":3},{"t":"<b>Esmolol<\/b> IV, <b>10 to 30 mg<\/b> bolus.","l":3},{"t":"Treat the underlying rhythm and/or slow the ventricular response.","l":0},{"t":"Sinus tachycardia:","l":0},{"t":"Treat underlying cause of tachycardia.","l":1},{"t":"including:","l":2,"e":1},{"t":"Pain.","l":3},{"t":"Inadequate anesthesia.","l":3},{"t":"Hypovolemia.","l":3},{"t":"Anemia.","l":3},{"t":"Inflammation.","l":3},{"t":"Drug effects.","l":3},{"t":"Sinus arrhythmia, escape atrial beats, and atrial premature beats:","l":0},{"t":"No treatment indicated as long as the patient remains hemodynamically stable.","l":1},{"t":"Atrial tachycardia:","l":0},{"t":"Cardioversion generally ineffective.","l":1},{"t":"Withdraw possible precipitating agents, e.g. catecholamines.","l":1},{"t":"In absence of left ventricular dysfunction, consider the use of:","l":1},{"t":"Verapamil IV, <b>2.5 to 5 mg<\/b>, repeat as necessary q5min to maximum dose of <b>20 mg<\/b>.","l":2},{"t":"<b>Esmolol<\/b> IV, <b>10 to 30 mg<\/b>, repeat as necessary q3min to maximum dose of <b>100 mg<\/b>.","l":2},{"t":"<b>Esmolol<\/b> infusion IV, <b>50 to 200 μg/kg/min<\/b>.","l":2},{"t":"<b>Amiodarone<\/b> slow IV infusion, <b>150 mg<\/b> over 10 minutes.","l":2},{"t":"In presence of left ventricular dysfunction, consider the use of:","l":1},{"t":"<b>Amiodarone<\/b> slow IV infusion, <b>150 mg<\/b> over 10 minutes.","l":2},{"t":"Digoxin IV, <b>0.25 to 1.0 mg<\/b>.","l":2},{"t":"Flecainide, propafenone, quinidine, and disopyramide are also effective but have a higher incidence of side effects.","l":2},{"t":"Atrial flutter and AF:","l":0},{"t":"Rate control:","l":1},{"t":"If hemodynamically unstable, immediate synchronized cardioversion:","l":2},{"t":"Narrow complex and regular—<b>50 to 100 J<\/b>.","l":3},{"t":"Narrow complex and irregular—<b>120 to 200 J<\/b>.","l":3},{"t":"If cardioversion is unsuccessful, perform synchronized cardioversion at a higher energy level.","l":3},{"t":"If hemodynamically stable, use medical management to slow conduction through AV node:","l":2},{"t":"If LV function preserved:","l":3},{"t":"Verapamil IV, <b>2.5 to 5 mg<\/b>, repeat as necessary q5min to maximum dose of <b>20 mg<\/b>.","l":4},{"t":"<b>Esmolol<\/b> IV, <b>10 to 30 mg<\/b>, repeat as necessary q3min to maximum dose of <b>100 mg<\/b>.","l":4},{"t":"<b>Esmolol<\/b> infusion IV, <b>50 to 200 μg/kg/min<\/b>.","l":4},{"t":"If LV function impaired:","l":3},{"t":"<b>Amiodarone<\/b> slow IV infusion, <b>150 mg<\/b> over 10 minutes.","l":4},{"t":"Digoxin IV, <b>0.25 to 1.0 mg<\/b>.","l":4},{"t":"Rhythm control depends on the duration of the arrhythmia:","l":1},{"t":"Duration &lt; 48 hours:","l":2},{"t":"Electrical synchronized cardioversion is preferred:","l":3},{"t":"Pharmacologic cardioversion may be achieved with <b>amiodarone<\/b> or ibutilide.","l":4},{"t":"Duration &gt; 48 hours:","l":3},{"t":"Patients are at risk for developing a left atrial thrombus with systemic embolization.","l":4},{"t":"If hemodynamically stable, but would benefit from early cardioversion:","l":4},{"t":"<b>Heparin<\/b> should be started <b>immediately<\/b>.","l":5},{"t":"TEE to rule out presence of left atrial thrombus prior to synchronized cardioversion.","l":5},{"t":"AVRT and AVNRT:","l":0},{"t":"If hemodynamically unstable, immediate synchronized cardioversion:","l":1},{"t":"Narrow complex and regular—<b>50 to 100 J<\/b>.","l":2},{"t":"Narrow complex and irregular—<b>120 to 200 J<\/b>.","l":2},{"t":"If cardioversion is unsuccessful, perform synchronized cardioversion at a higher energy level.","l":2},{"t":"If hemodynamically stable:","l":1},{"t":"Vagal maneuvers or drugs to block conduction through the AV node and terminate reentrant arrhythmias:","l":2},{"t":"Carotid sinus massage.","l":3},{"t":"Valsalva maneuver.","l":3},{"t":"<b>Adenosine<\/b> IV, <b>6 mg<\/b> bolus with flush and may repeat with <b>12 mg<\/b> IV:","l":3},{"t":"Very fast onset and very short half-life; watch ECG during <b>adenosine<\/b> effect – if rhythm does not convert, the slower rate may allow better assessment of actual rhythm.","l":4},{"t":"Verapamil IV, <b>2.5 to 5 mg<\/b>, repeat as necessary q5min to maximum dose of <b>20 mg<\/b>.","l":3},{"t":"<b>Esmolol<\/b> IV, <b>10 to 30 mg<\/b>, repeat as necessary q3min to maximum dose of <b>100 mg<\/b>.","l":3},{"t":"<b>Esmolol<\/b> infusion IV, <b>50 to 200 μg/kg/min<\/b>.","l":3},{"t":"Junctional tachycardia:","l":0},{"t":"Discontinue exogenous catecholamines.","l":1},{"t":"Electrical cardioversion is ineffective.","l":1},{"t":"Verapamil IV, <b>2.5 to 5 mg<\/b>, repeat as necessary q5min to maximum dose of <b>20 mg<\/b>.","l":1},{"t":"<b>Esmolol<\/b> IV, <b>10 to 30 mg<\/b>, repeat as necessary q3min to maximum dose of <b>100 mg<\/b>.","l":1},{"t":"<b>Esmolol<\/b> infusion IV, <b>50 to 200 μg/kg/min<\/b>.","l":1},{"t":"<b>Avoid<\/b> using calcium channel blockade and β blockade together, which may cause profound bradycardia.","l":1},{"t":"It can be difficult to distinguish between VT and supraventricular tachyarrhythmias with aberrant conduction.","l":1},{"t":"If in doubt, treat as VT with cardioversion.","l":1}],"complications":[{"t":"Organ hypoperfusion.","l":0},{"t":"Adverse drug reactions from therapy.","l":0},{"t":"Complications of cardioversion:","l":0},{"t":"Heart block.","l":1},{"t":"Conversion to a more dangerous rhythm, e.g. VF.","l":1},{"t":"Pulmonary or systemic embolism (dislodged intracardiac thrombus).","l":1}],"reading":[{"t":"1. Fuster V, Rydén LE, Cannom DS, et al. ACC/AHA/ESC 2006 guidelines for the management of patients with atrial fibrillation: a report of the American College of Cardiology/American Heart Association Task Force on Practice Guidelines and the European Society of Cardiology Committee for Practice Guidelines (writing committee to revise the 2001 guidelines for the management of patients with atrial fibrillation). Developed in collaboration with the European Heart Rhythm Association and the Heart Rhythm Society. Circulation 2006;114:e257-e354."},{"t":"2. Kwaku KF, Josephson ME. Typical AVNRT – an update on mechanisms and therapy. Card Electrophysiol Rev 2002;6:414-21."},{"t":"3. Blomström-Lundqvist C, Scheinman MM, Aliot EM, et al. ACC/AHA/ESC guidelines for the management of patients with supraventricular arrhythmias–executive summary: a report of the American College of Cardiology/ American Heart Association Task Force on Practice Guidelines and the European Society of Cardiology Committee for Practice Guidelines (writing committee to develop guidelines for the management of patients with supraventricular arrhythmias). Circulation 2003;108:1871-909."},{"t":"4. Ferguson JD, DiMarco JP. Contemporary management of paroxysmal supraventricular tachycardia. Circulation 2003;107:1096-9."},{"t":"5. Chauhan VS, Krahn AD, Klein GJ, et al. Supraventricular tachycardia. Med Clin North Am 2001;85:193-223."},{"t":"6. American Heart Association. Guidelines for cardiopulmonary resuscitation and emergency cardiovascular care. Part 7.3: management of symptomatic bradycardia and tachycardia. Circulation 2005;112:IV.67-77."}]}},{"id":24,"title":"Venous Gas Embolism","ch":6,"cat":"Cardiovascular Events","s":{"definition":[{"t":"A venous gas embolism (VGE) occurs when air or other gas enters the venous circulation and travels to the right side of the heart or the pulmonary vessels.","l":0}],"etiology":[{"t":"Entrainment of air into an open flowing vein or dural sinus.","l":0},{"t":"Infusion of air or other gas under pressure into a vein.","l":0}],"typical":[{"t":"Surgical procedures in which the operative site is above the level of the heart.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Sitting craniotomy.","l":2},{"t":"Cesarean section during externalization of the uterus.","l":2},{"t":"Shoulder arthroscopy.","l":2},{"t":"Hip arthroplasty.","l":2},{"t":"Surgical procedures requiring insufflation of gas, e.g. laparoscopic surgery.","l":0},{"t":"Invasive procedures that expose an open vein to atmosphere during spontaneous ventilation, e.g. CVP placement or disconnection.","l":0},{"t":"Any invasive procedure in which the patient is
