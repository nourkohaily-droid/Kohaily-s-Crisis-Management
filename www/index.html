 myometrium.","l":3},{"t":"Placental abruption:","l":2},{"t":"Premature separation of a normally implanted placenta after 20 weeks' gestation.","l":3},{"t":"Preexisting medical condition:","l":0},{"t":"Acquired or congenital cardiovascular disease.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Peripartum cardiomyopathy.","l":3},{"t":"Aortic dissection in presence of bicuspid aortic valve.","l":3},{"t":"Coronary artery disease.","l":3},{"t":"History of a PE.","l":1},{"t":"Other:","l":0},{"t":"Prostaglandin use in pregnancy.","l":1},{"t":"Mg2+ toxicity.","l":1},{"t":"AFE.","l":1}],"prevention":[{"t":"Create institutional plan for immediate cesarean section of a parturient in cardiac arrest (“Code Blue Obstetrics”).","l":0},{"t":"Drill and practice the management of immediate cesarean section during cardiac arrest (using simulation if available).","l":0},{"t":"Immediate intervention at first signs of maternal or fetal instability:","l":0},{"t":"Manually perform left uterine displacement.","l":1},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> through a nonrebreathing face mask.","l":1},{"t":"Ensure adequate IV access.","l":1},{"t":"Assess for and treat reversible causes, e.g. hypotension.","l":1},{"t":"Anesthesia-related issues:","l":0},{"t":"Evaluate airway and prepare for a difficult intubation.","l":1},{"t":"Exclude intrathecal and intravascular placement of epidural catheters before administering incremental doses of local anesthetic.","l":1},{"t":"Manage preexisting medical issues in collaboration with specialists.","l":0},{"t":"In high-risk patients, consider placing invasive monitors.","l":0},{"t":"Carefully administer medications to parturients:","l":0},{"t":"Patients with a history of drug allergies.","l":1},{"t":"Patients with cardiac disease taking tocolytic agents (β-adrenergic agonists).","l":1},{"t":"Administer potent drugs through infusion pumps, e.g. MgSO<sub>4<\/sub>.","l":1}],"manifestations":[{"t":"Unresponsive to verbal commands.","l":0},{"t":"Absence of pulse oximeter waveform if present.","l":0},{"t":"Loss of consciousness or <b>seizure<\/b>-like activity.","l":0},{"t":"No palpable carotid pulse (palpation of peripheral pulses unreliable):","l":0},{"t":"NIBP unmeasurable.","l":1},{"t":"Absence of heart tones on auscultation.","l":0},{"t":"Agonal or absent respirations.","l":0},{"t":"<b>Arrhythmias<\/b>:","l":0},{"t":"VT, VF, PEA, asystole:","l":1},{"t":"Rhythm in PEA may appear normal.","l":2},{"t":"Significant fall in ET CO<sub>2<\/sub> if present.","l":0},{"t":"<b>Cyanosis<\/b>.","l":0},{"t":"Regurgitation and aspiration of gastric contents.","l":0},{"t":"Lack of ventricular contraction on TEE or TTE.","l":0}],"similar":[{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"PE, venous air embolism, or AFE (see Event 21, Pulmonary Embolism, Event 24, Venous Gas Embolism, and Event 81, Amniotic Fluid Embolism).","l":0},{"t":"Eclampsia (see Event 88, Preeclampsia and Eclampsia).","l":0},{"t":"Sepsis (see Event 13, The Septic Patient).","l":0},{"t":"Obstetric hemorrhage (see Event 87, Obstetric Hemorrhage).","l":0},{"t":"Medication reaction (see Event 63, Drug Administration Error).","l":0},{"t":"Local anesthetic overdose (see Event 52, Local Anesthetic Systemic Toxicity).","l":0},{"t":"Total spinal (see Event 89, Total Spinal Anesthesia).","l":0},{"t":"Hypotension (see Event 9, Hypotension).","l":0},{"t":"Seizures (see Event 57, Seizures, and Event 88, Preeclampsia and Eclampsia).","l":0},{"t":"Artifacts on monitoring devices:","l":0},{"t":"ECG artifact (always check the patient).","l":1},{"t":"Pulse oximeter.","l":1},{"t":"NIBP or invasive BP.","l":1}],"management":[{"t":"<i>The key steps are early recognition, prompt resuscitation, and delivery of the fetus. Attempts to transfer patients undergoing CPR to an OR for immediate cesarean section increase mater<i>nal and neonatal risk. Perimortem cesarean section should be performed at the site of the arrest to relieve aortocaval compression, increase maternal CO and allow more effective chest compressions.<\/i><\/i>","l":0},{"t":"Treat the patient, not the monitor.","l":0},{"t":"Verify that the patient is unresponsive and has no carotid pulse:","l":0},{"t":"Other patient monitoring, if present, may confirm absence of circulation.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Pulse oximetry.","l":3},{"t":"ET CO<sub>2<\/sub>, <b>arterial line<\/b> waveform.","l":3},{"t":"<b>Call a code:<\/b>","l":0},{"t":"Call for labor and delivery team and additional anesthesia help.","l":1},{"t":"Prepare for stat cesarean section at the site of the arrest with the goal of delivery within 5 minutes:","l":1},{"t":"A cesarean section will be necessary if no return of spontaneous circulation after 4 minutes.","l":2},{"t":"Call for the crash cart:","l":0},{"t":"Apply defibrillation pads on chest:","l":1},{"t":"<b>Do not<\/b> delay defibrillation for shockable rhythms.","l":2},{"t":"Start CPR <b>immediately<\/b> (C-A-B: compressions, airway, breathing):","l":0},{"t":"<b>Chest compressions:<\/b>","l":1},{"t":"Place hands slightly higher on sternum:","l":2},{"t":"Compressions should be at least <b>100 per minute<\/b> and at least <b>2 inches deep.<\/b>","l":3},{"t":"Rotate compressors every 2 minutes.","l":2},{"t":"Allow for complete recoil of the chest with each compression.","l":2},{"t":"Interruptions in compressions should be less than 10 seconds.","l":2},{"t":"Adequate compressions should generate an ET CO<sub>2<\/sub> of at least 10 mm Hg and a diastolic pressure of greater than 20 mm Hg (if an <b>arterial line<\/b> is in place).","l":2},{"t":"You <b>MUST<\/b> improve CPR quality if above conditions are not met.","l":2},{"t":"<b>Airway/ventilation:<\/b>","l":1},{"t":"Until the patient is intubated, establish bag mask ventilation with <b>100%<\/b> O<sub>2<\/sub> at a compression to ventilation ratio of 30:2 and prepare for endotracheal intubation:","l":2},{"t":"Place ETT and then ventilate at a rate of 10 per minute with continuous compressions.","l":3},{"t":"Assign tasks to skilled responders:","l":0},{"t":"Ensure adequate IV access:","l":1},{"t":"If difficult IV access, place IO line.","l":2},{"t":"Place an <b>arterial line<\/b>.","l":1},{"t":"Call for TEE or TTE machine.","l":1},{"t":"Turn off ALL anesthetics if in use, including epidural infusions.","l":0},{"t":"Follow BLS and ACLS guidelines (see Event 2, Cardiac Arrest) <b><i>but <\/i><\/b>with modifications for the parturient (see the following).","l":0},{"t":"Employ cognitive aids (ACLS guidelines) to help determine diagnosis and treatment:","l":0},{"t":"Drug therapy, dosages, and defibrillation should follow standard ACLS guidelines.","l":1},{"t":"ACLS modifications in pregnant patients:","l":0},{"t":"Place hands slightly higher on sternum while performing chest compressions.","l":1},{"t":"<b>Immediately intubate<\/b> with an ETT and ventilate with <b>100%<\/b> O<sub>2<\/sub>:","l":1},{"t":"The routine use of cricoid pressure during cardiac arrest is not recommended, but if used, remove if impairing ventilation and/or intubation.","l":2},{"t":"Manual left uterine displacement to <b>avoid<\/b> aortocaval compression.","l":1},{"t":"<b>Stop MgSO<sub>4<\/sub> infusion,<\/b> if running:","l":1},{"t":"If Mg2+ toxicity is suspected, administer CaCl<sub>2<\/sub> IV, <b>500 to 1000 mg<\/b>.","l":2},{"t":"Remove external fetal monitors prior to defibrillation.","l":1},{"t":"If an internal fetal monitor is present, disconnect from power supply prior to defibrillation.","l":1},{"t":"If parturient does not respond to resuscitation within 4 minutes, immediate peri<b>mortem cesarean section is indicated at the site of the arrest.<\/b>","l":1},{"t":"Continue all maternal resuscitative interventions (CPR, positioning, defibrillation, drugs, and fluids) during and after perimortem cesarean section.","l":1},{"t":"Continually reassess patient without interrupting chest compressions:","l":0},{"t":"Resumption of spontaneous circulation:","l":1},{"t":"ECG and return of palpable pulse or BP.","l":2},{"t":"Pulse oximetry waveform.","l":2},{"t":"Consider postresuscitation hypothermia for brain protection.","l":0}],"complications":[{"t":"Aspiration of gastric contents.","l":0},{"t":"Laceration of liver.","l":0},{"t":"Pneumothorax or hemothorax.","l":0},{"t":"Rib fracture.","l":0},{"t":"Hypoxic brain injury.","l":0},{"t":"Multiorgan failure.","l":0},{"t":"Maternal death.","l":0},{"t":"Fetal death.","l":0}],"reading":[{"t":"1. Ramsay G, Paglia M, Bourjeily G. When the heart stops: a review of cardiac arrest in pregnancy. J Intensive Care Med 2012;28:204-14."},{"t":"2. Jeejeebhoy FM, Zelop CM, Windrim R, et al. Management of cardiac arrest in pregnancy: a systematic review. Resuscitation 2011;82:801-9."},{"t":"3. Hui D, Morrison LJ, Windrim R, et al. The American Heart Association 2010 guidelines for the management of cardiac arrest in pregnancy: consensus recommendations on implementation strategies. J Obstet Gynaecol Can 2011;33:858-63."},{"t":"4. Neumar Robert W, Otto Charles W, Link Mark S, et al. Part 8: Adult Advanced Cardiovascular Life Support: 2010 American Heart Association guidelines for cardiopulmonary resuscitation and emergency cardiovascular care. Circulation 2010;122:S729-67."},{"t":"5. Vanden Hoek TL, Morrison LJ, Shuster M, et al. Part 12: Cardiac Arrest in Special Situations: 2010 American Heart Association guidelines for cardiopulmonary resuscitation and emergency cardiovascular care. Circulation 2010;122:S829-61."},{"t":"6. Lipman S, Daniels K, Cohen SE, Carvalho B. Labor room setting compared with the operating room for simulated perimortem cesarean delivery: a randomized controlled trial. Obstet Gynecol 2011;118:1090-4."}]}},{"id":83,"title":"Difficult Airway in the Parturient","ch":12,"cat":"Obstetric Events","s":{"definition":[{"t":"Difficult airway in the parturient includes difficult mask ventilation, difficult placement of an SGA, or difficult tracheal intubation.","l":0}],"etiology":[{"t":"Patient factors (specific to pregnancy):","l":0},{"t":"Airway edema.","l":1},{"t":"Increased Mallampati score compared to nonpregnant state.","l":1},{"t":"Breast engorgement.","l":1},{"t":"High risk of regurgitation.","l":1},{"t":"Decreased functional residual capacity.","l":1},{"t":"Increased O<sub>2<\/sub> consumption.","l":1},{"t":"Increased risk of bleeding from mucosal surface.","l":1},{"t":"Other anatomical causes of a difficult airway:","l":0},{"t":"Full dentition.","l":1},{"t":"Obesity/short neck.","l":1},{"t":"Physician factors:","l":0},{"t":"Inexperience with airway management in the parturient.","l":1},{"t":"Failure to respond effectively to a rapidly deteriorating situation.","l":1},{"t":"Equipment factors:","l":0},{"t":"Inexperience with equipment.","l":1},{"t":"Inadequate backup or alternative airway adjuncts or intubating devices.","l":1}],"typical":[{"t":"Cesarean section under general anesthesia:","l":0},{"t":"Contraindication to neuraxial anesthesia.","l":1},{"t":"Failure of neuraxial technique.","l":1},{"t":"Insufficient time to place or dose neuraxial anesthetic.","l":1},{"t":"Maternal refusal to have neuraxial anesthesia.","l":1},{"t":"Maternal and preexisting anatomic abnormalities.","l":0},{"t":"Local anesthetic toxicity requiring airway management.","l":0},{"t":"Nonobstetric surgery during pregnancy.","l":0}],"prevention":[{"t":"Perform a complete airway assessment prior to inducing anesthesia (general or neuraxial).","l":0},{"t":"In patients with known or anticipated difficult airway, perform awake fiberoptic intubation.","l":0},{"t":"Alert the obstetric team to the increased probability of difficult airway management during general anesthesia.","l":0},{"t":"Consider early placement of an epidural catheter in patients at risk of difficult intubation or stat/urgent cesarean section and ensure that the catheter is functional.","l":0},{"t":"Optimize patient positioning prior to induction of general anesthesia.","l":0},{"t":"Prepare for a difficult intubation and have contingency plans if you cannot ventilate and/or cannot intubate:","l":0},{"t":"Consider videolaryngoscope as primary choice for intubation.","l":1},{"t":"Review and practice difficult airway/failed intubation algorithm.","l":0}],"manifestations":[{"t":"Failure to intubate the trachea after two attempts by an experienced anesthesia professional:","l":0},{"t":"Difficult insertion of laryngoscope:","l":1},{"t":"Small or restricted mouth opening.","l":2},{"t":"Masseter spasm secondary to succinylcholine.","l":2},{"t":"Difficult visualization of vocal cords.","l":1},{"t":"Difficult passage of ETT through vocal cords.","l":1},{"t":"Failure to successfully mask ventilate after induction of anesthesia.","l":0},{"t":"Failure to successfully place an SGA.","l":0}],"similar":[{"t":"Anesthesia workstation malfunction, e.g. bag/switch malposition.","l":0},{"t":"Normal airway but unsuccessful intubation due to inexperience of the intubator.","l":0},{"t":"Functional airway obstruction:","l":0},{"t":"Laryngospasm (see Event 97, Laryngospasm).","l":1},{"t":"Bronchospasm (see Event 29, Bronchospasm).","l":1},{"t":"Gastric distention with air.","l":1},{"t":"Endobronchial intubation (see Event 30, Endobronchial Intubation).","l":1}],"management":[{"t":"<i>Obstetric patients have a higher risk of both difficult and failed intubation.<\/i>","l":0,"n":1},{"t":"If difficult airway is known or anticipated, perform an awake fiberoptic intubation since this may be the safest option.","l":0},{"t":"Prepare primary and backup airway equipment:","l":0},{"t":"Have contingency plans if primary plan fails.","l":1},{"t":"Before induction of general anesthesia:","l":0},{"t":"Position patient appropriately.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"“ramp” patient for intubation.","l":3},{"t":"Especially if obese.","l":3},{"t":"Maintain left uterine displacement.","l":1},{"t":"Administer sodium citrate 0.3 M PO, <b>30 mL<\/b>.","l":1},{"t":"Administer ranitidine IV, <b>50 mg<\/b>, and metoclopramide IV, <b>10 mg<\/b>.","l":1},{"t":"Preoxygenate with <b>100%<\/b> O<sub>2<\/sub> with anesthesia breathing circuit.","l":1},{"t":"Prep and drape the patient BEFORE general anesthesia is induced.","l":1},{"t":"If unanticipated difficult intubation after induction:","l":0},{"t":"Call for additional anesthesia help stat if not already present.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Anesthesia professional.","l":3},{"t":"Anesthesia tech.","l":3},{"t":"Call surgeon capable of establishing surgical airway and obtain equipment for surgical airway.","l":1},{"t":"Call for difficult airway cart or supplies (including videolaryngoscope):","l":1},{"t":"Have help set up additional airway equipment.","l":2},{"t":"Ensure adequate oxygenation and ventilation (may be difficult):","l":1},{"t":"Place an oral airway.","l":2},{"t":"Consider two-person bag valve mask technique.","l":2},{"t":"Apply continuous cricoid pressure.","l":2},{"t":"Reposition the patient’s head and neck.","l":2},{"t":"Most experienced person should perform second laryngoscopy:","l":1},{"t":"Use videolaryngoscope.","l":2},{"t":"Use appropriately styleted ETT or bougie.","l":2},{"t":"Adjust cricoid pressure if it is impairing ventilation or intubation.","l":2},{"t":"Use smaller ETT.","l":2},{"t":"If intubation fails on second attempt:","l":0},{"t":"Place an SGA (e.g. LMA) to maintain oxygenation and ventilation:","l":1},{"t":"If SGA placement is successful, clinical situation will dictate whether or not to continue the anesthetic with this airway and deliver the fetus or awaken the patient:","l":2},{"t":"Confirm ventilation with ET CO<sub>2<\/sub>.","l":3},{"t":"Maintain cricoid pressure after placement of SGA.","l":3},{"t":"After delivery, consider whether to attempt tracheal intubation through the SGA (see Event 3, Difficult Tracheal Intubation).","l":2},{"t":"If SGA placement is UNSUCCESSFUL, attempt face mask ventilation.","l":0},{"t":"If face mask ventilation is adequate, but intubation is not possible:","l":0},{"t":"Wake the patient up and reevaluate for awake fiberoptic intubation.","l":1},{"t":"Patient will be at increased risk of awareness with prolonged intubation attempts.","l":1},{"t":"If face mask ventilation is UNSUCCESSFUL, decide whether to awaken the patient or establish a surgical airway:","l":0},{"t":"If muscle relaxation is wearing off, awaken the patient.","l":1},{"t":"If the patient CANNOT BE INTUBATED OR VENTILATED:","l":1},{"t":"Move early and aggressively to emergency cricothyrotomy or other emergency surgical airway.","l":2},{"t":"DO NOT WAIT for the O<sub>2<\/sub> saturation to fall precipitously.","l":2},{"t":"Consider transtracheal jet ventilation, weighing the significant risk of the procedure.","l":2},{"t":"If surgical airway is established, consider whether to awaken the patient or proceed with cesarean section.","l":0},{"t":"Failed airway management may result in maternal cardiac arrest (see Event 82, Cardiac Arrest in the Parturient).","l":0}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Aspiration of gastric contents.","l":0},{"t":"Esophageal intubation.","l":0},{"t":"Airway trauma/bleeding/swelling.","l":0},{"t":"Dental damage.","l":0},{"t":"Cerebral anoxia.","l":0},{"t":"Awareness.","l":0},{"t":"Fetal death.","l":0},{"t":"Maternal death.","l":0}],"reading":[{"t":"1. Berg CJ, Callaghan WM, Syverson C, Henderson Z. Pregnancy-related mortality in the United States, 1998 to 2005. Obstet Gynecol 2010;116:1302-9."},{"t":"2. Hawkins JL, Chang J, Palmer SK, Gibbs CP, Callaghan WM. Anesthesia-related maternal mortality in the United States: 1979–2002. Obstet Gynecol 2011;117:69-74."},{"t":"3. Quinn AC, Milne D, Columb M, Gorton H, Knight M. Failed tracheal intubation in obstetric anaesthesia: 2 yr national case–control study in the UK. Br J Anaesth 2013;110:74-80."},{"t":"4. Rucklidge M, Hinton C. Difficult and failed intubation in obstetrics. Contin Educ Anaesth Crit Care Pain 2012;12:86-91."}]}},{"id":84,"title":"Emergency Cesarean Section","ch":12,"cat":"Obstetric Events","s":{"definition":[{"t":"Emergency cesarean section is the urgent or stat operative delivery of the fetus through an abdominal incision.","l":0}],"etiology":[{"t":"Maternal or fetal complication that, in the opinion of the obstetrician, requires an urgent or stat delivery of the neonate via cesarean section.","l":0}],"typical":[{"t":"Stat cesarean section:","l":0},{"t":"Severe fetal distress.","l":1},{"t":"Prolapsed umbilical cord.","l":1},{"t":"Massive hemorrhage.","l":1},{"t":"Uterine rupture.","l":1},{"t":"Maternal cardiac arrest unresponsive to immediate resuscitation.","l":1},{"t":"Urgent cesarean section:","l":0},{"t":"Mild fetal distress.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Nonreassuring fetal trace.","l":3},{"t":"Fetal intolerance of labor.","l":3},{"t":"Fetal malpresentation in labor.","l":1},{"t":"Failed induction or trial of labor.","l":1},{"t":"Failure to progress or descend in labor.","l":1},{"t":"Abnormal placentation.","l":1},{"t":"Failed forceps or vacuum delivery.","l":1},{"t":"Previous hysterotomy.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Previous cesarean section.","l":3},{"t":"Myomectomy.","l":3},{"t":"Other uterine surgery.","l":3}],"prevention":[{"t":"Identify high-risk parturients.","l":0},{"t":"Maintain left uterine displacement to prevent aortocaval compression.","l":0},{"t":"Careful maternal and fetal monitoring during trial of labor.","l":0},{"t":"Care in the provision of neuraxial anesthesia.","l":0},{"t":"Reduce morbidity and mortality by having a written institutional plan for stat and urgent cesarean section:","l":0},{"t":"Drill and practice management of stat and urgent cesarean sections (using simulation if available).","l":1}],"manifestations":[{"t":"Presence of maternal or fetal indications for emergency cesarean section.","l":0}],"similar":[{"t":"None.","l":0}],"management":[{"t":"<i>In patients presenting for stat cesarean section indicating an immediate threat to maternal or fetal well-being, general anesthesia is the preferred technique. For urgent cesarean section, when time permits and if there are no contraindications, regional anesthesia is the preferred technique.<\/i>","l":0,"n":1},{"t":"Determine the most appropriate anesthetic technique for the parturient after communi<b>cating with the obstetric team.<\/b>","l":0},{"t":"<b>Intrauterine fetal resuscitation:<\/b>","l":0},{"t":"Optimize maternal position.","l":1},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> with nonrebreathing face mask.","l":1},{"t":"Optimize maternal BP.","l":1},{"t":"Discontinue <b>oxytocin<\/b> infusion.","l":1},{"t":"Consider administration of a tocolytic.","l":1},{"t":"For a stat cesarean section or when regional anesthesia is <b>contraindicated<\/b>.","l":0},{"t":"<b>General anesthesia:<\/b>","l":0},{"t":"Before induction of general anesthesia:","l":1},{"t":"Call for anesthesia help.","l":2},{"t":"Position patient appropriately, e.g. “ramp” patient for intubation if obese.","l":2},{"t":"Maintain left uterine displacement.","l":2},{"t":"Check the fetal heart tones:","l":2},{"t":"If the fetal HR is normal, emergency surgery may not be necessary or there may be time to institute a regional anesthetic.","l":3},{"t":"Administer sodium citrate 0.3 M PO, <b>30 mL<\/b>.","l":2},{"t":"Administer ranitidine IV, <b>50 mg<\/b>, and metoclopramide IV, <b>10 mg<\/b>.","l":2},{"t":"Preoxygenate with <b>100%<\/b> O<sub>2<\/sub> with anesthesia breathing circuit.","l":2},{"t":"Prep and drape the patient BEFORE general anesthesia is induced.","l":2},{"t":"Administer prophylactic antibiotics <b>as soon as possible<\/b> for stat and urgent cesarean section.","l":2},{"t":"<b>Induce general anesthesia:<\/b>","l":1},{"t":"Perform a RSI with cricoid pressure:","l":2},{"t":"<b>Propofol<\/b> IV, <b>2 to 2.5 mg/kg<\/b>:","l":3},{"t":"If the patient is hypotensive prior to induction:","l":4},{"t":"<b>Etomidate<\/b> IV, <b>0.2 mg/kg<\/b>, or <b>ketamine<\/b> IV, <b>1 to 2 mg/kg<\/b>.","l":5},{"t":"<b>Succinylcholine<\/b> IV, <b>1 to 2 mg/kg<\/b>.","l":3},{"t":"Intubate the trachea and confirm placement with ET CO<sub>2<\/sub> and auscultation.","l":3},{"t":"Proceed with surgery.","l":3},{"t":"Maintenance of general anesthesia before delivery:","l":1},{"t":"Ventilate patient with <b>50%<\/b> O<sub>2<\/sub>/<b>50%<\/b> N<sub>2<\/sub>O and 0.5 to 1.0 MAC of volatile anesthetic.","l":2},{"t":"Maintenance of general anesthesia after delivery:","l":1},{"t":"Ventilate patient with <b>30%<\/b> O<sub>2<\/sub>/<b>70%<\/b> N<sub>2<\/sub>O and 0.5 MAC of volatile anesthetic.","l":2},{"t":"Administer opioids:","l":2},{"t":"Fentanyl IV, <b>100 to 250 µg<\/b>.","l":3},{"t":"Morphine IV, <b>5 to 15 mg<\/b>.","l":3},{"t":"Hydromorphone IV, <b>0.5 to 2 mg<\/b>.","l":3},{"t":"Consider <b>midazolam<\/b> IV, <b>1 to 2 mg<\/b> for amnesia.","l":2},{"t":"Consider bilateral transversus abdominis plane blocks prior to extubation.","l":2},{"t":"Nondepolarizing muscle relaxants may not be required.","l":2},{"t":"After delivery of placenta:","l":1},{"t":"Administer <b>oxytocin<\/b> IV, 1 to 2 U bolus followed by an infusion of 10 U/hr, e.g. 40 U of <b>oxytocin<\/b>/L at 250 mL/hr.","l":2},{"t":"Confirm adequate uterine tone (adjust <b>oxytocin<\/b> infusion rate as necessary).","l":2},{"t":"Continue IV fluids to maintain circulating fluid volume.","l":1},{"t":"<b>Extubation:<\/b>","l":1},{"t":"Suction the oropharynx.","l":2},{"t":"Extubate the patient when fully conscious, in an upright or lateral position, NOT supine due to the risk of aspiration.","l":2},{"t":"Transfer with <b>100%<\/b> O<sub>2<\/sub> via a nonrebreathing face mask.","l":2},{"t":"For URGENT cesarean section (options include spinal, combined spinal-epidural [CSE], in situ epidural).","l":0},{"t":"Prior to establishing regional anesthetic:","l":0},{"t":"Infuse hetastarch IV, <b>500 mL<\/b>.","l":1},{"t":"Administer sodium citrate 0.3 M PO, <b>30 mL<\/b> (if not NPO, otherwise it is not required routinely).","l":1},{"t":"Administer ranitidine IV, <b>50 mg<\/b>, and metoclopramide IV, <b>10 mg<\/b>.","l":1},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> via nonrebreathing face mask until delivery of the infant (or longer if required).","l":1},{"t":"<b>Spinal anesthetic:<\/b>","l":0},{"t":"Hyperbaric bupivacaine <b>0.75%<\/b> (<b>12 mg<\/b> = <b>1.6 mL<\/b>), fentanyl <b>10 µg<\/b>, morphine <b>100 to 200 µg<\/b>.","l":1},{"t":"If patient is less than 5 feet, reduce bupivacaine dose to <b>10.5 mg<\/b>.","l":1},{"t":"<b>CSE anesthetic:<\/b>","l":0},{"t":"Hyperbaric bupivacaine <b>0.75%<\/b> (<b>12 mg<\/b> = <b>1.6 mL<\/b>), fentanyl <b>10 µg<\/b>, morphine <b>100 to 200 µg<\/b>:","l":1},{"t":"If parturient is less than 5 feet, or CSE is performed after an inadequate labor epidural top-up, reduce the bupivacaine dose to <b>10.5 mg<\/b> (<b>1.4 mL<\/b>) and use the same dose of intrathecal fentanyl and morphine as previously stated.","l":2},{"t":"Use the epidural catheter for supplementation with local anesthetic if required.","l":2},{"t":"<b>Epidural in situ:<\/b>","l":0},{"t":"Administer local anesthetic via the epidural catheter:","l":1},{"t":"<b>Lidocaine 2%<\/b> with <b>epinephrine<\/b> (1:200,000) and NaHCO<sub>3<\/sub> (<b>1 mL<\/b> of <b>8.4%<\/b> NaHCO<sub>3<\/sub> per <b>10 mL<\/b> of <b>lidocaine<\/b>):","l":2},{"t":"Administer <b>lidocaine<\/b> in <b>5 mL<\/b> increments (usual dose required is <b>15 to 20 mL<\/b>, with a maximum dose of <b>7 mg/kg<\/b>).","l":3},{"t":"Chloroprocaine <b>3%<\/b> (usual volume <b>15 to 25 mL<\/b>, maximum dose of <b>11 mg/kg<\/b>):","l":2},{"t":"Chloroprocaine has a shorter duration and less dense block compared to <b>lidocaine<\/b>, but should still be administered incrementally.","l":3},{"t":"Following placement of block:","l":0},{"t":"Ensure left uterine displacement.","l":1},{"t":"Measure NIBP every minute:","l":1},{"t":"Treat hypotension with increasing doses of vasopressor:","l":2},{"t":"<b>Phenylephrine<\/b> IV, <b>100 to 200 µg<\/b>.","l":3},{"t":"<b>Ephedrine<\/b> IV, <b>5 to 10 mg<\/b>.","l":3},{"t":"Check sensory level and motor block frequently prior to the start of surgery.","l":1},{"t":"Convert to general anesthetic if regional anesthetic is inadequate.","l":1}],"complications":[{"t":"Difficult intubation.","l":0},{"t":"Failed intubation.","l":0},{"t":"Awareness.","l":0},{"t":"Aspiration.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Local anesthetic toxicity.","l":0},{"t":"Inadequate regional anesthetic.","l":0},{"t":"High or total spinal.","l":0}],"reading":[{"t":"1. American College of Obstetricians and Gynecologists and American Society of Anesthesiologists. Optimal goals for anesthesia in obstetric care. ACOG Committee Opinion No. 433. Obstet Gynecol 2009;113:1197-9."},{"t":"2. Martin JA, Hamilton BE, Ventura SJ, et al. Births: final data for 2010. National vital statistics reports; vol 61 no 1. Hyattsville, Md: National Center for Health Statistics; 2012."},{"t":"3. Rollins M, Lucero J. Overview of anesthetic considerations for cesarean delivery. Br Med Bull 2012;101:105-25."},{"t":"4. American College of Obstetricians and Gynecologists. Antimicrobial prophylaxis for cesarean delivery: timing of administration. ACOG Committee Opinion No. 465. Obstet Gynecol 2010;116:791-2."}]}},{"id":85,"title":"Hypotension Following Neuraxial Anesthesia","ch":12,"cat":"Obstetric Events","s":{"definition":[{"t":"Hypotension following neuraxial anesthesia is a decrease in arterial BP of 20% from baseline following neuraxial anesthesia or a systolic BP &lt;90 mm Hg.","l":0}],"etiology":[{"t":"Sympathetic blockade from neuraxial anesthesia in the parturient.","l":0},{"t":"Aortocaval compression.","l":0}],"typical":[{"t":"Spinal anesthesia.","l":0},{"t":"High dermatomal level of neuraxial anesthesia.","l":0},{"t":"Rapid induction of epidural anesthesia, e.g. not titrated.","l":0},{"t":"Neuraxial anesthesia in the hypovolemic parturient.","l":0},{"t":"Parturient in the supine position without left uterine displacement.","l":0}],"prevention":[{"t":"Maintain left uterine displacement at all times.","l":0},{"t":"Ensure adequate IV access.","l":0},{"t":"Administer a <b>500 mL<\/b> bolus of <b>colloid<\/b> as a preload or coload to spinal anesthesia for cesarean section.","l":0},{"t":"Use vasopressors to maintain normotension prior to delivery of the infant during a cesarean section:","l":0},{"t":"<b>Phenylephrine<\/b> IV, <b>50 to 200 µg<\/b>.","l":1},{"t":"<b>Ephedrine<\/b> IV, <b>5 to 10 mg<\/b>.","l":1},{"t":"Use thromboembolic stockings as aids to prevent hypotension.","l":0},{"t":"Use incremental doses of local anesthetic when dosing a labor epidural.","l":0}],"manifestations":[{"t":"Nausea and/or vomiting:","l":0},{"t":"Secondary to <b>hypotension<\/b> until proven otherwise.","l":1},{"t":"Decrease in maternal BP from baseline.","l":0},{"t":"Diaphoresis.","l":0},{"t":"Weak or absent peripheral pulses.","l":0},{"t":"Inability of pulse oximeter or NIBP device to give a reading.","l":0},{"t":"Decreased O<sub>2<\/sub> saturation.","l":0},{"t":"<b>Arrhythmias<\/b>.","l":0},{"t":"Mental status changes.","l":0},{"t":"Fetal <b>bradycardia<\/b> or decelerations.","l":0},{"t":"Organ hypoperfusion.","l":0},{"t":"Decreased ET CO<sub>2<\/sub>.","l":0}],"similar":[{"t":"Aortocaval compression.","l":0},{"t":"Hypotension from other causes (see Event 9, Hypotension).","l":0},{"t":"Hemorrhage (see Event 1, Acute Hemorrhage, and Event 87, Obstetric Hemorrhage).","l":0},{"t":"AFE (see Event 81, Amniotic Fluid Embolism).","l":0},{"t":"PE (see Event 21, Pulmonary Embolism).","l":0},{"t":"Venous air embolism (see Event 24, Venous Gas Embolism).","l":0},{"t":"Total spinal anesthesia (see Event 89, Total Spinal Anesthesia).","l":0},{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"Artifact in BP measurement (see Event 9, Hypotension):","l":0},{"t":"Motion artifact with NIBP measurement, e.g. shivering.","l":1},{"t":"Incorrect NIBP cuff size.","l":1},{"t":"Transducer height artifact.","l":1}],"management":[{"t":"<i>Resuscitation equipment and medications should be immediately available at all sites where neuraxial anesthesia is performed.<\/i>","l":0,"n":1},{"t":"Ensure left uterine displacement.","l":0},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> by nonrebreathing face mask to the awake patient.","l":1},{"t":"Expand the circulating fluid volume:","l":0},{"t":"Infuse IV fluids:","l":1},{"t":"Hetastarch IV, <b>500 mL<\/b> (more efficacious than <b>crystalloid<\/b> in preventing hypotension).","l":2},{"t":"Monitor the parturient frequently after initiating neuraxial anesthesia:","l":0},{"t":"BP:","l":1},{"t":"Cesarean section: q1m intervals until delivery of the infant, then q2-3m thereafter if cardiovascularly stable.","l":2},{"t":"Labor epidural: q2m intervals for the first 20 minutes, then q15m for the duration of the epidural infusion.","l":2},{"t":"Assess level of sensory block frequently until stable.","l":1},{"t":"<b>Monitor fetal HR.<\/b>","l":0},{"t":"<b>Immediately<\/b> check the BP if:","l":0},{"t":"The parturient complains of nausea or feeling faint.","l":1},{"t":"The parturient is unresponsive to verbal stimuli.","l":1},{"t":"Fetal bradycardia or decelerations are observed:","l":1},{"t":"Persistent fetal distress will require stat or urgent cesarean section (see Event 84, Emergency Cesarean Section).","l":2},{"t":"If patient is hypotensive, restore maternal BP to near-baseline values until delivery of the infant:","l":0},{"t":"Administer additional fluid rapidly.","l":1},{"t":"Administer vasopressor:","l":1},{"t":"<b>Phenylephrine<\/b> IV, <b>50 to 200 µg<\/b>.","l":2},{"t":"<b>Ephedrine<\/b> IV, <b>5 to 10 mg<\/b>.","l":2},{"t":"If patient is unresponsive and hypotension is profound, administer <b>epinephrine<\/b> IV, <b>10 to 100 µg<\/b>.","l":2},{"t":"Reassess adequacy of IV access.","l":1},{"t":"Evaluate for other causes of hypotension (see Event 9, Hypotension).","l":0},{"t":"If cardiac arrest occurs:","l":0},{"t":"Call for help and initiate CPR (see Event 2, Cardiac Arrest, and Event 82, Cardiac Arrest in the Parturient).","l":1}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Hypoventilation.","l":0},{"t":"Aspiration of gastric contents.","l":0},{"t":"Organ hypoperfusion.","l":0},{"t":"Placental hypoperfusion and fetal acidosis.","l":0},{"t":"Acute renal failure.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Carvalho B, Mercier FJ, Riley ET, Brummel C, Cohen SE. Hetastarch co-loading is as effective as pre-loading for the prevention of hypotension following spinal anesthesia for cesarean delivery. Int J Obstet Anesth 2009;18:150-5."},{"t":"2. Ngan Kee WD, Khaw KS, Ng FF. Comparison of phenylephrine infusion regimens for maintaining maternal blood pressure during spinal anaesthesia for Caesarean section. Br J Anaesth 2004;92:469-74."},{"t":"3. Loubert C. Fluid and vasopressor management for Cesarean delivery under spinal anesthesia: continuing professional development. Can J Anaesth 2012;59:604-19."},{"t":"4. American Society of Anesthesiologists Task Force on Obstetric Anesthesia. Practice guidelines for obstetric anesthesia: an updated report by the American Society of Anesthesiologists Task Force on Obstetric Anesthesia. Anesthesiology 2007;106:843-63."}]}},{"id":86,"title":"Magnesium Toxicity","ch":12,"cat":"Obstetric Events","s":{"definition":[{"t":"Magnesium toxicity occurs with a serum Mg2+ level above the therapeutic range.","l":0}],"etiology":[{"t":"Overdose of MgSO<sub>4<\/sub>.","l":0},{"t":"Failure to monitor serum Mg2+ levels (especially in patients with oliguria and/or renal impairment).","l":0}],"typical":[{"t":"Seizure prophylaxis in preeclampsia.","l":0},{"t":"Prophylaxis and seizure treatment in eclampsia.","l":0},{"t":"Fetal neuroprotection in preterm labor.","l":0},{"t":"Tocolysis in preterm labor.","l":0},{"t":"Renal insufficiency or failure.","l":0}],"prevention":[{"t":"Check baseline serum creatinine level before MgSO<sub>4<\/sub> administration or <b>immediately<\/b> after com mencement:","l":0},{"t":"Reduce MgSO<sub>4<\/sub> dose in patients with renal impairment.","l":1},{"t":"Administer MgSO<sub>4<\/sub> via an infusion pump.","l":0},{"t":"Monitor serum Mg2+ levels every 4 to 6 hours during infusions.","l":0},{"t":"Monitor BP, HR, O<sub>2<\/sub> saturation, RR, level of consciousness, deep tendon reflexes, urine output, and fetal HR during infusions.","l":0}],"manifestations":[{"t":"General:","l":0},{"t":"Warmth.","l":1},{"t":"Flushing.","l":1},{"t":"Nausea.","l":1},{"t":"Pulmonary:","l":0},{"t":"Hypoventilation.","l":1},{"t":"Pulmonary <b>edema<\/b>.","l":1},{"t":"Cardiovascular:","l":0},{"t":"Palpitations.","l":1},{"t":"<b>Hypotension<\/b>.","l":1},{"t":"Chest pain and tightness.","l":1},{"t":"ECG changes.","l":1},{"t":"such as:","l":2,"e":1},{"t":"<b>Bradycardia<\/b>.","l":3},{"t":"Increased PR interval.","l":3},{"t":"Increased QRS interval.","l":3},{"t":"Increased QT interval.","l":3},{"t":"Complete heart block.","l":3},{"t":"Neurologic:","l":0},{"t":"Muscle weakness.","l":1},{"t":"Double vision.","l":1},{"t":"Slurred speech.","l":1},{"t":"Sedation.","l":1},{"t":"Confusion.","l":1}],"similar":[{"t":"Respiratory depression (see Event 56, Postoperative Failure to Breathe).","l":0},{"t":"Cardiovascular collapse (see Event 82, Cardiac Arrest in the Parturient).","l":0},{"t":"Adrenocortical insufficiency (see Event 38, Addisonian Crisis).","l":0},{"t":"Hyperkalemia (see Event 40, Hyperkalemia).","l":0}],"management":[{"t":"STOP and disconnect the MgSO<sub>4<\/sub> infusion.","l":0},{"t":"<b>Assess patient:<\/b>","l":0},{"t":"Ensure adequate oxygenation and ventilation:","l":1},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> with a nonrebreathing face mask.","l":2},{"t":"May require bag valve mask ventilation and/or RSI:","l":2},{"t":"If advanced airway technique is required, <b>call for help.<\/b>","l":3},{"t":"Maintain left uterine displacement.","l":1},{"t":"<b>Use fluids cautiously<\/b> during magnesium infusion as pulmonary edema may occur.","l":1},{"t":"Maintain BP with vasopressors.","l":1},{"t":"<b>Monitor ECG continuously.<\/b>","l":1},{"t":"Monitor neurological signs and symptoms, including level of consciousness and deep tendon reflexes.","l":1},{"t":"Check serum Mg2+ level:","l":0},{"t":"1.7 to 2.4 mg/dL—normal serum concentration.","l":1},{"t":"5.0 to 9.0 mg/dL—therapeutic serum concentration.","l":1},{"t":"&gt;12 mg/dL—deep tendon reflexes absent.","l":1},{"t":"15 to 20 mg/dL—respiratory arrest.","l":1},{"t":"&gt;25 mg/dL—cardiac arrest.","l":1},{"t":"<b>Administer calcium:<\/b>","l":0},{"t":"<b>Calcium gluconate<\/b> IV, <b>1000 mg<\/b> over 3 minutes, repeat as necessary.","l":1},{"t":"CaCl<sub>2<\/sub> <b>10%<\/b> IV, <b>5 mL<\/b>, may be given as an alternative.","l":1},{"t":"<b>Promote Mg2+ excretion:<\/b>","l":0},{"t":"Administer small IV fluid boluses (<b>250 to 500 mL<\/b>).","l":1},{"t":"<b>Furosemide<\/b> IV, <b>20 mg<\/b>.","l":1},{"t":"Consider hemofiltration.","l":0},{"t":"If ECG evidence of toxicity:","l":0},{"t":"Consider <b>insulin<\/b> or <b>dextrose<\/b> infusion.","l":1}],"complications":[{"t":"Pulmonary edema.","l":0},{"t":"Respiratory depression/failure.","l":0},{"t":"Potentiation of nondepolarizing muscle relaxants.","l":0},{"t":"Hypotension.","l":0},{"t":"Bradycardia.","l":0},{"t":"Hypocalcemia.","l":0},{"t":"Hyperkalemia.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. McDonnell NJ, Muchatuta NA, Paech MJ. Acute magnesium toxicity in an obstetric patient undergoing general anaesthesia for caesarean delivery. Int J Obstet Anesth 2010;19:226-31."},{"t":"2. Altman D, Carroli G, Duley L, et al. Magpie Trial Collaboration Group. Do women with pre-eclampsia, and their babies, benefit from magnesium sulphate? The Magpie Trial: a randomised placebo-controlled trial. Lancet 2002;359:1877-90."},{"t":"3. Belfort M, Saade G, Foley M, Phelan J, Dildy G. Critical care obstetrics. 5th ed. West Sussex, UK: Wiley Blackwell; 2010, p. 443."}]}},{"id":87,"title":"Obstetric Hemorrhage","ch":12,"cat":"Obstetric Events","s":{"definition":[{"t":"Obstetric hemorrhage is peripartum blood loss of &gt;500 mL for a vaginal delivery and &gt;1000 mL for a cesarean delivery; these limits may or may not produce hemodynamic compromise in a particular patient.","l":0}],"etiology":[{"t":"Uterine atony.","l":0},{"t":"Placental pathology.","l":0},{"t":"Obstetric trauma.","l":0},{"t":"Coagulopathy.","l":0}],"typical":[{"t":"Uterine atony (accounts for almost 80% of all causes of postpartum hemorrhage):","l":0},{"t":"Age &lt;20 or &gt;40 years.","l":1},{"t":"Cesarean section.","l":1},{"t":"Multiparous patients.","l":1},{"t":"Multiple gestation.","l":1},{"t":"Polyhydramnios.","l":1},{"t":"Macrosomia.","l":1},{"t":"Chorioamnionitis.","l":1},{"t":"Hypertensive disease of pregnancy.","l":1},{"t":"Prolonged labor.","l":1},{"t":"Retained placenta.","l":1},{"t":"Antepartum hemorrhage.","l":1},{"t":"Abnormal placentation:","l":0},{"t":"<i>Placenta previa <\/i>(placenta located in the lower uterine segment over the cervix):","l":1},{"t":"Previous cesarean section or uterine surgery.","l":2},{"t":"Multiparity or advanced maternal age.","l":2},{"t":"<i>Placenta accreta, increta, and percreta <\/i>(placenta attaches to, into, or through the myometrium):","l":1},{"t":"Other uterine surgery.","l":2},{"t":"Multiparity or advanced maternal age.","l":2},{"t":"Hypertensive disease of pregnancy.","l":2},{"t":"Smoking.","l":2},{"t":"Infection.","l":2},{"t":"<i>Abruptio placentae <\/i>(premature separation of a normally implanted placenta after 20 weeks’ gestation):","l":1},{"t":"Hypertensive disease of pregnancy.","l":2},{"t":"Premature rupture of membranes.","l":2},{"t":"Increased uterine size.","l":2},{"t":"Increasing parity.","l":2},{"t":"Previous history of placental abruption.","l":2},{"t":"Amniocentesis.","l":2},{"t":"Trauma.","l":2},{"t":"Maternal cocaine use.","l":2},{"t":"Uterine rupture:","l":0},{"t":"Previous cesarean section or uterine surgery.","l":1},{"t":"Vaginal birth after cesarean section.","l":1},{"t":"Dysfunctional labor.","l":1},{"t":"Augmented labor.","l":1},{"t":"Increasing parity.","l":1},{"t":"Uterine instrumentation either intrapartum or postpartum.","l":1},{"t":"Uterine inversion:","l":0},{"t":"Mismanaged third stage of labor.","l":1},{"t":"Precipitous labor.","l":1},{"t":"Retained placenta:","l":0},{"t":"Previous retained placenta.","l":1},{"t":"Scarred uterus.","l":1},{"t":"Preterm delivery.","l":1},{"t":"Induced labor.","l":1},{"t":"Increasing parity.","l":1},{"t":"Lacerations of the cervix or vagina during delivery:","l":0},{"t":"Instrumented delivery.","l":1},{"t":"Macrosomia.","l":1},{"t":"Acquired or congenital coagulopathy.","l":0}],"prevention":[{"t":"Create institutional <b>MTP<\/b>:","l":0},{"t":"Will not prevent obstetric hemorrhage but may reduce morbidity.","l":1},{"t":"Identify parturients at risk of obstetric hemorrhage early.","l":0},{"t":"Treat coagulopathy early.","l":0}],"manifestations":[{"t":"Abnormal bleeding from the vagina or surgical site.","l":0},{"t":"<b>Tachycardia<\/b>.","l":0},{"t":"<b>Hypotension<\/b>:","l":0},{"t":"May be a late sign in younger parturients.","l":1},{"t":"Fetal <b>bradycardia<\/b> or decelerations.","l":0},{"t":"Acute anemia.","l":0},{"t":"Coagulopathy or DIC:","l":0},{"t":"Oozing from puncture sites.","l":1},{"t":"Abnormal coagulation profile.","l":1}],"similar":[{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"Septic shock (see Event 13, The Septic Patient).","l":0},{"t":"Hypotension from other causes (see Event 9, Hypotension):","l":0},{"t":"Occult bleeding from another site, e.g. gastrointestinal bleed.","l":1},{"t":"Maternal dehydration.","l":0},{"t":"AFE (see Event 81, Amniotic Fluid Embolism).","l":0}],"management":[{"t":"<i>Management of obstetric hemorrhage requires a multidisciplinary team approach, including obstetric, anesthesiology, hematology, blood bank, critical care, and IR.<\/i>","l":0,"n":1},{"t":"Check and verify maternal vital signs.","l":0},{"t":"Inform the obstetrician and call for help (see Event 1, Acute Hemorrhage).","l":0},{"t":"Maintain left uterine displacement even if postpartum:","l":0},{"t":"Enlarged uterus can cause aortocaval compression.","l":1},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> by a nonrebreathing face mask:","l":1},{"t":"Intubate the patient if there is loss of consciousness, respiratory failure, or severe cardiovascular collapse.","l":2},{"t":"Ventilate with <b>100%<\/b> O<sub>2<\/sub> after intubation.","l":2},{"t":"Patient may require urgent airway management:","l":1},{"t":"If urgent airway management is necessary and patient is conscious, perform RSI with cricoid pressure and intubate the trachea:","l":2},{"t":"<b>Etomidate<\/b> IV, <b>0.2 to 0.3 mg/kg<\/b>, or <b>ketamine<\/b> IV, <b>0.5 to 1.0 mg/kg<\/b>.","l":3},{"t":"<b>Succinylcholine<\/b> IV, <b>1 to 2 mg/kg<\/b>.","l":3},{"t":"Identify and treat the cause of hemorrhage:","l":0},{"t":"For uterine atony:","l":1},{"t":"Surgical treatment:","l":2},{"t":"Bimanual uterine massage and/or uterine packing.","l":3},{"t":"Hold pressure on the bleeding site.","l":3},{"t":"Bakri balloon.","l":3},{"t":"B-Lynch suture.","l":3},{"t":"Vessel ligation (uterine or iliac vessels).","l":3},{"t":"Hysterectomy.","l":3},{"t":"Pharmacological treatment:","l":2},{"t":"Administer <b>oxytocin<\/b> IV, 1 to 2 U bolus followed by an infusion at 10 U/hr, e.g. 40 U of <b>oxytocin<\/b>/L at 250 mL/hr [or greater if required]—may cause hypotension, nausea, vomiting.","l":3},{"t":"Administer Methergine (<b>methylergonovine<\/b>) IM, <b>0.2 mg<\/b> (may cause severe hypertension, palpitations, headache).","l":3},{"t":"Administer Hemabate (<b>carboprost<\/b>) IM, <b>0.25 mg<\/b> (may cause bronchospasm, hypertension, nausea, vomiting, diarrhea, flushing).","l":3},{"t":"Administer Cytotec (misoprostol) buccal, <b>600 µg<\/b> (may cause pyrexia, diarrhea).","l":3},{"t":"IR:","l":2},{"t":"Emergency consultation for therapeutic options and possible uterine artery embolization.","l":3},{"t":"<b>Support the circulation:<\/b>","l":0},{"t":"Ensure adequate IV access (two <b>large-bore<\/b> IVs).","l":1},{"t":"Rapidly infuse <b>crystalloid<\/b> and/or <b>colloid<\/b>.","l":1},{"t":"Treat hypotension with vasopressors, increasing doses as needed:","l":1},{"t":"<b>Phenylephrine<\/b> IV, <b>50 to 200 µg<\/b>.","l":2},{"t":"<b>Ephedrine<\/b> IV, <b>5 to 10 mg<\/b>.","l":2},{"t":"<b>Epinephrine<\/b> IV, <b>10 to 100 µg<\/b>.","l":2},{"t":"Place an <b>arterial line<\/b> and consider placement of <b>CVP<\/b> line for infusion of vasopressors and monitoring of fluid status.","l":1},{"t":"Prepare for massive transfusion and initiate <b>MTP<\/b>:","l":0},{"t":"Inform the blood bank that more blood and blood products will be needed emergently.","l":1},{"t":"Get help to set up a rapid infusor device (and cell saver if appropriate).","l":1},{"t":"<b>Transfuse blood products:<\/b>","l":0},{"t":"Use a fluid warmer.","l":1},{"t":"Transfuse an RBC:<b>FFP<\/b> ratio of 1:1 or 2:1:","l":1},{"t":"O-negative blood if crossmatched blood is not available.","l":2},{"t":"Transfuse RBCs to maintain hemoglobin &gt;7 g/dL.","l":2},{"t":"Transfuse additional <b>FFP<\/b> if <b>PT<\/b>/<b>aPTT<\/b> is prolonged.","l":2},{"t":"Transfuse <b>platelets<\/b> if &lt;50,000/µL.","l":2},{"t":"Transfuse <b>cryoprecipitate<\/b> if <b>fibrinogen<\/b> &lt;200 mg/dL).","l":2},{"t":"Consult hematology if necessary.","l":0},{"t":"Maintain normothermia.","l":0},{"t":"Frequent lab draws for <b>ABG<\/b>, CBC, <b>PT<\/b>/<b>aPTT<\/b>, <b>fibrinogen<\/b>, metabolic panel, and Ca<sup>2+<\/sup>.","l":0},{"t":"If the patient is under general anesthesia:","l":0},{"t":"Use volatile anesthetic agents with caution (MAC &lt;0.5) as they decrease uterine tone.","l":1},{"t":"Supplement anesthetic with IV agents (benzodiazepines and opioids).","l":1}],"complications":[{"t":"Hypotension.","l":0},{"t":"Hypoxemia.","l":0},{"t":"ARDS or TRALI.","l":0},{"t":"Multiorgan failure.","l":0},{"t":"Coagulopathy.","l":0},{"t":"Hypothermia.","l":0},{"t":"Hypocalcemia.","l":0},{"t":"Hyperkalemia.","l":0},{"t":"Volume overload.","l":0},{"t":"Infection.","l":0},{"t":"Aspiration.","l":0},{"t":"Transfusion reaction.","l":0}],"reading":[{"t":"1. Bateman BT, Berman MF, Riley LE, Leffert LR. The epidemiology of postpartum hemorrhage in a large, nationwide sample of deliveries. Anesth Analg 2010;110:1368-73."},{"t":"2. Pacheco LD, Saade GR, Gei AF, Hankins GD. Cutting-edge advances in the medical management of obstetrical hemorrhage. Am J Obstet Gynecol 2011;205:526-32."},{"t":"3. Wise A, Clark V. Challenges of major obstetric haemorrhage. Best Pract Res Clin Obstet Gynaecol 2010;24:353-65."},{"t":"4. Mayer DC, Smith KA. Antepartum and postpartum hemorrhage. In: Chestnut DH, Polley LS, Tsen LC, Wong CA, editors. Chestnut’s obstetric anesthesia: principles and practice. 4th ed. Philadelphia: Mosby; 2009. p. 811-36."},{"t":"5. Stafford I, Belfort MA, Dildy GA III. Etiology and management of hemorrhage. In: Belfort M, Saade G, Foley M, Phelan J, Dildy G, editors. Critical care obstetrics. 5th ed. West Sussex, UK: Wiley Blackwell; 2010. p. 308-26."}]}},{"id":88,"title":"Preeclampsia and Eclampsia","ch":12,"cat":"Obstetric Events","s":{"definition":[{"t":"Preeclampsia is a multisystem disease characterized by hypertension, peripheral edema, proteinuria, and other organ involvement with onset of symptoms typically after 20 weeks’ gestation.","l":0},{"t":"Eclampsia is the new onset of seizures in a woman with preeclampsia.","l":0}],"etiology":[{"t":"Unknown.","l":0}],"typical":[{"t":"Primarily a disorder of first pregnancies.","l":0},{"t":"History of preeclampsia.","l":0},{"t":"Chronic hypertension.","l":0},{"t":"Multiple gestation.","l":0},{"t":"Diabetes.","l":0},{"t":"Obesity.","l":0},{"t":"Advanced maternal age.","l":0},{"t":"African American ethnicity.","l":0},{"t":"Vascular and connective tissue disease.","l":0},{"t":"Nephropathy.","l":0},{"t":"Asthma.","l":0},{"t":"Hydatidiform mole.","l":0},{"t":"Antiphospholipid antibody syndrome.","l":0}],"prevention":[{"t":"Identify patients at risk of preeclampsia:","l":0},{"t":"Low-dose aspirin has some benefit when used for prevention of preeclampsia in subsequent pregnancies.","l":1}],"manifestations":[{"t":"<b>Hypertension<\/b>, defined as BP &gt;140/90 mm Hg.","l":0},{"t":"Proteinuria, defined as &gt;300 mg of protein/L of urine in a 24-hour period.","l":0},{"t":"<b>Edema<\/b>:","l":0},{"t":"Generalized facial and upper extremity <b>edema<\/b> as opposed to dependent <b>edema<\/b> of pregnancy.","l":1},{"t":"HELLP syndrome:","l":0},{"t":"Hemolysis, elevated liver enzymes, and low platelets:","l":1},{"t":"A variant of severe preeclampsia characterized by rapid clinical deterioration.","l":2},{"t":"Airway <b>edema<\/b>.","l":0},{"t":"Pulmonary:","l":0},{"t":"Pulmonary <b>edema<\/b>, secondary to pulmonary capillary leak, which can be exacerbated by a decrease in colloid oncotic pressure.","l":1},{"t":"ARDS.","l":1},{"t":"Cardiovascular:","l":0},{"t":"Left ventricular function can be hyperdynamic or decreased.","l":1},{"t":"Renal:","l":0},{"t":"Decreased glomerular filtration rate.","l":1},{"t":"Elevated serum creatinine.","l":1},{"t":"Hyperuricemia.","l":1},{"t":"<b>Oliguria<\/b>.","l":1},{"t":"Acute renal failure.","l":1},{"t":"CNS:","l":0},{"t":"Hyperreflexia, clonus, headache, visual changes, somnolence, CNS irritability, cerebral <b>edema<\/b>, <b>seizures<\/b> (eclampsia), intracranial hemorrhage.","l":1},{"t":"Hematologic:","l":0},{"t":"Thrombocytopenia.","l":1},{"t":"HELLP syndrome.","l":1},{"t":"DIC.","l":1},{"t":"Hepatic:","l":0},{"t":"Epigastric pain.","l":1},{"t":"HELLP syndrome.","l":1},{"t":"Subcapsular bleeding.","l":1},{"t":"Hepatic rupture.","l":1},{"t":"Obstetric complications:","l":0},{"t":"Impaired uterine blood flow.","l":1},{"t":"Placental infarction.","l":1},{"t":"Intrauterine growth retardation.","l":1},{"t":"Oligohydramnios.","l":1},{"t":"Preterm labor.","l":1},{"t":"Placental abruption.","l":1},{"t":"Fetal distress.","l":1},{"t":"CLASSIFICATION OF HYPERTENSIVE DISORDERS IN PREGNANCY","l":0,"h":1},{"t":"Gestational <b>hypertension<\/b>:","l":0},{"t":"No preexisting <b>hypertension<\/b> or other signs and symptoms of preeclampsia.","l":1},{"t":"Preeclampsia:","l":0},{"t":"Mild preeclampsia:","l":1},{"t":"<b>Hypertension<\/b>—BP ≥140/90 mm Hg.","l":2},{"t":"Proteinuria—&gt;300 mg/24 hr or 1+ on dipstick specimen.","l":2},{"t":"Severe preeclampsia, one or more of the following criteria:","l":1},{"t":"<b>Hypertension<\/b>—BP ≥160/110 mm Hg.","l":2},{"t":"Proteinuria—&gt;5 g/24 hr or 3+ on dipstick specimen.","l":2},{"t":"<b>Oliguria<\/b> —&lt;500 mL in 24 hours.","l":2},{"t":"Cerebral or visual disturbance.","l":2},{"t":"Pulmonary <b>edema<\/b> or <b>cyanosis<\/b>.","l":2},{"t":"Epigastric or right upper quadrant pain.","l":2},{"t":"Impaired liver function.","l":2},{"t":"Thrombocytopenia.","l":2},{"t":"Intrauterine growth retardation.","l":2},{"t":"Chronic <b>hypertension<\/b>:","l":1},{"t":"Preexisting <b>hypertension<\/b> without signs of preeclampsia.","l":2},{"t":"Chronic <b>hypertension<\/b> with superimposed preeclampsia-eclampsia:","l":1},{"t":"Preexisting <b>hypertension<\/b> with presence of signs of preeclampsia or eclampsia.","l":2}],"similar":[{"t":"Essential hypertension (see Event 8, Hypertension).","l":0},{"t":"Preexisting congenital or acquired cardiac disease.","l":0},{"t":"Preexisting renal disease (see Event 48, Oliguria).","l":0},{"t":"Seizures from other causes (see Event 57, Seizures).","l":0},{"t":"Coagulopathy or DIC from other causes.","l":0},{"t":"Preexisting pulmonary disease.","l":0},{"t":"Acute surgical abdomen in parturient.","l":0},{"t":"Pain associated with placental abruption.","l":0}],"management":[{"t":"<i>These patients are at higher risk of fetal distress and may require stat or urgent cesarean section. Early evaluation of the patient’s airway, cardiac, pulmonary, and coagulation status will allow preparation for possible anesthetic intervention. Symptoms of preeclampsia usually resolve within 48 hours of delivery.<\/i>","l":0,"n":1},{"t":"<b>Control hypertension:<\/b>","l":0},{"t":"Pharmacologic treatment:","l":1},{"t":"BP control prior to delivery is important.","l":2},{"t":"Lower BP to 140–160/90–100 mm Hg with carefully titrated medications:","l":2},{"t":"<b>Labetalol<\/b> IV, <b>20 mg<\/b>, increase dose to <b>40 mg<\/b> after 10 minutes if needed, then <b>80 mg<\/b> after a further 10 minutes if needed.","l":3},{"t":"<b>Hydralazine<\/b> IV, <b>5 to 10 mg<\/b>; then, after a 20-minute interval, repeat dose (<b>10 mg<\/b>) if BP remains elevated.","l":3},{"t":"<b>Labetalol<\/b> IV infusion.","l":3},{"t":"Nicardipine IV infusion.","l":3},{"t":"Extreme emergencies:","l":2},{"t":"Sodium <b>nitroprusside<\/b> IV, <b>0.2 to 2 µg/kg/min<\/b> infusion (with invasive BP monitoring).","l":3},{"t":"Regional anesthetic:","l":1},{"t":"Epidural analgesia will decrease catecholamine release and therefore decrease pain-mediated hypertensive responses:","l":2},{"t":"Check the <b>platelet<\/b> count and LFTs prior to placing epidural catheter.","l":3},{"t":"If <b>platelet<\/b> count &lt;100,000/µL or LFTs are elevated, check the coagulation profile before proceeding with placement.","l":3},{"t":"Seizure <b>prophylaxis<\/b> and/or treatment:","l":0},{"t":"<b>Administer MgSO<sub>4<\/sub><\/b> IV, <b>4 to 6 g<\/b> loading dose over 20 minutes, followed by an infusion of 1 to 2 g/hr.","l":1},{"t":"Initiate at the onset of labor and continue for 24 hours postpartum:","l":1},{"t":"Monitor for signs of Mg2+ toxicity (see Event 86, Magnesium Toxicity):","l":2},{"t":"Decreased patellar tendon reflexes.","l":3},{"t":"<b>If seizures occur:<\/b>","l":1},{"t":"Administer MgSO<sub>4<\/sub> IV, <b>2 g<\/b> as a second bolus dose over 3 to 5 minutes.","l":2},{"t":"If seizures continue, administer <b>midazolam<\/b> IV, <b>1 to 2 mg<\/b>, or clonazepam IV, <b>1 to 4 mg<\/b>.","l":2},{"t":"<b>Propofol<\/b> IV, <b>20 to 40 mg<\/b>, may also terminate the seizure (see Event 57, Seizures).","l":2},{"t":"Ensure adequate oxygenation and ventilation:","l":2},{"t":"Patient may need to be intubated.","l":3},{"t":"<b>Strict fluid balance:<\/b>","l":0},{"t":"Limit fluid intake to 1 mL/kg/hr and continue for duration of MgSO<sub>4<\/sub> infusion.","l":1},{"t":"Measure hourly urine output with urinary catheter.","l":1},{"t":"Maintenance of urine output may require judicious use of fluid boluses, diuretics, and <b>CVP<\/b> monitoring in collaboration with obstetric and critical care teams.","l":1},{"t":"If signs of pulmonary edema or decreased O<sub>2<\/sub> saturation are observed, review fluid balance <b>immediately<\/b>:","l":1},{"t":"<b>CVP<\/b> monitoring and/or a PA catheter is recommended to guide further fluid management.","l":2},{"t":"<b>Fetal assessment:<\/b>","l":0},{"t":"Nonstress testing.","l":1},{"t":"Biophysical profile.","l":1},{"t":"Ultrasound to assess fetal weight and amniotic fluid volume.","l":1},{"t":"Doppler fetal blood flow studies.","l":1},{"t":"Severe preeclampsia is an indication for delivery:","l":0},{"t":"Vaginal delivery is the preferred route of delivery in preeclamptic women; however, the clinical situation may require cesarean section:","l":1},{"t":"Regional anesthesia is preferred for labor and delivery or delivery via cesarean section.","l":2},{"t":"If general anesthesia is indicated, consider <b>arterial line<\/b> monitoring:","l":1},{"t":"Standard induction agents should be supplemented with other agents to suppress the hypertensive response to laryngoscopy:","l":2},{"t":"<b>Esmolol<\/b> IV, <b>1 to 2 mg/kg<\/b>.","l":3},{"t":"<b>Lidocaine<\/b> IV, <b>1 mg/kg<\/b>.","l":3},{"t":"Remifentanil IV, <b>0.5 to 1 μg/kg<\/b>.","l":3},{"t":"These drugs can also be used at extubation to blunt the hypertensive response to emergence.","l":2},{"t":"For the eclamptic patient:","l":0},{"t":"Treat the seizure (see previous).","l":1},{"t":"Ensure adequate oxygenation and ventilation.","l":1},{"t":"Expeditious delivery of neonate is indicated:","l":1},{"t":"If fetal bradycardia persists after a seizure, immediate cesarean delivery is required.","l":2}],"complications":[{"t":"Fetal distress.","l":0},{"t":"Thrombocytopenia.","l":0},{"t":"DIC.","l":0},{"t":"Severe hemorrhage.","l":0},{"t":"Multisystem organ failure.","l":0},{"t":"Mg2+ toxicity, e.g. enhances effect of nondepolarizing muscle relaxants.","l":0},{"t":"Subcapsular hematoma of the liver.","l":0},{"t":"Laryngeal edema.","l":0},{"t":"Difficult intubation.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Aspiration.","l":0},{"t":"Intracranial hemorrhage.","l":0},{"t":"Cerebral edema.","l":0},{"t":"Maternal death.","l":0},{"t":"Fetal death.","l":0}],"reading":[{"t":"1. Polley LS. Hypertensive disorders. In: Chestnut DH, Polley LS, Tsen LC, Wong CA, editors. Chestnut’s obstetric anesthesia: principles and practice. 4th ed. Philadelphia: Mosby; 2009. p. 975-1007."},{"t":"2. Ramanathan J, Gill RS, Sibai B. Hypertensive disorders of pregnancy. In: Suresh MS, Segal BS, Preston RL, Fernando R, Mason CL, editors. Shnider and Levinson’s anesthesia for obstetrics. 5th ed. Baltimore: Lippincott Williams &amp; Wilkins;"},{"t":"2013. p. 437-61."},{"t":"3. Dildy G, Belfort M. Complications of pre-eclampsia. In: Belfort M, Saade G, Foley M, Phelan J, Dildy G, editors. Critical care obstetrics. 5th ed. West Sussex, UK: Wiley Blackwell; 2010. p. 438-65."},{"t":"4. American College of Obstetricians and Gynecologists. Emergent therapy for acute-onset, severe hypertension with preeclampsia or eclampsia. ACOG Committee Opinion No. 514. Obstet Gynecol 2011;118:1465-8."},{"t":"5. Engelhardt T, MacLennan FM. Fluid management in pre-eclampsia. Int J Obstet Anesth 1999;8:253-9."},{"t":"6. Dennis AT. Management of pre-eclampsia: issues for anaesthetists. Anaesthesia 2012;67:1009-20."},{"t":"7. Altman D, Carroli G, Duley L, et al., for the Magpie Trial Collaboration Group. Do women with pre-eclampsia, and their babies, benefit from magnesium sulphate? The Magpie Trial: a randomised placebo-controlled trial. Lancet 2002;359:1877-90."}]}},{"id":89,"title":"Total Spinal Anesthesia","ch":12,"cat":"Obstetric Events","s":{"definition":[{"t":"Total spinal anesthesia is caused by:","l":0},{"t":"Local anesthetic blockade of all spinal nerves, up to.","l":1},{"t":"Possibly including the brainstem.","l":1}],"etiology":[{"t":"Parturients are more sensitive to local anesthetics compared to nonpregnant women.","l":0},{"t":"Epidural:","l":0},{"t":"Unintentional dural puncture during placement of epidural anesthetic.","l":1},{"t":"Intrathecal placement or migration of the epidural catheter.","l":1},{"t":"Spinal:","l":0},{"t":"Large spinal dose administered.","l":1},{"t":"Excessive Trendelenburg position with hyperbaric solution.","l":1},{"t":"Full spinal dose in short stature parturient.","l":1},{"t":"Spinal anesthesia (normal dose) placed after labor epidural.","l":1},{"t":"Repeat full spinal dose after initial failed spinal.","l":1},{"t":"CSE:","l":0},{"t":"Excessive epidural bolus with a CSE.","l":1}],"typical":[{"t":"Difficult epidural placement leading to unintentional and/or unrecognized intrathecal catheter placement.","l":0},{"t":"Short stature parturients (&lt;5 feet).","l":0},{"t":"Intrathecal administration of local anesthetic after an epidural anesthetic.","l":0}],"prevention":[{"t":"Use the appropriate dose of local anesthetic during neuraxial blocks.","l":0},{"t":"In short stature parturients, place a CSE with a reduced intrathecal dose rather than a single shot spinal.","l":0},{"t":"Position the patient appropriately.","l":0},{"t":"Dose an epidural catheter or CSE incrementally and evaluate the patient for signs and symptoms of intrathecal/intravascular injection.","l":0}],"manifestations":[{"t":"<i>Signs and symptoms of a total spinal can develop very rapidly.<\/i>","l":0},{"t":"<b>Hypotension<\/b>.","l":1},{"t":"Nausea/vomiting.","l":1},{"t":"<b>Bradycardia<\/b>.","l":1},{"t":"Profound cardiovascular collapse.","l":1},{"t":"Rapidly ascending loss of motor and sensory function.","l":1},{"t":"Difficulty speaking.","l":1},{"t":"Poor respiratory effort.","l":1},{"t":"Respiratory arrest.","l":1},{"t":"Loss of airway reflexes.","l":1},{"t":"Loss of consciousness.","l":1},{"t":"Patients may have fixed, dilated pupils.","l":1}],"similar":[{"t":"Hypotension from other causes (see Event 9, Hypotension).","l":0},{"t":"Cardiac arrest (see Event 82, Cardiac Arrest in the Parturient).","l":0},{"t":"Seizures (see Event 57, Seizures, and Event 88, Preeclampsia and Eclampsia).","l":0},{"t":"Local anesthetic toxicity (see Event 52, Local Anesthetic Systemic Toxicity, and Event 85, Hypotension Following Neuraxial Anesthesia).","l":0},{"t":"Vasovagal episode.","l":0},{"t":"Medication error (see Event 63, Drug Administration Error).","l":0}],"management":[{"t":"<i>Resuscitation equipment and medications should be immediately available at all sites where neuraxial anesthesia is performed.<\/i>","l":0,"n":1},{"t":"<b>Call for help:<\/b>","l":0},{"t":"Labor and delivery team and additional anesthesia help.","l":1},{"t":"If the patient arrests, immediate cesarean section may be necessary with the goal of delivery within 5 minutes (see Event 82, Cardiac Arrest in the Parturient).","l":1},{"t":"<b>Discontinue epidural bolus/infusion.<\/b>","l":0},{"t":"Ensure left uterine displacement.","l":0},{"t":"Reassure the patient, as she may become acutely anxious.","l":0},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> by a nonrebreathing face mask:","l":1},{"t":"Intubate the patient if there is loss of consciousness, respiratory failure, or severe cardiovascular collapse.","l":2},{"t":"Ventilate with <b>100%<\/b> O<sub>2<\/sub> after intubation.","l":2},{"t":"Patient may require urgent airway management:","l":1},{"t":"If urgent airway management is necessary and patient is conscious, perform RSI with cricoid pressure and intubation:","l":2},{"t":"<b>Etomidate<\/b> IV, <b>0.2 to 0.3 mg/kg<\/b>, or <b>ketamine<\/b> IV, <b>0.5 to 1.0 mg/kg<\/b>.","l":3},{"t":"<b>Succinylcholine<\/b> IV, <b>1 to 2 mg/kg<\/b>.","l":3},{"t":"Check maternal vital signs continuously.","l":0},{"t":"Administer fluid bolus and increase IV fluid infusion rate.","l":0},{"t":"Administer a vasopressor, escalating doses as necessary:","l":0},{"t":"<b>Ephedrine<\/b> IV, <b>5 to 10 mg<\/b>.","l":1},{"t":"<b>Phenylephrine<\/b> IV, <b>50 to 200 µg<\/b>.","l":1},{"t":"<b>Epinephrine<\/b> IV, <b>10 to 100 µg<\/b> bolus and consider infusion if no response.","l":1},{"t":"<b>Treat bradycardia:<\/b>","l":0},{"t":"Administer <b>glycopyrrolate<\/b> IV, <b>0.4 mg<\/b>, or <b>atropine<\/b> IV, <b>0.4 to 1 mg<\/b>:","l":1},{"t":"Bradycardia can be profound and may require treatment with <b>epinephrine<\/b> IV, <b>10 to 100 µg<\/b>.","l":2},{"t":"If maternal vital signs cannot be easily stabilized with IV fluids and vasopressors, con<b>sider cesarean section to aid maternal stability (i.e. relieve aortocaval compression and increase venous return).<\/b>","l":0},{"t":"<b>Assess fetus:<\/b>","l":0},{"t":"If there is no fetal compromise, immediate delivery is not indicated.","l":1},{"t":"If fetal compromise is identified, then stat cesarean section is required.","l":1},{"t":"<b>Ventilate the patient<\/b> until the effects of the local anesthetic have dissipated (usually 1 to 2 hours).","l":0},{"t":"Administer IV sedation to prevent awareness.","l":0},{"t":"If cardiac arrest occurs, start CPR (see Event 82, Cardiac Arrest in the Parturient).","l":0}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Cerebral or myocardial ischemia or injury.","l":0},{"t":"Aspiration of gastric contents.","l":0},{"t":"Awareness.","l":0},{"t":"Fetal death.","l":0},{"t":"Maternal death.","l":0}],"reading":[{"t":"1. Carvalho B. Failed epidural top-up for cesarean delivery for failure to progress in labor: the case against single-shot spinal anesthesia. Int J Obstet Anesth 2012;21:357-9."},{"t":"2. Pan PH, Bogard TD, Owen MD. Incidence and characteristics of failures in obstetric neuraxial analgesia and anesthesia: a retrospective analysis of 19,259 deliveries. Int J Obstet Anesth 2004;13:227-33."},{"t":"3. Wong CA. Epidural and spinal analgesia/anesthesia for labor and vaginal delivery. In: Chestnut DH, Polley LS, Tsen LC, Wong CA, editors. Chestnut’s obstetric anesthesia: principles and practice. 4th ed. Philadelphia: Mosby;"},{"t":"2009. p. 462-3."}]}},{"id":90,"title":"Acute Hemorrhage in the Pediatric Patient","ch":13,"cat":"Pediatric Events","s":{"definition":[{"t":"Acute hemorrhage in the pediatric patient is the acute loss of a large volume of blood and can be either overt or covert.","l":0},{"t":"Overt:","l":0},{"t":"Can be visualized in:","l":1},{"t":"The surgical field.","l":2},{"t":"On sponges.","l":2},{"t":"In the suction containers.","l":2},{"t":"Covert:","l":0},{"t":"No outward sign of bleeding.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Retroperitoneal hemorrhage.","l":3},{"t":"Blood loss hidden in the drapes.","l":3}],"etiology":[{"t":"Bleeding from a large blood vessel (artery or vein) secondary to surgery, trauma, or disease:","l":0},{"t":"In pediatrics, massive blood loss is &gt;2 to 3 mL/kg/min or 50% of blood volume over 3 hours.","l":1},{"t":"Underlying coagulopathy or therapeutic anticoagulation.","l":0},{"t":"Loose connection in the IV, central line, or arterial line, leading to potentially hidden blood loss.","l":0}],"typical":[{"t":"Major trauma.","l":0},{"t":"Procedural:","l":0},{"t":"Abdominal surgery:","l":1},{"t":"Vascular.","l":2},{"t":"Cardiac.","l":2},{"t":"Thoracic.","l":2},{"t":"Major.","l":2},{"t":"Major orthopedic surgery.","l":1},{"t":"Injury to fetus during delivery or cesarean section.","l":1},{"t":"Interventional radiologic or cardiac catheterization procedure.","l":1},{"t":"Covert hemorrhage is:","l":1},{"t":"More likely where the surgical field is obscured by drapes or is distant from the anesthesia professional.","l":2},{"t":"Coagulopathy, either acquired or therapeutic.","l":0},{"t":"Occult blood loss.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"GI tract.","l":2},{"t":"Long bone fractures.","l":2},{"t":"Into the retroperitoneal space.","l":2},{"t":"Acute hemorrhage may be a delayed complication of:","l":0},{"t":"An earlier injury.","l":1},{"t":"Invasive procedure.","l":1}],"prevention":[{"t":"Identify and correct coagulopathy early.","l":0},{"t":"Identify, institute <b>prophylaxis<\/b> for, and treat other potential bleeding sites.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"GI ulcers.","l":2},{"t":"Fractures in acute trauma.","l":2},{"t":"In children, anticipate the need for massive transfusion and obtain adequate IV access prior to start of procedure.","l":0},{"t":"Establish an institutional <b>MTP<\/b>.","l":0}],"manifestations":[{"t":"Overt:","l":0},{"t":"Blood in surgical field.","l":1},{"t":"Blood on surgical sponges, on the drapes, and on the floor.","l":1},{"t":"Increased suction noise.","l":1},{"t":"Accumulation of blood in suction containers.","l":1},{"t":"Surgeon comments or concerns about bleeding, volume status, or transfusion.","l":1},{"t":"Changes in vital signs (decreased BP, <b>increased HR<\/b>).","l":1},{"t":"Covert:","l":0},{"t":"Changes in vital signs:","l":1},{"t":"<b>Increased HR<\/b> (or decreased HR if severe).","l":2},{"t":"Decreased BP.","l":2},{"t":"Decreased CVP.","l":2},{"t":"Change in pulse oximeter reading due to poor perfusion.","l":2},{"t":"Physical examination if accessible:","l":1},{"t":"Increased RR if breathing spontaneously.","l":2},{"t":"Poor peripheral perfusion or capillary refill time.","l":2},{"t":"Poor pulses.","l":2},{"t":"Expanding soft tissue, abdomen, or thigh.","l":2},{"t":"i.e.:","l":3,"e":1},{"t":"Retroperitoneal bleed.","l":4},{"t":"Long bone fracture.","l":4},{"t":"Change in neurologic examination, bulging fontanelle, anisocoria, i.e. intracranial bleed.","l":2},{"t":"Decreased NIRS monitor reading.","l":1},{"t":"Inadequate filling of ventricle on TEE or TTE.","l":1},{"t":"Decreased urine output.","l":1},{"t":"Increased fluid requirement above what is expected.","l":1},{"t":"Little or transient BP response to IV fluid bolus or vasopressor administration.","l":1},{"t":"Laboratory studies:","l":1},{"t":"Unexplained decreasing hematocrit.","l":2},{"t":"Increasing metabolic acidosis on ABG.","l":2}],"similar":[{"t":"Hypotension (see Event 96, Hypotension in the Pediatric Patient).","l":0},{"t":"Anesthetic or vasodilator overdose (see Event 72, Volatile Anesthetic Overdose).","l":0},{"t":"Any cause of shock (see Event 91, Anaphylaxis in the Pediatric Patient, and Event 13, The Septic Patient).","l":0},{"t":"Cardiac failure.","l":0},{"t":"Cardiac tamponade (see Event 18, Cardiac Tamponade).","l":0},{"t":"Pulmonary hypertension.","l":0},{"t":"PE (see Event 21, Pulmonary Embolism).","l":0},{"t":"Arrhythmias.","l":0},{"t":"Progressively inadequate volume replacement due to bleeding, insensible losses (e.g. urine, evaporative losses), or third spacing.","l":0},{"t":"Occlusion of venous return by compression of IVC by surgical packing, pneumoperitoneum, or retraction.","l":0},{"t":"Tension pneumothorax (see Event 35, Pneumothorax).","l":0}],"management":[{"t":"<i>Special pediatric considerations:<\/i>","l":0,"n":1},{"t":"IV access may be challenging, especially in young infants:","l":1},{"t":"Small-gauge IV catheters (24 and <b>22 g<\/b>) typically placed in infants and young children may not withstand infusions of large volumes.","l":2},{"t":"Anticipate the need for transfusion and obtain adequate IV access prior to the start of the procedure.","l":2},{"t":"<b>CVP<\/b> line or cut-down may be necessary, especially if rapid volume administration is anticipated.","l":2},{"t":"Ensure that air bubbles are not injected into the patient:","l":1},{"t":"These may result in paradoxical air emboli to the heart or brain.","l":2},{"t":"All IV tubing <b>must<\/b> be meticulously debubbled.","l":2},{"t":"Special care should be taken with pressurized rapid-infusion devices.","l":2},{"t":"<b>Hyperkalemia:<\/b>","l":1},{"t":"Children are at much greater risk of morbidity from hyperkalemia than adults:","l":2},{"t":"Arrhythmias and cardiac arrest can occur in young children, particularly those with congenital heart disease.","l":3},{"t":"Older blood and blood that has been irradiated may contain dangerously elevated levels of K+.","l":2},{"t":"Employ strategies to minimize the risk of hyperkalemia from transfusion of RBCs:","l":2},{"t":"Use freshest RBCs.","l":3},{"t":"Use washed RBCs.","l":3},{"t":"Slow rate of RBC transfusion if possible.","l":3},{"t":"Monitor serum K+ levels and ABGs frequently and initiate treatments if K+ rises over 4.5:","l":3},{"t":"Diuretics, Ca<sup>2+<\/sup>, NaHCO<sub>3<\/sub>, Kayexalate, dialysis.","l":4},{"t":"Acidemia increases extracellular K+ levels.","l":4},{"t":"<b>Hypocalcemia:<\/b>","l":1},{"t":"Secondary to transfusion of citrate-phosphate-<b>dextrose<\/b>-adenine (CPDA) blood products:","l":2},{"t":"CPDA present in higher levels in <b>FFP<\/b> than RBCs.","l":3},{"t":"<b>Avoid hypothermia:<\/b>","l":1},{"t":"Hypothermia will exacerbate coagulopathy and <b>platelet<\/b> dysfunction.","l":2},{"t":"Warm blood products.","l":2},{"t":"PREOPERATIVE","l":0,"h":1},{"t":"Send type and cross (especially if two samples are needed) before surgery as samples may be difficult to obtain in children without central venous or arterial access.","l":0},{"t":"Communicate the potential for significant bleeding and need for blood products with the blood bank.","l":0},{"t":"Extra time may be required to locate appropriately matched products for patients with antibodies.","l":0},{"t":"Determine acceptable values for HR and BP based on the child’s age.","l":0},{"t":"Determine blood volume and “allowable” blood loss based on patient weight and <b>hematocrit<\/b>.","l":0},{"t":"INTRAOPERATIVE","l":0,"h":1},{"t":"Inform the surgeon of the problem.","l":0},{"t":"Initial treatment:","l":0},{"t":"<b>Deliver 100% O<sub>2<\/sub>.<\/b>","l":1},{"t":"Consider reducing volatile anesthetic agents.","l":1},{"t":"Administer 10 to 20 ml/kg IV bolus of non–<b>dextrose<\/b>-containing isotonic fluid (e.g. saline, LR, <b>5%<\/b> albumin, or blood) and watch for HR and BP response.","l":1},{"t":"Repeat as necessary to maintain adequate preload.","l":1},{"t":"Administer IV bolus of vasopressor (e.g. <b>ephedrine<\/b>, <b>epinephrine<\/b>, <b>phenylephrine<\/b>), carefully titrated to clinical effect:","l":1},{"t":"Vasopressors temporize the situation while administering IV fluids.","l":2},{"t":"Treatment of hypovolemic shock with vasopressors alone, without replacing volume, increases the risk of severe end organ damage.","l":2},{"t":"Additional monitoring data may help guide volume replacement:","l":0},{"t":"Consider placement of an <b>arterial line<\/b> for <b>ABG<\/b> and BP monitoring.","l":1},{"t":"Consider TEE or TTE examination for cardiac function and ventricular filling.","l":1},{"t":"Consider placement of a <b>CVP<\/b> line.","l":1},{"t":"If patient is not responding to initial therapy, or major fluid resuscitation is necessary.","l":0},{"t":"<b>Call for help:<\/b>","l":0},{"t":"Inform all team members of the situation and plans for resuscitation.","l":1},{"t":"Anesthesia professional’s role:","l":0},{"t":"Primary anesthesia professional should focus on leading and coordinating team members.","l":1},{"t":"Obtain additional IV access if necessary:","l":1},{"t":"Consider IO line early if IV access is difficult.","l":2},{"t":"Place <b>arterial line<\/b> if appropriate.","l":1},{"t":"Monitor patient hemodynamics and level of anesthesia.","l":1},{"t":"Operate rapid transfusion devices or push blood.","l":1},{"t":"Help to draw <b>ABG<\/b> and labs.","l":1},{"t":"Sugeon’s role:","l":0},{"t":"Identify and control source of bleeding.","l":1},{"t":"Surgeons may have to pause surgery:","l":1},{"t":"To allow anesthesia professional access to the patient to place an IV, <b>CVP<\/b> line, or <b>arterial line<\/b>.","l":2},{"t":"To allow time for volume replacement.","l":2},{"t":"To perform a necessary procedure.","l":2},{"t":"e.g.:","l":3,"e":1},{"t":"Place a difficult <b>CVP<\/b> line.","l":4},{"t":"Perform a cut-down for IV access.","l":4},{"t":"Nurses’ role:","l":0},{"t":"Call for more nursing and tech help:","l":1},{"t":"Charge nurse may help coordinate resources.","l":2},{"t":"Order and arrange transport of blood products from blood bank.","l":1},{"t":"Help to check and administer blood or blood products.","l":1},{"t":"Ensure that a rapid infuser system is available.","l":1},{"t":"Set up cell saver if indicated.","l":1},{"t":"Consider activating <b>MTP<\/b> if available.","l":1},{"t":"Monitor venous access lines and sites:","l":0},{"t":"Check all IV and central lines for loose connections and leaks.","l":1},{"t":"Check IV site frequently for soft tissue infiltration, especially when fluid is being infused under pressure, as opposed to a drip IV set.","l":1},{"t":"For massive transfusion of blood or blood products.","l":0},{"t":"Activate <b>MTP<\/b> if available:","l":0},{"t":"Notify blood bank of situation and anticipated needs as they may need to seek out additional sources of products.","l":1},{"t":"Order of preference for blood products:","l":0},{"t":"Type-specific (or type-compatible) crossmatched unit.","l":1},{"t":"Type-specific (or type-compatible) but not crossmatched unit, e.g. patient has been screened, but there is not enough time to complete crossmatching.","l":1},{"t":"Uncrossmatched, type-O, Rh-negative unit (O-neg RBCs).","l":1},{"t":"If patient has received &gt;1 blood volume of emergency release blood products (O-neg RBCs), keep transfusing O-neg RBCs.","l":0},{"t":"Testing for antibodies <b>must<\/b> be completed prior to switching back to patient’s type-specific blood.","l":0},{"t":"Transfuse blood and blood products through fluid warmer to <b>avoid<\/b> hypothermia:","l":0},{"t":"Washed PRBCs, <b>platelets<\/b>, <b>FFP<\/b>, and <b>cryoprecipitate<\/b> are usually at room temperature but also need to be warmed.","l":1},{"t":"Coagulopathy during massive transfusion is primarily due to dilution of clotting factors and/or <b>platelets<\/b> but may be due to fibrinolysis or DIC.","l":0},{"t":"Blood and blood product administration:","l":0},{"t":"Platelets:","l":1},{"t":"Monitor for thrombocytopenia and consider transfusion of <b>platelets<\/b> after 1 to 1.5 blood volumes have been lost.","l":2},{"t":"Replacement should be <b>10 to 15 mL/kg<\/b> of <b>platelets<\/b> for each blood volume replaced.","l":2},{"t":"Hypothermia causes <b>platelet<\/b> dysfunction even with normal <b>platelet<\/b> counts.","l":2},{"t":"Factors:","l":1},{"t":"Initiate transfusion of <b>FFP<\/b> after 1 blood volume of RBCs has been transfused.","l":2},{"t":"Transfusion of RBCs and <b>FFP<\/b> should be at a ratio of 2:1 (RBC:<b>FFP<\/b>).","l":2},{"t":"Monitor labs and hemodynamics to guide therapy:","l":0},{"t":"Hematocrit.","l":1},{"t":"Platelets.","l":1},{"t":"<b>PT<\/b>/<b>aPTT<\/b>.","l":1},{"t":"Ca<sup>2+<\/sup>.","l":1},{"t":"K+.","l":1},{"t":"ECG tracing for evidence of electrolyte abnormalities.","l":1},{"t":"HR and BP.","l":1},{"t":"<b>CVP<\/b>.","l":1},{"t":"TEE/TTE.","l":1}],"complications":[{"t":"Arrhythmias.","l":0},{"t":"Coagulopathy/DIC.","l":0},{"t":"Acidosis.","l":0},{"t":"Alkalosis.","l":0},{"t":"Hypocalcemia.","l":0},{"t":"Hyperglycemia.","l":0},{"t":"Hyperkalemia.","l":0},{"t":"Hypernatremia.","l":0},{"t":"Hypothermia.","l":0},{"t":"Transfusion-related infection.","l":0},{"t":"Transfusion reaction/ABO incompatibility.","l":0},{"t":"Transfusion-associated graft-versus-host disease.","l":0},{"t":"ARDS/TRALI","l":0,"h":1},{"t":"Volume overload and hypertension.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Chidester SJ, Williams N, Wang W, Groner JI. A pediatric massive transfusion protocol. J Trauma Acute Care Surg 2012;73:1273-7."},{"t":"2. Cote CJ, Lerman J, Todres ID. A practice of anesthesia for infants and children. 4th ed. Philadelphia: Saunders; 2009, p. 313-4."},{"t":"3. Davis PJ, Cladis FP, Motoyama EK, et al. Smith’s anesthesia for infants and children. 8th ed. Philadelphia: Mosby; 2011, p. 1232-5."},{"t":"4. Fuhrman BP, et al. Pediatric critical care. 4th ed. Philadelphia: Saunders; 2011, p. 338-63."}]}},{"id":91,"title":"Anaphylaxis in the Pediatric Patient","ch":13,"cat":"Pediatric Events","s":{"definition":[{"t":"Anaphylaxis in the pediatric patient is an IgE-mediated response that is caused by exposure to an antigenic substance in a sensitized pediatric patient.","l":0}],"etiology":[{"t":"Administration of, or exposure to, an agent that the patient has been previously sensitized to, with production of antigen-specific IgE.","l":0}],"typical":[{"t":"In patients with a known allergy or sensitivity to a specific agent or a history of atopy or allergy to nondrug allergens.","l":0},{"t":"After exposure to substances that can trigger anaphylaxis:","l":0},{"t":"Neuromuscular blocking drugs.","l":1},{"t":"Latex.","l":1},{"t":"Antibiotics.","l":1},{"t":"Opioids.","l":1},{"t":"Protamine.","l":1},{"t":"Amino-ester local anesthetic agents.","l":1},{"t":"Blood and blood products.","l":1},{"t":"Iodinated contrast material.","l":1},{"t":"Chlorhexidine preparation solutions.","l":1},{"t":"Sedative-hypnotics.","l":1},{"t":"Colloid administration.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Dextrans.","l":3},{"t":"Hydroxyethyl starch.","l":3},{"t":"Patients with frequent latex exposure:","l":0},{"t":"Patients requiring multiple reconstructive surgical procedures.","l":1},{"t":"e.g.:","l":2,"e":1},{"
