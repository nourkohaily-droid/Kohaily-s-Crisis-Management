@media (min-width:560px){
  #app{height:min(100dvh - 40px,920px);border-radius:38px;box-shadow:0 30px 80px rgba(20,30,120,.28),0 0 0 8px rgba(255,255,255,.55)}
  :root[data-theme="dark"] #app{box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 8px rgba(255,255,255,.06)}
}
#views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:110px;scroll-behavior:smooth;overscroll-behavior:contain}
.view::-webkit-scrollbar{width:0}
.enter-fwd{animation:inFwd .42s cubic-bezier(.2,.8,.2,1) both}
.enter-back{animation:inBack .42s cubic-bezier(.2,.8,.2,1) both}
.enter-fade{animation:inFade .5s ease both}
.leave{animation:outFade .22s ease both;pointer-events:none}
@keyframes inFwd{from{opacity:0;transform:translateX(46px) scale(.98)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-46px) scale(.98)}to{opacity:1;transform:none}}
@keyframes inFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes outFade{to{opacity:0;transform:scale(.985)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stagger>*{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}

/* ---------- header with wave ---------- */
.hdr{position:relative;color:#fff;padding:22px 20px 70px;background:linear-gradient(160deg,var(--hdr-a),var(--hdr-b));overflow:hidden}
.hdr::before,.hdr::after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.12);pointer-events:none}
.hdr::before{width:340px;height:340px;right:-120px;top:-150px;animation:ring 9s ease-in-out infinite}
.hdr::after{width:220px;height:220px;left:-90px;top:30px;animation:ring 11s ease-in-out infinite reverse}
@keyframes ring{50%{transform:scale(1.12)}}
.hdr .wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:46px;display:block}
.hdr .wave path{fill:var(--sheet)}
.hdr .wave .w2{opacity:.45;animation:wave 7s ease-in-out infinite alternate}
@keyframes wave{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.circle-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;transition:transform .2s,background .2s}
.circle-btn:active{transform:scale(.9)}
.circle-btn svg{width:20px;height:20px}
.chip-coin{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.2);border-radius:999px;padding:7px 13px 7px 8px;font-weight:600;font-size:.86rem}
.chip-coin i{width:22px;height:22px;border-radius:50%;background:linear-gradient(145deg,#FFD067,#FF9F2E);display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);font-style:normal;font-size:.7rem;color:#8a4b00}
.logo-dot{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.logo-dot svg{width:24px;height:24px}
.hdr h1{margin:20px 0 4px;text-align:center;font-size:1.65rem;line-height:1.15;font-weight:700;letter-spacing:-.01em;position:relative;z-index:1}
.hdr .sub{margin:0;text-align:center;opacity:.8;font-size:.85rem;position:relative;z-index:1}
.hdr .underline{width:46px;height:3px;border-radius:3px;background:rgba(255,255,255,.55);margin:10px auto 0;position:relative;z-index:1}
.sheet{position:relative;margin-top:-34px;padding:0 18px;z-index:2}

/* ---------- search bar ---------- */
.searchbar{display:flex;gap:10px;align-items:center;margin:0 0 18px}
.searchbar .field{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:13px 18px;box-shadow:var(--shadow-s);color:var(--muted);text-align:left}
.searchbar .field svg{width:18px;height:18px;flex:none}
.searchbar input{flex:1;border:0;outline:0;background:none;font:inherit;color:var(--ink);min-width:0}
.searchbar .filter{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(47,67,214,.35)}
.searchbar .filter svg{width:20px;height:20px}

/* ---------- section titles ---------- */
.row-h{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 12px}
.row-h h2{margin:0;font-size:1.12rem;font-weight:700}
.row-h a,.row-h button{color:var(--blue-2);font-size:.82rem;font-weight:600;text-decoration:none}
:root[data-theme="dark"] .row-h a,:root[data-theme="dark"] .row-h button{color:#8FA0FF}

/* ---------- quick-access cards (like “Popular Events”) ---------- */
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:4px 18px 16px;margin:0 -18px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{height:0}
.qcard{flex:none;width:208px;background:var(--card);border-radius:24px;padding:8px 8px 12px;box-shadow:var(--shadow-s);scroll-snap-align:start;text-align:left;transition:transform .25s}
.qcard:active{transform:scale(.97)}
.qcard .thumb{height:118px;border-radius:18px;overflow:hidden;position:relative;background:var(--monitor)}
.qcard .thumb canvas,.qcard .thumb svg{width:100%;height:100%;display:block}
.qcard h3{margin:10px 8px 2px;font-size:.92rem;line-height:1.25;font-weight:600;min-height:2.3em}
.qcard .meta{display:flex;align-items:center;justify-content:space-between;margin:6px 6px 0}
.tag{font-size:.7rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill-btn{background:var(--blue);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:.8rem;box-shadow:0 6px 14px rgba(47,67,214,.3)}
.badge-sos{position:absolute;left:10px;top:10px;background:var(--red);color:#fff;font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.06em;animation:blink 1.6s infinite;z-index:2}
@keyframes blink{50%{opacity:.55}}

/* ---------- category accordion ---------- */
.acc{display:flex;flex-direction:column;gap:12px}
.cat{background:var(--card);border-radius:24px;box-shadow:var(--shadow-s);overflow:hidden;transition:box-shadow .3s}
.cat.open{box-shadow:var(--shadow)}
.cat-head{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left}
.cat-ico{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;color:#fff;flex:none;background:var(--c);box-shadow:0 8px 16px color-mix(in srgb,var(--c) 40%,transparent);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.cat.open .cat-ico{transform:rotate(-8deg) scale(1.08)}
.cat-ico svg{width:26px;height:26px}
.cat-txt{flex:1;min-width:0}
.cat-txt b{display:block;font-size:1rem;font-weight:600}
.cat-txt span{font-size:.78rem;color:var(--muted)}
.chev{width:34px;height:34px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--blue-2);transition:transform .35s,background .3s}
.cat.open .chev{transform:rotate(180deg);background:var(--c);color:#fff}
.chev svg{width:16px;height:16px}
.cat-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s cubic-bezier(.3,.9,.3,1)}
.cat.open .cat-body{grid-template-rows:1fr}
.cat-body>div{overflow:hidden}
.cat-list{padding:2px 12px 12px;display:flex;flex-direction:column;gap:6px}
.ev-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--sheet);text-align:left;width:100%;opacity:0;transform:translateY(8px);transition:transform .2s,background .2s}
.cat.open .ev-row{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms + 120ms)}
.ev-row:active{transform:scale(.98);background:var(--chip)}
.ev-num{width:32px;height:32px;border-radius:11px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-weight:700;font-size:.82rem;display:grid;place-items:center;flex:none}
.ev-row .t{flex:1;font-weight:500;font-size:.92rem;line-height:1.3}
.ev-row .go{color:var(--muted);width:18px;height:18px;flex:none}
.ev-row .fav{color:var(--amber);width:16px;height:16px}

/* ---------- splash ---------- */
.splash{background:linear-gradient(170deg,var(--hdr-a),var(--hdr-b));color:#fff;display:flex;flex-direction:column;padding:26px 22px 28px;overflow:hidden}
.splash .stage{flex:1;display:grid;place-items:center;position:relative;min-height:0}
.splash .rings i{position:absolute;left:50%;top:50%;border:1.5px solid rgba(255,255,255,.16);border-radius:50%;transform:translate(-50%,-50%);animation:ring2 5s ease-in-out infinite}
.splash .rings i:nth-child(1){width:150px;height:150px}.splash .rings i:nth-child(2){width:240px;height:240px;animation-delay:.6s}.splash .rings i:nth-child(3){width:330px;height:330px;animation-delay:1.2s}
@keyframes ring2{50%{transform:translate(-50%,-50%) scale(1.09);border-color:rgba(255,255,255,.3)}}
.splash .hero{position:relative;width:min(280px,72vw);aspect-ratio:1;filter:drop-shadow(0 24px 30px rgba(8,12,70,.45));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.splash-card{background:rgba(255,255,255,.14);backdrop-filter:blur(14px);border-radius:30px 30px 30px 30px;padding:26px 22px 40px;text-align:center;position:relative;border:1px solid rgba(255,255,255,.18)}
.splash-card h1{margin:0 0 8px;font-size:1.55rem;line-height:1.2;font-weight:700}
.splash-card p{margin:0;opacity:.82;font-size:.86rem;line-height:1.5}
.go-btn{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:#EEF1FF;color:var(--blue);display:grid;place-items:center;box-shadow:0 12px 24px rgba(10,15,80,.4);animation:pulseBtn 2.2s infinite}
.go-btn svg{width:26px;height:26px}
@keyframes pulseBtn{0%{box-shadow:0 12px 24px rgba(10,15,80,.4),0 0 0 0 rgba(255,255,255,.45)}70%{box-shadow:0 12px 24px rgba(10,15,80,.4),0 0 0 22px rgba(255,255,255,0)}100%{box-shadow:0 12px 24px rgba(10,15,80,.4),0 0 0 0 rgba(255,255,255,0)}}
.splash .tiny{margin-top:44px;text-align:center;font-size:.7rem;opacity:.65}

/* ---------- event detail ---------- */
.d-hdr{padding-bottom:104px}
.d-hdr h1{font-size:1.45rem;margin:16px 0 8px}
.d-hdr .cat-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:999px;font-size:.74rem;font-weight:600}
.d-hdr .cc{text-align:center;position:relative;z-index:1}
.d-hdr .no{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:8px;background:#fff;color:var(--blue);font-size:.7rem;font-weight:700}
.hero-card{position:relative;margin:-92px 18px 0;border-radius:26px;overflow:hidden;background:var(--monitor);box-shadow:var(--shadow);z-index:3;aspect-ratio:16/10}
.hero-card .scene{position:absolute;inset:0}
.hero-card canvas,.hero-card svg.scn{width:100%;height:100%;display:block}
.hero-ctl{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;z-index:4}
.hero-ctl button{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center}
.hero-ctl svg{width:16px;height:16px}
.hero-cap{position:absolute;left:12px;right:90px;bottom:10px;z-index:4;color:#fff;font-size:.78rem;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6);transition:opacity .3s;line-height:1.3}
.hero-cap em{font-style:normal;display:inline-block;background:var(--red);padding:2px 8px;border-radius:999px;font-size:.66rem;letter-spacing:.05em;margin-right:6px}
.d-body{padding:16px 18px 0}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.emerg{display:flex;align-items:center;gap:8px;border-radius:999px;padding:9px 14px;background:var(--card);box-shadow:var(--shadow-s);font-weight:600;font-size:.8rem;color:var(--red);transition:all .25s}
.emerg svg{width:16px;height:16px}
.emerg.on{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(229,72,77,.4);animation:emergPulse 2s infinite}
@keyframes emergPulse{50%{box-shadow:0 8px 28px rgba(229,72,77,.65)}}
.toolbar .sp{flex:1}
.mini{padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow-s);font-weight:600;font-size:.78rem;color:var(--blue-2)}
:root[data-theme="dark"] .mini{color:#9FB0FF}
.jump{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 6px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--sheet) 70%,transparent)}
.jump::-webkit-scrollbar{height:0}
.jump button{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow-s);font-size:.76rem;font-weight:600;color:var(--muted);transition:all .2s}
.jump button.act{background:var(--blue);color:#fff}
.sec{background:var(--card);border-radius:24px;margin-bottom:14px;box-shadow:var(--shadow-s);overflow:hidden;scroll-margin-top:60px}
.sec-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left}
.sec-ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none}
.sec-ico svg{width:21px;height:21px}
.sec-head b{flex:1;font-size:.98rem;font-weight:600}
.sec-head .cnt{font-size:.72rem;color:var(--muted);font-weight:600;background:var(--chip);padding:3px 9px;border-radius:999px}
.sec .chev{width:30px;height:30px}
.sec.open .chev{transform:rotate(180deg);background:var(--c);color:#fff}
.sec-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.3,.9,.3,1)}
.sec.open .sec-body{grid-template-rows:1fr}
.sec-body>div{overflow:hidden}
.sec-in{padding:2px 16px 16px}
.sec.primary{border:2px solid color-mix(in srgb,var(--red) 55%,transparent)}
.defn{font-size:1em;line-height:1.6}
ul.lst{list-style:none;margin:0;padding:0}
ul.lst li{position:relative;padding:5px 0 5px 20px;line-height:1.5}
ul.lst li::before{content:"";position:absolute;left:4px;top:.95em;width:6px;height:6px;border-radius:50%;background:var(--c,var(--blue-2))}
ul.lst li.l1{margin-left:16px}ul.lst li.l2{margin-left:32px}ul.lst li.l3{margin-left:48px}ul.lst li.l4{margin-left:64px}ul.lst li.l5{margin-left:80px}
ul.lst li.l1::before,ul.lst li.l3::before,ul.lst li.l5::before{background:none;border:2px solid var(--c,var(--blue-2));width:7px;height:7px}
ul.lst li.h{margin:10px 0 2px;padding:6px 12px;border-radius:12px;background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);font-weight:700;font-size:.82em;letter-spacing:.02em}
ul.lst li.h::before{display:none}
.xref{color:var(--blue-2);font-weight:600;text-decoration:none;border-bottom:1.5px dotted currentColor;cursor:pointer;white-space:nowrap}
:root[data-theme="dark"] .xref{color:#9FB0FF}
b{font-weight:700}
/* checklist */
.prog{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.prog .bar{flex:1;height:8px;border-radius:8px;background:var(--chip);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#6EE7B7);border-radius:8px;transition:width .4s cubic-bezier(.3,.9,.3,1)}
.prog span{font-size:.74rem;font-weight:600;color:var(--muted);min-width:64px;text-align:right}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;margin:2px 0;border-radius:14px;line-height:1.45;transition:background .2s,opacity .25s;cursor:pointer;position:relative}
.chk li:active{background:var(--chip)}
.chk li.l1{margin-left:18px}.chk li.l2{margin-left:36px}.chk li.l3{margin-left:54px}.chk li.l4{margin-left:72px}.chk li.l5{margin-left:90px}
.chk li.head{background:color-mix(in srgb,var(--c) 9%,transparent);padding:10px 10px;margin-top:8px}
.chk li.h{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);font-weight:700;font-size:.82em;cursor:default;padding:7px 12px;margin-top:10px}
.chk li.h .box,.chk li.h .car{display:none}
.chk .box{flex:none;width:22px;height:22px;border-radius:8px;border:2px solid color-mix(in srgb,var(--c) 55%,var(--muted));display:grid;place-items:center;margin-top:1px;transition:all .25s cubic-bezier(.3,1.7,.5,1);color:transparent}
.chk .box svg{width:13px;height:13px}
.chk li.done .box{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.12)}
.chk li.done .tx{opacity:.5;text-decoration:line-through}
.chk .tx{flex:1;min-width:0}
.chk .car{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--muted);transition:transform .25s}
.chk .car svg{width:12px;height:12px}
.chk li.fold .car{transform:rotate(-90deg)}
.chk li.gone{display:none}
.table-w{overflow-x:auto;margin-top:10px;border-radius:14px;border:1px solid var(--line)}
table.t{border-collapse:collapse;width:100%;font-size:.82em}
table.t th,table.t td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
table.t th{background:var(--chip);font-weight:600}
.note{font-size:.72em;color:var(--muted);line-height:1.5;margin-top:8px}
.refs{font-size:.78em;color:var(--muted);line-height:1.5;padding-left:0;list-style:none;margin:0}
.refs li{padding:5px 0;border-bottom:1px solid var(--line)}
.disclaimer{margin:6px 0 20px;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--amber) 14%,transparent);font-size:.74rem;line-height:1.5;color:var(--muted)}
.nav-ev{display:flex;gap:10px;margin:6px 0 4px}
.nav-ev button{flex:1;background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow-s);text-align:left;font-size:.74rem;color:var(--muted);line-height:1.3}
.nav-ev b{display:block;color:var(--ink);font-size:.84rem;font-weight:600;margin-top:2px}

/* ---------- search / lists ---------- */
.res{display:flex;flex-direction:column;gap:10px}
.res-i{background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow-s);text-align:left;width:100%;animation:fadeUp .35s both;animation-delay:calc(var(--i,0)*30ms)}
.res-i .rt{display:flex;gap:10px;align-items:center;font-weight:600}
.res-i .sn{font-size:.8rem;color:var(--muted);line-height:1.45;margin-top:6px}
.res-i mark{background:color-mix(in srgb,var(--amber) 45%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.res-i .sec-tag{font-size:.66rem;font-weight:700;color:var(--blue-2);text-transform:uppercase;letter-spacing:.05em}
.empty{text-align:center;color:var(--muted);padding:40px 20px;line-height:1.6}
.empty svg{width:56px;height:56px;opacity:.5;margin-bottom:8px}

/* ---------- settings ---------- */
.set{background:var(--card);border-radius:24px;box-shadow:var(--shadow-s);padding:6px 16px;margin-bottom:14px}
.set-r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-r:last-child{border-bottom:0}
.set-r b{font-weight:600;font-size:.95rem}
.set-r small{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:.78rem;font-weight:600;color:var(--muted);transition:all .2s}
.seg button.act{background:var(--blue);color:#fff}
.sw{width:50px;height:30px;border-radius:999px;background:var(--chip);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.sw.on{background:var(--blue)}.sw.on::after{transform:translateX(20px)}

/* ---------- bottom nav (pill) ---------- */
#nav{position:absolute;left:16px;right:16px;bottom:16px;z-index:20;display:flex;justify-content:space-around;align-items:center;background:var(--nav-bg);border-radius:999px;padding:8px;box-shadow:0 16px 34px rgba(30,45,170,.45)}
#nav button{position:relative;width:58px;height:46px;border-radius:999px;display:grid;place-items:center;color:var(--nav-ink);transition:all .35s cubic-bezier(.3,1.4,.5,1)}
#nav button svg{width:23px;height:23px;transition:transform .3s}
#nav button.act{background:var(--nav-act-bg);color:var(--nav-act-ink);width:78px;transform:translateY(-2px)}
#nav button.act svg{transform:scale(1.1)}
#nav.hide{transform:translateY(120px);opacity:0;pointer-events:none}
#nav{transition:transform .35s,opacity .3s}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:999px;font-size:.8rem;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:40;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sos-fab{position:absolute;right:18px;bottom:96px;z-index:19;width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(229,72,77,.5);font-weight:800;font-size:.72rem;letter-spacing:.04em;animation:emergPulse 2s infinite}
.sos-fab.hide{display:none}
body.emergency .hdr{background:linear-gradient(160deg,#D93A3F,#8E1B2B)}
.reduce *{animation-duration:.001s!important;transition-duration:.001s!important}

.hero-card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(transparent,rgba(5,8,25,.78));z-index:3;pointer-events:none}
.hero-cap{right:14px;bottom:12px}
.ibtn{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow-s);display:grid;place-items:center;color:var(--blue-2)}
:root[data-theme="dark"] .ibtn{color:#9FB0FF}
.ibtn svg{width:16px;height:16px}
.toolbar{gap:8px}

/* ---- text flow & typography polish ---- */
.sec-in,.lst li,.chk .tx,.defn,.refs li{overflow-wrap:break-word;word-break:normal;hyphens:manual;text-wrap:pretty}
.sec-in{font-kerning:normal;font-variant-numeric:lining-nums;letter-spacing:.005em}
.sec-in sub,.sec-in sup{font-size:.68em;line-height:0;position:relative;vertical-align:baseline}
.sec-in sub{bottom:-.22em}.sec-in sup{top:-.4em}
.sec-in b{font-weight:650}
.defn{line-height:1.65;margin:6px 0}
ul.lst li{padding:6px 0 6px 20px;line-height:1.55}
ul.lst li+li{border-top:1px dashed color-mix(in srgb,var(--line) 70%,transparent)}
ul.lst li.l1,ul.lst li.l2,ul.lst li.l3,ul.lst li.l4,ul.lst li.l5{border-top:0;padding-top:3px;padding-bottom:3px;font-size:.97em}
ul.lst li:has(+li.l1),ul.lst li:has(+li.l2){padding-bottom:3px}
ul.lst li.h{border-top:0}
.chk li{line-height:1.55;padding:8px 8px}
.chk li.l1,.chk li.l2,.chk li.l3,.chk li.l4,.chk li.l5{padding-top:6px;padding-bottom:6px}
.chk li.note{display:block;cursor:default;margin:6px 0 4px;padding:8px 12px;border-left:3px solid var(--c);border-radius:4px 12px 12px 4px;background:color-mix(in srgb,var(--c) 7%,transparent);color:var(--muted);font-size:.95em}
.chk li.note:active{background:color-mix(in srgb,var(--c) 7%,transparent)}
.chk li.note i{font-style:italic}
.chk li.head .tx{font-weight:650}
.refs{counter-reset:r;font-size:.8em;line-height:1.55}
.refs li{padding:8px 0 8px 0;text-wrap:pretty;overflow-wrap:anywhere}
a.xref{white-space:nowrap}
ul.lst li::before{top:calc(6px + .775em - 3px)}
ul.lst li.l1::before,ul.lst li.l2::before,ul.lst li.l3::before,ul.lst li.l4::before,ul.lst li.l5::before{top:calc(3px + .775em - 4.5px)}
ul.lst li.l1::before,ul.lst li.l3::before,ul.lst li.l5::before{top:calc(3px + .775em - 4.5px)}
ul.lst li.l2::before,ul.lst li.l4::before{background:var(--c,var(--blue-2));border:0;width:5px;height:5px;top:calc(3px + .775em - 2.5px)}
.chk .box{margin-top:calc(.775em - 11px)}

/* ---- round 3: hero, toolbar, section icons, bullets, hierarchy ---- */
.hero-card{border-radius:46px/32px;aspect-ratio:16/10}
.hero-card::after,.hero-cap,.hero-ctl{display:none!important}
.toolbar{gap:10px}
.emerg{flex:none;white-space:nowrap;padding:11px 20px 11px 12px;gap:12px;font-size:1.02rem;font-weight:700;letter-spacing:.005em;justify-content:flex-start}
.emerg .tri{display:grid;place-items:center;width:34px;height:34px;flex:none;transform:rotate(-14deg);color:var(--red)}
.emerg .tri svg{width:30px;height:30px;stroke-width:2.2;fill:color-mix(in srgb,var(--red) 18%,transparent)}
.emerg .lbl{display:block;white-space:nowrap}
.emerg.on .tri{color:#fff}.emerg.on .tri svg{fill:rgba(255,255,255,.22)}
.sec-ico{width:34px;height:34px;border-radius:11px;background:var(--c);box-shadow:0 4px 10px color-mix(in srgb,var(--c) 38%,transparent)}
.sec-ico svg{display:none}
/* square bullets */
ul.lst li::before,ul.lst li.l1::before,ul.lst li.l2::before,ul.lst li.l3::before,ul.lst li.l4::before,ul.lst li.l5::before{border:0;border-radius:2px;background:var(--c,var(--blue-2));width:7px;height:7px;left:4px;top:calc(6px + .775em - 3.5px)}
ul.lst li.l1::before,ul.lst li.l2::before,ul.lst li.l3::before,ul.lst li.l4::before,ul.lst li.l5::before{width:6px;height:6px;opacity:.65;top:calc(3px + .775em - 3px)}
ul.lst li.l2::before,ul.lst li.l3::before,ul.lst li.l4::before,ul.lst li.l5::before{opacity:.45;width:5px;height:5px;top:calc(3px + .775em - 2.5px)}
ul.lst li.eg{padding-left:0;font-style:italic;color:var(--muted);font-weight:600;font-size:.9em}
ul.lst li.eg::before{display:none}
/* hierarchy: parents stand out */
ul.lst li.par.l0{font-weight:700;font-size:1.04em;padding-top:9px;color:var(--ink,inherit)}
ul.lst li.par.l1,ul.lst li.par.l2{font-weight:650}
ul.lst li.par b{font-weight:800}
.sec-in b{font-weight:750}
.chk li.head{font-size:1.04em;background:color-mix(in srgb,var(--c) 11%,transparent);padding:11px 10px;margin-top:10px}
.chk li.head .tx{font-weight:700}
.chk li.l1{font-size:.97em}.chk li.l2,.chk li.l3{font-size:.94em}
.chk li.par:not(.head) .tx{font-weight:650}
.chk li.eg{display:block;cursor:default;padding:2px 8px 0;margin:0;font-style:italic;color:var(--muted);font-weight:600;font-size:.88em;line-height:1.4}
.chk li.eg:active{background:none}
.chk li.l1 .tx{font-weight:600}
.chk li.l1.par .tx{font-weight:700}
.chk li.l1{font-size:1rem}

/* ---- round 4: management hierarchy (box / checkbox by level), regular weight, keyword bold only ---- */
.chk li .tx,.chk li.head .tx,.chk li.l1 .tx,.chk li.l1.par .tx,.chk li.par:not(.head) .tx{font-weight:400}
.chk li.head .tx{font-weight:500}
.chk li.done .tx{opacity:1;text-decoration:none}
.chk li.sub{background:color-mix(in srgb,var(--muted) 11%,transparent)}
.chk li.l1:not(.sub),.chk li.l2,.chk li.l3,.chk li.l4,.chk li.l5{background:none}
/* level 0: big empty square */
.chk li.head .box{width:26px;height:26px;border-radius:9px;background:transparent;margin-top:calc(.775em - 13px)}
/* level 1: smaller solid square */
.chk li.l1 .box{width:18px;height:18px;border-radius:6px;border:0;background:color-mix(in srgb,var(--c) 45%,var(--muted));margin-top:calc(.775em - 9px)}
.chk li.l1 .box svg{width:11px;height:11px}
/* level 2+: tiny solid circle */
.chk li.l2 .box,.chk li.l3 .box,.chk li.l4 .box,.chk li.l5 .box{width:10px;height:10px;border-radius:50%;border:0;background:color-mix(in srgb,var(--c) 45%,var(--muted));margin:calc(.775em - 5px) 4px 0 3px}
.chk li.l2 .box svg,.chk li.l3 .box svg,.chk li.l4 .box svg,.chk li.l5 .box svg{width:7px;height:7px}
/* checked = tick only */
.chk li.done .box{background:var(--green);border-color:var(--green);color:#fff;transform:none}
.chk li.l2.done .box,.chk li.l3.done .box,.chk li.l4.done .box,.chk li.l5.done .box{transform:scale(1.7)}
.chk li.head.done .box svg,.chk li.l1.done .box svg{stroke-width:3.4}
ul.lst li.par.lp,ul.lst li.par.lp.l0,ul.lst li.par.lp.l1,ul.lst li.par.lp.l2{font-weight:500;font-size:1em}
ul.lst li.par.lp b{font-weight:750}

.hdr-end{display:flex;align-items:center;gap:8px}

/* ---- round 6: tree connectors in Management ---- */
.chk{--ln:color-mix(in srgb,var(--c) 40%,var(--muted))}
.chk li{--pt:6px;--bh:10px}
.chk li.head{--pt:11px;--bh:26px}
.chk li.l1{--bh:18px}
.chk li.l1{margin-left:28px}.chk li.l2{margin-left:48px}.chk li.l3{margin-left:68px}.chk li.l4{margin-left:88px}.chk li.l5{margin-left:108px}
.chk li.eg{margin-left:0}
.chk li.eg.l1{margin-left:28px}.chk li.eg.l2{margin-left:48px}.chk li.eg.l3{margin-left:68px}.chk li.eg.l4{margin-left:88px}.chk li.eg.l5{margin-left:108px}
.chk i.gt,.chk i.gk,.chk i.ge{position:absolute;pointer-events:none;display:block}
.chk i.gt{top:-4px;bottom:-4px;width:2px;background:var(--ln);border-radius:1px}
.chk i.gk{top:calc(var(--pt) + .775em + var(--bh)/2 + 3px);bottom:-4px;width:2px;background:var(--ln);border-radius:1px}
.chk i.ge{top:-4px;height:calc(4px + var(--pt) + .775em + 1px);border-left:2px solid var(--ln);border-bottom:2px solid var(--ln);border-bottom-left-radius:10px;box-sizing:border-box}
.chk li.fold i.gk,.chk li.gone{}
.chk li.fold i.gk{display:none}
</style>

sites, e.g. GI tract ulcers in ICU patients.","l":0},{"t":"Perform a focused assessment with sonography in trauma (<b>FAST<\/b>) examination in trauma cases to assess the presence of intraabdominal or pericardial fluid.","l":0},{"t":"Insert the <b>largest possible<\/b> IV catheter if you anticipate having to administer blood during a case.","l":0},{"t":"Insert <b>arterial line<\/b> if significant blood loss is anticipated.","l":0},{"t":"Establish an institutional <b>massive transfusion protocol<\/b> (<b>MTP<\/b>).","l":0}],"manifestations":[{"t":"Overt:","l":0},{"t":"Blood in the surgical field.","l":1},{"t":"Blood on surgical sponges, drapes, and floor.","l":1},{"t":"Suction noise and accumulation of blood in suction containers.","l":1},{"t":"<b>Fall in arterial pressure<\/b> and filling pressures and <b>increased HR<\/b>.","l":1},{"t":"Increased pulse pressure variation during positive pressure ventilation.","l":1},{"t":"<b>Hypovolemia<\/b> assessed by transesophageal echocardiogram (TEE) or transthoracic echocardiogram (TTE).","l":1},{"t":"Surgeon’s comments, e.g. “Have you given any blood yet?”","l":1},{"t":"Covert:","l":0},{"t":"Unexplained fall in arterial and filling pressures and/or increase in HR.","l":1},{"t":"Low filling pressures assessed by TEE or TTE.","l":1},{"t":"Fall in mixed venous O<sub>2<\/sub> (if monitored), especially in surgery where covert blood loss is possible.","l":1},{"t":"Increase in fluid requirements above what is expected.","l":1},{"t":"Little or transient BP response to administration of an IV fluid bolus or to vasopressor.","l":1},{"t":"Excessive response to vasodilator or anesthetic agents.","l":1},{"t":"Unexplained fall in urine output or hematocrit (a late sign).","l":1},{"t":"Expanding abdomen or thigh, flank discoloration.","l":1},{"t":"Decreased oxygenation, increased peak inspiratory pressure (PIP) if hemothorax.","l":1},{"t":"Increased pulse pressure variation during positive-pressure ventilation.","l":1}],"similar":[{"t":"Hypotension (see Event 9, Hypotension).","l":0},{"t":"Anesthetic or vasodilator overdose (see Event 72, Volatile Anesthetic Overdose).","l":0},{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"Progressively inadequate volume replacement.","l":0},{"t":"Occlusion of venous return by compression of the vena cava by the gravid uterus, surgical packing, pneumoperitoneum, or retraction.","l":0},{"t":"Pneumothorax (see Event 35, Pneumothorax).","l":0},{"t":"Pulmonary embolism (PE) (see Event 21, Pulmonary Embolism).","l":0},{"t":"Cardiac tamponade (see Event 18, Cardiac Tamponade).","l":0},{"t":"Inappropriate diuretic therapy.","l":0},{"t":"Tachyarrhythmias.","l":0}],"management":[{"t":"Inform surgeons of the problem:","l":0},{"t":"Keep them informed of its severity.","l":1},{"t":"Options for surgeon to consider:","l":1},{"t":"Convert from laparoscopic to open surgery.","l":2},{"t":"Clamp bleeding vessels, hold pressure on bleeding site, or pack to temporize bleeding.","l":2},{"t":"Clamp the aorta below the diaphragm (may be essential for resuscitation of the patient) (see Event 14, The Trauma Patient).","l":2},{"t":"Apply hemostatic agents.","l":2},{"t":"Obtain expert surgical assistance.","l":2},{"t":"If the abdomen is open, cannulate a large intraabdominal vein for rapid transfusion and cannulate the aorta directly for an <b>arterial line<\/b>.","l":1},{"t":"Consider surgical exploration (if postoperative hemorrhage is suspected).","l":1},{"t":"Increase FiO<sub>2<\/sub> to <b>100%<\/b> with high fresh gas flow:","l":0},{"t":"Replace volatile anesthetic as tolerated with opioids, <b>midazolam<\/b>.","l":1},{"t":"Check and verify BP and other vital signs.","l":0},{"t":"Treat severe hypotension with IV bolus of vasopressor:","l":0},{"t":"<b>Ephedrine<\/b> IV, <b>5 to 50 mg<\/b>.","l":1},{"t":"<b>Epinephrine<\/b>, <b>10 to 100 μg<\/b>.","l":1},{"t":"<b>Phenylephrine<\/b>, <b>50 to 200 μg<\/b>.","l":1},{"t":"Repeat as necessary to maintain an acceptable BP.","l":1},{"t":"<b>Activate local MTP<\/b> to get emergency release of blood products.","l":0},{"t":"Rapidly restore circulating blood volume:","l":0},{"t":"Use <b>crystalloid<\/b>, <b>colloid<\/b>, or blood to replace circulating blood volume:","l":1},{"t":"For massive hemorrhage:","l":2},{"t":"Transfuse a balanced ratio (1:1) of red blood cells (RBCs) to <b>fresh frozen plasma<\/b> (<b>FFP<\/b>).","l":3},{"t":"Transfuse 1 apheresis unit of <b>platelets<\/b> per <b>6 units<\/b> of RBCs, until labs are available.","l":3},{"t":"If blood loss is sudden but may be controlled soon, delay giving blood and continue to give <b>crystalloid<\/b> as needed until bleeding is stopped.","l":1},{"t":"Depending on patient comorbidities and extent of hemorrhage, consider tolerating low-normal BP to decrease blood loss and hemodilution until bleeding is controlled.","l":1},{"t":"A pressurized bag of saline or <b>colloid<\/b> will run much faster than a unit of RBCs through a small peripheral IV.","l":1},{"t":"Dilute RBCs with saline to increase the speed with which they can be infused.","l":1},{"t":"Use an additional small-pore filter to <b>avoid<\/b> occluding the IV giving-set filter with debris.","l":1},{"t":"Warm IV fluids and use other patient warming devices to maintain body temperature (see Event 44, Hypothermia).","l":1},{"t":"<b>CALL FOR HELP<\/b> if major fluid resuscitation is necessary:","l":0},{"t":"If possible, the primary anesthesiologist should monitor the patient and surgical status and direct activities of OR personnel.","l":1},{"t":"Additional help should:","l":1},{"t":"Check and transfuse blood products, and obtain and reorder blood products when necessary.","l":2},{"t":"Set up rapid transfusor device, if available.","l":2},{"t":"Set up cell saver unit for autotransfusion of RBCs if blood is not contaminated.","l":2},{"t":"Ensure adequate IV access; consider intraosseus (IO) line:","l":0},{"t":"Have a minimum of one 16-gauge or larger IV line, preferably more.","l":1},{"t":"In the case of severe blood loss, place at least one very <b>large-bore<\/b> IV line (such as 8.5 French catheter introducer) in a suitable peripheral or central vein.","l":1},{"t":"Use <b>large-bore<\/b> rapid transfusion IV tubing if available.","l":1},{"t":"If IV access is difficult, change a small IV cannula to a large IV cannula by using the Seldinger technique.","l":1},{"t":"Use ultrasound guidance for more access.","l":1},{"t":"Check IV site to make sure IV line is not infiltrated.","l":1},{"t":"Consider IO line placement early in the resuscitation if IV access is difficult.","l":1},{"t":"Obtain adequate supplies of IV fluid (<b>colloid<\/b> or <b>crystalloid<\/b>).","l":0},{"t":"Continue to NOTIFY BLOOD BANK of blood product needs, per local protocol.","l":0},{"t":"If emergency release blood products are administered (O-neg RBCs), send a new blood sample to blood bank for type and screen procedure <b>as soon as possible<\/b> and prior to transfusion of type-specific blood.","l":0},{"t":"Monitor hemodynamic status for adequacy of volume resuscitation:","l":0},{"t":"BP and HR.","l":1},{"t":"Central venous pressure (<b>CVP<\/b>) and/or pulmonary artery (PA) pressure.","l":1},{"t":"TEE or TTE.","l":1},{"t":"Monitor labs at regular intervals: <b>hematocrit<\/b>, electrolytes, arterial blood gas (<b>ABG<\/b>), <b>PT<\/b>/<b>PTT<\/b>, <b>fibrinogen<\/b> every 30 to 60 minutes.","l":0},{"t":"Further transfusion of blood and blood products should be guided by lab results.","l":0},{"t":"Keep track of surgical events and inform surgeon periodically about resuscitation efforts.","l":0}],"complications":[{"t":"Coagulopathy/disseminated intravascular coagulation (DIC).","l":0},{"t":"Volume overload from overshoot of fluid resuscitation.","l":0},{"t":"Hypothermia.","l":0},{"t":"Hyperkalemia.","l":0},{"t":"Hypocalcemia.","l":0},{"t":"Irreversible shock.","l":0},{"t":"Acute respiratory distress syndrome (ARDS)/transfusion-related acute lung injury (TRALI).","l":0},{"t":"Allergic/anaphylactic reaction to blood.","l":0},{"t":"Transfusion-related viral infection.","l":0},{"t":"Myocardial ischemia, arrhythmias.","l":0},{"t":"Renal failure.","l":0},{"t":"Neurologic injury.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Young PP, Cotton BA, Goodnough LT. Massive transfusion protocols for patients with substantial hemorrhage. Transfus Med Rev 2011;25:293-303."},{"t":"2. Hajjar LA, Vincent JL, Galas FR, et al. Transfusion requirements after cardiac surgery: the TRACS randomized controlled trial. JAMA 2010;304:1559-67."},{"t":"3. Carson JL, Noveck H, Berlin JA, Gould SA. Mortality and morbidity in patients with very low postoperative Hb levels who decline blood transfusion. Transfusion 2002;42(7):812."},{"t":"4. Niles SE, McLaughlin DF, Perkins JG, et al. Increased mortality associated with the early coagulopathy of trauma in combat casualties. J Trauma 2008;64:1459-63."},{"t":"5. Burtelow M, Riley E, Druzin M, et al. How we treat: management of life threatening primary postpartum hemorrhage using a standardized massive transfusion protocol. Transfusion 2007;47:1564-72."}]}},{"id":2,"title":"Cardiac Arrest","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"Cardiac arrest is the absence of effective mechanical activity of the heart.","l":0}],"etiology":[{"t":"Cardiovascular disease.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Myocardial infarction [MI].","l":2},{"t":"Myocardial ischemia.","l":2},{"t":"Cardiomyopathy.","l":2},{"t":"Arrhythmia.","l":2},{"t":"Valvular disease.","l":2},{"t":"Aortic dissection.","l":2},{"t":"Hypovolemia:","l":0},{"t":"Surgical maneuvers or positioning that causes decreased venous return.","l":1},{"t":"Hemorrhage.","l":1},{"t":"Hypoxemia:","l":0},{"t":"Failed airway management.","l":1},{"t":"Respiratory arrest.","l":1},{"t":"Shock.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Anaphylaxis.","l":2},{"t":"Sepsis.","l":2},{"t":"Bradycardia:","l":0},{"t":"After neuraxial blockade or any acute vagal reflex.","l":1},{"t":"After repeated doses of succinylcholine.","l":1},{"t":"Tension pneumothorax.","l":0},{"t":"Auto positive end-expiratory pressure (PEEP).","l":0},{"t":"Pulmonary, venous air, or amniotic fluid embolism.","l":0},{"t":"Cardiac tamponade.","l":0},{"t":"Toxins.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Cocaine.","l":2},{"t":"Methamphetamine.","l":2},{"t":"Anesthetic drug-related complications.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"IV or anesthetic overdose.","l":2},{"t":"Medication error.","l":2},{"t":"Vasodilator bolus.","l":2},{"t":"Local anesthetic systemic toxicity [LAST].","l":2},{"t":"MH.","l":0},{"t":"Acidosis.","l":0},{"t":"Hypoglycemia.","l":0},{"t":"Electrolyte abnormalities.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Hyperkalemia.","l":2},{"t":"Particularly in renal failure.","l":2},{"t":"Hypothermia.","l":0},{"t":"Pulmonary hypertension.","l":0},{"t":"Transfusion reactions.","l":0},{"t":"Pacemaker failure.","l":0}],"typical":[{"t":"ACS.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Major trauma.","l":0},{"t":"Acute hemorrhage.","l":0},{"t":"Shock.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Anaphylaxis.","l":2},{"t":"Sepsis.","l":2},{"t":"Following a respiratory arrest.","l":0},{"t":"Difficult intubation or ventilation.","l":0},{"t":"Hypoxemia, e.g. unrecognized esophageal intubation.","l":0},{"t":"Hypercarbia.","l":0},{"t":"PE.","l":0},{"t":"Bradycardia during neuraxial blockade.","l":0},{"t":"Acute vagal reflex.","l":0},{"t":"Drug toxicity.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Contraindications to succinylcholine.","l":2},{"t":"Local anesthetic overdose.","l":2},{"t":"Tension pneumothorax.","l":0},{"t":"Cardiac tamponade.","l":0},{"t":"Direct myocardial contact with the electrocautery.","l":0},{"t":"Pacemaker failure.","l":0},{"t":"Electrolyte abnormalities.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Hyperkalemia.","l":2},{"t":"Hypocalcemia.","l":2},{"t":"Obstetric complications.","l":0}],"prevention":[{"t":"Evaluate pacemaker function prior to surgery and manage appropriately.","l":0},{"t":"Place a transvenous or transcutaneous pacemaker prophylactically for patients with high-grade atrioventricular (AV) block or significant sinus bradycardia.","l":0},{"t":"Treat arrhythmias with appropriate antiarrhythmic therapy and continue through surgery.","l":0},{"t":"Aggressively treat bradycardia/hypotension following neuraxial blockade.","l":0},{"t":"Treat ACS to restore myocardial blood flow.","l":0},{"t":"<b>Avoid<\/b> surgery and anesthesia after recent MI.","l":0},{"t":"Administer vagolytic drug in patients or in procedures with a high risk of increased vagal tone, e.g. neuraxial blockade.","l":0},{"t":"Drill and practice management of unstable patients (using simulation if available).","l":0},{"t":"Administer vagolytic prior to, or mixed with, anticholinesterases that cause bradycardia.","l":0}],"manifestations":[{"t":"Unresponsive to verbal commands.","l":0},{"t":"Absence of pulse oximeter waveform.","l":0},{"t":"Loss of consciousness or <b>seizure<\/b>-like activity.","l":0},{"t":"No palpable carotid pulse (palpation of peripheral pulses unreliable):","l":0},{"t":"Noninvasive blood pressure (NIBP) unmeasurable.","l":1},{"t":"Invasive arterial pressure without pulsations:","l":1},{"t":"Mean arterial pressure (MAP) less than 20 mm Hg without CPR.","l":2},{"t":"Absence of heart tones on auscultation.","l":0},{"t":"<b>Apnea<\/b>:","l":0},{"t":"Loss of, or decreased, ET CO<sub>2<\/sub>.","l":1},{"t":"<b>Arrhythmias<\/b>:","l":0},{"t":"Ventricular <b>tachycardia<\/b> [VT], ventricular fibrillation [VF], asystole.","l":1},{"t":"Pulseless electrical activity (PEA) (rhythm in PEA may appear normal).","l":0},{"t":"<b>Cyanosis<\/b>.","l":0},{"t":"Regurgitation and possible aspiration of gastric contents.","l":0},{"t":"Lack of ventricular contraction on TEE or TTE.","l":0}],"similar":[{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"Pulmonary, venous air, or amniotic fluid embolism (see Event 21, Pulmonary Embolism, Event 24, Venous Gas Embolism, and Event 81, Amniotic Fluid Embolism).","l":0},{"t":"Sepsis (see Event 13, The Septic Patient).","l":0},{"t":"Acute hemorrhage (see Event 1, Acute Hemorrhage).","l":0},{"t":"Medication reaction (see Event 63, Drug Administration Error).","l":0},{"t":"Local anesthetic overdose (see Event 52, Local Anesthetic Systemic Toxicity).","l":0},{"t":"Total spinal anesthesia (see Event 89, Total Spinal Anesthesia).","l":0},{"t":"Cardiac disease:","l":0},{"t":"MI, ischemia [see Event 15, Acute Coronary Syndrome], cardiomyopathy, aortic dissection.","l":1},{"t":"Hypotension (see Event 9, Hypotension).","l":0},{"t":"Seizures (see Event 57, Seizures).","l":0},{"t":"Artifacts on monitoring devices:","l":0},{"t":"Electrocardiogram (ECG).","l":1},{"t":"Pulse oximeter.","l":1},{"t":"Blood pressure measurement systems (NIBP or invasive).","l":1}],"management":[{"t":"Treat the patient, not the monitor.","l":0},{"t":"Verify that there is no pulse (and that an “awake” patient has become unresponsive):","l":0},{"t":"Check pulse oximeter and ET CO<sub>2<\/sub> waveforms.","l":1},{"t":"Palpate the carotid, femoral, or other pulse:","l":1},{"t":"Surgeon may have better access to palpable pulses.","l":2},{"t":"Check NIBP and ECG monitors and leads.","l":1},{"t":"Check <b>arterial line<\/b> waveform.","l":1},{"t":"<b>Immediately<\/b> notify surgeons and other OR personnel of the cardiac arrest:","l":0},{"t":"<b>Call for help.<\/b>","l":1},{"t":"Call OR or hospital “code”.","l":1},{"t":"Call for crash cart and defibrillator.","l":1},{"t":"Start CPR <b>immediately<\/b> (C-A-B: compressions, airway, breathing).","l":1},{"t":"Apply defibrillation pads to chest.","l":1},{"t":"Turn off ALL anesthetics.","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> at high flows to flush circuit of inhaled anesthetics and verify change.","l":0},{"t":"Begin basic life support (BLS):","l":0},{"t":"Assign someone to start chest compressions:","l":1},{"t":"Compressions should be at least 100 per minute and at least 2 inches deep.","l":2},{"t":"Rotate compressors every 2 minutes and monitor for fatigue of the person performing chest compressions.","l":2},{"t":"Allow for complete recoil of the chest with each compression.","l":2},{"t":"Minimize interruptions in compressions and keep interruptions brief (less than 10 seconds).","l":2},{"t":"Adequate compressions should generate an ET CO<sub>2<\/sub> of at least 10 mm Hg and a diastolic pressure of greater than 20 mm Hg (if an <b>arterial line<\/b> is in place).","l":2},{"t":"You <b>MUST<\/b> improve CPR quality and vascular tone if above conditions are not met.","l":2},{"t":"<b>Airway/Ventilation:<\/b>","l":1},{"t":"If patient is not intubated, establish bag mask ventilation with <b>100%<\/b> O<sub>2<\/sub> at a compression to ventilation ratio of 30:2 and prepare for definitive airway:","l":2},{"t":"Place a supraglottic airway (SGA) or endotracheal tube (ETT) without stopping compressions and then ventilate at a rate of 10/minute with continuous compressions.","l":3},{"t":"Assign tasks to skilled responders:","l":0},{"t":"Ensure adequate IV access:","l":1},{"t":"If difficult IV access, place IO infusion line.","l":2},{"t":"<b>Place arterial line.<\/b>","l":1},{"t":"Call for TEE/TTE machine.","l":1},{"t":"<b>Begin ACLS.<\/b>","l":0},{"t":"Employ cognitive aids (ACLS algorithms) to help determine diagnosis and treatment.","l":0},{"t":"Diagnose and treat arrhythmias:","l":0},{"t":"Determine if patient is in a shockable rhythm:","l":1},{"t":"Analyze rhythm during very short breaks in CPR (e.g. during ventilation phase of the 30:2 compression-to-ventilation ratio or while rotating compressors):","l":2},{"t":"CPR artifact can appear as a shockable rhythm.","l":3},{"t":"<b>VT/VF (shockable pathway):<\/b>","l":1},{"t":"Continue high-quality CPR.","l":2},{"t":"Defibrillate <b>as soon as possible<\/b> with <b>200 J<\/b> or follow manufacturer’s recommendations.","l":2},{"t":"<b>Immediately<\/b> resume chest compressions after each defibrillation:","l":2},{"t":"<b>Do not<\/b> check pulse or rhythm.","l":3},{"t":"If a shockable rhythm persists after the initial defibrillation, continue CPR and administer <b>epinephrine<\/b> IV, <b>1 mg<\/b> every 3 to 5 minutes.","l":2},{"t":"Consider replacing 1 dose of <b>epinephrine<\/b> with <b>vasopressin<\/b> IV, <b>40 units<\/b>.","l":2},{"t":"DEFIBRILLATE EVERY 2 MINUTES","l":0,"h":1},{"t":"Consider antiarrhythmics:","l":2},{"t":"<b>Amiodarone<\/b> IV, <b>300 mg<\/b>.","l":3},{"t":"<b>Lidocaine<\/b> IV, <b>100 mg<\/b>.","l":3},{"t":"Search for treatable causes for VT/VF:","l":2},{"t":"Torsades de pointes:","l":3},{"t":"Administer <b>magnesium sulfate<\/b> (MgSO<sub>4<\/sub>) IV, <b>2 g<\/b>.","l":4},{"t":"Hyperkalemia (see Event 40, Hyperkalemia):","l":3},{"t":"Administer <b>calcium chloride<\/b> (CaCl<sub>2<\/sub>) <b>10%<\/b> IV, <b>500 to 1000 mg<\/b>.","l":4},{"t":"Administer <b>dextrose 50%<\/b> IV, <b>50 g<\/b>, and regular <b>insulin<\/b> IV, <b>10 units<\/b>.","l":4},{"t":"Local anesthetic toxicity (see Event 52, Local Anesthetic Systemic Toxicity):","l":3},{"t":"Administer <b>20% lipid emulsion<\/b> (Intralipid).","l":4},{"t":"MI (see Event 15, Acute Coronary Syndrome).","l":3},{"t":"If rhythm changes to non-shockable rhythm, switch to PEA/asystole pathway.","l":1},{"t":"<b>PEA/asystole (non-shockable pathway):<\/b>","l":1},{"t":"Continue high-quality CPR.","l":2},{"t":"Administer <b>epinephrine<\/b> IV, <b>1 mg<\/b> every 3 to 5 minutes.","l":2},{"t":"Consider replacing 1 dose of <b>epinephrine<\/b> with <b>vasopressin<\/b> IV, <b>40 units<\/b>.","l":2},{"t":"Search for treatable causes of PEA/asystole:","l":1},{"t":"<b>Hypovolemia<\/b> (see Event 1, Acute Hemorrhage, and Event 9, Hypotension):","l":2},{"t":"Administer fluid bolus, rule out occult bleeding, administer sufficient blood products for massive hemorrhage or severe anemia.","l":3},{"t":"Evaluate fluid status with TEE or TTE.","l":3},{"t":"Inadequate preload from caval compression:","l":3},{"t":"Release pneumoperitoneum.","l":4},{"t":"Left uterine displacement for gravid uterus.","l":4},{"t":"Return prone patient with large abdomen to supine position.","l":4},{"t":"Release surgical retraction.","l":4},{"t":"Disconnect breathing circuit if breath stacking (auto-PEEP) and adjust ventilation appropriately.","l":4},{"t":"<b>Hypoxemia<\/b> (see Event 10, Hypoxemia):","l":2},{"t":"Ventilate and oxygenate with <b>100%<\/b> O<sub>2<\/sub>.","l":3},{"t":"Auscultate breath sounds.","l":3},{"t":"Suction ETT.","l":3},{"t":"Reconfirm presence of ET CO<sub>2<\/sub>.","l":3},{"t":"<b>Tension pneumothorax<\/b> (see Event 35, Pneumothorax):","l":2},{"t":"Auscultate for unilateral breath sounds.","l":3},{"t":"Absence of sliding pleura sign on TTE.","l":3},{"t":"Distended neck veins or deviated trachea:","l":3},{"t":"Perform emergent needle decompression at 2nd intercostal space, midclavicular line:","l":4},{"t":"Patient will require pleural drainage after needle decompression.","l":5},{"t":"<b>Coronary thrombosis<\/b> (see Event 15, Acute Coronary Syndrome):","l":2},{"t":"Unexplained cardiac arrest may be secondary to MI; consider TEE or TTE to evaluate global myocardial function and regional wall motion abnormalities.","l":3},{"t":"<b>Toxins (including infusions):<\/b>","l":2},{"t":"Confirm that IV and volatile anesthetics are off.","l":3},{"t":"Check all infusions:","l":3},{"t":"Confirm they are the correct drug and rate of administration.","l":4},{"t":"Discontinue if they are not indicated.","l":4},{"t":"If the potential for LAST exists (see Event 52, Local Anesthetic Systemic Toxicity):","l":3},{"t":"Administer <b>20% lipid emulsion<\/b> (Intralipid).","l":4},{"t":"Consider Intralipid for any overdose of a lipid-soluble drug.","l":4},{"t":"Send toxicology screen.","l":3},{"t":"<b>Cardiac tamponade:<\/b>","l":2},{"t":"Use TEE or TTE to rule out pericardial effusion:","l":3},{"t":"If present, perform emergent pericardiocentesis.","l":4},{"t":"Electrolyte and acid/base abnormalities:","l":2},{"t":"Send stat labs (<b>ABG<\/b> and metabolic panel):","l":3},{"t":"Evaluate for acidosis, hyperkalemia, hypokalemia, hypoglycemia, hypocalcemia.","l":4},{"t":"<b>VGE<\/b> (see Event 24, Venous Gas Embolism):","l":2},{"t":"Acute hypotension with drop in ET CO<sub>2<\/sub>.","l":3},{"t":"Flood surgical field with saline.","l":3},{"t":"Aspirate <b>CVP<\/b> catheter, if present.","l":3},{"t":"<b>PE<\/b> (see Event 21, Pulmonary Embolism).","l":2},{"t":"<b>Pulmonary hypertension:<\/b>","l":2},{"t":"Use TTE or TEE to assess right ventricular (RV) function.","l":3},{"t":"<b>Hyperthermia:<\/b>","l":2},{"t":"Rule out MH (see Event 45, Malignant Hyperthermia).","l":3},{"t":"<b>Hypothermia<\/b> (see Event 44, Hypothermia).","l":2},{"t":"Continually reassess patient without interrupting chest compressions:","l":0},{"t":"Return of spontaneous circulation is indicated by:","l":1},{"t":"ECG and palpable pulse or BP.","l":2},{"t":"Pulse oximetry waveform.","l":2},{"t":"Increase in ET CO<sub>2<\/sub>.","l":2},{"t":"Consider postresuscitation hypothermia for brain protection.","l":0}],"complications":[{"t":"Aspiration of gastric contents.","l":0},{"t":"Laceration of liver.","l":0},{"t":"Pneumothorax or hemothorax.","l":0},{"t":"Rib fracture.","l":0},{"t":"Hypoxic brain injury.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Neumar RW, Otto CW, Link MS, et al. 2010 American Heart Association guidelines for cardiopulmonary resuscitation and emergency cardiovascular care science. Part 8: adult advanced cardiovascular life support. Circulation 2010;122:S729-67."},{"t":"2. Moitra VK, Gabrielli A, Maccioli GA, O’Connor MF. Anesthesia advanced circulatory life support. Can J Anesth 2012;59:586-603."}]}},{"id":3,"title":"Difficult Tracheal Intubation","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"Difficult tracheal intubation occurs when successful intubation of the trachea is not accomplished within the first two attempts by an experienced anesthesia professional.","l":0}],"etiology":[{"t":"Anatomical causes of a difficult airway:","l":0},{"t":"Full dentition.","l":1},{"t":"Obesity/short neck.","l":1},{"t":"Physician factors:","l":0},{"t":"Inexperience with airway management.","l":1},{"t":"Failure to respond effectively to a rapidly deteriorating situation.","l":1},{"t":"Equipment factors:","l":0},{"t":"Inexperience with equipment.","l":1},{"t":"Inadequate backup or alternative airway adjuncts or intubating devices.","l":1}],"typical":[{"t":"Any patient with anatomy that makes direct laryngoscopy difficult:","l":0},{"t":"Short “bull” neck.","l":1},{"t":"Prominent maxillary incisors.","l":1},{"t":"Limited range of neck or jaw movement.","l":1},{"t":"Short thyromental distance.","l":1},{"t":"Late stages of pregnancy.","l":1},{"t":"Congenital syndromes associated with difficulty in endotracheal intubation.","l":0},{"t":"Infections of the airway.","l":0},{"t":"Acquired anatomic abnormalities:","l":0},{"t":"Intrinsic or extrinsic tumors of the airway.","l":1},{"t":"Following radiation therapy to the head and/or neck.","l":1},{"t":"Acromegaly.","l":1},{"t":"Morbid obesity.","l":1},{"t":"History of sleep apnea.","l":1},{"t":"Tracheal stenosis.","l":1},{"t":"Significant neck swelling or hematoma compressing the airway.","l":1}],"prevention":[{"t":"Carefully assess airway anatomy:","l":0},{"t":"Samsoon and Young modification of Mallampati classification:","l":1},{"t":"Class I: Visualize soft palate, uvula, tonsillar pillars, fauces (same as Mallampati class I).","l":2},{"t":"Class II: Visualize soft palate, uvula, fauces.","l":2},{"t":"Class III: Visualize soft palate, base of uvula only.","l":2},{"t":"Class IV: Visualize hard palate only (same as Mallampati class III).","l":2},{"t":"Class III and IV airways are associated with increased difficulty with tracheal intubation.","l":1},{"t":"Assess other patient factors:","l":0},{"t":"Patient’s ability to cooperate with airway management plan.","l":1},{"t":"Degree of difficulty with mask ventilation.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Facial hair.","l":3},{"t":"Edentulous patients.","l":3},{"t":"Degree of difficulty with SGA placement, e.g. limited mouth opening.","l":1},{"t":"Degree of difficulty with surgical airway access.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Limited neck extension.","l":3},{"t":"Goiter.","l":3},{"t":"Create difficult airway cart with necessary supplies and equipment.","l":0},{"t":"Drill and practice management of difficult airway/failed intubation algorithm (using simulation if available).","l":0}],"manifestations":[{"t":"Expected or known difficult tracheal intubation:","l":0},{"t":"Previous history of:","l":1},{"t":"Difficult airway.","l":2},{"t":"Tracheal intubation.","l":2},{"t":"Airway examination classified as Samsoon and Young’s class III or IV.","l":1},{"t":"Presence of other anatomic features that make the patient difficult to intubate.","l":1},{"t":"Unexpected difficult tracheal intubation:","l":0},{"t":"Failure to intubate the trachea after two attempts by an experienced anesthesia professional:","l":1},{"t":"May be secondary to:","l":2},{"t":"Difficult laryngoscopy.","l":3},{"t":"Difficulty passing the ETT into the trachea.","l":3}],"similar":[{"t":"Normal airway but unsuccessful intubation owing to inexperience of the laryngoscopist.","l":0}],"management":[{"t":"<b><i>Expected Difficult Intubation.<\/i><\/b>","l":0},{"t":"Err on the side of caution:","l":0},{"t":"Review previous anesthesia records, focusing on airway management.","l":1},{"t":"Perform a careful airway assessment; obtain a second opinion about the airway if you are still unsure of how to proceed.","l":1},{"t":"Consider alternatives to general anesthesia but remember that airway management will be difficult if a major complication or inadequate anesthesia occurs.","l":1},{"t":"If difficult airway is known or anticipated, consider performing an awake fiberoptic intubation:","l":0},{"t":"This will be the safest option in most cases.","l":1},{"t":"Awake intubation will be harder to perform if prior attempts at direct laryngoscopy have caused bleeding, secretions, or tissue edema:","l":1},{"t":"Administer <b>glycopyrrolate<\/b> IV, <b>0.4 mg<\/b> as antisialagogue.","l":2},{"t":"Topicalize oropharynx:","l":2},{"t":"<b>Lidocaine 4%<\/b> nebulized and supplement if necessary:","l":3},{"t":"Be aware of total local anesthetic dose administered.","l":4},{"t":"Consider Williams airway in oropharynx and intubate over the fiberoptic bronchoscope with a 6.0 to 8.0 ETT.","l":2},{"t":"<b>Do not<\/b> oversedate the patient.","l":2},{"t":"Awake intubation can also be performed using video-assisted laryngoscopy with topical anesthesia.","l":1},{"t":"Prepare contingency plans and obtain appropriate equipment (difficult airway cart):","l":0},{"t":"Multiple laryngoscope blades (different sizes of Miller and Macintosh blades).","l":1},{"t":"Multiple ETT sizes (at least two sizes smaller than the expected size needed).","l":1},{"t":"Bougie, airway introducers.","l":1},{"t":"SGA, e.g. LMA.","l":1},{"t":"Intubating LMA.","l":1},{"t":"Video-assisted laryngoscope.","l":1},{"t":"Fiberoptic bronchoscope.","l":1},{"t":"A cricothyrotomy set (will require a trained person to perform):","l":1},{"t":"If cricothyrotomy would be difficult or impossible, consider CPB standby.","l":2},{"t":"<b><i>Unexpected Difficult Intubation.<\/i><\/b>","l":0},{"t":"Call for help (e.g. anesthesia professional, anesthesia technician and surgeon capable of establishing surgical airway):","l":0},{"t":"Call for difficult airway cart.","l":1},{"t":"Once help arrives, have them set up additional airway equipment.","l":1},{"t":"Mask ventilate with <b>100%<\/b> O<sub>2<\/sub>; consider using cricoid pressure but release if mask venti<b>lation is difficult:<\/b>","l":0},{"t":"Assess adequacy of ventilation and oxygenation:","l":1},{"t":"Place an oral or nasopharyngeal airway.","l":2},{"t":"Consider two-person mask ventilation technique.","l":2},{"t":"If mask ventilation is possible:","l":1},{"t":"Optimize patient’s position for intubation.","l":2},{"t":"Most experienced person should perform subsequent laryngoscopies:","l":1},{"t":"Limit intubation to three attempts.","l":2},{"t":"Consider intubation with video-assisted laryngoscopy.","l":2},{"t":"Use stylet or bougie.","l":2},{"t":"Use smaller ETT if difficulty in passing ETT through cords.","l":2},{"t":"Consider placing an SGA to be used as the primary airway device or to be used as a conduit for fiberoptic intubation with an Aintree exchange catheter.","l":1},{"t":"Consider an asleep fiberoptic intubation.","l":1},{"t":"Consider using an intubating LMA.","l":1},{"t":"Consider allowing spontaneous ventilation to return if possible and awaken the patient; convert to an awake intubation or cancel the case.","l":1},{"t":"If mask ventilation or intubation is impossible:","l":0},{"t":"Attempt to place an SGA:","l":1},{"t":"If successful, consider whether to wake the patient, continue the case with the SGA, or attempt to intubate the trachea through the device with an Aintree exchange catheter as outlined earlier.","l":2},{"t":"If SGA is unsuccessful, move early and aggressively to emergency cricothyrotomy or tracheostomy.","l":1},{"t":"DO NOT WAIT for the O<sub>2<\/sub> saturation to fall precipitously.","l":1},{"t":"<b>Follow up:<\/b>","l":0},{"t":"After an unexpected difficult intubation, ensure that the patient is informed of the complications and recommend that he or she obtain a MedicAlert bracelet (http:// www.medicalert.org) to inform future anesthesia professionals about history of difficult intubation.","l":1}],"complications":[{"t":"Damage to airway structures.","l":0},{"t":"Bleeding in the airway.","l":0},{"t":"Airway obstruction from loss of airway reflexes or laryngospasm.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Esophageal intubation.","l":0},{"t":"Gastric distention.","l":0},{"t":"Regurgitation and aspiration of gastric contents.","l":0},{"t":"Damage to the cervical spine during attempts at intubation.","l":0}],"reading":[{"t":"1. Launcelott GO, Johnson LB. Surgical airway. In: Hung O, Murphy MF, editors. Management of the difficult and failed airway. 2nd ed. New York: McGraw-Hill; 2012, chapter 13."},{"t":"2. Phero JC, Patil YJ, Hurford WE. Evaluation of the patient with a difficult airway. In: Longnecker DE, Newman MF, Brown DL, Zapol WM, editors. Anesthesiology. 2nd ed. New York: McGraw-Hill; 2012, chapter 10."},{"t":"3. Apfelbaum JL, Silverstein JH, Chung FF, et al. Practice guidelines for management of the difficult airway: an updated report by the American Society of Anesthesiologists Task Force on management of the difficult airway. Updated by the Committee on Standards and Practice Parameters. Anesthesiology 2013;118:251-70."}]}},{"id":4,"title":"Emergent (Crash) Induction of Anesthesia","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"Emergent induction of anesthesia to facilitate an immediate lifesaving intervention.","l":0}],"etiology":[{"t":"Catastrophic event that results in the immediate need for life-saving surgical intervention.","l":0}],"typical":[{"t":"Trauma.","l":0},{"t":"Stat cesarean section.","l":0},{"t":"Vascular catastrophes, e.g. ruptured aortic aneurysm.","l":0},{"t":"Emergent surgical reexploration:","l":0},{"t":"Cardiac tamponade.","l":1},{"t":"Disruption of surgical anastomosis.","l":1},{"t":"Cath lab crash.","l":0},{"t":"Necrotizing fasciitis.","l":0}],"prevention":[{"t":"Resuscitate the patient prior to induction of anesthesia and surgical intervention.","l":0},{"t":"Have an OR and anesthesia workstation that is fully functional and ready for use.","l":0},{"t":"Have appropriate staff and equipment available.","l":0},{"t":"Drill and practice management of stat and urgent surgical cases (using simulation if available).","l":0}],"manifestations":[{"t":"Stat call to the OR, ICU, emergency department (ED), cath lab, obstetrics (OB) suite, etc., for emergent case.","l":0},{"t":"Patient may arrive at the OR with little notice.","l":0},{"t":"Stat call to patient’s bedside with a decision to go emergently to the OR.","l":0}],"management":[{"t":"<i>Do not transport the patient from an area where monitoring and resuscitation are occurring to the OR until it is set up and the anesthesia team and nursing staff are ready to care for the patient.<\/i>","l":0,"n":1},{"t":"Call for additional help:","l":0},{"t":"Anesthesia professionals.","l":1},{"t":"Nursing staff (scrub nurse[s] and circulating nurse).","l":1},{"t":"Technical support (anesthesia and surgical support technicians).","l":1},{"t":"Surgical assistants.","l":1},{"t":"<b>Prepare anesthesia equipment:<\/b>","l":0},{"t":"If patient is already in the OR, assign someone to monitor the patient as you set up.","l":1},{"t":"Turn on anesthesia machine and monitors.","l":1},{"t":"If time allows, perform <b>full<\/b> machine check:","l":1},{"t":"At minimum, confirm that you are able to provide positive pressure ventilation with machine and circuit.","l":2},{"t":"Confirm suction is functional.","l":2},{"t":"Confirm presence of self-inflating bag/mask.","l":1},{"t":"Confirm airway equipment.","l":1},{"t":"including:","l":2,"e":1},{"t":"Oral airway.","l":3},{"t":"ETT.","l":3},{"t":"Functional laryngoscope blades and handles.","l":3},{"t":"Confirm presence of SGA (e.g. LMA) and bougie for possible difficult airway.","l":1},{"t":"Confirm that video-assisted laryngoscope is present.","l":1},{"t":"<b>Prepare medications:<\/b>","l":0},{"t":"Induction agent as indicated (<b>ketamine<\/b>, <b>etomidate<\/b>, <b>propofol<\/b>).","l":1},{"t":"Neuromuscular blocker (<b>succinylcholine<\/b> unless <b>contraindicated<\/b>).","l":1},{"t":"Emergency medications (<b>ephedrine<\/b>, <b>phenylephrine<\/b>, and/or <b>epinephrine<\/b>).","l":1},{"t":"Obtain brief history and physical:","l":0},{"t":"Information can come from patient, medical record, or caregivers:","l":1},{"t":"Check critical lab values.","l":2},{"t":"Check whether sample has been sent to blood bank for type and cross.","l":2},{"t":"Reassess and confirm it is a life-threatening emergency:","l":1},{"t":"<b>Avoid<\/b> crash induction if not medically necessary.","l":2},{"t":"Assess whether the patient has allergies to any medications.","l":1},{"t":"Assess for major cardiopulmonary disease.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Valvular heart disease.","l":3},{"t":"Low ejection fraction.","l":3},{"t":"Asthma.","l":3},{"t":"Chronic obstructive pulmonary disease [COPD].","l":3},{"t":"Perform airway examination.","l":1},{"t":"<b>Monitoring:<\/b>","l":0},{"t":"Determine what IV access and lines are functional:","l":1},{"t":"Place additional IV access as indicated.","l":2},{"t":"Consider IO line if unable to quickly achieve vascular access.","l":2},{"t":"Connect ECG, NIBP, pulse oximeter, and all invasive monitoring lines that are present.","l":1},{"t":"Consider placement of <b>arterial line<\/b> preinduction if not already present in situ:","l":1},{"t":"Assign this task to skilled help.","l":2},{"t":"<b>Induction:<\/b>","l":0},{"t":"Preoxygenate while setting up and placing monitors.","l":1},{"t":"Confirm left uterine displacement for OB patient.","l":1},{"t":"Assume full stomach:","l":1},{"t":"Consider administration of Bicitra (PO), <b>30 mL<\/b>.","l":2},{"t":"Modify induction dose of anesthetic based on hemodynamic parameters and patient comorbidities:","l":1},{"t":"Consider using <b>ketamine<\/b> or <b>etomidate<\/b> as an induction agent if hemodynamically unstable.","l":2},{"t":"Consider IV fluid bolus while preoxygenating patient.","l":2},{"t":"Consider video-assisted laryngoscopy as first choice for intubation:","l":1},{"t":"Turn device on.","l":2},{"t":"ETT with appropriate stylet.","l":2},{"t":"Laryngoscope, ETT, suction on and ready at head of bed.","l":1},{"t":"Perform RSI with cricoid pressure:","l":1},{"t":"Release or manipulate cricoid pressure if unable to visualize the vocal cords or to intubate the trachea.","l":2},{"t":"Ensure correct placement of ETT via ET CO<sub>2<\/sub> and auscultation.","l":2},{"t":"If unable to intubate, move to video-assisted laryngoscope (see Event 3, Difficult Tracheal Intubation).","l":1},{"t":"<b>Postinduction:<\/b>","l":0},{"t":"Monitor patient:","l":1},{"t":"Expect instability and search for treatable causes.","l":2},{"t":"Support as needed with vasopressors and fluid.","l":2},{"t":"Consider placement of TEE to monitor myocardial filling and function.","l":2},{"t":"Establish additional IV access as indicated.","l":1},{"t":"Provide anesthesia as tolerated:","l":1},{"t":"Balance risk of awareness with hemodynamic stability.","l":2},{"t":"Obtain RBCs and other blood products as indicated.","l":1},{"t":"Send labs for <b>ABG<\/b>, blood glucose, and lactate as indicated.","l":1},{"t":"Administer appropriate antibiotics.","l":1}],"complications":[{"t":"Aspiration of gastric contents.","l":0},{"t":"Difficult intubation.","l":0},{"t":"Awareness under anesthesia.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Gray LD, Morris CG. The principles and conduct of anaesthesia for emergency surgery. Anaesthesia 2013;68(Suppl. 1):14-29."}]}},{"id":5,"title":"Esophageal Intubation","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"Esophageal intubation is the placement of the ETT in the esophagus at the time of intubation or the subsequent displacement of the ETT from the trachea into the esophagus.","l":0}],"etiology":[{"t":"Difficulty in visualizing the larynx at the time of intubation.","l":0},{"t":"Difficulty in passing the ETT.","l":0},{"t":"Change in position of the ETT after correct placement.","l":0},{"t":"Dislodgement by objects placed into, or removed from, the oropharyngeal cavity.","l":0}],"typical":[{"t":"After a difficult or “blind” intubation.","l":0},{"t":"During intubation by an inexperienced laryngoscopist.","l":0},{"t":"After manipulation of the patient’s head or neck.","l":0},{"t":"After placing or removing devices from the esophagus.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"TEE probe.","l":2},{"t":"Nasogastric tube [NGT].","l":2},{"t":"Nasotracheal intubations.","l":0}],"prevention":[{"t":"Use proper intubation technique for optimal visualization of the larynx.","l":0},{"t":"Observe the ETT passing between the vocal cords.","l":0},{"t":"Secure the ETT carefully before allowing movement or positioning of the patient’s head.","l":0},{"t":"Check the position of the ETT after each change of the patient’s position or manipulation of the ETT.","l":0},{"t":"Visualize the carina during fiberoptic intubation.","l":0},{"t":"Use video-assisted laryngoscopy for difficult intubations or as a confirmation of proper ETT placement.","l":0}],"manifestations":[{"t":"Abnormally low or absent ET CO<sub>2<\/sub> waveform after the first few breaths.","l":0},{"t":"Equivocal or absent thoracic breath sounds.","l":0},{"t":"Breath sounds or gurgling heard over the epigastrium.","l":0},{"t":"Abnormal compliance during hand or mechanical ventilation.","l":0},{"t":"Leakage around the ETT with a normal ETT cuff volume.","l":0},{"t":"In the awake patient, continued vocalization after the cuff of the ETT is inflated.","l":0},{"t":"Visualization of the ETT in the esophagus on direct or video-assisted laryngoscopy.","l":0},{"t":"Inability to palpate the cuff of the ETT in the sternal notch.","l":0},{"t":"Regurgitation of gastric contents up the ETT.","l":0},{"t":"Late signs:","l":0},{"t":"Decreasing O<sub>2<\/sub> saturation and <b>cyanosis<\/b>.","l":1},{"t":"<b>Hypotension<\/b>.","l":1},{"t":"<b>Bradycardia<\/b>, premature ventricular contractions (PVCs), tachyarrhythmias, asystole.","l":1},{"t":"VT/VF.","l":1}],"similar":[{"t":"Malfunction or disconnection of capnograph.","l":0},{"t":"Breath sounds that are difficult to hear.","l":0},{"t":"Complete or partial extubation (see Event 37, Unplanned Extubation).","l":0},{"t":"Endobronchial intubation (see Event 30, Endobronchial Intubation).","l":0},{"t":"Severe bronchospasm (see Event 29, Bronchospasm).","l":0},{"t":"Kinked ETT (see Event 7, High Peak Inspiratory Pressure).","l":0},{"t":"Rupture of, or failure to inflate, the ETT cuff.","l":0}],"management":[{"t":"<i>Development of hypoxemia within 10 minutes of intubation <b>must<\/b> be assumed to be due to esophageal intubation unless capnography demonstrates a sustained normal CO<sub>2<\/sub> wave<i>form or video-assisted laryngoscopy clearly shows ETT passing through the vocal cords.<\/i><\/i>","l":0},{"t":"Preoxygenate the patient before induction; check ET O<sub>2<\/sub>:","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> until ETT placement is verified.","l":1},{"t":"Verify position of the ETT after intubation:","l":0},{"t":"Inflate ETT cuff and check for leak.","l":1},{"t":"Check for a normal ET CO<sub>2<\/sub> waveform on the capnograph.","l":1},{"t":"Listen for breath sounds in both axillae and over the stomach.","l":1},{"t":"Look for bilateral chest expansion.","l":1},{"t":"Manually ventilate the patient; assess the compliance of the reservoir bag.","l":1},{"t":"Perform direct or video-assisted laryngoscopy to visualize the position of the ETT relative to the vocal cords.","l":1},{"t":"Get help if there are problems determining the position of the ETT:","l":1},{"t":"Have assistant prepare fiberoptic bronchoscope to assist with ETT verification and placement.","l":2},{"t":"If the patient desaturates and you are unable to verify ETT placement:","l":0},{"t":"Remove ETT and ventilate with <b>100%<\/b> O<sub>2<\/sub> by mask or SGA.","l":1},{"t":"If esophageal intubation is confirmed:","l":0},{"t":"Remove the misplaced ETT.","l":1},{"t":"Ventilate with <b>100%<\/b> O<sub>2<\/sub> by mask or SGA if O<sub>2<\/sub> saturation is &lt;<b>95%<\/b>.","l":1},{"t":"Reintubate the trachea with a clean ETT using video-assisted laryngoscope.","l":1},{"t":"If intubation was difficult on the first attempt or reintubation fails (see Event 3, Difficult Tracheal Intubation):","l":0},{"t":"Ventilate with <b>100%<\/b> O<sub>2<\/sub> by mask if O<sub>2<\/sub> saturation is &lt;<b>95%<\/b>.","l":1},{"t":"Call for help and for difficult airway equipment.","l":1},{"t":"Prepare to place an SGA, e.g. LMA.","l":1},{"t":"Consider waking the patient for possible awake intubation.","l":1},{"t":"Prepare for possible fiberoptic intubation.","l":1},{"t":"Prepare for surgical airway.","l":1},{"t":"After tracheal intubation, place an orogastric tube to empty the stomach.","l":0}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Hypercarbia.","l":0},{"t":"Cardiac arrest.","l":0},{"t":"Airway, pharyngeal, or dental trauma from repeated laryngoscopy.","l":0},{"t":"Aspiration of gastric contents.","l":0},{"t":"Hypertension, tachycardia.","l":0},{"t":"Myocardial ischemia/infarction.","l":0}],"reading":[{"t":"1. Salem MR. Verification of endotracheal tube position. Anesthesiol Clin North America 2001;19:813-39."}]}},{"id":6,"title":"High Inspired CO2","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"A high inspired CO<sub>2<\/sub> is the presence of any CO<sub>2<\/sub> in the inspired gas.","l":0}],"etiology":[{"t":"Decreased absorption of CO<sub>2<\/sub> in the anesthesia breathing circuit.","l":0},{"t":"Decreased elimination of CO<sub>2<\/sub> from the anesthesia breathing circuit, e.g. low fresh gas flow.","l":0},{"t":"Increased CO<sub>2<\/sub> production by the patient.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"MH.","l":2},{"t":"Fever.","l":2},{"t":"Increased exogenous CO<sub>2<\/sub> in the anesthesia breathing circuit.","l":0}],"typical":[{"t":"CO<sub>2<\/sub> absorbent exhausted.","l":0},{"t":"Stuck open (incompetent) unidirectional valve in the anesthesia breathing circuit.","l":0},{"t":"Low fresh gas flow in nonrebreathing circuits.","l":0},{"t":"Sampling of CO<sub>2<\/sub> trapped under drapes in a spontaneously breathing patient, e.g. inadequate washout of exhaled gases.","l":0},{"t":"Malpositioned CO<sub>2<\/sub> canister bypass valve.","l":0},{"t":"Artifact.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Water contamination of sensor.","l":2},{"t":"Sampling rate too low.","l":2},{"t":"Improper circuit assembly, e.g. Bain circuit.","l":0},{"t":"Faulty position of ET CO<sub>2<\/sub> sampling port.","l":0},{"t":"Exogenous source of CO<sub>2<\/sub>.","l":0},{"t":"Channeling of anesthetic gas flow through CO<sub>2<\/sub> absorbent.","l":0}],"prevention":[{"t":"Perform a thorough pre-use check of the anesthesia machine, including status of CO<sub>2<\/sub> absorbent.","l":0},{"t":"Replace CO<sub>2<\/sub> absorbent when indicated.","l":0},{"t":"Check function of unidirectional valves during pre-use machine check.","l":0}],"manifestations":[{"t":"Purple (exhausted) CO<sub>2<\/sub> absorbent:","l":0},{"t":"Color change may not be visible despite exhaustion.","l":1},{"t":"Capnograph waveform does not go to zero.","l":0},{"t":"High fraction of inspired carbon dioxide (FiCO<sub>2<\/sub>) alarm.","l":0},{"t":"“Reverse flow” alarm if incompetent unidirectional valve is present.","l":0},{"t":"Incompetent unidirectional valve is observable.","l":0}],"similar":[{"t":"Hypercarbia (see Event 32, Hypercarbia).","l":0},{"t":"Circle system valve stuck open (see Event 61, Circle System Valve Stuck Open).","l":0},{"t":"Faulty gas supply (see Event 65, Faulty Oxygen Supply).","l":0},{"t":"Monitor failure, e.g. zero calibration error.","l":0}],"management":[{"t":"Ensure oxygenation and ventilation.","l":0},{"t":"Increase fresh gas flows to <b>10 L/min<\/b> to decrease FiCO<sub>2<\/sub>.","l":0},{"t":"Replace CO<sub>2<\/sub> absorbent if exhaustion detected or suspected, even if no color change is perceived.","l":0},{"t":"Inspect unidirectional valves for incompetence and replace valve if needed.","l":0},{"t":"If bypass valve (present on some older anesthesia machines) is incorrectly set, change to include CO<sub>2<\/sub> absorber assembly.","l":0},{"t":"Look for exogenous source of CO<sub>2<\/sub>, e.g. CO<sub>2<\/sub> cylinders.","l":0},{"t":"If unable to quickly detect and correct the etiology of inspired CO<sub>2<\/sub>:","l":0},{"t":"Ventilate with an alternate ventilating system.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Self-inflating bag.","l":3},{"t":"Nonrebreathing circuit.","l":3},{"t":"Maintain anesthesia with IV agents.","l":1},{"t":"If necessary, consider changing out the entire anesthesia workstation; this will require help.","l":1}],"complications":[{"t":"Hypercarbia:","l":0},{"t":"Arrhythmias.","l":1},{"t":"Hypertension and tachycardia.","l":1},{"t":"Altered mental status.","l":1},{"t":"Intracranial pressure (ICP) increase.","l":1},{"t":"Awareness.","l":0},{"t":"Complications of changing anesthesia workstation.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Pond D, Jaffe RJ, Brock-Utne JG. Failure to detect CO<sub>2<\/sub>-absorbent exhaustion: seeing and believing. Anesthesiology 2000;92:1196."},{"t":"2. Kodali BS. Capnography outside the operating rooms. Anesthesiology 2013;118:192-201."}]}},{"id":7,"title":"High Peak Inspiratory Pressure","ch":5,"cat":"Generic Events","s":{"definition":[{"t":"A high PIP is an increase of more than 5 cm H<sub>2<\/sub>O during positive pressure ventilation or a PIP greater than 40 cm H<sub>2<\/sub>O.","l":0}],"etiology":[{"t":"Breathing circuit problem:","l":0},{"t":"Ventilator/bag selector switch in the wrong position.","l":1},{"t":"Inspiratory, expiratory, or pop-off valve stuck in the closed position.","l":1},{"t":"Intentional or unintentional addition of PEEP to the breathing circuit.","l":1},{"t":"Kinked or misconnected hose in the breathing circuit or waste anesthesia gas disposal (WAGD) system.","l":1},{"t":"Failure of check valves or regulators in the anesthesia machine, allowing gas under high pressure into the breathing circuit.","l":1},{"t":"Use of the O<sub>2<\/sub> flush when circuit is closed.","l":1},{"t":"O<sub>2<\/sub> flush control stuck
