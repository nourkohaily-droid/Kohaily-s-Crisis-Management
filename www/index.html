0},{"t":"Hypothermia (see Event 44, Hypothermia).","l":0},{"t":"Carbon monoxide poisoning.","l":0}],"management":[{"t":"Ensure adequate oxygenation and ventilation.","l":0},{"t":"Stop administration of oxidizing agent, if known:","l":0},{"t":"Wash or wipe off topical local anesthetic.","l":1},{"t":"Send blood sample to lab for ABGs and cooximetry:","l":0},{"t":"Specifically request measurement of metHgb.","l":1},{"t":"Administer <b>methylene blue<\/b> IV, <b>1%<\/b> solution <b>1 to 2 mg/kg<\/b> over 5 minutes:","l":0},{"t":"<b>Do not<\/b> use in patients with G6PD deficiency.","l":1},{"t":"Alternatives for patients with G6PD deficiency or when <b>methylene blue<\/b> is ineffective are exchange transfusion and hyperbaric O<b>2<\/b> treatment.","l":1},{"t":"Obtain a baseline 12-lead ECG.","l":0},{"t":"<b>Check troponin levels.<\/b>","l":0},{"t":"In severe cases, admit to ICU for cardiac monitoring for 24 hours.","l":0},{"t":"Watch for recurrence, which can occur up to 24 hours from exposure, especially if caus<b>ative agent is in depot or slow-release formulation.<\/b>","l":0}],"complications":[{"t":"Hypoxemic organ dysfunction.","l":0},{"t":"Encephalopathy.","l":0},{"t":"Seizures.","l":0},{"t":"Myocardial ischemia/infarction.","l":0}],"reading":[{"t":"1. Dahshan A, Donovan GK. Severe methemoglobinemia complicating topical benzocaine use during endoscopy in a toddler: a case report and review of the literature. Pediatrics 2006;117:e806-9."},{"t":"2. Groeper K, Katcher K, Tobias JD. Anesthetic management of a patient with methemoglobinemia. South Med J 2003;96:504-9."},{"t":"3. Skold A, Cosco DL, Klein R. Methemoglobinemia: pathogenesis, diagnosis, and management. South Med J 2011;104:757-61."}]}},{"id":48,"title":"Oliguria","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"Oliguria is urine production below 0.5 mL/kg/hr for more than 2 hours.","l":0}],"etiology":[{"t":"Decreased renal perfusion.","l":0},{"t":"Primary renal failure.","l":0},{"t":"Increased secretion of vasopressin.","l":0},{"t":"Obstruction or diversion of urine outflow.","l":0}],"typical":[{"t":"During surgical procedures involving large amounts of blood loss or fluid shifts:","l":0},{"t":"Inadequate fluid replacement.","l":1},{"t":"Hypotension.","l":1},{"t":"During laparoscopic surgery.","l":0},{"t":"When vasopressin production is stimulated by anesthesia or surgery:","l":0},{"t":"Surgical stress.","l":1},{"t":"Administration of opioids or other drugs.","l":1},{"t":"Positive pressure ventilation or application of PEEP.","l":1},{"t":"When aortic or renal artery flow is impaired:","l":0},{"t":"Cross-clamping of the aorta (above or below the renal arteries).","l":1},{"t":"Renal artery stenosis.","l":1},{"t":"Patients with CHF or myocardial dysfunction.","l":0},{"t":"Patients with renal failure.","l":0},{"t":"Surgery on or near the bladder or ureters.","l":0},{"t":"Patients who are hypovolemic following bowel preparation.","l":0},{"t":"Patients with trauma or shock.","l":0}],"prevention":[{"t":"Identify patients with diseases that make them at high risk of oliguria:","l":0},{"t":"Postpone elective surgery until the underlying diseases can be treated appropriately.","l":1},{"t":"Monitor urine output and the cardiovascular system carefully if surgery is necessary.","l":1},{"t":"Maintain normal circulating fluid volume and CO during anesthesia and surgery:","l":0},{"t":"Insensible losses and fluid shifts to the “third space” are often underestimated.","l":1}],"manifestations":[{"t":"Urine output below 0.5 mL/kg/hr.","l":0},{"t":"Empty bladder (if visible or palpable).","l":0}],"similar":[{"t":"Failure to drain urine from the bladder:","l":0},{"t":"Obstructed urinary catheter or collecting tubing.","l":1},{"t":"Urine pooling at dome of bladder, e.g. Trendelenburg position.","l":1},{"t":"Disconnection of some part of the urine collecting system from the urinary catheter to the urimeter.","l":1},{"t":"Obstruction or laceration of one or both ureters.","l":0}],"management":[{"t":"If urine output stops acutely:","l":0},{"t":"Look for acute surgical events such as pressure on the bladder or ureters from surgical retraction.","l":1},{"t":"Rule out a mechanical obstruction to urine drainage:","l":1},{"t":"Ensure that the urinary catheter is still in place and patent:","l":2},{"t":"Track the course of the urine collecting system from the patient to the urimeter.","l":3},{"t":"Check for a kink or a disconnection of the tubing.","l":3},{"t":"Irrigate the urinary catheter.","l":2},{"t":"Ask the surgeon to feel the fullness of the bladder and to check for ureteric obstruction if these are in the surgical field.","l":2},{"t":"Evaluate the patient for evidence of hypovolemia or decreased CO (see Event 9, Hypotension):","l":0},{"t":"Check for:","l":1},{"t":"Hypotension or tachycardia.","l":2},{"t":"Low <b>CVP<\/b> or PA pressure.","l":2},{"t":"Increased stroke volume variability or pulse pressure variation.","l":2},{"t":"Review blood loss and fluid administration:","l":1},{"t":"Consider covert blood loss, insensible losses, and third spacing of fluid.","l":2},{"t":"Consider a trial of volume expansion:","l":1},{"t":"Administer <b>crystalloid<\/b> (NS or LR) in <b>250 to 500 mL<\/b> increments.","l":2},{"t":"Administer <b>5%<\/b> albumin in <b>100 to 250 mL<\/b> increments.","l":2},{"t":"Perform TEE or TTE examination to evaluate myocardial filling and function.","l":2},{"t":"If a PA catheter is present, expand fluid volume to achieve a PCWP of 15 to 20 mm Hg:","l":2},{"t":"If CO is low after fluid volume is optimized, administer inotropic support:","l":3},{"t":"Dopamine, <b>3 to 10 μg/kg/min<\/b>.","l":4},{"t":"Dobutamine, <b>3 to 10 μg/kg/min<\/b>.","l":4},{"t":"<b>Epinephrine<\/b>, 3 to 100 ng/kg/min.","l":4},{"t":"If CO is normal or elevated:","l":3},{"t":"Consider low-dose dopamine, <b>2 to 3 µg/kg/min<\/b>.","l":4},{"t":"After optimizing CO, consider diuretic therapy to increase urine output:","l":3},{"t":"<b>Furosemide<\/b> IV, <b>5 to 10 mg<\/b> bolus; <b>10 to 50 mg<\/b> if the patient is already receiving diuretic therapy.","l":4},{"t":"<b>Mannitol<\/b> IV, <b>25 g<\/b> bolus.","l":4},{"t":"Check Hgb and <b>hematocrit<\/b>; transfuse PRBCs if there is significant anemia.","l":1},{"t":"In cases in which risk factors for acute renal failure are present:","l":0},{"t":"Review the patient’s history to evaluate for acute precipitants of renal failure:","l":1},{"t":"Shock or hypotension.","l":2},{"t":"Crush syndrome (myoglobinuria).","l":2},{"t":"Transfusion reaction (hemoglobinuria).","l":2},{"t":"If the case is otherwise routine, the patient is previously healthy, and there have been no episodes of hypotension, sepsis, or other predisposing factors of acute renal failure:","l":0},{"t":"Consider observing the urine output over a longer period of time.","l":1},{"t":"Consider administering <b>furosemide<\/b> IV, <b>5 to 10 mg<\/b> bolus.","l":1},{"t":"If oliguria persists, obtain laboratory data:","l":0},{"t":"Send urine sample for specific gravity:","l":1},{"t":"If urine output and specific gravity are both low, this may be due to the kidney’s inability to concentrate and excrete electrolytes.","l":2},{"t":"Send samples of urine and plasma for concurrent measurement of osmolality and calculate the urine/plasma osmolality ratio:","l":1},{"t":"Less than 1:1 suggests intrinsic renal failure.","l":2},{"t":"1:1 to 2:1 suggests prerenal cause.","l":2},{"t":"More than 2:1 suggests physiologic cause.","l":2},{"t":"Progressive rises in BUN and creatinine are indicative of acute renal failure.","l":2},{"t":"Until acute renal failure has been ruled out:","l":0},{"t":"Restrict K+ intake unless the patient is symptomatic from hypokalemia.","l":1},{"t":"Use caution in administering drugs that are nephrotoxic or that depend on renal excretion:","l":1},{"t":"Pancuronium.","l":2},{"t":"Aminoglycoside antibiotics.","l":2},{"t":"NSAIDs.","l":2},{"t":"Iodinated radio contrast agents.","l":2}],"complications":[{"t":"Pulmonary edema from overhydration.","l":0},{"t":"Excessive reduction in preload from diuretic therapy.","l":0},{"t":"Acute renal failure.","l":0}],"reading":[{"t":"1. Stafford-Smith M, Shaw A, George R, Muir H. The renal system and anesthesia for urologic surgery. In: Barash PG, Cullen BF, Stoelting RK, Calahan M, Stock MC, editors. Clinical anesthesia. 6th ed. Philadelphia: Lippincott Williams &amp; Wilkins; 2009. p. 1346-73."},{"t":"2. Tang IY, Murray PT. Prevention of perioperative acute renal failure: what works? Best Practice Res Clin Anaesthesiol 2004;18:91-111."},{"t":"3. Wilson WC, Aronson S. Oliguria: a sign of renal success or impending renal failure? Anesthesiol Clin North Am 2001;19:841-83."},{"t":"4. Joseph SA, Thakar CV. Perioperative risk assessment, prevention, and treatment of acute kidney injury. Int Anesthesiol Clin 2009;47:89-105."}]}},{"id":49,"title":"Thyroid Storm","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"Thyroid storm is a hypermetabolic state caused by an acute exacerbation of hyperthyroidism characterized by high levels of circulating catecholamines.","l":0}],"etiology":[{"t":"Excessive thyroid hormone activity with end-organ system dysfunction.","l":0},{"t":"Incidence is 10% in hospitalized hyperthyroid patients and mortality rates approach 20%.","l":0}],"typical":[{"t":"Hyperthyroid patients with exaggerated symptoms.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Exophthalmos.","l":2},{"t":"Widened pulse pressure.","l":2},{"t":"Tachycardia or AF.","l":2},{"t":"Thyromegaly.","l":2},{"t":"Common triggers include:","l":0},{"t":"Discontinuing treatment for hyperthyroidism.","l":1},{"t":"Overreplacement of thyroid hormone.","l":1},{"t":"Surgical stress.","l":1},{"t":"Severe infection or illness in a patient with hyperthyroidism.","l":1},{"t":"Trauma.","l":1},{"t":"Preeclampsia.","l":1},{"t":"Recent radioactive iodine treatment.","l":1},{"t":"Surgical manipulation of hypertrophic thyroid gland.","l":1}],"prevention":[{"t":"Continue antihyperthyroid and β-blocker medications up to the day of surgery.","l":0},{"t":"<b>Avoid<\/b> sympathomimetic medications.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"<b>Ketamine<\/b>.","l":2},{"t":"<b>Atropine<\/b>.","l":2},{"t":"Pancuronium.","l":2},{"t":"<b>Ephedrine<\/b>.","l":2},{"t":"Achieve and maintain adequate anesthetic depth before any stimulus, e.g. laryngoscopy.","l":0}],"manifestations":[{"t":"In the awake patient:","l":0},{"t":"Alteration in consciousness.","l":1},{"t":"In any patient:","l":0},{"t":"<b>Fever<\/b>.","l":1},{"t":"Cardiac symptoms.","l":1},{"t":"including:","l":2,"e":1},{"t":"<b>Tachycardia<\/b>.","l":3},{"t":"<b>Hypertension<\/b>.","l":3},{"t":"Widened pulse pressure.","l":3},{"t":"<b>Arrhythmias<\/b>.","l":3},{"t":"Myocardial ischemia.","l":3},{"t":"CHF.","l":3},{"t":"Diarrhea.","l":1},{"t":"<b>Seizures<\/b>.","l":1}],"similar":[{"t":"Pheochromocytoma.","l":0},{"t":"Cocaine/methamphetamine intoxication.","l":0},{"t":"Delirium tremens.","l":0},{"t":"MH (see Event 45, Malignant Hyperthermia).","l":0},{"t":"Neuroleptic malignant syndrome.","l":0}],"management":[{"t":"<i>Thyroid storm requires emergent treatment. Nonemergent procedures should be postponed until hyperthyroid state is controlled.<\/i>","l":0,"n":1},{"t":"Decrease sympathetic nervous system activity:","l":0},{"t":"β<b>-blockade:<\/b>","l":1},{"t":"<b>Esmolol<\/b> IV, <b>250 to 500 µg/kg<\/b> load, then <b>50 to 100 µg/kg/min<\/b> infusion.","l":2},{"t":"Metoprolol IV, <b>1 to 5 mg<\/b>, to effect.","l":2},{"t":"Propranolol PO, <b>10 to 40 mg<\/b> q4-6 h.","l":2},{"t":"<b>Administer IV fluids<\/b>—hyperthyroid patients may be chronically hypovolemic.","l":1},{"t":"Treat hypotension with a direct-acting vasoconstrictor:","l":1},{"t":"<b>Phenylephrine<\/b> IV, <b>50 to 100 µg<\/b> bolus, or infusion to maintain BP.","l":2},{"t":"Reduce T4 to T3 conversion and promote vasomotor stability:","l":1},{"t":"Steroids:","l":2},{"t":"<b>Hydrocortisone<\/b> IV, <b>100 mg<\/b> q8h.","l":3},{"t":"<b>Dexamethasone<\/b> IV, <b>4 mg<\/b> q6h.","l":3},{"t":"Reduce thyroid hormone synthesis:","l":1},{"t":"Propylthiouracil (PTU):","l":2},{"t":"Load PO or PR with <b>1000 mg<\/b>, then <b>200 to 250 mg<\/b> q4h.","l":3},{"t":"Methimazole:","l":2},{"t":"Give <b>30 mg<\/b> PO or PR q6h.","l":3},{"t":"Reduce thyroid hormone release:","l":1},{"t":"Administer one of the following:","l":2},{"t":"Sodium iodide PO or IV, <b>250 mg<\/b> q6h.","l":3},{"t":"Lugol solution PO, 8 drops.","l":3},{"t":"Saturated solution of potassium iodide PO, 6 drops q6h.","l":3},{"t":"Inhibit peripheral T4 to T3 conversion:","l":1},{"t":"Sodium ipodate or iopanoic acid PO, <b>1 g<\/b> daily.","l":2},{"t":"Consider treating patient with <b>dantrolene<\/b> IV if diagnosis is in question (see Event 45, Malignant Hyperthermia):","l":0},{"t":"Administer acetaminophen or NSAIDs to decrease fever.","l":1},{"t":"Obtain labs:","l":1},{"t":"Electrolytes.","l":2},{"t":"Thyroid function studies (thyroid-stimulating hormone [TSH], free and total T4, free and total T3).","l":2},{"t":"Treat arrhythmias (see Event 23, Supraventricular Arrhythmias).","l":1}],"complications":[{"t":"Hypovolemia.","l":0},{"t":"Arrhythmias.","l":0},{"t":"Myocardial ischemia.","l":0},{"t":"CHF.","l":0},{"t":"Seizures.","l":0},{"t":"Renal failure.","l":0},{"t":"Hepatic failure.","l":0}],"reading":[{"t":"1. Schwartz JJ, Akhtar S, Rosenbaum SH. Endocrine function. In: Barash PG, Cullen BF, Stoelting RK, Calahan M, Stock MC, editors. Clinical anesthesia. 6th ed. Philadelphia: Lippincott Williams &amp; Wilkins; 2009. p. 1282."},{"t":"2. Klubo-Gwiezdzinska J, Wartofsky L. Thyroid emergencies. Med Clin N Am 2012;96:385-403."},{"t":"3. Langley RW, Burch HB. Perioperative management of the thyrotoxic patient. Endocrinol Metab Clin North Am 2003;32:519-34."},{"t":"4. Ebert RJ. Dantrolene and thyroid crisis. Anaesthesia 1994;49:924."}]}},{"id":50,"title":"Transfusion Reaction","ch":8,"cat":"Metabolic Events","s":{"definition":[{"t":"A transfusion reaction is an immunologic reaction directed against RBCs or WBCs, platelets, or at least one of the immunoglobulins that have been transfused into a patient.","l":0}],"etiology":[{"t":"Incompatibility between donor and recipient ABO Rh systems.","l":0},{"t":"Incompatibility between donor and recipient minor antibody systems.","l":0},{"t":"Allergic reaction to transfused neutrophils, platelets, or other blood component.","l":0}],"typical":[{"t":"When blood products are transfused:","l":0},{"t":"Physician, nurse, or clerical error in transfusing the unit of blood product to the patient.","l":1},{"t":"In emergency situations requiring rapid transfusion of multiple blood products:","l":1},{"t":"There may be time for a group-specific crossmatch only.","l":2},{"t":"In more urgent situations, uncrossmatched type-specific or O-negative blood may be transfused.","l":2},{"t":"Patients who have previously been exposed to ABO or other antigens.","l":0}],"prevention":[{"t":"<b>Avoid<\/b> transfusion of blood products when possible by using blood conservation techniques:","l":0},{"t":"Autologous blood donation prior to surgery:","l":1},{"t":"Clerical errors may still lead to mismatched transfusion.","l":2},{"t":"Use of an intraoperative blood salvage device during surgery in which substantial loss of uncontaminated blood is likely.","l":1},{"t":"Isovolemic withdrawal of blood from the patient at the beginning of surgery for later transfusion back to the patient.","l":1},{"t":"Ensure positive patient identification and appropriate patient serum sample labeling before sending it to the blood bank for crossmatching.","l":0},{"t":"Request crossmatched blood in advance of surgery when there is a significant likelihood of a blood transfusion, allowing time for a full crossmatch to be performed.","l":0},{"t":"Use an appropriate protocol to cross-check and verify all blood products (donor and autologous products) prior to transfusion:","l":0},{"t":"More than one individual should check the patient’s name and identification number and the identification number of the blood product against the crossmatch report from the blood bank.","l":1},{"t":"Monitor the patient for signs of a transfusion reaction when starting a transfusion.","l":0}],"manifestations":[{"t":"<i>The onset of a major ABO transfusion reaction is usually rapid and frequently severe.<\/i>","l":0},{"t":"<i>Reactions due to reexposure to a minor antigen are frequently mild and may be delayed.<\/i>","l":0},{"t":"In the awake patient, the signs and symptoms may include:","l":0},{"t":"Restlessness or anxiety.","l":1},{"t":"Pain:","l":1},{"t":"Chest.","l":2},{"t":"Flank.","l":2},{"t":"Lumbar.","l":2},{"t":"Tachypnea, tightness of the chest.","l":1},{"t":"Flushing and <b>fever<\/b>.","l":1},{"t":"Development of a <b>rash<\/b> or hives.","l":1},{"t":"Signs may be concealed during anesthesia but may include:","l":0},{"t":"<b>Hypotension<\/b>.","l":1},{"t":"<b>Tachycardia<\/b>.","l":1},{"t":"TRALI:","l":1},{"t":"<b>Bronchospasm<\/b> or reduced pulmonary compliance.","l":2},{"t":"<b>Hypoxemia<\/b>.","l":2},{"t":"Hemoglobinuria.","l":1},{"t":"Bleeding from mucosal membranes or the operative site secondary to the development of DIC.","l":1},{"t":"Hives or <b>edema<\/b> of the mucosal membranes:","l":1},{"t":"May be hidden by the surgical drapes.","l":2}],"similar":[{"t":"Allergic reaction or anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"Bronchospasm from other causes (see Event 29, Bronchospasm).","l":0},{"t":"Transfusion of blood or IV fluids contaminated with bacteria.","l":0},{"t":"Septic shock (see Event 13, The Septic Patient).","l":0},{"t":"Coagulopathy or other causes of DIC.","l":0},{"t":"ARDS.","l":0},{"t":"Pulmonary edema secondary to overtransfusion (see Event 20, Pulmonary Edema).","l":0}],"management":[{"t":"Stop blood product transfusion <b>immediately<\/b> if a transfusion reaction is suspected:","l":0},{"t":"Double check the identity of the recipient and the blood product against the crossmatch report from the blood bank.","l":1},{"t":"Save any blood product containers for further compatibility testing by the blood bank.","l":1},{"t":"Notify the surgeon that a transfusion reaction may be occurring:","l":0},{"t":"Call for help if symptoms are severe:","l":1},{"t":"Management of complications may require more than one person.","l":2},{"t":"Contact blood bank and transfusion hematologist for advice on management and to alert them to possible error in blood preparation processes.","l":2},{"t":"It may be necessary to abort the surgical procedure.","l":1},{"t":"Support the BP with fluids and with vasopressors as needed (see Event 16, Anaphylactic and Anaphylactoid Reactions, and Event 9, Hypotension).","l":0},{"t":"<b>Treat bronchospasm<\/b> (see Event 29, Bronchospasm).","l":0},{"t":"Administer corticosteroids for severe reactions:","l":0},{"t":"<b>Methylprednisolone<\/b> IV, <b>1 mg/kg<\/b>.","l":1},{"t":"If oliguria or frank hemoglobinuria develops (see Event 48, Oliguria):","l":0},{"t":"Insert a urinary catheter, if not already in place.","l":1},{"t":"Administer <b>25% mannitol<\/b> IV, 0.5 g/kg.","l":1},{"t":"Administer low-dose dopamine infusion, <b>2 to 3 μg/kg/min<\/b>, to promote diuresis.","l":1},{"t":"Administer <b>furosemide<\/b> IV, <b>5 to 20 mg<\/b>.","l":1},{"t":"Treat DIC as necessary.","l":0},{"t":"Send sample to the lab for coagulation studies:","l":0},{"t":"Platelet count.","l":1},{"t":"<b>PT<\/b>/<b>aPTT<\/b>.","l":1},{"t":"Fibrinogen.","l":1},{"t":"Fibrin split products.","l":1},{"t":"<b>Avoid<\/b> further transfusion unless absolutely necessary.","l":0},{"t":"Obtain samples of blood and urine and send to the laboratory to establish the diagnosis of a major transfusion reaction:","l":0},{"t":"Demonstration of intravascular hemolysis of RBCs.","l":1},{"t":"Free Hgb in the plasma or urine.","l":1},{"t":"Repeat determination of donor and recipient blood types (on pretransfusion specimen if possible).","l":0},{"t":"Coombs test may assist in diagnosis of delayed antibody-mediated hemolytic reactions but will not help in the acute phase.","l":0}],"complications":[{"t":"The risk of a fatal hemolytic reaction is less than 1:100,000 units of blood product transfused.","l":0},{"t":"DIC.","l":0},{"t":"Hypotension.","l":0},{"t":"Acute renal failure.","l":0},{"t":"Cardiac arrest.","l":0}],"reading":[{"t":"1. Miller RD. Transfusion therapy. In: Ronald D, Miller MD, editors. Mill<b>e<\/b>r's anesthesia. 7th ed. Philadelphia: Churchill Livingstone; 2009. p. 1739-66."},{"t":"2. American Society of Anesthesiologists Task Force on Perioperative Blood Transfusion and Adjuvant Therapies: Practice guidelines for perioperative blood transfusion and adjuvant therapies: an updated report by the American Society of Anesthesiologists Task Force on Perioperative Blood Transfusion and Adjuvant Therapies. Anesthesiology 2006;105:198-208. http://www.ncbi.nlm.nih.gov/pubmed/16810012"},{"t":"3. Sazama K, DeChristopher PJ, Dodd R, et al. Practice parameter for the recognition, management, and prevention of adverse consequences of blood transfusion. College of American Pathologists. Arch Pathol Lab Med 2000;124:61-70."},{"t":"4. Squires JE. Risks of transfusion. South Med J 2011;104:762-9."},{"t":"5. Strobel E. Hemolytic transfusion reactions. Transfus Med Hemother 2008;35:346-53."}]}},{"id":51,"title":"Central Nervous System Injury","ch":9,"cat":"Neurologic Events","s":{"definition":[{"t":"A central nervous system (CNS) injury is any new neurologic deficit presenting after anesthesia that can be localized anatomically to the brain or spinal cord.","l":0}],"etiology":[{"t":"Cerebral ischemia:","l":0},{"t":"Global.","l":1},{"t":"Focal.","l":1},{"t":"Cerebral hemorrhage.","l":0},{"t":"Cerebral embolism.","l":0},{"t":"Increased ICP.","l":0},{"t":"Hypoglycemia.","l":0},{"t":"Direct trauma or surgical injury to CNS.","l":0},{"t":"Injection of neurolytic solutions into the cerebrospinal fluid or into CNS.","l":0},{"t":"Epidural or subdural hematoma.","l":0}],"typical":[{"t":"In patients with diseases predisposing to cerebral ischemia or embolism:","l":0},{"t":"AF.","l":1},{"t":"Endocardial mural thrombus following a MI.","l":1},{"t":"Known cerebrovascular disease:","l":1},{"t":"Previous stroke or transient ischemic attacks (TIAs).","l":2},{"t":"Hypertension.","l":2},{"t":"Smoking history.","l":2},{"t":"Diabetes mellitus.","l":2},{"t":"Dyslipidemia.","l":2},{"t":"Obesity.","l":2},{"t":"Pregnancy-induced hypertension.","l":1},{"t":"Following surgery that carries a high risk of CNS injury:","l":0},{"t":"Carotid endarterectomy or carotid stenting.","l":1},{"t":"Procedures requiring CPB:","l":1},{"t":"Cardiac surgery.","l":2},{"t":"Repair of descending thoracic aneurysm or dissection (impaired blood flow to the spinal cord).","l":2},{"t":"Craniotomy or procedures on or near the spinal cord.","l":1},{"t":"Following an intraoperative catastrophe with hypotension or cardiac arrest.","l":0},{"t":"In patients with raised ICP.","l":0},{"t":"In patients positioned with traction on or compromise of blood flow to the spinal cord:","l":0},{"t":"Procedures in the sitting position.","l":1},{"t":"In patients with anatomic abnormalities of the bony covering of the CNS:","l":0},{"t":"Congenital (Down syndrome, Klippel-Feil syndrome).","l":1},{"t":"Acquired:","l":1},{"t":"Rheumatoid arthritis with cervical instability.","l":2},{"t":"Spinal stenosis.","l":1},{"t":"Following neuraxial anesthesia:","l":0},{"t":"Especially in patients taking anticoagulants and antiplatelet agents.","l":1}],"prevention":[{"t":"Identify patients with conditions that predispose to CNS injury:","l":0},{"t":"Optimize treatment of medical conditions (hypertension, diabetes mellitus).","l":1},{"t":"Monitor neurologic function in patients at risk:","l":1},{"t":"EEG.","l":2},{"t":"Evoked potentials.","l":2},{"t":"Position patients carefully and reassess during long cases:","l":0},{"t":"<b>Avoid<\/b> extreme rotation, flexion, or extension of the cervical spine.","l":1},{"t":"In the sitting position, support patients adequately to prevent traction on the spinal cord or cervical spine.","l":1},{"t":"Maintain an adequate cerebral perfusion pressure:","l":0},{"t":"Measure BP at the level of the brain.","l":1},{"t":"Maintain adequate perfusion pressure of the spinal cord:","l":0},{"t":"Consider placement of a lumbar drain during thoracic aortic surgery.","l":1},{"t":"In patients with raised ICP:","l":0},{"t":"<b>Avoid<\/b> obstruction to cerebral venous outflow.","l":1},{"t":"Maintain the head in an elevated position.","l":1},{"t":"Ventilate the patient to maintain PaCO<sub>2<\/sub> of 30 to 35 mm Hg.","l":1},{"t":"<b>Avoid<\/b> neuraxial regional anesthesia in patients with a bleeding diathesis.","l":0}],"manifestations":[{"t":"Cerebral injuries may be manifested by:","l":0},{"t":"Delayed recovery from anesthesia.","l":1},{"t":"A new focal motor or sensory deficit.","l":1},{"t":"<b>Seizures<\/b>.","l":1},{"t":"Subarachnoid hemorrhage:","l":1},{"t":"Severe headache, stiff neck, or neurologic deficit.","l":2},{"t":"SCI may be manifested by:","l":0},{"t":"Failure of the sensory or motor level to recede after neuraxial block.","l":1},{"t":"Motor and/or sensory deficits.","l":1},{"t":"Cauda equina syndrome:","l":1},{"t":"Loss of bowel and/or bladder function, saddle anesthesia, lower extremity pain and/ or weakness.","l":2}],"similar":[{"t":"Inadequate reversal of neuromuscular blockade (see Event 56, Postoperative Failure to Breathe).","l":0},{"t":"Slow resolution of spinal or epidural block.","l":0},{"t":"Drug administration errors (see Event 63, Drug Administration Error).","l":0},{"t":"Delayed recovery from general anesthesia (see Event 55, Postoperative Alteration in Mental Status).","l":0},{"t":"Transient neurologic deficits secondary to metabolic disorders (see Event 55, Postoperative Alteration in Mental Status, and Event 54, Peripheral Nerve Injury).","l":0},{"t":"Seizure (see Event 57, Seizure).","l":0},{"t":"In patients with prior stroke, there may be a temporary exacerbation of previously compensated stroke symptoms in the recovery period after general anesthesia.","l":0},{"t":"Psychosomatic neurologic deficit.","l":0}],"management":[{"t":"Ensure adequate oxygenation and ventilation (see Event 10, Hypoxemia, and Event 32, Hypercarbia):","l":0},{"t":"Mild hypoxemia can cause obtundation but more often causes restlessness, which may be mistakenly treated with further sedation and result in respiratory depression.","l":1},{"t":"Severe hypoxemia can cause coma.","l":1},{"t":"Hypercarbia generally causes obtundation.","l":1},{"t":"Check that all volatile and IV anesthetics have been discontinued:","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> with high flows into the breathing circuit to enhance elimination of inhalation anesthetics.","l":1},{"t":"Check expired anesthetic gas concentrations.","l":1},{"t":"Stimulate the obtunded patient:","l":0},{"t":"Use verbal or tactile stimuli and gentle suctioning of the upper airway.","l":1},{"t":"Perform a neurologic examination:","l":0},{"t":"Check pupillary diameter and reaction to light:","l":1},{"t":"Anesthetic or ophthalmic drugs may affect pupillary size or response to light.","l":2},{"t":"CNS injury may alter pupillary size or might manifest as a blown pupil.","l":1},{"t":"Check for the presence of corneal and gag reflexes.","l":1},{"t":"Test the response to physical stimulation or deep pain.","l":1},{"t":"Check the limb reflexes and plantar responses (Babinski reflex).","l":1},{"t":"If abnormalities on neurologic examination are evident, inform the surgeon:","l":0},{"t":"Assume cerebral ischemia, infarction, embolism, or hemorrhage has occurred.","l":1},{"t":"Obtain an immediate neurology or neurosurgery consultation.","l":1},{"t":"Obtain a CT scan of the head or spinal cord if the patient can be moved safely:","l":1},{"t":"Hypertension and hypotension should be managed cautiously in consultation with the neurologist.","l":2},{"t":"Other imaging studies may be needed to determine cause of abnormality.","l":1},{"t":"Further therapy depends on the diagnosis but may include:","l":1},{"t":"Thrombolytics or anticoagulation for cerebral thromboembolism.","l":2},{"t":"Surgical decompression of intracranial hemorrhage.","l":2},{"t":"External ventricular drain placement for ICP management.","l":2},{"t":"For acute, nonpenetrating SCI, consider administering high-dose corticosteroids:","l":1},{"t":"<b>Methylprednisolone<\/b> IV, <b>30 mg/kg<\/b>, followed by 5.4 mg/kg/day for 24 or 48 hours.","l":2},{"t":"Use of steroids in acute SCI remains controversial.","l":2},{"t":"Rule out a metabolic etiology:","l":0},{"t":"Send blood and urine samples to the laboratory:","l":1},{"t":"Treat hypoglycemia with <b>50% dextrose<\/b> IV, <b>1 mL/kg<\/b>, or rapid infusion of D5W (see Event 41, Hypoglycemia).","l":2},{"t":"Treat hyperglycemia, DKA, and hyperosmolar nonketotic coma with <b>insulin<\/b> therapy IV and volume resuscitation (see Event 39, Diabetic Ketoacidosis).","l":2},{"t":"Treat hyponatremia (see Event 43, Hyponatremia and Hypo-osmolality).","l":2},{"t":"Treat metabolic acidosis (see Event 46, Metabolic Acidosis).","l":2},{"t":"Send urine or blood for toxicology screens.","l":0},{"t":"Check for drug administration errors (see Event 63, Drug Administration Error).","l":0}],"complications":[{"t":"Hypoxemia, hypercarbia.","l":0},{"t":"Cardiovascular instability.","l":0},{"t":"Inability to maintain or protect the airway.","l":0},{"t":"Aspiration of gastric contents.","l":0},{"t":"Extension of neurologic injury.","l":0},{"t":"Permanent CNS injury.","l":0},{"t":"Metabolic abnormalities, e.g. hyperglycemia.","l":0},{"t":"Seizures.","l":0},{"t":"Death.","l":0}],"reading":[{"t":"1. Stahel PF, VanderHeiden T, Finn MA. Management strategies for acute spinal cord injury: current options and future perspectives. Curr Opin Crit Care 2012;18:651-60."},{"t":"2. Mashour GA, Shanks AM, Kheterpal S. Perioperative stroke and associated mortality after noncardiac, nonneurologic surgery. Anesthesiology 2011;114:1289-96."},{"t":"3. Davis MJ, Menon BK, Baghirzada LB, et al. Anesthetic management and outcome in patients during endovascular therapy for acute stroke. Anesthesiology 2012;116:396-405."}]}},{"id":52,"title":"Local Anesthetic Systemic Toxicity","ch":9,"cat":"Neurologic Events","s":{"definition":[{"t":"Local anesthetic systemic toxicity (LAST) is an adverse systemic effect of high blood concentrations of local anesthetics.","l":0}],"etiology":[{"t":"Direct intravascular injection of local anesthetic solution.","l":0},{"t":"Excessive amount of local anesthetic absorbed into the circulation over a short period.","l":0}],"typical":[{"t":"During regional anesthesia in which large volumes of local anesthetic are administered or when there is significant potential for intravascular injection:","l":0},{"t":"Epidural anesthesia.","l":1},{"t":"Intercostal nerve blocks.","l":1},{"t":"Paravertebral block.","l":1},{"t":"Lumbar plexus block.","l":1},{"t":"Brachial plexus block.","l":1},{"t":"Femoral nerve block.","l":1},{"t":"Paracervical block for gynecologic procedures.","l":1},{"t":"IV regional anesthesia (Bier block).","l":1},{"t":"Pain-related blocks.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Stellate ganglion block.","l":3},{"t":"Lumbar sympathetic block.","l":3},{"t":"Etc.","l":3},{"t":"During IV lidocaine infusion.","l":0},{"t":"During topicalization of the nasopharynx with local anesthetic.","l":0}],"prevention":[{"t":"Create “LAST Treatment Kit” and notify personnel as to its contents and location.","l":0},{"t":"Post a LAST treatment cognitive aid at locations where high volumes and concentrations of local anesthetics are used.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Block areas.","l":2},{"t":"ORs.","l":2},{"t":"PACUs.","l":2},{"t":"Labor and delivery.","l":2},{"t":"Pretreating the patient with a benzodiazepine will increase the seizure threshold but may mask early LAST neurologic symptoms.","l":0},{"t":"Where large volumes of local anesthetic are administered, use standard American Society of Anesthesiologists (ASA) monitoring during and after the block for 30 minutes.","l":0},{"t":"Use the following techniques during regional blockade to minimize risk of intravascular injection:","l":0},{"t":"Ultrasound guidance.","l":1},{"t":"Assess the patient’s response to a test dose of local anesthetic; consider using <b>epinephrine<\/b> (5 µg/mL) as a marker for intravascular injection.","l":1},{"t":"Use an incremental aspiration and injection technique, looking for blood prior to injecting local anesthetic.","l":1},{"t":"Continuously assess patient’s mental, neurologic, and cardiovascular status during and after block.","l":1},{"t":"Any abnormality in patient status should be considered LAST until proven otherwise.","l":1},{"t":"Use the least amount of local anesthetic for desired effect.","l":1},{"t":"<b>Do not<\/b> administer more than the maximum recommended dose.","l":1},{"t":"Monitor the surgeon’s use of local anesthetic for infiltration and in surgical packing.","l":0},{"t":"Use appropriate bolus doses and infusion rates for IV <b>lidocaine<\/b> therapy:","l":0},{"t":"Check blood <b>lidocaine<\/b> levels during prolonged infusions.","l":1}],"manifestations":[{"t":"CNS abnormalities:","l":0},{"t":"Tinnitus.","l":1},{"t":"Circumoral numbness, heavy tongue, metallic taste.","l":1},{"t":"In focusing:","l":1},{"t":"Nystagmus.","l":2},{"t":"Diplopia.","l":2},{"t":"Difficulty.","l":2},{"t":"Mental status change: agitation, confusion, obtundation, coma.","l":1},{"t":"Preseizure motor irritability (twitching), followed by overt <b>seizure<\/b>.","l":1},{"t":"Airway and respiratory abnormalities:","l":0},{"t":"Airway obstruction.","l":1},{"t":"Loss of airway reflexes.","l":1},{"t":"Respiratory depression followed by <b>apnea<\/b>.","l":1},{"t":"Cardiovascular abnormalities:","l":0},{"t":"Initially may be hyperdynamic:","l":1},{"t":"<b>Hypertension<\/b>, <b>tachycardia<\/b>, ventricular <b>arrhythmias<\/b>.","l":2},{"t":"Conduction abnormalities.","l":1},{"t":"e.g.:","l":2,"e":1},{"t":"Increased PR interval.","l":3},{"t":"T wave changes.","l":3},{"t":"<b>Bradycardia<\/b>.","l":3},{"t":"Asystole.","l":3},{"t":"Progressive <b>hypotension<\/b>.","l":1},{"t":"Ventricular <b>arrhythmias<\/b> (VT, VF, torsades de pointes).","l":1},{"t":"Cardiovascular collapse—<b>cardiac arrest<\/b>:","l":1},{"t":"Bupivacaine is the local anesthetic most likely to produce cardiovascular collapse, as the cardiovascular collapse:convulsion dosage ratio is lower for bupivacaine than for other local anesthetics.","l":2},{"t":"Patients with low cardiac ejection fraction are more susceptible to the cardiotoxic effects of local anesthetics.","l":2},{"t":"Acidosis and <b>hypoxemia<\/b> markedly potentiate the cardiotoxicity of bupivacaine.","l":2}],"similar":[{"t":"Hyponatremia (see Event 43, Hyponatremia and Hypo-osmolality).","l":0},{"t":"IV injection of epinephrine.","l":0},{"t":"Hypoxemia (see Event 10, Hypoxemia).","l":0},{"t":"Inadvertent neuromuscular blockade (see Event 63, Drug Medication Error).","l":0},{"t":"High spinal/epidural block (see Event 89, Total Spinal Anesthesia).","l":0},{"t":"Primary seizure disorder (see Event 57, Seizures).","l":0},{"t":"Anaphylaxis (see Event 16, Anaphylactic and Anaphylactoid Reactions).","l":0},{"t":"AFE (see Event 81, Amniotic Fluid Embolism).","l":0},{"t":"Panic reaction.","l":0}],"management":[{"t":"<i>Intra-arterial injection into the carotid or vertebral arteries will result in immediate CNS toxicity, even with small volumes of local anesthetic.<\/i>","l":0,"n":1},{"t":"Stop injection of local anesthetic at the first indication of toxicity.","l":0},{"t":"Call for help, get LAST Treatment Kit, and use the cognitive aid:","l":0},{"t":"Severe cases of LAST may require prolonged treatment.","l":1},{"t":"Patients who are healthy at the initiation of the event usually can be resuscitated.","l":1},{"t":"If respiratory distress, apnea, or loss of consciousness occurs:","l":0},{"t":"Establish bag valve mask airway.","l":1},{"t":"Deliver <b>100%<\/b> O<sub>2<\/sub>, assist ventilation as necessary.","l":1},{"t":"<b>Do not<\/b> hyperventilate the patient, as this decreases the seizure threshold, but ensure adequate ventilation, as hypercapnia and hypoxemia exacerbate toxicity.","l":1},{"t":"Ensure adequate IV access.","l":0},{"t":"If there is preseizure motor irritability or seizure activity:","l":0},{"t":"<b>Administer:<\/b>","l":1},{"t":"<b>Midazolam<\/b> IV, <b>0.5 to 1 mg<\/b> increments.","l":2},{"t":"<b>Propofol<\/b> IV, <b>10 to 20 mg<\/b> (higher doses can further depress cardiac function):","l":2},{"t":"Seizures are often exquisitely sensitive to these drugs.","l":3},{"t":"If seizures occur, cardiovascular collapse may be imminent:","l":0},{"t":"<b>Immediately<\/b> administer <b>lipid emulsion<\/b> (<b>20%<\/b>):","l":1},{"t":"Bolus <b>1.5 mL/kg<\/b> over 1 minute (approximately <b>100 mL<\/b>).","l":2},{"t":"Continuous infusion 0.25-0.5 mL/kg/min until stable.","l":2},{"t":"Can repeat bolus dose if symptoms persist or if progresses to cardiac arrest.","l":2},{"t":"Recommended upper limit: <b>10 mL/kg<\/b> in first 30 minutes.","l":2},{"t":"Continue infusion for at least 10 minutes after attaining circulatory stability.","l":2},{"t":"If seizures <b>do not<\/b> resolve rapidly:","l":0},{"t":"Intubate the patient’s trachea using a short-acting muscle relaxant.","l":1},{"t":"Administer higher doses of <b>midazolam<\/b>.","l":1},{"t":"Administer other anticonvulsant drugs (see Event 57, Seizures):","l":1},{"t":"Phenytoin IV, loading dose, <b>10 mg/kg<\/b>, administered slowly (may cause hypotension).","l":2},{"t":"Levetiracetam IV, <b>1000 mg<\/b>.","l":2},{"t":"Administer muscle relaxant after the airway is protected to minimize peripheral O<sub>2<\/sub> consumption and resultant acidosis during seizures:","l":1},{"t":"Assess ongoing seizure activity using an EEG monitoring device.","l":2},{"t":"Management of Cardiac Instability:","l":0},{"t":"<b>If patient arrests:<\/b>","l":1},{"t":"Prolonged resuscitation efforts may be necessary.","l":2},{"t":"CPR as per BLS/ACLS with these modifications (see Event 94, Cardiac Arrest, and Event 82, Cardiac Arrest in the Parturient).","l":2},{"t":"Medications:","l":2},{"t":"Reduce <b>epinephrine<\/b> doses to &lt;<b>1 µg/kg<\/b> initially; high-dose <b>epinephrine<\/b> (<b>1 mg<\/b>) might impair resuscitation and efficacy of lipid rescue.","l":3},{"t":"Administer <b>lipid emulsion<\/b> (<b>20%<\/b>) as stated previously.","l":3},{"t":"AVOID <b>vasopressin<\/b>, calcium channel blockers, beta blockers, local anesthetics, and higher doses of <b>propofol<\/b>.","l":3},{"t":"Consider CPB for refractory cardiac arrest:","l":3},{"t":"Notify the necessary personnel (cardiac surgeon, perfusionist).","l":4},{"t":"Transferring any patient in cardiac arrest within a hospital is VERY difficult; consider initiation of CPB at the location where the cardiac arrest occurred.","l":4},{"t":"If CPB is not available, alert the nearest facility with CPB capability and arrange transfer of the patient.","l":4},{"t":"Monitor patient in the ICU for at least 12 hours, as LAST can persist or recur after initial treatment.","l":0},{"t":"Obtain a consultation from a neurologist if seizures <b>do not<\/b> resolve.","l":0}],"complications":[{"t":"Cardiovascular collapse.","l":0},{"t":"Hypoxic brain injury.","l":0},{"t":"Status epilepticus.","l":0},{"t":"Recurrence of systemic toxicity.","l":0},{"t":"Aspiration.","l":0},{"t":"Death:","l":0},{"t":"<b>NOTE:<\/b> Infusion of lipid emulsion has proved useful in the treatment of overdose of other lipid-soluble medications (tricyclic antidepressants and sodium channel blockers).","l":1},{"t":"Consider the use of lipid emulsion where overdose is a possibility.","l":1}],"reading":[{"t":"1. Neal JM, Bernards CM, Butterworth 4th JF, et al. ASRA practice advisory on local anesthetic systemic toxicity. Reg Anesth Pain Med 2010;35:152-61."},{"t":"2. Neal JM, Mulroy MF, Weinberg GL. American Society of Regional Anesthesia and Pain medicine checklist for managing local anesthetic systemic toxicity: 2012 version. Reg Anesth Pain Med 2012;37:16-8."},{"t":"3. Neal JM, Hsiung RL, Mulroy MF, et al. ASRA checklist improves trainee performance during a simulated episode of local anesthetic systemic toxicity. Reg Anesth Pain Med 2012;37:8-15."},{"t":"4. Wolfe JW, Butterworth 4th JF. Local anesthetic systemic toxicity: update on mechanisms and treatment. Curr Opin Anesth 2011;24:561-6."},{"t":"5. Mercado P, Weinberg GL. Local anesthetic systemic toxicity: prevention and treatment. Anesthesiol Clin 2011;29:233-42."}]}},{"id":53,"title":"Perioperative Visual Loss","ch":9,"cat":"Neurologic Events","s":{"definition":[{"t":"Perioperative visual loss (POVL) is permanent, partial, or total loss of vision during or after general anesthesia.","l":0}],"etiology":[{"t":"Ischemic optic neuropathy (ION):","l":0},{"t":"Anterior ION.","l":1},{"t":"Posterior ION.","l":1},{"t":"Central retinal artery occlusion (CRAO).","l":0},{"t":"Direct mechanical trauma to optic nerve or compression from retrobulbar hematoma, e.g. during sinus surgery.","l":0},{"t":"Retinal arterial or venous hemorrhages involving the macula or leading to optic nerve atrophy.","l":0},{"t":"Acute closed-angle glaucoma.","l":0},{"t":"Cortical blindness.","l":0},{"t":"Photic injury from laser techniques.","l":0},{"t":"Direct ocular trauma.","l":0}],"typical":[{"t":"Prolonged spine or other surgery in the prone position.","l":0},{"t":"Procedures with substantial blood loss or hypotension.","l":0},{"t":"Procedures performed in the steep Trendelenburg position.","l":0},{"t":"e.g.:","l":1,"e":1},{"t":"Robotic prostatectomy.","l":2},{"t":"Robotic gynecology cases.","l":2},{"t":"Perioperative globe compression.","l":0},{"t":"Procedures requiring CPB.","l":0},{"t":"Retrobulbar or peribulbar block administration.","l":0},{"t":"Male gender.","l":0},{"t":"Obesity.","l":0}],"prevention":[{"t":"<i>Not all of the causative factors in POVL are known, the following are based on current recommendations.<\/i>","l":0},{"t":"Consider “staging” long, complex spine procedures as two or more separate operations.","l":0},{"t":"Maintain head in neutral position:","l":0},{"t":"<b>Avoid<\/b> head below heart position.","l":1},{"t":"<b>Avoid<\/b> use of Wilson positioning frame.","l":1},{"t":"Maintain BP within <b>20%<\/b> of baseline.","l":0},{"t":"<b>Avoid<\/b> deliberate hypotension.","l":0},{"t":"<b>Avoid<\/b> hemodilution:","l":0},{"t":"Balance <b>crystalloid<\/b> administration with <b>colloid<\/b>.","l":1},{"t":"Monitor <b>hematocrit<\/b> at frequent intervals:","l":1},{"t":"Discuss transfusion threshold with patient and surgeon.","l":2},{"t":"<b>Avoid<\/b> direct pressure on globe and reassess at frequent intervals:","l":0},{"t":"Consider using mirrored headrest in prone cases.","l":1},{"t":"<b>Avoid<\/b> prolonged CPB times.","l":0},{"t":"<b>Avoid<\/b> N<sub>2<\/sub>O during and after intraocular sulfur hexafluoride, e.g. surgery for detached retina.","l":0},{"t":"Cover patient’s eyes with appropriate goggles during nonocular laser surgery.","l":0},{"t":"Monitor visual-evoked potentials in procedures that affect the ophthalmic artery or optic nerve.","l":0}],"manifestations":[{"t":"Loss of vision evident after recovery from anesthesia:","l":0},{"t":"Bilateral or unilateral.","l":1},{"t":"Partial or total.","l":1},{"t":"Periorbital <b>edema<\/b> and chemosis.","l":0},{"t":"Decreased ocular movements.","l":0},{"t":"Nystagmus.","l":0},{"t":"Ocular pain.","l":0},{"t":"Abnormal fundoscopic examination.","l":0},{"t":"Loss of or abnormal pupillary reflexes.","l":0},{"t":"CRAO:","l":0},{"t":"Unilateral vision loss or changes in light perception, decreased extraocular movements.","l":1},{"t":"Periorbital <b>edema<\/b> and chemosis.","l":1},{"t":"Cherry-red spot and pale, edematous retina on fundoscopic examination.","l":1},{"t":"Afferent pupillary defect.","l":1},{"t":"Anterior ION:","l":0},{"t":"Painless visual loss.","l":1},{"t":"MRI evidence of enlarged optic nerve.","l":1},{"t":"Afferent pupillary defect.","l":1},{"t":"Posterior ION:","l":0},{"t":"Bilateral visual loss or changes.","l":1},{"t":"Onset may be delayed a few days.","l":1},{"t":"Afferent pupillary defect or nonreactive pupil.","l":1},{"t":"Cortical blindness:","l":0},{"t":"Normal pupillary response and fundoscopic examination results.","l":1},{"t":"Occipital infarction on MRI.","l":1},{"t":"Acute closed-angle glaucoma:","l":0},{"t":"Presents as ocular pain and blurred vision with a red eye.","l":1},{"t":"Raised intraocular pressure (IOP).","l":1},{"t":"Fixed, dilated pupil.","l":1}],"similar":[{"t":"Residual petroleum-based ophthalmic ointment.","l":0},{"t":"Corneal abrasion.","l":0},{"t":"Photophobia.","l":0},{"t":"Residual anticholinergic medication effects.","l":0},{"t":"Glycine toxicity during TURP.","l":0}],"management":[{"t":"Examine the patient and evaluate the severity of visual impairment or ocular trauma:","l":0},{"t":"<b>Check visual fields.<\/b>","l":1},{"t":"Check pupillary responses to light.","l":1},{"t":"If examination is abnormal, obtain urgent ophthalmologic consultation.","l":0},{"t":"<b>Obtain MRI examination.<\/b>","l":0},{"t":"Manage patient with ophthalmology:","l":0},{"t":"In the absence of a treatable cause, visual loss is likely to be permanent.","l":1},{"t":"The ASA Task Force on Perioperative Blindness found that there is no role for antiplatelet agents, steroids, or IOP-lowering agents in the treatment of ION.","l":1},{"t":"The following therapies have been attempted, but efficacy has not been proved.","l":0},{"t":"Head-up position.","l":1},{"t":"Hyperbaric O<sub>2<\/sub>.","l":1},{"t":"Augmenting O<sub>2<\/sub> delivery (optimization of BP, <b>hematocrit<\/b>, and arterial oxygenation).","l":1},{"t":"Acetazolamide to lower IOP.","l":1},{"t":"Diuretics.","l":1},{"t":"Steroids.","l":1},{"t":"Anterior chamber paracentesis.","l":1},{"t":"Ocular massage to lower IOP and possibly dislodge emboli.","l":1},{"t":"Inhaled CO<sub>2<\/sub> in O<sub>2<\/sub> to enhance retinal artery dilation.","l":1},{"t":"Endovascular fibrinolysis of the ophthalmic artery for retinal artery occlusion.","l":1},{"t":"Optic nerve sheath decompression.","l":1}],"complications":[{"t":"Partial or total permanent visual loss.","l":0}],"reading":[{"t":"1. Roth S. Perioperative visual loss: what do we know, what can we do? Br J Anaesth 2009;103(Suppl. 1):i31-40."},{"t":"2. Practice advisory for perioperative visual loss associated with spine surgery: an updated report by the American Society of Anesthesiologists Task Force on Perioperative Visual Loss. Anesthesiology 2012;116:274-85."},{"t":"3. Lee LA, Roth S, Posner KL, et al. The American Society of Anesthesiologists Postoperative Visual Loss Registry: analysis of 93 spine surgery cases with postoperative visual loss. Anesthesiology 2006;105:652."}]}},{"id":54,"title":"Peripheral Nerve Injury","ch":9,"cat":"Neurologic Events","s":{"definition":[{"t":"A peripheral nerve injury is a new neurologic deficit localized anatomically to a site distal to the CNS, which presents after anesthesia.","l":0}],"etiology":[{"t":"Peripheral nerve or nerve plexus injury secondary to:","l":0},{"t":"Direct trauma, e.g. direct injection into a nerve during regional anesthesia.","l":1},{"t":"Ischemia.","l":1},{"t":"Compression.","l":1},{"t":"Stretch.","l":1},{"t":"Metabolic derangements.","l":1},{"t":"Idiopathic causes.","l":1}],"typical":[{"t":"Following surgery in which a support frame, stirrups, straps, or other mechanical device has placed pressure on a peripheral nerve.","l":0},{"t":"Surgical trauma to peripheral nerves.","l":0},{"t":"Direct injection into a nerve during regional anesthesia.","l":0},{"t":"Patients with preexisting dysfunction of peripheral nerves.","l":0},{"t":"Following cardiac surgery:","l":0},{"t":"Thoracic inlet and first rib injury to the brachial plexus from sternal retraction.","l":1},{"t":"Following surgery where the patient is immobilized for prolonged procedures.","l":0},{"t":"Following the use of a limb tourniquet (time and/or pressure related).","l":0},{"t":"After encountering a sustained paresthesia during regional blockade.","l":0},{"t":"Surgical procedures requiring anticoagulation.","l":0},{"t":"Administration of excessive amounts of vasoconstrictor:","l":0},{"t":"During local infiltration around a nerve.","l":1},{"t":"During direct application of a vasoconstrictor to a nerve root.","l":1},{"t":"Surgical procedures involving prolonged hypotension.","l":0}],"prevention":[{"t":"Ensure proper positioning of the patient:","l":0},{"t":"The anesthesiologist is responsible for checking the positioning of the patient by other OR personnel.","l":1},{"t":"<b>Avoid<\/b> pressure on the ulnar nerve at the elbow or abduction of the arm of more than 90 degrees.","l":1},{"t":"<b>Avoid<\/b> pressure on the common peroneal and saphenous nerves by leg holders in the lithotomy position.","l":1},{"t":"Use axillary rolls for patients in the lateral position.","l":1},{"t":"When the patient is in the steep Trendelenburg position:","l":1},{"t":"Place, protect, and secure the arms at the patient’s side or on armboards.","l":2},{"t":"The legs:","l":2},{"t":"Place.","l":3},{"t":"Protect.","l":3},{"t":"Secure.","l":3},{"t":"Position shoulder pads over the acromioclavicular joint.","l":2},{"t":"Carefully pad all areas between the patient and support structures.","l":1},{"t":"Surgical use of nerve stimulation during procedures where peripheral nerves are at risk (e.g. facial nerve during ear, nose, and throat surgery):","l":0},{"t":"<b>Do not<\/b> use neuromuscular blocking agents if nerve stimulators are used.","l":1},{"t":"Periodically relieve pressure on the extremities or the head during anesthesia.","l":0},{"t":"Use the minimum limb tourniquet pressure required to achieve adequate hemostasis:","l":0},{"t":"Communicate tourniquet time to the surgeon every 30 minutes for 1 hour, and document this in the record.","l":1},{"t":"Release the tourniquet for at least 15 minutes after 2 hours.","l":1},{"t":"If further tourniquet time is required by the surgeon, discuss the limits prior to inflating the tourniquet, and document this discussion in the chart.","l":1}],"manifestations":[{"t":"Loss of motor or change in sensory function in the distribution of a peripheral nerve or nerve plexus evident after emergence from general or regional anesthesia:","l":0},{"t":"Symptoms are sometimes delayed and rarely progress over time.","l":1}],"similar":[{"t":"Excessive spread of local anesthetic following regional or local blockade.","l":0},{"t":"Delayed recovery from regional anesthesia.","l":0},{"t":"CNS injury (see Event 51, Central Nervous System Injury).","l":0}],"management":[{"t":"Perform a neurologic examination and treat any factors that might cause further nerve injury:","l":0},{"t":"Prevent further injury to affected nerves, e.g. pressure from cast due to secondary swelling.","l":1},{"t":"Inform the surgeon of the problem.","l":0},{"t":"Obtain a consultation from a neurologist or neurosurgeon about management options.","l":0},{"t":"Discuss the situation with the patient.","l":0},{"t":"Review the patient’s history:","l":0},{"t":"Identify any predisposing factors in the patient’s history:","l":1},{"t":"Diabetes.","l":2},{"t":"Preexisting neurologic disorders.","l":2},{"t":"Hypertension.","l":2},{"t":"Smoking.","l":2},{"t":"Check for possible intraoperative factors:","l":1},{"t":"Tourniquet time(s) during surgery.","l":2},{"t":"Patient positioning and positioning aids.","l":2},{"t":"Intraoperative hypotension.","l":2},{"t":"Impound and inspect any equipment that might have been involved in the injury:","l":1},{"t":"Tourniquets.","l":2},{"t":"Positioning aids.","l":2},{"t":"Operating table.","l":2},{"t":"Peripheral nerve injuries can be classified into one of three categories:","l":0},{"t":"<i>Neurapraxia <\/i>is a temporary injury, frequently caused by compression.","l":1},{"t":"Full and rapid recovery is likely without specific treatment.","l":1},{"t":"<i>Axonotmesis <\/i>is a destructive injury of the axons but not the supporting matrix.","l":1},{"t":"Proximal degeneration of the nerve occurs, with regeneration beginning in 3 weeks.","l":1},{"t":"<i>Neurotmesis <\/i>is a severe crush injury, avulsion, or severing of the nerve.","l":1},{"t":"Prognosis is poor without surgical intervention.","l":1}],"complications":[{"t":"Temporary or permanent loss of function of the distal musculature.","l":0},{"t":"Temporary or permanent sensory changes.","l":0},{"t":"Contractures.","l":0}],"reading":[{"t":"1. Welch MB, Brummett CM, Welch TD, et al. Perioperative peripheral nerve injuries: a retrospective study of 380,680 cases during a 10-year period at a single institution. Anesthesiology 2009;111:490-7."},{"t":"2. American Society of Anesthesiologists Task Force on Prevention of Perioperative Peripheral Neuropathies. Practice advisory for the prevention of perioperative peripheral neuropathies: an updated report by the American Society of Anesthesiologists Task Force on prevention of perioperative peripheral neuropathies. Anesthesiology 2011;114:741-54."},{"t":"3. Barrington MJ, Snyder GL. Neurologic complications of regional anesthesia. Curr Opin Anaesthesiol 2011;24:554-60."},{"t":"4. Cheney FW, Domino KB, Caplan RA, Posner KL. Nerve injury associated with anesthesia: a closed claims analysis. Anesthesiology 1999;90:1062-9."}]}},{"id":55,"title":"Postoperative Alteration in Mental Status","ch":9,"cat":"Neurologic Events","s":{"definition":[{"t":"Postoperative changes in mental status include failure to recover consciousness, responsiveness, or baseline mental status within the expected time frame following general anesthesia.","l":0}],"etiology":[{"t":"Absolute or relative overdose of drugs that impair mental status:","l":0},{"t":"Volatile anesthetics.","l":1},{"t":"Benzodiazepines.","l":1},{"t":"Other anesthetic adjuvants (ketamine, dexmedetomidine).","l":1},{"t":"Opioids.","l":1},{"t":"Nonanesthetic CNS-active medications:","l":1},{"t":"Psychiatric medications.","l":2},{"t":"Antihypertensive medications (clonidine).","l":2},{"t":"Severe pain.","l":0},{"t":"Urinary retention.","l":0},{"t":"Metabolic abnormalities affecting the level of consciousness:","l":0},{"t":"Hypoxemia or hypercarbia.","l":1},{"t":"Endocrinopathies:","l":1},{"t":"Thyroid disorders, adrenal disorders, diabetes.","l":2},{"t":"Electrolyte disorders (Na+, K+, Ca++, Mg++).","l":1},{"t":"Endogenous toxins:","l":1},{"t":"Uremia, porphyria, hepatic encephalopathy.","l":2},{"t":"Neurologic abnormalities affecting the level of consciousness:","l":0},{"t":"Cerebral injury due to:","l":1},{"t":"Ischemia.","l":2},{"t":"Hemorrhage.","l":2},{"t":"Embolism.","l":2},{"t":"Tumor.","l":2},{"t":"Edema.","l":2},{"t":"Ictal and postictal states.","l":1},{"t":"CNS infection.","l":1},{"t":"Hypothermia.","l":0},{"t":"Recent use of or withdrawal from drugs (alcohol, prescribed or illicit drugs).","l":0},{"t":"Overwhelming systemic infection/sepsis.","l":0},{"t":"Psychiatric disorders, e.g. posttraumatic stress disorder.","l":0},{"t":"Carbon monoxide in the anesthesia circuit.","l":0}],"typical":[{"t":"Following shorter than anticipated surgical procedure.","l":0},{"t":"Following cardiac, TURP, and major vascular surgery.","l":0},{"t":"In patients with compromised renal or hepatic function.","l":0},{"t":"Following major trauma, massive fluid resuscitation, or metabolic acidosis.","l":0},{"t":"In neonates and the elderly.","l":0},{"t":"In patients with preexisting CNS disorders:","l":0},{"t":"Diminished cognitive reserve, such as dementia or Parkinson disease.","l":1},{"t":"Psychiatric conditions.","l":1},{"t":"Substance abuse problems including alcoholism.","l":1},{"t":"Seizure disorders.","l":1}],"prevention":[{"t":"Identify and treat patients with metabolic or neurologic abnormalities that might contribute to impaired level of consciousness.","l":0},{"t":"<b>Avoid<\/b> excessive preoperative sedation, especially benzodiazepines in elderly or compromised patients.","l":0},{"t":"Titrate anesthetics, opioids, hypnotics, and anticholinergics to clinical effect or a processed EEG-guided anesthetic.","l":0},{"t":"Monitor blood sugar during anesthesia when clinically indicated.","l":0},{"t":"Prevent buildup of carbon monoxide in the anesthesia circuit, e.g. turn off fresh gas flow if the anesthesia workstation will not be used for a long period of time.","l":0}],"manifestations":[{"t":"Failure to recover consciousness, alertness, or appropriate responses to stimuli following general anesthesia.","l":0},{"t":"Confusion:","l":0},{"t":"Agitation, restlessness, incoherence.","l":1},{"t":"Disorientation.","l":1},{"t":"Inability to follow commands or unintentional, uncooperative behavior.","l":1},{"t":"PTSD symptoms, e.g. flashbacks.","l":1},{"t":"Focal neurologic signs.","l":0}],"similar":[{"t":"Residual neuromuscular blockade (see Event 56, Postoperative Failure to Breathe).","l":0},{"t":"Drug withdrawal syndromes.","l":0},{"t":"Drug administration errors (see Event 63, Drug Administration Error).","l":0},{"t":"Stroke.","l":0},{"t":"Psychiatric disorders.","l":0},{"t":"Nonconvulsive status epilepticus.","l":0},{"t":"Carbon monoxide in the anesthesia circuit (see Event 58, Carbon Monoxide in the Anesthesia Circuit).","l":0}],"management":[{"t":"Ensure adequate oxygenation and ventilation (see Event 10, Hypoxemia and Event 32, Hypercarbia):","l":0},{"t":"Mild hypoxemia can cause obtundation or restlessness, which can be mistakenly treated with further sedation.","l":1},{"t":"Severe hypoxemia can cause coma.","l":1},{"t":"Hypercarbia generally causes obtundation.","l":1},{"t":"Check that all volatile and IV anesthetics have been discontinued:","l":0},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub> with high flows into the breathing circuit to enhance elimination of inhalation anesthetics.","l":1},{"t":"Check expired anesthetic gas concentrations.","l":1},{"t":"Stimulate the obtunded patient:","l":0},{"t":"Use verbal or tactile stimuli and gentle suctioning of the upper airway.","l":1},{"t":"Restrain the combative patient to prevent injury to the patient and staff:","l":0},{"t":"Call for help to safely restrain the patient.","l":1},{"t":"Mechanical or chemical restraints should only be used to protect the patient or the staff while determining a definitive diagnosis.","l":1},{"t":"Reassure the patient.","l":1},{"t":"Carefully place physical restraints.","l":1},{"t":"Administer a small dose of opioid if severe pain suspected.","l":1},{"t":"Consider using benzodiazepines, haloperidol, or dexmedetomidine as pharmacologic restraint.","l":1},{"t":"Rule out a metabolic etiology:","l":0},{"t":"Check glucose, electrolytes, and <b>ABG<\/b>:","l":1},{"t":"Treat hypoglycemia with <b>50% dextrose<\/b> IV, <b>1 mL/kg<\/b> or rapid infusion of D5W (see Event 41, Hypoglycemia).","l":2},{"t":"Treat hyperglycemia, DKA, and hyperosmolar nonketotic coma with <b>insulin<\/b> therapy IV and volume resuscitation (see Event 39, Diabetic Ketoacidosis).","l":2},{"t":"Treat hyponatremia (see Event 43, Hyponatremia and Hypo-osmolality).","l":2},{"t":"Treat metabolic acidosis (see Event 46, Metabolic Acidosis).","l":2},{"t":"Order urine or blood toxicology screen.","l":0},{"t":"Check for medication administration errors (see Event 63, Drug Administration Error).","l":0},{"t":"Consider reversing the effects of specific drugs:","l":0},{"t":"Opioids:","l":1},{"t":"<b>Naloxone<\/b> IV, <b>20 to 40 µg<\/b> increments, titrated to effect.","l":2},{"t":"Benzodiazepines:","l":1},{"t":"<b>Flumazenil<\/b> IV, <b>0.2 mg<\/b> over 15 seconds, repeat q1min until effective (maximum dose is <b>1 mg<\/b> in 5 minutes, <b>3 mg<\/b> in 1 hour).","l":2},{"t":"Perform a neurologic examination:","l":0},{"t":"Check pupillary diameter and reaction to light:","l":1},{"t":"Anesthetic or ophthalmic drugs may affect pupillary size or response to light.","l":2},{"t":"CNS injury may alter pupillary size or might manifest as a blown pupil (see Event 51, Central Nervous System Injury).","l":2},{"t":"Check for the presence of corneal and gag reflexes.","l":1},{"t":"Test the response to physical stimulation or deep pain.","l":1},{"t":"Check the limb reflexes and plantar responses (Babinski reflex).","l":1},{"t":"If the neurologic examination suggests a focal abnormality, obtain urgent neurology or neurosurgery consultation and CT scan (see Event 51, Central Nervous System Injury).","l":1},{"t":"Inform the surgeon of the concern.","l":0},{"t":"If the confused or agitated patient does not recover baseline mental status:","l":0},{"t":"Keep the environment as quiet as possible.","l":1},{"t":"Reassure the patient with verbal contact.","l":1},{"t":"Repeatedly orient the patient to time, place, and person.","l":1},{"t":"Keep the patient warm and comfortable.","l":1},{"t":"Obtain neurology and/or psychiatry consultation for continuing care.","l":1}],"complications":[{"t":"Prolonged endotracheal intubation.","l":0},{"t":"Self-inflicted injury.","l":0},{"t":"Prolonged hospital stay.","l":0}],"reading":[{"t":"1. Bryson GL, Wyand A. Evidence-based clinical update: general anesthesia and the risk of delirium and postoperative cognitive dysfunction. Can J Anaesth 2006;53:669-77."},{"t":"2. Radtke FM, Franck M, Hagemann L, et al. Risk factors for inadequate emergence after anesthesia: emergence delirium and hypoactive emergence. Minerva Anesthesiol 2010;76:394-403."},{"t":"3. Lepousé C, Lautner CA, Liu L, Gomis P, Leon A. Emergence delirium in adults in the post-anaesthesia care unit. Br J Anaesth 2006;96:747-53."},{"t":"4. Sato M, Shirakami G, Tazuke-Nishimura M, et al. Effect of single-dose dexmedetomidine on emergence agitation and recovery profiles after sevoflurane anesthesia in pediatric ambulatory surgery. J Anesth 2010;24:675-82."},{"t":"5. Rudolph JL, Marcantonio ER. Review articles: postoperative delirium: acute change with long-term implications. Anesth Analg 2011;112:1202-11."}]}},{"id":56,"title":"Postoperative Failure to Breathe","ch":9,"cat":"Neurologic Events","s":{"definition":[{"t":"Postoperative failure to breathe is inadequate ventilation or apnea following anesthesia.","l":0}],"etiology":[{"t":"Decreased ventilatory drive:","l":0},{"t":"Opioids.","l":1},{"t":"Benzodiazepines.","l":1},{"t":"Residual sedative hypnotic agents.","l":1},{"t":"Volatile anesthetics.","l":1},{"t":"Residual neuromuscular blockade:","l":0},{"t":"Overdosage.","l":1},{"t":"Impaired metabolism/clearance of drug.","l":1},{"t":"Administration of drugs that potentiate neuromuscular blockade.","l":1},{"t":"Inadequate pharmacologic reversal.","l":1},{"t":"CNS impairment or injury:","l":0},{"t":"Hypoxemia.","l":1},{"t":"Metabolic abnormality.","l":1},{"t":"Structural abnormality.","l":1},{"t":"Neuromuscular disorders.","l":0}],"typical":[{"t":"Altered respiratory drive:","l":0},{"t":"Patients receiving opioids, benzodiazepines.","l":1},{"t":"Hyperventilated patients.","l":1},{"t":"Patients with sleep apnea or COPD.","l":1},{"t":"Patients status post carotid endarterectomy.","l":1},{"t":"Neonates and elderly patients.","l":1},{"t":"Normal respiratory drive with impaired ventilatory ability:","l":0},{"t":"Inadequate reversal of neuromuscular blocking agent:","l":1},{"t":"Shorter than anticipated surgical procedure.","l":2},{"t":"Recent dosing of neuromuscular blocking agent.","l":2},{"t":"Compromised drug metabolism/clearance.","l":2},{"t":"Patients receiving aminoglycoside antibiotics.","l":2},{"t":"Parturients receiving MgSO<sub>4<\/sub>.","l":2},{"t":"Metabolic acidosis.","l":2},{"t":"Upper airway obstruction, edema, or hematoma.","l":1},{"t":"Hypothermia.","l":0},{"t":"Syringe or ampule swap.","l":0},{"t":"Following major trauma or massive fluid resuscitation.","l":0}],"prevention":[{"t":"Identify patients with metabolic or neurologic abnormalities that might contribute to postoperative failure to breathe.","l":0},{"t":"Preoperative optimization of respiratory status of patients with chronic lung disease.","l":0},{"t":"Identify patients with undiagnosed OSA (using STOP-BANG screening questionnaire).","l":0},{"t":"<b>Avoid<\/b> profound hypocarbia.","l":0},{"t":"Carefully administer supplemental O<sub>2<\/sub> and opioids in patients status post carotid endarterectomy.","l":0},{"t":"Titrate the dose of opioids to the patient’s RR and ET CO<sub>2<\/sub> levels near the end of general anesthesia.","l":0},{"t":"Strict attention to labeling and identification of medications.","l":0},{"t":"Use the minimum necessary dose of neuromuscular blocking agents as determined by peripheral nerve stimulation.","l":0},{"t":"<b>Avoid<\/b> hypothermia.","l":0}],"manifestations":[{"t":"Inadequate or absent efforts to breathe.","l":0},{"t":"Apparent decreased level of consciousness:","l":0},{"t":"Level of consciousness may be normal if there is residual neuromuscular blockade.","l":1},{"t":"Signs of residual neuromuscular blockade:","l":1},{"t":"Nonsustained tetanus or fade in the train-of-four (nondepolarizing relaxants).","l":2},{"t":"Inability to sustain headlift.","l":2},{"t":"Lack of muscle strength or coordination.","l":2},{"t":"Maximum inspiratory force less than 25 to 30 cm H<sub>2<\/sub>O.","l":2},{"t":"<b>Hypertension<\/b> and <b>tachycardia<\/b> (awake but paralyzed).","l":2},{"t":"Low RR and miosis after opioid administration.","l":0},{"t":"Signs of <b>hypercarbia<\/b> or <b>hypoxemia<\/b> are late manifestations:","l":0},{"t":"<b>Tachycardia<\/b>.","l":1},{"t":"<b>Hypertension<\/b>.","l":1},{"t":"<b>Bradycardia<\/b>.","l":1},{"t":"Ventricular ectopy.","l":1}],"similar":[{"t":"Failure to awaken (see Event 55, Postoperative Alteration in Mental Status).","l":0}],"management":[{"t":"<i>At the end of anesthesia, if you are concerned about the patient’s ability to ventilate and to protect their airway, do not extubate the trachea.<\/i>","l":0,"n":1},{"t":"Ensure adequate oxygenation and ventilation:","l":0},{"t":"Maintain normocarbia or mild hypercarbia.","l":1},{"t":"Ensure that oxygenation is maintained and that significant tachycardia or hypertension does not develop.","l":1},{"t":"Check that all anesthetics, both volatile and IV, have been discontinued:","l":0},{"t":"Increase fresh gas flow into the anesthesia breathing circuit to enhance elimination of inhalation anesthetics.","l":1},{"t":"Check expired anesthetic gas concentrations.","l":1},{"t":"<b>Stimulate the patient:<\/b>","l":0},{"t":"Use verbal or gentle tactile stimuli.","l":1},{"t":"<b>Check neuromuscular function:<\/b>","l":0},{"t":"If residual neuromuscular blockade is present:","l":1},{"t":"Administer additional <b>neostigmine<\/b> to a maximum dose of <b>70 µg/kg<\/b> (max dose is <b>5 mg<\/b>).","l":2},{"t":"Consider use of <b>sugammadex<\/b> if available.","l":2},{"t":"If neuromuscular blockade persists after a full dose of reversal agents have been administered:","l":1},{"t":"Reassure the patient that weakness is temporary.","l":2},{"t":"Sedate the patient until there is recovery of neuromuscular function.","l":2},{"t":"Extubate the trachea only when there is full recovery of neuromuscular function.","l":2},{"t":"Consider any synergistic effects of neuromuscular blocking agents and other drugs, including calcium channel blockers, aminoglycoside antibiotics, or bacitracin (often included in irrigation solutions).","l":2},{"t":"Review the doses of medications administered and check for syringe or ampule swap (see Event 63, Drug Administration Error):","l":0},{"t":"Opioids.","l":1},{"t":"Neuromuscular blocking agents.","l":1},{"t":"Hypnotics.","l":1},{"t":"Anticholinergics.","l":1},{"t":"Epidural or intrathecal administration of local anesthetics and opioids.","l":1},{"t":"Consider reversing the effects of specific drugs if neuromuscular blockade is not present:","l":0},{"t":"Opioids:","l":1},{"t":"<b>Naloxone<\/b> IV, <b>20 to 40 µg<\/b> increments, titrated to effect:","l":2},{"t":"Monitor for excessive sympathetic response and pulmonary edema.","l":3},{"t":"Benzodiazepines:","l":1},{"t":"<b>Flumazenil<\/b> IV, <b>0.2 mg<\/b> over 15 seconds, repeat q1min until effective (maximum dose is <b>1 mg<\/b> in 5 minutes, <b>3 mg<\/b> in 1 hour).","l":2},{"t":"Inform the surgeon of the problem.","l":0},{"t":"Send blood samples to the laboratory for:","l":0},{"t":"<b>ABG<\/b> analysis.","l":1},{"t":"Serum electrolyte and Mg2+ levels.","l":1},{"t":"Toxicology screen.","l":1},{"t":"Conduct a neurologic examination to exclude CNS injury as the cause of failure to breathe (see Event 55, Postoperative Alteration in Mental Status, and Event 51, Central Nervous System Injury).","l":0},{"t":"If failure to breathe persists:","l":0},{"t":"Arrange to transfer the patient to PACU or ICU for mechanical ventilation and further evaluation.","l":1},{"t":"Obtain a consultation from a neurologist.","l":1},{"t":"Follow the patient postoperatively for underlying abnormalities:","l":1},{"t":"Plasma cholinesterase deficiency.","l":2},{"t":"Myasthenia gravis or myasthenic syndrome.","l":2},{"t":"Abnormalities of metabolism.","l":2}],"complications":[{"t":"Hypercarbia.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Inability to reintubate the trachea.","l":0},{"t":"Postoperative pain on reversal of opioids.","l":0},{"t":"Hypertension and tachycardia on reversal of opioids.","l":0}],"reading":[{"t":"1. American Society of Anesthesiologists Task Force on Neuraxial Opioids, Horlocker TT, Burton AW, et al. Practice guidelines for the prevention, detection, and management of respiratory depression associated with neuraxial opioid administration. Anesthesiology 2009;110:218-30."},{"t":"2. Chung F, Yegneswaran B, Liao P, et al. STOP questionnaire: a tool to screen patients for obstructive sleep apnea. Anesthesiology 2008;108:812-21."},{"t":"3. Thilen SR, Hansen BE, Ramaiah R, et al. Intraoperative neuromuscular monitoring site and residual paralysis. Anesthesiology 2012;117:964-72."}]}},{"id":57,"title":"Seizures","ch":9,"cat":"Neurologic Events","s":{"definition":[{"t":"Seizures are paroxysmal discharges from abnormally excited neuronal foci, which can be classified as convulsive, nonconvulsive, or refractory status epilepticus.","l":0},{"t":"Specific subtypes include:","l":0},{"t":"Tonic-clonic, generalized seizures (grand mal).","l":1},{"t":"Partial focal motor seizures (Jacksonian).","l":1},{"t":"Temporal lobe seizures (complex partial).","l":1},{"t":"Absence seizures (petit mal).","l":1}],"etiology":[{"t":"CNS injury.","l":0},{"t":"Hypoxemia.","l":0},{"t":"Drugs, including local anesthetics and alcohol.","l":0},{"t":"Metabolic abnormality.","l":0},{"t":"Infection.","l":0},{"t":"Pyrexia (especially in children).","l":0},{"t":"Noncompliance with antiepileptic drug treatment.","l":0},{"t":"Idiopathic causes.","l":0}],"typical":[{"t":"Patients with local anesthetic toxicity.","l":0},{"t":"Patients with preexisting seizure disorders.","l":0},{"t":"Parturients with eclampsia.","l":0},{"t":"Patients with acute head trauma or raised ICP.","l":0},{"t":"Patients with brain tumors.","l":0},{"t":"Patients who are hypoxemic.","l":0},{"t":"Patients undergoing TURP surgery.","l":0},{"t":"Hypoglycemia in patients who receive insulin.","l":0},{"t":"Patients who are taking illicit drugs.","l":0},{"t":"Acute alcohol toxicity or withdrawal.","l":0},{"t":"Patients who are post hemodialysis.","l":0},{"t":"Patients with metabolic disorders.","l":0},{"t":"Children with fevers.","l":0}],"prevention":[{"t":"Identify patients with preexisting seizure disorders:","l":0},{"t":"Question patients about drug and alcohol use.","l":1},{"t":"Continue preoperative antiepileptic drugs and confirm therapeutic blood levels.","l":1},{"t":"<b>Avoid<\/b> hyperventilation/hypocapnia.","l":1},{"t":"Discuss prophylactic antiepileptic drug with neurosurgeons.","l":1},{"t":"Administer benzodiazepines as a preoperative medication or in patients at risk of drug withdrawal:","l":1},{"t":"Adhere to institutional acute withdrawal protocols.","l":2},{"t":"Serially monitor glucose levels.","l":1},{"t":"<b>Avoid<\/b> local anesthetic toxicity.","l":0},{"t":"Treat preeclamptic patients with MgSO<sub>4<\/sub>.","l":0},{"t":"Monitor for and treat hyponatremia during TURP surgery.","l":0}],"manifestations":[{"t":"Awake patients may report an aura prior to a <b>seizure<\/b>.","l":0},{"t":"Generalized <b>seizures<\/b>:","l":0},{"t":"Uncontrolled tonic-clonic motor activity involving most or all extremities.","l":1},{"t":"Loss of consciousness.","l":1},{"t":"Loss of bowel or bladder control.","l":1},{"t":"Forced gaze preference.","l":1},{"t":"Airway obstruction.","l":1},{"t":"Partial focal motor <b>seizures<\/b>:","l":0},{"t":"Tonic-clonic motor activity restricted to all or part of an isolated limb.","l":1},{"t":"May progress to full generalized <b>seizures<\/b>.","l":1},{"t":"Temporal lobe <b>seizures<\/b>:","l":0},{"t":"Bizarre behavior, motions, or utterances.","l":1},{"t":"Absence <b>seizures<\/b>:","l":0},{"t":"Blank stare, unresponsiveness.","l":1},{"t":"Following <b>seizures<\/b> there is often a postictal state of deep “sleep” or depressed responsiveness:","l":0},{"t":"The patient may be slow to awaken from general anesthesia.","l":1}],"similar":[{"t":"Cardiac arrest may present as “seizure” or seizure-like activity.","l":0},{"t":"Nonepileptic myoclonus (etomidate administration).","l":0},{"t":"Muscle fasciculations secondary to succinylcholine.","l":0},{"t":"Opioid-induced chest wall rigidity.","l":0},{"t":"Partial neuromuscular blockade in the awake patient:","l":0},{"t":"Incomplete reversal of neuromuscular blockade.","l":1},{"t":"Syringe or ampule swap (see Event 63, Drug Administration Error).","l":0},{"t":"Light anesthesia.","l":0},{"t":"Loss of consciousness for other reasons.","l":0},{"t":"Panic reaction or psychogenic nonepileptic seizures.","l":0},{"t":"Shivering.","l":0}],"management":[{"t":"<i>Primary goal is the cessation of both clinical and electroencephalographic seizure activity.<\/i>","l":0,"n":1},{"t":"Prevent traumatic injury to the patient.","l":0},{"t":"If respiratory distress, apnea, or loss of consciousness occurs:","l":0},{"t":"Establish mask airway.","l":1},{"t":"Administer <b>100%<\/b> O<sub>2<\/sub>, assist ventilation as necessary:","l":1},{"t":"<b>Do not<\/b> hyperventilate the patient; hypocarbia decreases the seizure threshold.","l":2},{"t":"Ensure adequate IV access.","l":0},{"t":"Administer an antiepileptic drug:","l":0},{"t":"<b>Propofol<\/b> IV, <b>10 to 20 mg<\/b>.","l":1},{"t":"<b>Midazolam<\/b> IV, <b>0.5 to 2 mg<\/b> increments, intranasal <b>0.2 mg/kg<\/b>.","l":1},{"t":"Lorazepam IV, <b>1 to 4 mg<\/b> increments.","l":1},{"t":"<b>Avoid<\/b> overdoses of antiepileptic drugs as they may cause hypotension and contribute to depressed mental status in the postictal state:","l":1},{"t":"Seizures caused by intrinsic disease of the CNS may not respond to small doses of these drugs, but seizures due to other etiologies are often exquisitely sensitive to them.","l":2},{"t":"If there is difficulty ventilating the patient:","l":0},{"t":"Administer a short-acting muscle relaxant and intubate the trachea.","l":1},{"t":"Assess ongoing seizure activity using EEG.","l":1},{"t":"May require long-acting muscle relaxation to allow adequate ventilation and <b>avoid<\/b> or control complications of excessive muscular activity.","l":1},{"t":"If seizures <b>do not<\/b> resolve rapidly, administer additional antiepileptic drugs:","l":0},{"t":"Levetiracetam IV, <b>1000 to 2000 mg<\/b>.","l":1},{"t":"Phenytoin IV, loading dose <b>10 mg/kg<\/b> administered slowly (may cause hypotension).","l":1},{"t":"Phenobarbital IV, <b>1 to 2 mg/kg<\/b>.","l":1},{"t":"<b>Propofol<\/b> IV infusion, <b>30 to 200 µg/kg/min<\/b>.","l":1},{"t":"Volatile anesthetic agents.","l":1},{"t":"Treat cardiovascular complications following ACLS protocols.","l":0},{"t":"Obtain consultation from a neurologist.","l":0},{"t":"Administer MgSO<sub>4<\/sub> to parturients with eclampsia (see Event 88, Preeclampsia and Eclampsia).","l":0},{"t":"Investigate underlying etiologies if not already established:","l":0},{"t":"Check blood glucose.","l":1},{"t":"Send samples to laboratory for serum Na+ and osmolality (particularly during or after TURP surgery), toxicology screen, serum antiepileptic drug levels.","l":1},{"t":"Examine the patient for signs of infection, occult head trauma, drug reaction, or new intracranial disaster.","l":1},{"t":"If seizures are secondary to an acute head injury or increased ICP:","l":0},{"t":"Hyperventilate to reduce the arterial PaCO<sub>2<\/sub> to 30 to 35 mm Hg.","l":1},{"t":"Administer <b>mannitol<\/b> IV, 1 g/kg rapidly.","l":1},{"t":"Administer <b>dexamethasone<\/b> IV, <b>10 to 20 mg<\/b> bolus.","l":1},{"t":"Elevate the head of the patient’s bed 30 degrees if possible to ensure adequate venous drainage.","l":1}],"complications":[{"t":"Hypoxemia.","l":0},{"t":"Aspiration of gastric contents.","l":0},{"t":"Cardiac arrhythmias.","l":0},{"t":"Electrolyte and glucose abnormalities.","l":0},{"t":"Rhabdomyolysis.","l":0},{"t":"Pulmonary edema.","l":0},{"t":"Neurologic injury from:","l":0},{"t":"Refractory status epilepticus.","l":1},{"t":"Prolonged hypoxemia during an uncontrolled seizure.","l":1},{"t":"Too rapid reversal of hyponatremia with hypertonic saline.","l":1},{"t":"Impaired cerebral autoregulation.","l":1},{"t":"Hypotension and respiratory depression from anticonvulsant therapy.","l":0},{"t":"Side effects of:","l":0},{"t":"MgSO<sub>4<\/sub> therapy.","l":1},{"t":"Including neuromuscular and CNS depression.","l":1}],"reading":[{"t":"1. Brophy GM, Bell R, Claassen J, et al. Guidelines for the evaluation and management of status epilepticus. Neurocrit Care 2012;17:3-23."},{"t":"2. Rossetti AO, Lowenstein DH. Management of refractory status epilepticus in adults: still more questions than answers. Lancet Neurol 2011;10:922-30."},{"t":"3. Turner C. The management of tonic-clonic status epilepticus (TCSE). Curr Anaesth Crit Care 2007;18:86-93."}]}},{"id":58,"title":"Carbon Monoxide in the Anesthesia Circuit","ch":10,"cat":"Equipment Events","s":{"definition":[{"t":"Carbon monoxide present in the anesthesia breathing circuit.","l":0}],"etiology":[{"t":"Carbon monoxide is produced by degradation of volatile anesthetic agents in the presence of desiccated CO<sub>2<\/sub> absorbents.","l":0},{"t":"The amount of carbon monoxide produced depends upon the degree of desiccation, temperature in the breathing circuit, volatile anesthetic concentration, and fresh gas flow:","l":0},{"t":"Production is greatest with absorbents containing strong bases, e.g. KOH &gt; NaOH.","l":1},{"t":"Production is greatest with desflurane and isoflurane but has also been reported with sevoflurane.","l":1},{"t":"CO<sub>2<\/sub> absorbent desiccation is typically caused by fresh gas flow into circle system of anesthesia workstation allowing CO<sub>2<\/sub> absorbent drying, e.g. fresh gas flow left on overnight.","l":0}],"typical":[{"t":"After period of anesthesia workstation nonuse, e.g. over a weekend.","l":0}],"prevention":[{"t":"Use CO<sub>2<\/sub> absorbents whose composition does not facilitate significant volatile anesthetic degradation.","l":0},{"t":"Awareness of the potential for carbon monoxide production if a machine has not been used for some time.","l":0},{"t":"Develop institutional, hospital, and/or departmental policies regarding steps to prevent desiccation of the CO<sub>2<\/sub> absorbent, such as:","l":0},{"t":"Turn off all gas flow when the workstation is not in use.","l":1},{"t":"Change the absorbent regularly.","l":1},{"t":"Change absorbent whenever the color change indicates exhaustion.","l":1},{"t":"Change all absorbent:","l":
