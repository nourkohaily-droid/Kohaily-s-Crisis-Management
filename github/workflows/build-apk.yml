name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate OUR icon + splash (replaces the default icon)
        run: npx capacitor-assets generate --android

      - name: Brand colors, version numbers
        run: |
          COL=android/app/src/main/res/values/colors.xml
          if [ -f "$COL" ]; then
            sed -i 's|<color name="colorPrimary">[^<]*</color>|<color name="colorPrimary">#2F43D6</color>|; s|<color name="colorPrimaryDark">[^<]*</color>|<color name="colorPrimaryDark">#2F43D6</color>|' "$COL"
          fi
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kohaily-Crisis-Management-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release APK (only if secrets exist)
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          $BT/zipalign -p -f 4 $UNSIGNED aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out Kohaily-Crisis-Management.apk aligned.apk
          rm -f release.keystore

      - name: Upload release APK
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: Kohaily-Crisis-Management-release
          path: android/Kohaily-Crisis-Management.apk

      - name: Publish GitHub Release (on v* tag)
        if: env.KEYSTORE_B64 != '' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/Kohaily-Crisis-Management.apk
